<style>

/* =========================
   기본 초기화
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #f3f6fa;
}

body {
    margin: 0;
    padding: 0;

    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    background: #f3f6fa;
    color: #172033;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* =========================
   전체 페이지
========================= */

.page {
    width: 100%;

    min-height: 100vh;
    min-height: 100dvh;

    padding-top:
        max(28px, env(safe-area-inset-top));

    padding-right:
        max(16px, env(safe-area-inset-right));

    padding-bottom:
        max(32px, env(safe-area-inset-bottom));

    padding-left:
        max(16px, env(safe-area-inset-left));
}


/* =========================
   가운데 영역
========================= */

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}


/* =========================
   제목
========================= */

.header {
    padding: 8px 4px 20px;
}

.title {
    margin: 0;

    font-size: 25px;
    font-weight: 800;

    letter-spacing: -1.3px;
    line-height: 1.15;

    color: #102a43;
}


/* =========================
   메인 게시판
========================= */

.main-link {
    display: flex;

    align-items: center;
    justify-content: space-between;

    width: 100%;
    min-height: 108px;

    padding: 22px 24px;

    background:
        linear-gradient(
            135deg,
            #1976d2 0%,
            #0757b5 100%
        );

    color: #ffffff;

    text-decoration: none;

    border-radius: 24px;

    box-shadow:
        0 10px 28px rgba(7, 87, 181, 0.25);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;

    -webkit-user-select: none;
    user-select: none;
}

.main-content {
    display: flex;

    align-items: center;

    gap: 16px;

    min-width: 0;
}

.main-icon {
    width: 54px;
    height: 54px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background: rgba(255,255,255,0.17);

    font-size: 27px;
}

.main-title {
    font-size: 25px;
    font-weight: 800;

    letter-spacing: -0.7px;
}

.arrow {
    flex: 0 0 auto;

    font-size: 30px;
    font-weight: 300;

    opacity: 0.9;
}


/* =========================
   버튼 영역
========================= */

.buttons {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

    margin-top: 16px;
}


/* =========================
   일반 버튼
========================= */

.button {
    display: flex;

    align-items: center;
    justify-content: space-between;

    min-height: 92px;

    padding: 17px;

    text-decoration: none;

    color: #172033;

    background: #ffffff;

    border: 1px solid #d9e2ec;

    border-radius: 20px;

    box-shadow:
        0 3px 12px rgba(16, 42, 67, 0.07);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;

    -webkit-user-select: none;
    user-select: none;
}

.button-left {
    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;
}

.icon {
    flex: 0 0 auto;

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    font-size: 21px;

    background: #e7f0ff;
}


/* =========================
   아이콘 배경
========================= */

.purple .icon {
    background: #e5efff;
}

.blue .icon {
    background: #e1ecff;
}

.gray .icon {
    background: #e8eef5;
}

.orange .icon {
    background: #e5efff;
}

.green .icon {
    background: #e3edff;
}


/* =========================
   버튼 글자
========================= */

.button-text {
    font-size: 19px;
    font-weight: 750;

    letter-spacing: -0.5px;

    white-space: nowrap;
}

.button-arrow {
    flex: 0 0 auto;

    font-size: 21px;

    color: #9db2c8;

    margin-left: 5px;
}


/* =========================
   관리자 버튼
========================= */

.admin-button {
    grid-column: 1 / -1;

    min-height: 76px;

    background:
        linear-gradient(
            135deg,
            #123f70 0%,
            #082b50 100%
        );

    color: #ffffff;

    border: none;

    box-shadow:
        0 7px 20px rgba(8, 43, 80, 0.20);

    cursor: pointer;
}

.admin-button .icon {
    background: rgba(255,255,255,0.13);
}

.admin-button .button-arrow {
    color: #a9c0d8;
}


/* =========================
   터치 효과
========================= */

.button:active,
.main-link:active {
    transform: scale(0.97);
}

.button:hover {
    box-shadow:
        0 6px 18px rgba(16, 42, 67, 0.11);
}

.main-link:hover {
    box-shadow:
        0 12px 32px rgba(7, 87, 181, 0.30);
}


/* =========================
   작은 휴대폰
========================= */

@media (max-width: 430px) {

    .page {
        padding-top:
            max(20px, env(safe-area-inset-top));

        padding-left:
            max(13px, env(safe-area-inset-left));

        padding-right:
            max(13px, env(safe-area-inset-right));
    }

    .header {
        padding-bottom: 17px;
    }

    .title {
        font-size: 22px;
    }

    .main-link {
        min-height: 100px;

        padding: 19px;

        border-radius: 21px;
    }

    .main-icon {
        width: 48px;
        height: 48px;

        border-radius: 15px;

        font-size: 24px;
    }

    .main-title {
        font-size: 22px;
    }

    .buttons {
        gap: 9px;

        margin-top: 13px;
    }

    .button {
        min-height: 84px;

        padding: 13px 12px;

        border-radius: 17px;
    }

    .button-left {
        gap: 9px;
    }

    .icon {
        width: 36px;
        height: 36px;

        border-radius: 11px;

        font-size: 18px;
    }

    .button-text {
        font-size: 17px;
    }

    .button-arrow {
        font-size: 18px;
    }

    .admin-button {
        min-height: 68px;
    }
}


/* =========================
   아주 작은 화면
========================= */

@media (max-width: 360px) {

    .title {
        font-size: 20px;
    }

    .main-title {
        font-size: 20px;
    }

    .button {
        min-height: 80px;
    }

    .button-text {
        font-size: 15px;
    }

    .icon {
        width: 33px;
        height: 33px;

        font-size: 16px;
    }
}


/* =========================
   가로 화면 방지 보정
========================= */

@media (orientation: landscape) and (max-height: 500px) {

    .page {
        padding-top: 18px;
        padding-bottom: 18px;
    }

    .header {
        padding-bottom: 12px;
    }

    .title {
        font-size: 27px;
    }

    .main-link {
        min-height: 78px;
    }

    .button {
        min-height: 70px;
    }
}


/* ==================================================
   관리자 비밀번호 팝업
================================================== */

.password-overlay {

    display: none;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 9999;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(8, 24, 42, 0.58);

    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
}

.password-overlay.show {
    display: flex;
}


.password-box {

    width: 100%;
    max-width: 360px;

    padding: 27px 23px 22px;

    background: #ffffff;

    border-radius: 25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.25);

    animation:
        passwordPopup 0.18s ease-out;
}

@keyframes passwordPopup {

    from {
        opacity: 0;
        transform: scale(0.94) translateY(10px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}


.password-icon {

    width: 54px;
    height: 54px;

    margin: 0 auto 14px;

    display: flex;

    align-items: center;
    justify-content: center;

.password-title {

    font-weight: 800;

    color: #102a43;
}


.password-description {

    margin: 8px 0 19px;

    text-align: center;

    font-size: 14px;

    color: #718096;

    line-height: 1.5;
}


.password-input {

    width: 100%;

    height: 50px;

    padding: 0 15px;

    border: 1px solid #d5dfeb;

    border-radius: 14px;

    background: #f7f9fc;

    outline: none;

    font-size: 18px;

    color: #172033;

    text-align: center;

    letter-spacing: 3px;

    transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
}

.password-input:focus {

    border-color: #1976d2;

    box-shadow:
        0 0 0 3px rgba(25,118,210,0.12);

    background: #ffffff;

.remember-row {

    color: #52657a;

    cursor: pointer;

.remember-row input {

    accent-color: #1976d2;

    cursor: pointer;
}


.password-buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;
}


.password-btn {

    height: 47px;

    border: none;

    border-radius: 13px;

    font-weight: 700;

.password-cancel {

    background: #edf2f7;

.password-confirm {

    color: #ffffff;
}


.password-error {

    min-height: 20px;

    margin-top: 9px;

    text-align: center;

    font-size: 13px;

    color: #d32f2f;
}

</style>

<script>

/* ==================================================
   관리자 설정
================================================== */

/*
   ★★★ 관리자 비밀번호 ★★★

   현재 비밀번호: 1234

   원하는 비밀번호로 변경하세요.

   예:
   const ADMIN_PASSWORD = "5678";
*/

const ADMIN_PASSWORD = "1234";


/*
   관리자 Google Sheets 주소
*/

const ADMIN_URL =
    "https://docs.google.com/spreadsheets/d/1eQHscrZpAWzrOo6QJw3pmyoeUijUoTKyfMmmPRPqkaU/edit?gid=1237649201#gid=1237649201";


/*
   비밀번호 기억용 저장 이름

   이 이름은 변경하지 않아도 됩니다.
*/

const PASSWORD_STORAGE_KEY =
    "bukbu_admin_password_saved";


/* ==================================================
   요소 가져오기
================================================== */

const adminButton =
    document.getElementById("adminButton");

const passwordOverlay =
    document.getElementById("passwordOverlay");

const passwordInput =
    document.getElementById("passwordInput");

const passwordConfirm =
    document.getElementById("passwordConfirm");

const passwordCancel =
    document.getElementById("passwordCancel");

const rememberPassword =
    document.getElementById("rememberPassword");

const passwordError =
    document.getElementById("passwordError");


/* ==================================================
   저장된 비밀번호 확인
================================================== */

function isPasswordSaved() {

    try {

        return localStorage.getItem(
            PASSWORD_STORAGE_KEY
        ) === "true";

    } catch (error) {

        return false;

    }

}


/* ==================================================
   관리자 페이지 열기
================================================== */

function openAdminPage() {

    window.location.href = ADMIN_URL;

}


/* ==================================================
   비밀번호 창 열기
================================================== */

function openPasswordBox() {

    passwordError.textContent = "";

    passwordInput.value = "";

    rememberPassword.checked =
        isPasswordSaved();

    passwordOverlay.classList.add("show");

    setTimeout(function() {

        passwordInput.focus();

    }, 100);

}


/* ==================================================
   비밀번호 창 닫기
================================================== */

function closePasswordBox() {

    passwordOverlay.classList.remove("show");

    passwordInput.value = "";

    passwordError.textContent = "";

}


/* ==================================================
   비밀번호 확인
================================================== */

function checkPassword() {

    const enteredPassword =
        passwordInput.value.trim();


    /* 비밀번호가 비어있는 경우 */

    if (!enteredPassword) {

        passwordError.textContent =
            "비밀번호를 입력해 주세요.";

        passwordInput.focus();

        return;

    }


    /* 비밀번호가 맞는 경우 */

    if (enteredPassword === ADMIN_PASSWORD) {


        /*
           '이 기기에서 기억하기'를 선택한 경우
        */

        if (rememberPassword.checked) {

            try {

                localStorage.setItem(
                    PASSWORD_STORAGE_KEY,
                    "true"
                );

            } catch (error) {

                console.log(
                    "비밀번호 저장 실패:",
                    error
                );

            }

        }


        /*
           체크하지 않았다면
           기존 저장값을 삭제
        */

        else {

            try {

                localStorage.removeItem(
                    PASSWORD_STORAGE_KEY
                );

            } catch (error) {

                console.log(
                    "저장된 비밀번호 삭제 실패:",
                    error
                );

            }

        }


        closePasswordBox();

        openAdminPage();

        return;

    }


    /* 비밀번호가 틀린 경우 */

    passwordError.textContent =
        "비밀번호가 올바르지 않습니다.";

    passwordInput.value = "";

    passwordInput.focus();

}


/* ==================================================
   관리자 버튼 클릭
================================================== */

adminButton.addEventListener(
    "click",
    function() {


        /*
           이미 이 기기에서 기억된 경우

           비밀번호 입력 없이 바로 이동
        */

        if (isPasswordSaved()) {

            openAdminPage();

            return;

        }


        /*
           기억되지 않은 경우
           비밀번호 입력창 표시
        */

        openPasswordBox();

    }
);


/* ==================================================
   확인 버튼
================================================== */

passwordConfirm.addEventListener(
    "click",
    checkPassword
);


/* ==================================================
   취소 버튼
================================================== */

passwordCancel.addEventListener(
    "click",
    closePasswordBox
);


/* ==================================================
   Enter 키로 확인
================================================== */

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            checkPassword();

        }

    }
);


/* ==================================================
   팝업 바깥쪽 클릭 시 닫기
================================================== */

passwordOverlay.addEventListener(
    "click",
    function(event) {

        if (
            event.target === passwordOverlay
        ) {

            closePasswordBox();

        }

    }
);


/* ==================================================
   ESC 키로 닫기
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            passwordOverlay.classList.contains("show")
        ) {

            closePasswordBox();

        }

    }
);


/* ==================================================
   Service Worker 등록
   Android PWA / 오프라인
================================================== */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("./sw.js")
                .then(
                    function(registration) {

                        console.log(
                            "Service Worker 등록 완료:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    function(error) {

                        console.log(
                            "Service Worker 등록 실패:",
                            error
                        );

                    }
                );

        }
    );

}


/* ==================================================
   뒤로가기 시 화면 보정
================================================== */

window.addEventListener(
    "pageshow",
    function(event) {

        if (event.persisted) {

            window.scrollTo(0, 0);

        }

    }
);

</script>
