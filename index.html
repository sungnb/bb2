<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover">

<meta name="theme-color" content="#1976d2">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
   content="default">

<meta name="apple-mobile-web-app-title"
   content="북부전자카드">

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icon-192.png">

<link rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icon-512.png">

<link rel="apple-touch-icon"
      sizes="192x192"
      href="./icon-192.png">

<title>서울 북부 회중</title>

<style>

/* ==================================================
   기본
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #f3f6fa;
}

body {
    margin: 0;
    padding: 0;

    min-height: 100vh;
    min-height: 100dvh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    background: #f3f6fa;
    color: #172033;

    -webkit-font-smoothing: antialiased;
}


/* ==================================================
   메인 페이지
================================================== */

.page {
    display: none;

    width: 100%;

    min-height: 100vh;
    min-height: 100dvh;

    padding-top:
        max(28px, env(safe-area-inset-top));

    padding-right:
        max(16px, env(safe-area-inset-right));

    padding-bottom:
        max(32px, env(safe-area-inset-bottom));

    padding-left:
        max(16px, env(safe-area-inset-left));
}

body.unlocked .page {
    display: block;
}


/* ==================================================
   가운데 영역
================================================== */

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}


/* ==================================================
   제목
================================================== */

.header {
    padding: 8px 4px 20px;
}

.title {
    margin: 0;

    font-size: calc(25px * var(--font-scale, 1));
    font-weight: 800;

    letter-spacing: -1.3px;
    line-height: 1.15;

    color: #102a43;

    transition: font-size 0.15s ease;
}


/* ==================================================
   메인 게시판
================================================== */

.main-link {
    display: flex;

    align-items: center;
    justify-content: space-between;

    width: 100%;
    min-height: 108px;

    padding: 22px 24px;

    background:
        linear-gradient(
            135deg,
            #1976d2 0%,
            #0757b5 100%
        );

    color: #ffffff;

    text-decoration: none;

    border-radius: 24px;

    box-shadow:
        0 10px 28px rgba(7, 87, 181, 0.25);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}

.main-content {
    display: flex;

    align-items: center;

    gap: 16px;

    min-width: 0;
}

.main-icon {
    width: 54px;
    height: 54px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background: rgba(255,255,255,0.17);

    font-size: 27px;
}

.main-title {
    font-size: calc(25px * var(--font-scale, 1));
    font-weight: 800;

    letter-spacing: -0.7px;

    transition: font-size 0.15s ease;
}

.arrow {
    flex: 0 0 auto;

    font-size: 30px;
    font-weight: 300;

    opacity: 0.9;
}


/* ==================================================
   버튼 영역
================================================== */

.buttons {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

    margin-top: 16px;
}


/* ==================================================
   일반 버튼
================================================== */

.button {
    display: flex;

    align-items: center;
    justify-content: space-between;

    min-height: 92px;

    padding: 17px;

    text-decoration: none;

    color: #172033;

    background: #ffffff;

    border: 1px solid #d9e2ec;

    border-radius: 20px;

    box-shadow:
        0 3px 12px rgba(16, 42, 67, 0.07);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;

    -webkit-user-select: none;
    user-select: none;

    cursor: pointer;
}

.button-left {
    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;
}

.icon {
    flex: 0 0 auto;

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    font-size: 21px;

    background: #e7f0ff;
}

.button-text {
    font-size: calc(19px * var(--font-scale, 1));
    font-weight: 750;

    letter-spacing: -0.5px;

    white-space: nowrap;

    transition: font-size 0.15s ease;
}

.button-arrow {
    flex: 0 0 auto;

    font-size: 21px;

    color: #9db2c8;

    margin-left: 5px;
}


/* ==================================================
   관리자 버튼
================================================== */

.admin-button {
    grid-column: 1 / -1;

    min-height: 76px;

    background:
        linear-gradient(
            135deg,
            #123f70 0%,
            #082b50 100%
        );

    color: #ffffff;

    border: none;

    box-shadow:
        0 7px 20px rgba(8, 43, 80, 0.20);
}

.admin-button .icon {
    background: rgba(255,255,255,0.13);
}

.admin-button .button-arrow {
    color: #a9c0d8;
}


/* ==================================================
   터치 효과
================================================== */

.button:active,
.main-link:active {
    transform: scale(0.97);
}

.button:hover {
    box-shadow:
        0 6px 18px rgba(16, 42, 67, 0.11);
}

.main-link:hover {
    box-shadow:
        0 12px 32px rgba(7, 87, 181, 0.30);
}


/* ==================================================
   휴대폰
================================================== */

@media (max-width: 430px) {

    .page {
        padding-top:
            max(20px, env(safe-area-inset-top));

        padding-left:
            max(13px, env(safe-area-inset-left));

        padding-right:
            max(13px, env(safe-area-inset-right));
    }

    .header {
        padding-bottom: 17px;
    }

    .title {
        font-size: calc(22px * var(--font-scale, 1));
    }

    .main-link {
        min-height: 100px;

        padding: 19px;

        border-radius: 21px;
    }

    .main-icon {
        width: 48px;
        height: 48px;

        border-radius: 15px;

        font-size: 24px;
    }

    .main-title {
        font-size: calc(22px * var(--font-scale, 1));
    }

    .buttons {
        gap: 9px;

        margin-top: 13px;
    }

    .button {
        min-height: 84px;

        padding: 13px 12px;

        border-radius: 17px;
    }

    .button-left {
        gap: 9px;
    }

    .icon {
        width: 36px;
        height: 36px;

        border-radius: 11px;

        font-size: 18px;
    }

    .button-text {
        font-size: calc(17px * var(--font-scale, 1));
    }

    .button-arrow {
        font-size: 18px;
    }

    .admin-button {
        min-height: 68px;
    }
}


/* ==================================================
   아주 작은 화면
================================================== */

@media (max-width: 360px) {

    .title {
        font-size: calc(20px * var(--font-scale, 1));
    }

    .main-title {
        font-size: calc(20px * var(--font-scale, 1));
    }

    .button {
        min-height: 80px;
    }

    .button-text {
        font-size: calc(15px * var(--font-scale, 1));
    }

    .icon {
        width: 33px;
        height: 33px;

        font-size: 16px;
    }
}


/* ==================================================
   비밀번호 잠금 화면
================================================== */

.password-overlay {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 99999;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #102a43 0%,
            #0b3b68 100%
        );

    opacity: 1;

    visibility: visible;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
}

.password-overlay.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* ==================================================
   비밀번호 박스
================================================== */

.password-box {

    width: 100%;
    max-width: 360px;

    padding: 30px 24px 23px;

    background: #ffffff;

    border-radius: 26px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.30);

    text-align: center;

    animation:
        passwordPopup 0.22s ease-out;
}

@keyframes passwordPopup {

    from {
        opacity: 0;
        transform: scale(0.94) translateY(12px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}


/* ==================================================
   잠금 아이콘
================================================== */

.password-icon {

    width: 62px;
    height: 62px;

    margin: 0 auto 16px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 19px;

    background: #e8f1ff;

    font-size: 29px;
}


/* ==================================================
   제목
================================================== */

.password-title {

    margin: 0;

    font-size: 22px;
    font-weight: 800;

    letter-spacing: -0.5px;

    color: #102a43;
}


/* ==================================================
   설명
================================================== */

.password-description {

    margin: 9px 0 20px;

    font-size: 14px;

    line-height: 1.6;

    color: #718096;
}


/* ==================================================
   비밀번호 입력
================================================== */

.password-input {

    width: 100%;

    height: 52px;

    padding: 0 16px;

    border: 1px solid #d5dfeb;

    border-radius: 14px;

    outline: none;

    background: #f7f9fc;

    color: #172033;

    font-size: 19px;

    text-align: center;

    letter-spacing: 4px;

    transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
}

.password-input:focus {

    border-color: #1976d2;

    background: #ffffff;

    box-shadow:
        0 0 0 3px rgba(25,118,210,0.12);
}


/* ==================================================
   기억하기
================================================== */

.remember-row {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    margin: 15px 0 19px;

    font-size: 14px;

    color: #52657a;

    cursor: pointer;
}

.remember-row input {

    width: 18px;
    height: 18px;

    margin: 0;

    accent-color: #1976d2;

    cursor: pointer;
}


/* ==================================================
   확인 버튼
================================================== */

.password-confirm {

    width: 100%;

    height: 49px;

    border: none;

    border-radius: 14px;

    background: #1976d2;

    color: #ffffff;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 6px 16px rgba(25,118,210,0.22);

    transition:
        transform 0.1s ease;
}

.password-confirm:active {

    transform: scale(0.97);
}


/* ==================================================
   비밀번호 취소
================================================== */

.password-cancel {

    width: 100%;

    height: 42px;

    margin-top: 8px;

    border: none;

    background: transparent;

    color: #718096;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    border-radius: 12px;

    transition:
        background 0.1s ease,
        color 0.1s ease;
}

.password-cancel:active {

    background: #f1f4f8;

    color: #52657a;
}


/* ==================================================
   오류 메시지
================================================== */

.password-error {

    min-height: 21px;

    margin-top: 10px;

    font-size: 13px;

    color: #d32f2f;
}


/* ==================================================
   관리자 비밀번호 창
================================================== */

.admin-password-overlay {

    position: fixed;

    inset: 0;

    z-index: 100000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(10,31,52,.72);

    backdrop-filter: blur(5px);
}

.admin-password-overlay.show {
    display: flex;
}


/* ==================================================
   메인 페이지 나타남
================================================== */

body.unlocked .page {

    animation:
        pageAppear 0.25s ease-out;
}

@keyframes pageAppear {

    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* 관리자 선택 화면 */
.admin-choice-overlay{
    position:fixed;
    inset:0;
    z-index:100001;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(10,31,52,.72);
    backdrop-filter:blur(5px)
}

.admin-choice-overlay.show{
    display:flex
}

.admin-choice-box{
    width:min(420px,100%);
    background:#fff;
    border-radius:22px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.22)
}

.admin-choice-title{
    margin:0 0 18px;
    text-align:center;
    color:#17324d;
    font-size:calc(23px * var(--font-scale, 1));
    font-weight:800
}

.admin-choice-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:58px;
    margin-top:10px;
    padding:0 16px;
    border-radius:14px;
    background:#eaf2ff;
    color:#172033;
    text-decoration:none;
    font-size:calc(17px * var(--font-scale, 1));
    font-weight:800;
    border:1px solid #d8e4f2;
    box-sizing:border-box
}

.admin-choice-link:active{
    transform:scale(.99)
}

.admin-choice-link .choice-arrow{
    font-size:25px;
    color:#6f88a3
}

.admin-choice-cancel{
    width:100%;
    min-height:48px;
    margin-top:14px;
    border:0;
    border-radius:14px;
    background:#f1f3f5;
    color:#172033;
    font-size:calc(16px * var(--font-scale, 1));
    font-weight:700;
    cursor:pointer
}


/* ==================================================
   화면 테마 설정
   - 오른쪽 상단 ⚙️ 버튼
   - 화면 배경만 변경
   - 기존 메뉴/자료 카드 색상은 그대로 유지
================================================== */

.settings-wrap{
    position:fixed;
    top:max(12px, env(safe-area-inset-top));
    right:max(14px, env(safe-area-inset-right));
    z-index:9000;
}

.settings-button{
    width:42px;
    height:42px;
    border:1px solid rgba(157,178,200,.35);
    border-radius:14px;
    background:rgba(255,255,255,.88);
    color:#52657a;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(16,42,67,.10);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.settings-button:active{
    transform:scale(.94);
}

.settings-menu{
    display:none;
    position:absolute;
    top:49px;
    right:0;
    width:190px;
    padding:7px;
    background:#fff;
    border:1px solid #d9e2ec;
    border-radius:16px;
    box-shadow:0 12px 30px rgba(16,42,67,.16);
}

.settings-menu.show{
    display:block;
}

.theme-option,
.font-size-option{
    width:100%;
    min-height:42px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#172033;
    font-size:15px;
    font-weight:700;
    text-align:left;
    padding:0 12px;
    cursor:pointer;
}

.theme-option:active,
.font-size-option:active{
    background:#eef3f8;
}

.font-size-option{
    display:flex;
    align-items:center;
    gap:9px;
}

.font-size-icon{
    flex:0 0 auto;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:#e7f0ff;
    color:#172033;
    font-size:18px;
    font-weight:800;
}


/* ==================================================
   글자 크기 조절
   - 슬라이더 대신
     ‹  현재크기  › 방식
   - 5% 단위
================================================== */

.font-size-panel{
    display:none;
    padding:5px 7px 9px;
}

.font-size-panel.show{
    display:block;
}

.font-size-control{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.font-size-arrow{
    flex:0 0 auto;

    width:38px;
    height:38px;

    border:0;
    border-radius:11px;

    background:#eef3f8;
    color:#172033;

    font-size:24px;
    font-weight:700;

    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        transform 0.1s ease,
        background 0.1s ease;
}

.font-size-arrow:active{
    transform:scale(.92);
    background:#dfe7ef;
}

.font-size-current{
    flex:1;

    min-width:0;

    text-align:center;

    font-size:16px;
    font-weight:800;

    color:#172033;
}


/* ==================================================
   어두운 화면
================================================== */

body.dark-theme,
html.dark-theme{
    background:#18212b;
}

body.dark-theme{
    color:#172033;
}


/* 어두운 화면에서 상단 회중 제목은 흰색 */

body.dark-theme .title{
    color:#ffffff;
}


/* 설정 버튼/메뉴는 어두운 배경에서 읽기 좋게 */

body.dark-theme .settings-button{
    background:rgba(38,49,61,.94);
    color:#e9eef3;
    border-color:rgba(255,255,255,.12);
}

body.dark-theme .settings-menu{
    background:#26313d;
    border-color:#3b4856;
}

body.dark-theme .theme-option,
body.dark-theme .font-size-option{
    color:#f0f3f6;
}

body.dark-theme .theme-option:active,
body.dark-theme .font-size-option:active{
    background:#334150;
}

body.dark-theme .font-size-icon{
    background:#334150;
    color:#f0f3f6;
}


/* 어두운 화면에서 글자 크기 현재값은 흰색 */

body.dark-theme .font-size-current{
    color:#ffffff;
}


/* 어두운 화면에서 ‹ › 버튼 */

body.dark-theme .font-size-arrow{
    background:#334150;
    color:#f0f3f6;
}

body.dark-theme .font-size-arrow:active{
    background:#405061;
}


/* ==================================================
   ★ 추가된 부분
   어두운 화면에서 전시대 관리자 선택 화면도
   어둡게 표시
================================================== */

body.dark-theme .admin-choice-overlay{
    background:rgba(5,15,25,.86);
}

body.dark-theme .admin-choice-box{
    background:#26313d;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

body.dark-theme .admin-choice-title{
    color:#ffffff;
}

body.dark-theme .admin-choice-link{
    background:#334150;
    color:#f0f3f6;
    border-color:#465564;
}

body.dark-theme .admin-choice-link .choice-arrow{
    color:#b9c8d6;
}

body.dark-theme .admin-choice-cancel{
    background:#3a4653;
    color:#f0f3f6;
}

body.dark-theme .admin-choice-link:active{
    background:#405061;
}

body.dark-theme .admin-choice-cancel:active{
    background:#465463;
}

</style>

</head>

<body>

<!-- ==================================================
     화면 설정
     화면 배경만 밝게/어둡게 변경
================================================== -->

<div class="settings-wrap" id="settingsWrap">

    <button
        type="button"
        class="settings-button"
        id="settingsButton"
        aria-label="화면 설정"
        aria-expanded="false">⚙️</button>

    <div class="settings-menu" id="settingsMenu">

        <button
            type="button"
            class="theme-option"
            id="lightThemeButton">
            ☀️ 밝게
        </button>

        <button
            type="button"
            class="theme-option"
            id="darkThemeButton">
            🌙 어둡게
        </button>


        <button
            type="button"
            class="font-size-option"
            id="fontSizeButton"
            aria-expanded="false">

            <span class="font-size-icon">A</span>

            <span>글자 크기</span>

        </button>


        <div
            class="font-size-panel"
            id="fontSizePanel">

            <div class="font-size-control">

                <button
                    type="button"
                    class="font-size-arrow"
                    id="fontSizeDecrease"
                    aria-label="글자 크기 5% 줄이기">
                    ‹
                </button>

                <span
                    class="font-size-current"
                    id="fontSizeValue">
                    100%
                </span>

                <button
                    type="button"
                    class="font-size-arrow"
                    id="fontSizeIncrease"
                    aria-label="글자 크기 5% 늘리기">

<script>


/* ==================================================
   화면 테마 설정
================================================== */

const THEME_KEY = "bukbu_theme";
const FONT_SIZE_KEY = "bukbu_font_size";

const settingsButton =
    document.getElementById("settingsButton");

const settingsMenu =
    document.getElementById("settingsMenu");

const settingsWrap =
    document.getElementById("settingsWrap");

const lightThemeButton =
    document.getElementById("lightThemeButton");

const darkThemeButton =
    document.getElementById("darkThemeButton");

const fontSizeButton =
    document.getElementById("fontSizeButton");

const fontSizePanel =
    document.getElementById("fontSizePanel");

const fontSizeDecrease =
    document.getElementById("fontSizeDecrease");

const fontSizeIncrease =
    document.getElementById("fontSizeIncrease");

const fontSizeValue =
    document.getElementById("fontSizeValue");


function applyTheme(theme) {

    const isDark =
        theme === "dark";

    document.body.classList.toggle(
        "dark-theme",
        isDark
    );

    document.documentElement.classList.toggle(
        "dark-theme",
        isDark
    );

    try {

        localStorage.setItem(
            THEME_KEY,
            isDark ? "dark" : "light"
        );

    } catch (error) {}

    settingsMenu.classList.remove("show");

    fontSizePanel.classList.remove("show");

    settingsButton.setAttribute(
        "aria-expanded",
        "false"
    );

    fontSizeButton.setAttribute(
        "aria-expanded",
        "false"
    );
}


function loadTheme() {

    let theme = "light";

    try {

        theme =
            localStorage.getItem(
                THEME_KEY
            ) || "light";

    } catch (error) {}

    if (theme !== "dark") {

        theme = "light";

    }

    document.body.classList.toggle(
        "dark-theme",
        theme === "dark"
    );

    document.documentElement.classList.toggle(
        "dark-theme",
        theme === "dark"
    );
}


/* ==================================================
   글자 크기
   80% ~ 150%
   5% 단위
   ★ 설정 표시값보다 실제 글자를 20% 크게 적용
================================================== */

function applyFontSize(
    value,
    save = true
) {

    let size =
        Number(value);

    if (!Number.isFinite(size)) {

        size = 1;

    }

    size =
        Math.min(
            1.50,
            Math.max(
                0.80,
                size
            )
        );

    /*
       5% 단위로 정확하게 맞춤
    */

    size =
        Math.round(
            size * 20
        ) / 20;


    /*
       설정값을 기준으로 실제 화면 글자는
       항상 20% 크게 적용합니다.

       설정 100% → 실제 120%
       설정 120% → 실제 144%
    */

    const actualSize =
        size * 1.20;


    document.documentElement.style.setProperty(
        "--font-scale",
        actualSize
    );


    /*
       설정 화면에는 실제 확대값이 아니라
       사용자가 선택한 설정값을 표시합니다.
    */

    fontSizeValue.textContent =
        Math.round(
            size * 100
        ) + "%";


    if (save) {

        try {

            localStorage.setItem(
                FONT_SIZE_KEY,
                String(size)
            );

        } catch (error) {}

    }

}


function loadFontSize() {

    let fontSize = 1;

    try {

        const savedSize =
            localStorage.getItem(
                FONT_SIZE_KEY
            );

        if (
            savedSize !== null
        ) {

            fontSize =
                Number(savedSize);

        }

    } catch (error) {}


    applyFontSize(
        fontSize,
        false
    );

}


/* ==================================================
   설정 버튼
================================================== */

settingsButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const open =
            settingsMenu.classList.toggle(
                "show"
            );

        settingsButton.setAttribute(
            "aria-expanded",
            open ? "true" : "false"
        );

        if (!open) {

            fontSizePanel.classList.remove(
                "show"
            );

            fontSizeButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


/* ==================================================
   밝게
================================================== */

lightThemeButton.addEventListener(
    "click",
    function() {

        applyTheme("light");

    }
);


/* ==================================================
   어둡게
================================================== */

darkThemeButton.addEventListener(
    "click",
    function() {

        applyTheme("dark");

    }
);


/* ==================================================
   글자 크기 열기/닫기
================================================== */

fontSizeButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const open =
            fontSizePanel.classList.toggle(
                "show"
            );

        fontSizeButton.setAttribute(
            "aria-expanded",
            open ? "true" : "false"
        );

    }
);


/* ==================================================
   글자 크기 5% 감소
================================================== */

fontSizeDecrease.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        let current =
            Number(
                localStorage.getItem(
                    FONT_SIZE_KEY
                )
            );


        if (!Number.isFinite(current)) {

            current = 1;

        }


        applyFontSize(
            current - 0.05
        );

    }
);


/* ==================================================
   글자 크기 5% 증가
================================================== */

fontSizeIncrease.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        let current =
            Number(
                localStorage.getItem(
                    FONT_SIZE_KEY
                )
            );


        if (!Number.isFinite(current)) {

            current = 1;

        }


        applyFontSize(
            current + 0.05
        );

    }
);


/* ==================================================
   설정 바깥쪽 클릭
================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !settingsWrap.contains(
                event.target
            )
        ) {

            settingsMenu.classList.remove(
                "show"
            );

            fontSizePanel.classList.remove(

            settingsButton.setAttribute(
                "aria-expanded",

            );

            fontSizeButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);

================================================== */

function openGoogleSheet(
    event,
    url
) {

    if (event) {

        event.preventDefault();

    }

    if (!url) {

        return;

    }

    try {

        window.location.assign(
            url
        );

    } catch (error) {

        window.location.href =
            url;

    }

}

function checkLoginPassword() {

    const password =
        loginPassword.value.trim();


    if (!password) {

        loginError.textContent =
            "비밀번호를 입력해 주세요.";

        loginPassword.focus();

        return;

    }


    if (
        password !== PAGE_PASSWORD
    ) {

        loginError.textContent =
            "비밀번호가 올바르지 않습니다.";

        loginPassword.value = "";

        loginPassword.focus();

        return;

    }


    if (rememberLogin.checked) {

        try {

            localStorage.setItem(
                PAGE_REMEMBER_KEY,
                "yes"
            );

        } catch (error) {

            console.log(
                "비밀번호 저장 실패",
                error
            );

        }

    } else {

        try {

            localStorage.removeItem(
                PAGE_REMEMBER_KEY
            );

        } catch (error) {}

    }


    unlockPage();

}

        document.referrer;


    if (
        referrer &&
        referrer !== window.location.href
    ) {

        window.location.replace(
            referrer
        );

        return;

    }


    if (
        window.history.length > 1
    ) {

        window.history.back();

        return;

    }


    loginPassword.value = "";

    loginError.textContent = "";

}

);


/* ==================================================
   전시대 관리자 비밀번호 창
   ★ 비밀번호: 7979
================================================== */

function openAdminLogin() {

    if (
        adminRemembered()
    ) {

        adminOverlay.classList.remove(
            "show"
        );

        adminOverlay.setAttribute(
            "aria-hidden",
            "true"
        );

        adminChoiceOverlay.classList.add(
            "show"
        );

        adminChoiceOverlay.setAttribute(
            "aria-hidden",
            "false"
        );

        return;

    }


    adminPassword.value = "";

    adminError.textContent = "";

    rememberAdmin.checked = false;


    adminOverlay.classList.add(
        "show"
    );

    adminOverlay.setAttribute(
        "aria-hidden",
        "false"
    );


    setTimeout(
        function() {

            adminPassword.focus();

        },
        120
    );

}


/* ==================================================
   전시대 관리자 비밀번호 확인
================================================== */

function checkAdminPassword() {

    const password =
        adminPassword.value.trim();


    if (!password) {

        adminError.textContent =
            "관리자 비밀번호를 입력해 주세요.";

        adminPassword.focus();

        return;

    }


    if (
        password !== ADMIN_PASSWORD
    ) {

        adminError.textContent =
            "관리자 비밀번호가 올바르지 않습니다.";

        adminPassword.value = "";

        adminPassword.focus();

        return;

    }


    if (
        rememberAdmin.checked
    ) {

        try {

            localStorage.setItem(
                ADMIN_REMEMBER_KEY,
                "yes"
            );

        } catch (error) {

            console.log(
                "관리자 기억하기 저장 실패",
                error
            );

        }

    } else {

        try {

            localStorage.removeItem(
                ADMIN_REMEMBER_KEY
            );

        } catch (error) {}

    }


    adminOverlay.classList.remove(
        "show"
    );

    adminOverlay.setAttribute(
        "aria-hidden",
        "true"
    );


    adminChoiceOverlay.classList.add(
        "show"
    );

    adminChoiceOverlay.setAttribute(
        "aria-hidden",
        "false"
    );

}


/* ==================================================
   전시대 관리자 버튼
================================================== */

document.getElementById(
    "adminButton"
).addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        openAdminLogin();

    }
);


/* ==================================================
   관리자 확인 버튼
================================================== */

adminLoginButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        checkAdminPassword();

    }
);


/* ==================================================
   관리자 취소
================================================== */

function cancelAdminLogin() {

    adminOverlay.classList.remove(
        "show"
    );

    adminOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

    adminPassword.value = "";

    adminError.textContent = "";

}


adminCancelButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        cancelAdminLogin();

    }
);


function closeAdminChoice() {

    adminChoiceOverlay.classList.remove(
        "show"
    );

    adminChoiceOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

}


adminChoiceCancel.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        closeAdminChoice();

    }
);


/* ==================================================
   관리자 Enter 키
================================================== */

adminPassword.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            checkAdminPassword();

        }


        if (
            event.key === "Escape"
        ) {

            event.preventDefault();

            cancelAdminLogin();

        }

    }
);


/* ==================================================
   페이지 최초 실행
================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const userAgent =
            navigator.userAgent || "";


        const isKakaoTalk =
            /KAKAOTALK|KakaoTalk/i.test(
                userAgent
            );


        if (
            pageRemembered() &&
            !isKakaoTalk
        ) {

            unlockPage();

            return;

        }


        setTimeout(
            function() {

                loginPassword.focus();

            },
            250
        );

    }
);

   뒤로가기 / BFCache 대응
================================================== */

window.addEventListener(
    "pageshow",
    function(event) {

        if (
            event.persisted
        ) {

            window.scrollTo(
                0,
                0
            );

        }

    }
);

</script>
