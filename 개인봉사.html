<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#24145f">

<title>개인봉사</title>


<style>

/* =========================================================
   기본
   ========================================================= */

*{
  box-sizing:border-box;
}

:root{
  --s:1;
}

html{
  margin:0;
  padding:0;
}

body{

  margin:0;

  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #171329,
      #2d2352
    );

  color:#fff;

  font-size:
    calc(16px * var(--s));

  /*
   * 화면 아래 고정 버튼 높이만큼
   * 마지막 카드가 가려지지 않도록 여백 확보
   */
  padding-bottom:78px;
}


/* =========================================================
   버튼
   ========================================================= */

button{

  border:0;

  border-radius:9px;

  cursor:pointer;

}


/* =========================================================
   상단
   ========================================================= */

.header{

  position:relative;

  padding:18px 55px;

  text-align:center;

  background:
    rgba(18,12,45,.94);

  border-bottom:
    1px solid #ffffff18;

}


h1{

  margin:0;

  font-size:28px;

}


.sub{

  font-size:13px;

  opacity:.65;

  margin-top:4px;

}


/* =========================================================
   설정 버튼
   ========================================================= */

.settings{

  position:absolute;

  right:12px;

  top:12px;

  width:40px;

  height:40px;

  background:#ffffff18;

  color:#fff;

  font-size:20px;

}


/* =========================================================
   설정 패널
   ========================================================= */

.panel{

  display:none;

  position:absolute;

  z-index:20;

  right:12px;

  top:58px;

  width:220px;

  padding:15px;

  border-radius:14px;

  background:#17102df7;

  color:#fff;

  box-shadow:
    0 10px 30px #0006;

  text-align:left;

}


.panel.show{

  display:block;

}


.row{

  display:flex;

  gap:8px;

  margin:10px 0;

}


.row button{

  flex:1;

  padding:9px;

  background:#ffffff15;

  color:inherit;

}


.row button.active{

  background:#ffffff35;

}


.font{

  display:flex;

  gap:8px;

  align-items:center;

}


.font button{

  width:38px;

  height:34px;

  background:#ffffff15;

  color:inherit;

  font-size:18px;

}


.font span{

  flex:1;

  text-align:center;

}


/* =========================================================
   본문
   ========================================================= */

.wrap{

  max-width:720px;

  margin:auto;

  padding:
    12px 10px 20px;

}


/* =========================================================
   로딩
   ========================================================= */

.loading{

  text-align:center;

  padding:40px 10px;

  opacity:.7;

}


/* =========================================================
   오류
   ========================================================= */

.error{

  color:#ffb4b4;

}


/* =========================================================
   카드 전체
   ========================================================= */

.cards{

  display:flex;

  flex-direction:column;

  gap:12px;

}


.card{

  overflow:hidden;

  border:
    1px solid #ffffff25;

  border-radius:15px;

  background:#ffffff0d;

  box-shadow:
    0 8px 25px #0003;

}


/* =========================================================
   카드 상단
   ========================================================= */

.top{

  display:grid;

  grid-template-columns:
    105px 1fr;

  min-height:92px;

}


/* =========================================================
   번호
   ========================================================= */

.num{

  display:flex;

  align-items:center;

  justify-content:center;

  background:#deebd5;

  border-right:
    1px solid #0002;

}


.num a{

  font-size:
    calc(42px * var(--s));

  font-weight:900;

  color:#101ee6;

  text-decoration:underline;

  text-underline-offset:5px;

}


/* =========================================================
   구역 정보
   ========================================================= */

.info{

  padding:12px 14px;

  display:flex;

  flex-direction:column;

  justify-content:center;

}


.zone{

  font-size:
    calc(21px * var(--s));

  font-weight:800;

  line-height:1.2;

  word-break:keep-all;

}


.house{

  margin-top:6px;

  font-size:
    calc(18px * var(--s));

  font-weight:700;

  color:#d8e7ff;

}


/* =========================================================
   날짜
   ========================================================= */

.dates{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  border-top:
    1px solid #fff2;

  border-bottom:
    1px solid #fff2;

}


.datebox{

  padding:10px 12px;

}


.datebox + .datebox{

  border-left:
    1px solid #fff2;

}


.label{

  font-size:
    calc(12px * var(--s));

  opacity:.65;

  font-weight:700;

}


.date{

  margin-top:4px;

  font-size:
    calc(16px * var(--s));

  font-weight:800;

  white-space:nowrap;

}


.complete .date{

  color:#7580ff;

}


/* =========================================================
   임명
   ========================================================= */

.assign{

  display:flex;

  align-items:center;

  gap:9px;

  padding:11px 13px;

}


.alabel{

  font-size:
    calc(13px * var(--s));

  font-weight:800;

}


.weekday{

  font-size:
    calc(15px * var(--s));

  font-weight:800;

  color:#ff4b4b;

}


.name{

  font-size:
    calc(16px * var(--s));

  font-weight:800;

}


/* =========================================================
   안내문
   ========================================================= */

.note{

  margin-top:14px;

  padding:14px;

  border-radius:12px;

  text-align:center;

  background:#fff0db;

  color:#4b3b2c;

  font-weight:700;

}


.note b{

  color:#1235e8;

}


/* =========================================================
   ★ 하단 고정 버튼 4개
   ========================================================= */

.bottom-nav{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:100;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  height:64px;

  background:#30206f;

  box-shadow:
    0 -5px 20px rgba(0,0,0,.30);

  border-top:
    1px solid #ffffff25;

}


/* 버튼 */

.bottom-nav a{

  display:flex;

  align-items:center;

  justify-content:center;

  min-width:0;

  padding:8px 4px;

  color:#fff;

  text-decoration:none;

  font-size:
    calc(15px * var(--s));

  font-weight:800;

  text-align:center;

}


/* 버튼 사이 경계 */

.bottom-nav a + a{

  border-left:
    1px solid #ffffff25;

}


/* 버튼 터치 효과 */

.bottom-nav a:active{

  background:#ffffff18;

}


/* =========================================================
   밝은 화면
   ========================================================= */

body.light{

  background:
    linear-gradient(
      135deg,
      #f3f6fa,
      #fff
    );

  color:#222;

}


body.light .header{

  background:#fffffff0;

  border-color:#0001;

}


body.light .settings{

  background:#0000000d;

  color:#222;

}


body.light .panel{

  background:#fffffff8;

  color:#222;

  border:
    1px solid #0002;

}


body.light .row button,
body.light .font button{

  background:#0000000d;

  color:#222;

}


body.light .row button.active{

  background:#0000001f;

}


body.light .card{

  background:#ffffffe8;

  border-color:#0002;

  box-shadow:
    0 8px 25px #00000014;

}


body.light .zone{

  color:#222;

}


body.light .house{

  color:#3f4c5c;

}


body.light .dates{

  border-color:#0002;

}


body.light .datebox + .datebox{

  border-color:#0002;

}


body.light .bottom-nav{

  background:#30206f;

}


/* =========================================================
   모바일
   ========================================================= */

@media(max-width:480px){

  h1{

    font-size:25px;

  }


  .header{

    padding:
      16px 52px;

  }


  .top{

    grid-template-columns:
      92px 1fr;

  }


  .num a{

    font-size:
      calc(38px * var(--s));

  }


  .zone{

    font-size:
      calc(19px * var(--s));

  }


  .house{

    font-size:
      calc(17px * var(--s));

  }


  .date{

    font-size:
      calc(14px * var(--s));

  }


  .assign{

    gap:7px;

  }


  .bottom-nav{

    height:62px;

  }


  .bottom-nav a{

    font-size:
      calc(14px * var(--s));

  }

}


/* =========================================================
   아주 작은 화면
   ========================================================= */

@media(max-width:360px){

  .bottom-nav a{

    font-size:
      calc(13px * var(--s));

  }

}

</style>

</head>


<body>


<!-- =======================================================
     상단
     ======================================================= -->

<header class="header">

  <h1>
    📋 개인봉사
  </h1>

  <div class="sub">
    개인 구역 카드
  </div>


  <!-- 설정 -->

  <button
    class="settings"
    onclick="toggle()"
    aria-label="설정"
  >
    ⚙️
  </button>


  <!-- 설정 패널 -->

  <div
    id="panel"
    class="panel"
  >

    <b>
      설정
    </b>


    <div class="row">

      <button
        id="light"
        onclick="theme('light')"
      >
        ☀️ 밝게
      </button>


      <button
        id="dark"
        onclick="theme('dark')"
      >
        🌙 어둡게
      </button>

    </div>


    <div class="font">

      <button
        onclick="font(-5)"
      >
        −
      </button>


      <span id="fv">
        100%
      </span>


      <button
        onclick="font(5)"
      >
        ＋
      </button>

    </div>

  </div>

</header>


<!-- =======================================================
     본문
     ======================================================= -->

<main class="wrap">

  <div
    id="app"
    class="loading"
  >
    개인봉사 자료를 불러오는 중입니다...
  </div>

</main>


<!-- =======================================================
     ★ 화면 하단 고정 버튼 4개
     ======================================================= -->

<nav
  class="bottom-nav"
  aria-label="하단 메뉴"
>


  <!-- 1. 홈 -->

  <a
    href="index.html"
  >
    홈
  </a>


  <!-- 2. 새로고침 -->

  <a
    href="javascript:void(0)"
    onclick="load()"
  >
    새로고침
  </a>


  <!-- 3. JW.ORG -->

  <a
    href="https://www.jw.org/ko/"
    target="_blank"
    rel="noopener"
  >
    JW.ORG
  </a>


  <!-- 4. 라이브러리 -->

  <a
    href="https://wol.jw.org/ko/wol/h/r8/lp-ko"
    target="_blank"
    rel="noopener"
  >
    라이브러리
  </a>


</nav>


<script>


/* =========================================================
   Apps Script 주소
   ========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbzBidcJoF1DIUoyahm0uOJVRiNgwQuX--Uu5JRXyJmnTh5zoyjRjEouIecIVHyvGMP-E/exec";


/* =========================================================
   Google Sheet
   ========================================================= */

const SHEET_ID =
"1XGbksIQCRjagzCJLj-wHlBVfQf4JsMjk79ikxIMFI4o";


const GID =
"0";


const SHEET =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${GID}`;


/* =========================================================
   화면 요소
   ========================================================= */

const app =
document.getElementById("app");


const panel =
document.getElementById("panel");


const light =
document.getElementById("light");


const dark =
document.getElementById("dark");


const fv =
document.getElementById("fv");


/* =========================================================
   JSONP 관리
   ========================================================= */

let jsonpScript =
null;


let jsonpTimer =
null;


/* =========================================================
   HTML 특수문자 처리
   ========================================================= */

const esc = x =>

  String(x ?? "").replace(

    /[&<>'"]/g,

    c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"

    }[c])

  );


/* =========================================================
   날짜
   ========================================================= */

function date(v){

  if(!v){

    return "";

  }


  return String(v)

    .replace(/\s+/g," ")

    .trim();

}


/* =========================================================
   데이터 표시
   ========================================================= */

function render(result){


  /* Apps Script 오류 */

  if(
    !result ||
    result.success !== true
  ){

    showError(
      result?.message ||
      "자료를 가져오지 못했습니다."
    );

    return;

  }


  /* 데이터 */

  const data =
    Array.isArray(result.data)
      ? result.data
      : [];


  if(!data.length){

    app.className =
      "loading";

    app.innerHTML =
      "표시할 개인봉사 자료가 없습니다.";

    return;

  }


  app.className =
    "";


  let html =
    '<div class="cards">';


  /* =======================================================
     개인봉사 카드
     ======================================================= */

  data.forEach(function(x,index){


    /*
     * Apps Script가 전달하는 실제 시트 행 번호
     *
     * 135 → row 4
     * 136 → row 5
     * 301 → row 6
     *
     * 기존처럼 index + 4를 사용하지 않고
     * x.row를 사용합니다.
     */

    const sheetRow =
      Number(x.row);


    /*
     * 번호 클릭 시
     * 해당 번호가 있는 B열로 이동
     */

    const numberLink =
      sheetRow >= 1
        ? `${SHEET}#gid=${GID}&range=B${sheetRow}`
        : SHEET;


    html += `

      <article class="card">


        <!-- 카드 상단 -->

        <div class="top">


          <!-- 번호 -->

          <div class="num">

            <a
              href="${esc(numberLink)}"
              target="_blank"
              rel="noopener"
            >
              ${esc(x.number)}
            </a>

          </div>


          <!-- 구역 -->

          <div class="info">

            <div class="zone">
              ${esc(x.zone)}
            </div>


            <div class="house">
              ${esc(x.house)}호
            </div>

          </div>


        </div>


        <!-- 날짜 -->

        <div class="dates">


          <!-- 지급일자 -->

          <div class="datebox">

            <div class="label">
              지급일자
            </div>


            <div class="date">
              ${esc(date(x.startDate))}
            </div>

          </div>


          <!-- 완료일자 -->

          <div class="datebox complete">

            <div class="label">
              완료일자
            </div>


            <div class="date">
              ${esc(date(x.completeDate))}
            </div>

          </div>


        </div>


        <!-- 임명 -->

        <div class="assign">

          <span class="alabel">
            임명
          </span>


          <span class="weekday">
            ${esc(x.weekday)}
          </span>


          <span>
            ·
          </span>


          <span class="name">
            ${esc(x.person)}
          </span>

        </div>


      </article>

    `;

  });


  html +=
    "</div>";


  /* =======================================================
     공지사항
     B14
     ======================================================= */

  const notice =
    result.notice || "";


  if(notice){

    html += `

      <div class="note">

        ${esc(notice)
          .replace(
            "추요식 형제",
            "<b>추요식 형제</b>"
          )
        }

      </div>

    `;

  }


  /*
   * 하단 JW.ORG / 라이브러리는
   * 이제 고정 버튼에서 처리하므로
   * 카드 아래에 다시 만들지 않습니다.
   */


  app.innerHTML =
    html;

}


/* =========================================================
   Apps Script JSONP 연결
   ========================================================= */

function load(){


  app.className =
    "loading";


  app.textContent =
    "개인봉사 자료를 불러오는 중입니다...";


  /* 기존 요청 제거 */

  if(jsonpScript){

    jsonpScript.remove();

    jsonpScript =
      null;

  }


  if(jsonpTimer){

    clearTimeout(
      jsonpTimer
    );

    jsonpTimer =
      null;

  }


  /* 콜백 이름 */

  const callbackName =
    "personalServiceCallback_" +
    Date.now();


  /* Apps Script가 호출 */

  window[callbackName] =
    function(result){

      cleanup();

      render(result);

    };


  /* JSONP */

  jsonpScript =
    document.createElement("script");


  jsonpScript.src =
    API +
    "?callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  /* 연결 실패 */

  jsonpScript.onerror =
    function(){

      cleanup();


      showError(
        "Apps Script에 연결할 수 없습니다.<br>" +
        "<small>" +
        "웹앱 배포 주소 또는 권한을 확인해 주세요." +
        "</small>"
      );

    };


  document.head.appendChild(
    jsonpScript
  );


  /* 15초 시간 초과 */

  jsonpTimer =
    setTimeout(
      function(){

        cleanup();


        showError(
          "Apps Script 응답 시간이 초과되었습니다."
        );

      },
      15000
    );


  /* 정리 */

  function cleanup(){


    if(jsonpTimer){

      clearTimeout(
        jsonpTimer
      );

      jsonpTimer =
        null;

    }


    if(jsonpScript){

      jsonpScript.remove();

      jsonpScript =
        null;

    }


    try{

      delete window[callbackName];

    }catch(e){

      window[callbackName] =
        undefined;

    }

  }

}


/* =========================================================
   오류
   ========================================================= */

function showError(msg){

  app.className =
    "loading error";


  app.innerHTML = `

    자료를 가져오지 못했습니다.

    <br>

    <small>
      ${msg}
    </small>

    <br><br>

    <button
      onclick="load()"
    >
      다시 시도
    </button>

  `;

}


/* =========================================================
   홈
   ========================================================= */

function home(){

  location.href =
    "index.html";

}


/* =========================================================
   설정창
   ========================================================= */

function toggle(){

  panel.classList.toggle(
    "show"
  );

}


/* =========================================================
   밝게 / 어둡게
   ========================================================= */

function theme(t){

  document.body.classList.toggle(
    "light",
    t === "light"
  );


  localStorage.psTheme =
    t;


  light.classList.toggle(
    "active",
    t === "light"
  );


  dark.classList.toggle(
    "active",
    t === "dark"
  );

}


/* =========================================================
   글자 크기
   ========================================================= */

function font(n){

  let v =
    +(localStorage.psFont || 100) +
    n;


  /*
   * 최소 80%
   * 최대 150%
   */

  v =
    Math.max(
      80,
      Math.min(
        150,
        v
      )
    );


  document.documentElement
    .style
    .setProperty(
      "--s",
      v / 100
    );


  fv.textContent =
    v + "%";


  localStorage.psFont =
    v;

}


/* =========================================================
   초기 설정
   ========================================================= */

theme(
  localStorage.psTheme ||
  "dark"
);


font(0);


/* =========================================================
   처음 실행
   ========================================================= */

load();

</script>


</body>
</html>
