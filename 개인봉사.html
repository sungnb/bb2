<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color"
      content="#171329"
      id="themeColor">

<title>개인봉사</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --s:1;
}

/* =====================================================
   기본 = 다크모드
   ===================================================== */

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #171329,
      #2d2352
    );

  color:#fff;

  font-size:calc(16px * var(--s));

  padding-top:82px;
  padding-bottom:72px;
}

/* =====================================================
   상단 고정
   ===================================================== */

.header{

  position:fixed;

  top:0;
  left:0;
  right:0;

  height:82px;

  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#120c2df5;

  border-bottom:
    1px solid #ffffff20;

  box-shadow:
    0 5px 20px #0005;
}

/* 홈 */

.home-button{

  position:absolute;

  left:10px;

  top:50%;

  transform:translateY(-50%);

  border:0;

  border-radius:10px;

  padding:9px 11px;

  background:#ffffff18;

  color:#fff;

  font-size:15px;

  font-weight:700;

  cursor:pointer;
}

/* 제목 */

.title{

  text-align:center;

  line-height:1.1;
}

.title-main{

  font-size:27px;

  font-weight:900;
}

.title-sub{

  margin-top:4px;

  font-size:12px;

  opacity:.65;
}

/* 설정 */

.settings{

  position:absolute;

  right:10px;

  top:50%;

  transform:translateY(-50%);

  width:42px;
  height:42px;

  border:0;

  border-radius:10px;

  background:#ffffff18;

  color:#fff;

  font-size:21px;

  cursor:pointer;
}

/* =====================================================
   설정 패널
   ===================================================== */

.panel{

  display:none;

  position:fixed;

  z-index:2000;

  right:10px;

  top:72px;

  width:225px;

  padding:15px;

  border-radius:14px;

  background:#17102df7;

  color:#fff;

  border:1px solid #ffffff18;

  box-shadow:
    0 12px 35px #0008;

  text-align:left;
}

.panel.show{
  display:block;
}

.panel-title{

  font-size:16px;

  font-weight:900;

  margin-bottom:10px;
}

.row{

  display:flex;

  gap:8px;

  margin:10px 0;
}

.row button{

  flex:1;

  padding:10px;

  border:0;

  border-radius:9px;

  background:#ffffff15;

  color:inherit;

  cursor:pointer;

  font-weight:700;
}

.row button.active{

  background:#ffffff35;
}

/* 글자 크기 */

.font{

  display:flex;

  gap:8px;

  align-items:center;

  margin-top:12px;
}

.font button{

  width:40px;
  height:36px;

  border:0;

  border-radius:8px;

  background:#ffffff15;

  color:inherit;

  font-size:19px;

  cursor:pointer;
}

.font span{

  flex:1;

  text-align:center;

  font-weight:800;
}

/* =====================================================
   본문
   ===================================================== */

.wrap{

  width:100%;

  max-width:720px;

  margin:0 auto;

  padding:
    14px
    10px
    20px;
}

/* =====================================================
   카드
   ===================================================== */

.cards{

  display:flex;

  flex-direction:column;

  gap:12px;
}

.card{

  overflow:hidden;

  border:
    1px solid #ffffff25;

  border-radius:15px;

  background:#ffffff0d;

  box-shadow:
    0 8px 25px #0004;
}

/* 상단 */

.top{

  display:grid;

  grid-template-columns:
    105px 1fr;

  min-height:92px;
}

/* 번호 */

.num{

  display:flex;

  align-items:center;

  justify-content:center;

  background:#deebd5;

  border-right:
    1px solid #0003;
}

.num a{

  font-size:
    calc(42px * var(--s));

  font-weight:900;

  color:#101ee6;

  text-decoration:underline;

  text-underline-offset:5px;
}

/* 구역 정보 */

.info{

  padding:12px 14px;

  display:flex;

  flex-direction:column;

  justify-content:center;
}

.zone{

  font-size:
    calc(21px * var(--s));

  font-weight:800;

  line-height:1.25;

  word-break:keep-all;
}

.house{

  margin-top:6px;

  font-size:
    calc(18px * var(--s));

  font-weight:700;

  color:#d8e7ff;
}

/* 날짜 */

.dates{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  border-top:
    1px solid #fff2;

  border-bottom:
    1px solid #fff2;
}

.datebox{

  padding:10px 12px;
}

.datebox + .datebox{

  border-left:
    1px solid #fff2;
}

.label{

  font-size:
    calc(12px * var(--s));

  opacity:.65;

  font-weight:700;
}

.date{

  margin-top:4px;

  font-size:
    calc(16px * var(--s));

  font-weight:800;

  white-space:nowrap;
}

.complete .date{

  color:#8790ff;
}

/* 임명인 */

.assign{

  display:flex;

  align-items:center;

  gap:9px;

  padding:11px 13px;
}

.alabel{

  font-size:
    calc(13px * var(--s));

  font-weight:800;
}

.weekday{

  font-size:
    calc(15px * var(--s));

  font-weight:800;

  color:#ff5a5a;
}

.name{

  font-size:
    calc(16px * var(--s));

  font-weight:800;
}

/* =====================================================
   공지
   ===================================================== */

.note{

  margin-top:14px;

  padding:14px;

  border-radius:12px;

  text-align:center;

  background:#fff0db;

  color:#4b3b2c;

  font-weight:700;

  line-height:1.5;
}

.note b{

  color:#1235e8;
}

/* =====================================================
   하단 고정 링크
   ===================================================== */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:68px;

  z-index:1000;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:#30206f;

  border-top:
    1px solid #ffffff25;

  box-shadow:
    0 -5px 20px #0005;
}

.bottom-nav a{

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:5px;

  color:#fff;

  text-decoration:none;

  font-size:
    calc(13px * var(--s));

  font-weight:800;
}

.bottom-nav a + a{

  border-left:
    1px solid #ffffff20;
}

/* =====================================================
   로딩
   ===================================================== */

.loading{

  text-align:center;

  padding:50px 10px;

  opacity:.7;
}

/* 오류 */

.error{

  color:#ffb4b4;

  line-height:1.6;
}

.error button{

  padding:9px 14px;

  border:0;

  border-radius:9px;

  background:#ffffff18;

  color:#fff;

  cursor:pointer;
}

/* =====================================================
   밝은 모드
   ===================================================== */

body.light{

  background:
    linear-gradient(
      135deg,
      #f3f6fa,
      #fff
    );

  color:#222;
}

body.light .header{

  background:#f3f6faf5;

  border-bottom-color:#0002;

  box-shadow:
    0 5px 20px #0002;
}

body.light .home-button,
body.light .settings{

  background:#0000000d;

  color:#222;
}

body.light .panel{

  background:#fffffff8;

  color:#222;

  border-color:#0002;

  box-shadow:
    0 12px 35px #0003;
}

body.light .row button,
body.light .font button{

  background:#0000000d;

  color:#222;
}

body.light .row button.active{

  background:#0000001f;
}

body.light .card{

  background:#ffffffe8;

  border-color:#0002;

  box-shadow:
    0 8px 25px #00000014;
}

body.light .house{

  color:#3f4c5c;
}

body.light .dates{

  border-color:#0002;
}

body.light .datebox + .datebox{

  border-color:#0002;
}

body.light .bottom-nav{

  background:#f3f6fa;

  border-top-color:#0002;

  box-shadow:
    0 -5px 20px #00000014;
}

body.light .bottom-nav a{

  color:#222;

  background:#f3f6fa;
}

body.light .bottom-nav a + a{

  border-left-color:#0002;
}

/* =====================================================
   휴대폰
   ===================================================== */

@media(max-width:480px){

  body{

    padding-top:76px;

    padding-bottom:68px;
  }

  .header{

    height:76px;
  }

  .title-main{

    font-size:24px;
  }

  .home-button{

    font-size:14px;

    padding:8px 9px;
  }

  .settings{

    width:40px;
    height:40px;
  }

  .top{

    grid-template-columns:
      92px 1fr;
  }

  .num a{

    font-size:
      calc(38px * var(--s));
  }

  .zone{

    font-size:
      calc(19px * var(--s));
  }

  .house{

    font-size:
      calc(17px * var(--s));
  }

  .date{

    font-size:
      calc(14px * var(--s));
  }

  .assign{

    gap:7px;
  }

  .bottom-nav{

    height:64px;
  }
}

</style>
</head>


<body>

<!-- =====================================================
     상단
     ===================================================== -->

<header class="header">

  <button
    class="home-button"
    onclick="home()">
    🏠 홈
  </button>

  <div class="title">

    <div class="title-main">
      📋 개인봉사
    </div>

    <div class="title-sub">
      개인 구역 카드
    </div>

  </div>

  <button
    class="settings"
    onclick="togglePanel()">
    ⚙️
  </button>

</header>


<!-- =====================================================
     설정
     ===================================================== -->

<div
  id="panel"
  class="panel">

  <div class="panel-title">
    설정
  </div>

  <div class="row">

    <button
      id="light"
      onclick="theme('light')">
      ☀️ 밝게
    </button>

    <button
      id="dark"
      onclick="theme('dark')">
      🌙 어둡게
    </button>

  </div>


  <div class="font">

    <button
      onclick="font(-5)">
      −
    </button>

    <span id="fv">
      100%
    </span>

    <button
      onclick="font(5)">
      ＋
    </button>

  </div>

</div>


<!-- =====================================================
     본문
     ===================================================== -->

<main class="wrap">

  <div
    id="app"
    class="loading">

    개인봉사 자료를 불러오는 중입니다...

  </div>

</main>


<!-- =====================================================
     하단 고정
     ===================================================== -->

<nav class="bottom-nav">

  <a
    href="https://www.jw.org/ko/"
    target="_blank"
    rel="noopener">
    JW.ORG
  </a>

  <a
    href="https://wol.jw.org/ko/"
    target="_blank"
    rel="noopener">
    라이브러리
  </a>

  <a
    href="https://wol.jw.org/ko/wol/binav/r8/lp-ko"
    target="_blank"
    rel="noopener">
    성경
  </a>

  <a
    href="https://tv.jw.org/#ko/home"
    target="_blank"
    rel="noopener">
    JW방송
  </a>

</nav>


<script>

/* =====================================================
   Apps Script 주소
   ===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbzBidcJoF1DIUoyahm0uOJVRiNgwQuX--Uu5JRXyJmnTh5zoyJrEouIecIVHyvGMP-E/exec";


/* =====================================================
   Google Sheet
   ===================================================== */

const SHEET_ID =
"1XGbksIQCRjagzCJLj-wHlBVfQf4JsMjk79ikxIMFI4o";

const GID = "0";

const SHEET =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${GID}`;


/* =====================================================
   화면 요소
   ===================================================== */

const app =
document.getElementById("app");

const panel =
document.getElementById("panel");

const light =
document.getElementById("light");

const dark =
document.getElementById("dark");

const fv =
document.getElementById("fv");

const themeColor =
document.getElementById("themeColor");


/* =====================================================
   JSONP
   ===================================================== */

let jsonpScript = null;

let jsonpTimer = null;


/* =====================================================
   HTML 특수문자
   ===================================================== */

function esc(x){

  return String(x ?? "")
    .replace(
      /[&<>'"]/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
      }[c])
    );

}


/* =====================================================
   날짜
   ===================================================== */

function date(v){

  if(!v){
    return "";
  }

  return String(v)
    .replace(/\s+/g," ")
    .trim();

}


/* =====================================================
   데이터 표시
   ===================================================== */

function render(result){

  if(
    !result ||
    result.success !== true
  ){

    showError(
      result?.message ||
      "자료를 가져오지 못했습니다."
    );

    return;
  }


  const data =
    Array.isArray(result.data)
      ? result.data
      : [];


  if(!data.length){

    app.className =
      "loading";

    app.innerHTML =
      "표시할 개인봉사 자료가 없습니다.";

    return;
  }


  app.className = "";


  let html =
    '<div class="cards">';


  data.forEach(function(x,index){

    /*
      Apps Script에서 B4:H12를 가져오므로
      실제 시트 행은 4부터 시작합니다.
    */

    const sheetRow =
      index + 4;


    /*
      번호는 B열입니다.

      따라서 135는 B4로 연결됩니다.
    */

    const numberLink =
      `${SHEET}&range=B${sheetRow}`;


    html += `

      <article class="card">

        <div class="top">

          <div class="num">

            <a
              href="${numberLink}"
              target="_blank"
              rel="noopener">
              ${esc(x.number)}
            </a>

          </div>


          <div class="info">

            <div class="zone">
              ${esc(x.zone)}
            </div>

            <div class="house">
              ${esc(x.house)}호
            </div>

          </div>

        </div>


        <div class="dates">

          <div class="datebox">

            <div class="label">
              시작일자
            </div>

            <div class="date">
              ${esc(date(x.startDate))}
            </div>

          </div>


          <div class="datebox complete">

            <div class="label">
              완료일자
            </div>

            <div class="date">
              ${esc(date(x.completeDate))}
            </div>

          </div>

        </div>


        <div class="assign">

          <span class="alabel">
            임명인
          </span>

          <span class="weekday">
            ${esc(x.weekday)}
          </span>

          <span>
            ·
          </span>

          <span class="name">
            ${esc(x.person)}
          </span>

        </div>

      </article>

    `;

  });


  html +=
    "</div>";


  /* =================================================
     공지사항
     ================================================= */

  const notice =
    result.notice || "";


  if(notice){

    html += `

      <div class="note">

        ${esc(notice)
          .replace(
            "추요식 형제",
            "<b>추요식 형제</b>"
          )}

      </div>

    `;

  }


  app.innerHTML =
    html;

}


/* =====================================================
   Apps Script 연결
   ===================================================== */

function load(){

  app.className =
    "loading";

  app.textContent =
    "개인봉사 자료를 불러오는 중입니다...";


  if(jsonpScript){

    jsonpScript.remove();

    jsonpScript = null;
  }


  if(jsonpTimer){

    clearTimeout(jsonpTimer);

    jsonpTimer = null;
  }


  const callbackName =
    "personalServiceCallback_" +
    Date.now();


  window[callbackName] =
    function(result){

      cleanup();

      render(result);

    };


  jsonpScript =
    document.createElement("script");


  jsonpScript.src =
    API +
    "?callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  jsonpScript.onerror =
    function(){

      cleanup();

      showError(
        "Apps Script에 연결할 수 없습니다.<br>" +
        "<small>" +
        "웹앱 주소 또는 권한을 확인해 주세요." +
        "</small>"
      );

    };


  document.head.appendChild(
    jsonpScript
  );


  jsonpTimer =
    setTimeout(function(){

      cleanup();

      showError(
        "Apps Script 응답 시간이 초과되었습니다."
      );

    },15000);


  function cleanup(){

    if(jsonpTimer){

      clearTimeout(
        jsonpTimer
      );

      jsonpTimer = null;
    }


    if(jsonpScript){

      jsonpScript.remove();

      jsonpScript = null;
    }


    try{

      delete window[callbackName];

    }catch(e){

      window[callbackName] =
        undefined;

    }

  }

}


/* =====================================================
   오류
   ===================================================== */

function showError(msg){

  app.className =
    "loading error";


  app.innerHTML = `

    자료를 가져오지 못했습니다.

    <br>

    <small>
      ${msg}
    </small>

    <br><br>

    <button onclick="load()">
      다시 시도
    </button>

  `;

}


/* =====================================================
   홈
   ===================================================== */

function home(){

  location.href =
    "index.html";

}


/* =====================================================
   설정창
   ===================================================== */

function togglePanel(){

  panel.classList.toggle(
    "show"
  );

}


/* =====================================================
   다크 / 밝게
   ===================================================== */

function theme(t){

  document.body.classList.toggle(
    "light",
    t === "light"
  );


  localStorage.psTheme =
    t;


  light.classList.toggle(
    "active",
    t === "light"
  );


  dark.classList.toggle(
    "active",
    t === "dark"
  );


  /*
    휴대폰 브라우저 상단 색상
  */

  if(themeColor){

    themeColor.setAttribute(
      "content",
      t === "light"
        ? "#f3f6fa"
        : "#171329"
    );

  }

}


/* =====================================================
   글자 크기
   80% ~ 150%
   5%씩 변경
   ===================================================== */

function font(n){

  let v =
    +(localStorage.psFont || 100) +
    n;


  v =
    Math.max(
      80,
      Math.min(
        150,
        v
      )
    );


  document.documentElement
    .style
    .setProperty(
      "--s",
      v / 100
    );


  fv.textContent =
    v + "%";


  localStorage.psFont =
    v;

}


/* =====================================================
   초기 설정
   중요: 기본은 무조건 다크모드
   ===================================================== */

theme("dark");

font(0);


/* =====================================================
   처음 실행
   ===================================================== */

load();

</script>

</body>
</html>
