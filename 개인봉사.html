<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#24145f">
<title>개인봉사</title>

<style>
*{box-sizing:border-box}

:root{
  --s:1
}

body{
  margin:0;
  min-height:100vh;
  padding-top:82px;
  padding-bottom:76px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  background:linear-gradient(135deg,#171329,#2d2352);
  color:#fff;
  font-size:calc(16px*var(--s))
}

.header{
  position:fixed;
  left:0;
  right:0;
  top:0;
  z-index:1000;
  padding:18px 55px;
  text-align:center;
  background:rgba(18,12,45,.94);
  border-bottom:1px solid #ffffff18
}

h1{
  margin:0;
  font-size:28px
}

.sub{
  font-size:13px;
  opacity:.65;
  margin-top:4px
}

button{
  border:0;
  border-radius:9px;
  cursor:pointer
}

.home-btn{
  position:absolute;
  left:12px;
  top:12px;
  width:40px;
  height:40px;
  background:#ffffff18;
  color:#fff;
  font-size:20px
}

.settings{
  position:absolute;
  right:12px;
  top:12px;
  width:40px;
  height:40px;
  background:#ffffff18;
  color:#fff;
  font-size:20px
}

.panel{
  display:none;
  position:absolute;
  z-index:5;
  right:12px;
  top:58px;
  width:220px;
  padding:15px;
  border-radius:14px;
  background:#17102df7;
  color:#fff;
  box-shadow:0 10px 30px #0006;
  text-align:left
}

.panel.show{
  display:block
}

.row{
  display:flex;
  gap:8px;
  margin:10px 0
}

.row button{
  flex:1;
  padding:9px;
  background:#ffffff15;
  color:inherit
}

.row button.active{
  background:#ffffff35
}

.font{
  display:flex;
  gap:8px;
  align-items:center
}

.font button{
  width:38px;
  height:34px;
  background:#ffffff15;
  color:inherit;
  font-size:18px
}

.font span{
  flex:1;
  text-align:center
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:12px 10px 60px
}

.actions{
  text-align:right;
  margin-bottom:10px
}

.actions button{
  padding:9px 13px;
  background:#ffffff18;
  color:#fff;
  margin-left:6px
}

.loading{
  text-align:center;
  padding:40px 10px;
  opacity:.7
}

.error{
  color:#ffb4b4
}

.cards{
  display:flex;
  flex-direction:column;
  gap:12px
}

.card{
  overflow:hidden;
  border:1px solid #ffffff25;
  border-radius:15px;
  background:#ffffff0d;
  box-shadow:0 8px 25px #0003
}

.top{
  display:grid;
  grid-template-columns:105px 1fr;
  min-height:92px
}

.num{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#deebd5;
  border-right:1px solid #0002
}

.num a{
  font-size:calc(42px*var(--s));
  font-weight:900;
  color:#101ee6;
  text-decoration:underline;
  text-underline-offset:5px
}

.info{
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  justify-content:center
}

.zone{
  font-size:calc(21px*var(--s));
  font-weight:800;
  line-height:1.2;
  word-break:keep-all
}

.house{
  margin-top:6px;
  font-size:calc(18px*var(--s));
  font-weight:700;
  color:#d8e7ff
}

.dates{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid #fff2;
  border-bottom:1px solid #fff2
}

.datebox{
  padding:10px 12px
}

.datebox+.datebox{
  border-left:1px solid #fff2
}

.label{
  font-size:calc(12px*var(--s));
  opacity:.65;
  font-weight:700
}

.date{
  margin-top:4px;
  font-size:calc(16px*var(--s));
  font-weight:800;
  white-space:nowrap
}

.complete .date{
  color:#7580ff
}

.assign{
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 13px
}

.alabel{
  font-size:calc(13px*var(--s));
  font-weight:800
}

.weekday{
  font-size:calc(15px*var(--s));
  font-weight:800;
  color:#ff4b4b
}

.name{
  font-size:calc(16px*var(--s));
  font-weight:800
}

.note{
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  text-align:center;
  background:#fff0db;
  color:#4b3b2c;
  font-weight:700
}

.note b{
  color:#1235e8
}

.links{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:10px
}

.links a{
  padding:13px;
  text-align:center;
  background:#30206f;
  color:#fff;
  text-decoration:none;
  font-weight:800
}

.links a+a{
  border-left:1px solid #fff4
}


/* 하단 고정 메뉴 */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:1000;
  height:64px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#30206f;
  box-shadow:0 -5px 20px #0005;
  border-top:1px solid #ffffff25
}

.bottom-nav a{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 4px;
  color:#fff;
  text-decoration:none;
  font-size:calc(14px*var(--s));
  font-weight:800;
  text-align:center;
  white-space:nowrap
}

.bottom-nav a+a{
  border-left:1px solid #ffffff25
}

/* 밝은 화면 */

body.light{
  background:linear-gradient(135deg,#f3f6fa,#fff);
  color:#222
}

body.light .header{
  background:#f3f6fa;
  border-color:#0002
}

body.light .home-btn,
body.light .settings{
  background:#0000000d;
  color:#222
}

body.light .bottom-nav{
  background:#30206f;
  border-top-color:#0002
}

body.light .settings,
body.light .actions button{
  background:#0000000d;
  color:#222
}

body.light .panel{
  background:#fffffff8;
  color:#222;
  border:1px solid #0002
}

body.light .row button,
body.light .font button{
  background:#0000000d;
  color:#222
}

body.light .row button.active{
  background:#0000001f
}

body.light .card{
  background:#ffffffe8;
  border-color:#0002;
  box-shadow:0 8px 25px #00000014
}

body.light .zone{
  color:#222
}

body.light .house{
  color:#3f4c5c
}

body.light .dates{
  border-color:#0002
}

body.light .datebox+.datebox{
  border-color:#0002
}

@media(max-width:480px){

  h1{
    font-size:25px
  }

  body{
    padding-top:78px
  }

  .top{
    grid-template-columns:92px 1fr
  }

  .num a{
    font-size:calc(38px*var(--s))
  }

  .zone{
    font-size:calc(19px*var(--s))
  }

  .house{
    font-size:calc(17px*var(--s))
  }

  .date{
    font-size:calc(14px*var(--s))
  }

  .assign{
    gap:7px
  }

  .bottom-nav a{
    font-size:calc(12px*var(--s));
    padding-left:2px;
    padding-right:2px
  }
}
</style>
</head>

<body>

<header class="header">

  <button class="home-btn" onclick="home()" aria-label="홈">🏠</button>

  <h1>📋 개인봉사</h1>

  <div class="sub">
    개인 구역 카드
  </div>

  <button class="settings" onclick="toggle()">
    ⚙️
  </button>

  <div id="panel" class="panel">

    <b>설정</b>

    <div class="row">
      <button id="light" onclick="theme('light')">
        ☀️ 밝게
      </button>

      <button id="dark" onclick="theme('dark')">
        🌙 어둡게
      </button>
    </div>

    <div class="font">

      <button onclick="font(-10)" aria-label="글자 작게">
        −
      </button>

      <span id="fv">
        100%
      </span>

      <button onclick="font(10)" aria-label="글자 크게">
        ＋
      </button>

    </div>

  </div>

</header>


<nav class="bottom-nav" aria-label="빠른 링크">
  <a href="https://www.jw.org/ko/" target="_blank" rel="noopener">JW.ORG</a>
  <a href="https://wol.jw.org/ko/" target="_blank" rel="noopener">라이브러리</a>
  <a href="https://wol.jw.org/ko/wol/binav/r8/lp-ko" target="_blank" rel="noopener">성경</a>
  <a href="https://tv.jw.org/#ko/home" target="_blank" rel="noopener">JW방송</a>
</nav>

<main class="wrap">

  <div id="app" class="loading">
    개인봉사 자료를 불러오는 중입니다...
  </div>

</main>


<script>

/* =====================================================
   Apps Script 주소
   ===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbzBidcJoF1DIUoyahm0uOJVRiNgwQuX--Uu5JRXyJmnTh5zoyJrEouIecIVHyvGMP-E/exec";

/* =====================================================
   Google Sheet
   ===================================================== */

const SHEET_ID =
"1XGbksIQCRjagzCJLj-wHlBVfQf4JsMjk79ikxIMFI4o";

const GID = "0";

const SHEET =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${GID}`;


/* =====================================================
   화면 요소
   ===================================================== */

const app =
document.getElementById("app");

const panel =
document.getElementById("panel");

const light =
document.getElementById("light");

const dark =
document.getElementById("dark");

const fv =
document.getElementById("fv");


/* =====================================================
   JSONP 관리
   ===================================================== */

let jsonpScript = null;
let jsonpTimer = null;


/* =====================================================
   HTML 특수문자 처리
   ===================================================== */

const esc = x =>
String(x ?? "").replace(
  /[&<>'"]/g,
  c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    '"':"&quot;"
  }[c])
);


/* =====================================================
   날짜
   ===================================================== */

function date(v){

  if(!v){
    return "";
  }

  return String(v)
    .replace(/\s+/g," ")
    .trim();
}


/* =====================================================
   데이터 화면 표시
   ===================================================== */

function render(result){

  /* Apps Script 오류 */

  if(
    !result ||
    result.success !== true
  ){

    showError(
      result?.message ||
      "자료를 가져오지 못했습니다."
    );

    return;
  }


  /* 데이터 */

  const data =
    Array.isArray(result.data)
      ? result.data
      : [];


  if(!data.length){

    app.className="loading";

    app.innerHTML =
      "표시할 개인봉사 자료가 없습니다.";

    return;
  }


  app.className="";


  let html =
    '<div class="cards">';


  data.forEach(function(x,index){

    /*
      현재 시트 데이터는
      B4:H12에 있으므로
      실제 행 번호는 4부터 시작
    */

    const sheetRow =
      Number(x.row) || (index + 4);

    const numberLink =
      `${SHEET}#gid=${GID}&range=B${sheetRow}`;


    html += `

      <article class="card">

        <div class="top">

          <div class="num">

            <a
              href="${esc(numberLink)}"
              target="_blank"
              rel="noopener"
            >
              ${esc(x.number)}
            </a>

          </div>


          <div class="info">

            <div class="zone">
              ${esc(x.zone)}
            </div>

            <div class="house">
              ${esc(x.house)}호
            </div>

          </div>

        </div>


        <div class="dates">

          <div class="datebox">

            <div class="label">
              지급일자
            </div>

            <div class="date">
              ${esc(date(x.startDate))}
            </div>

          </div>


          <div class="datebox complete">

            <div class="label">
              완료일자
            </div>

            <div class="date">
              ${esc(date(x.completeDate))}
            </div>

          </div>

        </div>


        <div class="assign">

          <span class="alabel">
            임명
          </span>

          <span class="weekday">
            ${esc(x.weekday)}
          </span>

          <span>
            ·
          </span>

          <span class="name">
            ${esc(x.person)}
          </span>

        </div>

      </article>

    `;
  });


  html += "</div>";


  /* =================================================
     공지사항 B14
     ================================================= */

  const notice =
    result.notice || "";


  if(notice){

    html += `

      <div class="note">

        ${esc(notice)
          .replace(
            "추요식 형제",
            "<b>추요식 형제</b>"
          )
        }

      </div>

    `;
  }


  app.innerHTML =
    html;
}


/* =====================================================
   Apps Script JSONP 연결
   ===================================================== */

function load(){

  app.className =
    "loading";

  app.textContent =
    "개인봉사 자료를 불러오는 중입니다...";


  /* 기존 요청 제거 */

  if(jsonpScript){

    jsonpScript.remove();

    jsonpScript =
      null;
  }


  if(jsonpTimer){

    clearTimeout(jsonpTimer);

    jsonpTimer =
      null;
  }


  /*
    새로운 콜백 이름 생성
  */

  const callbackName =
    "personalServiceCallback_" +
    Date.now();


  /*
    Apps Script가
    이 함수를 호출하게 됨
  */

  window[callbackName] =
    function(result){

      cleanup();

      render(result);

    };


  /*
    script 방식으로 Apps Script 호출
    CORS 문제를 피하기 위한 JSONP
  */

  jsonpScript =
    document.createElement("script");


  jsonpScript.src =
    API +
    "?callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  /*
    연결 실패
  */

  jsonpScript.onerror =
    function(){

      cleanup();

      showError(
        "Apps Script에 연결할 수 없습니다.<br>" +
        "<small>" +
        "웹앱 배포 주소 또는 권한을 확인해 주세요." +
        "</small>"
      );

    };


  document.head.appendChild(
    jsonpScript
  );


  /*
    15초 이상 응답이 없으면
    시간 초과
  */

  jsonpTimer =
    setTimeout(function(){

      cleanup();

      showError(
        "Apps Script 응답 시간이 초과되었습니다."
      );

    },15000);


  /*
    정리
  */

  function cleanup(){

    if(jsonpTimer){

      clearTimeout(
        jsonpTimer
      );

      jsonpTimer =
        null;
    }


    if(jsonpScript){

      jsonpScript.remove();

      jsonpScript =
        null;
    }


    try{

      delete window[callbackName];

    }catch(e){

      window[callbackName] =
        undefined;

    }

  }

}


/* =====================================================
   오류 화면
   ===================================================== */

function showError(msg){

  app.className =
    "loading error";

  app.innerHTML = `

    자료를 가져오지 못했습니다.

    <br>

    <small>
      ${msg}
    </small>

    <br><br>

    <button onclick="load()">
      다시 시도
    </button>

  `;
}


/* =====================================================
   홈
   ===================================================== */

function home(){

  location.href =
    "index.html";

}


/* =====================================================
   설정창
   ===================================================== */

function toggle(){

  panel.classList.toggle(
    "show"
  );

}


/* =====================================================
   밝게 / 어둡게
   ===================================================== */

function theme(t){

  document.body.classList.toggle(
    "light",
    t === "light"
  );


  localStorage.psTheme =
    t;


  light.classList.toggle(
    "active",
    t === "light"
  );


  dark.classList.toggle(
    "active",
    t === "dark"
  );

}


/* =====================================================
   글자 크기
   ===================================================== */

function font(n){

  let v =
    +(localStorage.psFont || 100) +
    n;


  /*
    최소 70%
    최대 130%
  */

  v =
    Math.max(
      70,
      Math.min(
        130,
        v
      )
    );


  document.documentElement
    .style
    .setProperty(
      "--s",
      v / 100
    );


  fv.textContent =
    v + "%";


  localStorage.psFont =
    v;

}


/* =====================================================
   초기 설정
   ===================================================== */

theme(
  localStorage.psTheme ||
  "dark"
);


font(0);


/* =====================================================
   처음 실행
   ===================================================== */

load();

</script>

</body>
</html>
