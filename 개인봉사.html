<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>개인봉사</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #211b3d;
  color: #ffffff;
  font-family:
    "Noto Sans KR",
    "Malgun Gothic",
    Arial,
    sans-serif;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

/* 전체 */

.container {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  padding: 12px 12px 30px;
}

/* 상단 */

.header {
  position: relative;
  text-align: center;
  margin-bottom: 14px;
}

.title {
  margin: 0;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1px;
}

.subtitle {
  margin-top: 4px;
  font-size: 15px;
  font-weight: 700;
  opacity: 0.8;
}

/* 새로고침 */

.refresh-area {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}

.refresh-btn {
  border: 0;
  border-radius: 10px;
  padding: 8px 14px;
  background: #392776;
  color: #ffffff;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.refresh-btn:active {
  transform: scale(0.96);
}

/* 로딩 */

.loading {
  text-align: center;
  padding: 40px 10px;
  font-size: 17px;
  font-weight: 700;
}

/* 오류 */

.error {
  display: none;
  margin: 20px 0;
  padding: 18px;
  border-radius: 14px;
  background: #7b2434;
  color: #ffffff;
  text-align: center;
  font-weight: 700;
  line-height: 1.5;
}

/* 카드 */

.card {
  display: grid;
  grid-template-columns: 124px 1fr;
  margin-bottom: 14px;

  overflow: hidden;

  background: #30294f;

  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 18px;

  box-shadow:
    0 2px 6px rgba(0,0,0,0.18);
}

/* 번호 */

.number-box {
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 92px;

  background: #dfeeda;
}

.number-box a {
  color: #1537df;
  font-size: 54px;
  line-height: 1;
  font-weight: 900;
  text-decoration: underline;
  text-decoration-thickness: 5px;
  text-underline-offset: 7px;
}

/* 구역 */

.zone-box {
  min-width: 0;
  padding: 10px 16px 12px;

  border-bottom: 1px solid rgba(255,255,255,0.14);
}

.zone {
  font-size: 29px;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: -1.3px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.house {
  margin-top: 8px;
  font-size: 24px;
  line-height: 1;
  font-weight: 800;
  color: #dce7ff;
}

/* 날짜 영역 */

.info-area {
  grid-column: 1 / 3;

  display: grid;
  grid-template-columns: 1fr 1fr;

  border-bottom: 1px solid rgba(255,255,255,0.14);
}

.info {
  padding: 13px 15px 14px;
}

.info + .info {
  border-left: 1px solid rgba(255,255,255,0.14);
}

.label {
  margin-bottom: 7px;

  color: #bcb9c9;
  font-size: 16px;
  font-weight: 800;
}

.value {
  font-size: 22px;
  line-height: 1.1;
  font-weight: 900;
}

.complete {
  color: #7e87ff;
}

/* 임명 */

.appointment {
  grid-column: 1 / 3;

  padding: 13px 15px 14px;

  font-size: 20px;
  line-height: 1.2;
  font-weight: 900;
}

.appointment .day {
  color: #ff4a4a;
}

.appointment .dot {
  margin: 0 5px;
}

/* 안내 */

.notice {
  margin-top: 16px;
  padding: 17px 16px;

  background: #fff1dc;
  color: #392f2c;

  border-radius: 14px;

  text-align: center;

  font-size: 19px;
  line-height: 1.45;
  font-weight: 800;
}

.notice strong {
  color: #1537df;
}

/* 하단 링크 */

.links {
  display: grid;
  grid-template-columns: 1fr 1fr;

  margin-top: 12px;
}

.links a {
  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 62px;

  background: #38227a;

  color: #ffffff;

  text-decoration: none;

  font-size: 20px;
  font-weight: 900;
}

.links a + a {
  border-left: 1px solid rgba(255,255,255,0.25);
}

/* PC */

@media (min-width: 700px) {

  .container {
    padding-top: 20px;
  }

  .card {
    grid-template-columns: 145px 1fr;
  }

  .number-box a {
    font-size: 62px;
  }

  .zone {
    font-size: 31px;
  }

  .house {
    font-size: 25px;
  }

}

/* 모바일 */

@media (max-width: 520px) {

  .container {
    padding: 8px 8px 25px;
  }

  .title {
    font-size: 28px;
  }

  .card {
    grid-template-columns: 124px 1fr;
    border-radius: 17px;
    margin-bottom: 14px;
  }

  .number-box {
    min-height: 94px;
  }

  .number-box a {
    font-size: 50px;
  }

  .zone-box {
    padding: 9px 15px 10px;
  }

  .zone {
    font-size: 27px;
  }

  .house {
    margin-top: 7px;
    font-size: 23px;
  }

  .info {
    padding: 12px 14px 13px;
  }

  .label {
    font-size: 15px;
  }

  .value {
    font-size: 21px;
  }

  .appointment {
    padding: 12px 14px 13px;
    font-size: 19px;
  }

  .notice {
    font-size: 17px;
    padding: 15px 12px;
  }

  .links a {
    min-height: 60px;
    font-size: 19px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1 class="title">개인봉사</h1>
    <div class="subtitle">개인 구역 봉사 현황</div>
  </div>

  <div class="refresh-area">
    <button
      type="button"
      class="refresh-btn"
      onclick="load()"
    >
      새로고침
    </button>
  </div>

  <div id="loading" class="loading">
    자료를 불러오는 중입니다...
  </div>

  <div id="error" class="error"></div>

  <div id="cards"></div>

  <div id="notice" class="notice" style="display:none;"></div>

  <div id="links" class="links" style="display:none;">
    <a
      id="jworgLink"
      href="https://www.jw.org/"
      target="_blank"
      rel="noopener"
    >
      JW.ORG
    </a>

    <a
      id="libraryLink"
      href="https://wol.jw.org/"
      target="_blank"
      rel="noopener"
    >
      라이브러리
    </a>
  </div>

</div>


<script>

/* =========================================================
   Google Apps Script 주소
   ========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbzBidcJoF1DIUoyahm0uOJVRiNgwQuX--Uu5JRXyJmnTh5zoyJrEouIecIVHyvGMP-E/exec";


/* =========================================================
   Google Sheet
   ========================================================= */

const SHEET_ID =
"1XGbksIQCRjagzCJLj-wHlBVfQf4JsMjk79ikxIMFI4o";

const GID = "0";

const SHEET =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${GID}`;


/* =========================================================
   HTML 이스케이프
   ========================================================= */

function esc(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   JSONP 로드
   ========================================================= */

function load() {

  const loading =
    document.getElementById("loading");

  const error =
    document.getElementById("error");

  const cards =
    document.getElementById("cards");

  const notice =
    document.getElementById("notice");

  const links =
    document.getElementById("links");


  loading.style.display = "block";

  error.style.display = "none";

  cards.innerHTML = "";

  notice.style.display = "none";

  links.style.display = "none";


  const callbackName =
    "personalVolunteerCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  window[callbackName] =
    function(result) {

      try {

        render(result);

      } catch (e) {

        showError(
          "자료를 표시하는 중 오류가 발생했습니다.<br>" +
          esc(e.message)
        );

      }

      try {
        delete window[callbackName];
      } catch (_) {}

    };


  const script =
    document.createElement("script");

  script.src =
    API +
    "?callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      showError(
        "자료를 불러오지 못했습니다.<br>" +
        "Apps Script 배포 주소를 확인해 주세요."
      );

      try {
        delete window[callbackName];
      } catch (_) {}

    };


  document.body.appendChild(script);

}


/* =========================================================
   오류 표시
   ========================================================= */

function showError(message) {

  document.getElementById("loading").style.display =
    "none";

  const error =
    document.getElementById("error");

  error.innerHTML = message;

  error.style.display = "block";

}


/* =========================================================
   자료 표시
   ========================================================= */

function render(result) {

  document.getElementById("loading").style.display =
    "none";


  if (!result || result.success !== true) {

    showError(
      esc(
        result && result.message
          ? result.message
          : "자료를 불러오지 못했습니다."
      )
    );

    return;

  }


  const data =
    Array.isArray(result.data)
      ? result.data
      : [];


  const cards =
    document.getElementById("cards");


  if (data.length === 0) {

    cards.innerHTML =
      '<div class="loading">표시할 자료가 없습니다.</div>';

  }


  data.forEach(function(x) {

    /*
     * Apps Script에서 실제 시트 행 번호를
     * x.row로 전달받습니다.
     *
     * 예:
     * 135 = 4행
     * 136 = 5행
     * 301 = 6행
     */

    const sheetRow =
      Number(x.row);


    /*
     * 번호를 클릭하면
     * Google Sheet의 B열 해당 행으로 이동
     *
     * 135 → B4
     * 136 → B5
     * 301 → B6
     */

    const numberLink =
      sheetRow >= 1
        ? `${SHEET}#gid=${GID}&range=B${sheetRow}`
        : SHEET;


    /*
     * 요일
     */

    const weekday =
      esc(x.weekday);


    /*
     * 카드 생성
     */

    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div class="number-box">

        <a
          href="${esc(numberLink)}"
          target="_blank"
          rel="noopener"
        >
          ${esc(x.number)}
        </a>

      </div>


      <div class="zone-box">

        <div class="zone">
          ${esc(x.zone)}
        </div>

        <div class="house">
          ${esc(x.house)}호
        </div>

      </div>


      <div class="info-area">

        <div class="info">

          <div class="label">
            지급일자
          </div>

          <div class="value">
            ${esc(x.startDate)}
          </div>

        </div>


        <div class="info">

          <div class="label">
            완료일자
          </div>

          <div class="value complete">
            ${esc(x.completeDate)}
          </div>

        </div>

      </div>


      <div class="appointment">

        <span>
          임명
        </span>

        <span class="day">
          ${weekday}
        </span>

        <span class="dot">
          ·
        </span>

        <span>
          ${esc(x.person)}
        </span>

      </div>

    `;


    cards.appendChild(card);

  });


  /* =======================================================
     안내문
     ======================================================= */

  if (result.notice) {

    const notice =
      document.getElementById("notice");


    let noticeText =
      esc(result.notice);


    /*
     * 형제 이름만 파란색 강조
     */

    noticeText =
      noticeText.replace(
        "추요식 형제",
        "<strong>추요식 형제</strong>"
      );


    notice.innerHTML =
      noticeText;


    notice.style.display =
      "block";

  }


  /* =======================================================
     하단 링크
     ======================================================= */

  const jworg =
    result.links &&
    result.links.jworg
      ? result.links.jworg
      : "";


  const library =
    result.links &&
    result.links.library
      ? result.links.library
      : "";


  const jworgLink =
    document.getElementById("jworgLink");


  const libraryLink =
    document.getElementById("libraryLink");


  if (jworg) {

    /*
     * 시트에 실제 URL이 들어 있는 경우
     * 그 주소를 사용합니다.
     */

    if (
      /^https?:\/\//i.test(jworg)
    ) {

      jworgLink.href = jworg;

    }

    jworgLink.textContent =
      "JW.ORG";

  }


  if (library) {

    /*
     * 시트에 실제 URL이 들어 있는 경우
     * 그 주소를 사용합니다.
     */

    if (
      /^https?:\/\//i.test(library)
    ) {

      libraryLink.href = library;

    }

    libraryLink.textContent =
      "라이브러리";

  }


  document.getElementById("links").style.display =
    "grid";

}


/* =========================================================
   페이지 시작
   ========================================================= */

load();

</script>

</body>
</html>
