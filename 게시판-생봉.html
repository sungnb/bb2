<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>생봉</title>

<style>
*{box-sizing:border-box}
:root{--scale:1}
body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f3f4f6;color:#222}

.fixed-header{
  position:fixed;top:0;left:0;width:100%;height:62px;
  z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:10px 14px;background:#193650;color:#fff;text-align:center;
}
.main-title{
  margin:0;padding:0;font-size:30px;font-weight:800;
  letter-spacing:.04em;line-height:40px;white-space:nowrap;
}
.top-button{
  position:absolute;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:1px solid rgba(255,255,255,.35);
  border-radius:10px;background:transparent;color:white;font-size:25px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.back-button{left:10px}
.settings-button{right:10px}

.page{
  position:fixed;top:62px;bottom:62px;left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:15px 10px 20px;max-width:900px;width:100%;margin:0 auto;
}
#content{
  font-size:calc(16px * var(--scale));
}

#content .program-line,
#content .program-line div,
#content .program-line span,
#content .program-line strong,
#content .opening-row,
#content .opening-row div,
#content .opening-row span,
#content .subline,
#content .subline span,
#content .note{
  zoom:var(--scale);
}

.schedule-heading{
  text-align:center;margin:0 0 10px;font-size:30px;font-weight:800;
}
.schedule-subtitle{
  text-align:center;margin:0 0 20px;font-size:13px;font-weight:bold;
}
.program-card{
  width:100%;max-width:680px;margin:0 auto 24px;padding:12px;
  border:5px solid #AEB6BF;border-radius:16px;
  background:linear-gradient(145deg,#fff,#f7faff);
  box-shadow:0 6px 18px rgba(24,50,74,.08);
}
.date-title{
  margin:4px 0 16px;padding:12px 8px;border-radius:10px;
  background:#68717D;color:#fff;font-size:25px;font-weight:800;
  line-height:1.5;letter-spacing:.02em;text-align:center;
}

.opening-row{
  display:grid;grid-template-columns:80px 1fr auto;gap:4px;
  align-items:center;padding:3px 4px;border-bottom:1px solid #e4e7eb;
  line-height:1.2;
  font-size:calc(14px * var(--scale));
}
.opening-row .role{color:#777;font-size:15px;text-align:left}
.opening-row .value{font-weight:600}
.opening-row .name{font-weight:800;white-space:nowrap;text-align:right}

.section-title{
  display:flex;align-items:center;gap:16px;margin:20px 0 0;padding:0;
  text-align:left;background:transparent;font-size:30px;
  font-weight:800;line-height:1.35;
}
.section-icon{
  width:34px;height:35px;flex:0 0 34px;display:flex;
  align-items:center;justify-content:center;color:#fff;
}
.section-icon svg{display:block;width:26px;height:27px;overflow:visible}
.section-title.blue{color:#287889}
.section-title.orange{color:#b77a0a}
.section-title.green{color:#b52b20}
.section-icon.blue{background:#347f8c}
.section-icon.orange{background:#d18a00}
.section-icon.green{background:#c6281c}

.program-line{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;
  align-items:start;padding:3px 4px;border-bottom:1px solid #e8ebef;
  line-height:1.2;
}
.program-line:last-child{border-bottom:0}
.program-text{overflow-wrap:anywhere}
.program-name{font-weight:800;white-space:nowrap;text-align:right}
.blue-text{color:#0645ff}
.red-text{color:#f01818}
.black-text{color:#222}

.subline{
  display:flex;justify-content:space-between;gap:8px;
  padding:5px 4px;line-height:1.45;border-bottom:1px solid #eef0f3;
}
.subline span{overflow-wrap:anywhere}
.subline .person{font-weight:700}
.note{
  font-size:calc(13px * var(--scale));font-weight:700;
  color:#0645ff;padding:5px 4px;
}

.fixed-bottom{
  position:fixed;left:0;right:0;bottom:0;height:60px;z-index:1000;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  background:#193650;border-top:1px solid rgba(255,255,255,.10);
}
.fixed-bottom button{
  min-width:0;height:59px;padding:0 4px;margin:0;border:0;border-radius:0;
  background:transparent;color:#fff;font-family:Arial,"Malgun Gothic",sans-serif;
  font-size:20px;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;
}
.fixed-bottom button+button{border-left:1px solid rgba(255,255,255,.25)}

.settings-panel{
  display:none;position:fixed;z-index:1100;top:75px;right:12px;width:300px;
  max-width:calc(100vw - 24px);padding:14px;border:1px solid #ddd;
  border-radius:16px;background:#fff;box-shadow:0 10px 30px #0002;
}
.settings-panel.show{display:block}
.setting-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.settings-panel button{
  padding:12px;border:1px solid #ddd;border-radius:10px;
  background:#f5f5f5;font-size:16px;font-weight:700;
}
.font-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  align-items:center;text-align:center;
}
.loading,.error,.empty{text-align:center;padding:28px 10px;color:#555}
.error{color:#b00020;white-space:pre-wrap}

body.dark-mode{background:#202124;color:#FFFFFF}
body.dark-mode .program-card{background:#303134;border-color:#555}
body.dark-mode .opening-row,
body.dark-mode .program-line,
body.dark-mode .subline{border-color:#50545a}

body.dark-mode #content,
body.dark-mode #content *{
  color:#FFFFFF !important;
}
body.dark-mode .settings-panel{background:#303134;color:#f1f3f4;border-color:#555}
body.dark-mode .settings-panel button{
  background:#202124;color:#f1f3f4;border-color:#555;
}

@media(max-width:520px){
  .page{padding:10px 5px 15px}
  .program-card{padding:12px;border-width:5px;border-radius:16px}
  .date-title{margin:4px 0 16px;padding:12px 8px;font-size:25px}
  .section-title{font-size:25px}
  .opening-row{
    grid-template-columns:65px minmax(0,1fr) auto;
    gap:5px;font-size:calc(12px * var(--scale));
  }
  .program-line{gap:5px;padding:7px 2px}
  .program-name{white-space:normal}
}
  
/* =========================================================
   특별 행사 카드
========================================================= */

.special-event-card {
  width: 100%;
  box-sizing: border-box;
  padding: 18px;
  margin-bottom: 16px;
  border: 1px solid #d5dce5;
  border-radius: 12px;
  background: #ffffff;
  color: #243b53;
  text-align: center;
}

.special-event-date {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
}

.special-event-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 12px;
}

.special-event-theme {
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 14px;
}

.special-event-place {
  font-size: 16px;
  font-weight: 600;
}

.special-event-place a {
  color: #1769aa;
  text-decoration: underline;
}
  
</style>
</head>

<body>
<header class="fixed-header">
  <button type="button" class="top-button back-button"
    onclick="location.href='index.html'" aria-label="홈으로">‹</button>
  <div class="main-title">북부회중 게시판</div>
  <button type="button" class="top-button settings-button"
    onclick="toggleSettings()" aria-label="설정">⚙</button>
</header>

<main class="page">
  <div id="content">
    <div class="loading">생봉 일정을 불러오는 중입니다...</div>
  </div>
</main>

<nav class="fixed-bottom">
  <button type="button" onclick="goBoardPage('publicTalk')">
    공개강연
  </button>

  <button type="button" onclick="goBoardPage('ministry')">
    생활과봉사
  </button>

  <button type="button" onclick="goBoardPage('groups')">
    집단및부서
  </button>
</nav>

<div id="settingsPanel" class="settings-panel">
  <div class="setting-row">
    <button onclick="setTheme(false)">☀ 밝게</button>
    <button onclick="setTheme(true)">🌙 어둡게</button>
  </div>
  <div class="font-row">
    <button onclick="changeFont(-10)">−</button>
    <strong id="fontSize">100%</strong>
    <button onclick="changeFont(10)">＋</button>
  </div>
</div>

<script>
/* 생봉 Apps Script 웹 앱 URL */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx44HBK4VnofM1gVLJ8g9TeSAvELSE5P5bF6vxGmkbSl_lqx3Zk1RF_ArzP-ZfSQuTX/exec";

let fontPercent = Number(localStorage.getItem("lifeBoardFont") || 100);

function toggleSettings(){
  document.getElementById("settingsPanel").classList.toggle("show");
}

function setTheme(dark){
  document.body.classList.toggle("dark-mode",dark);
  localStorage.setItem("northBoardTheme",dark?"dark":"light");
}

function changeFont(amount){
  fontPercent=Math.max(80,Math.min(150,fontPercent+amount));
  document.documentElement.style.setProperty("--scale",fontPercent/100);
  document.getElementById("fontSize").textContent=fontPercent+"%";
  localStorage.setItem("lifeBoardFont",String(fontPercent));
}

/* =====================================================
   게시판 페이지 이동
===================================================== */

async function goBoardPage(section) {
  try {
    const response = await fetch(
      "게시판-공강.html",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("주소 설정을 읽지 못했습니다.");
    }

    const html = await response.text();

    const doc = new DOMParser().parseFromString(
      html,
      "text/html"
    );

    const configElement =
      doc.getElementById("board-url-config");

    if (!configElement) {
      throw new Error("주소 설정을 찾지 못했습니다.");
    }

    const boardUrls = JSON.parse(
      configElement.textContent
    );

    if (!boardUrls[section]) {
      throw new Error("해당 페이지 주소가 없습니다.");
    }

    window.location.href = boardUrls[section];

  } catch (error) {
    alert("페이지 이동에 실패했습니다. 다시 시도해 주세요.");
    console.error(error);
  }
}

(function restoreSettings(){
  setTheme(localStorage.getItem("northBoardTheme")==="dark");
  fontPercent=Math.max(80,Math.min(150,fontPercent));
  document.documentElement.style.setProperty("--scale",fontPercent/100);
  document.getElementById("fontSize").textContent=fontPercent+"%";
})();

function loadSchedule(){
  if(!SCRIPT_URL.startsWith("https://script.google.com/")){
    document.getElementById("content").innerHTML=
      '<div class="error">앱스스크립트를 배포한 뒤 SCRIPT_URL에 웹 앱 URL을 입력해 주세요.</div>';
    return;
  }

  const old=document.getElementById("scheduleJsonp");
  if(old)old.remove();

  const script=document.createElement("script");
  script.id="scheduleJsonp";
  script.onerror=()=>showError("앱스스크립트에 연결하지 못했습니다. 배포 권한과 URL을 확인해 주세요.");
  script.src=SCRIPT_URL+"?prefix=receiveSchedule&t="+Date.now();
  document.body.appendChild(script);

  window.scheduleTimer=setTimeout(
    ()=>showError("응답 시간이 초과되었습니다. 앱스스크립트 배포를 확인해 주세요."),
    20000
  );
}

function receiveSchedule(data){
  clearTimeout(window.scheduleTimer);
  if(!data||!Array.isArray(data.schedules)){
    showError("서버에서 받은 데이터 형식이 올바르지 않습니다.");
    return;
  }
  renderSchedule(data);
}

function showError(message){
  document.getElementById("content").innerHTML="";
  const d=document.createElement("div");
  d.className="error";
  d.textContent=message;
  document.getElementById("content").appendChild(d);
}

function cell(row,index){
  const cells = Array.isArray(row) ? row : (row.cells || []);
  return String(cells[index] || "").trim();
}

function line(text,name="",cls=""){
  const el=document.createElement("div");
  el.className="program-line";

  const t=document.createElement("div");
  t.className="program-text "+cls;
  t.textContent=text||"";
  el.appendChild(t);

  if(name){
    const n=document.createElement("div");
    n.className="program-name "+cls;
    n.textContent=name;
    el.appendChild(n);
  }
  return el;
}

function subline(left,right){
  const el=document.createElement("div");
  el.className="subline";

  const a=document.createElement("span");
  a.textContent=left||"";

  const b=document.createElement("span");
  b.className="person";
  b.textContent=right||"";

  el.append(a,b);
  return el;
}

function section(card,title,cls,buttonNote){
  const h=document.createElement("div");
  h.className="section-title "+cls;

  const icon=document.createElement("span");
  icon.className="section-icon "+cls;

  const icons={
    blue:`
      <svg viewBox="0 0 28 30" aria-hidden="true">
        <path d="M5 3.5H23L27 10 14 27 1 10Z
                 M5 3.5 9 10 14 27 19 10 23 3.5
                 M1 10H27 M9 10 14 3.5 19 10"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linejoin="round"/>
      </svg>`,
    orange:`
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.8"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 58V9"/>
          <path d="M30 14C25 13 20 8 22 4C27 5 31 9 30 14Z"/>
          <path d="M30 24C23 24 17 19 17 14C24 14 29 18 30 24Z"/>
          <path d="M30 35C22 35 15 30 15 25C23 25 29 29 30 35Z"/>
          <path d="M30 46C22 46 17 41 17 36C24 36 29 40 30 46Z"/>
          <path d="M34 19C41 18 46 13 44 8C38 9 34 13 34 19Z"/>
          <path d="M34 30C42 29 48 24 48 19C40 20 35 24 34 30Z"/>
          <path d="M34 41C42 40 49 35 49 30C41 31 35 35 34 41Z"/>
          <path d="M34 51C41 50 46 45 46 40C39 41 35 45 34 51Z"/>
          <path d="M32 54L24 48 M32 48L40 42"/>
        </g>
      </svg>`,
    green:`
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#fff" stroke-width="2.8"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 27C14 21 20 19 27 19C34 19 39 22 43 20
                   L49 13C51 10 55 11 57 14L59 17L56 20L52 20
                   L51 29C51 32 49 35 46 37L44 43L47 53L39 53
                   L36 43L24 43L21 53L13 53L16 39C12 38 11 35
                   12 31Z"/>
          <path d="M52 20Q54 17 56 16"/>
          <path d="M24 43L28 53L21 53 M36 43L34 53L39 53"/>
        </g>
      </svg>`
  };

  icon.innerHTML=icons[cls]||"";
  h.appendChild(icon);

  const label=document.createElement("span");
    label.textContent=title;
  h.appendChild(label);
  card.appendChild(h);

}

/* =========================================================
   특별 행사 표시
========================================================= */

function renderSpecialEvent(event) {

  if (!event || !event.title) {
    return "";
  }

  const escapeHtml = value =>
    String(value || "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);

  const mapUrl =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(event.place || "");

  return `
    <div class="special-event-card">
      <div class="special-event-date">
        ${escapeHtml(event.date)}
      </div>

      <div class="special-event-title">
        ${escapeHtml(event.title)}
      </div>

      <div class="special-event-theme">
        ${escapeHtml(event.theme)}
      </div>

      <div class="special-event-place">
        📍 <a
          href="${mapUrl}"
          target="_blank"
          rel="noopener noreferrer"
        >${escapeHtml(event.place)}</a>
      </div>
    </div>
  `;
}

function renderSchedule(data) {
  const content=document.getElementById("content");
  content.innerHTML="";

  const heading=document.createElement("h2");
  heading.className="schedule-heading";
  heading.textContent=data.title||"";
  content.appendChild(heading);

  const subtitle=document.createElement("div");
  subtitle.className="schedule-subtitle";
  subtitle.textContent=data.subtitle||"";
  content.appendChild(subtitle);

  // 특별 행사 표시
  const specialEventHtml = renderSpecialEvent(data.specialEvent);

  if (specialEventHtml) {
    content.insertAdjacentHTML("beforeend", specialEventHtml);
  }

  const schedules=data.schedules;
  const today=new Date();
  today.setHours(0,0,0,0);

   // 토요일부터 금요일까지를 한 주간으로 표시
  // 토요일~화요일은 해당 주 화요일,
  // 수요일~금요일은 다음 주 화요일을 기준으로 표시
  const day = today.getDay(); // 일요일 0, 토요일 6

  const daysToAdd =
    day === 6 ? 3 :
    day === 0 ? 2 :
    day === 1 ? 1 :
    day === 2 ? 0 :
    9 - day;

  const targetTuesday = new Date(today);
  targetTuesday.setDate(today.getDate() + daysToAdd);

// 기준 화요일부터 8주간의 계획표 표시 (이번 주 포함)
const endDate = new Date(targetTuesday);
endDate.setDate(endDate.getDate() + 7 * 7);

// 일정 필터링 후 날짜가 빠른 순서대로 정렬
const items = schedules.filter(x => {
  const date = new Date(
    Number(x.year),
    Number(x.month) - 1,
    Number(x.day)
  );

  date.setHours(0, 0, 0, 0);

  return date >= targetTuesday && date <= endDate;
});

items.sort((a, b) => {
  const dateA = new Date(
    Number(a.year),
    Number(a.month) - 1,
    Number(a.day)
  );

  const dateB = new Date(
    Number(b.year),
    Number(b.month) - 1,
    Number(b.day)
  );

  return dateA - dateB;
});
  
if(!items.length){

    if (!data.specialEvent || !data.specialEvent.title) {
      content.innerHTML =
        '<div class="empty">표시할 생봉 일정이 없습니다.</div>';
    }

    return;
  }
  items.forEach(item=>{
    const c=item.cells||[];
    
console.log("일정 원본 데이터:", item.cells);
console.log("사회자 C열:", item.cells[1]);
console.log("시작 기도 D열:", item.cells[2]);
console.log("연사 F열:", item.cells[4]);
    
    const card=document.createElement("section");
    card.className="program-card";

       const date=document.createElement("h2");
    date.className="date-title";
    date.textContent=item.year+"년 "+item.month+"월 "+item.day+"일 ("+item.weekday+")";

    // 이번 주 월요일부터 일요일까지 날짜 배경색 변경
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const day = today.getDay();
    const thisMonday = new Date(today);

    thisMonday.setDate(
      today.getDate() - (day === 0 ? 6 : day - 1)
    );

    const nextMonday = new Date(thisMonday);
    nextMonday.setDate(thisMonday.getDate() + 7);

    const scheduleDate = new Date(
      Number(item.year),
      Number(item.month) - 1,
      Number(item.day)
    );
    scheduleDate.setHours(0, 0, 0, 0);

    if (scheduleDate >= thisMonday && scheduleDate < nextMonday) {
      date.style.setProperty("background", "#294F70", "important");
    }

    card.appendChild(date);

    function openingRow(label,name){
      const row=document.createElement("div");
      row.className="opening-row";

      const role=document.createElement("div");
      role.className="role";
      role.textContent=label;

      const spacer=document.createElement("div");

      const value=document.createElement("div");
      value.className="name";
      value.textContent=name||"";

      row.append(role,spacer,value);
      return row;
    }

// 사회자와 시작 기도
function openingRow(label,name){
  const row = document.createElement("div");
  row.className = "opening-row";
  row.style.cssText =
    "display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;";

  const role = document.createElement("div");
  role.className = "role";
  role.textContent = label;
  role.style.cssText = "font-size:15px;color:#777;text-align:left;";

  const value = document.createElement("div");
  value.className = "name";
  value.textContent = name || "";
  value.style.cssText =
    "font-size:22px;color:#222;font-weight:800;text-align:right;";

  row.append(role,value);
  return row;
}

card.appendChild(openingRow("사회자",cell(c,1)));
card.appendChild(openingRow("시작 기도",cell(c,2)));

console.log(
  "사회자 이름:",
  card.querySelector(".opening-row .name")?.textContent
);

console.log(
  "시작 기도 이름:",
  card.querySelectorAll(".opening-row .name")[1]?.textContent
);
    
console.log(
  "사회자 표시 내용:",
  card.querySelector(".opening-row .name")?.textContent
);

console.log(
  "연사 표시 내용:",
  card.querySelector(".program-name")?.textContent
);
