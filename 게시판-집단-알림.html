<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>알림</title>

  <style>

/* =====================================
   상단 고정 메뉴
===================================== */
.fixed-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;

  height: 70px;
  padding: 0 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: #193650;
  color: #ffffff;

  box-sizing: border-box;
  z-index: 1000;
}

/* 상단 버튼 공통 */
.top-button {
  width: 32px;
  height: 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  background: #193650;
  color: #ffffff;

  border: 1px solid #8ba4b8;
  border-radius: 5px;

  cursor: pointer;
  box-sizing: border-box;
}

/* 뒤로가기 버튼 */
.back-button {
  font-size: 25px;
  font-weight: 400;
}

/* 가운데 제목 */
.main-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  color: #ffffff;

  font-size: 18px;
  font-weight: 800;

  white-space: nowrap;
}

/* 설정 버튼 */
.settings-button {
  font-size: 17px;
  font-weight: 700;
}

  </style>
</head>

<body>

  <header class="fixed-header">

    <!-- 뒤로가기 -->
    <button type="button"
      class="top-button back-button"
      onclick="history.back()"
      aria-label="뒤로가기">‹</button>

    <!-- 가운데 제목 -->
    <div class="main-title">알림</div>

    <!-- 설정 -->
    <button type="button"
      class="top-button settings-button"
      onclick="toggleSettings()"
      aria-label="설정">⚙</button>

  </header>

  <main id="content">
    <!-- 기존 알림 내용 -->
  </main>

</body>
</html>
