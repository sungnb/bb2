<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>북부회중 게시판</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
      background: #f3f4f6;
    }

    .page {
      width: 100%;
      margin: 0;
      background: white;
      min-height: 100vh;

    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 62px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: #193650;
      color: #fff;
      text-align: center;
    }

    .main-title {
      margin: 0;
      padding: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 40px;
      white-space: nowrap;
    }

    .top-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px;
      background: transparent;
      color: white;
      font-size: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .back-button { left: 10px; }
    .settings-button { right: 10px; }

    #content {
      width: 100%;
      padding: 18px 10px 24px;
    }

    /* 본문 공통 */
    .section-card {
      margin: 0 0 18px;
      padding: 16px 12px;
      border: 1px solid #d8e0e8;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 10px rgba(20,45,70,.06);
      overflow: hidden;
    }

    .section-title {
      margin: 0 0 14px;
      padding: 0 0 10px;
      border-bottom: 2px solid #193650;
      color: #193650;
      font-size: 1.15em;
      font-weight: 800;
    }


/* 야외 봉사 일정: 테두리와 간격 */
#content > .section-card:has(.schedule-table) {
  margin-top: 15px;
  padding: 0;
  border: 5px solid #AEB6BF;
  border-radius: 12px;
  box-shadow: none;
  overflow: hidden;
}

/* 회중 인원 통계: 집단 박스와 동일한 테두리 */
#content > .section-card:has(.stats-grid) {
  margin-top: 15px;
  border: 5px solid #AEB6BF;
  border-radius: 12px;
  box-shadow: none;
  overflow: hidden;
}

#content > .section-card:has(.schedule-table) .section-title {
  margin: 0;
  padding: 18px 8px;
  border-bottom: 2px solid #193650;
  color: #193650;
  text-align: center;
  font-size: 1.25em;
  font-weight: 900;
}

#content > .section-card:has(.stats-grid) .section-title {
  margin: 0;
  padding: 18px 8px;
  border-bottom: 2px solid #193650;
  color: #193650;
  text-align: center;
  font-size: 1.25em;
  font-weight: 900;
}

#content > .section-card:has(.stats-grid) .stats-grid {
  display: flex;
  flex-direction: column;
  gap: 0;
}

#content > .section-card:has(.stats-grid) .stat-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-width: 0;
  min-height: 52px;
  padding: 12px 10px;
  border: none;
  border-bottom: 1px solid #193650;
  border-radius: 0;
  background: transparent;
  text-align: left;
}

/* 세로 구분선 제거 */
#content > .section-card:has(.stats-grid) .stat-item:nth-child(odd) {
  border-right: none;
}

/* 마지막 항목의 아래쪽 선 제거 */
#content > .section-card:has(.stats-grid) .stat-item:last-child {
  border-bottom: none;
}

#content > .section-card:has(.stats-grid) .stat-label {
  margin: 0;
  color: #193650;
  font-size: 1em;
  font-weight: 700;
  overflow-wrap: anywhere;
}

#content > .section-card:has(.stats-grid) .stat-value {
  flex-shrink: 0;
  color: #193650;
  font-size: 1.1em;
  font-weight: 900;
  white-space: nowrap;
}

    
    .group-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  margin-bottom: 14px;
  padding: 0 4px;
  font-size: 1.15em;
  font-weight: 800;
  color: #193650;
}
    
    .group-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
}

.group-card {
  min-width: 0;
  padding: 12px 9px;
  border: 5px solid #AEB6BF;
  border-radius: 12px;

}

    .group-title {

}

.group-leader {

.group-leader-side {

.group-leader-side.right {

}

    .member-list {

    .stats-grid {

.stat-item {

}

   .subsection-title {

  font-weight: 800;
}

    .fixed-bottom {

    .settings-panel {
      display: none;

      padding: 17px;

<body>
  <div class="page">

    <header class="fixed-header">
      <button type="button"
        class="top-button back-button"
        onclick="location.href='index.html'"
        aria-label="홈으로">‹</button>

      <div class="main-title">북부회중 게시판</div>

      <button type="button"
        class="top-button settings-button"
        onclick="toggleSettings()"
        aria-label="설정">⚙</button>
    </header>

    <main id="content">
      <div class="loading-message">
        집단 및 부서 자료를 불러오는 중입니다...
      </div>
    </main>

 <nav class="fixed-bottom">
  <button type="button" onclick="goBoardPage('publicTalk')">
    공개강연
  </button>

  <button type="button" onclick="goBoardPage('ministry')">
    생활과봉사
  </button>

  <button type="button" onclick="goBoardPage('groups')">
    집단및부서
  </button>
</nav>
  </div>

  <div id="settingsPanel" class="settings-panel">
    <div class="settings-theme-row">
      <button type="button" id="lightBtn"
        class="theme-btn" onclick="setTheme('light')">
        ☀ 밝게
      </button>
      <button type="button" id="darkBtn"
        class="theme-btn" onclick="setTheme('dark')">
        🌙 어둡게
      </button>
    </div>

    <div class="settings-font-row">
      <button type="button" class="font-btn"
        onclick="changeFont(-10)" aria-label="글자 작게">−</button>
      <div id="fontSize" class="font-size">120%</div>
      <button type="button" class="font-btn"
        onclick="changeFont(10)" aria-label="글자 크게">＋</button>
    </div>
  </div>

  <script>
    /*
     * 집단 데이터 Apps Script 웹앱 주소
     * Apps Script의 doGet()이 JSON 배열을 반환해야 합니다.
     */
    const GROUP_DATA_URL =
      "https://script.google.com/macros/s/AKfycbxbD0uW23kBcuvsBH7ZtVsHCNURPn6mrz2SHhmaQrocxmw-2JtCKVF6H9Mjw4SVAMgf/exec";

    function toggleSettings() {
      document.getElementById("settingsPanel")
        .classList.toggle("show");
    }

    function setTheme(theme) {
      const isLight = theme === "light";
      const panel = document.getElementById("settingsPanel");

      document.body.classList.toggle("dark-mode", !isLight);
      document.body.style.background =
        isLight ? "#f3f4f6" : "#202124";
      document.body.style.color =
        isLight ? "#222" : "#f1f3f4";

      document.querySelector(".page").style.background =
        isLight ? "#fff" : "#303134";

      panel.classList.toggle("dark-mode", !isLight);

      document.getElementById("lightBtn")
        .classList.toggle("active", isLight);
      document.getElementById("darkBtn")
        .classList.toggle("active", !isLight);

      localStorage.setItem("northBoardTheme", theme);
    }

    let fontPercent = 120;

    function setFontPercent(percent) {
      fontPercent = Math.max(80, Math.min(150, percent));

      document.getElementById("fontSize").textContent =
        fontPercent + "%";

      document.getElementById("content").style.fontSize =
        fontPercent + "%";

      localStorage.setItem(
        "northBoardFontPercent",
        String(fontPercent)
      );
    }

       function changeFont(amount) {
      setFontPercent(fontPercent + amount);
    }

    /* =====================================================
       게시판 페이지 이동
    ===================================================== */

    async function goBoardPage(section) {
      try {
        const response = await fetch(
          "게시판-공강.html",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("주소 설정을 읽지 못했습니다.");
        }

        const html = await response.text();

        const doc = new DOMParser().parseFromString(
          html,
          "text/html"
        );

        const configElement =
          doc.getElementById("board-url-config");

        if (!configElement) {
          throw new Error("주소 설정을 찾지 못했습니다.");
        }

        const boardUrls = JSON.parse(
          configElement.textContent
        );

        if (!boardUrls[section]) {
          throw new Error("해당 페이지 주소가 없습니다.");
        }

        window.location.href = boardUrls[section];

      } catch (error) {
        alert("페이지 이동에 실패했습니다. 다시 시도해 주세요.");
        console.error(error);
      }
    }

    (function restoreSettings() {
      const savedTheme = localStorage.getItem("northBoardTheme");
      const savedFont = Number(
        localStorage.getItem("northBoardFontPercent")
      );

      setTheme(savedTheme === "light" ? "light" : "dark");

      setFontPercent(
        Number.isFinite(savedFont) &&
        savedFont >= 80 &&
        savedFont <= 150
          ? savedFont
          : 120
      );
    })();

    function clean(value) {
      return String(value == null ? "" : value)
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeHTML(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function cell(row, index) {
      return clean(row && row[index]);
    }

    function findRow(data, phrase) {
      return data.findIndex(row =>
        row.some(value => clean(value).includes(phrase))
      );
    }

    function firstNonEmpty(row) {
      return row.find(value => clean(value) !== "") || "";
    }

    function section(title, body) {
      return `
        <section class="section-card">
          <h2 class="section-title">${escapeHTML(title)}</h2>
          ${body}
        </section>`;
    }

    function renderGroups(data) {
      const headerIndex = findRow(data, "집 단 명");

      if (headerIndex < 0) return "";

      const header = data[headerIndex];
      const groupColumns = [];

      header.forEach((value, index) => {
        const name = clean(value);
        if (/^[A-D]집단$/.test(name)) {
          groupColumns.push({
            name,
            index
          });
        }
      });

      if (!groupColumns.length) return "";

      const endIndex = data.findIndex((row, index) =>
        index > headerIndex &&
        row.some(value => clean(value).includes("전도인"))
      );

      const stop = endIndex > headerIndex ? endIndex : data.length;
      const groups = groupColumns.map(group => ({
        name: group.name,
        index: group.index,
        supervisor: "",
        assistant: "",
        members: []
      }));

   
      for (let r = headerIndex + 1; r < stop; r++) {
        const row = data[r];
        const label = row.map(clean).join(" ");

        groups.forEach(group => {
          const name = cell(row, group.index);

          const marks = [
            cell(row, group.index + 2),
            cell(row, group.index + 3)
          ].filter(Boolean);

          if (!name) return;

          if (label.includes("집단 감독자")) {
            group.supervisor = name + (marks.length
              ? " (" + marks.join(", ") + ")"
              : "");
            return;
          }

          if (label.includes("집단 보조자")) {
            group.assistant = name + (marks.length
              ? " (" + marks.join(", ") + ")"
              : "");
            return;
          }

          // 통계 행은 일반 명단에서 제외
          if (
            /^(형제|자매|전도인)\s*:/.test(name) ||
            /^(P|E|M|SP|CO)\s*:/.test(name) ||
            /^\d+\s*명$/.test(name)
          ) {
            return;
          }

          // 실제 이름만 수집하고 표시를 유지
          group.members.push({
            name,
            marks
          });
        });
      }

      // 일반 명단을 가나다순으로 정렬
      groups.forEach(group => {
        group.members.sort((a, b) =>
          a.name.localeCompare(b.name, "ko")
        );
      });


      const html = groups.map(group => `
        <div class="group-card">
          <div class="group-title">
            ${escapeHTML(group.name)}
            <span style="float:right;font-size:.8em;font-weight:400;color:#53677a">
              ${group.members.length +
  (group.supervisor ? 1 : 0) +
  (group.assistant ? 1 : 0)}명
            </span>
          </div>

          <div class="group-leader">
            <div class="group-leader-side">
              <strong style="display:inline">감독자</strong>
              ${escapeHTML(group.supervisor || "자료 없음")}
            </div>

            <div class="group-leader-side right">
              <strong style="display:inline">보조자</strong>
              ${escapeHTML(group.assistant || "자료 없음")}
            </div>
          </div>

          <div class="member-list">
            ${group.members.length
              ? group.members.map(member => `
                <span class="member-chip">
                  ${escapeHTML(member.name)}
                  ${member.marks.length
                    ? `<span class="member-mark">${escapeHTML(member.marks.join(" · "))}</span>`
                    : ""}
                </span>
              `).join("")
              : `<span class="empty-message">명단이 없습니다.</span>`
            }
          </div>
        </div>
      `).join("");

      const totalMembers = groups.reduce(
  (total, group) =>
    total +
    group.members.length +
    (group.supervisor ? 1 : 0) +
    (group.assistant ? 1 : 0),
  0
);

      return `
        <div class="group-heading">
          <span>야외 봉사 집단</span>
          <span>${totalMembers}명</span>
        </div>
        <div class="group-grid">${html}</div>
      `;
    }

  
function renderStats(data) {
  function getCell(rowIndex, colIndex) {
    return cell(data[rowIndex] || [], colIndex);
  }

  // E, E · P, E · CO처럼 다른 표시와 함께 있어도 인식합니다.
  function hasMark(values, target) {
    return values.some(value =>
      new RegExp("(^|[^A-Z])" + target + "([^A-Z]|$)", "i")
        .test(clean(value))
    );
  }

  const brotherCount = getCell(8, 3);    // D9
  const sisterCount = getCell(19, 3);    // D20
  const publisherCount = getCell(33, 3); // D34
  const pioneerCount = getCell(34, 2);  // C35

  const headerIndex = findRow(data, "집 단 명");
  const header = headerIndex >= 0 ? data[headerIndex] : [];
  const groupColumns = [];

  header.forEach((value, index) => {
    if (/^[A-D]집단$/.test(clean(value))) {
      groupColumns.push(index);
    }
  });

  let elderCount = 0;
let servantCount = 0;

// 시트 F6:U13 범위에서 E와 M을 직접 셉니다.
for (let r = 5; r <= 12; r++) {
  for (let c = 5; c <= 20; c++) {
    const value = clean(cell(data[r] || [], c));

    if (value === "E") elderCount++;
    if (value === "M") servantCount++;
  }
}

  const pioneers = Number.parseInt(pioneerCount, 10) || 0;
  const publishers = Number.parseInt(publisherCount, 10) || 0;

  const pioneerRate = publishers > 0
    ? Math.round(pioneers / publishers * 100)
    : 0;

  const stats = [
    { label: "형제 인원", value: brotherCount + "명" },
    { label: "자매 인원", value: sisterCount + "명" },
    { label: "총 전도인", value: publisherCount + "명" },
    { label: "장로", value: elderCount + "명" },
    { label: "봉사의 종", value: servantCount + "명" },
    { label: "파이오니아", value: pioneers + "명" },
    { label: "파이오니아 비율", value: pioneerRate + "%" }
  ];

  return `
    <div class="group-heading">
      <span>회중 인원 통계</span>
    </div>

    <section class="section-card">
      <div class="stats-grid">
        ${stats.map(stat => `
          <div class="stat-item">
            <span class="stat-label">${escapeHTML(stat.label)}</span>
            <span class="stat-value">${escapeHTML(stat.value)}</span>
          </div>
        `).join("")}
      </div>
    </section>
  `;
}
  
function renderService(data) {
  const dayIndex = findRow(data, "요일");
  if (dayIndex < 0) return "";

  const dayRow = data[dayIndex];
  const days = [];

  dayRow.forEach((value, index) => {
    const day = clean(value);

    if (/^(월|화|수|목|금|토|일)$/.test(day)) {
      days.push({ day, index });
    }
  });

  if (!days.length) return "";

  const rows = [];
  let currentType = "";

  for (let r = dayIndex + 1; r < data.length; r++) {
    const row = data[r];
    const first = row.map(clean).join(" ");

    if (first.includes("직책")) break;

    const label = cell(row, 1) || cell(row, 2);

    if (
      label.includes("호별") ||
      label.includes("전시대") ||
      label.includes("ZOOM") ||
      label.includes("줌")
    ) {
      currentType = label.replace(/\s+/g, " ");
    }

    if (!currentType || !/호별/.test(currentType)) continue;

    const subLabel = cell(row, 3) || cell(row, 2);

    if (!["인도자", "시간"].some(key =>
      subLabel.includes(key)
    )) continue;

    days.forEach(day => {
      const value = cell(row, day.index);

      let record = rows.find(item => item.day === day.day);

      if (!record) {
        record = {
          day: day.day,
          leader: "-",
          time: "-"
        };

        rows.push(record);
      }

      if (subLabel.includes("인도자")) {
        record.leader = value || "-";
      }

      if (subLabel.includes("시간")) {
        record.time = value || "-";
      }
    });
  }

  if (!rows.length) return "";

  // 화요일부터 일요일까지 표시합니다.
  const dayOrder = ["화", "수", "목", "금", "토", "일"];

  rows.sort((a, b) =>
    dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day)
  );

  // W38 셀: 배열은 0부터 시작하므로 행 38은 data[37],
  // W열은 열 인덱스 22입니다.
  const meetingPlace = cell(data[37] || [], 22);

  const scheduleHtml = `
    <table class="schedule-table">
      <thead>
        <tr>
          <th>요일</th>
          <th>인도자</th>
          <th>시간</th>
        </tr>
      </thead>

      <tbody>
        ${rows.map(item => `
          <tr>
            <td>${escapeHTML(item.day)}</td>
            <td>${escapeHTML(item.leader)}</td>
            <td>${escapeHTML(item.time)}</td>
          </tr>
        `).join("")}

        <tr>
          <td style="font-weight:700;background:#f7f9fb;">
            모임장소
          </td>
          <td colspan="2">
            ${meetingPlace
              ? `<a
                  href="https://map.naver.com/p/search/${encodeURIComponent(meetingPlace)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="color:#0563c1;text-decoration:underline;font-weight:700;"
                >봉사모임장소</a>`
              : "-"}
          </td>
        </tr>
      </tbody>
    </table>
  `;

  return `
    <div class="group-heading">
      <span>호별 방문</span>
    </div>

    ${section("", scheduleHtml)}
  `;
}
    
    function renderAssignments(data) {
      const headerIndex = findRow(data, "직책");
      if (headerIndex < 0) return "";

      const records = [];
      const notes = [];
      let currentResponsibility = "";

      for (let r = headerIndex + 1; r < data.length; r++) {
        const row = data[r];
        const values = row.map(clean);
        const joined = values.filter(Boolean).join(" ");

        if (!joined) {
          if (records.length) currentResponsibility = "";
          continue;
        }

        if (joined.includes("비고")) {
          for (let n = r + 1; n < data.length; n++) {
            const noteRow = data[n];
            const noteValues = noteRow.map(clean).filter(Boolean);
            if (!noteValues.length) continue;

            const label = noteValues[0];
            const people = noteValues.slice(1).join(" ");
            notes.push(people ? label + "： " + people : label);
          }
          break;
        }

        const responsibility = values.find(value =>
          /책임$/.test(value)
        );

        if (responsibility) {
          currentResponsibility = responsibility;
          records.push({
            responsibility,
            role: "",
            person: "",
            assistant: "",
            heading: true
          });
          continue;
        }

        const role = cell(row, 1) || cell(row, 2);
        const person = cell(row, 4) || cell(row, 5);
        const assistant = cell(row, 6) || cell(row, 7);

        if (!role && !person && !assistant) continue;

        records.push({
          responsibility: currentResponsibility,
          role,
          person,
          assistant,
          heading: false
        });
      }

      if (!records.length && !notes.length) return "";

      let lastResponsibility = "";

      const tableRows = records.map(record => {
        if (record.heading) {
          lastResponsibility = record.responsibility;
          return `
            <tr>
              <th colspan="3">${escapeHTML(record.responsibility)}</th>
            </tr>`;
        }

        return `
          <tr>
            <td>${escapeHTML(record.role || "-")}</td>
            <td>${escapeHTML(record.person || "-")}</td>
            <td>${escapeHTML(record.assistant || "-")}</td>
          </tr>`;
      }).join("");

      return section(
        "조직 부서 임명",
        `<table class="assignment-table">
          <thead>
            <tr>
              <th>직책</th>
              <th>담당</th>
              <th>보조</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
        ${notes.length ? `
          <div class="subsection-title">비고</div>
          <ul class="note-list">
            ${notes.map(note => `<li>${escapeHTML(note)}</li>`).join("")}
          </ul>
        ` : ""}`
      );
    }

    function renderPage(data) {
      if (!Array.isArray(data) || !data.length) {
        throw new Error("스프레드시트에서 데이터가 반환되지 않았습니다.");
      }

      const html = [
        renderGroups(data),
        renderStats(data),
        renderService(data),
        renderAssignments(data)
      ].filter(Boolean).join("");

      if (!html) {
        throw new Error(
          "자료를 받았지만 집단·일정·부서 항목을 찾지 못했습니다. 시트 구조를 확인해야 합니다."
        );
      }

   
      document.getElementById("content").innerHTML = html;

    }

    async function loadGroupData() {
      const content = document.getElementById("content");

      content.innerHTML =
        '<div class="loading-message">집단 및 부서 자료를 불러오는 중입니다...</div>';

      try {
        const response = await fetch(GROUP_DATA_URL, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("웹앱 응답 오류: " + response.status);
        }

        const text = await response.text();
        let data;

        try {
          data = JSON.parse(text);
        } catch (error) {
          throw new Error(
            "웹앱이 JSON 자료를 반환하지 않았습니다. Apps Script 배포 상태를 확인해 주세요."
          );
        }

        renderPage(data);
      } catch (error) {
        console.error("집단 자료 불러오기 오류:", error);

        content.innerHTML = `
          <section class="section-card">
            <h2 class="section-title">자료를 불러오지 못했습니다</h2>
            <div class="error-message">
              ${escapeHTML(error.message || "연결 오류가 발생했습니다.")}
              <br><br>
              Apps Script 웹앱의 배포 상태와 접근 권한,
              JSON 반환 여부를 확인해 주세요.
            </div>
            <button class="refresh-button" type="button"
              onclick="loadGroupData()">다시 시도</button>
          </section>`;
      }
    }

    loadGroupData();
  </script>
</body>
</html>
