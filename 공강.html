<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
      background: #f3f4f6;
    }

 .page {
  max-width: 1200px;
  margin: 0 auto;
  background: white;
  min-height: 100vh;
  box-shadow: 0 0 8px #ccc;
  padding-top: 62px;
}

/* =========================
   상단 고정 영역
   개인봉사와 동일한 크기 기준
========================= */
.fixed-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 62px;
  box-sizing: border-box;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 10px 14px;
  background: #18324a;
  color: #fff;
  text-align: center;
  border-bottom: 0;
}

/* 상단 제목 */
.main-title {
  margin: 0;
  padding: 0;

  font-size: 30px;
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 40px;
  white-space: nowrap;
}

/* 뒤로가기·설정 버튼 */
.top-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  box-sizing: border-box;

  border: 1px solid rgba(255,255,255,.35);
  border-radius: 12px;
  background: #234563;
  color: #fff;

  font-size: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* 뒤로가기 버튼 */
.back-button {
  left: 14px;
}

/* 설정 버튼 */
.settings-button {
  right: 14px;
}

/* =========================
   하단 메뉴 고정
   화요일 구역과 동일한 방식
========================= */

.fixed-bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;

  height: 60px;
  z-index: 1000;

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

  background: #18324a;
  border-top: 1px solid rgba(255, 255, 255, .10);
}

/* 하단 메뉴 버튼 */
.fixed-bottom button {
  min-width: 0;
  height: 59px;
  box-sizing: border-box;

  padding: 0 4px;
  margin: 0;

  border: 0;
  border-radius: 0;

  background: transparent;
  color: #fff;

  font-family: Arial, "Malgun Gothic", sans-serif;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;

  cursor: pointer;
}

/* 메뉴 사이 구분선 */
.fixed-bottom button + button {
  border-left: 1px solid rgba(255, 255, 255, .25);
}

/* 본문이 하단 메뉴에 가려지지 않도록 여백 확보 */

#content {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  padding: 20px 12px 80px;
  overflow-x: hidden;
}

#content > h2:first-child {
  margin-top: 0;
}

/* 공개강연 전체 박스 */
.public-talk-box {
  width: 100%;
  max-width: 680px;
  min-width: 0;
  margin: 0 auto;
  padding: 16px;
  border: 1px solid #cccccc;
  border-radius: 18px;
  box-sizing: border-box;
}

/* 박스 안 날짜 제목 */
.public-talk-box h3 {
  margin: 12px 0 20px;
  text-align: center;
  overflow-wrap: anywhere;
}

/* 박스 안 표 */
.public-talk-box table {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  table-layout: fixed;
  border-collapse: collapse;
  overflow-wrap: anywhere;
}

/* 표 셀 */
.public-talk-box th,
.public-talk-box td {
  padding: 12px 8px;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
  word-break: normal;
}

.public-talk-box th {
  width: 36%;
}

/* 휴대폰 화면 */
@media (max-width: 600px) {
  #content {
    padding: 12px 8px 75px;
  }

  .public-talk-box {
    padding: 10px;
    border-radius: 16px;
  }

  .public-talk-box th,
  .public-talk-box td {
    padding: 10px 6px;
    font-size: 14px;
  }
}

@media (max-width: 600px) {
  body {
    padding: 0;
  }

  .subtitle {
    font-size: 13px;
  }

 #content {
  padding: 25px 5px 80px;
}

  table {
    min-width: 680px;
    font-size: 12px;
  }

  th, td {
    padding: 7px 4px;
  }

  .month-title {
    font-size: 15px;
  }
}
    
    .month-section {
      margin-bottom: 28px;
    }

    .month-title {
      background: #9e9e9e;
      color: white;
      padding: 9px;
      margin: 0;
      font-size: 17px;
      text-align: left;
    }

    .table-wrap {
      overflow-x: auto;
      width: 100%;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #555;
      padding: 7px 4px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    th {
      background: #9e9e9e;
      color: white;
      font-weight: bold;
    }

    th:nth-child(1) { width: 12%; }
    th:nth-child(2) { width: 12%; }
    th:nth-child(3) { width: 14%; }
    th:nth-child(4) { width: 28%; }
    th:nth-child(5) { width: 12%; }
    th:nth-child(6) { width: 11%; }
    th:nth-child(7) { width: 11%; }

    td:nth-child(1) {
      font-weight: bold;
      white-space: nowrap;
    }

    td:nth-child(4) {
      text-align: left;
    }

    .loading, .empty, .error {
      padding: 30px 10px;
      text-align: center;
      color: #666;
    }

    .error {
      color: #c62828;
    }

    
    /* 상단 뒤로가기 및 설정 버튼 */
    .top-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px;
      background: transparent;
      color: white;
      font-size: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .back-button {
      left: 10px;
    }

    .settings-button {
      right: 10px;
    }


/* =========================
   설정창
========================= */

.settings-panel {
  display: none;
  position: fixed;
  top: 85px;
  right: 14px;
  width: 328px;
  max-width: calc(100vw - 20px);
  padding: 17px;
  z-index: 1100;
  border: 1px solid #dedfe5;
  border-radius: 22px;
  background: #ffffff;
  color: #222222;
  box-shadow: 0 14px 32px rgba(0,0,0,.18);
}

.settings-panel.show {
  display: block;
}

/* 테마 버튼 2개 */

.settings-theme-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.theme-btn {
  min-width: 0;
  height: 59px;
  padding: 0 6px;
  border: 1px solid #dce0e7;
  border-radius: 16px;
  background: #f5f6f8;
  color: #222222;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}

.theme-btn.active {
  background: #eeeaff;
  border-color: #7566ff;
  color: #40348d;
}

/* 글자 크기 버튼 3개 */

.settings-font-row {
  display: grid;
  grid-template-columns: 72px 1fr 72px;
  gap: 10px;
  align-items: center;
}

.font-btn,
.font-size {
  height: 59px;
  min-width: 0;
  border: 1px solid #dce0e7;
  border-radius: 16px;
  background: #f5f6f8;
  color: #222222;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
}

.font-btn {
  font-size: 30px;
  cursor: pointer;
}

.font-size {
  font-size: 21px;
}

/* 어두운 테마 */

.settings-panel.dark-mode {
  background: #202020;
  color: #f5f5f5;
  border-color: #404040;
}

.settings-panel.dark-mode .theme-btn,
.settings-panel.dark-mode .font-btn,
.settings-panel.dark-mode .font-size {
  background: #202020;
  color: #eeeeee;
  border-color: #505050;
}

.settings-panel.dark-mode .theme-btn.active {
  background: #302b50;
  border-color: #7566ff;
  color: #ffffff;
}

/* 작은 화면 */

@media (max-width: 360px) {
  .settings-panel {
    right: 10px;
    padding: 12px;
  }

  .settings-font-row {
    grid-template-columns: 58px 1fr 58px;
    gap: 7px;
  }

  .theme-btn {
    font-size: 16px;
  }
}
      
    @media (max-width: 600px) {
      body {
        padding: 0;
      }

        .subtitle {
        font-size: 13px;
      }

      #content {
        padding: 8px 5px 75px;
      }

      table {
        min-width: 680px;
        font-size: 12px;
      }

      th, td {
        padding: 7px 4px;
      }

      .month-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    
<header class="fixed-header">
  <button type="button" class="top-button back-button"
    onclick="history.back()" aria-label="뒤로가기">‹</button>

  <div class="main-title">북부회중 게시판</div>

  <button type="button" class="top-button settings-button"
    onclick="toggleSettings()" aria-label="설정">⚙</button>
</header>


    <main id="content">
      <div class="loading">
        아래의 공개강연 메뉴를 눌러 일정을 확인하세요.
      </div>
    </main>

    <!-- 아래쪽 고정 메뉴 -->
    <nav class="fixed-bottom">
      <button
        type="button"
        onclick="showSection('publicTalk')">
        공개강연
      </button>

      <button
        type="button"
        onclick="showSection('ministry')">
        생활과봉사
      </button>

      <button
        type="button"
        onclick="showSection('groups')">
        집단및부서
      </button>
    </nav>

  </div>

   <!-- 설정창 -->
  <div id="settingsPanel" class="settings-panel">

    <div class="settings-theme-row">

      <button
        type="button"
        id="lightBtn"
        class="theme-btn"
        onclick="setTheme('light')">
        ☀ 밝게
      </button>

      <button
        type="button"
        id="darkBtn"
        class="theme-btn"
        onclick="setTheme('dark')">
        🌙 어둡게
      </button>

    </div>

    <div class="settings-font-row">

      <button
        type="button"
        class="font-btn"
        onclick="changeFont(-10)"
        aria-label="글자 작게">
        −
      </button>

      <div
        id="fontSize"
        class="font-size">
        120%
      </div>

      <button
        type="button"
        class="font-btn"
        onclick="changeFont(10)"
        aria-label="글자 크게">
        ＋
      </button>

    </div>

  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzWePF0JCyDZWrO9SekczdWRzQ1yw-w-Fnu4EKf3c1itOfpzINoUbbgDbm-MkTqqhTCpQ/exec";


    let scheduleTimeout;

    /* 설정창 열기 / 닫기 */
    function toggleSettings() {
      const panel = document.getElementById("settingsPanel");

      if (!panel) return;

      panel.classList.toggle("show");
    }

  
    /* 화면 테마 변경 */
    function setTheme(theme) {
      const isLight = theme === "light";
      const panel = document.getElementById("settingsPanel");
      const lightBtn = document.getElementById("lightBtn");
      const darkBtn = document.getElementById("darkBtn");

      document.body.classList.toggle("light-mode", isLight);
      document.body.classList.toggle("dark-mode", !isLight);

      if (panel) {
        panel.classList.toggle("light-mode", isLight);
        panel.classList.toggle("dark-mode", !isLight);
      }

      if (lightBtn) {
        lightBtn.classList.toggle("active", isLight);
      }

      if (darkBtn) {
        darkBtn.classList.toggle("active", !isLight);
      }

      document.body.style.background = isLight ? "#f3f4f6" : "#202124";
      document.body.style.color = isLight ? "#222222" : "#f1f3f4";

      const page = document.querySelector(".page");
      if (page) {
        page.style.background = isLight ? "#ffffff" : "#303134";
      }

      document.querySelectorAll("table td").forEach(cell => {
        cell.style.background = isLight ? "" : "#303134";
        cell.style.color = isLight ? "" : "#f1f3f4";
      });

      localStorage.setItem("northBoardTheme", theme);
    }

    /* 글자 크기 변경: 기본 120%, 최소 80%, 최대 150% */
    let fontPercent = 120;

    function setFontPercent(percent) {
      fontPercent = Math.max(80, Math.min(150, percent));

      document.documentElement.style.setProperty(
        "--font-scale",
        String(fontPercent / 100)
      );

      const display = document.getElementById("fontSize");
      if (display) {
        display.textContent = fontPercent + "%";
      }

     document.querySelectorAll(
  ".subtitle, #content, table, .month-title"
).forEach(element => {
       
        if (!element.dataset.originalFontSize) {
          element.dataset.originalFontSize =
            parseFloat(getComputedStyle(element).fontSize);
        }

        element.style.fontSize =
          (Number(element.dataset.originalFontSize) * fontPercent / 100) + "px";
      });

      localStorage.setItem("northBoardFontPercent", String(fontPercent));
    }

    function changeFont(amount) {
      setFontPercent(fontPercent + amount);
    }

    /* 저장된 설정 복원 */
    (function restoreSettings() {
      const savedTheme = localStorage.getItem("northBoardTheme");
      const savedFont = Number(
        localStorage.getItem("northBoardFontPercent")
      );

      setTheme(savedTheme === "light" ? "light" : "dark");

      if (Number.isFinite(savedFont) && savedFont >= 80 && savedFont <= 150) {
        setFontPercent(savedFont);
      } else {
        setFontPercent(120);
      }
    })();


    /* =====================================================
       하단 메뉴 선택
    ===================================================== */
    function showSection(section) {
      const content = document.getElementById("content");

      if (section === "publicTalk") {
        loadSchedule();
        return;
      }

      clearTimeout(scheduleTimeout);

      const oldScript = document.getElementById("scheduleJsonp");

      if (oldScript) {
        oldScript.remove();
      }

      content.innerHTML = "";

      const message = document.createElement("div");
      message.className = "loading";

      if (section === "ministry") {
        message.textContent =
          "생활과봉사 내용을 준비 중입니다.";
      } else if (section === "groups") {
        message.textContent =
          "집단및부서 내용을 준비 중입니다.";
      }

      content.appendChild(message);
    }

    /* =====================================================
       공개강연 일정 불러오기
    ===================================================== */
    function loadSchedule() {
      const content = document.getElementById("content");

      content.innerHTML =
        '<div class="loading">공강 일정을 불러오는 중입니다...</div>';

      clearTimeout(scheduleTimeout);

      scheduleTimeout = setTimeout(function() {
        showError({
          message:
            "응답 시간이 초과되었습니다. Apps Script 배포를 확인해 주세요."
        });
      }, 20000);

      const oldScript = document.getElementById("scheduleJsonp");

      if (oldScript) {
        oldScript.remove();
      }

      const script = document.createElement("script");
      script.id = "scheduleJsonp";

      script.onerror = function() {
        clearTimeout(scheduleTimeout);

        showError({
          message: "Apps Script에 연결하지 못했습니다."
        });
      };

      script.src =
        SCRIPT_URL + "?prefix=receiveSchedule&t=" + Date.now();

      document.body.appendChild(script);
    }

    /* =====================================================
       Apps Script 응답 처리
    ===================================================== */
    function receiveSchedule(data) {
      clearTimeout(scheduleTimeout);

      if (!Array.isArray(data)) {
        showError({
          message: "서버에서 받은 데이터 형식이 올바르지 않습니다."
        });

        return;
      }

      renderSchedule(data);
    }

    /* =====================================================
       공개 집회 강연 계획표 표시
    ===================================================== */
    
function renderSchedule(data) {
  const content = document.getElementById("content");
  content.innerHTML = "";

  // 이번 주 토요일 날짜 계산
  const now = new Date();
  const daysUntilSaturday = (6 - now.getDay() + 7) % 7;

  const targetDate = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() + daysUntilSaturday
  );

  const year = targetDate.getFullYear();
  const month = targetDate.getMonth() + 1;
  const day = targetDate.getDate();

  // 시트에서 이번 주 토요일 일정 한 건 찾기
  const item = data.find(row =>
    Number(row.year) === year &&
    Number(row.month) === month &&
    Number(row.day) === day
  );

  const title = document.createElement("h2");
  title.textContent = "공개 집회 강연 계획표";
  title.style.textAlign = "center";
  title.style.marginTop = "0";
  content.appendChild(title);

  const subtitle = document.createElement("div");
  subtitle.textContent = "토요일 오후 7:30";
  subtitle.style.textAlign = "center";
  subtitle.style.fontWeight = "bold";
  subtitle.style.marginBottom = "20px";
  content.appendChild(subtitle);

  if (!item) {
    const message = document.createElement("div");
    message.className = "empty";
    message.textContent =
      year + "년 " + month + "월 " + day +
      "일 일정이 시트에 없습니다.";
    content.appendChild(message);
    return;
  }

  // 날짜 표시
  const dateTitle = document.createElement("h3");
  dateTitle.textContent =
    year + "년 " + month + "월 " + day + "일 (토)";
  dateTitle.style.textAlign = "center";
  dateTitle.style.margin = "12px 0 20px";
  content.appendChild(dateTitle);

  // 연사와 회중은 한 줄에 함께 표시
  const congregation = String(item.congregation || "")
    .replace(/\s*회중\s*$/, "");

  const details = [
    {
      label: "연사",
      value: [
        item.speaker || "",
        congregation ? congregation + " 회중" : ""
      ].filter(Boolean).join(" ")
    },
    {
      label: "주제",
      value: item.topic || ""
    },
    {
      label: "공개강연 사회",
      value: item.chairman || ""
    },
    {
      label: "파수대 낭독",
      value: item.reader || ""
    },
    {
      label: "마치는 기도",
      value: item.prayer || ""
    }
  ];

  const table = document.createElement("table");
  table.style.width = "100%";
  table.style.borderCollapse = "collapse";
  table.style.tableLayout = "auto";

  details.forEach(detail => {
    const tr = document.createElement("tr");

    const label = document.createElement("th");
    label.textContent = detail.label;
    label.style.width = "34%";
    label.style.textAlign = "left";
    label.style.verticalAlign = "top";
    label.style.padding = "12px 8px";

    const value = document.createElement("td");
    value.textContent = detail.value;
    value.style.textAlign = "left";
    value.style.verticalAlign = "top";
    value.style.padding = "12px 8px";

    tr.appendChild(label);
    tr.appendChild(value);
    table.appendChild(tr);
  });

  content.appendChild(table);
}
   

    /* =====================================================
       오류 표시
    ===================================================== */
    function showError(error) {
      const content = document.getElementById("content");

      content.innerHTML = "";

      const message = document.createElement("div");
      message.className = "error";

      message.textContent =
        "일정을 불러오지 못했습니다: " +
        (error && error.message
          ? error.message
          : "알 수 없는 오류");

           content.appendChild(message);
    }

    /* 페이지를 열면 공개강연 일정 자동 표시 */
    document.addEventListener(
      "DOMContentLoaded",
      function() {
        showSection("publicTalk");
      }
    );
    
  </script>
</body>
</html>
