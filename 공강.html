<body>
  <div class="page">

    
<header class="fixed-header">
  <button type="button" class="top-button back-button"
    onclick="history.back()" aria-label="뒤로가기">‹</button>

  <div class="main-title">북부회중 게시판</div>

  <button type="button" class="top-button settings-button"
    onclick="toggleSettings()" aria-label="설정">⚙</button>
</header>


    <main id="content">
      <div class="loading">
        아래의 공개강연 메뉴를 눌러 일정을 확인하세요.
      </div>
    </main>

    <!-- 아래쪽 고정 메뉴 -->
    <nav class="fixed-bottom">
      <button
        type="button"
        onclick="showSection('publicTalk')">
        공개강연
      </button>

      <button
        type="button"
        onclick="showSection('ministry')">
        생활과봉사
      </button>

      <button
        type="button"
        onclick="showSection('groups')">
        집단및부서
      </button>
    </nav>

  </div>

  <!-- 설정창 -->
  <div id="settingsPanel" class="settings-panel">
    <div class="settings-title">설정</div>

    <div class="settings-row">
      <div class="settings-label">화면 테마</div>
      <div class="settings-buttons">
        <button type="button" class="settings-button"
          onclick="setTheme('light')">밝게</button>
        <button type="button" class="settings-button"
          onclick="setTheme('dark')">어둡게</button>
      </div>
    </div>

    <div class="settings-row">
      <div class="settings-label">글자 크기</div>
      <div class="settings-buttons">
        <button type="button" class="settings-button"
          onclick="setFontScale(0.9)">작게</button>
        <button type="button" class="settings-button"
          onclick="setFontScale(1)">보통</button>
        <button type="button" class="settings-button"
          onclick="setFontScale(1.1)">크게</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzWePF0JCyDZWrO9SekczdWRzQ1yw-w-Fnu4EKf3c1itOfpzINoUbbgDbm-MkTqqhTCpQ/exec";


    let scheduleTimeout;

    /* 설정창 열기 / 닫기 */
    function toggleSettings() {
      const panel = document.getElementById("settingsPanel");

      if (!panel) return;

      panel.classList.toggle("show");
    }

    /* 화면 테마 변경 */
    function setTheme(theme) {
      if (theme === "dark") {
        document.body.style.background = "#202124";
        document.body.style.color = "#f1f3f4";

        document.querySelector(".page").style.background = "#303134";

        document.querySelector(".fixed-header").style.background = "#18324a";
        document.querySelector(".fixed-bottom").style.background = "#18324a";

        document.querySelectorAll(".fixed-bottom button").forEach(button => {
          button.style.background = "#18324a";
          button.style.color = "#ffffff";
        });

        document.querySelectorAll("table td").forEach(cell => {
          cell.style.background = "#303134";
          cell.style.color = "#f1f3f4";
        });

      } else {
        document.body.style.background = "#f3f4f6";
        document.body.style.color = "#222";

        document.querySelector(".page").style.background = "#ffffff";

        document.querySelectorAll("table td").forEach(cell => {
          cell.style.background = "";
          cell.style.color = "";
        });
      }
    }

    /* 글자 크기 변경 */
    function setFontScale(scale) {
      document.documentElement.style.setProperty(
        "--font-scale",
        scale
      );

      document.querySelectorAll(
        ".main-title, .subtitle, #content, table, .month-title"
      ).forEach(element => {
        if (!element.dataset.originalFontSize) {
          element.dataset.originalFontSize =
            parseFloat(getComputedStyle(element).fontSize);
        }

        element.style.fontSize =
          (Number(element.dataset.originalFontSize) * scale) + "px";
      });
    }


    /* =====================================================
       하단 메뉴 선택
    ===================================================== */
    function showSection(section) {
      const content = document.getElementById("content");

      if (section === "publicTalk") {
        loadSchedule();
        return;
      }

      clearTimeout(scheduleTimeout);

      const oldScript = document.getElementById("scheduleJsonp");

      if (oldScript) {
        oldScript.remove();
      }

      content.innerHTML = "";

      const message = document.createElement("div");
      message.className = "loading";

      if (section === "ministry") {
        message.textContent =
          "생활과봉사 내용을 준비 중입니다.";
      } else if (section === "groups") {
        message.textContent =
          "집단및부서 내용을 준비 중입니다.";
      }

      content.appendChild(message);
    }

    /* =====================================================
       공개강연 일정 불러오기
    ===================================================== */
    function loadSchedule() {
      const content = document.getElementById("content");

      content.innerHTML =
        '<div class="loading">공강 일정을 불러오는 중입니다...</div>';

      clearTimeout(scheduleTimeout);

      scheduleTimeout = setTimeout(function() {
        showError({
          message:
            "응답 시간이 초과되었습니다. Apps Script 배포를 확인해 주세요."
        });
      }, 20000);

      const oldScript = document.getElementById("scheduleJsonp");

      if (oldScript) {
        oldScript.remove();
      }

      const script = document.createElement("script");
      script.id = "scheduleJsonp";

      script.onerror = function() {
        clearTimeout(scheduleTimeout);

        showError({
          message: "Apps Script에 연결하지 못했습니다."
        });
      };

      script.src =
        SCRIPT_URL + "?prefix=receiveSchedule&t=" + Date.now();

      document.body.appendChild(script);
    }

    /* =====================================================
       Apps Script 응답 처리
    ===================================================== */
    function receiveSchedule(data) {
      clearTimeout(scheduleTimeout);

      if (!Array.isArray(data)) {
        showError({
          message: "서버에서 받은 데이터 형식이 올바르지 않습니다."
        });

        return;
      }

      renderSchedule(data);
    }

    /* =====================================================
       공개 집회 강연 계획표 표시
    ===================================================== */
    function renderSchedule(data) {
      const content = document.getElementById("content");

      content.innerHTML = "";

      const title = document.createElement("h2");
      title.textContent = "공개 집회 강연 계획표";
      title.style.textAlign = "center";
      content.appendChild(title);

      const subtitle = document.createElement("div");
      subtitle.textContent = "토요일 오후 7:30";
      subtitle.style.textAlign = "right";
      subtitle.style.fontWeight = "bold";
      subtitle.style.marginBottom = "12px";
      content.appendChild(subtitle);

      const now = new Date();

      const currentMonth = new Date(
        now.getFullYear(),
        now.getMonth(),
        1
      );

      /* 전월 2개월 + 이번 달 + 다음 2개월 */
      for (let offset = -2; offset <= 2; offset++) {
        const monthDate = new Date(
          currentMonth.getFullYear(),
          currentMonth.getMonth() + offset,
          1
        );

        const year = monthDate.getFullYear();
        const month = monthDate.getMonth() + 1;

        const section = document.createElement("section");
        section.className = "month-section";

        const heading = document.createElement("h2");
        heading.className = "month-title";
        heading.textContent = year + "년 " + month + "월";
        section.appendChild(heading);

        const wrap = document.createElement("div");
        wrap.className = "table-wrap";

        const table = document.createElement("table");

        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        [
          "시작", "연사", "회중", "주제",
          "사회", "낭독", "기도"
        ].forEach(label => {
          const th = document.createElement("th");
          th.textContent = label;
          headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        const rows = data
          .filter(item =>
            Number(item.year) === year &&
            Number(item.month) === month
          )
          .sort((a, b) => Number(a.day) - Number(b.day));

        rows.forEach(item => {
          const tr = document.createElement("tr");

          const values = [
            item.date,
            item.speaker,
            item.congregation,
            item.topic,
            item.chairman,
            item.reader,
            item.prayer
          ];

          values.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value || "";
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        if (rows.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");

          td.colSpan = 7;
          td.className = "empty";
          td.textContent = "등록된 일정이 없습니다.";

          tr.appendChild(td);
          tbody.appendChild(tr);
        }

        table.appendChild(tbody);
        wrap.appendChild(table);
        section.appendChild(wrap);
        content.appendChild(section);
      }
    }

    /* =====================================================
       오류 표시
    ===================================================== */
    function showError(error) {
      const content = document.getElementById("content");

      content.innerHTML = "";

      const message = document.createElement("div");
      message.className = "error";

      message.textContent =
        "일정을 불러오지 못했습니다: " +
        (error && error.message
          ? error.message
          : "알 수 없는 오류");

      content.appendChild(message);
    }
  </script>
</body>
</html>
