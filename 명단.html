<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>명단 관리</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 26px;
    }

    /* 상단 탭 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-button {
      flex: 1;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #ddd;
      color: #333;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-button.active {
      background: #286b5b;
      color: white;
    }

    /* 명단 */
    .member-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 8px 10px 8px 14px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .member-name {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      font-weight: 600;
    }

    .role {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      font-size: 13px;
    }

    .role input {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    .delete-button {
      height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: #e5e5e5;
      color: #555;
      font-size: 13px;
      cursor: pointer;
    }

    .delete-button:hover {
      background: #d5d5d5;
    }

    /* 추가 영역 */
    .add-area {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .add-area input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 16px;
      outline: none;
    }

    .add-area input:focus {
      border-color: #286b5b;
    }

    .add-button {
      width: 110px;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: #286b5b;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-message {
      padding: 40px 10px;
      text-align: center;
      color: #888;
      font-size: 15px;
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .member-row {
        gap: 7px;
        padding-left: 10px;
      }

      .member-name {
        font-size: 15px;
      }

      .role {
        font-size: 11px;
      }

      .role input {
        width: 16px;
        height: 16px;
      }

      .delete-button {
        padding: 0 8px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>명단 관리</h1>

    <!-- 상단 탭 -->
    <div class="tabs">

      <button
        type="button"
        class="tab-button active"
        onclick="selectTab('volunteer')">
        봉사자
      </button>

      <button
        type="button"
        class="tab-button"
        onclick="selectTab('exhibition')">
        전시대
      </button>

    </div>

    <!-- 명단 -->
    <div
      id="memberList"
      class="member-list">
    </div>

    <!-- 명단 추가 -->
    <div class="add-area">

      <input
        type="text"
        id="memberNameInput"
        placeholder="이름을 입력하세요"
        onkeydown="handleEnter(event)">

      <button
        type="button"
        class="add-button"
        onclick="addMember()">
        + 추가
      </button>

    </div>

  </div>


  <script>

    /* =========================================================
       명단 관리 Apps Script 주소
    ========================================================= */

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwYtNDFnBi2ow5tU1IpbCtp0nQS1Vl3v8uwKUQtX9cX4BpysIlwmEquAO46tfndyChfqw/exec";


    /* =========================================================
       명단
    ========================================================= */

    let members = [];


    /* =========================================================
       현재 선택된 탭
    ========================================================= */

    let currentTab = "volunteer";


    /* =========================================================
       Google Sheets에서 명단 불러오기
    ========================================================= */

    async function loadMembers() {

      try {

        const response =
          await fetch(
            SCRIPT_URL +
            "?action=members"
          );


        if (!response.ok) {

          throw new Error(
            "명단을 불러오지 못했습니다."
          );

        }


        const data =
          await response.json();


        members =
          Array.isArray(data)
            ? data
            : [];


        renderMembers();


      } catch (error) {

        console.error(
          "명단 불러오기 오류:",
          error
        );


        document.getElementById(
          "memberList"
        ).innerHTML = `
          <div class="empty-message">
            명단을 불러오지 못했습니다.
          </div>
        `;

      }

    }


    /* =========================================================
       Google Sheets에 명단 저장
    ========================================================= */

    async function saveMembersToSheet() {

      try {

        const response =
          await fetch(
            SCRIPT_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify({

                  action:
                    "saveMembers",

                  members:
                    members

                })

            }
          );


        if (!response.ok) {

          throw new Error(
            "서버와 연결할 수 없습니다."
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error ||
            "저장에 실패했습니다."
          );

        }


        return true;


      } catch (error) {

        console.error(
          "명단 저장 오류:",
          error
        );


        alert(
          "명단 저장에 실패했습니다.\n\n" +
          error.message
        );


        return false;

      }

    }


    /* =========================================================
       화면 표시
    ========================================================= */

    function renderMembers() {

      const list =
        document.getElementById(
          "memberList"
        );


      list.innerHTML = "";


      /*
       * 현재 탭에 해당하는 사람만 표시
       */

      const filteredMembers =
        members.filter(
          function(member) {

            if (
              currentTab ===
              "volunteer"
            ) {

              return member.volunteer;

            }


            if (
              currentTab ===
              "exhibition"
            ) {

              return member.exhibition;

            }


            return true;

          }
        );


      if (
        filteredMembers.length ===
        0
      ) {

        list.innerHTML = `
          <div class="empty-message">
            등록된 명단이 없습니다.
          </div>
        `;

        return;

      }


      filteredMembers.forEach(
        function(member) {

          const index =
            members.indexOf(member);


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "member-row";


          row.innerHTML = `

            <div class="member-name">
              ${escapeHtml(member.name)}
            </div>


            <label class="role">

              <input
                type="checkbox"
                ${member.volunteer ? "checked" : ""}
                onchange="
                  changeRole(
                    ${index},
                    'volunteer',
                    this.checked
                  )
                ">

              봉사자

            </label>


            <label class="role">

              <input
                type="checkbox"
                ${member.exhibition ? "checked" : ""}
                onchange="
                  changeRole(
                    ${index},
                    'exhibition',
                    this.checked
                  )
                ">

              전시대

            </label>


            <button
              type="button"
              class="delete-button"
              onclick="
                deleteMember(${index})
              ">

              삭제

            </button>

          `;


          list.appendChild(row);

        }
      );

    }


    /* =========================================================
       탭 변경
    ========================================================= */

    function selectTab(tab) {

      currentTab =
        tab;


      document
        .querySelectorAll(
          ".tab-button"
        )
        .forEach(
          function(button, index) {

            button.classList.toggle(
              "active",

              (
                tab ===
                "volunteer" &&
                index === 0
              ) ||

              (
                tab ===
                "exhibition" &&
                index === 1
              )

            );

          }
        );


      renderMembers();

    }


    /* =========================================================
       봉사자 / 전시대 변경
    ========================================================= */

    async function changeRole(
      index,
      role,
      checked
    ) {

      if (!members[index]) {
        return;
      }


      /*
       * 기존 값을 기억합니다.
       * 저장 실패 시 원래 상태로 복구합니다.
       */

      const previousValue =
        members[index][role];


      members[index][role] =
        checked;


      renderMembers();


      const saved =
        await saveMembersToSheet();


      if (!saved) {

        members[index][role] =
          previousValue;


        renderMembers();

      }

    }


    /* =========================================================
       명단 추가
    ========================================================= */

    async function addMember() {

      const input =
        document.getElementById(
          "memberNameInput"
        );


      const name =
        input.value.trim();


      if (!name) {

        alert(
          "이름을 입력해주세요."
        );

        input.focus();

        return;

      }


      /*
       * 중복 확인
       */

      const exists =
        members.some(
          function(member) {

            return (
              member.name ===
              name
            );

          }
        );


      if (exists) {

        alert(
          "이미 등록된 이름입니다."
        );

        input.focus();

        return;

      }


      /*
       * 새 사람 추가
       *
       * 현재 선택된 탭의 역할을
       * 자동으로 선택합니다.
       */

      const newMember = {

        name:
          name,

        volunteer:
          currentTab ===
          "volunteer",

        exhibition:
          currentTab ===
          "exhibition"

      };


      members.push(
        newMember
      );


      input.value = "";

      input.focus();


      renderMembers();


      /*
       * Google Sheets 저장
       */

      const saved =
        await saveMembersToSheet();


      if (!saved) {

        const index =
          members.indexOf(
            newMember
          );


        if (index !== -1) {

          members.splice(
            index,
            1
          );

        }


        renderMembers();

      }

    }


    /* =========================================================
       명단 삭제
    ========================================================= */

    async function deleteMember(
      index
    ) {

      if (!members[index]) {
        return;
      }


      const name =
        members[index].name;


      if (
        !confirm(
          `"${name}"을(를) 명단에서 삭제하시겠습니까?`
        )
      ) {

        return;

      }


      /*
       * 삭제할 사람을 기억합니다.
       */

      const deletedMember =
        members[index];


      members.splice(
        index,
        1
      );


      renderMembers();


      /*
       * Google Sheets 저장
       */

      const saved =
        await saveMembersToSheet();


      if (!saved) {

        /*
         * 저장 실패 시 복구
         */

        members.splice(
          index,
          0,
          deletedMember
        );


        renderMembers();

      }

    }


    /* =========================================================
       Enter로 추가
    ========================================================= */

    function handleEnter(event) {

      if (
        event.key ===
        "Enter"
      ) {

        addMember();

      }

    }


    /* =========================================================
       HTML 문자 안전 처리
    ========================================================= */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       최초 실행
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadMembers();

      }
    );

  </script>

</body>
</html>
