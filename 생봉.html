<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>생봉</title>
<style>
*{box-sizing:border-box}
:root{--scale:1}
body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f3f4f6;color:#222}
.fixed-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 62px;
  box-sizing: border-box;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 14px;
  background: #193650;
  color: #fff;
  text-align: center;
  border-bottom: 0;
}

.main-title {
  margin: 0;
  padding: 0;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 40px;
  white-space: nowrap;
}

/* 상단 뒤로가기 및 설정 버튼 — 공강.html과 동일 */
.top-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 10px;
  background: transparent;
  color: white;
  font-size: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.back-button {
  left: 10px;
}

.settings-button {
  right: 10px;
}

.page{
  position:fixed;
  top:62px;
  bottom:62px;
  left:0;
  right:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:15px 10px 20px;
  max-width:900px;
  width:100%;
  margin:0 auto;
}

#content{font-size:calc(16px * var(--scale))}
  
/* 생봉 제목과 시간 */
.schedule-heading {
  text-align: center;
  margin: 0 0 10px;
  font-size: 30px;
  font-weight: 800;
}

.schedule-subtitle {
  text-align: center;
  margin: 0 0 20px;
  font-size: 13px;
  font-weight: bold;
}
  
/* 공개강연과 동일한 일정 상자 */
.program-card {
  width: 100%;
  max-width: 680px;
  margin: 0 auto 24px;
  padding: 12px;
  border: 5px solid #AEB6BF;
  border-radius: 16px;
  background: linear-gradient(145deg, #ffffff, #f7faff);
  box-shadow: 0 6px 18px rgba(24, 50, 74, 0.08);
}

/* 공개강연과 동일한 날짜 제목 */
.date-title {
  margin: 4px 0 16px;
  padding: 12px 8px;
  border-radius: 10px;
  background: #68717D;
  color: #ffffff;
  font-size: 25px;
  font-weight: 800;
  line-height: 1.5;
  letter-spacing: 0.02em;
  text-align: center;
}
  
.opening-row{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid #e4e7eb;font-size:calc(14px * var(--scale))}
.opening-row .role{color:#555;text-align:center}.opening-row .value{font-weight:600}.opening-row .name{font-weight:800;white-space:nowrap}

  
.section-title {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 20px 0 0;
  padding: 0;
  text-align: left;
  background: transparent;
  font-size: calc(27px * var(--scale));
  font-weight: 800;
  line-height: 1.35;
}

.section-icon {
  width: 64px;
  height: 64px;
  flex: 0 0 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.section-icon svg {
  display: block;
  width: 48px;
  height: 48px;
  overflow: visible;
}

.section-title.blue { color: #287889; }
.section-title.orange { color: #b77a0a; }
.section-title.green { color: #c6281c; }

.section-icon.blue { background: #0d6878; }
.section-icon.orange { background: #d18a00; }
.section-icon.green { background: #c6281c; }


.section-icon {
  width: 34px;
  height: 35px;
  flex: 0 0 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.section-icon svg {
  display: block;
  width: 26px;
  height: 27px;
  overflow: visible;
}

.section-title.blue { color: #287889; }
.section-title.orange { color: #b77a0a; }
.section-title.green { color: #b52b20; }

.section-icon.blue { background: #347f8c; }
.section-icon.orange { background: #d18a00; }
.section-icon.green { background: #c6281c; }
  
.program-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 4px;border-bottom:1px solid #e8ebef;line-height:1.5}
.program-line:last-child{border-bottom:0}
.program-text{overflow-wrap:anywhere}.program-name{font-weight:800;white-space:nowrap;text-align:right}
.blue-text{color:#0645ff}.red-text{color:#f01818}.black-text{color:#222}
.subline{display:flex;justify-content:space-between;gap:8px;padding:5px 4px;line-height:1.45;border-bottom:1px solid #eef0f3}
.subline span{overflow-wrap:anywhere}.subline .person{font-weight:700}
.note{font-size:calc(13px * var(--scale));font-weight:700;color:#0645ff;padding:5px 4px}

/* 하단 고정 메뉴 — 공강.html과 동일 */
.fixed-bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 60px;
  z-index: 1000;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  background: #193650;
  border-top: 1px solid rgba(255, 255, 255, .10);
}

.fixed-bottom button {
  min-width: 0;
  height: 59px;
  box-sizing: border-box;
  padding: 0 4px;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #fff;
  font-family: Arial, "Malgun Gothic", sans-serif;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
}

.fixed-bottom button + button {
  border-left: 1px solid rgba(255, 255, 255, .25);
}

.settings-panel{display:none;position:fixed;z-index:1100;top:75px;right:12px;width:300px;max-width:calc(100vw - 24px);padding:14px;border:1px solid #ddd;border-radius:16px;background:#fff;box-shadow:0 10px 30px #0002}
.settings-panel.show{display:block}.setting-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.settings-panel button{padding:12px;border:1px solid #ddd;border-radius:10px;background:#f5f5f5;font-size:16px;font-weight:700}
.font-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;text-align:center}
.loading,.error,.empty{text-align:center;padding:28px 10px;color:#555}
.error{color:#b00020;white-space:pre-wrap}
body.dark-mode{background:#202124;color:#f1f3f4}
body.dark-mode .program-card{background:#303134;border-color:#555}
body.dark-mode .opening-row,body.dark-mode .program-line,body.dark-mode .subline{border-color:#50545a}
body.dark-mode .opening-row .role,body.dark-mode .black-text{color:#f1f3f4}
body.dark-mode .settings-panel{background:#303134;color:#f1f3f4;border-color:#555}
body.dark-mode .settings-panel button{background:#202124;color:#f1f3f4;border-color:#555}
@media(max-width:520px){
.page {
  padding: 10px 5px 15px;
}
  
.program-card {
  padding: 12px;
  border-width: 5px;
  border-radius: 16px;
}

.date-title {
  margin: 4px 0 16px;
  padding: 12px 8px;
  font-size: 25px;
}
  
 .section-title{font-size:calc(17px * var(--scale))}
 .opening-row{grid-template-columns:65px minmax(0,1fr) auto;gap:5px;font-size:calc(12px * var(--scale))}
 .program-line{gap:5px;padding:7px 2px}
 .program-name{white-space:normal}
}
</style>
</head>
<body>
  
<header class="fixed-header">
  
<button type="button" class="top-button back-button"
  onclick="location.href='index.html'" aria-label="홈으로">‹</button>

  <div class="main-title">북부회중 게시판</div>
  <button type="button" class="top-button settings-button"
    onclick="toggleSettings()" aria-label="설정">⚙</button>
</header>

<main class="page"><div id="content"><div class="loading">생봉 일정을 불러오는 중입니다...</div></div></main>

<nav class="fixed-bottom">
  <button
    type="button"
    onclick="location.href='공강.html'">
    공개강연
  </button>

  <button
    type="button"
    onclick="location.href='생봉.html'">
    생활과봉사
  </button>

  <button
    type="button"
    onclick="location.href='집단.html'">
    집단및부서
  </button>
</nav>  
  
<div id="settingsPanel" class="settings-panel">
  <div class="setting-row">
    <button onclick="setTheme(false)">☀ 밝게</button>
    <button onclick="setTheme(true)">🌙 어둡게</button>
  </div>
  <div class="font-row">
    <button onclick="changeFont(-10)">−</button>
    <strong id="fontSize">100%</strong>
    <button onclick="changeFont(10)">＋</button>
  </div>
</div>

<script>
/* 생봉 Apps Script 웹 앱 URL */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx44HBK4VnofM1gVLJ8g9TeSAvELSE5P5bF6vxGmkbSl_lqx3Zk1RF_ArzP-ZfSQuTX/exec";

let fontPercent = Number(localStorage.getItem("lifeBoardFont") || 100);

function toggleSettings(){
  document.getElementById("settingsPanel").classList.toggle("show");
}

function setTheme(dark){
  document.body.classList.toggle("dark-mode", dark);

  localStorage.setItem(
    "northBoardTheme",
    dark ? "dark" : "light"
  );
}

function changeFont(amount){
  fontPercent=Math.max(80,Math.min(150,fontPercent+amount));
  document.documentElement.style.setProperty("--scale",fontPercent/100);
  document.getElementById("fontSize").textContent=fontPercent+"%";
  localStorage.setItem("lifeBoardFont",String(fontPercent));
}

(function restoreSettings(){
  setTheme(localStorage.getItem("northBoardTheme")==="dark");

  fontPercent=Math.max(80,Math.min(150,fontPercent));

  document.documentElement.style.setProperty(
    "--scale",
    fontPercent/100
  );

  document.getElementById("fontSize").textContent =
    fontPercent+"%";
})();

function loadSchedule(){
  if(!SCRIPT_URL.startsWith("https://script.google.com/")){
    document.getElementById("content").innerHTML='<div class="error">앱스스크립트를 배포한 뒤 SCRIPT_URL에 웹 앱 URL을 입력해 주세요.</div>';
    return;
  }

  const old=document.getElementById("scheduleJsonp");
  if(old)old.remove();

  const script=document.createElement("script");
  script.id="scheduleJsonp";
  script.onerror=()=>showError("앱스스크립트에 연결하지 못했습니다. 배포 권한과 URL을 확인해 주세요.");
  script.src=SCRIPT_URL+"?prefix=receiveSchedule&t="+Date.now();
  document.body.appendChild(script);

  window.scheduleTimer=setTimeout(
    ()=>showError("응답 시간이 초과되었습니다. 앱스스크립트 배포를 확인해 주세요."),
    20000
  );
}

function receiveSchedule(data) {
  clearTimeout(window.scheduleTimer);

  if (
    !data ||
    !Array.isArray(data.schedules)
  ) {
    showError("서버에서 받은 데이터 형식이 올바르지 않습니다.");
    return;
  }

  renderSchedule(data);
}

function showError(message){
  document.getElementById("content").innerHTML="";
  const d=document.createElement("div");
  d.className="error";
  d.textContent=message;
  document.getElementById("content").appendChild(d);
}

function cell(row,index){
  return String((row.cells||[])[index]||"").trim();
}

function line(text,name="",cls=""){
  const el=document.createElement("div");
  el.className="program-line";

  const t=document.createElement("div");
  t.className="program-text "+cls;
  t.textContent=text||"";
  el.appendChild(t);

  if(name){
    const n=document.createElement("div");
    n.className="program-name "+cls;
    n.textContent=name;
    el.appendChild(n);
  }

  return el;
}

function subline(left,right){
  const el=document.createElement("div");
  el.className="subline";

  const a=document.createElement("span");
  a.textContent=left||"";

  const b=document.createElement("span");
  b.className="person";
  b.textContent=right||"";

  el.append(a,b);
  return el;
}

function section(card,title,cls,buttonNote){
  const h = document.createElement("div");
  h.className = "section-title " + cls;

  const icon = document.createElement("span");
  icon.className = "section-icon " + cls;

  const icons = {
    blue: `
      <svg viewBox="0 0 28 30" aria-hidden="true">
        <path
          d="M5 3.5H23L27 10 14 27 1 10Z
             M5 3.5 9 10 14 27 19 10 23 3.5
             M1 10H27
             M9 10 14 3.5 19 10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </svg>
    `,

    orange: `
      <svg viewBox="0 0 28 30" aria-hidden="true">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="
            M14 27V3
            M14 8 10 5
            M14 12 8 9
            M14 16 8 14
            M14 20 9 19
            M14 8 18 5
            M14 12 20 9
            M14 16 20 14
            M14 20 19 19
            M14 4V1
          "/>
          <path d="
            M10 5Q6 2 6 7Q8 10 12 10
            M8 9Q3 7 4 12Q7 15 12 14
            M8 14Q3 12 4 17Q7 20 12 19
            M18 5Q22 2 22 7Q20 10 16 10
            M20 9Q25 7 24 12Q21 15 16 14
            M20 14Q25 12 24 17Q21 20 16 19
          "/>
        </g>
      </svg>
    `,

    green: `
      <svg viewBox="0 0 30 30" aria-hidden="true">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="
            M4 15 7 9Q9 6 14 6H20
            L24 3 27 5 26 10 23 13
            22 21H19L18 16H11L10 22H7
            L7 16 4 18Z
          "/>
          <path d="
            M20 6 22 8
            M8 11 5 12 3 17 6 19
            M12 16 12 22
            M17 16 17 22
          "/>
          <circle cx="23" cy="7" r=".8" fill="currentColor"/>
        </g>
      </svg>
    `
  };

  icon.innerHTML = icons[cls] || "";
  h.appendChild(icon);

  const label = document.createElement("span");
  label.textContent = title;
  h.appendChild(label);

  card.appendChild(h);

  if(buttonNote){
    const n = document.createElement("div");
    n.className = "program-line";
    n.textContent = "버튼추가";
    card.appendChild(n);
  }
}
  
.section-title + .program-line {
  margin-left: 80px;
  padding: 2px 0 10px;
  border-bottom: 1px solid #e4e7eb;
  font-size: calc(20px * var(--scale));
  font-weight: 400;
  line-height: 1.5;
  color: #444;
}

.section-title + .program-line + .program-line {
  margin-left: 80px;
}

@media (max-width: 520px) {
  .section-title {
    gap: 10px;
    font-size: calc(19px * var(--scale));
  }

  .section-icon {
    width: 48px;
    height: 48px;
    flex-basis: 48px;
  }

  .section-icon svg {
    width: 36px;
    height: 36px;
  }

  .section-title + .program-line {
    margin-left: 58px;
    font-size: calc(15px * var(--scale));
  }
}

function renderSchedule(data){
  const content=document.getElementById("content");
  content.innerHTML="";

  // 시트 B2 제목 표시
  const heading = document.createElement("h2");
  heading.className = "schedule-heading";
  heading.textContent = data.title || "";
  content.appendChild(heading);

  // 시트 B3 시간 표시
  const subtitle = document.createElement("div");
  subtitle.className = "schedule-subtitle";
  subtitle.textContent = data.subtitle || "";
  content.appendChild(subtitle);

  // 일정 배열
  data = data.schedules;

   const today=new Date();
  today.setHours(0,0,0,0);

  // 이번 주 월요일
  const weekStart=new Date(today);
  weekStart.setDate(today.getDate()-(today.getDay()+6)%7);

  // 이번 주 일요일
  const weekEnd=new Date(weekStart);
  weekEnd.setDate(weekStart.getDate()+6);
  weekEnd.setHours(23,59,59,999);

  // 이번 주 일정만 표시
  const items=data.filter(x=>{
    const date=new Date(
      Number(x.year),
      Number(x.month)-1,
      Number(x.day)
    );

    return date>=weekStart && date<=weekEnd;
  });

  if(!items.length){
    content.innerHTML='<div class="empty">표시할 생봉 일정이 없습니다.</div>';
    return;
  }

  items.forEach(item=>{
    const c=item.cells||[];

    const card=document.createElement("section");
    card.className="program-card";

    const date=document.createElement("h2");
    date.className="date-title";
    date.textContent=item.year+"년 "+item.month+"월 "+item.day+"일 ("+item.weekday+")";
    card.appendChild(date);

    card.appendChild(subline("사회자",cell(c,1)));
    card.appendChild(subline("시작 기도",cell(c,2)));

    section(card,"성경에 담긴 보물","blue",true);

    const speaker=cell(c,4);
    const topic=cell(c,5);

    card.appendChild(
      line("연설 : "+(cell(c,3)||"10분")+", 생명 봉사에 관한 내용",speaker,"blue-text")
    );

    if(topic){
      card.appendChild(line(topic,"","blue-text"));
    }

    if(cell(c,8)||cell(c,9)){
      card.appendChild(
        line("영적 보물찾기 : "+(cell(c,9)||cell(c,8))+" (상단 좌측정렬)",cell(c,8),"red-text")
      );
    }

    if(cell(c,10)||cell(c,11)){
      card.appendChild(
        line("성경 낭독 : "+(cell(c,10)||"")+" "+(cell(c,11)||""),cell(c,10),"black-text")
      );
    }

    section(card,"야외 봉사에 힘쓰십시오","orange",true);

    const assignments=[
      {n:4,title:cell(c,13),duration:cell(c,12),person:cell(c,14),helper:cell(c,16),label:"대화 시작하기"},
      {n:5,title:cell(c,18),duration:cell(c,17),person:cell(c,19),helper:cell(c,21),label:"대화 시작하기"},
      {n:6,title:cell(c,23),duration:cell(c,22),person:cell(c,24),helper:cell(c,26),label:"대화 시작하기"},
      {n:7,title:cell(c,28),duration:cell(c,27),person:cell(c,29),helper:cell(c,31),label:"우리의 신앙 설명하기"}
    ];

    assignments.forEach((a,i)=>{
      const t=a.title||["대화 시작하기","대화 시작하기","대화 시작하기","우리의 신앙 설명하기"][i];

      if(t||a.person||a.helper){
        card.appendChild(
          line(a.n+". "+t+(a.duration?" : "+a.duration:"")+" (상단 좌측정렬)","","blue-text")
        );

        card.appendChild(
          subline("전도인  "+a.person,"집주인  "+a.helper)
        );
      }
    });

    section(card,"그리스도인 생활","green",true);

    const bibleTitle=cell(c,34);
    const bibleTime=cell(c,32);
    const bibleRef=cell(c,35);

    if(bibleTitle||bibleTime||bibleRef){
      card.appendChild(
        line("8. "+(bibleTitle||"")+(bibleTime?" : "+bibleTime:"")+(bibleRef?"  "+bibleRef:""),cell(c,33),"blue-text")
      );
    }

    const watchTitle=cell(c,38);
    const watchTime=cell(c,36);
    const watchRef=cell(c,39);
    const watchHost=cell(c,37);

    if(watchTitle||watchTime||watchRef||watchHost){
      card.appendChild(
        line("9. "+(watchTitle||"중앙장로회 보고")+(watchTime?" : "+watchTime:"")+(watchRef?"  "+watchRef:""),watchHost,"black-text")
      );
    }

    const studyTitle=cell(c,40);
    const studyReader=cell(c,41);
    const studySocial=cell(c,42);

    if(studyTitle||studyReader||studySocial){
      card.appendChild(
        line("10. "+(studyTitle||"회중 성서 연구")+(cell(c,40)?" : 30분":""),"","blue-text")
      );

      card.appendChild(
        subline("사회자  "+studySocial,"낭독자  "+studyReader)
      );
    }

    card.appendChild(subline("마치는 기도",cell(c,43)));
    content.appendChild(card);
  });
}

document.addEventListener("DOMContentLoaded",loadSchedule);
</script>
</body>
</html>
