<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>순회 방문 계획표</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: #18324a;
  background: #fff;
  font-family: Arial, "Malgun Gothic", sans-serif;
  font-size: 20px;
}
  
.top-bar {
  position: sticky;
  top: 0;
  z-index: 10;
  min-height: 62px;
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  color: white;
  background: #18324a;
}

.top-bar h1 {
  margin: 0;
  text-align: center;
  font-size: 25px;
}

.nav-btn {
  height: 42px;
  border: 1px solid #9db2c4;
  border-radius: 8px;
  background: #234563;
  color: white;
  font-size: 24px;
  cursor: pointer;
}

/* 오른쪽 설정 버튼 */
.settings-button {
  width: 34px;
  height: 34px;
  justify-self: end;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 9px;
  background: #F4C7C3;
border-radius: 7px;
width: calc(100% - 12px);
  color: white;
  font-size: 20px;
}

/* 설정창 */
.settings-panel {
  display: none;
  position: fixed;
  top: 70px;
  right: 10px;
  width: 230px;
  max-width: calc(100vw - 20px);
  padding: 12px;
  z-index: 1100;
  border: 1px solid #dedfe5;
  border-radius: 16px;
  background: #fff;
  color: #222;
  box-shadow: 0 14px 32px rgba(0,0,0,.18);
}

.settings-panel.show {
  display: block;
}

.settings-theme-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 7px;
}

.theme-btn {
  min-width: 0;
  height: 42px;
  padding: 0 4px;
  border: 1px solid #dce0e7;
  border-radius: 11px;
  background: #f5f6f8;
  color: #222;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.theme-btn.active {
  background: #eeeaff;
  border-color: #7566ff;
  color: #40348d;
}

.settings-font-row {
  display: grid;
  grid-template-columns: 50px 1fr 50px;
  gap: 7px;
  align-items: center;
}

.font-btn,
.font-size {
  height: 42px;
  min-width: 0;
  border: 1px solid #dce0e7;
  border-radius: 11px;
  background: #f5f6f8;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
}

.font-btn {
  font-size: 22px;
  cursor: pointer;
}

.font-size {
  font-size: 15px;
}

/* 어두운 모드 */
body.dark-mode {
  background: #202124;
  color: #f1f3f4;
}

body.dark-mode .week-card,
body.dark-mode .schedule-card {
  background: #292d31;
  border-color: #858585;
}

body.dark-mode .week-title,
body.dark-mode .line,
body.dark-mode .people span {
  color: #fff;
}

body.dark-mode .week-date,
body.dark-mode .subhead {
  background: #39434d;
  color: #fff;
}

body.dark-mode .leader {
  background: #39434d;
  color: #fff;
}

body.dark-mode .settings-panel {
  background: #202020;
  color: #f5f5f5;
  border-color: #404040;
}

body.dark-mode .settings-panel .theme-btn,
body.dark-mode .settings-panel .font-btn,
body.dark-mode .settings-panel .font-size {
  background: #202020;
  color: #eee;
  border-color: #505050;
}

body.dark-mode .settings-panel .theme-btn.active {
  background: #302b50;
  border-color: #7566ff;
  color: #fff;
}

main {
  width: 100%;
  margin: 0;
  padding: 18px 10px 24px;
}

.week-card,
.schedule-card {
  margin: 0 0 18px;
  padding: 0;
  overflow: hidden;
  background: white;
  border: 5px solid #AEB6BF;
  border-radius: 12px;
  box-shadow: none;
}

.week-card {
  padding: 14px 8px;
  border: none;
  border-radius: 0;
  box-shadow: none;
  background: transparent;
}

.week-title {
  margin-bottom: 10px;
  color: #000;
  font-size: 30px;
  font-weight: 900;
}

.week-date {
  padding: 12px;
  border-radius: 8px;
  background: #e6f2fb;
  font-size: 25px;
  font-weight: 900;
}

.schedule-card h2 {
  margin: 0;
  padding: 10px 14px;
  color: white;
  background: #3374A9;
  font-size: 22px;
  line-height: 1.4;
}

/* 요일과 인도자 */
.day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px 12px;
  padding: 8px 10px;
  background: #245477;
  color: white;
  font-weight: 800;
}

.day-name {
  flex-shrink: 0;
  font-size: 30px;
  font-weight: 800;
  text-align: left;
}

.day-leader {
  flex: 1;
  min-width: 0;
  font-size: 20px;
  font-weight: 800;
  text-align: right;
  overflow-wrap: anywhere;
}

.line,
.subhead {
  padding: 9px 14px;
  border-bottom: 1px solid #858585;
  overflow-wrap: anywhere;
}

.subhead {
  background: #e6f2fb;
  font-weight: 700;
}

.line:last-child {
  border-bottom: 0;
}

.people {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.people span {
  min-width: 0;
  padding: 9px 12px;
  border-right: 1px solid #858585;
  border-bottom: 1px solid #858585;
  overflow-wrap: anywhere;
}

.people span:nth-child(even) {
  border-right: 0;
}

.leader {
  padding: 10px 14px;
  color: #174f7e;
  background: #d8edfb;
  border-top: 1px solid #858585;
  font-weight: 700;
}

@media (max-width: 520px) {
  body {
    font-size: 18px;
  }

   .week-title {
    font-size: 22px;
  }

  .week-date {
    font-size: 19px;
  }

     .schedule-card h2 {
     font-size: 20px;
  }

  .people span {
    padding: 9px 8px;
  }
}

/* ===== 전체 요일 공통 디자인 ===== */

/* 요일과 인도자 */
.friday-header,
.day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 12px;
  padding: 8px 10px;
  background: #245477;
  color: white;
  font-weight: 800;
}

.friday-header > div:first-child,
.day-header > div:first-child {
  flex-shrink: 0;
  font-size: 30px;
  font-weight: 800;
  text-align: left;
}

.friday-header > div:last-child,
.day-header > div:last-child {
  flex: 1;
  min-width: 0;
  font-size: 20px;
  font-weight: 800;
  text-align: right;
  overflow-wrap: anywhere;
}

/* 오전·오후 시간과 봉사 모임 장소 */
.friday-time,
.schedule-time {
  width: 100%;
  min-height: 58px;
  padding: 9px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  text-align: left;
  font-size: 25px;
  font-weight: 800;
  color: #18324a;
  background: #D7EAF8;
  border: 0;
  border-bottom: 1px solid #858585;
}

.friday-time .time-label,
.schedule-time .time-label {
  font-size: 25px;
  font-weight: 800;
  text-align: left;
}

.friday-time .place-label,
.schedule-time .place-label {
  font-size: 20px;
  font-weight: 800;
  text-align: right;
}

/* 봉사 활동 */
.friday-activity,
.schedule-activity {
  padding: 9px 5px;
  text-align: center;
  font-size: 20px;
  font-weight: 800;
  color: #18324a;
  background: transparent;
  border-bottom: 1px solid #858585;
}

/* 봉사자 이름 */
.friday-people,
.schedule-people {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.friday-people span,
.schedule-people span {
  min-width: 0;
  padding: 9px 4px;
  text-align: center;
  font-size: 20px;
  font-weight: 800;
  color: #18324a;
  background: #F0F4F7;
  border-bottom: 1px solid #858585;
  overflow-wrap: anywhere;
}

.friday-people span:nth-child(odd),
.schedule-people span:nth-child(odd) {
  border-right: 1px solid #858585;
}

/* 어두운 모드 */
body.dark-mode .friday-time,
body.dark-mode .schedule-time,
body.dark-mode .friday-activity,
body.dark-mode .schedule-activity {
  background: #394F63;
  color: #fff;
}

body.dark-mode .friday-people span,
body.dark-mode .schedule-people span {
  background: #292D31;
  color: #fff;
}

#fridayDay {
  flex-shrink: 0;
  font-size: 30px;
  text-align: left;
}

#fridayLeader {
  flex: 1;
  min-width: 0;
  font-size: 20px;
  text-align: right;
  overflow-wrap: anywhere;
}

/* 오전·오후 모임장소 버튼 */
.friday-time {
  width: 100%;
  min-height: 58px;
  padding: 9px 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  text-align: center;
  font-size: 25px;
  font-weight: 800;
  color: #18324a;
  background: #D7EAF8;
  border: 0;

.friday-time .time-label {

}

.friday-time .place-label {

}

.friday-activity {

  color: #18324a;

  border-bottom: 1px solid #858585;

}

.friday-people span:nth-child(odd) {

}

/* 어두운 모드 */

  background: #394F63;

}

body.dark-mode .friday-activity {

}

body.dark-mode .friday-people span {

/* 점심 식사 및 교제 마련 */

.lunch-people span {

  text-align: center;
  font-size: 20px;
  font-weight: 800;
  color: #18324a;
  border-right: 1px solid #858585;

  overflow-wrap: anywhere;
}

.lunch-people span:nth-child(even) {

}

body.dark-mode .lunch-people span {

/* ===== 요청한 버튼 디자인: 화요일과 점심 항목 제외 ===== */

/* 오전·오후 봉사 모임 장소 */
.schedule-time,
.friday-time {

  padding: 9px 8px;
  text-align: left;

}

.schedule-time .time-label,
.friday-time .time-label {

  text-align: left;

  font-weight: 800;
}

.schedule-time .place-label,

  font-size: 20px;

/* ===== 수요일 버튼 디자인 ===== */

/* 오후 시간 버튼 */

}
  
/* 재방문 / 성서 연구 */
.wednesday-activity {
  min-height: 58px;
  margin: 6px 6px 0;
  padding: 10px 8px;

/* 순회 감독자 부부 - 금색 버튼 */
.schedule-people.wednesday-supervisor {

.schedule-people.wednesday-supervisor span {

/* 일반 신청인 - 연한 파란색 버튼 */
.schedule-people.wednesday-people {

.schedule-people.wednesday-people span {

/* 수요일 다크모드 */

body.dark-mode .wednesday-time,

}

}

<body>

<header class="top-bar">
  <button class="nav-btn" onclick="history.back()" aria-label="뒤로가기">‹</button>

  <h1>순회 방문 계획표</h1>

  <button class="nav-btn settings-button"
    type="button"
    onclick="toggleSettings()"
    aria-label="설정">⚙</button>
</header>
<main>

  <section class="week-card">
    <div class="week-title" id="weekTitle"></div>
    <div class="week-date" id="weekDate"></div>
  </section>

  <div id="scheduleContainer"></div>

</main><div id="settingsPanel" class="settings-panel">

  <div class="settings-theme-row">
    <button type="button" id="lightBtn"
      class="theme-btn" onclick="setTheme('light')">
      ☀ 밝게
    </button>

    <button type="button" id="darkBtn"
      class="theme-btn" onclick="setTheme('dark')">
      🌙 어둡게
    </button>
  </div>

  <div class="settings-font-row">
    <button type="button" class="font-btn"
      onclick="changeFont(-10)" aria-label="글자 작게">−</button>

    <div id="fontSize" class="font-size">100%</div>

    <button type="button" class="font-btn"
      onclick="changeFont(10)" aria-label="글자 크게">＋</button>
  </div>

</div>

<script>
function toggleSettings() {
  document.getElementById("settingsPanel")
    .classList.toggle("show");
}

let fontPercent = 100;

function setTheme(theme) {
  const isLight = theme === "light";

  document.body.classList.toggle("dark-mode", !isLight);

  document.getElementById("lightBtn")
    .classList.toggle("active", isLight);

  document.getElementById("darkBtn")
    .classList.toggle("active", !isLight);

  localStorage.setItem("northBoardTheme", theme);
}

function setFontPercent(percent) {
  fontPercent = Math.max(80, Math.min(150, percent));

  document.getElementById("fontSize").textContent =
    fontPercent + "%";

  document.querySelector("main").style.zoom =
    fontPercent + "%";

  localStorage.setItem(
    "northBoardFontPercent",
    String(fontPercent)
  );
}

function changeFont(amount) {
  setFontPercent(fontPercent + amount);
}

(function restoreSettings() {
  const savedTheme = localStorage.getItem("northBoardTheme");
  const savedFont = Number(
    localStorage.getItem("northBoardFontPercent")
  );

  setTheme(savedTheme === "light" ? "light" : "dark");

   setFontPercent(
    Number.isFinite(savedFont) &&
    savedFont >= 80 &&
    savedFont <= 150
      ? savedFont
      : 100
  );
})();

/* ===== 전체 일정 Apps Script 데이터 연결 ===== */

const FRIDAY_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzG_HeGUoqZHMzObeK6KD3ch22S7eMzG0jRx8KcM0Nf0k_Fy3KFjshZUzB6BNj7Eo7Wwg/exec";


function loadFridaySchedule() {

  window.receiveFridaySchedule = function(data) {

    if (!data || data.error || !data.rows) {
      document.getElementById("scheduleContainer").textContent =
        "일정을 불러오지 못했습니다.";
      return;
    }

    document.getElementById("weekTitle").textContent =
  data.rows["1"]?.b || "";

document.getElementById("weekDate").textContent =
  data.rows["2"]?.b || "";

    renderAllSchedules(data.rows);
  };

  const script = document.createElement("script");

  script.src = FRIDAY_SCRIPT_URL +
    "?callback=receiveFridaySchedule&t=" + Date.now();

  script.onerror = function() {
    document.getElementById("scheduleContainer").textContent =
      "일정 연결에 실패했습니다.";
  };

  document.body.appendChild(script);
}


function getB(rows, symbol) {
  return rows[symbol]?.b || "";
}


function getC(rows, symbol) {
  return rows[symbol]?.c || "";
}


function makeElement(tag, className, text) {

  const element = document.createElement(tag);

  if (className) {
    element.className = className;
  }

  element.textContent = text || "";

  return element;
}


function addLine(
  parent,
  text,
  className = "line",
  applyButtonDesign = false
) {
  if (!text) return;

  const lineText = String(text).trim();

  // 버튼 디자인 적용을 요청한 항목만 변경
  if (applyButtonDesign) {

    // 오전·오후 봉사 모임 장소
    if (
      /^(오전|오후)\b/.test(lineText) &&
      /\b(AM|PM)\s*\d{1,2}:\d{2}\b/i.test(lineText)
    ) {
      const time = makeElement("div", "schedule-time", "");

      const timeLabel = makeElement(
        "span",
        "time-label",
        lineText.replace(/봉사\s*모임\s*장소/g, "").trim()
      );

      const placeLabel = makeElement(
        "span",
        "place-label",
        "봉사 모임 장소"
      );

      time.appendChild(timeLabel);
      time.appendChild(placeLabel);
      parent.appendChild(time);
      return;
    }

    // 다양한 봉사
    if (lineText.includes("다양한 봉사")) {
      parent.appendChild(
        makeElement(
          "div",
          "service-activity-button",
          lineText
        )
      );
      return;
    }
  }

  // 그 밖의 항목은 기존 방식 그대로 표시
  parent.appendChild(
    makeElement("div", className, text)
  );
}


function addPeople(parent, rows, symbols, className = "people") {

  const people = makeElement("div", className, "");

  symbols.forEach(function(symbol) {

    const left = getB(rows, symbol);
    const right = getC(rows, symbol);

    if (left || right) {

      if (left) {
        people.appendChild(
          makeElement("span", "", left)
        );
      }

      if (right) {
        people.appendChild(
          makeElement("span", "", right)
        );
      }
    }
  });

  parent.appendChild(people);
}

function addLeader(parent, text) {

  if (text) {

    parent.appendChild(
      makeElement("div", "leader", "인도자 : " + text)
    );
  }
}


function addCard(container, title, leader) {

  const card = makeElement("section", "schedule-card", "");

  const header = makeElement("div", "day-header", "");

  header.appendChild(
    makeElement("div", "day-name", title)
  );

  header.appendChild(
    makeElement(
      "div",
      "day-leader",
      leader
        ? "인도자 : " + leader.replace(/^인도자\s*:\s*/, "")
        : ""
    )
  );

  card.appendChild(header);

  container.appendChild(card);

  return card;
}


function addFridayPart(
  container,
  rows,
  timeSymbol,
  activitySymbol,
  peopleSymbols
) {

  const timeText = getB(rows, timeSymbol);
  const activityText = getB(rows, activitySymbol);

  const time = makeElement("div", "schedule-time", "");

  const timeLabel = makeElement(
    "span",
    "time-label",
    timeText.replace(/봉사\s*모임장소/g, "").trim()
  );

  const placeLabel = makeElement(
    "span",
    "place-label",
    "봉사 모임 장소"
  );

  time.appendChild(timeLabel);
  time.appendChild(placeLabel);

  container.appendChild(time);

 addLine(
  container,
  activityText,
  "service-activity-button"
);

  const people = makeElement("div", "schedule-people", "");

  peopleSymbols.forEach(function(symbol) {

    [getB(rows, symbol), getC(rows, symbol)].forEach(function(name) {

      if (name) {
        people.appendChild(
          makeElement("span", "", name)
        );
      }
    });
  });

  container.appendChild(people);
}
