<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>외부 안내 봉사</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-main: #162331;
      --bg-gradient-1: #172634;
      --bg-gradient-2: #0f1b27;

      --panel-bg: rgba(38, 53, 68, 0.92);
      --panel-border: #3b4e61;

      --table-head: #34475a;
      --table-bg: #202f3c;
      --table-border: #3b4d5e;

      --text-main: #ffffff;
      --text-sub: #d7e0e8;

      --accent: #83e8ba;

      --button-bg: #34485b;
      --button-hover: #41576b;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.18);

      --font-scale: 1;
    }


    /* =========================================
       밝은 화면
    ========================================= */

    body.light {
      --bg-main: #eef3f7;
      --bg-gradient-1: #f4f7fa;
      --bg-gradient-2: #dfe8ef;

      --panel-bg: rgba(255, 255, 255, 0.96);
      --panel-border: #cbd7e1;

      --table-head: #dce6ee;
      --table-bg: #f7f9fb;
      --table-border: #ccd7e0;

      --text-main: #172331;
      --text-sub: #435466;

      --accent: #159c67;

      --button-bg: #dce6ee;
      --button-hover: #ccd9e3;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }


    /* =========================================
       BODY
    ========================================= */

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;

      font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        Arial,
        sans-serif;

      color: var(--text-main);

      background:
        radial-gradient(
          circle at top,
          var(--bg-gradient-1) 0%,
          var(--bg-gradient-2) 70%
        );

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }


    /* =========================================
       전체
    ========================================= */

    .page {
      width: 100%;
      max-width: 1100px;

      margin: 0 auto;

      padding: 22px 16px 50px;
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
      position: relative;

      text-align: center;

      padding: 8px 0 20px;
    }


    .header-title {
      margin: 0;

      font-size:
        clamp(28px, 4vw, 42px);

      font-weight: 900;

      letter-spacing: -1.5px;

      color: var(--text-main);
    }


    .header-month {
      margin-top: 12px;

      font-size:
        clamp(20px, 3vw, 28px);

      font-weight: 800;

      color: var(--text-main);
    }


    /* =========================================
       설정 버튼
    ========================================= */

    .settings-button {
      position: absolute;

      right: 0;
      top: 0;

      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--panel-border);
      border-radius: 50%;

      background: var(--button-bg);
      color: var(--text-main);

      font-size: 23px;
      line-height: 1;

      cursor: pointer;

      z-index: 1100;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }


    .settings-button:hover {
      background: var(--button-hover);

      transform: rotate(15deg);
    }


    /* =========================================
       설정창
       
       전시대 참여자와 같은 느낌의
       작은 설정창
    ========================================= */

    .settings-panel {
      display: none;

      position: absolute;

      right: 0;
      top: 62px;

      width: 270px;

      padding: 16px;

      border: 1px solid var(--panel-border);
      border-radius: 12px;

      background: var(--panel-bg);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.30);

      z-index: 1000;

      text-align: left;
    }


    .settings-panel.show {
      display: block;
    }


    .settings-title {
      margin: 0 0 14px;

      color: var(--text-main);

      font-size: 14px;

      font-weight: 900;
    }


    .settings-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      width: 100%;

      margin-bottom: 10px;

      gap: 10px;
    }


    .settings-row:last-child {
      margin-bottom: 0;
    }


    .settings-label {
      flex: 0 0 auto;

      color: var(--text-main);

      font-size: 13px;

      font-weight: 800;

      white-space: nowrap;
    }


    /* =========================================
       설정 버튼 그룹
    ========================================= */

    .theme-buttons,
    .font-buttons {
      display: flex;

      align-items: center;

      gap: 5px;

      flex: 0 0 auto;
    }


    .theme-buttons button,
    .font-buttons button {

      height: 36px;

      min-width: 38px;

      padding: 0 9px;

      border: none;

      border-radius: 7px;

      background: var(--button-bg);

      color: var(--text-main);

      font-family: inherit;

      font-size: 12px;

      font-weight: 800;

      white-space: nowrap;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }


    .theme-buttons button:hover,
    .font-buttons button:hover {

      background: var(--button-hover);

      transform: translateY(-1px);
    }


    /* 가운데 100% 표시 */

    .font-size-value {

      min-width: 42px;

      height: 36px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: var(--text-main);

      font-size: 12px;

      font-weight: 800;
    }


    /* =========================================
       상단 액션
       
       순서:
       뒤로가기 → 새로고침
    ========================================= */

    .actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-bottom: 12px;
    }


    .action-button {

      border: 1px solid var(--panel-border);

      border-radius: 10px;

      padding: 11px 17px;

      background: var(--button-bg);

      color: var(--text-main);

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }


    .action-button:hover {

      background: var(--button-hover);

      transform: translateY(-1px);
    }


    /* =========================================
       기본 SECTION
    ========================================= */

    .section {

      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }


    .section-title {

      margin: 0 0 12px;

      font-size:
        calc(
          clamp(19px, 3vw, 24px)
          * var(--font-scale)
        );

      font-weight: 900;

      letter-spacing: -0.7px;
    }


    /* =========================================
       집회 표
    ========================================= */

    .schedule-table-wrap {

      width: 100%;

      border: 1px solid var(--table-border);

      border-radius: 11px;

      overflow: hidden;
    }


    .schedule-table {

      width: 100%;

      border-collapse: collapse;

      table-layout: fixed;

      background: var(--table-bg);
    }


    .schedule-table th {

      height: 42px;

      padding: 9px 8px;

      border-right: 1px solid var(--table-border);

      border-bottom: 1px solid var(--table-border);

      background: var(--table-head);

      color: var(--text-main);

      text-align: center;

      font-size:
        calc(15px * var(--font-scale));

      font-weight: 900;
    }


    .schedule-table td {

      height: 41px;

      padding: 9px 8px;

      border-right: 1px solid var(--table-border);

      border-bottom: 1px solid var(--table-border);

      color: var(--text-main);

      text-align: center;

      font-size:
        calc(15px * var(--font-scale));

      font-weight: 600;
    }


    .schedule-table th:last-child,
    .schedule-table td:last-child {

      border-right: none;
    }


    .schedule-table tr:last-child td {

      border-bottom: none;
    }


    .schedule-table tbody tr:hover {

      background:
        rgba(255, 255, 255, 0.035);
    }


    /* =========================================
       주차 안내
       
       ★ 집단 청소보다 먼저 표시
    ========================================= */

    .parking-section {

      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }


    .parking-text {

      padding: 13px 15px;

      border: 1px solid var(--table-border);

      border-radius: 10px;

      background: var(--table-bg);

      color: var(--text-main);

      font-size:
        calc(15px * var(--font-scale));

      line-height: 1.65;

      font-weight: 600;

      text-align: left;
    }


    /* =========================================
       집단 청소 및 내부 안내인
       
       ★ 주차 안내 다음
       ★ 제목 좌측
       ★ C집단 박스
       ★ C집단 기존보다 약 2배
    ========================================= */

    .cleaning-section {

      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }


    .cleaning-title {

      margin: 0 0 12px;

      color: var(--text-main);

      font-size:
        calc(
          clamp(19px, 3vw, 24px)
          * var(--font-scale)
        );

      font-weight: 900;

      letter-spacing: -0.7px;

      text-align: left;
    }


    .cleaning-box {

      width: 100%;

      padding: 13px 15px;

      border: 1px solid var(--table-border);

      border-radius: 10px;

      background: var(--table-bg);

      color: var(--accent);

      text-align: left;

      /*
       * 기존 16px → 약 2배
       */
      font-size:
        calc(32px * var(--font-scale));

      line-height: 1.35;

      font-weight: 900;
    }


    /* =========================================
       안내사항
    ========================================= */

    .notice-section {

      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }


    .notice-list {

      overflow: hidden;

      border: 1px solid var(--table-border);

      border-radius: 11px;

      background: var(--table-bg);
    }


    .notice-item {

      padding: 11px 14px;

      border-bottom: 1px solid var(--table-border);

      color: var(--text-main);

      font-size:
        calc(15px * var(--font-scale));

      line-height: 1.55;

      font-weight: 600;
    }


    .notice-item:last-child {

      border-bottom: none;
    }


    /* =========================================
       로딩
    ========================================= */

    .loading {

      padding: 60px 20px;

      text-align: center;

      color: var(--text-sub);

      font-size: 17px;

      font-weight: 700;
    }


    /* =========================================
       오류
    ========================================= */

    .error {

      margin: 30px auto;

      padding: 20px;

      border: 1px solid #8a4a4a;

      border-radius: 12px;

      background:
        rgba(100, 30, 30, 0.3);

      color: #ffb8b8;

      text-align: center;

      line-height: 1.6;
    }


    /* =========================================
       모바일
    ========================================= */

    @media (max-width: 700px) {

      .page {

        padding:
          14px
          10px
          35px;
      }


      .header {

        padding-right: 55px;
      }


      .settings-button {

        width: 46px;
        height: 46px;

        font-size: 20px;
      }


      .settings-panel {

        top: 56px;

        right: 0;

        width:
          min(
            270px,
            calc(100vw - 24px)
          );

        padding: 15px;

        border-radius: 12px;
      }


      .settings-title {

        font-size: 14px;

        margin-bottom: 12px;
      }


      .settings-row {

        gap: 7px;

        margin-bottom: 9px;
      }


      .settings-label {

        font-size: 12px;
      }


      .theme-buttons,
      .font-buttons {

        gap: 4px;
      }


      .theme-buttons button,
      .font-buttons button {

        height: 34px;

        min-width: 36px;

        padding: 0 7px;

        font-size: 11px;
      }


      .font-size-value {

        height: 34px;

        min-width: 40px;

        font-size: 11px;
      }


      .actions {

        justify-content: stretch;
      }


      .action-button {

        flex: 1;

        padding: 10px 8px;

        font-size: 14px;
      }


      .section,
      .parking-section,
      .cleaning-section,
      .notice-section {

        padding: 12px;

        border-radius: 16px;
      }


      .schedule-table th,
      .schedule-table td {

        font-size:
          calc(14px * var(--font-scale));

        padding:
          8px 5px;
      }


      .parking-text {

        font-size:
          calc(14px * var(--font-scale));

        padding:
          12px 13px;
      }


      .cleaning-box {

        padding:
          12px 13px;

        font-size:
          calc(30px * var(--font-scale));
      }


      .notice-item {

        font-size:
          calc(14px * var(--font-scale));

        padding:
          10px 11px;
      }

    }

  </style>
</head>


<body>


<div class="page">


  <!-- =========================================
       헤더
  ========================================== -->

  <header class="header">


    <button
      class="settings-button"
      onclick="toggleSettings()"
      aria-label="설정"
    >
      ⚙
    </button>


    <h1 class="header-title">
      👥 외부 안내 봉사
    </h1>


    <div
      id="month"
      class="header-month"
    >
      불러오는 중...
    </div>


    <!-- =====================================
         설정
    ====================================== -->

    <div
      id="settingsPanel"
      class="settings-panel"
    >


      <div class="settings-title">
        설정
      </div>


      <!-- 화면 -->

      <div class="settings-row">

        <div class="settings-label">
          화면
        </div>


        <div class="theme-buttons">

          <button
            type="button"
            onclick="setTheme('light')"
          >
            ☀️ 밝게
          </button>


          <button
            type="button"
            onclick="setTheme('dark')"
          >
            🌙 어둡게
          </button>

        </div>

      </div>


      <!-- 글자 크기 -->

      <div class="settings-row">

        <div class="settings-label">
          글자 크기
        </div>


        <div class="font-buttons">

          <button
            type="button"
            onclick="changeFontSize(-1)"
          >
            −
          </button>


          <div
            id="fontSizeValue"
            class="font-size-value"
          >
            100%
          </div>


          <button
            type="button"
            onclick="changeFontSize(1)"
          >
            ＋
          </button>

        </div>

      </div>


    </div>

  </header>


  <!-- =========================================
       상단 버튼
       
       ★ 순서 변경
       뒤로가기 → 새로고침
  ========================================== -->

  <div class="actions">


    <button
      class="action-button"
      onclick="goBack()"
    >
      ← 뒤로가기
    </button>


    <button
      class="action-button"
      onclick="loadData()"
    >
      ↻ 새로고침
    </button>


  </div>


  <!-- =========================================
       데이터
  ========================================== -->

  <main id="content">

    <div class="loading">
      안내 봉사 정보를 불러오는 중입니다...
    </div>

  </main>


</div>



<script>


  /* =========================================================
     안내 봉사 API

     ★ 사용자가 직접 확인한 URL
     ★ 변경하지 않음
  ========================================================= */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxizrC1woLHdgCfASCVle2Pgrd7FkfEYvO-am-2svWb69QThZXH6qLRfcXz4vEcWUeWEQ/exec";


  /* =========================================================
     시작
  ========================================================= */

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      loadSavedSettings();

      loadData();

    }
  );


  /* =========================================================
     데이터 불러오기
  ========================================================= */

  async function loadData() {

    const content =
      document.getElementById(
        "content"
      );


    content.innerHTML = `
      <div class="loading">
        안내 봉사 정보를 불러오는 중입니다...
      </div>
    `;


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "서버 응답 오류: " +
          response.status
        );

      }


      const result =
        await response.json();


      if (
        !result ||
        result.success !== true
      ) {

        throw new Error(
          result && result.error
            ? result.error
            : "안내 데이터를 불러오지 못했습니다."
        );

      }


      renderData(result);

    }


    catch (error) {

      console.error(
        "안내 데이터 오류:",
        error
      );


      content.innerHTML = `
        <div class="error">

          <strong>
            안내 봉사 정보를 불러오지 못했습니다.
          </strong>

          <br><br>

          ${escapeHtml(
            error.message ||
            "알 수 없는 오류가 발생했습니다."
          )}

          <br><br>

          <button
            class="action-button"
            onclick="loadData()"
          >
            다시 시도
          </button>

        </div>
      `;

    }

  }


  /* =========================================================
     전체 데이터 표시
  ========================================================= */

  function renderData(result) {


    const byNumber =
      result.byNumber || {};


    /* -----------------------------------------
       월
    ----------------------------------------- */

    const month =
      getCell(
        byNumber,
        "1",
        "b"
      );


    document.getElementById(
      "month"
    ).textContent =
      month ||
      result.month ||
      "";


    /* -----------------------------------------
       평일
       2-1은 헤더이므로 제외
       2-2 ~ 2-6
    ----------------------------------------- */

    const weekdayRows = [];


    for (
      let i = 2;
      i <= 6;
      i++
    ) {

      const row =
        byNumber[
          "2-" + i
        ];


      if (!row) {
        continue;
      }


      const date =
        cleanText(row.b);


      const volunteer1 =
        cleanText(row.c);


      const volunteer2 =
        cleanText(row.d);


      if (
        !date &&
        !volunteer1 &&
        !volunteer2
      ) {

        continue;

      }


      weekdayRows.push({
        date,
        volunteer1,
        volunteer2
      });

    }


    /* -----------------------------------------
       주말
       3-1은 헤더이므로 제외
       3-2 ~ 3-6
       빈 행은 자동 제외
    ----------------------------------------- */

    const weekendRows = [];


    for (
      let i = 2;
      i <= 6;
      i++
    ) {

      const row =
        byNumber[
          "3-" + i
        ];


      if (!row) {
        continue;
      }


      const date =
        cleanText(row.b);


      const volunteer1 =
        cleanText(row.c);


      const volunteer2 =
        cleanText(row.d);


      if (
        !date &&
        !volunteer1 &&
        !volunteer2
      ) {

        continue;

      }


      weekendRows.push({
        date,
        volunteer1,
        volunteer2
      });

    }


    /* -----------------------------------------
       집단 청소 및 내부 안내인

       5-D = C집단

       B열의
       [집단 청소 및 내부 안내인] : C집단
       전체 문장은 사용하지 않음
    ----------------------------------------- */

    const cleaningRow =
      byNumber["5"] || {};


    let cleaningGroup =
      cleanText(
        cleaningRow.d
      );


    /*
     * D열이 비어 있으면
     * B열의 : 뒤에 있는 집단명 사용
     */

    if (!cleaningGroup) {

      const cleaningText =
        cleanText(
          cleaningRow.b
        );


      if (
        cleaningText.includes(":")
      ) {

        cleaningGroup =
          cleaningText
            .split(":")
            .slice(1)
            .join(":")
            .trim();

      }

    }


    /* -----------------------------------------
       주차 안내
    ----------------------------------------- */

    const parkingRow =
      byNumber["4"] || {};


    const parkingText =
      cleanText(
        parkingRow.b
      );


    /* -----------------------------------------
       안내사항 6~11
    ----------------------------------------- */

    const notices = [];


    for (
      let i = 6;
      i <= 11;
      i++
    ) {

      const row =
        byNumber[
          String(i)
        ];


      if (!row) {
        continue;
      }


      const parts = [

        cleanText(row.b),

        cleanText(row.c),

        cleanText(row.d)

      ].filter(Boolean);


      if (
        parts.length === 0
      ) {

        continue;

      }


      notices.push(
        parts.join(" ")
      );

    }


    /* =====================================================
       화면 구성
    ===================================================== */

    let html = "";


    /* -----------------------------------------
       평일
    ----------------------------------------- */

    html += `

      <section class="section">

        <h2 class="section-title">
          평일 집회(화)
        </h2>

        ${createScheduleTable(
          weekdayRows
        )}

      </section>

    `;


    /* -----------------------------------------
       주말
    ----------------------------------------- */

    html += `

      <section class="section">

        <h2 class="section-title">
          주말 집회(토)
        </h2>

        ${createScheduleTable(
          weekendRows
        )}

      </section>

    `;


    /* -----------------------------------------
       ★ 주차 안내

       집단 청소보다 먼저
    ----------------------------------------- */

    if (parkingText) {

      html += `

        <section class="parking-section">

          <h2 class="section-title">
            주차 안내
          </h2>

          <div class="parking-text">
            ${escapeHtml(
              parkingText
            )}
          </div>

        </section>

      `;

    }


    /* -----------------------------------------
       ★ 집단 청소 및 내부 안내인

       주차 안내 다음

       C집단만 표시
    ----------------------------------------- */

    if (cleaningGroup) {

      html += `

        <section class="cleaning-section">

          <h2 class="cleaning-title">
            집단 청소 및 내부 안내인
          </h2>

          <div class="cleaning-box">
            ${escapeHtml(
              cleaningGroup
            )}
          </div>

        </section>

      `;

    }


    /* -----------------------------------------
       안내사항
    ----------------------------------------- */

    if (
      notices.length > 0
    ) {

      html += `

        <section class="notice-section">

          <h2 class="section-title">
            안내사항
          </h2>

          <div class="notice-list">

      `;


      notices.forEach(
        function (notice) {

          html += `

            <div class="notice-item">
              ${escapeHtml(
                notice
              )}
            </div>

          `;

        }
      );


      html += `

          </div>

        </section>

      `;

    }


    document.getElementById(
      "content"
    ).innerHTML = html;

  }


  /* =========================================================
     집회 표 생성
  ========================================================= */

  function createScheduleTable(
    rows
  ) {


    if (
      !rows ||
      rows.length === 0
    ) {

      return `

        <div class="schedule-table-wrap">

          <table class="schedule-table">

            <thead>

              <tr>
                <th>날짜</th>
                <th>봉사자1</th>
                <th>봉사자2</th>
              </tr>

            </thead>

            <tbody>

              <tr>

                <td colspan="3">
                  등록된 일정이 없습니다.
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      `;

    }


    let html = `

      <div class="schedule-table-wrap">

        <table class="schedule-table">

          <thead>

            <tr>

              <th>날짜</th>

              <th>봉사자1</th>

              <th>봉사자2</th>

            </tr>

          </thead>

          <tbody>

    `;


    rows.forEach(
      function (row) {

        html += `

          <tr>

            <td>
              ${escapeHtml(
                row.date
              )}
            </td>

            <td>
              ${escapeHtml(
                row.volunteer1
              )}
            </td>

            <td>
              ${escapeHtml(
                row.volunteer2
              )}
            </td>

          </tr>

        `;

      }
    );


    html += `

          </tbody>

        </table>

      </div>

    `;


    return html;

  }


  /* =========================================================
     셀 가져오기
  ========================================================= */

  function getCell(
    byNumber,
    number,
    column
  ) {

    if (
      !byNumber ||
      !byNumber[number]
    ) {

      return "";

    }


    return cleanText(
      byNumber[number][column]
    );

  }


  /* =========================================================
     텍스트 정리
  ========================================================= */

  function cleanText(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .trim();

  }


  /* =========================================================
     HTML 보호
  ========================================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value === null ||
      value === undefined
        ? ""
        : value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================================================
     뒤로가기
  ========================================================= */

  function goBack() {

    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "index.html";

    }

  }


  /* =========================================================
     설정창
  ========================================================= */

  function toggleSettings() {

    const panel =
      document.getElementById(
        "settingsPanel"
      );


    panel.classList.toggle(
      "show"
    );

  }


  /* =========================================================
     화면 테마
  ========================================================= */

  function setTheme(
    theme
  ) {

    if (
      theme === "light"
    ) {

      document.body.classList.add(
        "light"
      );

    } else {

      document.body.classList.remove(
        "light"
      );

    }


    localStorage.setItem(
      "guideTheme",
      theme
    );

  }


  /* =========================================================
     글자 크기

     기본 = 100%
     - = 90%
     + = 110%

     계속 누르면 단계별 변경
  ========================================================= */

  function changeFontSize(
    direction
  ) {

    let scale =
      parseInt(
        localStorage.getItem(
          "guideFontScale"
        ) || "100",
        10
      );


    if (
      direction < 0
    ) {

      scale -= 10;

    }


    if (
      direction > 0
    ) {

      scale += 10;

    }


    scale =
      Math.max(
        70,
        Math.min(
          140,
          scale
        )
      );


    const scaleValue =
      scale / 100;


    document.documentElement.style.setProperty(
      "--font-scale",
      scaleValue
    );


    const display =
      document.getElementById(
        "fontSizeValue"
      );


    if (display) {

      display.textContent =
        scale + "%";

    }


    localStorage.setItem(
      "guideFontScale",
      scale
    );

  }


  /* =========================================================
     저장된 설정 불러오기
  ========================================================= */

  function loadSavedSettings() {


    /* 테마 */

    const savedTheme =
      localStorage.getItem(
        "guideTheme"
      );


    if (
      savedTheme === "light"
    ) {

      document.body.classList.add(
        "light"
      );

    }


    /* 글자 크기 */

    const savedScale =
      parseInt(
        localStorage.getItem(
          "guideFontScale"
        ) || "100",
        10
      );


    const safeScale =
      Math.max(
        70,
        Math.min(
          140,
          savedScale
        )
      );


    document.documentElement.style.setProperty(
      "--font-scale",
      safeScale / 100
    );


    const display =
      document.getElementById(
        "fontSizeValue"
      );


    if (display) {

      display.textContent =
        safeScale + "%";

    }

  }


  /* =========================================================
     설정창 바깥 클릭
  ========================================================= */

  document.addEventListener(
    "click",
    function (event) {

      const panel =
        document.getElementById(
          "settingsPanel"
        );


      const button =
        document.querySelector(
          ".settings-button"
        );


      if (
        panel.classList.contains("show") &&
        !panel.contains(event.target) &&
        !button.contains(event.target)
      ) {

        panel.classList.remove(
          "show"
        );

      }

    }
  );

</script>
