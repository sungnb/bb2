<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>외부 안내 봉사</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-main: #162331;
      --bg-gradient-1: #172634;
      --bg-gradient-2: #0f1b27;

      --panel-bg: rgba(38, 53, 68, 0.92);
      --panel-border: #3b4e61;

      --table-head: #34475a;
      --table-bg: #202f3c;
      --table-border: #3b4d5e;

      --text-main: #ffffff;
      --text-sub: #d7e0e8;

      --accent: #83e8ba;
      --accent-dark: #62dca4;

      --button-bg: #34485b;
      --button-hover: #41576b;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.18);

      --font-size-base: 16px;
    }

    body.light {
      --bg-main: #eef3f7;
      --bg-gradient-1: #f4f7fa;
      --bg-gradient-2: #dfe8ef;

      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: #cbd7e1;

      --table-head: #dce6ee;
      --table-bg: #f7f9fb;
      --table-border: #ccd7e0;

      --text-main: #172331;
      --text-sub: #435466;

      --accent: #159c67;
      --accent-dark: #0f8054;

      --button-bg: #dce6ee;
      --button-hover: #ccd9e3;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    html {
      font-size: var(--font-size-base);
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;

      font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        Arial,
        sans-serif;

      color: var(--text-main);

      background:
        radial-gradient(
          circle at top,
          var(--bg-gradient-1) 0%,
          var(--bg-gradient-2) 70%
        );

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    /* =========================
       전체 페이지
    ========================= */

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    /* =========================
       헤더
    ========================= */

    .header {
      position: relative;
      text-align: center;
      padding: 8px 0 20px;
    }

    .header-title {
      margin: 0;

      font-size: clamp(28px, 4vw, 42px);
      font-weight: 900;
      letter-spacing: -1.5px;

      color: var(--text-main);
    }

    .header-month {
      margin-top: 12px;

      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;

      color: var(--text-main);
    }

    /* =========================
       설정 버튼
    ========================= */

    .settings-button {
      position: absolute;
      right: 0;
      top: 0;

      width: 52px;
      height: 52px;

      border: 1px solid var(--panel-border);
      border-radius: 50%;

      background: var(--button-bg);
      color: var(--text-main);

      font-size: 25px;
      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .settings-button:hover {
      background: var(--button-hover);
      transform: rotate(15deg);
    }

    /* =========================
       설정 패널
    ========================= */

    .settings-panel {
      display: none;

      position: absolute;
      right: 0;
      top: 62px;

      width: 230px;
      z-index: 1000;

      padding: 18px;

      border: 1px solid var(--panel-border);
      border-radius: 14px;

      background: var(--panel-bg);
      box-shadow: var(--shadow);

      text-align: left;
    }

    .settings-panel.show {
      display: block;
    }

    .settings-title {
      margin-bottom: 12px;

      font-size: 15px;
      font-weight: 800;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;
    }

    .settings-label {
      font-size: 14px;
      font-weight: 700;
    }

    .theme-buttons {
      display: flex;
      gap: 5px;
    }

    .theme-buttons button,
    .font-buttons button {
      border: 1px solid var(--panel-border);
      border-radius: 7px;

      padding: 6px 9px;

      background: var(--button-bg);
      color: var(--text-main);

      cursor: pointer;
    }

    .theme-buttons button:hover,
    .font-buttons button:hover {
      background: var(--button-hover);
    }

    .font-buttons {
      display: flex;
      gap: 5px;
    }

    /* =========================
       액션 버튼
    ========================= */

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-bottom: 12px;
    }

    .action-button {
      border: 1px solid var(--panel-border);
      border-radius: 10px;

      padding: 11px 17px;

      background: var(--button-bg);
      color: var(--text-main);

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .action-button:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    /* =========================
       기본 섹션
    ========================= */

    .section {
      margin-top: 14px;
      padding: 16px;

      border: 1px solid var(--panel-border);
      border-radius: 20px;

      background: var(--panel-bg);
      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .section-title {
      margin: 0 0 12px;

      font-size: clamp(19px, 3vw, 24px);
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    /* =========================
       집회 표
    ========================= */

    .schedule-table-wrap {
      width: 100%;
      overflow-x: auto;

      border: 1px solid var(--table-border);
      border-radius: 11px;

      overflow: hidden;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;

      background: var(--table-bg);
    }

    .schedule-table th {
      height: 42px;

      padding: 9px 8px;

      border-right: 1px solid var(--table-border);
      border-bottom: 1px solid var(--table-border);

      background: var(--table-head);
      color: var(--text-main);

      text-align: center;

      font-size: 15px;
      font-weight: 900;
    }

    .schedule-table td {
      height: 41px;

      padding: 9px 8px;

      border-right: 1px solid var(--table-border);
      border-bottom: 1px solid var(--table-border);

      color: var(--text-main);

      text-align: center;

      font-size: 15px;
      font-weight: 600;
    }

    .schedule-table th:last-child,
    .schedule-table td:last-child {
      border-right: none;
    }

    .schedule-table tr:last-child td {
      border-bottom: none;
    }

    .schedule-table tbody tr {
      transition: background 0.15s ease;
    }

    .schedule-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.035);
    }

    /* =========================
       집단 청소 및 내부 안내인
    ========================= */

    .cleaning-section {
      margin-top: 14px;
      padding: 26px 18px 30px;

      border: 1px solid var(--panel-border);
      border-radius: 20px;

      background: var(--panel-bg);
      box-shadow: var(--shadow);

      text-align: center;
    }

    .cleaning-title {
      margin: 0;

      font-size: clamp(20px, 3vw, 25px);
      font-weight: 900;
      letter-spacing: -0.8px;
    }

    .cleaning-group {
      margin-top: 14px;

      font-size: clamp(52px, 10vw, 88px);
      line-height: 1;

      font-weight: 1000;
      letter-spacing: -3px;

      color: var(--accent);

      text-shadow:
        0 2px 10px rgba(0, 0, 0, 0.12);
    }

    /* =========================
       주차 안내
    ========================= */

    .parking-section {
      margin-top: 14px;
      padding: 16px;

      border: 1px solid var(--panel-border);
      border-radius: 20px;

      background: var(--panel-bg);
      box-shadow: var(--shadow);
    }

    .parking-text {
      padding: 13px 15px;

      border: 1px solid var(--table-border);
      border-radius: 10px;

      background: var(--table-bg);

      color: var(--text-main);

      font-size: 15px;
      line-height: 1.65;
      font-weight: 600;
    }

    /* =========================
       안내사항
    ========================= */

    .notice-section {
      margin-top: 14px;
      padding: 16px;

      border: 1px solid var(--panel-border);
      border-radius: 20px;

      background: var(--panel-bg);
      box-shadow: var(--shadow);
    }

    .notice-list {
      overflow: hidden;

      border: 1px solid var(--table-border);
      border-radius: 11px;

      background: var(--table-bg);
    }

    .notice-item {
      padding: 11px 14px;

      border-bottom: 1px solid var(--table-border);

      color: var(--text-main);

      font-size: 15px;
      line-height: 1.55;
      font-weight: 600;
    }

    .notice-item:last-child {
      border-bottom: none;
    }

    /* =========================
       로딩
    ========================= */

    .loading {
      padding: 60px 20px;

      text-align: center;

      color: var(--text-sub);

      font-size: 17px;
      font-weight: 700;
    }

    /* =========================
       오류
    ========================= */

    .error {
      margin: 30px auto;
      padding: 20px;

      border: 1px solid #8a4a4a;
      border-radius: 12px;

      background: rgba(100, 30, 30, 0.3);

      color: #ffb8b8;

      text-align: center;

      line-height: 1.6;
    }

    /* =========================
       반응형
    ========================= */

    @media (max-width: 700px) {
      .page {
        padding: 14px 10px 35px;
      }

      .header {
        padding-right: 55px;
      }

      .settings-button {
        width: 46px;
        height: 46px;

        font-size: 21px;
      }

      .actions {
        justify-content: stretch;
      }

      .action-button {
        flex: 1;

        padding: 10px 8px;

        font-size: 14px;
      }

      .section,
      .cleaning-section,
      .parking-section,
      .notice-section {
        padding: 12px;
        border-radius: 16px;
      }

      .schedule-table th,
      .schedule-table td {
        font-size: 14px;
        padding: 8px 5px;
      }

      .cleaning-section {
        padding: 23px 12px 27px;
      }

      .cleaning-group {
        font-size: clamp(54px, 18vw, 78px);
      }

      .notice-item {
        font-size: 14px;
        padding: 10px 11px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- =========================
       헤더
  ========================== -->

  <header class="header">

    <button
      class="settings-button"
      onclick="toggleSettings()"
      aria-label="설정"
    >
      ⚙
    </button>

    <h1 class="header-title">
      👥 외부 안내 봉사
    </h1>

    <div
      id="month"
      class="header-month"
    >
      불러오는 중...
    </div>

    <!-- 설정 패널 -->

    <div
      id="settingsPanel"
      class="settings-panel"
    >

      <div class="settings-title">
        화면 설정
      </div>

      <div class="settings-row">

        <span class="settings-label">
          화면
        </span>

        <div class="theme-buttons">
          <button onclick="setTheme('dark')">
            어둡게
          </button>

          <button onclick="setTheme('light')">
            밝게
          </button>
        </div>

      </div>

      <div class="settings-row">

        <span class="settings-label">
          글자 크기
        </span>

        <div class="font-buttons">
          <button onclick="changeFontSize(-1)">
            A-
          </button>

          <button onclick="changeFontSize(0)">
            기본
          </button>

          <button onclick="changeFontSize(1)">
            A+
          </button>
        </div>

      </div>

    </div>

  </header>


  <!-- =========================
       버튼
  ========================== -->

  <div class="actions">

    <button
      class="action-button"
      onclick="loadData()"
    >
      ↻ 새로고침
    </button>

    <button
      class="action-button"
      onclick="goBack()"
    >
      ← 뒤로가기
    </button>

  </div>


  <!-- =========================
       실제 데이터
  ========================== -->

  <main id="content">

    <div class="loading">
      안내 봉사 정보를 불러오는 중입니다...
    </div>

  </main>

</div>


<script>

  /*
   * ==========================================================
   * 안내 봉사 API
   *
   * 사용자가 직접 확인하여 입력한 정확한 URL입니다.
   * 임의로 변경하지 마십시오.
   * ==========================================================
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxizrC1woLHdgCfASCVle2Pgrd7FkfEYvO-am-2svWb69QThZXH6qLRfcXz4vEcWUeWEQ/exec";


  /*
   * ==========================================================
   * 페이지 시작
   * ==========================================================
   */

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      loadSavedSettings();

      loadData();

    }
  );


  /*
   * ==========================================================
   * 데이터 불러오기
   * ==========================================================
   */

  async function loadData() {

    const content =
      document.getElementById("content");

    content.innerHTML = `
      <div class="loading">
        안내 봉사 정보를 불러오는 중입니다...
      </div>
    `;

    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "GET",
            cache: "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          "서버 응답 오류: " + response.status
        );

      }

      const result =
        await response.json();


      if (
        !result ||
        result.success !== true
      ) {

        throw new Error(
          result && result.error
            ? result.error
            : "안내 데이터를 불러오지 못했습니다."
        );

      }


      renderData(result);

    }

    catch (error) {

      console.error(
        "안내 데이터 오류:",
        error
      );

      content.innerHTML = `
        <div class="error">

          <strong>
            안내 봉사 정보를 불러오지 못했습니다.
          </strong>

          <br><br>

          ${escapeHtml(
            error.message ||
            "알 수 없는 오류가 발생했습니다."
          )}

          <br><br>

          <button
            class="action-button"
            onclick="loadData()"
          >
            다시 시도
          </button>

        </div>
      `;

    }

  }


  /*
   * ==========================================================
   * 전체 화면 출력
   * ==========================================================
   */

  function renderData(result) {

    /*
     * API에서 byNumber를 우선 사용합니다.
     *
     * 현재 안내 시트:
     *
     * 1     → 월
     * 2-2   → 평일 1번째
     * 2-3   → 평일 2번째
     * 2-4   → 평일 3번째
     * 2-5   → 평일 4번째
     * 2-6   → 평일 5번째
     *
     * 3-2   → 주말 1번째
     * 3-3   → 주말 2번째
     * 3-4   → 주말 3번째
     * 3-5   → 주말 4번째
     * 3-6   → 빈 행이므로 표시하지 않음
     *
     * 4     → 외부 주차 안내
     * 5     → 집단 청소 및 내부 안내인
     * 6~11  → 안내사항
     */

    const byNumber =
      result.byNumber || {};


    /*
     * --------------------------
     * 월
     * --------------------------
     */

    const month =
      getCell(
        byNumber,
        "1",
        "b"
      );

    document.getElementById(
      "month"
    ).textContent =
      month || result.month || "";


    /*
     * --------------------------
     * 평일
     * --------------------------
     */

    const weekdayRows =
      [];

    for (
      let i = 2;
      i <= 6;
      i++
    ) {

      const number =
        "2-" + i;

      const row =
        byNumber[number];

      if (!row) {
        continue;
      }

      const date =
        cleanText(row.b);

      const volunteer1 =
        cleanText(row.c);

      const volunteer2 =
        cleanText(row.d);


      /*
       * 날짜와 봉사자 모두 없는 완전 빈 행은
       * 화면에 표시하지 않습니다.
       */

      if (
        !date &&
        !volunteer1 &&
        !volunteer2
      ) {
        continue;
      }


      weekdayRows.push({
        date,
        volunteer1,
        volunteer2
      });

    }


    /*
     * --------------------------
     * 주말
     * --------------------------
     */

    const weekendRows =
      [];

    for (
      let i = 2;
      i <= 6;
      i++
    ) {

      const number =
        "3-" + i;

      const row =
        byNumber[number];

      if (!row) {
        continue;
      }

      const date =
        cleanText(row.b);

      const volunteer1 =
        cleanText(row.c);

      const volunteer2 =
        cleanText(row.d);


      if (
        !date &&
        !volunteer1 &&
        !volunteer2
      ) {
        continue;
      }


      weekendRows.push({
        date,
        volunteer1,
        volunteer2
      });

    }


    /*
     * --------------------------
     * 집단 청소 및 내부 안내인
     * --------------------------
     */

    const cleaningRow =
      byNumber["5"] || {};

    /*
     * B열 전체 문장
     * "[집단 청소 및 내부 안내인] : C집단"
     * 은 사용하지 않습니다.
     *
     * D열에 있는 C집단을 우선 사용합니다.
     */

    let cleaningGroup =
      cleanText(cleaningRow.d);

    /*
     * D열이 비어 있는 경우를 대비하여
     * B열에서 콜론 뒤의 집단명만 추출합니다.
     */

    if (!cleaningGroup) {

      const cleaningText =
        cleanText(cleaningRow.b);

      if (cleaningText.includes(":")) {

        cleaningGroup =
          cleaningText
            .split(":")
            .slice(1)
            .join(":")
            .trim();

      }

    }


    /*
     * --------------------------
     * 주차 안내
     * --------------------------
     */

    const parkingRow =
      byNumber["4"] || {};

    const parkingText =
      cleanText(parkingRow.b);


    /*
     * --------------------------
     * 안내사항 6~11
     * --------------------------
     */

    const notices =
      [];

    for (
      let i = 6;
      i <= 11;
      i++
    ) {

      const row =
        byNumber[String(i)];

      if (!row) {
        continue;
      }

      const parts =
        [
          cleanText(row.b),
          cleanText(row.c),
          cleanText(row.d)
        ].filter(Boolean);

      if (parts.length === 0) {
        continue;
      }

      notices.push(
        parts.join(" ")
      );

    }


    /*
     * ==========================================================
     * 화면 생성
     *
     * 중요:
     * 평일 우측 "5회"
     * 주말 우측 "4회"
     * 안내 "1건"
     * 안내 "6건"
     *
     * 등의 카운트/배지는 전부 만들지 않습니다.
     * ==========================================================
     */

    let html = "";


    /*
     * --------------------------
     * 평일 집회
     * --------------------------
     */

    html += `
      <section class="section">

        <h2 class="section-title">
          평일 집회(화)
        </h2>

        ${createScheduleTable(
          weekdayRows
        )}

      </section>
    `;


    /*
     * --------------------------
     * 주말 집회
     * --------------------------
     */

    html += `
      <section class="section">

        <h2 class="section-title">
          주말 집회(토)
        </h2>

        ${createScheduleTable(
          weekendRows
        )}

      </section>
    `;


    /*
     * --------------------------
     * 집단 청소 및 내부 안내인
     * --------------------------
     *
     * 여기서는
     *
     * [집단 청소 및 내부 안내인] : C집단
     *
     * 문장을 출력하지 않고
     *
     * 제목
     * +
     * 큰 C집단
     *
     * 만 출력합니다.
     */

    if (cleaningGroup) {

      html += `
        <section class="cleaning-section">

          <h2 class="cleaning-title">
            집단 청소 및 내부 안내인
          </h2>

          <div class="cleaning-group">
            ${escapeHtml(cleaningGroup)}
          </div>

        </section>
      `;

    }


    /*
     * --------------------------
     * 외부 주차 안내
     * --------------------------
     */

    if (parkingText) {

      html += `
        <section class="parking-section">

          <h2 class="section-title">
            주차 안내
          </h2>

          <div class="parking-text">
            ${escapeHtml(parkingText)}
          </div>

        </section>
      `;

    }


    /*
     * --------------------------
     * 안내사항
     * --------------------------
     */

    if (notices.length > 0) {

      html += `
        <section class="notice-section">

          <h2 class="section-title">
            안내사항
          </h2>

          <div class="notice-list">
      `;


      notices.forEach(
        function (notice) {

          html += `
            <div class="notice-item">
              ${escapeHtml(notice)}
            </div>
          `;

        }
      );


      html += `
          </div>

        </section>
      `;

    }


    /*
     * 화면에 적용
     */

    document.getElementById(
      "content"
    ).innerHTML = html;

  }


  /*
   * ==========================================================
   * 집회 표 생성
   * ==========================================================
   */

  function createScheduleTable(rows) {

    if (
      !rows ||
      rows.length === 0
    ) {

      return `
        <div class="schedule-table-wrap">

          <table class="schedule-table">

            <thead>
              <tr>
                <th>날짜</th>
                <th>봉사자1</th>
                <th>봉사자2</th>
              </tr>
            </thead>

            <tbody>

              <tr>
                <td colspan="3">
                  등록된 일정이 없습니다.
                </td>
              </tr>

            </tbody>

          </table>

        </div>
      `;

    }


    let html = `
      <div class="schedule-table-wrap">

        <table class="schedule-table">

          <thead>

            <tr>
              <th>날짜</th>
              <th>봉사자1</th>
              <th>봉사자2</th>
            </tr>

          </thead>

          <tbody>
    `;


    rows.forEach(
      function (row) {

        html += `
          <tr>

            <td>
              ${escapeHtml(
                row.date
              )}
            </td>

            <td>
              ${escapeHtml(
                row.volunteer1
              )}
            </td>

            <td>
              ${escapeHtml(
                row.volunteer2
              )}
            </td>

          </tr>
        `;

      }
    );


    html += `
          </tbody>

        </table>

      </div>
    `;


    return html;

  }


  /*
   * ==========================================================
   * 특정 셀 가져오기
   * ==========================================================
   */

  function getCell(
    byNumber,
    number,
    column
  ) {

    if (
      !byNumber ||
      !byNumber[number]
    ) {
      return "";
    }

    return cleanText(
      byNumber[number][column]
    );

  }


  /*
   * ==========================================================
   * 텍스트 정리
   * ==========================================================
   */

  function cleanText(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }

    return String(value)
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .trim();

  }


  /*
   * ==========================================================
   * HTML 특수문자 보호
   * ==========================================================
   */

  function escapeHtml(value) {

    return String(
      value === null ||
      value === undefined
        ? ""
        : value
    )
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * ==========================================================
   * 뒤로가기
   * ==========================================================
   */

  function goBack() {

    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "index.html";

    }

  }


  /*
   * ==========================================================
   * 설정 패널
   * ==========================================================
   */

  function toggleSettings() {

    const panel =
      document.getElementById(
        "settingsPanel"
      );

    panel.classList.toggle(
      "show"
    );

  }


  /*
   * ==========================================================
   * 테마 변경
   * ==========================================================
   */

  function setTheme(theme) {

    if (theme === "light") {

      document.body.classList.add(
        "light"
      );

    } else {

      document.body.classList.remove(
        "light"
      );

    }

    localStorage.setItem(
      "guideTheme",
      theme
    );

  }


  /*
   * ==========================================================
   * 글자 크기
   * ==========================================================
   */

  function changeFontSize(direction) {

    const root =
      document.documentElement;

    let current =
      parseInt(
        localStorage.getItem(
          "guideFontSize"
        ) || "16",
        10
      );


    if (direction === 0) {

      current = 16;

    } else {

      current += direction;

    }


    /*
     * 너무 작거나 커지지 않도록 제한
     */

    current =
      Math.max(
        13,
        Math.min(
          21,
          current
        )
      );


    root.style.setProperty(
      "--font-size-base",
      current + "px"
    );


    localStorage.setItem(
      "guideFontSize",
      current
    );

  }


  /*
   * ==========================================================
   * 저장된 설정 불러오기
   * ==========================================================
   */

  function loadSavedSettings() {

    const savedTheme =
      localStorage.getItem(
        "guideTheme"
      );


    if (
      savedTheme === "light"
    ) {

      document.body.classList.add(
        "light"
      );

    }


    const savedFontSize =
      parseInt(
        localStorage.getItem(
          "guideFontSize"
        ) || "16",
        10
      );


    document.documentElement.style.setProperty(
      "--font-size-base",
      savedFontSize + "px"
    );

  }


  /*
   * ==========================================================
   * 설정 패널 바깥 클릭 시 닫기
   * ==========================================================
   */

  document.addEventListener(
    "click",
    function (event) {

      const panel =
        document.getElementById(
          "settingsPanel"
        );

      const button =
        document.querySelector(
          ".settings-button"
        );


      if (
        panel.classList.contains("show") &&
        !panel.contains(event.target) &&
        !button.contains(event.target)
      ) {

        panel.classList.remove(
          "show"
        );

      }

    }
  );

</script>

</body>
</html>
