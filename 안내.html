<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>외부 안내 봉사</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-main: #162331;
      --bg-gradient-1: #172634;
      --bg-gradient-2: #0f1b27;

      --panel-bg: rgba(38, 53, 68, 0.92);
      --panel-border: #3b4e61;

      --table-head: #34475a;
      --table-bg: #202f3c;
      --table-border: #3b4d5e;

      --text-main: #ffffff;
      --text-sub: #d7e0e8;

      --accent: #83e8ba;

      --button-bg: #34485b;
      --button-hover: #41576b;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.18);

      --font-scale: 1;
    }

    body.light {
      --bg-main: #eef3f7;
      --bg-gradient-1: #f4f7fa;
      --bg-gradient-2: #dfe8ef;

      --panel-bg: rgba(255, 255, 255, 0.96);
      --panel-border: #cbd7e1;

      --table-head: #dce6ee;
      --table-bg: #f7f9fb;
      --table-border: #ccd7e0;

      --text-main: #172331;
      --text-sub: #435466;

      --accent: #159c67;

      --button-bg: #dce6ee;
      --button-hover: #ccd9e3;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;

      font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        Arial,
        sans-serif;

      color: var(--text-main);

      background:
        radial-gradient(
          circle at top,
          var(--bg-gradient-1) 0%,
          var(--bg-gradient-2) 70%
        );

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    .page {
      width: 100%;
      max-width: 1100px;

      margin: 0 auto;

      padding:
        calc(var(--header-height, 0px) + 20px)
        16px
        50px;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 1000;

      text-align: center;

      /* 회의록처럼 상단 여백을 확보 */
      height: 80px;
      box-sizing: border-box;
      padding: 10px 0 15px;

      background: #18324a !important;
      border-bottom: 1px solid #18324a;

      color: #ffffff;
    }

    .header-title {
      margin: 0;

      font-size: 35px;
      line-height: 35px;

      font-weight: 800;

      letter-spacing: 0.04em;

      color: #ffffff !important;
    }

    /* =========================================
       왼쪽 뒤로가기
       회의록과 같은 크기/색상
       아이콘은 헤더 가운데 높이에 맞춰 아래쪽 배치
    ========================================= */

    .title-back-button {
      position: absolute;

      left: 14px;
      top: 23px;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 12px;

      background: #234563 !important;
      color: #ffffff !important;

      padding: 0;

      font-family: inherit;
      font-size: 25px;
      font-weight: bold;
      line-height: 1;

      cursor: pointer;

      z-index: 1100;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }

    .title-back-button:hover {
      background: #234563 !important;
      transform: none;
    }

    .title-back-button:active {
      transform: scale(0.95);
    }

    .header-month {
      margin-top: 3px;

      font-size: 17px;
      line-height: 17px;

      font-weight: 800;

      color: #7a8580;
    }

    /* =========================================
       오른쪽 설정
       회의록과 같은 크기/색상
       회전 효과 없음
    ========================================= */

    .settings-button {
      position: absolute;

      right: 14px;
      top: 23px;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 12px;

      background: #234563 !important;
      color: #ffffff !important;

      padding: 0;

      font-family: inherit;
      font-size: 20px;
      font-weight: bold;
      line-height: 1;

      cursor: pointer;

      z-index: 1100;

      transition:
        background 0.2s ease;
    }

    .settings-button:hover {
      background: #234563 !important;
      transform: none;
    }

    .settings-button:active {
      transform: scale(0.95);
    }

    /* =========================================
       설정창
    ========================================= */

    .settings-panel {
      display: none;

      position: absolute;

      right: 14px;
      top: 66px;

      width: 170px;

      padding: 10px;

      border: 1px solid var(--panel-border);
      border-radius: 12px;

      background: var(--panel-bg);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.30);

      z-index: 1000;

      text-align: left;
    }

    .settings-panel.show {
      display: block;
    }

    .settings-title {
      display: none;
      margin: 0 0 14px;

      color: var(--text-main);

      font-size: 14px;

      font-weight: 900;
    }

    .settings-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      width: 100%;

      margin-bottom: 10px;

      gap: 10px;
    }

    .settings-row:last-child {
      margin-bottom: 0;
    }

    .settings-label {
      display: none;
      flex: 0 0 auto;

      color: var(--text-main);

      font-size: 13px;

      font-weight: 800;

      white-space: nowrap;
    }

    .theme-buttons,
    .font-buttons {
      display: flex;

      align-items: center;

      gap: 5px;

      flex: 0 0 auto;
    }

    .theme-buttons button,
    .font-buttons button {
      height: 36px;

      min-width: 38px;

      padding: 0 9px;

      border: none;

      border-radius: 7px;

      background: var(--button-bg);

      color: var(--text-main);

      font-family: inherit;

      font-size: 12px;

      font-weight: 800;

      white-space: nowrap;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }

    .theme-buttons button:hover,
    .font-buttons button:hover {
      background: var(--button-hover);

      transform: translateY(-1px);
    }

    .font-size-value {
      min-width: 42px;

      height: 36px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: var(--text-main);

      font-size: 12px;

      font-weight: 800;
    }

    .actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-bottom: 12px;
    }

    .action-button {
      border: 1px solid var(--panel-border);

      border-radius: 10px;

      padding: 11px 17px;

      background: var(--button-bg);

      color: var(--text-main);

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .action-button:hover {
      background: var(--button-hover);

      transform: translateY(-1px);
    }

    .section {
      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .section-title {
      margin: 0 0 12px;

      font-size:
        calc(
          clamp(19px, 3vw, 24px)
          * var(--font-scale)
        );

      font-weight: 900;

      letter-spacing: -0.7px;
    }

    .schedule-table-wrap {
      width: 100%;

      border: 1px solid var(--table-border);

      border-radius: 11px;

      overflow: hidden;
    }

    .schedule-table {
      width: 100%;

      border-collapse: collapse;

      table-layout: fixed;

      background: var(--table-bg);
    }

    .schedule-table th {
      height: 42px;

      padding: 9px 8px;

      border-right: 1px solid var(--table-border);

      border-bottom: 1px solid var(--table-border);

      background: var(--table-head);

      color: var(--text-main);

      text-align: center;

      font-size:
        calc(15px * var(--font-scale));

      font-weight: 900;
    }

    .schedule-table td {
      height: 41px;

      padding: 9px 8px;

      border-right: 1px solid var(--table-border);

      border-bottom: 1px solid var(--table-border);

      color: var(--text-main);

      text-align: center;

      font-size:
        calc(15px * var(--font-scale));

      font-weight: 600;
    }

    .schedule-table th:last-child,
    .schedule-table td:last-child {
      border-right: none;
    }

    .schedule-table tr:last-child td {
      border-bottom: none;
    }

    .schedule-table tbody tr:hover {
      background:
        rgba(255, 255, 255, 0.035);
    }

    .parking-section {
      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .parking-text {
      padding: 13px 15px;

      border: 1px solid var(--table-border);

      border-radius: 10px;

      background: var(--table-bg);

      color: var(--text-main);

      font-size:
        calc(15px * var(--font-scale));

      line-height: 1.65;

      font-weight: 600;

      text-align: left;
    }

    .cleaning-section {
      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .cleaning-title {
      margin: 0 0 12px;

      color: var(--text-main);

      font-size:
        calc(
          clamp(19px, 3vw, 24px)
          * var(--font-scale)
        );

      font-weight: 900;

      letter-spacing: -0.7px;

      text-align: left;
    }

    .cleaning-box {
      width: 100%;

      padding: 13px 15px;

      border: 1px solid var(--table-border);

      border-radius: 10px;

      background: var(--table-bg);

      color: var(--accent);

      text-align: left;

      font-size:
        calc(32px * var(--font-scale));

      line-height: 1.35;

      font-weight: 900;
    }

    .notice-section {
      margin-top: 14px;

      padding: 16px;

      border: 1px solid var(--panel-border);

      border-radius: 20px;

      background: var(--panel-bg);

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .notice-list {
      overflow: hidden;

      border: 1px solid var(--table-border);

      border-radius: 11px;

      background: var(--table-bg);
    }

    .notice-item {
      padding: 11px 14px;

      border-bottom: 1px solid var(--table-border);

      color: var(--text-main);

      font-size:
        calc(15px * var(--font-scale));

      line-height: 1.55;

      font-weight: 600;
    }

    .notice-item:last-child {
      border-bottom: none;
    }

    .loading {
      padding: 60px 20px;

      text-align: center;

      color: var(--text-sub);

      font-size: 17px;

      font-weight: 700;
    }

    .error {
      margin: 30px auto;

      padding: 20px;

      border: 1px solid #8a4a4a;

      border-radius: 12px;

      background:
        rgba(100, 30, 30, 0.3);

      color: #ffb8b8;

      text-align: center;

      line-height: 1.6;
    }

    /* =========================================
       모바일
    ========================================= */

    @media (max-width: 700px) {

      .page {
        padding:
          calc(var(--header-height, 0px) + 20px)
          10px
          35px;
      }

      .header {
        padding-left: 55px;
        padding-right: 55px;
      }

      .title-back-button {
        width: 42px;
        height: 42px;

        left: 14px;
        top: 23px;

        font-size: 25px;
      }

      .settings-button {
        width: 42px;
        height: 42px;

        right: 14px;
        top: 23px;

        font-size: 20px;
      }

      .settings-panel {
        top: 66px;
        right: 14px;

        width: 170px;

        padding: 10px;

        border-radius: 12px;
      }

      .settings-title {
        font-size: 14px;

        margin-bottom: 12px;
      }

      .settings-row {
        gap: 7px;

        margin-bottom: 9px;
      }

      .settings-label {
        font-size: 12px;
      }

      .theme-buttons,
      .font-buttons {
        gap: 4px;
      }

      .theme-buttons button,
      .font-buttons button {
        height: 34px;

        min-width: 36px;

        padding: 0 7px;

        font-size: 11px;
      }

      .font-size-value {
        height: 34px;

        min-width: 40px;

        font-size: 11px;
      }

      .actions {
        justify-content: stretch;
      }

      .action-button {
        flex: 1;

        padding: 10px 8px;

        font-size: 14px;
      }

      .section,
      .parking-section,
      .cleaning-section,
      .notice-section {
        padding: 12px;

        border-radius: 16px;
      }

      .schedule-table th,
      .schedule-table td {
        font-size:
          calc(14px * var(--font-scale));

        padding:
          8px 5px;
      }

      .parking-text {
        font-size:
          calc(14px * var(--font-scale));

        padding:
          12px 13px;
      }

      .cleaning-box {
        padding:
          12px 13px;

        font-size:
          calc(30px * var(--font-scale));
      }

      .notice-item {
        font-size:
          calc(14px * var(--font-scale));

        padding:
          10px 11px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">

    <button
      class="title-back-button"
      onclick="goBack()"
      aria-label="뒤로가기"
    >
      ‹
    </button>

    <button
      class="settings-button"
      onclick="toggleSettings()"
      aria-label="설정"
    >
      ⚙️
    </button>

    <h1 class="header-title">
      안내 봉사
    </h1>

    <div
      id="month"
      class="header-month"
    >
      불러오는 중...
    </div>

    <div
      id="settingsPanel"
      class="settings-panel"
    >

      <div class="settings-title">
        설정
      </div>

      <div class="settings-row">

        <div class="settings-label">
          화면
        </div>

        <div class="theme-buttons">

          <button
            type="button"
            onclick="setTheme('light')"
          >
            ☀
          </button>

          <button
            type="button"
            onclick="setTheme('dark')"
          >
            🌙
          </button>

        </div>

      </div>

      <div class="settings-row">

        <div class="settings-label">
          글자 크기
        </div>

        <div class="font-buttons">

          <button
            type="button"
            onclick="changeFontSize(-1)"
          >
            −
          </button>

          <div
            id="fontSizeValue"
            class="font-size-value"
          >
            100%
          </div>

          <button
            type="button"
            onclick="changeFontSize(1)"
          >
            ＋
          </button>

        </div>

      </div>

    </div>

  </header>

  <main id="content">

    <div class="loading">
      안내 봉사 정보를 불러오는 중입니다...
    </div>

  </main>

</div>

<script>

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxizrC1woLHdgCfASCVle2Pgrd7FkfEYvO-am-2svWb69QThZXH6qLRfcXz4vEcWUeWEQ/exec";

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      loadSavedSettings();

      loadData();

    }
  );

  async function loadData() {

    const content =
      document.getElementById(
        "content"
      );

    content.innerHTML = `
      <div class="loading">
        안내 봉사 정보를 불러오는 중입니다...
      </div>
    `;

    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "GET",
            cache: "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          "서버 응답 오류: " +
          response.status
        );

      }

      const result =
        await response.json();

      if (
        !result ||
        result.success !== true
      ) {

        throw new Error(
          result && result.error
            ? result.error
            : "안내 데이터를 불러오지 못했습니다."
        );

      }

      renderData(result);

    }

    catch (error) {

      console.error(
        "안내 데이터 오류:",
        error
      );

      content.innerHTML = `
        <div class="error">

          <strong>
            안내 봉사 정보를 불러오지 못했습니다.
          </strong>

          <br><br>

          ${escapeHtml(
            error.message ||
            "알 수 없는 오류가 발생했습니다."
          )}

          <br><br>

          <button
            class="action-button"
            onclick="loadData()"
          >
            다시 시도
          </button>

        </div>
      `;

    }

  }

  function renderData(result) {

    const byNumber =
      result.byNumber || {};

    const month =
      getCell(
        byNumber,
        "1",
        "b"
      );

    document.getElementById(
      "month"
    ).textContent =
      month ||
      result.month ||
      "";

    const weekdayRows = [];

    for (
      let i = 2;
      i <= 6;
      i++
    ) {

      const row =
        byNumber[
          "2-" + i
        ];

      if (!row) {
        continue;
      }

      const date =
        cleanText(row.b);

      const volunteer1 =
        cleanText(row.c);

      const volunteer2 =
        cleanText(row.d);

      if (
        !date &&
        !volunteer1 &&
        !volunteer2
      ) {
        continue;
      }

      weekdayRows.push({
        date,
        volunteer1,
        volunteer2
      });

    }

    const weekendRows = [];

    for (
      let i = 2;
      i <= 6;
      i++
    ) {

      const row =
        byNumber[
          "3-" + i
        ];

      if (!row) {
        continue;
      }

      const date =
        cleanText(row.b);

      const volunteer1 =
        cleanText(row.c);

      const volunteer2 =
        cleanText(row.d);

      if (
        !date &&
        !volunteer1 &&
        !volunteer2
      ) {
        continue;
      }

      weekendRows.push({
        date,
        volunteer1,
        volunteer2
      });

    }

    const cleaningRow =
      byNumber["5"] || {};

    let cleaningGroup =
      cleanText(
        cleaningRow.d
      );

    if (!cleaningGroup) {

      const cleaningText =
        cleanText(
          cleaningRow.b
        );

      if (
        cleaningText.includes(":")
      ) {

        cleaningGroup =
          cleaningText
            .split(":")
            .slice(1)
            .join(":")
            .trim();

      }

    }

    const parkingRow =
      byNumber["4"] || {};

    const parkingText =
      cleanText(
        parkingRow.b
      );

    const notices = [];

    for (
      let i = 6;
      i <= 11;
      i++
    ) {

      const row =
        byNumber[
          String(i)
        ];

      if (!row) {
        continue;
      }

      const parts = [
        cleanText(row.b),
        cleanText(row.c),
        cleanText(row.d)
      ].filter(Boolean);

      if (
        parts.length === 0
      ) {
        continue;
      }

      notices.push(
        parts.join(" ")
      );

    }

    let html = "";

    html += `

      <section class="section">

        <h2 class="section-title">
          평일 집회(화)
        </h2>

        ${createScheduleTable(
          weekdayRows
        )}

      </section>

    `;

    html += `

      <section class="section">

        <h2 class="section-title">
          주말 집회(토)
        </h2>

        ${createScheduleTable(
          weekendRows
        )}

      </section>

    `;

    if (parkingText) {

      html += `

        <section class="parking-section">

          <h2 class="section-title">
            주차 안내
          </h2>

          <div class="parking-text">
            ${escapeHtml(
              parkingText
            )}
          </div>

        </section>

      `;

    }

    if (cleaningGroup) {

      html += `

        <section class="cleaning-section">

          <h2 class="cleaning-title">
            집단 청소 및 내부 안내인
          </h2>

          <div class="cleaning-box">
            ${escapeHtml(
              cleaningGroup
            )}
          </div>

        </section>

      `;

    }

    if (
      notices.length > 0
    ) {

      html += `

        <section class="notice-section">

          <h2 class="section-title">
            안내사항
          </h2>

          <div class="notice-list">

      `;

      notices.forEach(
        function (notice) {

          html += `

            <div class="notice-item">
              ${escapeHtml(
                notice
              )}
            </div>

          `;

        }
      );

      html += `

          </div>

        </section>

      `;

    }

    document.getElementById(
      "content"
    ).innerHTML = html;

  }

  function createScheduleTable(rows) {

    if (
      !rows ||
      rows.length === 0
    ) {

      return `

        <div class="schedule-table-wrap">

          <table class="schedule-table">

            <thead>

              <tr>
                <th>날짜</th>
                <th>봉사자1</th>
                <th>봉사자2</th>
              </tr>

            </thead>

            <tbody>

              <tr>

                <td colspan="3">
                  등록된 일정이 없습니다.
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      `;

    }

    let html = `

      <div class="schedule-table-wrap">

        <table class="schedule-table">

          <thead>

            <tr>

              <th>날짜</th>

              <th>봉사자1</th>

              <th>봉사자2</th>

            </tr>

          </thead>

          <tbody>

    `;

    rows.forEach(
      function (row) {

        html += `

          <tr>

            <td>
              ${escapeHtml(
                row.date
              )}
            </td>

            <td>
              ${escapeHtml(
                row.volunteer1
              )}
            </td>

            <td>
              ${escapeHtml(
                row.volunteer2
              )}
            </td>

          </tr>

        `;

      }
    );

    html += `

          </tbody>

        </table>

      </div>

    `;

    return html;

  }

  function getCell(
    byNumber,
    number,
    column
  ) {

    if (
      !byNumber ||
      !byNumber[number]
    ) {

      return "";

    }

    return cleanText(
      byNumber[number][column]
    );

  }

  function cleanText(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }

    return String(value)
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .trim();

  }

  function escapeHtml(value) {

    return String(
      value === null ||
      value === undefined
        ? ""
        : value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

  function goBack() {

    if (
      window.history.length > 1
    ) {

      window.history.back();

    } else {

      window.location.href =
        "index.html";

    }

  }

  function toggleSettings() {

    const panel =
      document.getElementById(
        "settingsPanel"
      );

    panel.classList.toggle(
      "show"
    );

  }

  function setTheme(theme) {

    if (
      theme === "light"
    ) {

      document.body.classList.add(
        "light"
      );

    } else {

      document.body.classList.remove(
        "light"
      );

    }

    localStorage.setItem(
      "guideTheme",
      theme
    );

  }

  function changeFontSize(direction) {

    let scale =
      parseInt(
        localStorage.getItem(
          "guideFontScale"
        ) || "100",
        10
      );

    if (
      direction < 0
    ) {

      scale -= 10;

    }

    if (
      direction > 0
    ) {

      scale += 10;

    }

    scale =
      Math.max(
        80,
        Math.min(
          150,
          scale
        )
      );

    const scaleValue =
      scale / 100;

    document.documentElement.style.setProperty(
      "--font-scale",
      scaleValue
    );

    const display =
      document.getElementById(
        "fontSizeValue"
      );

    if (display) {

      display.textContent =
        scale + "%";

    }

    localStorage.setItem(
      "guideFontScale",
      scale
    );

  }

  function loadSavedSettings() {

    const savedTheme =
      localStorage.getItem(
        "guideTheme"
      );

    if (
      savedTheme === "light"
    ) {

      document.body.classList.add(
        "light"
      );

    }

    const savedScale =
      parseInt(
        localStorage.getItem(
          "guideFontScale"
        ) || "100",
        10
      );

    const safeScale =
      Math.max(
        80,
        Math.min(
          150,
          savedScale
        )
      );

    document.documentElement.style.setProperty(
      "--font-scale",
      safeScale / 100
    );

    const display =
      document.getElementById(
        "fontSizeValue"
      );

    if (display) {

      display.textContent =
        safeScale + "%";

    }

  }

  document.addEventListener(
    "click",
    function (event) {

      const panel =
        document.getElementById(
          "settingsPanel"
        );

      const button =
        document.querySelector(
          ".settings-button"
        );

      if (
        panel.classList.contains("show") &&
        !panel.contains(event.target) &&
        !button.contains(event.target)
      ) {

        panel.classList.remove(
          "show"
        );

      }

    }
  );

  function syncHeaderHeight() {

    const header =
      document.querySelector(
        ".header"
      );

    if (!header) return;

    const height =
      header.offsetHeight;

    document.documentElement.style.setProperty(
      "--header-height",
      height + "px"
    );

  }

  window.addEventListener(
    "resize",
    syncHeaderHeight
  );

  window.addEventListener(
    "orientationchange",
    syncHeaderHeight
  );

  if (
    document.fonts &&
    document.fonts.ready
  ) {

    document.fonts.ready.then(
      syncHeaderHeight
    );

  }

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      syncHeaderHeight();

      const header =
        document.querySelector(
          ".header"
        );

      if (
        header &&
        "ResizeObserver" in window
      ) {

        new ResizeObserver(
          syncHeaderHeight
        ).observe(header);

      }

    }
  );

</script>

</body>
</html>
