<script>
/* =========================
   안내 봉사 API
   ========================= */
const SHEET_API =
"https://script.google.com/macros/s/AKfycbxYCCbRtORRr-sMHKOK_PMexORdAbOhFbCjhq7q6zdZBoo22eSltMmdWZM2B_BNnZHtSw/exec";


/* =========================
   공통 유틸
   ========================= */
function getByNumber(byNumber, number) {
  if (!byNumber) return null;
  return byNumber[String(number)] || null;
}


/* =========================
   집회 봉사자 표
   ========================= */
function makeMeetingTable(title, byNumber, prefix, maxNumber) {
  let rows = [];

  for (let i = 2; i <= maxNumber; i++) {
    const item = getByNumber(byNumber, `${prefix}-${i}`);

    if (!item) continue;

    const date = item.b || "";
    const volunteer1 = item.c || "";
    const volunteer2 = item.d || "";

    // 완전히 비어 있는 행은 표시하지 않음
    if (!date && !volunteer1 && !volunteer2) continue;

    rows.push(`
      <tr>
        <td>${escapeHtml(date)}</td>
        <td>${escapeHtml(volunteer1)}</td>
        <td>${escapeHtml(volunteer2)}</td>
      </tr>
    `);
  }

  if (rows.length === 0) return "";

  return `
    <div class="section">
      <h3>${escapeHtml(title)}</h3>
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>봉사자1</th>
            <th>봉사자2</th>
          </tr>
        </thead>
        <tbody>
          ${rows.join("")}
        </tbody>
      </table>
    </div>
  `;
}


/* =========================
   HTML 안전 처리
   ========================= */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   안내 화면 생성
   ========================= */
function buildSheet(json) {
  const byNumber = json.byNumber || {};

  const monthItem = getByNumber(byNumber, "1");
  const month = monthItem ? monthItem.b : "";

  const parking = getByNumber(byNumber, "4");
  const cleaning = getByNumber(byNumber, "5");

  let html = "";

  /* 제목 */
  html += `
    <div class="title">
      외부 안내 봉사
    </div>
  `;

  /* 월 */
  if (month) {
    html += `
      <div class="month">
        ${escapeHtml(month)}
      </div>
    `;
  }

  /* 평일 집회 */
  html += makeMeetingTable(
    "평일 집회(화)",
    byNumber,
    "2",
    6
  );

  /* 주말 집회 */
  html += makeMeetingTable(
    "주말 집회(토)",
    byNumber,
    "3",
    6
  );

  /* 외부 주차 안내 */
  if (parking && parking.b) {
    html += `
      <div class="notice">
        ${escapeHtml(parking.b)}
      </div>
    `;
  }

  /* 집단 청소 및 내부 안내인 */
  if (cleaning) {
    const text1 = cleaning.b || "";
    const text2 = cleaning.c || "";
    const text3 = cleaning.d || "";

    if (text1 || text2 || text3) {
      html += `
        <div class="cleaning">
          ${text1 ? `<div>${escapeHtml(text1)}</div>` : ""}
          ${text2 ? `<div>${escapeHtml(text2)}</div>` : ""}
          ${text3 ? `<div>${escapeHtml(text3)}</div>` : ""}
        </div>
      `;
    }
  }

  /* 번호 6~11 안내사항 */
  for (let i = 6; i <= 11; i++) {
    const item = getByNumber(byNumber, String(i));

    if (!item) continue;

    const text = [item.b, item.c, item.d]
      .filter(Boolean)
      .join(" ");

    if (!text) continue;

    html += `
      <div class="notice">
        ${escapeHtml(text)}
      </div>
    `;
  }

  return html;
}


/* =========================
   데이터 불러오기
   ========================= */
async function loadSheet() {
  const target = document.getElementById("sheetData");

  if (!target) {
    console.error("sheetData 요소를 찾을 수 없습니다.");
    return;
  }

  target.innerHTML = `
    <div class="loading">
      안내 봉사 정보를 불러오는 중입니다...
    </div>
  `;

  try {
    const response = await fetch(SHEET_API, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const json = await response.json();

    console.log("안내 봉사 API:", json);

    if (!json.success) {
      throw new Error(
        json.error || "안내 봉사 데이터를 불러오지 못했습니다."
      );
    }

    if (!json.byNumber) {
      throw new Error(
        "번호 기반 안내 봉사 데이터(byNumber)가 없습니다."
      );
    }

    if (!getByNumber(json.byNumber, "1")) {
      throw new Error("1번 월 정보가 없습니다.");
    }

    target.innerHTML = buildSheet(json);

  } catch (error) {
    console.error("안내 봉사 불러오기 오류:", error);

    target.innerHTML = `
      <div class="error">
        안내 봉사 정보를 불러오지 못했습니다.<br>
        잠시 후 다시 시도해 주세요.
      </div>
    `;
  }
}


/* =========================
   테마
   ========================= */
function toggleTheme() {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
}


/* =========================
   글자 크기
   ========================= */
function changeFontSize(size) {
  document.documentElement.style.setProperty(
    "--font-scale",
    size
  );

  localStorage.setItem("fontScale", size);
}


/* =========================
   홈으로
   ========================= */
function goHome() {
  history.back();
}


/* =========================
   초기화
   ========================= */
document.addEventListener("DOMContentLoaded", () => {
  const savedTheme = localStorage.getItem("theme");

  if (savedTheme === "dark") {
    document.body.classList.add("dark");
  }

  const savedFontScale = localStorage.getItem("fontScale");

  if (savedFontScale) {
    document.documentElement.style.setProperty(
      "--font-scale",
      savedFontScale
    );
  }

  loadSheet();
});
</script>
