<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전시대</title>

<link rel="stylesheet" href="전시대.css">

</head>

<body>

<!-- =======================================================
     상단
======================================================= -->

<header class="top-bar">

  <button
    class="top-button top-left"
    onclick="goBack()"
    aria-label="뒤로가기"
  >
    ‹
  </button>

  <div
    class="top-title"
    id="topTitle"
  >
    전시대
  </div>

  <button
    class="top-button top-right"
    onclick="toggleSettings()"
    aria-label="설정"
  >
    ⚙
  </button>

</header>


<!-- =======================================================
     설정
======================================================= -->

<div
  class="settings-panel"
  id="settingsPanel"
>

  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        id="lightButton"
        onclick="setTheme('light')"
        aria-label="밝게"
      >
        ☀
      </button>

      <button
        class="settings-button"
        id="darkButton"
        onclick="setTheme('dark')"
        aria-label="어둡게"
      >
        🌙
      </button>

    </div>

  </div>

  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        onclick="changeFontSize(-10)"
        aria-label="글자 크기 10% 감소"
      >
        −
      </button>

      <div
        class="settings-button font-size-display"
        id="fontSizeDisplay"
      >
        100%
      </div>

      <button
        class="settings-button"
        onclick="changeFontSize(10)"
        aria-label="글자 크기 10% 증가"
      >
        +
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     본문
======================================================= -->

<main class="main">


 <!-- =====================================================
     1. 봉사신청
====================================================== -->

<section
  id="applyView"
  class="view active"
>

  <!-- 봉사 요일 선택 제목 -->
  <h1
    id="volunteerMainTitle"
    class="page-title"
  >
    봉사 요일을 선택해주세요
  </h1>

  <!-- 봉사 요일 선택 -->
  <div
    id="volunteerScheduleArea"
    class="volunteer-schedule-area"
  >

    <button
      type="button"
      class="volunteer-schedule-btn"
      onclick="selectVolunteerSchedule('토오전')"
    >
      <span>토요일 오전</span>
    </button>

    <button
      type="button"
      class="volunteer-schedule-btn"
      onclick="selectVolunteerSchedule('토오후')"
    >
      <span>토요일 오후</span>
    </button>

    <button
      type="button"
      class="volunteer-schedule-btn"
      onclick="selectVolunteerSchedule('일오전')"
    >
      <span>일요일 오전</span>
    </button>

  </div>


  <!-- =================================================
       봉사자 선택 화면
  ================================================== -->

  <div
    id="volunteerApplyArea"
    class="volunteer-apply-area"
  >

    <!-- 뒤로가기 -->
    <button
      type="button"
      class="volunteer-back-button"
      onclick="goToApplyHome()"
    >
      뒤로가기
    </button>


    <!-- 봉사자 명단 -->
    <div
      id="nameGrid"
      class="name-grid"
    ></div>


    <!-- 제출 -->
    <button
      type="button"
      id="volunteerSubmitButton"
      class="volunteer-submit-button"
      onclick="submitVolunteerApplication()"
    >
      제출
    </button>

  </div>


  <!-- 제출 후 신청한 봉사자 -->
  <div
    id="submittedVolunteerArea"
    class="submitted-volunteer-area"
    style="display:none;"
  >

    <div
      class="submitted-volunteer-title"
    >
      신청한 봉사자
    </div>

    <div
      id="submittedVolunteerNames"
      class="submitted-volunteer-names"
    ></div>

  </div>

</section>

  <!-- =====================================================
       2. 관리자용
  ====================================================== -->

  <section
    id="adminView"
    class="view"
  >

    <h1 class="page-title service-title-with-refresh">
      관리자용

      <button
        type="button"
        class="service-refresh-button"
        onclick="refreshServiceGroups()"
        aria-label="새로고침"
      >↻</button>

    </h1>

    <div class="admin-section">

      <div
        class="admin-count"
        id="adminCount"
      >
        신청자 0명
      </div>

     <div
  id="adminScheduleSelector"
  class="admin-schedule-selector"
>

  <div
    id="adminScheduleTitle"
    class="admin-schedule-title"
  >
    토요일 오전
  </div>

  <div class="admin-schedule-buttons">

    <button
      type="button"
      class="admin-schedule-button selected"
      data-schedule="토오전"
      onclick="selectAdminSchedule('토오전')"
    >
      토요일 오전
    </button>

    <button
      type="button"
      class="admin-schedule-button"
      data-schedule="토오후"
      onclick="selectAdminSchedule('토오후')"
    >
      토요일 오후
    </button>

    <button
      type="button"
      class="admin-schedule-button"
      data-schedule="일오전"
      onclick="selectAdminSchedule('일오전')"
    >
      일요일 오전
    </button>

  </div>

</div>

<div
  class="admin-names"
  id="adminNames"
>
  <div class="service-empty">
    신청자를 불러오는 중입니다.
  </div>
</div>

<button
  type="button"
  id="confirmGroupButton"
  class="confirm-group-button"
  onclick="confirmSelectedGroup()"
  disabled
>
  배정 확정
</button>

<div class="group-controls">

  <button
    class="add-group-button"
    onclick="addGroup()"
  >
    + 봉사 그룹 추가
  </button>

  <button
    class="service-order-button"
    onclick="resetServiceDateOrder()"
  >
    ↻ 봉사 날짜 초기화
  </button>

</div>

      <div
        class="groups"
        id="groups"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       알림
  ====================================================== -->

  <section
    id="noticeView"
    class="view"
  >

    <div class="notice-container">

      <h1 class="page-title">
        알림
      </h1>

      <div class="notice-card">

        <div class="notice-row">
          <strong>토요일 신청</strong>
          <span>수요일</span>
        </div>

        <div class="notice-row">
          <strong>토요일 마감</strong>
          <span>금요일</span>
        </div>

      </div>


      <div class="notice-card">

        <div class="notice-row">
          <strong>일요일 신청</strong>
          <span>목요일</span>
        </div>

        <div class="notice-row">
          <strong>일요일 마감</strong>
          <span>토요일</span>
        </div>

      </div>


      <div class="notice-card">

        <div class="notice-row">
          <strong>토요일 (오후)</strong>
          <span>김경수 형제</span>
        </div>

        <div class="notice-row">
          <strong>일요일 (오전)</strong>
          <span>정지원 형제</span>
        </div>

      </div>


      <!-- 추가 신청 및 임명 취소 안내 -->

      <div class="notice-card notice-contact-card">

        <div class="notice-row">
          <strong>※ 추가 신청 및 임명 취소는 인도자에게 연락 하세요</strong>
        </div>

      </div>

    </div>

  </section>


  <!-- =====================================================
       3. 봉사하기
  ====================================================== -->

  <section
    id="serviceView"
    class="view"
  >

    <h1 class="page-title service-title-with-refresh">

      즐겁게 봉사해요

      <button
        type="button"
        class="service-refresh-button"
        onclick="refreshServiceGroups()"
        aria-label="새로고침"
      >↻</button>

    </h1>

    <div class="service-section">

      <div class="service-conductor">
        <strong id="serviceConductor">인도자 : </strong>
      </div>

      <div
        class="service-list"
        id="serviceList"
      ></div>

    </div>

  </section>

</main>


<!-- =======================================================
     하단 메뉴
======================================================= -->

<nav class="bottom-nav">

  <button
    class="nav-button"
    id="navNotice"
    onclick="showView('notice')"
  >
    알림
  </button>

  <button
    class="nav-button active"
    id="navApply"
    onclick="showView('apply')"
  >
    신청용
  </button>

  <button
    class="nav-button"
    id="navService"
    onclick="showView('service')"
  >
    봉사용
  </button>

  <button
    class="nav-button"
    id="navAdmin"
    onclick="showView('admin')"
  >
    관리용
  </button>

</nav>


<!-- =======================================================
     관리자 비밀번호
======================================================= -->

<div
  id="adminLoginOverlay"
  class="admin-login-overlay"
>

  <div class="admin-login-box">

    <div class="admin-login-icon">🔒</div>

    <h2 class="admin-login-title">
      관리자용
    </h2>

    <input
      type="password"
      id="adminPasswordInput"
      class="admin-login-input"
      inputmode="numeric"
      autocomplete="current-password"
      placeholder="비밀번호 입력"
      onkeydown="if(event.key === 'Enter') checkAdminPassword()"
    >

    <label class="admin-save-password">

      <input
        type="checkbox"
        id="saveAdminPassword"
      >

      이 기기에 비밀번호 저장

    </label>

    <button
      type="button"
      class="admin-login-confirm"
      onclick="checkAdminPassword()"
    >
      확인
    </button>

    <button
      type="button"
      class="admin-login-cancel"
      onclick="cancelAdminLogin()"
    >
      취소
    </button>

  </div>

</div>


<script src="전시대.js"></script>

</body>
</html>
