<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전시대</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 100%;
  --font-scale: 1;
}

body {
  margin: 0;
  padding: 0;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #252525 0%,
      #111 55%,
      #080808 100%
    );

  color: #f5f5f5;

  min-height: 100vh;

  transition:
    background .25s,
    color .25s;
}

body.light {
  background: #f5f5f5;
  color: #222;
}


/* =========================================================
   상단
========================================================= */

.top-bar {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: 60px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #18324a;

  border-bottom:
    1px solid rgba(255,255,255,.10);
}

.top-title {
  color: #fff;

  font-size: 35px;
  font-weight: 800;

  letter-spacing: .04em;
}

.top-button {
  position: absolute;

  top: 10px;

  width: 42px;
  height: 42px;

  border-radius: 12px;

  border: 0;

  background: #234563;

  color: #fff;

  font-size: 25px;

  line-height: 20px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.top-left {
  left: 8px;
}

.top-right {
  right: 8px;
}


/* =========================================================
   본문
========================================================= */

.main {
  padding-top: 80px;
  padding-bottom: 80px;

  min-height: 100vh;
}

.view {
  display: none;

  padding:
    0 14px 30px;
}

.view.active {
  display: block;
}

.page-title {
  margin:
    0 0 15px;

  text-align: center;

  font-size:
    calc(25px * var(--font-scale));

  font-weight: 800;

  letter-spacing: -1px;
}


/* =========================================================
   알림
========================================================= */

.notice-section {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;
}

.notice-card {
  padding: 18px 16px;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);
}

body.light .notice-card {
  background: #fff;
  border-color: #ddd;
}

.notice-line {
  min-height: 44px;

  display: flex;
  align-items: center;

  padding: 8px 10px;

  border-bottom:
    1px solid rgba(255,255,255,.08);

  font-size:
    calc(17px * var(--font-scale));

  line-height: 1.45;
}

.notice-line:last-child {
  border-bottom: 0;
}


/* =========================================================
   신청 날짜
========================================================= */

.apply-date-box {
  width: 100%;
  max-width: 900px;

  margin:
    0 auto 16px;

  padding: 14px 16px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.10);

  text-align: left;
}

body.light .apply-date-box {
  background: #fff;
  border-color: #ddd;
}

.apply-date {
  font-size:
    calc(20px * var(--font-scale));

  font-weight: 800;

  line-height: 1.5;
}

.apply-time {
  margin-top: 2px;

  font-size:
    calc(16px * var(--font-scale));

  color: #aaa;

  line-height: 1.5;
}

body.light .apply-time {
  color: #777;
}


/* =========================================================
   선택 인원
========================================================= */

.count-box {
  width: 100%;
  max-width: 900px;

  margin:
    0 auto 18px;

  padding: 13px 15px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.10);

  text-align: center;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;
}

body.light .count-box {
  background: #fff;
  border-color: #ddd;
}


/* =========================================================
   신청자 명단 - 3열
========================================================= */

.name-grid {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 8px;
}

.name-card {
  min-height: 58px;

  border-radius: 10px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);

  color: inherit;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 5px;

  padding: 7px 4px;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 600;

  transition:
    background .15s,
    border-color .15s,
    transform .1s;
}

.name-card:active {
  transform: scale(.97);
}

.name-card.selected {
  background:
    rgba(111,168,216,.16);

  border:
    3px solid #6FA8D8;
}

body.light .name-card {
  background: #fff;
  border: 1px solid #ddd;
}

body.light .name-card.selected {
  background: #eef5fb;
  border:
    3px solid #3F6F9F;
}

.check-mark {
  width: 18px;
  height: 18px;

  flex:
    0 0 18px;

  border-radius: 50%;

  border:
    2px solid #777;

  display: inline-flex;

  align-items: center;
  justify-content: center;

  font-size:
    calc(11px * var(--font-scale));

  font-weight: 900;
}

.name-card.selected .check-mark {
  border-color: #6FA8D8;

  background: #6FA8D8;

  color: #fff;
}

body.light .name-card.selected .check-mark {
  border-color: #3F6F9F;
  background: #3F6F9F;
}

.name-loading {
  grid-column: 1 / -1;

  padding: 35px 10px;

  text-align: center;

  color: #aaa;

  font-size:
    calc(15px * var(--font-scale));
}

body.light .name-loading {
  color: #777;
}


/* =========================================================
   전시대 신청 명단 열기 버튼
========================================================= */

.apply-name-open-wrap {
  width: 100%;
  max-width: 900px;

  margin: 0 auto 18px;
}

.apply-name-open-button {
  width: 100%;

  min-height: 48px;

  border: 0;

  border-radius: 10px;

  background: #4285f4;

  color: #fff;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 800;

  cursor: pointer;
}


/* =========================================================
   제출 버튼
========================================================= */

.apply-complete-wrap {
  width: 100%;
  max-width: 900px;

  margin:
    18px auto 25px;
}

.apply-complete-button {
  width: 100%;

  min-height: 48px;

  border: 0;

  border-radius: 10px;

  background: #4285f4;

  color: #fff;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 800;

  cursor: pointer;
}


/* =========================================================
   현재 신청자
========================================================= */

.current-applicants {
  width: 100%;
  max-width: 900px;

  margin: 0 auto 25px;
}

.current-title {
  margin-bottom: 10px;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 800;
}

.current-names {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 7px;
}

.current-name {
  min-height: 40px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    5px 3px;

  border-radius: 10px;

  border:
    1px solid #555;

  background:
    rgba(255,255,255,.04);

  font-size:
    calc(16px * var(--font-scale));

  font-weight: 600;

  white-space: nowrap;
}

body.light .current-name {
  color: #777;
  border-color: #ccc;
  background: #fff;
}

.current-empty {
  grid-column: 1 / -1;

  padding: 25px 10px;

  text-align: center;

  color: #999;
}


/* =========================================================
   관리자
========================================================= */

.admin-section {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;
}

.admin-count {
  text-align: center;

  margin-bottom: 15px;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;
}


/* =========================================================
   미배정 신청자
========================================================= */

.admin-names {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 8px;

  margin-bottom: 18px;
}

.admin-name {
  min-height: 48px;

  padding:
    6px 5px;

  border-radius: 9px;

  border:
    1px solid rgba(255,255,255,.15);

  background:
    rgba(255,255,255,.08);

  color: inherit;

  cursor: pointer;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 600;
}

.admin-name.selected {
  background:
    rgba(111,168,216,.16);

  border:
    3px solid #6FA8D8;
}

body.light .admin-name {
  background: #fff;
  border: 1px solid #ddd;
}

body.light .admin-name.selected {
  background: #eef5fb;

  border:
    3px solid #3F6F9F;
}


/* =========================================================
   관리자 직접 추가
========================================================= */

.admin-add-button {
  min-height: 44px;

  padding:
    7px 13px;

  border-radius: 9px;

  border:
    1px dashed #4285f4;

  background: transparent;

  color: #4285f4;

  cursor: pointer;

  font-size:
    calc(15px * var(--font-scale));

  font-weight: 700;
}

body.light .admin-add-button {
  background: #fff;
}


/* =========================================================
   그룹 추가
========================================================= */

.group-controls {
  display: flex;

  justify-content: center;

  margin-bottom: 18px;
}

.add-group-button {
  width: 100%;

  min-height: 48px;

  border: 0;

  border-radius: 10px;

  padding:
    12px 20px;

  background: #4285f4;

  color: #fff;

  font-size:
    calc(16px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   그룹
========================================================= */

.groups {
  display: flex;

  flex-direction: column;

  gap: 14px;
}

.group-card {
  padding:
    15px 14px;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);
}

body.light .group-card {
  background: #fff;
  border-color: #ddd;
}

.group-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 10px;
}

.group-title {
  font-size:
    calc(19px * var(--font-scale));

  font-weight: 800;

  line-height:
    calc(20px * var(--font-scale));
}

.group-buttons {
  display: flex;

  gap: 6px;
}

.group-action {
  border: 0;

  background: transparent;

  color: #ff7777;

  font-size:
    calc(15px * var(--font-scale));

  cursor: pointer;
}


/* =========================================================
   그룹 6자리
========================================================= */

.group-slots {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;
}

.group-slot {
  min-height: 46px;

  border-radius: 9px;

  border:
    1px dashed #777;

  background: transparent;

  color: inherit;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding:
    6px 4px;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 600;

  cursor: pointer;
}

.group-slot.filled {
  border:
    3px solid #6FA8D8;

  background:
    rgba(111,168,216,.16);
}

body.light .group-slot.filled {
  border:
    3px solid #3F6F9F;

  background:
    #eef5fb;
}

.group-slot.empty {
  color: #888;
}


/* =========================================================
   임명
========================================================= */

.appoint-section {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;
}

.appoint-list {
  display: flex;

  flex-direction: column;

  gap: 14px;
}

.appoint-card {
  padding:
    15px 14px;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);
}

body.light .appoint-card {
  background: #fff;
  border-color: #ddd;
}

.appoint-title {
  margin-bottom: 10px;

  font-size:
    calc(19px * var(--font-scale));

  font-weight: 800;
}

.appoint-members {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;
}

.appoint-person {
  min-height: 44px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 9px;

  border:
    1px solid #555;

  background:
    transparent;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 600;
}

.appoint-person.filled {
  border:
    3px solid #6FA8D8;

  background:
    rgba(111,168,216,.16);
}

body.light .appoint-person {
  border-color: #ccc;
  color: #777;
}

body.light .appoint-person.filled {
  border:
    3px solid #3F6F9F;

  background:
    #eef5fb;

  color: #222;
}

.appoint-empty {
  padding:
    35px 10px;

  text-align: center;

  color: #999;

  font-size:
    calc(15px * var(--font-scale));
}


/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 60px;

  z-index: 1000;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  background: #18324a;

  border-top:
    1px solid rgba(255,255,255,.10);
}

body.light .bottom-nav {
  background: #18324a;

  border-top:
    1px solid rgba(255,255,255,.10);
}

.nav-button {
  border: 0;

  background: transparent;

  color: #fff;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}

.nav-button:not(:last-child) {
  border-right:
    1px solid rgba(255,255,255,.25);
}

.nav-button.active {
  color: #fff;
}


/* =========================================================
   설정
========================================================= */

.settings-panel {
  position: fixed;

  top: 64px;
  right: 10px;

  width: 230px;

  padding: 15px;

  z-index: 1100;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(30,30,30,.98);

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  display: none;
}

.settings-panel.show {
  display: block;
}

body.light .settings-panel {
  background: #fff;
  border-color: #ddd;
}

.settings-row {
  margin-bottom: 14px;
}

.settings-buttons {
  display: flex;

  gap: 6px;
}

.settings-button {
  flex: 1;

  padding:
    8px 5px;

  border-radius: 7px;

  border:
    1px solid #555;

  background: transparent;

  color: inherit;

  cursor: pointer;

  font-size:
    calc(12px * var(--font-scale));
}

.settings-button.active {
  background: #4285f4;

  border-color: #4285f4;

  color: #fff;
}

.font-size-display {
  display: flex;

  align-items: center;

  justify-content: center;

  cursor: default;
}


/* =========================================================
   관리자 비밀번호
========================================================= */

.admin-login-overlay {
  position: fixed;

  inset: 0;

  z-index: 2000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(0,0,0,.72);
}

.admin-login-box {
  width: 100%;
  max-width: 360px;

  padding:
    28px 22px 24px;

  border-radius: 18px;

  background: #1b1b1b;

  color: #f5f5f5;

  box-shadow:
    0 12px 40px rgba(0,0,0,.35);

  text-align: center;
}

.admin-login-icon {
  font-size: 42px;

  line-height: 1;

  margin-bottom: 12px;
}

.admin-login-title {
  margin:
    0 0 18px;

  font-size:
    calc(23px * var(--font-scale));

  font-weight: 800;
}

.admin-login-input {
  width: 100%;

  height: 48px;

  padding:
    0 14px;

  border:
    1px solid #555;

  border-radius: 10px;

  background: #101010;

  color: #fff;

  font-size:
    calc(18px * var(--font-scale));

  text-align: center;

  outline: none;
}

.admin-login-input:focus {
  border-color: #5d8bb5;
}

.admin-save-password {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  margin:
    15px 0 18px;

  font-size:
    calc(15px * var(--font-scale));

  cursor: pointer;
}

.admin-save-password input {
  width: 18px;
  height: 18px;

  margin: 0;
}

.admin-login-confirm {
  width: 100%;

  height: 48px;

  border: 0;

  border-radius: 10px;

  background: #234563;

  color: #fff;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}

.admin-login-cancel {
  width: 100%;

  height: 44px;

  margin-top: 10px;

  border:
    1px solid #555;

  border-radius: 10px;

  background: transparent;

  color: inherit;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}

body.light .admin-login-cancel {
  border-color: #ccc;
}

body.light .admin-login-box {
  background: #fff;
  color: #222;
}

body.light .admin-login-input {
  background: #fff;
  color: #222;
  border-color: #ccc;
}


/* =========================================================
   반응형
========================================================= */

@media (max-width: 600px) {

  .top-title {
    font-size: 31px;
  }

  .name-grid {
    gap: 6px;
  }

  .name-card {
    height: 50px;
    min-height: 50px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .check-mark {
    width: 17px;
    height: 17px;
    flex-basis: 17px;
  }

  .admin-names {
    gap: 6px;
  }

  .admin-name {
    min-height: 44px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .group-slots {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .group-slot {
    min-height: 44px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .appoint-members {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .appoint-person {
    min-height: 42px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .current-names {
    grid-template-columns:
      repeat(4, 1fr);
  }

  .current-name {
    font-size:
      calc(14px * var(--font-scale));
  }

}


@media (max-width: 360px) {

  .name-card {
    font-size:
      calc(15px * var(--font-scale));
  }

  .check-mark {
    width: 15px;
    height: 15px;

    flex-basis: 15px;

    font-size:
      calc(9px * var(--font-scale));
  }

}

</style>
</head>


<body>


<!-- =========================================================
     상단
========================================================= -->

<header class="top-bar">

  <button
    class="top-button top-left"
    onclick="goBack()"
    aria-label="뒤로가기"
  >
    ‹
  </button>


  <div
    class="top-title"
    id="topTitle"
  >
    전시대
  </div>


  <button
    class="top-button top-right"
    onclick="toggleSettings()"
    aria-label="설정"
  >
    ⚙
  </button>

</header>



<!-- =========================================================
     설정
========================================================= -->

<div
  class="settings-panel"
  id="settingsPanel"
>

  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        id="lightButton"
        onclick="setTheme('light')"
      >
        ☀
      </button>

      <button
        class="settings-button"
        id="darkButton"
        onclick="setTheme('dark')"
      >
        🌙
      </button>

    </div>

  </div>


  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        onclick="changeFontSize(-10)"
      >
        −
      </button>

      <div
        class="settings-button font-size-display"
        id="fontSizeDisplay"
      >
        100%
      </div>

      <button
        class="settings-button"
        onclick="changeFontSize(10)"
      >
        +
      </button>

    </div>

  </div>

</div>



<!-- =========================================================
     본문
========================================================= -->

<main class="main">


  <!-- =======================================================
       1. 알림
  ======================================================== -->

  <section
    id="noticeView"
    class="view active"
  >

    <h1 class="page-title">
      알림
    </h1>


    <div class="notice-section">

      <div class="notice-card">

        <div class="notice-line">
          지금은 신청 시간이 아닙니다
        </div>

        <div class="notice-line">

<div

>

      type="password"
      id="adminPasswordInput"
      class="admin-login-input"
      inputmode="numeric"
      autocomplete="current-password"
      placeholder="비밀번호 입력"
      onkeydown="
        if(event.key === 'Enter')
          checkAdminPassword()
      "
    >

      <input
        type="checkbox"
        id="saveAdminPassword"
      >

      이 기기에 비밀번호 저장

    </label>

    >

    >

<script>

/* =========================================================
   Apps Script
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyGNTjZf3wagn7kWW0u1ZhBVnwBqQv-5MaYVM3U4lN1OjQ4JVMgckPnTIODGlL8e7yO/exec";
   

/* =========================================================
   저장 키
========================================================= */

const MY_SELECTION_KEY =
  "jeonsidaeMySelections";

const GROUP_KEY =
  "jeonsidaeGroups";

const ADMIN_PASSWORD_KEY =
  "jeonsidaeAdminPassword";


/* =========================================================
   관리자 비밀번호
   ---------------------------------------------------------
   기존 토요일과 동일한 방식
========================================================= */

const ADMIN_PASSWORD =
  "3061";


/* =========================================================
   현재 상태
========================================================= */

let masterNames = [];

let applicants = [];

let groups = [];

let selectedApplicant = null;

let currentSelections = [];

let currentView =
  "notice";

let adminAuthenticated =
  false;


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSettings();

    setDates();

    loadApplicants();

    loadGroups();

  }
);


/* =========================================================
   날짜
========================================================= */

function setDates() {

  const today =
    new Date();

  const day =
    today.getDay();

  let daysUntilSaturday;


  if (day === 0) {

    daysUntilSaturday = 6;

  } else {

    daysUntilSaturday =
      6 - day;

  }


  const saturday =
    new Date(today);

  saturday.setDate(
    today.getDate() +
    daysUntilSaturday
  );


  document
    .getElementById(
      "saturdayDate"
    )
    .textContent =
      "토요일 : " +
      (saturday.getMonth() + 1) +
      "월 " +
      saturday.getDate() +
      "일";

}


/* =========================================================
   화면 전환
========================================================= */

function showView(view) {

  if (
    view === "admin" &&
    !adminAuthenticated
  ) {

    const savedPassword =
      localStorage.getItem(
        ADMIN_PASSWORD_KEY
      );


    if (
      savedPassword ===
      ADMIN_PASSWORD
    ) {

      adminAuthenticated =
        true;

    } else {

      showAdminLogin();

      return;

    }

  }


  currentView =
    view;


  document
    .querySelectorAll(".view")
    .forEach(
      function(element) {

        element.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(".nav-button")
    .forEach(
      function(button) {

        button.classList.remove(
          "active"
        );

      }
    );


  const viewElement =
    document.getElementById(
      view + "View"
    );


  if (viewElement) {

    viewElement.classList.add(
      "active"
    );

  }


  const navElement =
    document.getElementById(
      "nav" +
      view.charAt(0).toUpperCase() +
      view.slice(1)
    );


  if (navElement) {

    navElement.classList.add(
      "active"
    );

  }


  document
    .getElementById("topTitle")
    .textContent =
      "전시대";


  if (view === "apply") {

    loadApplicants();

  }


  if (view === "admin") {

    loadApplicants();

    loadGroups();

  }


  if (view === "appoint") {

    loadGroups();

  }


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  if (
    currentView !== "notice"
  ) {

    showView("notice");

    return;

  }


  history.back();

}


/* =========================================================
   관리자 로그인
========================================================= */

function showAdminLogin() {

  const overlay =
    document.getElementById(
      "adminLoginOverlay"
    );

  const input =
    document.getElementById(
      "adminPasswordInput"
    );

  const saveCheckbox =
    document.getElementById(
      "saveAdminPassword"
    );


  const savedPassword =
    localStorage.getItem(
      ADMIN_PASSWORD_KEY
    );


  if (saveCheckbox) {

    saveCheckbox.checked =
      savedPassword ===
      ADMIN_PASSWORD;

  }


  if (input) {

    input.value = "";

  }


  if (overlay) {

    overlay.style.display =
      "flex";

  }


  setTimeout(
    function() {

      if (input) {

        input.focus();

      }

    },
    50
  );

}


function cancelAdminLogin() {

  const overlay =
    document.getElementById(
      "adminLoginOverlay"
    );

  const input =
    document.getElementById(
      "adminPasswordInput"
    );


  if (input) {

    input.value = "";

  }


  if (overlay) {

    overlay.style.display =
      "none";

  }

}


function checkAdminPassword() {

  const input =
    document.getElementById(
      "adminPasswordInput"
    );

  const saveCheckbox =
    document.getElementById(
      "saveAdminPassword"
    );


  const password =
    input
      ? input.value.trim()
      : "";


  if (
    password !==
    ADMIN_PASSWORD
  ) {

    alert(
      "비밀번호가 올바르지 않습니다."
    );

    if (input) {

      input.focus();

      input.select();

    }

    return;

  }


  adminAuthenticated =
    true;


  if (
    saveCheckbox &&
    saveCheckbox.checked
  ) {

    localStorage.setItem(
      ADMIN_PASSWORD_KEY,
      ADMIN_PASSWORD
    );

  } else {

    localStorage.removeItem(
      ADMIN_PASSWORD_KEY
    );

  }


  const overlay =
    document.getElementById(
      "adminLoginOverlay"
    );


  if (overlay) {

    overlay.style.display =
      "none";

  }


  showView("admin");

}


/* =========================================================
   명단 가져오기
========================================================= */

async function loadMasterNames() {

  const grid =
    document.getElementById(
      "applyNameGrid"
    );


  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=jeonsidaeNames&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "전시대 신청 명단을 불러오지 못했습니다."
      );

    }


    masterNames =
      Array.isArray(data.names)
        ? data.names
        : [];


    masterNames =
      [...new Set(
        masterNames
          .map(function(name) {
            return String(name).trim();
          })
          .filter(function(name) {
            return name !== "";
          })
      )];


    sortNames(masterNames);

    renderApplyNames();


  } catch (error) {

    console.error(error);


    grid.innerHTML =
      '<div class="name-loading">' +
      '전시대 신청 명단을 불러오지 못했습니다.<br>' +
      '잠시 후 다시 시도해 주세요.' +
      '</div>';

  }

}


/* =========================================================
   전시대 신청 명단 열기
========================================================= */

async function toggleApplyNames() {

  const grid =
    document.getElementById(
      "applyNameGrid"
    );

  const completeWrap =
    document.getElementById(
      "applyCompleteWrap"
    );


  const isOpen =
    grid.style.display !== "none";


  if (isOpen) {

    grid.style.display = "none";

    completeWrap.style.display = "none";

    return;

  }


  grid.style.display = "grid";

  completeWrap.style.display = "block";

  grid.innerHTML =
    '<div class="name-loading">' +
    '전시대 신청 명단을 불러오는 중입니다.' +
    '</div>';


  await loadMasterNames();

}


/* =========================================================
   가나다순
========================================================= */

function sortNames(array) {

  array.sort(
    function(a, b) {

      return a.localeCompare(
        b,
        "ko"
      );

    }
  );

}


/* =========================================================
   신청 선택
========================================================= */

function getMySelections() {

  try {

    const saved =
      localStorage.getItem(
        MY_SELECTION_KEY
      );


    if (!saved) {

      return [];

    }


    const parsed =
      JSON.parse(
        saved
      );


    return Array.isArray(parsed)
      ? parsed
      : [];


  } catch (error) {

    return [];

  }

}


function saveMySelections(
  list
) {

  localStorage.setItem(
    MY_SELECTION_KEY,
    JSON.stringify(list)
  );

}


/* =========================================================
   신청자 이름 출력
========================================================= */

function renderApplyNames() {

  const grid =
    document.getElementById(
      "applyNameGrid"
    );


  currentSelections =
    getMySelections();


  const validNames =
    new Set(
      masterNames
    );


  currentSelections =
    currentSelections.filter(
      function(name) {

        return validNames.has(
          name
        );

      }
    );


  saveMySelections(
    currentSelections
  );


  grid.innerHTML =
    "";


  masterNames.forEach(
    function(name) {

      const card =
        document.createElement(
          "button"
        );


      card.type =
        "button";


      card.className =
        "name-card";


      const selected =
        currentSelections.includes(
          name
        );


      if (selected) {

        card.classList.add(
          "selected"
        );

      }


      const check =
        document.createElement(
          "span"
        );


      check.className =
        "check-mark";


      check.textContent =
        selected
          ? "✓"
          : "";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        name;


      card.appendChild(
        check
      );


      card.appendChild(
        text
      );


      card.onclick =
        function() {

          toggleSelection(
            name
          );

        };


      grid.appendChild(
        card
      );

    }
  );


  updateApplyCount();

}


function toggleSelection(
  name
) {

  const index =
    currentSelections.indexOf(
      name
    );


  if (index >= 0) {

    currentSelections.splice(
      index,
      1
    );

  } else {

    currentSelections.push(
      name
    );

  }


  sortNames(
    currentSelections
  );


  saveMySelections(
    currentSelections
  );


  renderApplyNames();

}


/* =========================================================
   선택 인원
========================================================= */

function updateApplyCount() {

  document
    .getElementById(
      "applySelectedCount"
    )
    .textContent =
      "현재 선택 " +
      currentSelections.length +
      " 명";

}


/* =========================================================
   제충
========================================================= */

async function completeApply() {

  const selected =
    [...currentSelections];

  if (selected.length === 0) {
    alert(
      "신청할 사람을 한 명 이상 선택해 주세요."
    );
    return;
  }

  sortNames(selected);

  /* 제출를 누르면 먼저 펼쳐진 명단을 닫습니다. */
  currentSelections = [];
  saveMySelections([]);

  document
    .getElementById("applyNameGrid")
    .style.display = "none";

  document
    .getElementById("applyCompleteWrap")
    .style.display = "none";

  updateApplyCount();

  try {

    await postJson({
      action: "saveJeonsidaeApplicants",
      applicants: selected
    });

    await loadApplicants();

    alert(
      selected.length +
      "명이 신청되었습니다."
    );

  } catch (error) {

    console.error(error);

    alert(
      "신청 저장에 실패했습니다.\n" +
      "잠시 후 다시 시도해 주세요."
    );
  }

}


/* =========================================================
   신청자 불러오기
========================================================= */

async function loadApplicants() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=jeonsidaeApplicants&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "신청자를 불러오지 못했습니다."
      );

    }


    applicants =
      Array.isArray(
        data.applicants
      )
        ? data.applicants
        : [];


    applicants =
      [...new Set(
        applicants
          .map(
            function(name) {

              return String(name)
                .trim();

            }
          )
          .filter(
            function(name) {

              return name !== "";

            }
          )
      )];


    sortNames(
      applicants
    );


    renderCurrentApplicants();

    renderAdmin();

  } catch (error) {

    console.error(
      error
    );


    /*
      서버에서 아직 신청자를 가져오지 못할 경우
      현재 기기에 저장된 선택을 사용
    */

    applicants =
      getMySelections();


    sortNames(
      applicants
    );


    renderCurrentApplicants();

    renderAdmin();

  }

}


/* =========================================================
   현재 신청자 표시 - 4열
========================================================= */

function renderCurrentApplicants() {

  const title =
    document.getElementById(
      "currentApplicantTitle"
    );

  const box =
    document.getElementById(
      "currentApplicantNames"
    );


  const names =
    [...applicants];


  sortNames(
    names
  );


  title.textContent =
    "신청자 " +
    names.length +
    "명";


  box.innerHTML =
    "";


  if (
    names.length === 0
  ) {

    box.innerHTML =
      '<div class="current-empty">' +
      '아직 신청한 사람이 없습니다.' +
      '</div>';

    return;

  }


  names.forEach(
    function(name) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "current-name";


      item.textContent =
        name;


      box.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   관리자 화면
========================================================= */

function renderAdmin() {

  const assigned =
    new Set();


  groups.forEach(
    function(group) {

      group.forEach(
        function(name) {

          if (name) {

            assigned.add(
              name
            );

          }

        }
      );

    }
  );


  const unassigned =
    applicants.filter(
      function(name) {

        return !assigned.has(
          name
        );

      }
    );


  sortNames(
    unassigned
  );


  document
    .getElementById(
      "adminCount"
    )
    .textContent =
      "미배정 신청자 " +
      unassigned.length +
      "명";


  const box =
    document.getElementById(
      "adminNames"
    );


  box.innerHTML =
    "";


  if (
    unassigned.length === 0
  ) {

    box.innerHTML =
      '<div class="name-loading" ' +
      'style="grid-column:1/-1">' +
      '미배정 신청자가 없습니다.' +
      '</div>';

  } else {

    unassigned.forEach(
      function(name) {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "admin-name";


        if (
          selectedApplicant ===
          name
        ) {

          button.classList.add(
            "selected"
          );

        }


        button.textContent =
          name;


        button.onclick =
          function() {

            if (
              selectedApplicant ===
              name
            ) {

              selectedApplicant =
                null;

            } else {

              selectedApplicant =
                name;

            }


            renderAdmin();

          };


        box.appendChild(
          button
        );

      }
    );

  }


  renderGroups();

}


/* =========================================================
   관리자 직접 추가
========================================================= */

async function addManualApplicant() {

  const name =
    prompt(
      "추가할 봉사자의 이름을 입력해 주세요."
    );


  if (
    name === null
  ) {

    return;

  }


  const trimmed =
    name.trim();


  if (!trimmed) {

    alert(
      "이름을 입력해 주세요."
    );

    return;

  }


  if (
    applicants.includes(
      trimmed
    )
  ) {

    alert(
      "이미 신청자 목록에 있습니다."
    );

    return;

  }


  applicants.push(
    trimmed
  );


  sortNames(
    applicants
  );


  selectedApplicant =
    trimmed;


  renderAdmin();


  try {

    await postJson(
      {
        action:
          "saveJeonsidaeApplicants",

        applicants:
          applicants
      }
    );

  } catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   그룹 불러오기
========================================================= */

async function loadGroups() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=groups&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "그룹을 불러오지 못했습니다."
      );

    }


    const loaded =
      Array.isArray(
        data.groups
      )
        ? data.groups
        : [];


    groups =
      loaded.map(
        function(group) {

          const result =
            Array.isArray(group)
              ? group.slice(0, 6)
              : [];


          while (
            result.length < 6
          ) {

            result.push("");

          }


          return result;

        }
      );


    renderGroups();

    renderAdmin();

    renderAppoint();


  } catch (error) {

    console.error(
      error
    );


    /*
      서버 그룹이 아직 없을 경우
      브라우저 저장값 사용
    */

    try {

      const saved =
        localStorage.getItem(
          GROUP_KEY
        );


      groups =
        saved
          ? JSON.parse(saved)
          : [];

    } catch (
      storageError
    ) {

      groups = [];

    }


    renderGroups();

    renderAppoint();

  }

}


/* =========================================================
   그룹 저장
========================================================= */

async function saveGroups() {

  localStorage.setItem(
    GROUP_KEY,
    JSON.stringify(
      groups
    )
  );


  try {

    await postJson(
      {
        action:
          "saveGroups",

        groups:
          groups
      }
    );

    return true;

  } catch (error) {

    console.error(
      error
    );

    return false;

  }

}


/* =========================================================
   그룹 추가
   ---------------------------------------------------------
   새 그룹은 항상 맨 위
========================================================= */

async function addGroup() {

  groups.unshift(
    [
      "",
      "",
      "",
      "",
      "",
      ""
    ]
  );


  await saveGroups();


  selectedApplicant =
    null;


  renderAdmin();

  renderAppoint();

}


/* =========================================================
   그룹 삭제
========================================================= */

async function deleteGroup(
  index
) {

  if (
    !confirm(
      (index + 1) +
      "번 그룹을 삭제하시겠습니까?"
    )
  ) {

    return;

  }


  groups.splice(
    index,
    1
  );


  selectedApplicant =
    null;


  await saveGroups();


  renderAdmin();

  renderAppoint();

}


/* =========================================================
   그룹 초기화
========================================================= */

async function resetGroup(
  index
) {

  if (
    !confirm(
      (index + 1) +
      "번 그룹의 봉사자를 초기화하시겠습니까?"
    )
  ) {

    return;

  }


  groups[index] =
    [
      "",
      "",
      "",
      "",
      "",
      ""
    ];


  selectedApplicant =
    null;


  await saveGroups();


  renderAdmin();

  renderAppoint();

}

   그룹 표시
========================================================= */

  }


  groups.forEach(
    function(group, groupIndex) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "group-card";


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "group-header";


   const title =
  document.createElement(
    "select"
  );

title.className =
  "group-title";

const locations = [
  "유타몰",
  "성북천(보문2교-아래)",
  "성북천(보문2교-위)",
  "성북구청(광장)",
  "보문역(주변)",

];

locations.forEach(

);

      const buttons =

/* =========================================================
   그룹 자리 배정
========================================================= */

async function handleSlotClick(
  groupIndex,
  slotIndex
) {

  const currentName =
    groups[groupIndex][slotIndex];


  /*
    이미 들어있는 사람을 누르면
    그 자리를 비웁니다.
  */

  if (currentName) {

    groups[groupIndex][slotIndex] =
      "";


    selectedApplicant =
      null;


    await saveGroups();


    renderAdmin();

    renderAppoint();

    return;

  }


  /*
    먼저 신청자를 선택해야 합니다.
  */

  if (
    !selectedApplicant
  ) {

    alert(
      "먼저 위에서 봉사자 이름을 선택해 주세요."
    );

    return;

  }


  /*
    같은 사람을 다른 그룹에서 제거
  */

  groups =
    groups.map(
      function(group) {

        return group.map(
          function(name) {

            return name ===
              selectedApplicant
              ? ""
              : name;

          }
        );

      }
    );


  /*
    현재 선택한 자리에는
    선택된 사람을 넣습니다.
  */

  groups[groupIndex][slotIndex] =
    selectedApplicant;


  selectedApplicant =
    null;


  await saveGroups();


  renderAdmin();

  renderAppoint();

}


/* =========================================================
   임명 화면
========================================================= */

function renderAppoint() {

  const list =
    document.getElementById(
      "appointList"
    );


  list.innerHTML =
    "";


  const visibleGroups =
    groups.filter(
      function(group) {

        return group.some(
          function(name) {

            return Boolean(name);

          }
        );

      }
    );


  if (
    visibleGroups.length === 0
  ) {

    list.innerHTML =
      '<div class="appoint-empty">' +
      '아직 임명된 그룹이 없습니다.' +
      '</div>';

    return;

  }


  groups.forEach(
    function(group, index) {

      const hasPerson =
        group.some(
          function(name) {

            return Boolean(name);

          }
        );


      if (!hasPerson) {

        return;

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "appoint-card";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "appoint-title";


      title.textContent =
        (index + 1) +
        "번 그룹";


      const members =
        document.createElement(
          "div"
        );


      members.className =
        "appoint-members";


      group.forEach(
        function(name) {

          const person =
            document.createElement(
              "div"
            );


          person.className =
            "appoint-person";


          if (name) {

            person.classList.add(
              "filled"
            );

            person.textContent =
              name;

          } else {

            person.textContent =
              "빈 자리";

          }


          members.appendChild(
            person
          );

        }
      );


      card.appendChild(
        title
      );


      card.appendChild(
        members
      );


      list.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   POST 공통
========================================================= */

async function postJson(
  data
) {

  const response =
    await fetch(
      SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  const result =
    await response.json();


  if (
    !result.success
  ) {

    throw new Error(
      result.message ||
      "저장에 실패했습니다."
    );

  }


  return result;

}


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

  document
    .getElementById(
      "settingsPanel"
    )
    .classList.toggle(
      "show"
    );

}


function setTheme(
  theme
) {

  if (
    theme === "light"
  ) {

    document.body.classList.add(
      "light"
    );


    localStorage.setItem(
      "jeonsidaeTheme",
      "light"
    );

  } else {

    document.body.classList.remove(
      "light"
    );


    localStorage.setItem(
      "jeonsidaeTheme",
      "dark"
    );

  }


  updateSettingButtons();

}


function setFontSize(
  size
) {

  size =
    Math.max(
      80,
      Math.min(
        150,
        size
      )
    );


  document.documentElement
    .style
    .setProperty(
      "--font-scale",
      size / 100
    );


  localStorage.setItem(
    "jeonsidaeFontSize",
    String(size)
  );


  updateSettingButtons();

}


function changeFontSize(
  amount
) {

  const current =
    Number(
      localStorage.getItem(
        "jeonsidaeFontSize"
      ) ||
      "100"
    );


  setFontSize(
    current + amount
  );

}


function loadSettings() {

  const theme =
    localStorage.getItem(
      "jeonsidaeTheme"
    ) ||
    "dark";


  const fontSize =
    localStorage.getItem(
      "jeonsidaeFontSize"
    ) ||
    "100";


  setTheme(
    theme
  );


  setFontSize(
    Number(fontSize)
  );

}


function updateSettingButtons() {

  const theme =
    document.body.classList.contains(
      "light"
    )
      ? "light"
      : "dark";


  document
    .getElementById(
      "darkButton"
    )
    .classList.toggle(
      "active",
      theme === "dark"
    );


  document
    .getElementById(
      "lightButton"
    )
    .classList.toggle(
      "active",
      theme === "light"
    );


  const display =
    document.getElementById(
      "fontSizeDisplay"
    );


  if (display) {

    display.textContent =
      (
        Number(
          localStorage.getItem(
            "jeonsidaeFontSize"
          ) ||
          "100"
        )
      ) +
      "%";

  }

}


/* =========================================================
   설정창 바깥 클릭
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const panel =
      document.getElementById(
        "settingsPanel"
      );


    const button =
      document.querySelector(
        ".top-right"
      );


    if (
      panel.classList.contains(
        "show"
      ) &&
      !panel.contains(
        event.target
      ) &&
      !button.contains(
        event.target
      )
    ) {

      panel.classList.remove(
        "show"
      );

    }

  }
);

</script>

<script id="recentScheduleOnlyScript">
/* =========================================================
   전시대 일정별 신청 / 임명 / 관리용
   Apps Script 현재 API와 정확히 연결합니다.
   기존 상단 디자인과 알림 화면은 건드리지 않습니다.
========================================================= */
(function(){
  const FIXED_KEYS=["토오전","토오후","일오전"];
  const EXTRA_KEYS=["추가1","추가2","추가3"];
  const ALL_KEYS=FIXED_KEYS.concat(EXTRA_KEYS);
  const LOCAL_SCHEDULE_KEY="jeonsidaeRecentSchedules";
  const LOCAL_APPLY_KEY="jeonsidaeRecentApplySelections";
  const SCRIPT=window.SCRIPT_URL;
  let schedules=[];
  let currentApplyKey=null;
  let currentAdminKey=null;
  let currentAppointKey=null;
  let selectedApplicant=null;
  let scheduleNames=[];
  let scheduleGroups=[];

  function pad(n){return String(n).padStart(2,"0");}
  function dateInput(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function nextSaturday(){const d=new Date();const diff=d.getDay()===0?6:6-d.getDay();d.setDate(d.getDate()+diff);return d;}
  function fmtDate(v){if(!v)return "";const d=new Date(String(v).slice(0,10)+"T00:00:00");if(Number.isNaN(d.getTime()))return String(v);const days=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+days[d.getDay()]+")";}
  function fmtTime(v){const m=String(v||"").match(/^(\d{1,2}):(\d{2})$/);if(!m)return String(v||"");const h=Number(m[1]),min=m[2],ap=h<12?"오전":"오후",hh=h===0?12:(h>12?h-12:h);return ap+" "+hh+":"+min;}
  function rangeTime(a,b){return fmtTime(a)+" ~ "+fmtTime(b).replace(/^(오전|오후) /,function(_,ap){return ap===fmtTime(a).split(" ")[0]?"":"";});}
  function formatRange(a,b){const sa=fmtTime(a),sb=fmtTime(b);const aa=sa.split(" ")[0],bb=sb.split(" ")[0];return aa===bb?sa+" ~ "+sb.slice(3):sa+" ~ "+sb;}
  function parseTimeRange(v){
    const s=String(v||"").trim();
    const m=s.match(/(오전|오후)\s*(\d{1,2}):(\d{2})\s*~\s*(?:(오전|오후)\s*)?(\d{1,2}):(\d{2})/);
    if(!m)return {startTime:"",endTime:""};
    let h1=Number(m[2]),h2=Number(m[5]);

    if(ap2==="오후"&&h2<12)h2+=12;if(ap2==="오전"&&h2===12)h2=0;

  }
  function normalize(s){if(!s||!s.key)return null;const parsed=parseTimeRange(s.time||"");return {key:String(s.key),label:String(s.label||s.key),fixed:FIXED_KEYS.includes(String(s.key)),serviceDate:String(s.serviceDate||s.date||"").slice(0,10),startTime:String(s.startTime||parsed.startTime||"10:00"),endTime:String(s.endTime||parsed.endTime||"12:00"),time:String(s.time||"")};}
  function fixedSchedules(){const sat=nextSaturday(),sun=new Date(sat);sun.setDate(sat.getDate()+1);return [normalize({key:"토오전",label:"토요일 오전",serviceDate:dateInput(sat),time:"오전 10:00 ~ 12:00"}),normalize({key:"토오후",label:"토요일 오후",serviceDate:dateInput(sat),time:"오후 1:00 ~ 3:00"}),normalize({key:"일오전",label:"일요일 오전",serviceDate:dateInput(sun),time:"오전 10:00 ~ 12:00"})];}
  function saveLocal(){try{localStorage.setItem(LOCAL_SCHEDULE_KEY,JSON.stringify(schedules));}catch(e){}}
  function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_SCHEDULE_KEY)||"[]").map(normalize).filter(Boolean);}catch(e){return [];}}
  function applyMap(){try{return JSON.parse(localStorage.getItem(LOCAL_APPLY_KEY)||"{}");}catch(e){return {};}}
  function saveApplyMap(m){localStorage.setItem(LOCAL_APPLY_KEY,JSON.stringify(m));}
  function schedule(key){return schedules.find(x=>x.key===key)||null;}
  function sortNames(a){a.sort(function(x,y){return String(x).localeCompare(String(y),"ko");});}
  function section(id){return document.getElementById(id+"View");}
  function hideLegacy(id){const sec=section(id);if(!sec)return;Array.from(sec.children).forEach(function(el){if(el.classList.contains("page-title"))return;if(el.id===id+"ScheduleSelector"||el.id===id+"ScheduleDetail")return;el.style.display="none";});}
  function showList(id){hideLegacy(id);const sel=document.getElementById(id+"ScheduleSelector"),det=document.getElementById(id+"ScheduleDetail");if(sel)sel.style.display="block";if(det){det.style.display="none";det.innerHTML="";}}
  function makeSelector(id,title,allowAdd){const sec=section(id);if(!sec)return;const sel=document.createElement("div");sel.className="schedule-selector";sel.id=id+"ScheduleSelector";const h=document.createElement("div");h.className="schedule-selector-title";h.textContent=title;const list=document.createElement("div");list.className="schedule-list";list.id=id+"ScheduleList";sel.append(h,list);if(allowAdd){const add=document.createElement("button");add.type="button";add.className="admin-add-button";add.style.marginTop="10px";add.style.width="100%";add.textContent="＋ 추가(관리자만 사용)";add.onclick=showExtraEditor;sel.appendChild(add);}sec.insertBefore(sel,sec.children[1]||null);const det=document.createElement("div");det.className="schedule-detail";det.id=id+"ScheduleDetail";det.style.display="none";sec.insertBefore(det,sel.nextSibling);}
  function header(s,back){const frag=document.createDocumentFragment();const b=document.createElement("button");b.type="button";b.className="schedule-back-button";b.textContent="‹ 일정 선택으로 돌아가기";b.onclick=back;const n=document.createElement("div");n.className="schedule-detail-name";n.textContent=s.label;const d=document.createElement("div");d.className="schedule-detail-date";d.textContent=fmtDate(s.serviceDate);const t=document.createElement("div");t.className="schedule-detail-time";t.textContent=s.time||formatRange(s.startTime,s.endTime);frag.append(b,n,d,t);return frag;}
  function renderLists(){["apply","appoint","admin"].forEach(function(id){const box=document.getElementById(id+"ScheduleList");if(!box)return;box.innerHTML="";schedules.forEach(function(s){const wrap=document.createElement("div");wrap.className="schedule-button-wrap";const b=document.createElement("button");b.type="button";b.className="schedule-button";const m=document.createElement("span");m.className="schedule-button-main";m.textContent=s.label;const d=document.createElement("span");d.className="schedule-button-date";d.textContent=fmtDate(s.serviceDate);const t=document.createElement("span");t.className="schedule-button-time";t.textContent=s.time||formatRange(s.startTime,s.endTime);b.append(m,d,t);b.onclick=function(){if(id==="apply")openApply(s.key);else if(id==="appoint")openAppoint(s.key);else openAdmin(s.key);};wrap.appendChild(b);if(id==="admin"&&!s.fixed){const del=document.createElement("button");del.type="button";del.className="schedule-delete-button";del.textContent="삭제";del.onclick=function(e){e.stopPropagation();deleteExtra(s.key);};wrap.appendChild(del);}box.appendChild(wrap);});if(!box.children.length)box.innerHTML='<div class="schedule-empty">등록된 일정이 없습니다.</div>';});}
  async function getJson(url){const r=await fetch(url);const d=await r.json();if(!d.success)throw new Error(d.message||"서버 오류");return d;}
  async function post(data){const r=await fetch(SCRIPT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});const d=await r.json();if(!d.success)throw new Error(d.message||"저장에 실패했습니다.");return d;}
  async function loadSchedules(){
    const map=new Map();
    fixedSchedules().forEach(function(s){map.set(s.key,s);});
    try{const d=await getJson(SCRIPT+"?action=jeonsidaeSchedules&t="+Date.now());(Array.isArray(d.schedules)?d.schedules:[]).map(normalize).filter(Boolean).forEach(function(s){if(s.serviceDate||s.time)map.set(s.key,s);});}catch(e){console.warn("일정 목록 불러오기 실패",e);}
    loadLocal().forEach(function(s){if(!s.fixed&&!map.has(s.key))map.set(s.key,s);});
    schedules=ALL_KEYS.map(function(k){return map.get(k);}).filter(Boolean);saveLocal();renderLists();
  }
  async function loadNames(){try{const d=await getJson(SCRIPT+"?action=jeonsidaeNames&t="+Date.now());return Array.isArray(d.names)?d.names.map(String).map(function(x){return x.trim();}).filter(Boolean):[];}catch(e){console.error(e);return [];}}
  async function loadApplicants(key){const d=await getJson(SCRIPT+"?action=jeonsidaeScheduleApplicants&key="+encodeURIComponent(key)+"&t="+Date.now());return Array.isArray(d.applicants)?d.applicants.map(String).map(function(x){return x.trim();}).filter(Boolean):[];}
  async function loadGroups(key){const d=await getJson(SCRIPT+"?action=jeonsidaeScheduleGroups&key="+encodeURIComponent(key)+"&t="+Date.now());return Array.isArray(d.groups)?d.groups.map(function(g){const a=Array.isArray(g)?g.slice(0,8):[];while(a.length<8)a.push("");return a;}):[];}
  function selectionFor(key){const m=applyMap();return Array.isArray(m[key])?m[key].slice():[];}
  function setSelection(key,a){const m=applyMap();m[key]=a.slice();saveApplyMap(m);}
  function makeNameCard(name,selected,onclick){const b=document.createElement("button");b.type="button";b.className="name-card";if(selected)b.classList.add("selected");const c=document.createElement("span");c.className="check-mark";c.textContent=selected?"✓":"";const t=document.createElement("span");t.textContent=name;b.append(c,t);b.onclick=onclick;return b;}
  async function openApply(key){const s=schedule(key);if(!s)return;currentApplyKey=key;const sel=document.getElementById("applyScheduleSelector"),det=document.getElementById("applyScheduleDetail");sel.style.display="none";det.style.display="block";det.innerHTML="";det.appendChild(header(s,closeApply));const body=document.createElement("div");body.className="schedule-detail-body";const count=document.createElement("div");count.className="schedule-count";const grid=document.createElement("div");grid.className="schedule-name-grid";const submit=document.createElement("button");submit.type="button";submit.className="schedule-submit";submit.textContent="제출";const curTitle=document.createElement("div");curTitle.className="schedule-current-title";const curGrid=document.createElement("div");curGrid.className="schedule-current-grid";body.append(count,grid,submit,curTitle,curGrid);det.appendChild(body);let chosen=selectionFor(key);scheduleNames=await loadNames();sortNames(scheduleNames);function redraw(){grid.innerHTML="";count.textContent="현재 선택 "+chosen.length+"명";scheduleNames.forEach(function(n){grid.appendChild(makeNameCard(n,chosen.includes(n),function(){const i=chosen.indexOf(n);if(i>=0)chosen.splice(i,1);else chosen.push(n);sortNames(chosen);setSelection(key,chosen);redraw();}));});}redraw();try{const names=await loadApplicants(key);sortNames(names);curTitle.textContent="현재 신청자 "+names.length+"명";curGrid.innerHTML="";names.forEach(function(n){const x=document.createElement("div");x.className="schedule-current-name";x.textContent=n;curGrid.appendChild(x);});}catch(e){curTitle.textContent="현재 신청자 0명";}submit.onclick=async function(){if(!chosen.length){alert("신청할 사람을 한 명 이상 선택해 주세요.");return;}try{await post({action:"saveJeonsidaeScheduleApplicants",key:key,applicants:chosen});setSelection(key,[]);chosen=[];alert("신청이 저장되었습니다.");const names=await loadApplicants(key);sortNames(names);curTitle.textContent="현재 신청자 "+names.length+"명";curGrid.innerHTML="";names.forEach(function(n){const x=document.createElement("div");x.className="schedule-current-name";x.textContent=n;curGrid.appendChild(x);});redraw();}catch(e){console.error(e);alert("신청 저장에 실패했습니다.\n잠시 후 다시 시도해 주세요.");}};}
  function closeApply(){currentApplyKey=null;const sel=document.getElementById("applyScheduleSelector"),det=document.getElementById("applyScheduleDetail");if(sel)sel.style.display="block";if(det){det.style.display="none";det.innerHTML="";}hideLegacy("apply");}
  function locationOptions(){return ["유타몰","성북천(보문2교-아래)","성북천(보문2교-위)","성북구청(광장)","보문역(주변)","성신여대(주변)","성북천(하늘다리)","성북천(바람마당교)","성북천(분수대)","성북천(용문교)","가두 증거"];}
  async function openAdmin(key){const s=schedule(key);if(!s)return;currentAdminKey=key;selectedApplicant=null;const sel=document.getElementById("adminScheduleSelector"),det=document.getElementById("adminScheduleDetail");sel.style.display="none";det.style.display="block";det.innerHTML="";det.appendChild(header(s,closeAdmin));const body=document.createElement("div");body.className="schedule-detail-body";const count=document.createElement("div");count.className="schedule-admin-count";const names=document.createElement("div");names.className="schedule-admin-names";const add=document.createElement("button");add.type="button";add.className="admin-add-button";add.style.width="100%";add.style.marginBottom="15px";add.textContent="+ 추가";const gc=document.createElement("div");gc.className="schedule-group-controls";const gb=document.createElement("button");gb.type="button";gb.className="add-group-button";gb.textContent="+ 봉사 그룹 추가";gc.appendChild(gb);const groupsBox=document.createElement("div");groupsBox.className="schedule-groups";body.append(count,names,add,gc,groupsBox);det.appendChild(body);[scheduleNames,scheduleGroups]=await Promise.all([loadApplicants(key),loadGroups(key)]);sortNames(scheduleNames);gb.onclick=async function(){scheduleGroups.push(["","","","","","","","유타몰"]);await saveGroups(key);renderAdmin();};add.onclick=async function(){const n=prompt("추가할 봉사자의 이름을 입력해 주세요.");if(!n||!n.trim())return;const name=n.trim();if(scheduleNames.includes(name)){alert("이미 신청자 목록에 있습니다.");return;}scheduleNames.push(name);sortNames(scheduleNames);await post({action:"saveJeonsidaeScheduleApplicants",key:key,applicants:scheduleNames});renderAdmin();};function renderAdmin(){const assigned=new Set();scheduleGroups.forEach(function(g){g.slice(0,7).forEach(function(n){if(n)assigned.add(n);});});const un=scheduleNames.filter(function(n){return !assigned.has(n);});sortNames(un);count.textContent="미배정 신청자 "+un.length+"명";names.innerHTML="";un.forEach(function(n){const b=document.createElement("button");b.type="button";b.className="admin-name";b.textContent=n;b.classList.toggle("selected",selectedApplicant===n);b.onclick=function(){selectedApplicant=selectedApplicant===n?null:n;renderAdmin();};names.appendChild(b);});groupsBox.innerHTML="";scheduleGroups.forEach(function(g,gi){const card=document.createElement("div");card.className="schedule-group-card";const head=document.createElement("div");head.className="schedule-group-head";const loc=document.createElement("select");loc.className="schedule-location";locationOptions().forEach(function(v){const o=document.createElement("option");o.value=v;o.textContent=v;loc.appendChild(o);});loc.value=g[7]||"유타몰";loc.onchange=async function(){g[7]=loc.value;await saveGroups(key);};const del=document.createElement("button");del.type="button";del.className="schedule-group-delete";del.textContent="삭제";del.onclick=async function(){scheduleGroups.splice(gi,1);await saveGroups(key);renderAdmin();};head.append(loc,del);const slots=document.createElement("div");slots.className="schedule-group-slots";for(let si=0;si<7;si++){const b=document.createElement("button");b.type="button";b.className="schedule-group-slot"+(g[si]?" filled":"");b.textContent=g[si]||"빈 자리";b.onclick=async function(){if(g[si]){g[si]="";selectedApplicant=null;}else if(selectedApplicant){scheduleGroups.forEach(function(x){for(let j=0;j<7;j++)if(x[j]===selectedApplicant)x[j]="";});g[si]=selectedApplicant;selectedApplicant=null;}else{alert("먼저 위에서 봉사자 이름을 선택해 주세요.");return;}await saveGroups(key);renderAdmin();};slots.appendChild(b);}card.append(head,slots);groupsBox.appendChild(card);});}renderAdmin();}
  async function saveGroups(key){await post({action:"saveJeonsidaeScheduleGroups",key:key,groups:scheduleGroups});}
  function closeAdmin(){currentAdminKey=null;const sel=document.getElementById("adminScheduleSelector"),det=document.getElementById("adminScheduleDetail");if(sel)sel.style.display="block";if(det){det.style.display="none";det.innerHTML="";}hideLegacy("admin");}
  async function openAppoint(key){const s=schedule(key);if(!s)return;currentAppointKey=key;const sel=document.getElementById("appointScheduleSelector"),det=document.getElementById("appointScheduleDetail");sel.style.display="none";det.style.display="block";det.innerHTML="";det.appendChild(header(s,closeAppoint));const list=document.createElement("div");list.className="appoint-list";list.style.marginTop="15px";list.innerHTML='<div class="appoint-empty">임명된 그룹을 불러오는 중입니다.</div>';det.appendChild(list);try{const gs=await loadGroups(key);list.innerHTML="";const visible=gs.filter(function(g){return g.slice(0,7).some(Boolean);});if(!visible.length){list.innerHTML='<div class="appoint-empty">아직 임명된 그룹이 없습니다.</div>';return;}visible.forEach(function(g){const card=document.createElement("div");card.className="appoint-card";const title=document.createElement("div");title.className="appoint-title";title.textContent=g[7]||"유타몰";const members=document.createElement("div");members.className="appoint-members";g.slice(0,7).forEach(function(n){const p=document.createElement("div");p.className="appoint-person"+(n?" filled":"");p.textContent=n||"빈 자리";members.appendChild(p);});card.append(title,members);list.appendChild(card);});}catch(e){console.error(e);list.innerHTML='<div class="appoint-empty">임명 정보를 불러오지 못했습니다.</div>';}}
  function closeAppoint(){currentAppointKey=null;const sel=document.getElementById("appointScheduleSelector"),det=document.getElementById("appointScheduleDetail");if(sel)sel.style.display="block";if(det){det.style.display="none";det.innerHTML="";}hideLegacy("appoint");}
  function makeTimeOptions(sel,selected){for(let h=10;h<=17;h++){for(let m=0;m<60;m+=10){if(h===17&&m>0)continue;const v=pad(h)+":"+pad(m),o=document.createElement("option");o.value=v;o.textContent=fmtTime(v);if(v===selected)o.selected=true;sel.appendChild(o);}}}
  function showExtraEditor(){const existing=EXTRA_KEYS.filter(function(k){return schedules.some(function(s){return s.key===k;});});const key=EXTRA_KEYS.find(function(k){return !existing.includes(k);});if(!key){alert("추가 일정은 최대 3개까지 만들 수 있습니다.");return;}const sel=document.getElementById("adminScheduleSelector"),old=document.getElementById("recentScheduleEditor");if(old)old.remove();const wrap=document.createElement("div");wrap.className="schedule-editor";wrap.id="recentScheduleEditor";const d=nextSaturday();d.setDate(d.getDate()+7);wrap.innerHTML='<div class="schedule-editor-grid"><label>봉사 날짜<input type="date" id="recentExtraDate" value="'+dateInput(d)+'"></label><label>시작 시간<select id="recentExtraStart"></select></label><label>종료 시간<select id="recentExtraEnd"></select></label></div><div class="schedule-editor-actions"><button type="button" id="recentExtraCancel">취소</button><button type="button" id="recentExtraSave">저장</button></div>';sel.appendChild(wrap);makeTimeOptions(wrap.querySelector("#recentExtraStart"),"10:00");makeTimeOptions(wrap.querySelector("#recentExtraEnd"),"12:00");wrap.querySelector("#recentExtraCancel").onclick=function(){wrap.remove();};wrap.querySelector("#recentExtraSave").onclick=async function(){const date=wrap.querySelector("#recentExtraDate").value,start=wrap.querySelector("#recentExtraStart").value,end=wrap.querySelector("#recentExtraEnd").value;if(!date){alert("봉사 날짜를 선택해 주세요.");return;}if(start>=end){alert("종료 시간은 시작 시간보다 늦어야 합니다.");return;}try{await post({action:"saveJeonsidaeExtraSchedule",key:key,serviceDate:date,time:formatRange(start,end)});wrap.remove();await loadSchedules();alert(key+" 일정이 추가되었습니다.");}catch(e){console.error(e);alert("일정 저장에 실패했습니다.\n"+e.message);}};}
  async function deleteExtra(key){const s=schedule(key);if(!s||s.fixed)return;if(!confirm((s.label||key)+" 일정을 삭제하시겠습니까?\n해당 일정의 신청자와 관리 데이터도 함께 초기화됩니다."))return;try{await post({action:"deleteSchedule",key:key,scheduleKey:key});const m=applyMap();delete m[key];saveApplyMap(m);await loadSchedules();alert((s.label||key)+" 일정이 삭제되었습니다.");}catch(e){console.error(e);alert("일정 삭제에 실패했습니다.\n"+e.message);}}
  function init(){const a=section("apply"),p=section("appoint"),m=section("admin");if(!a||!p||!m)return;makeSelector("apply","봉사 일정을 선택해 주세요",false);makeSelector("appoint","봉사 일정을 선택해 주세요",false);makeSelector("admin","봉사 일정을 선택해 주세요",true);showList("apply");showList("appoint");showList("admin");loadSchedules();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
