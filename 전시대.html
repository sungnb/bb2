<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;

}

}

  background: #18324a;
  color: white;
  margin-top: 15px;
}

.add-button {
  background: white;
  color: #234563;
  border: 2px dashed #234563;
}

.member-list {
  display: none;
  margin-top: 15px;
}

  display: flex;
  align-items: center;

  border-bottom: 1px solid #e5e9ed;

<body>

<div class="container">

  <h1>전시대 신청</h1>

  <!-- =====================================================
       1. 토요일 오전
  ====================================================== -->
  <div class="part">

    <div class="part-title">
      토요일 오전 10:00 ~ 12:00 (2시간)
    </div>

    <button
      class="apply-button"
      onclick="openMembers('saturdayMorning')">
      전시대 신청

    <div
      id="saturdayMorning"
      class="member-list">

      <div class="member">
        <input type="checkbox">
        <span class="member-name">홍길동</span>
      </div>

      <div class="member">
        <input type="checkbox">
        <span class="member-name">김철수</span>
      </div>

      <div class="member">
        <input type="checkbox">
        <span class="member-name">이영희</span>

      </div>

        onclick="submitApplication('토요일 오전 10:00 ~ 12:00')">

    </div>
  </div>


  <!-- =====================================================
       2. 토요일 오후
  ====================================================== -->
  <div class="part">

    <div class="part-title">
      토요일 오후 1:00 ~ 3:00 (2시간)
    </div>

    <button
      class="apply-button"
      onclick="openMembers('saturdayAfternoon')">
      전시대 신청
    </button>

    <div
      id="saturdayAfternoon"
      class="member-list">

      <div class="member">
        <input type="checkbox">
        <span class="member-name">홍길동</span>
      </div>

      <div class="member">
        <input type="checkbox">
        <span class="member-name">김철수</span>
      </div>

        <span class="member-name">이영희</span>
      </div>

      </div>

        onclick="submitApplication('토요일 오후 1:00 ~ 3:00')">
        제출
      </button>

  </div>


  <!-- =====================================================
       3. 일요일 오전

  <div class="part">

    <div class="part-title">
      일요일 오전 10:00 ~ 12:00 (2시간)
    </div>

    <button
      class="apply-button"
      onclick="openMembers('sundayMorning')">
      전시대 신청
    </button>

    <div
      id="sundayMorning"
      class="member-list">

      <div class="member">
        <input type="checkbox">
        <span class="member-name">홍길동</span>
      </div>

      <div class="member">
        <input type="checkbox">
        <span class="member-name">김철수</span>
      </div>

      <div class="member">
        <input type="checkbox">
        <span class="member-name">이영희</span>
      </div>

      <div class="member">
        <input type="checkbox">
        <span class="member-name">박민수</span>
      </div>

      <button

  <!-- =====================================================
       4. 추가

  <div class="part">

    <button
      class="add-button"
      onclick="openExtra()">
      ＋ 추가
    </button>

    <div id="extraForm" class="extra-form">

      <div class="form-row">
        <label for="extraDate">날짜</label>
        <input

      </div>

      </button>

    id="message"
    class="message">
  </div>

<script>

/* =========================================================
   명단 열기
========================================================= */

function openMembers(id) {

  const list = document.getElementById(id);

  if (!list) return;

  if (list.style.display === "block") {
    list.style.display = "none";
  } else {
    list.style.display = "block";
  }
}


/* =========================================================
   신청 제출
   선택 여부와 관계없이 제출하면 적용
========================================================= */

function submitApplication(timeText) {

  const message =
    document.getElementById("message");

  message.textContent =
    timeText + " 신청이 적용되었습니다.";

  /*
   실제 Google Sheets 저장 기능은
   기존 Apps Script와 연결할 때 이 부분에 추가합니다.

   중요한 점:
   체크된 사람이 없어도
   제출 버튼을 누르면 정상적으로 처리합니다.
  */
}


/* =========================================================
   추가 열기
========================================================= */

function openExtra() {

  const form =
    document.getElementById("extraForm");

  if (form.style.display === "block") {
    form.style.display = "none";
  } else {
    form.style.display = "block";
  }
}


/* =========================================================
   시간 목록 생성
   오전 10:00 ~ 오후 5:00
   10분 간격
========================================================= */

function createTimeOptions() {

  const select =
    document.getElementById("extraTime");

  for (
    let totalMinutes = 10 * 60;
    totalMinutes <= 17 * 60;
    totalMinutes += 10
  ) {

    const hour24 =
      Math.floor(totalMinutes / 60);

    const minute =
      totalMinutes % 60;

    let period;
    let hour12;

    if (hour24 < 12) {

      period = "오전";
      hour12 = hour24;

    } else {

      period = "오후";

      hour12 =
        hour24 === 12
          ? 12
          : hour24 - 12;
    }

    const minuteText =
      String(minute).padStart(2, "0");

    const displayText =
      `${period} ${hour12}:${minuteText}`;

    const valueText =
      `${String(hour24).padStart(2, "0")}:${minuteText}`;

    const option =
      document.createElement("option");

    option.value = valueText;
    option.textContent = displayText;

    select.appendChild(option);
  }
}


/* =========================================================
   추가 적용
========================================================= */

function submitExtra() {

  const date =
    document.getElementById("extraDate").value;

  const time =
    document.getElementById("extraTime");

  const timeText =
    time.options[time.selectedIndex].text;

  const message =
    document.getElementById("message");

  if (!date) {

    message.textContent =
      "날짜를 선택해주세요.";

    return;
  }

  if (!time.value) {

    message.textContent =
      "시간을 선택해주세요.";

    return;
  }

  message.textContent =
    `${date} ${timeText} 추가 항목이 적용되었습니다.`;
}


/* =========================================================
   시작
========================================================= */

createTimeOptions();

</script>

</body>
</html>
