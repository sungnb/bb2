<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전시대</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 100%;
  --font-scale: 1;
}

body {
  margin: 0;
  padding: 0;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #252525 0%,
      #111 55%,
      #080808 100%
    );

  color: #f5f5f5;

  min-height: 100vh;

  transition:
    background .25s,
    color .25s;
}

body.light {
  background: #f5f5f5;
  color: #222;
}


/* =========================================================
   상단
========================================================= */

.top-bar {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: 60px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #18324a;

  border-bottom:
    1px solid rgba(255,255,255,.10);
}

.top-title {
  color: #fff;

  font-size: 35px;
  font-weight: 800;

  letter-spacing: .04em;
}

.top-button {
  position: absolute;

  top: 10px;

  width: 42px;
  height: 42px;

  border-radius: 12px;

  border: 0;

  background: #234563;

  color: #fff;

  font-size: 25px;

  line-height: 20px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.top-left {
  left: 8px;
}

.top-right {
  right: 8px;
}


/* =========================================================
   본문
========================================================= */

.main {
  padding-top: 80px;
  padding-bottom: 80px;

  min-height: 100vh;
}

.view {
  display: none;

  padding:
    0 14px 30px;
}

.view.active {
  display: block;
}

.page-title {
  margin:
    0 0 15px;

  text-align: center;

  font-size:
    calc(25px * var(--font-scale));

  font-weight: 800;

  letter-spacing: -1px;
}


/* =========================================================
   알림
========================================================= */

.notice-section {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;
}

.notice-card {
  padding: 18px 16px;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);
}

body.light .notice-card {
  background: #fff;
  border-color: #ddd;
}

.notice-line {
  min-height: 44px;

  display: flex;
  align-items: center;

  padding: 8px 10px;

  border-bottom:
    1px solid rgba(255,255,255,.08);

  font-size:
    calc(17px * var(--font-scale));

  line-height: 1.45;
}

.notice-line:last-child {
  border-bottom: 0;
}


/* =========================================================
   신청 날짜
========================================================= */

.apply-date-box {
  width: 100%;
  max-width: 900px;

  margin:
    0 auto 16px;

  padding: 14px 16px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.10);

  text-align: left;
}

body.light .apply-date-box {
  background: #fff;
  border-color: #ddd;
}

.apply-date {
  font-size:
    calc(20px * var(--font-scale));

  font-weight: 800;

  line-height: 1.5;
}

.apply-time {
  margin-top: 2px;

  font-size:
    calc(16px * var(--font-scale));

  color: #aaa;

  line-height: 1.5;
}

body.light .apply-time {
  color: #777;
}


/* =========================================================
   선택 인원
========================================================= */

.count-box {
  width: 100%;
  max-width: 900px;

  margin:
    0 auto 18px;

  padding: 13px 15px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.10);

  text-align: center;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;
}

body.light .count-box {
  background: #fff;
  border-color: #ddd;
}


/* =========================================================
   신청자 명단 - 3열
========================================================= */

.name-grid {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 8px;
}

.name-card {
  min-height: 58px;

  border-radius: 10px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);

  color: inherit;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 5px;

  padding: 7px 4px;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 600;

  transition:
    background .15s,
    border-color .15s,
    transform .1s;
}

.name-card:active {
  transform: scale(.97);
}

.name-card.selected {
  background:
    rgba(111,168,216,.16);

  border:
    3px solid #6FA8D8;
}

body.light .name-card {
  background: #fff;
  border: 1px solid #ddd;
}

body.light .name-card.selected {
  background: #eef5fb;
  border:
    3px solid #3F6F9F;
}

.check-mark {
  width: 18px;
  height: 18px;

  flex:
    0 0 18px;

  border-radius: 50%;

  border:
    2px solid #777;

  display: inline-flex;

  align-items: center;
  justify-content: center;

  font-size:
    calc(11px * var(--font-scale));

  font-weight: 900;
}

.name-card.selected .check-mark {
  border-color: #6FA8D8;

  background: #6FA8D8;

  color: #fff;
}

body.light .name-card.selected .check-mark {
  border-color: #3F6F9F;
  background: #3F6F9F;
}

.name-loading {
  grid-column: 1 / -1;

  padding: 35px 10px;

  text-align: center;

  color: #aaa;

  font-size:
    calc(15px * var(--font-scale));
}

body.light .name-loading {
  color: #777;
}


/* =========================================================
   전시대 신청 명단 열기 버튼
========================================================= */

.apply-name-open-wrap {
  width: 100%;
  max-width: 900px;

  margin: 0 auto 18px;
}

.apply-name-open-button {
  width: 100%;

  min-height: 48px;

  border: 0;

  border-radius: 10px;

  background: #4285f4;

  color: #fff;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 800;

  cursor: pointer;
}


/* =========================================================
   신청 완료 버튼
========================================================= */

.apply-complete-wrap {
  width: 100%;
  max-width: 900px;

  margin:
    18px auto 25px;
}

.apply-complete-button {
  width: 100%;

  min-height: 48px;

  border: 0;

  border-radius: 10px;

  background: #4285f4;

  color: #fff;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 800;

  cursor: pointer;
}


/* =========================================================
   현재 신청자
========================================================= */

.current-applicants {
  width: 100%;
  max-width: 900px;

  margin: 0 auto 25px;
}

.current-title {
  margin-bottom: 10px;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 800;
}

.current-names {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 7px;
}

.current-name {
  min-height: 40px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    5px 3px;

  border-radius: 10px;

  border:
    1px solid #555;

  background:
    rgba(255,255,255,.04);

  font-size:
    calc(16px * var(--font-scale));

  font-weight: 600;

  white-space: nowrap;
}

body.light .current-name {
  color: #777;
  border-color: #ccc;
  background: #fff;
}

.current-empty {
  grid-column: 1 / -1;

  padding: 25px 10px;

  text-align: center;

  color: #999;
}


/* =========================================================
   관리자
========================================================= */

.admin-section {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;
}

.admin-count {
  text-align: center;

  margin-bottom: 15px;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;
}


/* =========================================================
   미배정 신청자
========================================================= */

.admin-names {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 8px;

  margin-bottom: 18px;
}

.admin-name {
  min-height: 48px;

  padding:
    6px 5px;

  border-radius: 9px;

  border:
    1px solid rgba(255,255,255,.15);

  background:
    rgba(255,255,255,.08);

  color: inherit;

  cursor: pointer;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 600;
}

.admin-name.selected {
  background:
    rgba(111,168,216,.16);

  border:
    3px solid #6FA8D8;
}

body.light .admin-name {
  background: #fff;
  border: 1px solid #ddd;
}

body.light .admin-name.selected {
  background: #eef5fb;

  border:
    3px solid #3F6F9F;
}


/* =========================================================
   관리자 직접 추가
========================================================= */

.admin-add-button {
  min-height: 44px;

  padding:
    7px 13px;

  border-radius: 9px;

  border:
    1px dashed #4285f4;

  background: transparent;

  color: #4285f4;

  cursor: pointer;

  font-size:
    calc(15px * var(--font-scale));

  font-weight: 700;
}

body.light .admin-add-button {
  background: #fff;
}


/* =========================================================
   그룹 추가
========================================================= */

.group-controls {
  display: flex;

  justify-content: center;

  margin-bottom: 18px;
}

.add-group-button {
  width: 100%;

  min-height: 48px;

  border: 0;

  border-radius: 10px;

  padding:
    12px 20px;

  background: #4285f4;

  color: #fff;

  font-size:
    calc(16px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   그룹
========================================================= */

.groups {
  display: flex;

  flex-direction: column;

  gap: 14px;
}

.group-card {
  padding:
    15px 14px;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);
}

body.light .group-card {
  background: #fff;
  border-color: #ddd;
}

.group-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 10px;
}

.group-title {
  font-size:
    calc(19px * var(--font-scale));

  font-weight: 800;

  line-height:
    calc(20px * var(--font-scale));
}

.group-buttons {
  display: flex;

  gap: 6px;
}

.group-action {
  border: 0;

  background: transparent;

  color: #ff7777;

  font-size:
    calc(15px * var(--font-scale));

  cursor: pointer;
}


/* =========================================================
   그룹 6자리
========================================================= */

.group-slots {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;
}

.group-slot {
  min-height: 46px;

  border-radius: 9px;

  border:
    1px dashed #777;

  background: transparent;

  color: inherit;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding:
    6px 4px;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 600;

  cursor: pointer;
}

.group-slot.filled {
  border:
    3px solid #6FA8D8;

  background:
    rgba(111,168,216,.16);
}

body.light .group-slot.filled {
  border:
    3px solid #3F6F9F;

  background:
    #eef5fb;
}

.group-slot.empty {
  color: #888;
}


/* =========================================================
   임명
========================================================= */

.appoint-section {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;
}

.appoint-list {
  display: flex;

  flex-direction: column;

  gap: 14px;
}

.appoint-card {
  padding:
    15px 14px;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.07);
}

body.light .appoint-card {
  background: #fff;
  border-color: #ddd;
}

.appoint-title {
  margin-bottom: 10px;

  font-size:
    calc(19px * var(--font-scale));

  font-weight: 800;
}

.appoint-members {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;
}

.appoint-person {
  min-height: 44px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 9px;

  border:
    1px solid #555;

  background:
    transparent;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 600;
}

.appoint-person.filled {
  border:
    3px solid #6FA8D8;

  background:
    rgba(111,168,216,.16);
}

body.light .appoint-person {
  border-color: #ccc;
  color: #777;
}

body.light .appoint-person.filled {
  border:
    3px solid #3F6F9F;

  background:
    #eef5fb;

  color: #222;
}

.appoint-empty {
  padding:
    35px 10px;

  text-align: center;

  color: #999;

  font-size:
    calc(15px * var(--font-scale));
}


/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 60px;

  z-index: 1000;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  background: #18324a;

  border-top:
    1px solid rgba(255,255,255,.10);
}

body.light .bottom-nav {
  background: #18324a;

  border-top:
    1px solid rgba(255,255,255,.10);
}

.nav-button {
  border: 0;

  background: transparent;

  color: #fff;

  font-size:
    calc(17px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}

.nav-button:not(:last-child) {
  border-right:
    1px solid rgba(255,255,255,.25);
}

.nav-button.active {
  color: #fff;
}


/* =========================================================
   설정
========================================================= */

.settings-panel {
  position: fixed;

  top: 64px;
  right: 10px;

  width: 230px;

  padding: 15px;

  z-index: 1100;

  border-radius: 14px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(30,30,30,.98);

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  display: none;
}

.settings-panel.show {
  display: block;
}

body.light .settings-panel {
  background: #fff;
  border-color: #ddd;
}

.settings-row {
  margin-bottom: 14px;
}

.settings-buttons {
  display: flex;

  gap: 6px;
}

.settings-button {
  flex: 1;

  padding:
    8px 5px;

  border-radius: 7px;

  border:
    1px solid #555;

  background: transparent;

  color: inherit;

  cursor: pointer;

  font-size:
    calc(12px * var(--font-scale));
}

.settings-button.active {
  background: #4285f4;

  border-color: #4285f4;

  color: #fff;
}

.font-size-display {
  display: flex;

  align-items: center;

  justify-content: center;

  cursor: default;
}


/* =========================================================
   관리자 비밀번호
========================================================= */

.admin-login-overlay {
  position: fixed;

  inset: 0;

  z-index: 2000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(0,0,0,.72);
}

.admin-login-box {
  width: 100%;
  max-width: 360px;

  padding:
    28px 22px 24px;

  border-radius: 18px;

  background: #1b1b1b;

  color: #f5f5f5;

  box-shadow:
    0 12px 40px rgba(0,0,0,.35);

  text-align: center;
}

.admin-login-icon {
  font-size: 42px;

  line-height: 1;

  margin-bottom: 12px;
}

.admin-login-title {
  margin:
    0 0 18px;

  font-size:
    calc(23px * var(--font-scale));

  font-weight: 800;
}

.admin-login-input {
  width: 100%;

  height: 48px;

  padding:
    0 14px;

  border:
    1px solid #555;

  border-radius: 10px;

  background: #101010;

  color: #fff;

  font-size:
    calc(18px * var(--font-scale));

  text-align: center;

  outline: none;
}

.admin-login-input:focus {
  border-color: #5d8bb5;
}

.admin-save-password {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  margin:
    15px 0 18px;

  font-size:
    calc(15px * var(--font-scale));

  cursor: pointer;
}

.admin-save-password input {
  width: 18px;
  height: 18px;

  margin: 0;
}

.admin-login-confirm {
  width: 100%;

  height: 48px;

  border: 0;

  border-radius: 10px;

  background: #234563;

  color: #fff;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}

.admin-login-cancel {
  width: 100%;

  height: 44px;

  margin-top: 10px;

  border:
    1px solid #555;

  border-radius: 10px;

  background: transparent;

  color: inherit;

  font-size:
    calc(18px * var(--font-scale));

  font-weight: 700;

  cursor: pointer;
}

body.light .admin-login-cancel {
  border-color: #ccc;
}

body.light .admin-login-box {
  background: #fff;
  color: #222;
}

body.light .admin-login-input {
  background: #fff;
  color: #222;
  border-color: #ccc;
}


/* =========================================================
   반응형
========================================================= */

@media (max-width: 600px) {

  .top-title {
    font-size: 31px;
  }

  .name-grid {
    gap: 6px;
  }

  .name-card {
    height: 50px;
    min-height: 50px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .check-mark {
    width: 17px;
    height: 17px;
    flex-basis: 17px;
  }

  .admin-names {
    gap: 6px;
  }

  .admin-name {
    min-height: 44px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .group-slots {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .group-slot {
    min-height: 44px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .appoint-members {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .appoint-person {
    min-height: 42px;

    font-size:
      calc(16px * var(--font-scale));
  }

  .current-names {
    grid-template-columns:
      repeat(4, 1fr);
  }

  .current-name {
    font-size:
      calc(14px * var(--font-scale));
  }

}


@media (max-width: 360px) {

  .name-card {
    font-size:
      calc(15px * var(--font-scale));
  }

  .check-mark {
    width: 15px;
    height: 15px;

    flex-basis: 15px;

    font-size:
      calc(9px * var(--font-scale));
  }

}

</style>
</head>


<body>


<!-- =========================================================
     상단
========================================================= -->

<header class="top-bar">

  <button
    class="top-button top-left"
    onclick="goBack()"
    aria-label="뒤로가기"
  >
    ‹
  </button>


  <div
    class="top-title"
    id="topTitle"
  >
    전시대
  </div>


  <button
    class="top-button top-right"
    onclick="toggleSettings()"
    aria-label="설정"
  >
    ⚙
  </button>

</header>



<!-- =========================================================
     설정
========================================================= -->

<div
  class="settings-panel"
  id="settingsPanel"
>

  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        id="lightButton"
        onclick="setTheme('light')"
      >
        ☀
      </button>

      <button
        class="settings-button"
        id="darkButton"
        onclick="setTheme('dark')"
      >
        🌙
      </button>

    </div>

  </div>


  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        onclick="changeFontSize(-10)"
      >
        −
      </button>

      <div
        class="settings-button font-size-display"
        id="fontSizeDisplay"
      >
        100%
      </div>

      <button
        class="settings-button"
        onclick="changeFontSize(10)"
      >
        +
      </button>

    </div>

  </div>

</div>



<!-- =========================================================
     본문
========================================================= -->

<main class="main">


  <!-- =======================================================
       1. 알림
  ======================================================== -->

  <section
    id="noticeView"
    class="view active"
  >

    <h1 class="page-title">
      알림
    </h1>


    <div class="notice-section">

      <div class="notice-card">

        <div class="notice-line">
          지금은 신청 시간이 아닙니다
        </div>

        <div class="notice-line">

<div

>

      type="password"

      class="admin-login-input"
      inputmode="numeric"
      autocomplete="current-password"
      placeholder="비밀번호 입력"
      onkeydown="
        if(event.key === 'Enter')
          checkAdminPassword()
      "
    >

      <input
        type="checkbox"
        id="saveAdminPassword"
      >

      이 기기에 비밀번호 저장

    </label>

    >
      확인

    >

<script>

/* =========================================================
   Apps Script
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzWtI-3iHl7rVfrNs-TJqRsxD2o0_WRZ-bphOI2BVi6mQAqHXlleb12WYTin_qD0zCL/exec";


/* =========================================================
   저장 키
========================================================= */

const MY_SELECTION_KEY =
  "jeonsidaeMySelections";

const GROUP_KEY =
  "jeonsidaeGroups";

const ADMIN_PASSWORD_KEY =
  "jeonsidaeAdminPassword";


/* =========================================================
   관리자 비밀번호
   ---------------------------------------------------------
   기존 토요일과 동일한 방식
========================================================= */

const ADMIN_PASSWORD =
  "3061";


/* =========================================================
   현재 상태
========================================================= */

let masterNames = [];

let applicants = [];

let groups = [];

let selectedApplicant = null;

let currentSelections = [];

let currentView =
  "notice";

let adminAuthenticated =
  false;


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSettings();

    setDates();

    loadApplicants();

    loadGroups();

  }
);


/* =========================================================
   날짜
========================================================= */

function setDates() {

  const today =
    new Date();

  const day =
    today.getDay();

  let daysUntilSaturday;


  if (day === 0) {

    daysUntilSaturday = 6;

  } else {

    daysUntilSaturday =
      6 - day;

  }


  const saturday =
    new Date(today);

  saturday.setDate(
    today.getDate() +
    daysUntilSaturday
  );


  document
    .getElementById(
      "saturdayDate"
    )
    .textContent =
      "토요일 : " +
      (saturday.getMonth() + 1) +
      "월 " +
      saturday.getDate() +
      "일";

}


/* =========================================================
   화면 전환
========================================================= */

function showView(view) {

  if (
    view === "admin" &&
    !adminAuthenticated
  ) {

    const savedPassword =
      localStorage.getItem(
        ADMIN_PASSWORD_KEY
      );


    if (
      savedPassword ===
      ADMIN_PASSWORD
    ) {

      adminAuthenticated =
        true;

    } else {

      showAdminLogin();

      return;

    }

  }


  currentView =
    view;


  document
    .querySelectorAll(".view")
    .forEach(
      function(element) {

        element.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(".nav-button")
    .forEach(
      function(button) {

        button.classList.remove(
          "active"
        );

      }
    );


  const viewElement =
    document.getElementById(
      view + "View"
    );


  if (viewElement) {

    viewElement.classList.add(
      "active"
    );

  }


  const navElement =
    document.getElementById(
      "nav" +
      view.charAt(0).toUpperCase() +
      view.slice(1)
    );


  if (navElement) {

    navElement.classList.add(
      "active"
    );

  }


  document
    .getElementById("topTitle")
    .textContent =
      "전시대";


  if (view === "apply") {

    loadApplicants();

  }


  if (view === "admin") {

    loadApplicants();

    loadGroups();

  }


  if (view === "appoint") {

    loadGroups();

  }


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  if (
    currentView !== "notice"
  ) {

    showView("notice");

    return;

  }


  history.back();

}


/* =========================================================
   관리자 로그인
========================================================= */

function showAdminLogin() {

  const overlay =
    document.getElementById(
      "adminLoginOverlay"
    );

  const input =
    document.getElementById(
      "adminPasswordInput"
    );

  const saveCheckbox =
    document.getElementById(
      "saveAdminPassword"
    );


  const savedPassword =
    localStorage.getItem(
      ADMIN_PASSWORD_KEY
    );


  if (saveCheckbox) {

    saveCheckbox.checked =
      savedPassword ===
      ADMIN_PASSWORD;

  }


  if (input) {

    input.value = "";

  }


  if (overlay) {

    overlay.style.display =
      "flex";

  }


  setTimeout(
    function() {

      if (input) {

        input.focus();

      }

    },
    50
  );

}


function cancelAdminLogin() {

  const overlay =
    document.getElementById(
      "adminLoginOverlay"
    );

  const input =
    document.getElementById(
      "adminPasswordInput"
    );


  if (input) {

    input.value = "";

  }


  if (overlay) {

    overlay.style.display =
      "none";

  }

}


function checkAdminPassword() {

  const input =
    document.getElementById(
      "adminPasswordInput"
    );

  const saveCheckbox =
    document.getElementById(
      "saveAdminPassword"
    );


  const password =
    input
      ? input.value.trim()
      : "";


  if (
    password !==
    ADMIN_PASSWORD
  ) {

    alert(
      "비밀번호가 올바르지 않습니다."
    );

    if (input) {

      input.focus();

      input.select();

    }

    return;

  }


  adminAuthenticated =
    true;


  if (
    saveCheckbox &&
    saveCheckbox.checked
  ) {

    localStorage.setItem(
      ADMIN_PASSWORD_KEY,
      ADMIN_PASSWORD
    );

  } else {

    localStorage.removeItem(
      ADMIN_PASSWORD_KEY
    );

  }


  const overlay =
    document.getElementById(
      "adminLoginOverlay"
    );


  if (overlay) {

    overlay.style.display =
      "none";

  }


  showView("admin");

}


/* =========================================================
   명단 가져오기
========================================================= */

async function loadMasterNames() {

  const grid =
    document.getElementById(
      "applyNameGrid"
    );


  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=jeonsidaeNames&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "전시대 신청 명단을 불러오지 못했습니다."
      );

    }


    masterNames =
      Array.isArray(data.names)
        ? data.names
        : [];


    masterNames =
      [...new Set(
        masterNames
          .map(function(name) {
            return String(name).trim();
          })
          .filter(function(name) {
            return name !== "";
          })
      )];


    sortNames(masterNames);

    renderApplyNames();


  } catch (error) {

    console.error(error);


    grid.innerHTML =
      '<div class="name-loading">' +
      '전시대 신청 명단을 불러오지 못했습니다.<br>' +
      '잠시 후 다시 시도해 주세요.' +
      '</div>';

  }

}


/* =========================================================
   전시대 신청 명단 열기
========================================================= */

async function toggleApplyNames() {

  const grid =
    document.getElementById(
      "applyNameGrid"
    );

  const completeWrap =
    document.getElementById(
      "applyCompleteWrap"
    );


  const isOpen =
    grid.style.display !== "none";


  if (isOpen) {

    grid.style.display = "none";

    completeWrap.style.display = "none";

    return;

  }


  grid.style.display = "grid";

  completeWrap.style.display = "block";

  grid.innerHTML =
    '<div class="name-loading">' +
    '전시대 신청 명단을 불러오는 중입니다.' +
    '</div>';


  await loadMasterNames();

}


/* =========================================================
   가나다순
========================================================= */

function sortNames(array) {

  array.sort(
    function(a, b) {

      return a.localeCompare(
        b,
        "ko"
      );

    }
  );

}


/* =========================================================
   신청 선택
========================================================= */

function getMySelections() {

  try {

    const saved =
      localStorage.getItem(
        MY_SELECTION_KEY
      );


    if (!saved) {

      return [];

    }


    const parsed =
      JSON.parse(
        saved
      );


    return Array.isArray(parsed)
      ? parsed
      : [];


  } catch (error) {

    return [];

  }

}


function saveMySelections(
  list
) {

  localStorage.setItem(
    MY_SELECTION_KEY,
    JSON.stringify(list)
  );

}


/* =========================================================
   신청자 이름 출력
========================================================= */

function renderApplyNames() {

  const grid =
    document.getElementById(
      "applyNameGrid"
    );


  currentSelections =
    getMySelections();


  const validNames =
    new Set(
      masterNames
    );


  currentSelections =
    currentSelections.filter(
      function(name) {

        return validNames.has(
          name
        );

      }
    );


  saveMySelections(
    currentSelections
  );


  grid.innerHTML =
    "";


  masterNames.forEach(
    function(name) {

      const card =
        document.createElement(
          "button"
        );


      card.type =
        "button";


      card.className =
        "name-card";


      const selected =
        currentSelections.includes(
          name
        );


      if (selected) {

        card.classList.add(
          "selected"
        );

      }


      const check =
        document.createElement(
          "span"
        );


      check.className =
        "check-mark";


      check.textContent =
        selected
          ? "✓"
          : "";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        name;


      card.appendChild(
        check
      );


      card.appendChild(
        text
      );


      card.onclick =
        function() {

          toggleSelection(
            name
          );

        };


      grid.appendChild(
        card
      );

    }
  );


  updateApplyCount();

}


function toggleSelection(
  name
) {

  const index =
    currentSelections.indexOf(
      name
    );


  if (index >= 0) {

    currentSelections.splice(
      index,
      1
    );

  } else {

    currentSelections.push(
      name
    );

  }


  sortNames(
    currentSelections
  );


  saveMySelections(
    currentSelections
  );


  renderApplyNames();

}


/* =========================================================
   선택 인원
========================================================= */

function updateApplyCount() {

  document
    .getElementById(
      "applySelectedCount"
    )
    .textContent =
      "현재 선택 " +
      currentSelections.length +
      " 명";

}


/* =========================================================
   신청 완료
========================================================= */

async function completeApply() {

  const selected =
    [...currentSelections];

  if (selected.length === 0) {
    alert(
      "신청할 사람을 한 명 이상 선택해 주세요."
    );
    return;
  }

  sortNames(selected);

  /* 신청 완료를 누르면 먼저 펼쳐진 명단을 닫습니다. */
  currentSelections = [];
  saveMySelections([]);

  document
    .getElementById("applyNameGrid")
    .style.display = "none";

  document
    .getElementById("applyCompleteWrap")
    .style.display = "none";

  updateApplyCount();

  try {

    await postJson({
      action: "saveJeonsidaeApplicants",
      applicants: selected
    });

    await loadApplicants();

    alert(
      selected.length +
      "명이 신청되었습니다."
    );

  } catch (error) {

    console.error(error);

    alert(
      "신청 저장에 실패했습니다.\n" +
      "잠시 후 다시 시도해 주세요."
    );
  }

}


/* =========================================================
   신청자 불러오기
========================================================= */

async function loadApplicants() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=jeonsidaeApplicants&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "신청자를 불러오지 못했습니다."
      );

    }


    applicants =
      Array.isArray(
        data.applicants
      )
        ? data.applicants
        : [];


    applicants =
      [...new Set(
        applicants
          .map(
            function(name) {

              return String(name)
                .trim();

            }
          )
          .filter(
            function(name) {

              return name !== "";

            }
          )
      )];


    sortNames(
      applicants
    );


    renderCurrentApplicants();

    renderAdmin();

  } catch (error) {

    console.error(
      error
    );


    /*
      서버에서 아직 신청자를 가져오지 못할 경우
      현재 기기에 저장된 선택을 사용
    */

    applicants =
      getMySelections();


    sortNames(
      applicants
    );


    renderCurrentApplicants();

    renderAdmin();

  }

}


/* =========================================================
   현재 신청자 표시 - 4열
========================================================= */

function renderCurrentApplicants() {

  const title =
    document.getElementById(
      "currentApplicantTitle"
    );

  const box =
    document.getElementById(
      "currentApplicantNames"
    );


  const names =
    [...applicants];


  sortNames(
    names
  );


  title.textContent =
    "신청자 " +
    names.length +
    "명";


  box.innerHTML =
    "";


  if (
    names.length === 0
  ) {

    box.innerHTML =
      '<div class="current-empty">' +
      '아직 신청한 사람이 없습니다.' +
      '</div>';

    return;

  }


  names.forEach(
    function(name) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "current-name";


      item.textContent =
        name;


      box.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   관리자 화면
========================================================= */

function renderAdmin() {

  const assigned =
    new Set();


  groups.forEach(
    function(group) {

      group.forEach(
        function(name) {

          if (name) {

            assigned.add(
              name
            );

          }

        }
      );

    }
  );


  const unassigned =
    applicants.filter(
      function(name) {

        return !assigned.has(
          name
        );

      }
    );


  sortNames(
    unassigned
  );


  document
    .getElementById(
      "adminCount"
    )
    .textContent =
      "미배정 신청자 " +
      unassigned.length +
      "명";


  const box =
    document.getElementById(
      "adminNames"
    );


  box.innerHTML =
    "";


  if (
    unassigned.length === 0
  ) {

    box.innerHTML =
      '<div class="name-loading" ' +
      'style="grid-column:1/-1">' +
      '미배정 신청자가 없습니다.' +
      '</div>';

  } else {

    unassigned.forEach(
      function(name) {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "admin-name";


        if (
          selectedApplicant ===
          name
        ) {

          button.classList.add(
            "selected"
          );

        }


        button.textContent =
          name;


        button.onclick =
          function() {

            if (
              selectedApplicant ===
              name
            ) {

              selectedApplicant =
                null;

            } else {

              selectedApplicant =
                name;

            }


            renderAdmin();

          };


        box.appendChild(
          button
        );

      }
    );

  }


  renderGroups();

}


/* =========================================================
   관리자 직접 추가
========================================================= */

async function addManualApplicant() {

  const name =
    prompt(
      "추가할 봉사자의 이름을 입력해 주세요."
    );


  if (
    name === null
  ) {

    return;

  }


  const trimmed =
    name.trim();


  if (!trimmed) {

    alert(
      "이름을 입력해 주세요."
    );

    return;

  }


  if (
    applicants.includes(
      trimmed
    )
  ) {

    alert(
      "이미 신청자 목록에 있습니다."
    );

    return;

  }


  applicants.push(
    trimmed
  );


  sortNames(
    applicants
  );


  selectedApplicant =
    trimmed;


  renderAdmin();


  try {

    await postJson(
      {
        action:
          "saveJeonsidaeApplicants",

        applicants:
          applicants
      }
    );

  } catch (error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   그룹 불러오기
========================================================= */

async function loadGroups() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=groups&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "그룹을 불러오지 못했습니다."
      );

    }


    const loaded =
      Array.isArray(
        data.groups
      )
        ? data.groups
        : [];


    groups =
      loaded.map(
        function(group) {

          const result =
            Array.isArray(group)
              ? group.slice(0, 6)
              : [];


          while (
            result.length < 6
          ) {

            result.push("");

          }


          return result;

        }
      );


    renderGroups();

    renderAdmin();

    renderAppoint();


  } catch (error) {

    console.error(
      error
    );


    /*
      서버 그룹이 아직 없을 경우
      브라우저 저장값 사용
    */

    try {

      const saved =
        localStorage.getItem(
          GROUP_KEY
        );


      groups =
        saved
          ? JSON.parse(saved)
          : [];

    } catch (
      storageError
    ) {

      groups = [];

    }


    renderGroups();

    renderAppoint();

  }

}


/* =========================================================
   그룹 저장
========================================================= */

async function saveGroups() {

  localStorage.setItem(
    GROUP_KEY,
    JSON.stringify(
      groups
    )
  );


  try {

    await postJson(
      {
        action:
          "saveGroups",

        groups:
          groups
      }
    );

    return true;

  } catch (error) {

    console.error(
      error
    );

    return false;

  }

}


/* =========================================================
   그룹 추가
   ---------------------------------------------------------
   새 그룹은 항상 맨 위
========================================================= */

async function addGroup() {

  groups.unshift(
    [
      "",
      "",
      "",
      "",
      "",
      ""
    ]
  );


  await saveGroups();


  selectedApplicant =
    null;


  renderAdmin();

  renderAppoint();

}


/* =========================================================
   그룹 삭제
========================================================= */

async function deleteGroup(
  index
) {

  if (
    !confirm(
      (index + 1) +
      "번 그룹을 삭제하시겠습니까?"
    )
  ) {

    return;

  }


  groups.splice(
    index,
    1
  );


  selectedApplicant =
    null;


  await saveGroups();


  renderAdmin();

  renderAppoint();

}


/* =========================================================
   그룹 초기화
========================================================= */

async function resetGroup(
  index
) {

  if (
    !confirm(
      (index + 1) +
      "번 그룹의 봉사자를 초기화하시겠습니까?"
    )
  ) {

    return;

  }


  groups[index] =
    [
      "",
      "",
      "",
      "",
      "",
      ""
    ];


  selectedApplicant =
    null;


  await saveGroups();


  renderAdmin();

  renderAppoint();

}


/* =========================================================
   그룹 표시
========================================================= */

function renderGroups() {

  const box =
    document.getElementById(
      "groups"
    );


  box.innerHTML =
    "";


  if (
    groups.length === 0
  ) {

    box.innerHTML =
      '<div class="name-loading">' +
      '아직 만든 봉사 그룹이 없습니다.<br>' +
      '「+ 봉사 그룹 추가」를 눌러 그룹을 만들어 주세요.' +
      '</div>';

    return;

  }


  groups.forEach(
    function(group, groupIndex) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "group-card";


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "group-header";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "group-title";


      title.textContent =
        (groupIndex + 1) +
        "번 그룹";


      const buttons =
        document.createElement(
          "div"
        );


      buttons.className =
        "group-buttons";


      const resetButton =
        document.createElement(
          "button"
        );


      resetButton.type =
        "button";


      resetButton.className =
        "group-action";


      resetButton.textContent =
        "초기화";


      resetButton.onclick =
        function() {

          resetGroup(
            groupIndex
          );

        };


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.type =
        "button";


      deleteButton.className =
        "group-action";


      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function() {

          deleteGroup(
            groupIndex
          );

        };


      buttons.appendChild(
        resetButton
      );


      buttons.appendChild(
        deleteButton
      );


      header.appendChild(
        title
      );


      header.appendChild(
        buttons
      );


      const slots =
        document.createElement(
          "div"
        );


      slots.className =
        "group-slots";


      for (
        let slotIndex = 0;
        slotIndex < 6;
        slotIndex++
      ) {

        const name =
          group[slotIndex] ||
          "";


        const slot =
          document.createElement(
            "button"
          );


        slot.type =
          "button";


        slot.className =
          "group-slot";


        if (name) {

          slot.classList.add(
            "filled"
          );

          slot.textContent =
            name;

        } else {

          slot.classList.add(
            "empty"
          );

          slot.textContent =
            "빈 자리";

        }


        slot.onclick =
          function() {

            handleSlotClick(
              groupIndex,
              slotIndex
            );

          };


        slots.appendChild(
          slot
        );

      }


      card.appendChild(
        header
      );


      card.appendChild(
        slots
      );


      box.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   그룹 자리 배정
========================================================= */

async function handleSlotClick(
  groupIndex,
  slotIndex
) {

  const currentName =
    groups[groupIndex][slotIndex];


  /*
    이미 들어있는 사람을 누르면
    그 자리를 비웁니다.
  */

  if (currentName) {

    groups[groupIndex][slotIndex] =
      "";


    selectedApplicant =
      null;


    await saveGroups();


    renderAdmin();

    renderAppoint();

    return;

  }


  /*
    먼저 신청자를 선택해야 합니다.
  */

  if (
    !selectedApplicant
  ) {

    alert(
      "먼저 위에서 봉사자 이름을 선택해 주세요."
    );

    return;

  }


  /*
    같은 사람을 다른 그룹에서 제거
  */

  groups =
    groups.map(
      function(group) {

        return group.map(
          function(name) {

            return name ===
              selectedApplicant
              ? ""
              : name;

          }
        );

      }
    );


  /*
    현재 선택한 자리에는
    선택된 사람을 넣습니다.
  */

  groups[groupIndex][slotIndex] =
    selectedApplicant;


  selectedApplicant =
    null;


  await saveGroups();


  renderAdmin();

  renderAppoint();

}


/* =========================================================
   임명 화면
========================================================= */

function renderAppoint() {

  const list =
    document.getElementById(
      "appointList"
    );


  list.innerHTML =
    "";


  const visibleGroups =
    groups.filter(
      function(group) {

        return group.some(
          function(name) {

            return Boolean(name);

          }
        );

      }
    );


  if (
    visibleGroups.length === 0
  ) {

    list.innerHTML =
      '<div class="appoint-empty">' +
      '아직 임명된 그룹이 없습니다.' +
      '</div>';

    return;

  }


  groups.forEach(
    function(group, index) {

      const hasPerson =
        group.some(
          function(name) {

            return Boolean(name);

          }
        );


      if (!hasPerson) {

        return;

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "appoint-card";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "appoint-title";


      title.textContent =
        (index + 1) +
        "번 그룹";


      const members =
        document.createElement(
          "div"
        );


      members.className =
        "appoint-members";


      group.forEach(
        function(name) {

          const person =
            document.createElement(
              "div"
            );


          person.className =
            "appoint-person";


          if (name) {

            person.classList.add(
              "filled"
            );

            person.textContent =
              name;

          } else {

            person.textContent =
              "빈 자리";

          }


          members.appendChild(
            person
          );

        }
      );


      card.appendChild(
        title
      );


      card.appendChild(
        members
      );


      list.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   POST 공통
========================================================= */

async function postJson(
  data
) {

  const response =
    await fetch(
      SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  const result =
    await response.json();


  if (
    !result.success
  ) {

    throw new Error(
      result.message ||
      "저장에 실패했습니다."
    );

  }


  return result;

}


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

  document
    .getElementById(
      "settingsPanel"
    )
    .classList.toggle(
      "show"
    );

}


function setTheme(
  theme
) {

  if (
    theme === "light"
  ) {

    document.body.classList.add(
      "light"
    );


    localStorage.setItem(
      "jeonsidaeTheme",
      "light"
    );

  } else {

    document.body.classList.remove(
      "light"
    );


    localStorage.setItem(
      "jeonsidaeTheme",
      "dark"
    );

  }


  updateSettingButtons();

}


function setFontSize(
  size
) {

  size =
    Math.max(
      80,
      Math.min(
        150,
        size
      )
    );


  document.documentElement
    .style
    .setProperty(
      "--font-scale",
      size / 100
    );


  localStorage.setItem(
    "jeonsidaeFontSize",
    String(size)
  );


  updateSettingButtons();

}


function changeFontSize(
  amount
) {

  const current =
    Number(
      localStorage.getItem(
        "jeonsidaeFontSize"
      ) ||
      "100"
    );


  setFontSize(
    current + amount
  );

}


function loadSettings() {

  const theme =
    localStorage.getItem(
      "jeonsidaeTheme"
    ) ||
    "dark";


  const fontSize =
    localStorage.getItem(
      "jeonsidaeFontSize"
    ) ||
    "100";


  setTheme(
    theme
  );


  setFontSize(
    Number(fontSize)
  );

}


function updateSettingButtons() {

  const theme =
    document.body.classList.contains(
      "light"
    )
      ? "light"
      : "dark";


  document
    .getElementById(
      "darkButton"
    )
    .classList.toggle(
      "active",
      theme === "dark"
    );


  document
    .getElementById(
      "lightButton"
    )
    .classList.toggle(
      "active",
      theme === "light"
    );


  const display =
    document.getElementById(
      "fontSizeDisplay"
    );


  if (display) {

    display.textContent =
      (
        Number(
          localStorage.getItem(
            "jeonsidaeFontSize"
          ) ||
          "100"
        )
      ) +
      "%";

  }

}


/* =========================================================
   설정창 바깥 클릭
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const panel =
      document.getElementById(
        "settingsPanel"
      );


    const button =
      document.querySelector(
        ".top-right"
      );


    if (
      panel.classList.contains(
        "show"
      ) &&
      !panel.contains(
        event.target
      ) &&
      !button.contains(
        event.target
      )
    ) {

      panel.classList.remove(
        "show"
      );

    }

  }
);
