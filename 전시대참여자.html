<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전시대 참여자</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #0f1c28;
  color: #e9eef5;
}

/* =========================
   상단 제목
========================= */

header {
  background: #1d2d3d;
  border-bottom: 1px solid #34495e;
  padding: 22px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

/* =========================
   메인
========================= */

.container {
  width: min(1100px, 94%);
  margin: 0 auto;
  padding: 25px 0 40px;
}

/* =========================
   버튼
========================= */

.button-area {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
}

.action-button {
  border: none;
  border-radius: 10px;
  padding: 13px 22px;
  background: #435466;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.action-button:hover {
  background: #53677a;
}

/* =========================
   섹션
========================= */

.section {
  margin-bottom: 35px;
}

.section-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 2px solid #435466;
}

/* =========================
   집단
========================= */

.groups {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.group-card {
  background: #243242;
  border: 1px solid #435466;
  border-radius: 14px;
  overflow: hidden;
}

.group-title {
  background: #435466;
  padding: 14px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  color: white;
}

.participant {
  display: flex;
  align-items: center;
  padding: 12px 15px;
  border-bottom: 1px solid #344454;
  font-size: 16px;
}

.participant:last-child {
  border-bottom: none;
}

.number {
  width: 30px;
  color: #8fa0b0;
  font-size: 13px;
}

/* =========================
   타 회중 참여자
========================= */

.other-list {
  background: #243242;
  border: 1px solid #435466;
  border-radius: 14px;
  overflow: hidden;
}

.other-person {
  padding: 14px 18px;
  border-bottom: 1px solid #344454;
}

.other-person:last-child {
  border-bottom: none;
}

/* =========================
   참조
========================= */

.reference-box {
  background: #243242;
  border: 1px solid #435466;
  border-radius: 14px;
  padding: 18px;
}

.reference-item {
  padding: 10px 0;
  border-bottom: 1px solid #344454;
}

.reference-item:last-child {
  border-bottom: none;
}

/* =========================
   빈 데이터
========================= */

.empty {
  background: #243242;
  border: 1px solid #435466;
  border-radius: 12px;
  padding: 25px;
  text-align: center;
  color: #8fa0b0;
}

/* =========================
   로딩
========================= */

.loading {
  text-align: center;
  padding: 30px;
  color: #b9c5d1;
}

/* =========================
   모바일
========================= */

@media (max-width: 900px) {

  .groups {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 600px) {

  header h1 {
    font-size: 21px;
  }

  .container {
    width: 92%;
  }

  .groups {
    grid-template-columns: 1fr;
  }

}

</style>
</head>


<body>

<header>
  <h1>👥 전시대 참여자</h1>
</header>


<div class="container">

  <!-- 버튼을 제목 바로 아래로 이동 -->

  <div class="button-area">

    <button
      class="action-button"
      onclick="loadParticipants()"
    >
      🔄 새로고침
    </button>

    <button
      class="action-button"
      onclick="history.back()"
    >
      ← 뒤로가기
    </button>

  </div>


  <!-- =========================
       참여자
  ========================= -->

  <section class="section">

    <div class="section-title">
      참여자
    </div>

    <div
      id="participantsContent"
      class="loading"
    >
      참여자 명단을 불러오는 중입니다...
    </div>

  </section>


  <!-- =========================
       타 회중 참여자
  ========================= -->

  <section class="section">

    <div class="section-title">
      타 회중 참여자
    </div>

    <div
      id="otherParticipants"
      class="other-list"
    >

      <div class="other-person">
        참여자가 없습니다.
      </div>

    </div>

  </section>


  <!-- =========================
       미 참여자
  ========================= -->

  <section class="section">

    <div class="section-title">
      미 참여자
    </div>

    <div
      id="nonParticipantsContent"
    >

      <div class="groups">

        <div class="group-card">
          <div class="group-title">A집단</div>
          <div class="empty">참여자 없음</div>
        </div>

        <div class="group-card">
          <div class="group-title">B집단</div>
          <div class="empty">참여자 없음</div>
        </div>

        <div class="group-card">
          <div class="group-title">C집단</div>
          <div class="empty">참여자 없음</div>
        </div>

        <div class="group-card">
          <div class="group-title">D집단</div>
          <div class="empty">참여자 없음</div>
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       참조
  ========================= -->

  <section class="section">

    <div class="section-title">
      참조
    </div>

    <div class="reference-box">

      <div class="reference-item">
        내용1
      </div>

      <div class="reference-item">
        내용2
      </div>

    </div>

  </section>


</div>


<script>

/* ==========================================
   API 주소
========================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyku3nq77mmD-RvRKv01w8psb5VZs3JMJIQwkliR5LynYf5_9JYlNhgTjRxHBcuGAqs/exec";


/* ==========================================
   참여자 불러오기
========================================== */

async function loadParticipants() {

  const content =
    document.getElementById(
      "participantsContent"
    );


  content.innerHTML =
    "참여자 명단을 불러오는 중입니다...";


  try {

    const response =
      await fetch(API_URL);


    if (!response.ok) {

      throw new Error(
        "서버 오류: " +
        response.status
      );

    }


    const data =
      await response.json();


    const participants =
      data.participants || [];


    displayParticipants(
      participants
    );


  } catch (error) {

    console.error(error);


    content.innerHTML =
      `
        <div class="empty">
          참여자 데이터를 불러오지 못했습니다.
        </div>
      `;

  }

}


/* ==========================================
   참여자 표시
========================================== */

function displayParticipants(participants) {


  const groups = {

    "A집단": [],
    "B집단": [],
    "C집단": [],
    "D집단": []

  };


  participants.forEach(
    function(person) {

      if (groups[person.group]) {

        groups[person.group].push(
          person.name
        );

      }

    }
  );


  let html =
    `<div class="groups">`;


  Object.keys(groups)
    .forEach(
      function(groupName) {

        const people =
          groups[groupName];


        html += `

          <div class="group-card">

            <div class="group-title">

              ${groupName}

            </div>

        `;


        if (people.length === 0) {

          html += `

            <div class="empty">
              참여자가 없습니다.
            </div>

          `;

        }


        people.forEach(
          function(name, index) {

            html += `

              <div class="participant">

                <span class="number">
                  ${index + 1}.
                </span>

                <span>
                  ${escapeHtml(name)}
                </span>

              </div>

            `;

          }
        );


        html += `
          </div>
        `;

      }
    );


  html +=
    `</div>`;


  document
    .getElementById(
      "participantsContent"
    )
    .innerHTML =
    html;

}


/* ==========================================
   HTML 보호
========================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* ==========================================
   시작
========================================== */

loadParticipants();

</script>

</body>
</html>
