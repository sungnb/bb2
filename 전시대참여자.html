<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전시대 참여자</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;

  background: #172532;
  color: #eef3f8;
}

.page-header {
  background: #2b3b4b;
  border-bottom: 1px solid #405264;
  padding: 20px 15px;
  text-align: center;
}

.page-header h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 30px 18px 70px;
}

/* 버튼 */

.top-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 42px;
}

.action-button {
  border: none;
  border-radius: 10px;
  padding: 13px 24px;
  background: #536477;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.action-button:hover {
  background: #64778b;
}

/* 섹션 */

.section {
  margin-bottom: 55px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;

  border-bottom: 2px solid #425365;

  padding-bottom: 14px;
  margin-bottom: 28px;
}

.section-title h2 {
  margin: 0;
  font-size: 26px;
}

.total-count {
  font-size: 20px;
  font-weight: 800;
  color: #dce5ee;
}

/* 집단 */

.group-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.group-card {
  background: #2a3949;
  border: 1px solid #425568;
  border-radius: 16px;
  overflow: hidden;
  min-height: 150px;
}

.group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 17px 20px;

  background: #536477;
}

.group-name {
  font-size: 19px;
  font-weight: 800;
}

.group-count {
  font-size: 16px;
  font-weight: 700;
}

/* 이름 */

.name-list {
  padding: 16px;

  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.name-tag {
  display: inline-block;

  padding: 8px 12px;

  background: #344353;
  border: 1px solid #46596c;

  border-radius: 7px;

  font-size: 15px;
  font-weight: 600;
}

.empty-message {
  width: 100%;
  padding: 20px 5px;
  text-align: center;
  color: #aebdcc;
}

/* 타 회중 */

.other-card {
  background: #2a3949;
  border: 1px solid #425568;
  border-radius: 16px;
}

/* 참조 */

.reference-card {
  background: #2a3949;
  border: 1px solid #425568;
  border-radius: 16px;
  padding: 8px 20px;
}

.reference-item {
  padding: 16px 0;
  border-bottom: 1px solid #405264;
  line-height: 1.7;
  font-size: 16px;
}

.reference-item:last-child {
  border-bottom: none;
}

/* 로딩 */

.loading {
  padding: 80px 20px;
  text-align: center;
  color: #b7c4d0;
  font-size: 18px;
}

/* 오류 */

.error {
  background: #4a2c32;
  border: 1px solid #8b4b55;
  border-radius: 12px;
  padding: 25px;
  text-align: center;
  color: #ffd7dc;
}

/* 모바일 */

@media (max-width: 1000px) {
  .group-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {

  .page-header h1 {
    font-size: 25px;
  }

  .container {
    padding: 22px 12px 50px;
  }

  .group-grid {
    grid-template-columns: 1fr;
  }

  .section-title h2 {
    font-size: 23px;
  }

}
</style>
</head>

<body>

<header class="page-header">
  <h1>👥 전시대 참여자</h1>
</header>

<main class="container">

  <div class="top-actions">

    <button
      class="action-button"
      onclick="loadData()"
    >
      🔄 새로고침
    </button>

    <button
      class="action-button"
      onclick="goBack()"
    >
      ← 뒤로가기
    </button>

  </div>

  <div id="app">
    <div class="loading">
      전시대 참여자 정보를 불러오는 중입니다...
    </div>
  </div>

</main>


<script>

/* =========================================================
   Apps Script 주소
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyku3nq77mmD-RvRKv01w8psb5VZs3JMJIQwkliR5LynYf5_9JYlNhgTjRxHBcuGAqs/exec";


const GROUPS = [
  "A집단",
  "B집단",
  "C집단",
  "D집단"
];


const app =
  document.getElementById("app");


/* =========================================================
   데이터 불러오기
========================================================= */

async function loadData() {

  try {

    app.innerHTML = `
      <div class="loading">
        전시대 참여자 정보를 불러오는 중입니다...
      </div>
    `;


    const response =
      await fetch(
        API_URL + "?t=" + Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "서버 오류: " + response.status
      );

    }


    const data =
      await response.json();


    console.log("API DATA:", data);


    if (data.success === false) {

      throw new Error(
        data.message ||
        data.error ||
        "데이터를 가져오지 못했습니다."
      );

    }


    renderData(data);


  } catch (error) {

    console.error(error);

    app.innerHTML = `
      <div class="error">
        <strong>데이터를 불러오지 못했습니다.</strong>
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =========================================================
   배열 확인
========================================================= */

function safeArray(value) {

  return Array.isArray(value)
    ? value
    : [];

}


/* =========================================================
   집단명 정리
========================================================= */

function normalizeGroup(group) {

  return String(group || "")
    .replace(/\s/g, "")
    .trim();

}


/* =========================================================
   화면 생성
========================================================= */

function renderData(data) {


  const participants =
    safeArray(data.participants);


  const otherParticipants =
    safeArray(data.otherParticipants);


  const nonParticipants =
    safeArray(data.nonParticipants);


  const references =
    safeArray(data.references);


  let html = "";


  /* =======================================================
     참여자
  ======================================================= */

  html += `
  <section class="section">

    <div class="section-title">

      <h2>참여자</h2>

      <div class="total-count">
        ${participants.length}명
      </div>

    </div>

    <div class="group-grid">
  `;


  GROUPS.forEach(group => {

    const people =
      participants.filter(person =>
        normalizeGroup(person.group) === normalizeGroup(group)
      );


    html += `
    <div class="group-card">

      <div class="group-header">

        <div class="group-name">
          ${group}
        </div>

        <div class="group-count">
          ${people.length}명
        </div>

      </div>

      <div class="name-list">
    `;


    if (people.length === 0) {

      html += `
        <div class="empty-message">
          참여자가 없습니다.
        </div>
      `;

    } else {

      people.forEach(person => {

        html += `
          <span class="name-tag">
            ${escapeHtml(person.name)}
          </span>
        `;

      });

    }


    html += `
      </div>

    </div>
    `;

  });


  html += `
    </div>

  </section>
  `;


  /* =======================================================
     타 회중 참여자
  ======================================================= */

  html += `
  <section class="section">

    <div class="section-title">

      <h2>타 회중 참여자</h2>

      <div class="total-count">
        ${otherParticipants.length}명
      </div>

    </div>

    <div class="other-card">

      <div class="name-list">
  `;


  if (otherParticipants.length === 0) {

    html += `
      <div class="empty-message">
        참여자가 없습니다.
      </div>
    `;

  } else {

    otherParticipants.forEach(person => {

      const name =
        typeof person === "string"
          ? person
          : person.name;


      if (name) {

        html += `
          <span class="name-tag">
            ${escapeHtml(name)}
          </span>
        `;

      }

    });

  }


  html += `
      </div>

    </div>

  </section>
  `;


  /* =======================================================
     미 참여자
  ======================================================= */

  html += `
  <section class="section">

    <div class="section-title">

      <h2>미 참여자</h2>

      <div class="total-count">
        ${nonParticipants.length}명
      </div>

    </div>

    <div class="group-grid">
  `;


  GROUPS.forEach(group => {

    const people =
      nonParticipants.filter(person =>
        normalizeGroup(person.group) === normalizeGroup(group)
      );


    html += `
    <div class="group-card">

      <div class="group-header">

        <div class="group-name">
          ${group}
        </div>

        <div class="group-count">
          ${people.length}명
        </div>

      </div>

      <div class="name-list">
    `;


    if (people.length === 0) {

      html += `
        <div class="empty-message">
          참여자가 없습니다.
        </div>
      `;

    } else {

      people.forEach(person => {

        html += `
          <span class="name-tag">
            ${escapeHtml(person.name)}
          </span>
        `;

      });

    }


    html += `
      </div>

    </div>
    `;

  });


  html += `
    </div>

  </section>
  `;


  /* =======================================================
     참조
  ======================================================= */

  html += `
  <section class="section">

    <div class="section-title">

      <h2>참조</h2>

    </div>

    <div class="reference-card">
  `;


  if (references.length === 0) {

    html += `
      <div class="empty-message">
        참고 사항이 없습니다.
      </div>
    `;

  } else {

    references.forEach(reference => {

      let text = "";


      if (typeof reference === "string") {

        text = reference;

      } else if (reference && reference.text) {

        text = reference.text;

      } else if (reference && reference.name) {

        text = reference.name;

      }


      if (text) {

        html += `
          <div class="reference-item">
            ${escapeHtml(text)}
          </div>
        `;

      }

    });

  }


  html += `
    </div>

  </section>
  `;


  app.innerHTML = html;

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  if (document.referrer) {

    history.back();

  } else {

    window.location.href =
      "전시대관리자.html";

  }

}


/* =========================================================
   HTML 보안
========================================================= */

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   시작
========================================================= */

loadData();

</script>

</body>
</html>
