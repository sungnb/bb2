```
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
    }

    header {
        background-color: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .container {
        max-width: 800px;
        margin: 30px auto;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input {
        width: 70%;
        padding: 10px;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #3498db;
        color: white;
        font-size: 15px;
    }

    button:hover {
        background-color: #2980b9;
    }

    .participant {
        display: flex;
        justify-content: space-between;
        align-items: center;

        border-bottom: 1px solid #ddd;

    .delete-btn {
        background-color: #e74c3c;
    }

    .back-btn {
        background-color: #7f8c8d;

</style>
```

</head>

<body>

<header>
    <h1>👥 전시대 참여자 관리</h1>
</header>

<div class="container">

```
<div class="card">
    <h2>참여자 추가</h2>

    <input
        type="text"
        id="participantName"
        placeholder="참여자 이름을 입력하세요"
    >

    <button onclick="addParticipant()">
        추가
    </button>
</div>


<div class="card">
    <h2>참여자 목록</h2>

    <div id="participantList"></div>
</div>


<button
    class="back-btn"
    onclick="location.href='전시대관리자.html'"
>
    ← 전시대 관리자로 돌아가기
</button>
```

</div>

<script>

let participants =
    JSON.parse(localStorage.getItem("participants")) || [];


function renderParticipants() {

    const list =
        document.getElementById("participantList");

    list.innerHTML = "";


    if (participants.length === 0) {

        list.innerHTML =
            "<p>등록된 참여자가 없습니다.</p>";

        return;
    }


    participants.forEach((name, index) => {

        const div =
            document.createElement("div");

        div.className =
            "participant";


        div.innerHTML = `
            <span>${name}</span>

            <button
                class="delete-btn"
                onclick="deleteParticipant(${index})"
            >
                삭제
            </button>
        `;


        list.appendChild(div);

    });

}


function addParticipant() {

    const input =
        document.getElementById("participantName");

    const name =
        input.value.trim();


    if (!name) {

        alert("참여자 이름을 입력하세요.");

        return;
    }


    participants.push(name);


    localStorage.setItem(
        "participants",
        JSON.stringify(participants)
    );


    input.value = "";


    renderParticipants();

}


function deleteParticipant(index) {

    if (!confirm("삭제하시겠습니까?")) {
        return;
    }


    participants.splice(index, 1);


    localStorage.setItem(
        "participants",
        JSON.stringify(participants)
    );


    renderParticipants();

}


renderParticipants();

</script>

</body>
</html>
