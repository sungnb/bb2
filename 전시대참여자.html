<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>전시대 참여자</title>

<style>

  * {
    box-sizing: border-box;
  }


  body {
    margin: 0;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    background: #f5f6fa;
    color: #222;
  }


  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }


  /* =========================
     상단 제목
  ========================= */

  .page-title {
    margin: 0 0 20px;
    font-size: 28px;
    font-weight: 700;
  }


  /* =========================
     버튼 영역
  ========================= */

  .top-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }


  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
  }


  .refresh-btn {
    background: #2563eb;
    color: white;
  }


  .back-btn {
    background: #6b7280;
    color: white;
  }


  button:hover {
    opacity: 0.9;
  }


  /* =========================
     섹션
  ========================= */

  .section {
    background: white;
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow:
      0 2px 8px
      rgba(0,0,0,0.06);
  }


  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px 20px;

    font-size: 20px;
    font-weight: 700;

    border-bottom:
      1px solid #e5e7eb;
  }


  .count {
    font-size: 16px;
    font-weight: 600;
    color: #2563eb;
  }


  /* =========================
     집단
  ========================= */

  .group {
    padding: 16px 20px;
    border-bottom:
      1px solid #f0f0f0;
  }


  .group:last-child {
    border-bottom: none;
  }


  .group-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 12px;

    font-size: 17px;
    font-weight: 700;
  }


  .group-count {
    font-size: 14px;
    color: #666;
  }


  /* =========================
     이름 목록
  ========================= */

  .name-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }


  .name {
    padding: 7px 11px;

    background: #f3f4f6;

    border-radius: 6px;

    font-size: 15px;
  }


  /* =========================
     타 회중 참여자
  ========================= */

  .simple-list {
    padding: 16px 20px;

    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }


  /* =========================
     참고 사항
  ========================= */

  .reference-list {
    padding: 10px 20px 20px;
  }


  .reference-item {
    padding: 12px 14px;
    margin-top: 10px;

    background: #fff8e6;

    border-left:
      4px solid #eab308;

    border-radius: 6px;

    line-height: 1.6;
  }


  /* =========================
     로딩
  ========================= */

  .loading {
    padding: 50px;
    text-align: center;
    color: #666;
  }


  /* =========================
     오류
  ========================= */

  .error {
    padding: 20px;

    background: #fee2e2;

    color: #b91c1c;

    border-radius: 10px;
  }


  @media (max-width: 600px) {

    .container {
      padding: 15px;
    }

    .page-title {
      font-size: 24px;
    }

    .section-header {
      font-size: 18px;
    }

  }

</style>

</head>


<body>


<div class="container">


  <!-- =====================
       제목
  ====================== -->

  <h1 class="page-title">
    전시대 참여자
  </h1>



  <!-- =====================
       버튼
  ====================== -->

  <div class="top-actions">

    <button
      class="refresh-btn"
      onclick="loadData()"
    >
      새로고침
    </button>


    <button
      class="back-btn"
      onclick="goBack()"
    >
      뒤로가기
    </button>

  </div>



  <!-- =====================
       데이터 표시 영역
  ====================== -->

  <div id="app">

    <div class="loading">
      전시대 참여자 정보를 불러오는 중입니다...
    </div>

  </div>


</div>



<script>


// ============================================================
// Apps Script API 주소
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyku3nq77mmD-RvRKv01w8psb5VZs3JMJIQwkliR5LynYf5_9JYlNhgTjRxHBcuGAqs/exec";



// ============================================================
// 앱 영역
// ============================================================

const app =
  document.getElementById("app");



// ============================================================
// 데이터 불러오기
// ============================================================

async function loadData() {

  try {

    app.innerHTML = `
      <div class="loading">
        전시대 참여자 정보를 불러오는 중입니다...
      </div>
    `;


    const response =
      await fetch(
        API_URL,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "서버 응답 오류: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        data.error ||
        "데이터를 불러올 수 없습니다."
      );

    }


    renderData(data);


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="error">

        <strong>
          데이터를 불러오지 못했습니다.
        </strong>

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}



// ============================================================
// 화면 출력
// ============================================================

function renderData(data) {


  const participants =
    data.participants || [];


  const otherParticipants =
    data.otherParticipants || [];


  const nonParticipants =
    data.nonParticipants || [];


  const references =
    data.references || [];


  const counts =
    data.counts || {};


  const groups = [
    "A집단",
    "B집단",
    "C집단",
    "D집단"
  ];



  let html = "";



  // ==========================================================
  // 참여자
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-header">

        <span>
          참여자
        </span>

        <span class="count">
          ${counts.participants || 0}명
        </span>

      </div>

  `;


  groups.forEach(function(group) {

    const people =
      participants.filter(
        function(person) {

          return person.group === group;

        }
      );


    const groupCount =
      counts.participantGroups &&
      counts.participantGroups[group] !== undefined
        ? counts.participantGroups[group]
        : people.length;


    html += `

      <div class="group">

        <div class="group-title">

          <span>
            ${group}
          </span>

          <span class="group-count">
            ${groupCount}명
          </span>

        </div>


        <div class="name-list">

    `;


    if (people.length === 0) {

      html += `
        <span style="color:#999;">
          등록된 참여자가 없습니다.
        </span>
      `;

    }


    people.forEach(function(person) {

      html += `

        <span class="name">
          ${escapeHtml(person.name)}
        </span>

      `;

    });


    html += `

        </div>

      </div>

    `;

  });


  html += `
    </section>
  `;



  // ==========================================================
  // 타 회중 참여자
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-header">

        <span>
          타 회중 참여자
        </span>

        <span class="count">
          ${counts.otherParticipants || 0}명
        </span>

      </div>


      <div class="simple-list">

  `;


  if (
    otherParticipants.length === 0
  ) {

    html += `
      <span style="color:#999;">
        등록된 참여자가 없습니다.
      </span>
    `;

  }


  otherParticipants.forEach(function(person) {

    html += `

      <span class="name">
        ${escapeHtml(person.name)}
      </span>

    `;

  });


  html += `

      </div>

    </section>

  `;



  // ==========================================================
  // 미 참여자
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-header">

        <span>
          미 참여자
        </span>

        <span class="count">
          ${counts.nonParticipants || 0}명
        </span>

      </div>

  `;


  groups.forEach(function(group) {

    const people =
      nonParticipants.filter(
        function(person) {

          return person.group === group;

        }
      );


    const groupCount =
      counts.nonParticipantGroups &&
      counts.nonParticipantGroups[group] !== undefined
        ? counts.nonParticipantGroups[group]
        : people.length;


    html += `

      <div class="group">

        <div class="group-title">

          <span>
            ${group}
          </span>

          <span class="group-count">
            ${groupCount}명
          </span>

        </div>


        <div class="name-list">

    `;


    if (people.length === 0) {

      html += `
        <span style="color:#999;">
          해당 집단에 없습니다.
        </span>
      `;

    }


    people.forEach(function(person) {

      html += `

        <span class="name">
          ${escapeHtml(person.name)}
        </span>

      `;

    });


    html += `

        </div>

      </div>

    `;

  });


  html += `
    </section>
  `;



  // ==========================================================
  // 참조
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-header">

        <span>
          참조
        </span>

      </div>


      <div class="reference-list">

  `;


  if (
    references.length === 0
  ) {

    html += `

      <div style="padding:10px;color:#999;">
        참고 사항이 없습니다.
      </div>

    `;

  }


  references.forEach(function(reference) {

    html += `

      <div class="reference-item">
        ${escapeHtml(reference)}
      </div>

    `;

  });


  html += `

      </div>

    </section>

  `;



  // ==========================================================
  // 화면 적용
  // ==========================================================

  app.innerHTML =
    html;

}



// ============================================================
// 뒤로가기
// ============================================================

function goBack() {

  // 브라우저 이전 페이지가 있으면 이동

  if (
    window.history.length > 1
  ) {

    window.history.back();

  } else {

    // 직접 접속한 경우 관리자 페이지로 이동

    window.location.href =
      "전시대관리자.html";

  }

}



// ============================================================
// HTML 문자 보호
// ============================================================

function escapeHtml(text) {

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// ============================================================
// 최초 실행
// ============================================================

loadData();


</script>


</body>
</html>
