<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전시대 참여자</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;
  background: #172532;
  color: #ffffff;
}

.header {
  padding: 28px 20px;
  text-align: center;
  background: #22313f;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.header h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
}

.container {
  max-width: 1300px;
  margin: 0 auto;
  padding: 25px 20px 60px;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 35px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 22px;
  font-size: 15px;
  cursor: pointer;
  background: #536477;
  color: white;
}

button:hover {
  opacity: .9;
}

.section {
  margin-bottom: 45px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid rgba(255,255,255,.15);
}

.section-title h2 {
  margin: 0;
  font-size: 23px;
}

.total-count {
  font-size: 17px;
  font-weight: 700;
  color: #d5dde5;
}

.group-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.group-card,
.other-card,
.reference-card {
  background: #293949;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  overflow: hidden;
}

.group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 17px;
  background: #3c5063;
  font-weight: 700;
}

.group-name {
  font-size: 17px;
}

.group-count {
  font-size: 15px;
  opacity: .9;
}

.name-list {
  padding: 15px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 65px;
}

.name-tag {
  display: inline-block;
  padding: 8px 12px;
  background: #354758;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;
  font-size: 14px;
}

.empty-message {
  width: 100%;
  text-align: center;
  padding: 12px;
  color: #9eabb6;
}

.reference-list {
  padding: 5px 20px;
}

.reference-item {
  padding: 15px 0;
  border-bottom: 1px solid rgba(255,255,255,.1);
  line-height: 1.7;
}

.reference-item:last-child {
  border-bottom: none;
}

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #aebbc7;
}

.error {
  text-align: center;
  padding: 50px 20px;
  color: #ffb7b7;
}

@media (max-width: 1000px) {
  .group-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .group-grid {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>전시대 참여자</h1>
</div>

<div class="container">

  <div class="actions">
    <button onclick="loadData()">새로고침</button>
    <button onclick="goBack()">뒤로가기</button>
  </div>

  <div id="app">
    <div class="loading">
      데이터를 불러오는 중입니다...
    </div>
  </div>

</div>


<script>

/* =========================================================
   API 주소
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbyku3nq77mmD-RvRKv01w8psb5VZs3JMJIQwkliR5LynYf5_9JYlNhgTjRxHBcuGAqs/exec";


const GROUPS = [
  "A집단",
  "B집단",
  "C집단",
  "D집단"
];


/* =========================================================
   데이터 불러오기
========================================================= */

async function loadData() {

  const app =
    document.getElementById("app");


  app.innerHTML = `
    <div class="loading">
      데이터를 불러오는 중입니다...
    </div>
  `;


  try {

    const response =
      await fetch(
        API_URL + "?t=" + Date.now()
      );


    const data =
      await response.json();


    console.log("받은 데이터:", data);


    if (!data.success) {

      throw new Error(
        data.message ||
        data.error ||
        "데이터를 가져오지 못했습니다."
      );

    }


    renderData(data);


  } catch (error) {

    console.error(error);


    app.innerHTML = `
      <div class="error">
        데이터를 불러오는 중 오류가 발생했습니다.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =========================================================
   전체 화면 생성
========================================================= */

function renderData(data) {


  const participants =
    Array.isArray(data.participants)
      ? data.participants
      : [];


  const otherParticipants =
    Array.isArray(data.otherParticipants)
      ? data.otherParticipants
      : [];


  const nonParticipants =
    Array.isArray(data.nonParticipants)
      ? data.nonParticipants
      : [];


  const references =
    Array.isArray(data.references)
      ? data.references
      : [];


  let html = "";


  /* =======================================================
     참여자
  ======================================================= */

  html += `
    <section class="section">

      <div class="section-title">
        <h2>참여자</h2>
        <div class="total-count">
          ${participants.length}명
        </div>
      </div>

      <div class="group-grid">
  `;


  GROUPS.forEach(function(group) {

    const people =
      participants.filter(function(person) {

        return normalizeGroup(person.group) ===
          normalizeGroup(group);

      });


    html += `
      <div class="group-card">

        <div class="group-header">
          <span class="group-name">${group}</span>
          <span class="group-count">${people.length}명</span>
        </div>

        <div class="name-list">
    `;


    if (people.length === 0) {

      html += `
        <div class="empty-message">
          참여자가 없습니다.
        </div>
      `;

    } else {

      people.forEach(function(person) {

        html += `
          <span class="name-tag">
            ${escapeHtml(person.name)}
          </span>
        `;

      });

    }


    html += `
        </div>

      </div>
    `;

  });


  html += `
      </div>

    </section>
  `;


  /* =======================================================
     타 회중 참여자
  ======================================================= */

  html += `
    <section class="section">

      <div class="section-title">
        <h2>타 회중 참여자</h2>
        <div class="total-count">
          ${otherParticipants.length}명
        </div>
      </div>

      <div class="other-card">

        <div class="name-list">
  `;


  if (otherParticipants.length === 0) {

    html += `
      <div class="empty-message">
        참여자가 없습니다.
      </div>
    `;

  } else {

    otherParticipants.forEach(function(person) {

      const name =
        typeof person === "string"
          ? person
          : person.name;


      if (name) {

        html += `
          <span class="name-tag">
            ${escapeHtml(name)}
          </span>
        `;

      }

    });

  }


  html += `
        </div>

      </div>

    </section>
  `;


  /* =======================================================
     미 참여자
  ======================================================= */

  html += `
    <section class="section">

      <div class="section-title">
        <h2>미 참여자</h2>
        <div class="total-count">
          ${nonParticipants.length}명
        </div>
      </div>

      <div class="group-grid">
  `;


  GROUPS.forEach(function(group) {

    const people =
      nonParticipants.filter(function(person) {

        return normalizeGroup(person.group) ===
          normalizeGroup(group);

      });


    html += `
      <div class="group-card">

        <div class="group-header">
          <span class="group-name">${group}</span>
          <span class="group-count">${people.length}명</span>
        </div>

        <div class="name-list">
    `;


    if (people.length === 0) {

      html += `
        <div class="empty-message">
          참여자가 없습니다.
        </div>
      `;

    } else {

      people.forEach(function(person) {

        html += `
          <span class="name-tag">
            ${escapeHtml(person.name)}
          </span>
        `;

      });

    }


    html += `
        </div>

      </div>
    `;

  });


  html += `
      </div>

    </section>
  `;


  /* =======================================================
     참조
  ======================================================= */

  html += `
    <section class="section">

      <div class="section-title">
        <h2>참조</h2>
      </div>

      <div class="reference-card">

        <div class="reference-list">
  `;


  if (references.length === 0) {

    html += `
      <div class="empty-message">
        참고 사항이 없습니다.
      </div>
    `;

  } else {

    references.forEach(function(reference) {

      let text = "";


      if (typeof reference === "string") {

        text = reference;

      } else if (reference && reference.text) {

        text = reference.text;

      } else if (reference && reference.name) {

        text = reference.name;

      }


      if (text) {

        html += `
          <div class="reference-item">
            ${escapeHtml(text)}
          </div>
        `;

      }

    });

  }


  html += `
        </div>

      </div>

    </section>
  `;


  document.getElementById("app").innerHTML =
    html;

}


/* =========================================================
   집단명 정리
========================================================= */

function normalizeGroup(group) {

  return String(group || "")
    .replace(/\s+/g, "")
    .trim();

}


/* =========================================================
   HTML 문자 처리
========================================================= */

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  if (history.length > 1) {

    history.back();

  } else {

    window.location.href =
      "전시대관리자.html";

  }

}


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadData();

  }
);

</script>

</body>
</html>
