<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>전시대 참여자</title>

<style>

/* ============================================================
   기본 설정
============================================================ */

* {
  box-sizing: border-box;
}


body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;

  background: #172532;

  color: #e8edf3;

}


/* ============================================================
   상단 헤더
============================================================ */

.page-header {

  background: #2b3b4b;

  border-bottom:
    1px solid #405264;

  padding: 20px;

  text-align: center;

}


.page-header h1 {

  margin: 0;

  font-size: 30px;

  font-weight: 800;

  letter-spacing: -1px;

}


/* ============================================================
   전체 컨테이너
============================================================ */

.container {

  width: 100%;

  max-width: 1400px;

  margin: 0 auto;

  padding:
    30px 15px 50px;

}


/* ============================================================
   상단 버튼
============================================================ */

.top-actions {

  display: flex;

  justify-content: center;

  gap: 12px;

  margin-bottom: 35px;

}


.action-button {

  border: none;

  border-radius: 12px;

  padding:
    16px 28px;

  background: #536477;

  color: #edf2f7;

  font-size: 18px;

  font-weight: 700;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease;

}


.action-button:hover {

  background: #63768a;

  transform:
    translateY(-2px);

}


.action-button:active {

  transform:
    translateY(0);

}


/* ============================================================
   섹션
============================================================ */

.section {

  margin-bottom: 55px;

}


.section-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding-bottom: 12px;

  margin-bottom: 52px;

  border-bottom:
    2px solid #425365;

}


.section-title h2 {

  margin: 0;

  font-size: 27px;

  font-weight: 800;

}


.total-count {

  font-size: 21px;

  font-weight: 700;

  color: #dce5ee;

}


/* ============================================================
   집단 카드 그리드
============================================================ */

.group-grid {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 18px;

}


/* ============================================================
   집단 카드
============================================================ */

.group-card {

  background: #2a3949;

  border:

    1px solid #425568;

  border-radius: 18px;

  overflow: hidden;

  min-height: 155px;

}


/* 카드 헤더 */

.group-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding:
    20px 24px;

  background: #536477;

  border-bottom:

    1px solid #607286;

}


.group-name {

  font-size: 21px;

  font-weight: 800;

}


.group-count {

  font-size: 16px;

  font-weight: 700;

  color: #e2e8f0;

}


/* ============================================================
   이름 영역
============================================================ */

.name-list {

  padding: 16px;

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  align-content: flex-start;

}


.name {

  padding:
    8px 12px;

  background: #344353;

  border:

    1px solid #46596c;

  border-radius: 7px;

  color: #edf2f7;

  font-size: 16px;

  font-weight: 600;

}


.empty-message {

  width: 100%;

  text-align: center;

  padding: 18px 10px;

  color: #aebdcc;

  font-size: 17px;

}


/* ============================================================
   타 회중 참여자
============================================================ */

.other-card {

  background: #2a3949;

  border:

    1px solid #425568;

  border-radius: 18px;

  padding: 18px;

  min-height: 65px;

}


/* ============================================================
   참조
============================================================ */

.reference-card {

  background: #2a3949;

  border:

    1px solid #425568;

  border-radius: 18px;

  padding: 20px;

}


.reference-item {

  padding:
    15px 0;

  font-size: 17px;

  line-height: 1.7;

  color: #e5ebf1;

  border-bottom:

    1px solid #3a4b5d;

}


.reference-item:last-child {

  border-bottom: none;

}


/* ============================================================
   로딩
============================================================ */

.loading {

  text-align: center;

  padding: 100px 20px;

  color: #b7c4d0;

  font-size: 18px;

}


/* ============================================================
   오류
============================================================ */

.error {

  background: #4a2c32;

  border:

    1px solid #8b4b55;

  border-radius: 14px;

  padding: 25px;

  color: #ffd7dc;

  text-align: center;

}


/* ============================================================
   태블릿
============================================================ */

@media (max-width: 1000px) {

  .group-grid {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

  }

}


/* ============================================================
   모바일
============================================================ */

@media (max-width: 600px) {

  .page-header h1 {

    font-size: 25px;

  }


  .container {

    padding:
      22px 12px 40px;

  }


  .top-actions {

    margin-bottom: 30px;

  }


  .action-button {

    padding:
      13px 20px;

    font-size: 16px;

  }


  .section {

    margin-bottom: 40px;

  }


  .section-title {

    margin-bottom: 20px;

  }


  .section-title h2 {

    font-size: 23px;

  }


  .total-count {

    font-size: 18px;

  }


  .group-grid {

    grid-template-columns: 1fr;

    gap: 14px;

  }


  .group-card {

    border-radius: 14px;

  }


  .group-header {

    padding:
      16px 18px;

  }


  .group-name {

    font-size: 19px;

  }


}

</style>

</head>


<body>


<!-- ============================================================
     제목
============================================================ -->

<header class="page-header">

  <h1>
    👥 전시대 참여자
  </h1>

</header>



<main class="container">


  <!-- ==========================================================
       버튼
  =========================================================== -->

  <div class="top-actions">

    <button
      class="action-button"
      onclick="loadData()"
    >
      🔄 새로고침
    </button>


    <button
      class="action-button"
      onclick="goBack()"
    >
      ← 뒤로가기
    </button>

  </div>



  <!-- ==========================================================
       데이터 출력 영역
  =========================================================== -->

  <div id="app">

    <div class="loading">
      전시대 참여자 정보를 불러오는 중입니다...
    </div>

  </div>


</main>



<script>


// ============================================================
// Apps Script API 주소
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyku3nq77mmD-RvRKv01w8psb5VZs3JMJIQwkliR5LynYf5_9JYlNhgTjRxHBcuGAqs/exec";


// ============================================================
// 앱 영역
// ============================================================

const app =
  document.getElementById("app");



// ============================================================
// 데이터 불러오기
// ============================================================

async function loadData() {

  try {

    app.innerHTML = `

      <div class="loading">
        전시대 참여자 정보를 불러오는 중입니다...
      </div>

    `;


    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
          method: "GET",

          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "서버 응답 오류: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        data.error ||
        "데이터를 불러올 수 없습니다."
      );

    }


    renderData(data);


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="error">

        <strong>
          데이터를 불러오지 못했습니다.
        </strong>

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}



// ============================================================
// 화면 출력
// ============================================================

function renderData(data) {


  const participants =
    data.participants || [];


  const otherParticipants =
    data.otherParticipants || [];


  const nonParticipants =
    data.nonParticipants || [];


  const references =
    data.references || [];


  const counts =
    data.counts || {};


  const groups = [

    "A집단",

    "B집단",

    "C집단",

    "D집단"

  ];


  let html = "";



  // ==========================================================
  // 참여자
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-title">

        <h2>
          참여자
        </h2>

        <div class="total-count">
          ${counts.participants || participants.length}명
        </div>

      </div>


      <div class="group-grid">

  `;


  groups.forEach(function(group) {


    const people =
      participants.filter(
        function(person) {

          return person.group === group;

        }
      );


    const groupCount =

      counts.participantGroups &&
      counts.participantGroups[group] !== undefined

        ?

        counts.participantGroups[group]

        :

        people.length;


    html += `

      <div class="group-card">


        <div class="group-header">

          <div class="group-name">

            ${group}

          </div>


          <div class="group-count">

            ${groupCount}명

          </div>

        </div>


        <div class="name-list">

    `;


    if (people.length === 0) {

      html += `

        <div class="empty-message">

          참여자가 없습니다.

        </div>

      `;

    }


    people.forEach(function(person) {

      html += `

        <div class="name">

          ${escapeHtml(person.name)}

        </div>

      `;

    });


    html += `

        </div>

      </div>

    `;

  });


  html += `

      </div>

    </section>

  `;



  // ==========================================================
  // 타 회중 참여자
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-title">

        <h2>
          타 회중 참여자
        </h2>

        <div class="total-count">
          ${counts.otherParticipants || otherParticipants.length}명
        </div>

      </div>


      <div class="other-card">

        <div class="name-list">

  `;


  if (otherParticipants.length === 0) {

    html += `

      <div class="empty-message">

        참여자가 없습니다.

      </div>

    `;

  }


  otherParticipants.forEach(function(person) {

    html += `

      <div class="name">

        ${escapeHtml(person.name)}

      </div>

    `;

  });


  html += `

        </div>

      </div>

    </section>

  `;



  // ==========================================================
  // 미 참여자
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-title">

        <h2>
          미 참여자
        </h2>

        <div class="total-count">
          ${counts.nonParticipants || nonParticipants.length}명
        </div>

      </div>


      <div class="group-grid">

  `;


  groups.forEach(function(group) {


    const people =
      nonParticipants.filter(
        function(person) {

          return person.group === group;

        }
      );


    const groupCount =

      counts.nonParticipantGroups &&
      counts.nonParticipantGroups[group] !== undefined

        ?

        counts.nonParticipantGroups[group]

        :

        people.length;


    html += `

      <div class="group-card">


        <div class="group-header">

          <div class="group-name">

            ${group}

          </div>


          <div class="group-count">

            ${groupCount}명

          </div>

        </div>


        <div class="name-list">

    `;


    if (people.length === 0) {

      html += `

        <div class="empty-message">

          참여자 없음

        </div>

      `;

    }


    people.forEach(function(person) {

      html += `

        <div class="name">

          ${escapeHtml(person.name)}

        </div>

      `;

    });


    html += `

        </div>

      </div>

    `;

  });


  html += `

      </div>

    </section>

  `;



  // ==========================================================
  // 참조
  // ==========================================================

  html += `

    <section class="section">

      <div class="section-title">

        <h2>
          참조
        </h2>

      </div>


      <div class="reference-card">

  `;


  if (references.length === 0) {

    html += `

      <div class="empty-message">

        참고 사항이 없습니다.

      </div>

    `;

  }


  references.forEach(function(reference) {

    html += `

      <div class="reference-item">

        ${escapeHtml(reference)}

      </div>

    `;

  });


  html += `

      </div>

    </section>

  `;



  // ==========================================================
  // 화면 적용
  // ==========================================================

  app.innerHTML = html;


}



// ============================================================
// 뒤로가기
// ============================================================

function goBack() {


  if (window.history.length > 1) {

    window.history.back();

  } else {

    window.location.href =
      "전시대관리자.html";

  }


}



// ============================================================
// HTML 문자 보호
// ============================================================

function escapeHtml(text) {

  return String(text || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}



// ============================================================
// 최초 데이터 불러오기
// ============================================================

loadData();


</script>


</body>
</html>
