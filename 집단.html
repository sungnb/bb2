```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>북부회중 게시판</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
      background: #f3f4f6;
    }

    .page {
      width: 100%;
      margin: 0;
      background: white;
      min-height: 100vh;
      padding-top: 62px;
      padding-bottom: 60px;
    }

    /* 상단 헤더 */
    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 62px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: #193650;
      color: #fff;
      text-align: center;
    }

    .main-title {
      margin: 0;
      padding: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 40px;
      white-space: nowrap;
    }

    /* 공강.html과 동일한 상단 버튼 */
    .top-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px;
      background: transparent;
      color: white;
      font-size: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .back-button {
      left: 10px;
    }

    .settings-button {
      right: 10px;
    }

    /* 본문 */
    #content {
      width: 100%;
      padding: 25px 10px 20px;
    }

    /* 하단 고정 메뉴 */
    .fixed-bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      z-index: 1000;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      background: #193650;
      border-top: 1px solid rgba(255,255,255,.10);
    }

    .fixed-bottom button {
      min-width: 0;
      height: 59px;
      padding: 0 4px;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #fff;
      font-family: Arial, "Malgun Gothic", sans-serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .fixed-bottom button + button {
      border-left: 1px solid rgba(255,255,255,.25);
    }

    /* 설정창 */
    .settings-panel {
      display: none;
      position: fixed;
      top: 85px;
      right: 14px;
      width: 328px;
      max-width: calc(100vw - 20px);
      padding: 17px;
      z-index: 1100;
      border: 1px solid #dedfe5;
      border-radius: 22px;
      background: #fff;
      color: #222;
      box-shadow: 0 14px 32px rgba(0,0,0,.18);
    }

    .settings-panel.show {
      display: block;
    }

    .settings-theme-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .theme-btn {
      min-width: 0;
      height: 59px;
      padding: 0 6px;
      border: 1px solid #dce0e7;
      border-radius: 16px;
      background: #f5f6f8;
      color: #222;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .theme-btn.active {
      background: #eeeaff;
      border-color: #7566ff;
      color: #40348d;
    }

    .settings-font-row {
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      gap: 10px;
      align-items: center;
    }

    .font-btn,
    .font-size {
      height: 59px;
      min-width: 0;
      border: 1px solid #dce0e7;
      border-radius: 16px;
      background: #f5f6f8;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .font-btn {
      font-size: 30px;
      cursor: pointer;
    }

    .font-size {
      font-size: 21px;
    }

    .settings-panel.dark-mode {
      background: #202020;
      color: #f5f5f5;
      border-color: #404040;
    }

    .settings-panel.dark-mode .theme-btn,
    .settings-panel.dark-mode .font-btn,
    .settings-panel.dark-mode .font-size {
      background: #202020;
      color: #eee;
      border-color: #505050;
    }

    .settings-panel.dark-mode .theme-btn.active {
      background: #302b50;
      border-color: #7566ff;
      color: #fff;
    }

    @media (max-width: 360px) {
      .settings-panel {
        right: 10px;
        padding: 12px;
      }

      .settings-font-row {
        grid-template-columns: 58px 1fr 58px;
        gap: 7px;
      }

      .theme-btn {
        font-size: 16px;
      }

      .fixed-bottom button {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- 상단 헤더 -->
    <header class="fixed-header">
      <button type="button"
        class="top-button back-button"
        onclick="history.back()"
        aria-label="뒤로가기">‹</button>

      <div class="main-title">북부회중 게시판</div>

      <button type="button"
        class="top-button settings-button"
        onclick="toggleSettings()"
        aria-label="설정">⚙</button>
    </header>

    <!-- 본문: 나중에 추가 -->
    <main id="content">
    </main>

    <!-- 하단 고정 메뉴 -->
    <nav class="fixed-bottom">
      <button type="button"
        onclick="location.href='공강.html'">
        공개강연
      </button>

      <button type="button"
        onclick="location.href='생봉.html'">
        생활과봉사
      </button>

      <button type="button"
        onclick="location.href='집단.html'">
        집단및부서
      </button>
    </nav>

  </div>

  <!-- 설정창 -->
  <div id="settingsPanel" class="settings-panel">
    <div class="settings-theme-row">
      <button type="button" id="lightBtn"
        class="theme-btn" onclick="setTheme('light')">
        ☀ 밝게
      </button>

      <button type="button" id="darkBtn"
        class="theme-btn" onclick="setTheme('dark')">
        🌙 어둡게
      </button>
    </div>

    <div class="settings-font-row">
      <button type="button" class="font-btn"
        onclick="changeFont(-10)" aria-label="글자 작게">−</button>

      <div id="fontSize" class="font-size">120%</div>

      <button type="button" class="font-btn"
        onclick="changeFont(10)" aria-label="글자 크게">＋</button>
    </div>
  </div>

  <script>
    function toggleSettings() {
      document.getElementById("settingsPanel")
        .classList.toggle("show");
    }

    function setTheme(theme) {
      const isLight = theme === "light";
      const panel = document.getElementById("settingsPanel");
      const lightBtn = document.getElementById("lightBtn");
      const darkBtn = document.getElementById("darkBtn");

      document.body.classList.toggle("dark-mode", !isLight);
      document.body.style.background = isLight ? "#f3f4f6" : "#202124";
      document.body.style.color = isLight ? "#222" : "#f1f3f4";

      document.querySelector(".page").style.background =
        isLight ? "#fff" : "#303134";

      panel.classList.toggle("dark-mode", !isLight);
      lightBtn.classList.toggle("active", isLight);
      darkBtn.classList.toggle("active", !isLight);

      localStorage.setItem("northBoardTheme", theme);
    }

    let fontPercent = 120;

    function setFontPercent(percent) {
      fontPercent = Math.max(80, Math.min(150, percent));
      document.getElementById("fontSize").textContent =
        fontPercent + "%";

      document.getElementById("content").style.fontSize =
        fontPercent + "%";

      localStorage.setItem(
        "northBoardFontPercent",
        String(fontPercent)
      );
    }

    function changeFont(amount) {
      setFontPercent(fontPercent + amount);
    }

    (function restoreSettings() {
      const savedTheme = localStorage.getItem("northBoardTheme");
      const savedFont = Number(
        localStorage.getItem("northBoardFontPercent")
      );

      setTheme(savedTheme === "light" ? "light" : "dark");

      setFontPercent(
        Number.isFinite(savedFont) &&
        savedFont >= 80 &&
        savedFont <= 150
          ? savedFont
          : 120
      );
    })();
  </script>
</body>
</html>
