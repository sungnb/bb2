<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>토요일</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

body {
  background:
    radial-gradient(
      circle at top,
      #303030 0%,
      #1d1d1d 42%,
      #0d0d0d 100%
    );

  color: #f5f5f5;

  padding-top: 62px;
  padding-bottom: 82px;

  transition:
    background .25s,
    color .25s;
}

body.light {
  background:
    radial-gradient(
      circle at top,
      #ffffff 0%,
      #f1f1f1 55%,
      #e5e5e5 100%
    );

  color: #222;
}


/* =========================================================
   상단
========================================================= */

.top-bar {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: 62px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(20,20,20,.96);

  border-bottom:
    1px solid rgba(255,255,255,.12);
}

body.light .top-bar {
  background: rgba(255,255,255,.96);

  border-bottom:
    1px solid rgba(0,0,0,.12);
}

.top-title {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1px;
}

.top-button {
  position: absolute;

  top: 5px;

  width: 47px;
  height: 47px;

  border: 0;
  border-radius: 13px;

  background: #292929;
  color: #fff;

  font-size: 28px;
  font-weight: 900;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

body.light .top-button {
  background: #e8e8e8;
  color: #222;
}

.back-button {
  left: 26px;
}

.settings-button {
  right: 26px;
  font-size: 25px;
}


/* =========================================================
   설정
========================================================= */

.settings-panel {
  display: none;

  position: fixed;

  top: 62px;
  right: 15px;

  width: 260px;

  padding: 18px;

  z-index: 1100;

  border-radius: 16px;

  background: rgba(35,35,35,.98);

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 12px 35px rgba(0,0,0,.4);
}

body.light .settings-panel {
  background: #fff;

  border-color:
    rgba(0,0,0,.12);

  box-shadow:
    0 12px 35px rgba(0,0,0,.18);
}

.settings-panel.show {
  display: block;
}

.settings-title {
  font-size: 17px;
  font-weight: 900;

  margin-bottom: 13px;
}

.settings-row {
  display: flex;

  gap: 8px;

  margin-bottom: 14px;
}

.settings-row button {
  flex: 1;

  min-height: 40px;

  border: 0;
  border-radius: 10px;

  background: #444;
  color: #fff;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
}

body.light .settings-row button {
  background: #e5e5e5;
  color: #222;
}

.font-label {
  font-size: 14px;
  font-weight: 800;

  margin-bottom: 8px;
}

.font-buttons {
  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 6px;
}

.font-buttons button {
  min-height: 36px;

  border: 0;
  border-radius: 8px;

  background: #444;
  color: #fff;

  font-size: 13px;
  font-weight: 800;
}

body.light .font-buttons button {
  background: #e5e5e5;
  color: #222;
}


/* =========================================================
   공통 본문
========================================================= */

.main {
  width: 100%;

  max-width: 900px;

  margin: 0 auto;

  padding:
    52px 15px 30px;
}

.view {
  display: none;
}

.view.active {
  display: block;
}

.page-title {
  text-align: center;

  font-size: 29px;
  font-weight: 900;

  margin: 0;
}

.page-subtitle {
  text-align: center;

  font-size: 16px;
  font-weight: 700;

  color: #aaa;

  margin-top: 10px;
}

body.light .page-subtitle {
  color: #666;
}


/* =========================================================
   봉사신청
========================================================= */

.apply-count-box {
  margin-top: 24px;

  min-height: 76px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.12);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 18px;
  font-weight: 800;
}

body.light .apply-count-box {
  background:
    rgba(0,0,0,.05);

  border-color:
    rgba(0,0,0,.1);
}

.apply-count {
  font-size: 29px;
  font-weight: 900;

  margin: 0 5px;
}

.sister-grid {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 8px;

  margin-top: 24px;
}

.sister-card {
  min-height: 55px;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 7px;

  border-radius: 11px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.13);

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  user-select: none;
}

body.light .sister-card {
  background: #fff;

  border-color: #d5d5d5;

  color: #222;
}

.sister-card.checked {
  background: #21384d;

  border-color: #3e80b8;

  color: #fff;
}

body.light .sister-card.checked {
  background: #dceeff;

  border-color: #6ba8d8;

  color: #17456b;
}

.sister-check {
  position: absolute;

  right: 7px;
  top: 7px;

  width: 19px;
  height: 19px;

  border-radius: 50%;

  border:
    2px solid #777;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 12px;
  font-weight: 900;
}

.sister-card.checked
.sister-check {
  background: #5da8ec;

  border-color: #5da8ec;

  color: #fff;
}

.apply-next {
  width: 100%;

  min-height: 55px;

  margin-top: 20px;

  border: 1px solid #3471a6;

  border-radius: 14px;

  background: #1e3040;

  color: #fff;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}

body.light .apply-next {
  background: #e7f3ff;

  color: #17456b;
}


/* =========================================================
   관리자
========================================================= */

.applicant-count-box {
  margin-top: 24px;

  min-height: 76px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.12);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 18px;
  font-weight: 800;
}

body.light .applicant-count-box {
  background:
    rgba(0,0,0,.05);

  border-color:
    rgba(0,0,0,.1);
}

.applicant-count {
  font-size: 29px;
  font-weight: 900;

  margin: 0 5px;
}

.section-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-top: 27px;
  margin-bottom: 13px;
}

.section-title {
  font-size: 21px;
  font-weight: 900;
}

.section-count {
  font-size: 14px;
  font-weight: 800;

  color: #aaa;
}

body.light .section-count {
  color: #666;
}


/* =========================================================
   미배정 자매
========================================================= */

.unassigned-grid {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 8px;
}

.person {
  min-height: 51px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 7px;

  border-radius: 11px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.13);

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  user-select: none;
}

body.light .person {
  background: #fff;

  border-color: #d5d5d5;

  color: #222;
}

.person.selected {
  background: #21384d;

  border-color: #3e80b8;

  color: #fff;
}

body.light .person.selected {
  background: #dceeff;

  border-color: #6ba8d8;

  color: #17456b;
}

.empty-message {
  text-align: center;

  padding: 27px 10px;

  color: #aaa;

  font-size: 17px;
  font-weight: 700;
}

body.light .empty-message {
  color: #777;
}


/* =========================================================
   안내
========================================================= */

.notice {
  margin-top: 18px;

  padding: 14px;

  border-radius: 14px;

  background:
    rgba(34,54,72,.65);

  border:
    1px solid #315875;

  text-align: center;

  font-size: 14px;
  font-weight: 700;

  line-height: 1.7;
}


/* =========================================================
   봉사 그룹
========================================================= */

.groups-header {
  margin-top: 27px;
}

.group-card {
  margin-bottom: 17px;

  padding: 15px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid rgba(255,255,255,.12);
}

body.light .group-card {
  background:
    rgba(255,255,255,.8);

  border-color:
    rgba(0,0,0,.1);
}

.group-title-row {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 11px;
}

.group-title {
  font-size: 20px;
  font-weight: 900;
}

.delete-group {
  border: 0;

  border-radius: 10px;

  padding: 8px 12px;

  background: #444;

  color: #fff;

  font-size: 13px;
  font-weight: 800;
}

body.light .delete-group {
  background: #ddd;

  color: #222;
}

.slots {
  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 9px;
}

.slot {
  min-height: 67px;

  border-radius: 13px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 8px;

  background:
    rgba(0,0,0,.15);

  border:
    1px dashed rgba(255,255,255,.18);

  color: #aaa;

  font-size: 15px;
  font-weight: 800;

  text-align: center;

  cursor: pointer;
}

body.light .slot {
  background: #f3f3f3;

  border-color: #bbb;

  color: #888;
}

.slot.filled {
  background: #263c50;

  border:
    1px solid #3d6d94;

  color: #fff;
}

body.light .slot.filled {
  background: #e0f0ff;

  border-color: #8ab6d8;

  color: #17456b;
}

.add-group {
  width: 100%;

  min-height: 55px;

  border:
    1px solid #3471a6;

  border-radius: 14px;

  background: #1e3040;

  color: #fff;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}

body.light .add-group {
  background: #e7f3ff;

  color: #17456b;
}


/* =========================================================
   봉사하기
========================================================= */

.service-intro {
  margin-top: 24px;

  padding: 15px;

  border-radius: 15px;

  background:
    rgba(34,54,72,.65);

  border:
    1px solid #315875;

  text-align: center;

  font-size: 14px;
  font-weight: 700;

  line-height: 1.7;
}

.service-card {
  margin-top: 17px;

  padding: 16px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid rgba(255,255,255,.12);
}

body.light .service-card {
  background:
    rgba(255,255,255,.85);

  border-color:
    rgba(0,0,0,.1);
}

.service-number {
  font-size: 15px;

  font-weight: 900;

  color: #5da8ec;

  margin-bottom: 4px;
}

body.light .service-number {
  color: #1768a5;
}

.service-place {
  font-size: 22px;

  font-weight: 900;

  margin-bottom: 5px;
}

.service-meta {
  font-size: 14px;

  font-weight: 700;

  color: #aaa;

  margin-bottom: 13px;
}

body.light .service-meta {
  color: #666;
}

.service-members {
  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 8px;
}

.service-member {
  min-height: 52px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 11px;

  background:
    rgba(38,60,80,.9);

  border:
    1px solid #3d6d94;

  color: #fff;

  font-size: 14px;

  font-weight: 800;

  text-align: center;

  padding: 6px;
}

body.light .service-member {
  background: #e0f0ff;

  border-color: #8ab6d8;

  color: #17456b;
}

.service-empty {
  grid-column: 1 / -1;

  min-height: 52px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 11px;

  background:
    rgba(0,0,0,.12);

  border:
    1px dashed rgba(255,255,255,.2);

  color: #999;

  font-size: 14px;

  font-weight: 700;
}

body.light .service-empty {
  background: #f3f3f3;

  border-color: #bbb;

  color: #888;
}


/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 78px;

  z-index: 1000;

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 7px;

  align-items: center;

  padding: 8px;

  background:
    rgba(14,14,14,.97);

  border-top:
    1px solid rgba(255,255,255,.12);
}

body.light .bottom-nav {
  background:
    rgba(255,255,255,.97);

  border-top-color:
    rgba(0,0,0,.1);
}

.bottom-nav button {
  height: 42px;

  border: 0;

  border-radius: 22px;

  background: #262626;

  color: #fff;

  font-size: 14px;

  font-weight: 900;

  cursor: pointer;
}

body.light .bottom-nav button {
  background: #e5e5e5;

  color: #222;
}

.bottom-nav button.active {
  background: #19354d;

  color: #5da8ec;
}

body.light .bottom-nav button.active {
  background: #dceeff;

  color: #1768a5;
}


/* =========================================================
   반응형
========================================================= */

@media (max-width: 520px) {

  .back-button {
    left: 12px;
  }

  .settings-button {
    right: 12px;
  }

  .main {
    padding-left: 15px;
    padding-right: 15px;
  }

  .page-title {
    font-size: 28px;
  }

  .slots {
    gap: 7px;
  }

  .slot {
    font-size: 14px;
  }

  .bottom-nav button {
    font-size: 13px;
  }

  .service-members {
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>
</head>


<body>


<!-- =======================================================
     상단
======================================================= -->

<header class="top-bar">

  <button
    class="top-button back-button"
    onclick="goBack()"
    aria-label="뒤로가기">
    ‹
  </button>

  <div class="top-title">
    토요일
  </div>

  <button
    class="top-button settings-button"
    onclick="toggleSettings()"
    aria-label="설정">
    ⚙
  </button>

</header>


<!-- =======================================================
     설정
======================================================= -->

<div
  id="settingsPanel"
  class="settings-panel">

  <div class="settings-title">
    화면 설정
  </div>

  <div class="settings-row">

    <button
      onclick="setTheme('dark')">
      어둡게
    </button>

    <button
      onclick="setTheme('light')">
      밝게
    </button>

  </div>

  <div class="font-label">
    글자 크기
  </div>

  <div class="font-buttons">

    <button
      onclick="setFontSize(80)">
      80%
    </button>

    <button
      onclick="setFontSize(100)">
      100%
    </button>

    <button
      onclick="setFontSize(120)">
      120%
    </button>

    <button
      onclick="setFontSize(150)">
      150%
    </button>

  </div>

</div>


<!-- =======================================================
     본문
======================================================= -->

<main class="main">


  <!-- =====================================================
       화면 1 : 봉사신청
  ====================================================== -->

  <section
    id="viewApply"
    class="view active">

    <h1 class="page-title">
      봉사자 선택
    </h1>

    <div class="page-subtitle">
      봉사할 자매는 자신의 이름을 체크해 주세요
    </div>


    <div class="apply-count-box">

      현재 선택

      <span
        id="applyCount"
        class="apply-count">
        0
      </span>

      명

    </div>


    <div
      id="sisterGrid"
      class="sister-grid">
    </div>


    <button
      class="apply-next"
      onclick="applyNext()">

      다음 →

    </button>

  </section>



  <!-- =====================================================
       화면 2 : 관리자용
  ====================================================== -->

  <section
    id="viewAdmin"
    class="view">

    <h1 class="page-title">
      관리자용
    </h1>

    <div class="page-subtitle">
      신청한 자매를 봉사 그룹에 배정해 주세요
    </div>


    <div class="applicant-count-box">

      현재 신청자

      <span
        id="applicantCount"
        class="applicant-count">
        0
      </span>

      명

    </div>


    <div class="section-header">

      <div class="section-title">
        미배정 자매
      </div>

      <div
        id="unassignedCount"
        class="section-count">
        0명
      </div>

    </div>


    <div
      id="unassignedGrid"
      class="unassigned-grid">
    </div>


    <div
      id="notice"
      class="notice">

      자매 이름을 먼저 선택한 다음<br>
      원하는 그룹의 빈칸을 눌러 배정하세요.

    </div>


    <div class="section-header groups-header">

      <div class="section-title">
        봉사 그룹
      </div>

      <div
        id="groupCount"
        class="section-count">
        0그룹
      </div>

    </div>


    <div id="groups"></div>


    <button
      class="add-group"
      onclick="addGroup()">

      ＋ 봉사 그룹 추가

    </button>

  </section>



  <!-- =====================================================
       화면 3 : 봉사하기
  ====================================================== -->

  <section
    id="viewService"
    class="view">

    <h1 class="page-title">
      봉사하기
    </h1>

    <div class="page-subtitle">
      봉사 그룹 순서대로 봉사 구역이 배정됩니다
    </div>


    <div class="service-intro">

      관리자용에서 만든<br>
      <b>1번 그룹 → 1번 구역</b><br>
      <b>2번 그룹 → 2번 구역</b> 순서로 표시됩니다.

    </div>


    <div id="serviceList"></div>

  </section>


</main>


<!-- =======================================================
     하단 메뉴
======================================================= -->

<nav class="bottom-nav">

  <button
    id="navApply"
    class="active"
    onclick="showView('apply')">

    봉사신청

  </button>


  <button
    id="navAdmin"
    onclick="showView('admin')">

    관리자용

  </button>


  <button
    id="navService"
    onclick="showView('service')">

    봉사하기

  </button>

</nav>


<script>

/* =========================================================
   Apps Script 주소
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxfv41gmvsmjV6-xI7OFvZujsvHWOYkfeqALvPIn1AEeW42gtAQ8prog7J6QG2pr2fV/exec";


/* =========================================================
   자매 목록
========================================================= */

const SISTERS = [

  "강효선",
  "계영혜",
  "권영란",
  "권효정",
  "김가희",
  "김남희",
  "김수영",
  "김정순",
  "김현심",
  "맹희주",
  "민순자",
  "박미화",
  "박수은",
  "박정은",
  "박한별",
  "박현주",
  "손예진",
  "송효자",
  "안순옥",
  "오미경",
  "오미나",
  "오승비",
  "오슬원",
  "이영자",
  "이윤부",
  "이혜자",
  "임창숙"

];


/* =========================================================
   토요일 봉사구역
========================================================= */

const SERVICE_AREAS = [

/* =========================================================
   저장 키
========================================================= */

const GROUP_KEY =
  "saturdayVolunteerGroups";


const APPLY_KEY =
  "saturdayMyApplication";


/* =========================================================
   상태
========================================================= */

let applicants = [];

let groups =
  JSON.parse(
    localStorage.getItem(
      GROUP_KEY
    ) || "[]"
  );

let selectedName = null;


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSettings();


    if (!groups.length) {

      groups = [[]];

      saveGroups();

    }


    renderApply();

    renderAll();

    renderService();


    loadMyApplication();


    loadApplicants();


    setInterval(
      loadApplicants,
      10000
    );

  }
);


/* =========================================================
   화면 전환
========================================================= */

function showView(viewName) {

  document
    .querySelectorAll(".view")
    .forEach(
      function(view) {

        view.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(
      ".bottom-nav button"
    )
    .forEach(
      function(button) {

        button.classList.remove(
          "active"
        );

      }
    );


  if (viewName === "apply") {

    document
      .getElementById(
        "viewApply"
      )
      .classList.add(
        "active"
      );


    document
      .getElementById(
        "navApply"
      )
      .classList.add(
        "active"
      );


    renderApply();

  }


  if (viewName === "admin") {

    document
      .getElementById(
        "viewAdmin"
      )
      .classList.add(
        "active"
      );


    document
      .getElementById(
        "navAdmin"
      )
      .classList.add(
        "active"
      );


    loadApplicants();

  }


  if (viewName === "service") {

    document
      .getElementById(
        "viewService"
      )
      .classList.add(
        "active"
      );


    document
      .getElementById(
        "navService"
      )
      .classList.add(
        "active"
      );


    renderService();

  }


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  const active =
    document.querySelector(
      ".view.active"
    );


  if (
    active &&
    active.id === "viewApply"
  ) {

    history.back();

    return;

  showView("apply");

}


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

  const panel =
    document.getElementById(
      "settingsPanel"
    );

  panel.classList.toggle(
    "show"
  );

}


function setTheme(theme) {

  if (
    theme === "light"
  ) {

    document.body.classList.add(
      "light"
    );

  } else {

    document.body.classList.remove(
      "light"
    );

  }


  localStorage.setItem(
    "saturdayTheme",
    theme
  );

}


function setFontSize(size) {

  document.documentElement.style.fontSize =
    size + "%";


  localStorage.setItem(
    "saturdayFontSize",
    size
  );

}


function loadSettings() {

  const theme =
    localStorage.getItem(
      "saturdayTheme"
    );


  const fontSize =
    localStorage.getItem(
      "saturdayFontSize"
    );


  if (
    theme === "light"
  ) {

    document.body.classList.add(
      "light"
    );

  }


  if (fontSize) {

    document.documentElement.style.fontSize =
      fontSize + "%";

  }

}


/* =========================================================
   봉사신청 화면
========================================================= */

function renderApply() {

  const grid =
    document.getElementById(
      "sisterGrid"
    );


  const count =
    document.getElementById(
      "applyCount"
    );


  if (!grid) {

    return;

  }


  const saved =
    JSON.parse(
      localStorage.getItem(
        APPLY_KEY
      ) || "[]"
    );


  count.textContent =
    saved.length;


  grid.innerHTML = "";


  SISTERS.forEach(
    function(name) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "sister-card";


      const checked =
        saved.includes(name);


      if (checked) {

        card.classList.add(
          "checked"
        );

      }


      const check =
        document.createElement(
          "div"
        );


      check.className =
        "sister-check";


      check.textContent =
        checked
          ? "✓"
          : "";


      card.appendChild(
        check
      );


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        name;


      card.appendChild(
        text
      );


      card.onclick =
        function() {

          toggleMyApplication(
            name
          );

        };


      grid.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   내 신청 상태
========================================================= */

function loadMyApplication() {

  const saved =
    JSON.parse(
      localStorage.getItem(
        APPLY_KEY
      ) || "[]"
    );


  if (
    !Array.isArray(saved)
  ) {

    localStorage.setItem(
      APPLY_KEY,
      "[]"
    );

  }


  renderApply();

}


function toggleMyApplication(
  name
) {

  let saved =
    JSON.parse(
      localStorage.getItem(
        APPLY_KEY
      ) || "[]"
    );


  const index =
    saved.indexOf(name);


  if (index >= 0) {

    saved.splice(
      index,
      1
    );

  } else {

    saved.push(name);

  }


  localStorage.setItem(
    APPLY_KEY,
    JSON.stringify(saved)
  );


  renderApply();


  /* 서버에 변경사항 전달 */

  syncApplication(
    name,
    index < 0
  );

}


async function syncApplication(
  name,
  checked
) {

  try {

    await fetch(
      SCRIPT_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            name:
              name,

            checked:
              checked

          })

      }
    );

  } catch (error) {

    console.error(
      "신청 저장 오류:",
      error
    );

  }

}

   다음

function applyNext() {

/* =========================================================
   신청자 불러오기
========================================================= */

async function loadApplicants() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=applicants&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      console.error(
        data.message
      );

      return;

    }


    applicants =
      (data.applicants || [])
        .filter(
          function(name) {

            return SISTERS.includes(
              name
            );

          }
        );


    cleanGroups();


    renderAll();


    renderService();


  } catch (error) {

    console.error(
      "신청자 불러오기 오류:",
      error
    );

  }

}


/* =========================================================
   배정된 이름
========================================================= */

function getAssignedNames() {

  const assigned = [];


  groups.forEach(
    function(group) {

      group.forEach(
        function(name) {

          if (name) {

            assigned.push(
              name
            );

          }

        }
      );

    }
  );


  return assigned;

}


/* =========================================================
   미배정 이름
========================================================= */

function getUnassignedNames() {

  const assigned =
    getAssignedNames();


  return applicants.filter(
    function(name) {

      return !assigned.includes(
        name
      );

    }
  );

}


/* =========================================================
   관리자 전체
========================================================= */

function renderAll() {

  renderCount();

  renderUnassigned();

  renderGroups();

}


/* =========================================================
   신청자 수
========================================================= */

function renderCount() {

  const element =
    document.getElementById(
      "applicantCount"
    );


  if (!element) {

    return;

  }


  element.textContent =
    applicants.length;

}


/* =========================================================
   미배정 자매
========================================================= */

function renderUnassigned() {

  const grid =
    document.getElementById(
      "unassignedGrid"
    );


  const count =
    document.getElementById(
      "unassignedCount"
    );


  if (!grid || !count) {

    return;

  }


  const names =
    getUnassignedNames();


  count.textContent =
    names.length + "명";


  grid.innerHTML = "";


  if (!names.length) {

    grid.innerHTML =
      '<div class="empty-message" style="grid-column:1/-1;">' +
      (
        applicants.length
          ? "모든 신청자가 배정되었습니다."
          : "아직 신청한 자매가 없습니다."
      ) +
      "</div>";


    return;

  }


  names.forEach(
    function(name) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "person";


      if (
        selectedName === name
      ) {

        div.classList.add(
          "selected"
        );

      }


      div.textContent =
        name;


      div.onclick =
        function() {

          if (
            selectedName === name
          ) {

            selectedName =
              null;

          } else {

            selectedName =
              name;

          }


          renderUnassigned();

        };


      grid.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   그룹 표시
========================================================= */

function renderGroups() {

  const container =
    document.getElementById(
      "groups"
    );


  const groupCount =
    document.getElementById(
      "groupCount"
    );


  if (!container || !groupCount) {

    return;

  }


  container.innerHTML = "";


  groupCount.textContent =
    groups.length + "그룹";


  groups.forEach(
    function(
      group,
      groupIndex
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "group-card";


      const titleRow =
        document.createElement(
          "div"
        );


      titleRow.className =
        "group-title-row";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "group-title";


      title.textContent =
        (groupIndex + 1) +
        "번 그룹";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-group";


      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function() {

          if (
            !confirm(
              (groupIndex + 1) +
              "번 그룹을 삭제하시겠습니까?"
            )
          ) {

            return;

          }


          groups.splice(
            groupIndex,
            1
          );


          if (!groups.length) {

            groups.push([]);

          }


          saveGroups();


          selectedName =
            null;


          renderAll();


          renderService();

        };


      titleRow.appendChild(
        title
      );


      titleRow.appendChild(
        deleteButton
      );


      const slots =
        document.createElement(
          "div"
        );


      slots.className =
        "slots";


      for (
        let slotIndex = 0;
        slotIndex < 4;
        slotIndex++
      ) {

        const slot =
          document.createElement(
            "div"
          );


        slot.className =
          "slot";


        const name =
          group[slotIndex];


        if (name) {

          slot.classList.add(
            "filled"
          );


          slot.textContent =
            name;

        } else {

          slot.textContent =
            "빈칸";

        }


        slot.onclick =
          function() {

            handleSlotClick(
              groupIndex,
              slotIndex
            );

          };


        slots.appendChild(
          slot
        );

      }


      card.appendChild(
        titleRow
      );


      card.appendChild(
        slots
      );


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   슬롯 클릭
========================================================= */

function handleSlotClick(
  groupIndex,
  slotIndex
) {

  const group =
    groups[groupIndex];


  const currentName =
    group[slotIndex];


  /* 이미 배정된 이름 제거 */

  if (currentName) {

    group.splice(
      slotIndex,
      1
    );


    while (
      group.length < 4
    ) {

      group.push("");

    }


    saveGroups();


    selectedName =
      null;


    renderAll();


    renderService();


    return;

  }


  /* 선택된 이름 없음 */

  if (!selectedName) {

    alert(
      "먼저 미배정 자매의 이름을 선택해 주세요."
    );

    return;

  }


  /* 중복 확인 */

  if (
    getAssignedNames()
      .includes(
        selectedName
      )
  ) {

    alert(
      "이미 다른 그룹에 배정된 자매입니다."
    );


    selectedName =
      null;


    renderAll();


    return;

  }


  group[slotIndex] =
    selectedName;


  while (
    group.length < 4
  ) {

    group.push("");

  }


  saveGroups();


  selectedName =
    null;


  renderAll();


  renderService();

}


/* =========================================================
   그룹 추가
========================================================= */

function addGroup() {

  groups.push([]);


  saveGroups();


  selectedName =
    null;


  renderAll();


  renderService();

}


/* =========================================================
   그룹 저장
========================================================= */

function saveGroups() {

  localStorage.setItem(
    GROUP_KEY,
    JSON.stringify(
      groups
    )
  );

}


/* =========================================================
   신청 취소된 사람 제거
========================================================= */

function cleanGroups() {

  let changed =
    false;


  groups.forEach(
    function(group) {

      for (
        let i = 0;
        i < group.length;
        i++
      ) {

        const name =
          group[i];


        if (
          name &&
          !applicants.includes(
            name
          )
        ) {

          group[i] =
            "";

          changed =
            true;

        }

      }

    }
  );


  if (changed) {

    groups =
      groups.map(
        function(group) {

          const result =
            group.slice(
              0,
              4
            );


          while (
            result.length < 4
          ) {

            result.push("");

          }


          return result;

        }
      );


    saveGroups();

  }

}


/* =========================================================
   봉사하기 화면
========================================================= */

function renderService() {

  const container =
    document.getElementById(
      "serviceList"
    );


  if (!container) {

    return;

  }


  container.innerHTML = "";


  SERVICE_AREAS.forEach(
    function(area, index) {

      const group =
        groups[index] || [];


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "service-card";


      const number =
        document.createElement(
          "div"
        );


      number.className =
        "service-number";


      number.textContent =
        (index + 1) +
        "번 구역 · " +
        area.number;


      const place =
        document.createElement(
          "div"
        );


      place.className =
        "service-place";


      place.textContent =
        area.place;


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "service-meta";


      meta.textContent =
        area.distance +
        " · " +
        area.type;


      const members =
        document.createElement(
          "div"
        );


      members.className =
        "service-members";


      const validMembers =
        group.filter(
          function(name) {

            return !!name;

          }
        );


      if (
        validMembers.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "service-empty";


        empty.textContent =
          "아직 배정된 봉사자가 없습니다.";


        members.appendChild(
          empty
        );

      } else {

        validMembers.forEach(
          function(name) {

            const member =
              document.createElement(
                "div"
              );


            member.className =
              "service-member";


            member.textContent =
              name;


            members.appendChild(
              member
            );

          }
        );

      }


      card.appendChild(
        number
      );


      card.appendChild(
        place
      );


      card.appendChild(
        meta
      );


      card.appendChild(
        members
      );


      container.appendChild(
        card
      );

    }
  );

}
