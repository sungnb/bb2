<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>봉사자 선택</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

body {
  background:
    radial-gradient(
      circle at top,
      #303030 0%,
      #1d1d1d 42%,
      #0d0d0d 100%
    );

  color: #f5f5f5;

  padding-top: 62px;
  padding-bottom: 82px;

  transition:
    background .25s,
    color .25s;
}

body.light {
  background:
    radial-gradient(
      circle at top,
      #ffffff 0%,
      #f1f1f1 55%,
      #e5e5e5 100%
    );

  color: #222;
}


/* =========================================================
   상단
========================================================= */

.top-bar {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: 62px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(20,20,20,.96);

  border-bottom:
    1px solid rgba(255,255,255,.12);
}

body.light .top-bar {
  background: rgba(255,255,255,.96);

  border-bottom:
    1px solid rgba(0,0,0,.12);
}

.top-title {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1px;
}

.top-button {
  position: absolute;

  top: 5px;

  width: 47px;
  height: 47px;

  border: 0;
  border-radius: 13px;

  background: #292929;
  color: #fff;

  font-size: 28px;
  font-weight: 900;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

body.light .top-button {
  background: #e8e8e8;
  color: #222;
}

.back-button {
  left: 26px;
}

.settings-button {
  right: 26px;

  font-size: 25px;
}


/* =========================================================
   설정
========================================================= */

.settings-panel {
  display: none;

  position: fixed;

  top: 62px;
  right: 15px;

  width: 260px;

  padding: 18px;

  z-index: 1100;

  border-radius: 16px;

  background: rgba(35,35,35,.98);

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 12px 35px rgba(0,0,0,.4);
}

body.light .settings-panel {
  background: #fff;

  border-color:
    rgba(0,0,0,.12);

  box-shadow:
    0 12px 35px rgba(0,0,0,.18);
}

.settings-panel.show {
  display: block;
}

.settings-title {
  font-size: 17px;
  font-weight: 900;

  margin-bottom: 13px;
}

.settings-row {
  display: flex;

  gap: 8px;

  margin-bottom: 14px;
}

.settings-row button {
  flex: 1;

  min-height: 40px;

  border: 0;
  border-radius: 10px;

  background: #444;
  color: #fff;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
}

body.light .settings-row button {
  background: #e5e5e5;
  color: #222;
}

.font-label {
  font-size: 14px;
  font-weight: 800;

  margin-bottom: 8px;
}

.font-buttons {
  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 6px;
}

.font-buttons button {
  min-height: 36px;

  border: 0;
  border-radius: 8px;

  background: #444;
  color: #fff;

  font-size: 13px;
  font-weight: 800;
}

body.light .font-buttons button {
  background: #e5e5e5;
  color: #222;
}


/* =========================================================
   화면 공통
========================================================= */

.view {
  display: none;
}

.view.active {
  display: block;
}

.main {
  width: 100%;

  max-width: 900px;

  margin: 0 auto;

  padding:
    42px 12px 30px;
}


/* =========================================================
   봉사자 선택
========================================================= */

.apply-title {
  text-align: center;

  font-size: 29px;
  font-weight: 900;

  margin:
    0 0 20px;
}

.selected-box {
  min-height: 60px;

  border-radius: 15px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.12);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 17px;
  font-weight: 800;

  margin-bottom: 18px;
}

body.light .selected-box {
  background:
    rgba(0,0,0,.05);

  border-color:
    rgba(0,0,0,.12);
}

.selected-number {
  font-size: 26px;
  font-weight: 900;

  margin: 0 5px;
}


/* =========================================================
   이름 목록
========================================================= */

.name-grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 7px;
}

.name-card {
  position: relative;

  min-height: 48px;

  padding:
    7px 25px 7px 7px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.13);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  user-select: none;

  transition:
    background .15s,
    border-color .15s;
}

body.light .name-card {
  background: #fff;

  border-color:
    #d5d5d5;

  color: #222;
}

.name-card.selected {
  background: #21384d;

  border-color:
    #3e80b8;

  color: #fff;
}

body.light .name-card.selected {
  background: #dceeff;

  border-color:
    #6ba8d8;

  color: #17456b;
}


/* =========================================================
   체크 표시
========================================================= */

.check-circle {
  position: absolute;

  right: 6px;

  width: 18px;
  height: 18px;

  border-radius: 50%;

  border:
    1px solid #999;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 11px;

  color: transparent;
}

.name-card.selected .check-circle {
  background: #3e80b8;

  border-color:
    #3e80b8;

  color: #fff;
}

body.light .name-card.selected .check-circle {
  background: #1768a5;

  border-color:
    #1768a5;

  color: #fff;
}

.loading-message,
.empty-message {
  grid-column: 1 / -1;

  text-align: center;

  padding: 30px 10px;

  color: #aaa;

  font-size: 16px;
  font-weight: 700;
}

body.light .loading-message,
body.light .empty-message {
  color: #777;
}


/* =========================================================
   관리자
========================================================= */

.page-title {
  text-align: center;

  font-size: 29px;
  font-weight: 900;

  margin: 0;
}

.applicant-count-box {
  margin-top: 24px;

  min-height: 76px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.12);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 18px;
  font-weight: 800;
}

body.light .applicant-count-box {
  background:
    rgba(0,0,0,.05);

  border-color:
    rgba(0,0,0,.1);
}

.applicant-count {
  font-size: 29px;
  font-weight: 900;

  margin: 0 5px;
}

.section-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-top: 27px;

  margin-bottom: 13px;
}

.section-title {
  font-size: 21px;
  font-weight: 900;
}

.section-count {
  font-size: 14px;
  font-weight: 800;

  color: #aaa;
}

body.light .section-count {
  color: #666;
}

.unassigned-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;
}

.person {
  min-height: 51px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 7px;

  border-radius: 11px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.13);

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  user-select: none;
}

body.light .person {
  background: #fff;

  border-color:
    #d5d5d5;

  color: #222;
}

.person.selected {
  background: #21384d;

  border-color:
    #3e80b8;

  color: #fff;
}

body.light .person.selected {
  background: #dceeff;

  border-color:
    #6ba8d8;

  color: #17456b;
}

.notice {
  margin-top: 18px;

  padding: 14px;

  border-radius: 14px;

  background:
    rgba(34,54,72,.65);

  border:
    1px solid #315875;

  text-align: center;

  font-size: 14px;
  font-weight: 700;

  line-height: 1.7;
}

.groups-header {
  margin-top: 27px;
}

.group-card {
  margin-bottom: 17px;

  padding: 15px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid rgba(255,255,255,.12);
}

body.light .group-card {
  background:
    rgba(255,255,255,.8);

  border-color:
    rgba(0,0,0,.1);
}

.group-title-row {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 11px;
}

.group-title {
  font-size: 20px;
  font-weight: 900;
}

.delete-group {
  border: 0;

  border-radius: 10px;

  padding: 8px 12px;

  background: #444;

  color: #fff;

  font-size: 13px;
  font-weight: 800;
}

body.light .delete-group {
  background: #ddd;

  color: #222;
}

.slots {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 9px;
}

.slot {
  min-height: 67px;

  border-radius: 13px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 8px;

  background:
    rgba(0,0,0,.15);

  border:
    1px dashed rgba(255,255,255,.18);

  color: #aaa;

  font-size: 15px;
  font-weight: 800;

  text-align: center;

  cursor: pointer;
}

body.light .slot {
  background: #f3f3f3;

  border-color: #bbb;

  color: #888;
}

.slot.filled {
  background: #263c50;

  border:
    1px solid #3d6d94;

  color: #fff;
}

body.light .slot.filled {
  background: #e0f0ff;

  border-color:
    #8ab6d8;

  color: #17456b;
}

.add-group {
  width: 100%;

  min-height: 55px;

  border:
    1px solid #3471a6;

  border-radius: 14px;

  background: #1e3040;

  color: #fff;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}

body.light .add-group {
  background: #e7f3ff;

  color: #17456b;
}


/* =========================================================
   봉사하기
========================================================= */

.service-area {
  margin-bottom: 14px;

  padding: 16px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid rgba(255,255,255,.12);
}

body.light .service-area {
  background: rgba(255,255,255,.8);

  border-color:
    rgba(0,0,0,.1);
}

.service-number {
  font-size: 18px;
  font-weight: 900;

  margin-bottom: 5px;
}

.service-name {
  font-size: 20px;
  font-weight: 900;

  margin-bottom: 10px;
}

.service-info {
  font-size: 14px;

  color: #aaa;

  font-weight: 700;
}

body.light .service-info {
  color: #666;
}

.service-members {
  margin-top: 12px;

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 7px;
}

.service-member {
  min-height: 43px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 9px;

  background:
    #263c50;

  color: #fff;

  font-size: 13px;
  font-weight: 800;

  text-align: center;
}

body.light .service-member {
  background: #e0f0ff;

  color: #17456b;
}


/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 78px;

  z-index: 1000;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 7px;

  align-items: center;

  padding: 8px;

  background:
    rgba(14,14,14,.97);

  border-top:
    1px solid rgba(255,255,255,.12);
}

body.light .bottom-nav {
  background:
    rgba(255,255,255,.97);

  border-top-color:
    rgba(0,0,0,.1);
}

.bottom-nav button {
  height: 42px;

  border: 0;

  border-radius: 22px;

  background: #262626;

  color: #fff;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;
}

body.light .bottom-nav button {
  background: #e5e5e5;

  color: #222;
}

.bottom-nav button.active {
  background: #19354d;

  color: #5da8ec;
}

body.light .bottom-nav button.active {
  background: #dceeff;

  color: #1768a5;
}


/* =========================================================
   반응형
========================================================= */

@media (max-width: 520px) {

  .back-button {
    left: 12px;
  }

  .settings-button {
    right: 12px;
  }

  .main {
    padding-left: 12px;
    padding-right: 12px;
  }

  .apply-title,
  .page-title {
    font-size: 28px;
  }

  .name-grid {
    grid-template-columns:
      repeat(4, 1fr);

    gap: 6px;
  }

  .name-card {
    min-height: 45px;

    font-size: 13px;

    padding-left: 4px;
    padding-right: 21px;
  }

  .check-circle {
    right: 4px;
  }

  .slots {
    gap: 7px;
  }

  .slot {
    font-size: 14px;
  }

  .bottom-nav button {
    font-size: 13px;
  }

}


/* =========================================================
   아주 작은 화면
========================================================= */

@media (max-width: 360px) {

  .name-card {
    font-size: 12px;
  }

  .name-grid {
    gap: 5px;
  }

}

</style>
</head>


<body>


<!-- =======================================================
     상단
======================================================= -->

<header class="top-bar">

  <button
    class="top-button back-button"
    onclick="history.back()"
    aria-label="뒤로가기">
    ‹
  </button>

  <div
    id="topTitle"
    class="top-title">
    봉사자 선택
  </div>

  <button
    class="top-button settings-button"
    onclick="toggleSettings()"
    aria-label="설정">
    ⚙
  </button>

</header>


<!-- =======================================================
     설정
======================================================= -->

<div
  id="settingsPanel"
  class="settings-panel">

  <div class="settings-title">
    화면 설정
  </div>

  <div class="settings-row">

    <button onclick="setTheme('dark')">
      어둡게
    </button>

    <button onclick="setTheme('light')">
      밝게
    </button>

  </div>

  <div class="font-label">
    글자 크기
  </div>

  <div class="font-buttons">

    <button onclick="setFontSize(80)">
      80%
    </button>

    <button onclick="setFontSize(100)">
      100%
    </button>

    <button onclick="setFontSize(120)">
      120%
    </button>

    <button onclick="setFontSize(150)">
      150%
    </button>

  </div>

</div>


<!-- =======================================================
     1. 봉사자 선택
======================================================= -->

<section
  id="viewApply"
  class="view active">

  <main class="main">

    <h1 class="apply-title">
      봉사자 선택
    </h1>


    <div class="selected-box">

      현재 선택

      <span
        id="selectedCount"
        class="selected-number">
        0
      </span>

      명

    </div>


    <div
      id="nameGrid"
      class="name-grid">

      <div class="loading-message">
        이름을 불러오는 중입니다.
      </div>

    </div>

  </main>

</section>


<!-- =======================================================
     2. 관리자
======================================================= -->

<section
  id="viewAdmin"
  class="view">

  <main class="main">

    <h1 class="page-title">
      관리자용
    </h1>


    <div class="applicant-count-box">

      현재 신청자

      <span
        id="applicantCount"
        class="applicant-count">
        0
      </span>

      명

    </div>


    <div class="section-header">

      <div class="section-title">
        미배정 봉사자
      </div>

      <div
        id="unassignedCount"
        class="section-count">
        0명
      </div>

    </div>


    <div
      id="unassignedGrid"
      class="unassigned-grid">
    </div>


    <div
      id="notice"
      class="notice">

      봉사자 이름을 먼저 선택한 다음<br>
      원하는 그룹의 빈칸을 눌러 배정하세요.

    </div>


    <div class="section-header groups-header">

      <div class="section-title">
        봉사 그룹
      </div>

      <div
        id="groupCount"
        class="section-count">
        0그룹
      </div>

    </div>


    <div id="groups"></div>


    <button
      class="add-group"
      onclick="addGroup()">

      ＋ 봉사 그룹 추가

    </button>

  </main>

</section>


<!-- =======================================================
     3. 봉사하기
======================================================= -->

<section
  id="viewService"
  class="view">

  <main class="main">

    <h1 class="page-title">
      봉사하기
    </h1>


    <div
      id="serviceAreas">
    </div>

  </main>

</section>


<!-- =======================================================
     하단 메뉴
======================================================= -->

<nav class="bottom-nav">

  <button
    id="navApply"
    class="active"
    onclick="showView('apply')">

    봉사신청

  </button>


  <button
    id="navAdmin"
    onclick="showView('admin')">

    관리자용

  </button>


  <button
    id="navService"
    onclick="showView('service')">

    봉사하기

  </button>

</nav>


<script>

/* =========================================================
   Apps Script 주소
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxfv41gmvsmjV6-xI7OFvZujsvHWOYkfeqALvPIn1AEeW42gtAQ8prog7J6QG2pr2fV/exec";


/* =========================================================
   개인 선택 저장
========================================================= */

const MY_SELECTION_KEY =
  "saturdayMySelections";


/* =========================================================
   관리자 그룹 저장
========================================================= */

const GROUP_KEY =
  "saturdayVolunteerGroups";


/* =========================================================
   봉사 구역
========================================================= */

const SERVICE_AREAS = [

  {
    number: "439",
    name: "그린 빌",
    ho: "138",
    member: "Lw"
  },

  {
    number: "304",
    name: "에코 빌",
    ho: "189",
    member: "Ok"
  },

  {
    number: "306",
    name: "국토정보공사",
    ho: "191",
    member: "Ok"
  },

  {
    number: "308",

    ho: "153",

  },

  {
    number: "309",
    name: "신일 빌딩",
    ho: "186",
    member: "Lw"
  },

  {
    number: "440",
    name: "성미료",
    ho: "197",
    member: "Ok"
  },

  {
    number: "302",
    name: "금정 빌딩",
    ho: "155",

  },

  {
    number: "311",
    name: "오목 사우나",
    ho: "161",

  },

  {
    number: "312",

    ho: "128",

  },

  {
    number: "315",
    name: "반석 빌딩",
    ho: "089",
    member: "Ca"
  }

];


/* =========================================================
   변수
========================================================= */

let allNames = [];

let mySelections =
  JSON.parse(
    localStorage.getItem(
      MY_SELECTION_KEY
    ) || "[]"
  );

let applicants = [];

let groups =
  JSON.parse(
    localStorage.getItem(
      GROUP_KEY
    ) || "[]"
  );

let selectedName = null;


/* =========================================================
   초기화
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSettings();

    if (!groups.length) {

      groups = [[]];

      saveGroups();

    }

    renderService();

    loadNames();

    loadApplicants();

    setInterval(
      loadApplicants,
      10000
    );

  }
);


/* =========================================================
   화면 전환
========================================================= */

function showView(view) {

  document
    .querySelectorAll(".view")
    .forEach(
      element => {

        element.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(".bottom-nav button")
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );


  if (view === "apply") {

    document
      .getElementById("viewApply")
      .classList.add("active");

    document
      .getElementById("navApply")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent =
      "봉사자 선택";

  }


  if (view === "admin") {

    document
      .getElementById("viewAdmin")
      .classList.add("active");

    document
      .getElementById("navAdmin")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent =
      "관리자용";

    loadApplicants();

  }


  if (view === "service") {

    document
      .getElementById("viewService")
      .classList.add("active");

    document
      .getElementById("navService")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent =
      "봉사하기";

    renderService();

  }


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

  const panel =
    document.getElementById(
      "settingsPanel"
    );

  panel.classList.toggle(
    "show"
  );

}


function setTheme(theme) {

  if (theme === "light") {

    document.body.classList.add(
      "light"
    );

  } else {

    document.body.classList.remove(
      "light"
    );

  }

  localStorage.setItem(
    "saturdayTheme",
    theme
  );

}


function setFontSize(size) {

  document.documentElement.style.fontSize =
    size + "%";

  localStorage.setItem(
    "saturdayFontSize",
    size
  );

}


function loadSettings() {

  const theme =
    localStorage.getItem(
      "saturdayTheme"
    );

  const fontSize =
    localStorage.getItem(
      "saturdayFontSize"
    );


  if (theme === "light") {

    document.body.classList.add(
      "light"
    );

  }


  if (fontSize) {

    document.documentElement.style.fontSize =
      fontSize + "%";

  }

}


/* =========================================================
   G열 이름 가져오기
========================================================= */

async function loadNames() {

  const grid =
    document.getElementById(
      "nameGrid"
    );


  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=names&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "이름을 가져오지 못했습니다."
      );

    }


    allNames =
      Array.from(
        new Set(
          (data.names || [])
            .map(
              name =>
                String(name || "").trim()
            )
            .filter(
              name =>
                name.length > 0
            )
        )
      );


    renderNames();


  } catch (error) {

    console.error(
      "G열 이름 불러오기 오류:",
      error
    );


    grid.innerHTML =
      '<div class="empty-message">' +
      '이름 목록을 불러오지 못했습니다.' +
      '</div>';

  }

}


/* =========================================================
   이름 표시
========================================================= */

function renderNames() {

  const grid =
    document.getElementById(
      "nameGrid"
    );


  grid.innerHTML = "";


  if (!allNames.length) {

    grid.innerHTML =
      '<div class="empty-message">' +
      'G열에 이름이 없습니다.' +
      '</div>';

    return;

  }


  allNames.forEach(
    name => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "name-card";


      if (
        mySelections.includes(name)
      ) {

        card.classList.add(
          "selected"
        );

      }


      card.innerHTML =
        "<span>" +
        escapeHtml(name) +
        "</span>" +
        '<span class="check-circle">✓</span>';


      card.onclick =
        function() {

          toggleMySelection(
            name
          );

        };


      grid.appendChild(
        card
      );

    }
  );


  renderSelectedCount();

}


/* =========================================================
   개인 선택
========================================================= */

function toggleMySelection(name) {

  const index =
    mySelections.indexOf(
      name
    );


  if (index >= 0) {

    mySelections.splice(
      index,
      1
    );

    sendApplication(
      name,
      false
    );

  } else {

    mySelections.push(
      name
    );

    sendApplication(
      name,
      true
    );

  }


  localStorage.setItem(
    MY_SELECTION_KEY,
    JSON.stringify(
      mySelections
    )
  );


  renderNames();

}


/* =========================================================
   선택 숫자
========================================================= */

function renderSelectedCount() {

  document.getElementById(
    "selectedCount"
  ).textContent =
    mySelections.length;

}


/* =========================================================
   신청 서버 전송
========================================================= */

async function sendApplication(
  name,
  checked
) {

  try {

    await fetch(
      SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({
            name: name,
            checked: checked
          })
      }
    );

  } catch (error) {

    console.error(
      "신청 저장 오류:",
      error
    );

  }

}


/* =========================================================
   관리자 신청자 불러오기
========================================================= */

async function loadApplicants() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=applicants&t=" +
        Date.now()
      );


    const data =
      await response.json();


    if (!data.success) {

      console.error(
        data.message
      );

      return;

    }


    applicants =
      (data.applicants || [])
        .map(
          name =>
            String(name || "").trim()
        )
        .filter(
          name =>
            name.length > 0
        );


    cleanGroups();

    renderAll();

  } catch (error) {

    console.error(
      "신청자 불러오기 오류:",
      error
    );

  }

}


/* =========================================================
   관리자 화면
========================================================= */

function renderAll() {

  renderCount();

  renderUnassigned();

  renderGroups();

}


/* =========================================================
   신청자 수
========================================================= */

function renderCount() {

  document.getElementById(
    "applicantCount"
  ).textContent =
    applicants.length;

}


/* =========================================================
   배정된 이름
========================================================= */

function getAssignedNames() {

  const assigned = [];


  groups.forEach(
    group => {

      group.forEach(
        name => {

          if (name) {

            assigned.push(
              name
            );

          }

        }
      );

    }
  );


  return assigned;

}


/* =========================================================
   미배정 이름
========================================================= */

function getUnassignedNames() {

  const assigned =
    getAssignedNames();


  return applicants.filter(
    name =>
      !assigned.includes(name)
  );

}


/* =========================================================
   미배정 표시
========================================================= */

function renderUnassigned() {

  const grid =
    document.getElementById(
      "unassignedGrid"
    );

  const count =
    document.getElementById(
      "unassignedCount"
    );


  const names =
    getUnassignedNames();


  count.textContent =
    names.length + "명";


  grid.innerHTML = "";


  if (!names.length) {

    grid.innerHTML =
      '<div class="empty-message" style="grid-column:1/-1;">' +
      (
        applicants.length
          ? "모든 신청자가 배정되었습니다."
          : "아직 신청한 봉사자가 없습니다."
      ) +
      "</div>";

    return;

  }


  names.forEach(
    name => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "person";


      if (
        selectedName === name
      ) {

        div.classList.add(
          "selected"
        );

      }


      div.textContent =
        name;


      div.onclick =
        function() {

          if (
            selectedName === name
          ) {

            selectedName =
              null;

          } else {

            selectedName =
              name;

          }


          renderUnassigned();

        };


      grid.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   그룹 표시
========================================================= */

function renderGroups() {

  const container =
    document.getElementById(
      "groups"
    );


  const groupCount =
    document.getElementById(
      "groupCount"
    );


  container.innerHTML = "";


  groupCount.textContent =
    groups.length + "그룹";


  groups.forEach(
    (group, groupIndex) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "group-card";


      const titleRow =
        document.createElement(
          "div"
        );


      titleRow.className =
        "group-title-row";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "group-title";


      title.textContent =
        (groupIndex + 1) +
        "번 그룹";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-group";


      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function() {

          if (
            !confirm(
              (groupIndex + 1) +
              "번 그룹을 삭제하시겠습니까?"
            )
          ) {

            return;

          }


          groups.splice(
            groupIndex,
            1
          );


          if (!groups.length) {

            groups.push([]);

          }


          saveGroups();

          selectedName = null;

          renderAll();

          renderService();

        };


      titleRow.appendChild(
        title
      );

      titleRow.appendChild(
        deleteButton
      );


      const slots =
        document.createElement(
          "div"
        );


      slots.className =
        "slots";


      for (
        let slotIndex = 0;
        slotIndex < 4;
        slotIndex++
      ) {

        const slot =
          document.createElement(
            "div"
          );


        slot.className =
          "slot";


        const name =
          group[slotIndex];


        if (name) {

          slot.classList.add(
            "filled"
          );

          slot.textContent =
            name;

        } else {

          slot.textContent =
            "빈칸";

        }


        slot.onclick =
          function() {

            handleSlotClick(
              groupIndex,
              slotIndex
            );

          };


        slots.appendChild(
          slot
        );

      }


      card.appendChild(
        titleRow
      );

      card.appendChild(
        slots
      );


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   슬롯 클릭
========================================================= */

function handleSlotClick(
  groupIndex,
  slotIndex
) {

  const group =
    groups[groupIndex];


  const currentName =
    group[slotIndex];


  if (currentName) {

    group.splice(
      slotIndex,
      1
    );


    while (
      group.length < 4
    ) {

      group.push("");

    }


    saveGroups();

    selectedName = null;

    renderAll();

    renderService();

    return;

  }


  if (!selectedName) {

    alert(
      "먼저 미배정 봉사자의 이름을 선택해 주세요."
    );

    return;

  }


  if (
    getAssignedNames()
      .includes(
        selectedName
      )
  ) {

    alert(
      "이미 다른 그룹에 배정된 봉사자입니다."
    );

    selectedName = null;

    renderAll();

    return;

  }


  group[slotIndex] =
    selectedName;


  while (
    group.length < 4
  ) {

    group.push("");

  }


  saveGroups();

  selectedName = null;

  renderAll();

  renderService();

}


/* =========================================================
   그룹 추가
========================================================= */

function addGroup() {

  groups.push([]);

  saveGroups();

  selectedName = null;

  renderAll();

  renderService();

}


/* =========================================================
   그룹 저장
========================================================= */

function saveGroups() {

  localStorage.setItem(
    GROUP_KEY,
    JSON.stringify(
      groups
    )
  );

}


/* =========================================================
   신청 취소자 제거
========================================================= */

function cleanGroups() {

  let changed = false;


  groups.forEach(
    group => {

      for (
        let i = 0;
        i < group.length;
        i++
      ) {

        const name =
          group[i];


        if (
          name &&
          !applicants.includes(name)
        ) {

          group[i] = "";

          changed = true;

        }

      }

    }
  );


  if (changed) {

    groups =
      groups.map(
        group => {

          const result =
            group.slice(
              0,
              4
            );


          while (
            result.length < 4
          ) {

            result.push("");

          }


          return result;

        }
      );


    saveGroups();

  }

}


/* =========================================================
   봉사하기 화면
========================================================= */

function renderService() {

  const container =
    document.getElementById(
      "serviceAreas"
    );


  if (!container) {
    return;
  }


  container.innerHTML = "";


  SERVICE_AREAS.forEach(
    (area, index) => {

      const group =
        groups[index] || [];


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "service-area";


      let membersHTML = "";


      for (
        let i = 0;
        i < 4;
        i++
      ) {

        const name =
          group[i] || "미배정";


        membersHTML +=
          '<div class="service-member">' +
          escapeHtml(name) +
          '</div>';

      }


      card.innerHTML =

        '<div class="service-number">' +
        (index + 1) +
        '번 구역</div>' +

        '<div class="service-name">' +
        escapeHtml(area.number) +
        ' · ' +
        escapeHtml(area.name) +
        '</div>' +

        '<div class="service-info">' +
        '호 ' +
        escapeHtml(area.ho) +
        ' · ' +
        escapeHtml(area.member) +
        '</div>' +

        '<div class="service-members">' +
        membersHTML +
        '</div>';


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   HTML 문자 처리
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
