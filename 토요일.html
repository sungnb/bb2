<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>토요일</title>

<style>
/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 100%;
  --font-scale: 1;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background:
    radial-gradient(circle at top, #252525 0%, #111 55%, #080808 100%);
  color: #f5f5f5;
  min-height: 100vh;
  transition: background .25s, color .25s;
}

body.light {
  background: #f5f5f5;
  color: #222;
}

/* =========================================================
   상단
========================================================= */

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #18324a;
  border-bottom: 1px solid rgba(255,255,255,.10);
}

.top-title {
  color: #fff;
  font-size: 35px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.top-button {
  position: absolute;
  top: 10px;
  width: 42px;
  height: 42px;
  border-radius: 12px;

  border: 0;
  background: #234563;
  color: #fff;

  font-size: 25px;
  line-height: 20px;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.top-left {
  left: 8px;
}

.top-right {
  right: 8px;
}

/* =========================================================
   본문
========================================================= */

.main {
  padding-top: 80px;
  padding-bottom: 80px;
  min-height: 100vh;
}

.view {
  display: none;
  padding: 0 14px 30px;
}

.view.active {
  display: block;
}

.page-title {
  margin: 0 0 15px;
  text-align: center;
  font-size: calc(25px * var(--font-scale));
  font-weight: 800;
  letter-spacing: -1px;
}

/* =========================================================
   선택 인원
========================================================= */

.count-box {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 18px;

  padding: 13px 15px;

  border-radius: 12px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.10);

  text-align: center;
  font-size: calc(17px * var(--font-scale));
  font-weight: 700;
}

body.light .count-box {
  background: #fff;
  border-color: #ddd;
}

/* =========================================================
   봉사자 선택 - 4열
========================================================= */

.name-grid {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;

  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.name-card {
  min-height: 58px;

  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07);

  color: inherit;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;

  padding: 7px 4px;

  font-size: calc(17px * var(--font-scale));
  font-weight: 600;

  transition:
    background .15s,
    border-color .15s,
    transform .1s;
}

.name-card:active {
  transform: scale(.97);
}

.name-card.selected {
  background: rgba(111,168,216,.16);
  border: 3px solid #6FA8D8;
}

body.light .name-card {
  background: #fff;
  border: 1px solid #ddd;
}

body.light .name-card.selected {
  background: #eef5fb;
  border: 3px solid #3F6F9F;
}

.check-mark {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;

  border-radius: 50%;
  border: 2px solid #777;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: calc(11px * var(--font-scale));
  font-weight: 900;
}

.name-card.selected .check-mark {
  border-color: #6FA8D8;
  background: #6FA8D8;
  color: #fff;
}

body.light .name-card.selected .check-mark {
  border-color: #3F6F9F;
  background: #3F6F9F;
}

.name-loading {
  grid-column: 1 / -1;

  padding: 35px 10px;
  text-align: center;

  color: #aaa;
  font-size: calc(15px * var(--font-scale));
}

body.light .name-loading {
  color: #777;
}

/* =========================================================
   관리자
========================================================= */

.admin-section {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.admin-count {
  text-align: center;
  margin-bottom: 15px;
  font-size: calc(16px * var(--font-scale));
  font-weight: 700;
}

.admin-names {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}

.admin-name {
  height: 40px;
  padding: 0 13px;

  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.15);

  background: rgba(255,255,255,.08);
  color: inherit;

  cursor: pointer;
  font-size: calc(18px * var(--font-scale));
  font-weight: 600;
}

.admin-name.selected {
  background: rgba(111,168,216,.16);
  color: inherit;
  border: 3px solid #6FA8D8;
}

.admin-add-button {
  padding: 10px 13px;
  border-radius: 9px;
  border: 1px dashed #4285f4;
  background: transparent;
  color: #4285f4;
  cursor: pointer;
  font-size: calc(15px * var(--font-scale));
  font-weight: 700;
}

body.light .admin-add-button {
  background: #fff;
}

body.light .admin-name {
  background: #fff;
  border: 1px solid #ddd;
}

body.light .admin-name.selected {
  background: #eef5fb;
  color: inherit;
  border: 3px solid #3F6F9F;
}

.group-controls {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.add-group-button {
  border: 0;
  border-radius: 10px;

  padding: 12px 20px;

  background: #4285f4;
  color: #fff;

  font-size: calc(15px * var(--font-scale));
  font-weight: 700;

  cursor: pointer;
}

.groups {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.group-card {
  padding: 15px 14px;

  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07);
}

body.light .group-card {
  background: #fff;
  border-color: #ddd;
}

.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 10px;
}

.group-title {
  font-size: calc(17px * var(--font-scale));
  font-weight: 800;
  line-height: calc(20px * var(--font-scale));
}

.delete-group {
  border: 0;
  background: transparent;
  color: #ff7777;

  font-size: calc(18px * var(--font-scale));
  cursor: pointer;
}

.group-slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.group-slot {
  height: 40px;
  min-height: 40px;

  border-radius: 9px;
  border: 1px dashed #777;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  padding: 6px 4px;

  font-size: calc(18px * var(--font-scale));
  font-weight: 600;

  cursor: pointer;
}

.group-slot.filled {
  border: 3px solid #6FA8D8;
  background: rgba(111,168,216,.16);
}

body.light .group-slot.filled {
  border: 3px solid #3F6F9F;
  background: #eef5fb;
}

.group-slot.empty {
  color: #888;
}

/* =========================================================
   봉사하기
========================================================= */

.service-section {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.service-info {
  margin-bottom: 18px;
  text-align: center;
  font-size: calc(15px * var(--font-scale));
  color: #aaa;
}

body.light .service-info {
  color: #777;
}

.service-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.service-card {
  padding: 16px;

  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07);
}

body.light .service-card {
  background: #fff;
  border-color: #ddd;
}

.service-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}

.service-number {
  min-width: 43px;
  height: 50px;

  padding: 0 10px;

  border-radius: 10px;
  background: #3374A9;
  color: #fff;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  font-size: calc(20px * var(--font-scale));
  font-weight: 800;
}

.service-name {
  font-size: calc(18px * var(--font-scale));
  font-weight: 800;
}

.service-detail {
  margin-bottom: 12px;

  font-size: calc(14px * var(--font-scale));
  color: #aaa;
}

body.light .service-detail {
  color: #777;
}

.service-volunteers {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.service-person {
  height: 40px;
  min-height: 40px;

  border-radius: 10px;
  border: 3px solid #6FA8D8;
  background: rgba(111,168,216,.16);

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  padding: 0 3px;

  font-size: calc(18px * var(--font-scale));
  font-weight: 600;
}

body.light .service-person {
  background: #eef5fb;
  border: 3px solid #3F6F9F;
}

.service-empty {
  padding: 30px 10px;

  text-align: center;
  color: #999;

  font-size: calc(15px * var(--font-scale));
}


/* =========================================================
   관리자 비밀번호
========================================================= */

.admin-login-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.72);
}

.admin-login-box {
  width: 100%;
  max-width: 360px;
  padding: 28px 22px 24px;
  border-radius: 18px;
  background: #1b1b1b;
  color: #f5f5f5;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  text-align: center;
}

.admin-login-icon {
  font-size: 42px;
  line-height: 1;
  margin-bottom: 12px;
}

.admin-login-title {
  margin: 0 0 18px;
  font-size: calc(23px * var(--font-scale));
  font-weight: 800;
}

.admin-login-input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border: 1px solid #555;
  border-radius: 10px;
  background: #101010;
  color: #fff;
  font-size: calc(18px * var(--font-scale));
  text-align: center;
  outline: none;
}

.admin-login-input:focus {
  border-color: #5d8bb5;
}

.admin-save-password {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 15px 0 18px;
  font-size: calc(15px * var(--font-scale));
  cursor: pointer;
}

.admin-save-password input {
  width: 18px;
  height: 18px;
  margin: 0;
}

.admin-login-confirm {
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: 10px;
  background: #234563;
  color: #fff;
  font-size: calc(18px * var(--font-scale));
  font-weight: 700;
  cursor: pointer;
}

.admin-login-cancel {
  width: 100%;
  height: 44px;
  margin-top: 10px;
  border: 1px solid #555;
  border-radius: 10px;
  background: transparent;
  color: inherit;
  font-size: calc(17px * var(--font-scale));
  font-weight: 700;
  cursor: pointer;
}

body.light .admin-login-cancel {
  border-color: #ccc;
}

body.light .admin-login-box {
  background: #fff;
  color: #222;
}

body.light .admin-login-input {
  background: #fff;
  color: #222;
  border-color: #ccc;
}

/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;

  height: 60px;
  z-index: 1000;

  display: grid;
  grid-template-columns: repeat(3, 1fr);

  background: #18324a;
  border-top: 1px solid rgba(255,255,255,.10);
}

body.light .bottom-nav {
  background: #18324a;
  border-top: 1px solid rgba(255,255,255,.10);
}

.nav-button {
  border: 0;
  background: transparent;
  color: #fff;

  font-size: 20px;
  font-weight: 700;

  cursor: pointer;
}

.nav-button:not(:last-child) {
  border-right: 1px solid rgba(255,255,255,.25);
}

.nav-button.active {
  color: #fff;
}

body.light .nav-button.active {
  color: #fff;
}

/* =========================================================
   설정
========================================================= */

.settings-panel {
  position: fixed;
  top: 64px;
  right: 10px;

  width: 230px;
  padding: 15px;

  z-index: 1100;

  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);

  background: rgba(30,30,30,.98);
  box-shadow: 0 10px 30px rgba(0,0,0,.35);

  display: none;
}

.settings-panel.show {
  display: block;
}

body.light .settings-panel {
  background: #fff;
  border-color: #ddd;
}

.settings-title {
  margin-bottom: 12px;
  font-size: calc(16px * var(--font-scale));
  font-weight: 800;
}

.settings-row {
  margin-bottom: 14px;
}

.settings-label {
  margin-bottom: 7px;
  font-size: calc(13px * var(--font-scale));
  color: #aaa;
}

body.light .settings-label {
  color: #777;
}

.settings-buttons {
  display: flex;
  gap: 6px;
}

.settings-button {
  flex: 1;

  padding: 8px 5px;

  border-radius: 7px;
  border: 1px solid #555;

  background: transparent;
  color: inherit;

  cursor: pointer;
  font-size: calc(12px * var(--font-scale));
}

.settings-button.active {
  background: #4285f4;
  border-color: #4285f4;
  color: #fff;
}

.font-size-display {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
}

/* =========================================================
   반응형
========================================================= */

@media (max-width: 600px) {

  .name-grid {
    gap: 6px;
  }

  .name-card {
    height: 40px;
    min-height: 40px;
    font-size: calc(17px * var(--font-scale));
  }

  .check-mark {
    width: 17px;
    height: 17px;
    flex-basis: 17px;
  }

  .group-slots {
    grid-template-columns: repeat(2, 1fr);
  }

  .service-volunteers {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 360px) {

  .name-card {
    height: 40px;
    min-height: 40px;
    font-size: calc(17px * var(--font-scale));
  }

  .check-mark {
    width: 15px;
    height: 15px;
    flex-basis: 15px;
    font-size: calc(9px * var(--font-scale));
  }
}
.service-title-with-refresh {
  position: relative;
}

.service-refresh-button {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border: 1px solid #315d83;
  border-radius: 12px;
  background: #234563;
  color: #fff;
  font-size: 25px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}

body.light .service-refresh-button {
  background: #fff;
  color: #234563;
  border-color: #b8c9d8;
  box-shadow: 0 2px 6px rgba(0,0,0,.14);
}

.service-refresh-button:disabled {
  opacity: .55;
  cursor: default;
}


</style>
</head>

<body>

<!-- =======================================================
     상단
======================================================= -->

<header class="top-bar">

  <button
    class="top-button top-left"
    onclick="goBack()"
    aria-label="뒤로가기"
  >
    ‹
  </button>

  <!-- 상단 제목은 반드시 토요일 -->
  <div
    class="top-title"
    id="topTitle"
  >
    토요일
  </div>

  <button
    class="top-button top-right"
    onclick="toggleSettings()"
    aria-label="설정"
  >
    ⚙
  </button>

</header>


<!-- =======================================================
     설정
======================================================= -->

<div
  class="settings-panel"
  id="settingsPanel"
>

  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        id="lightButton"
        onclick="setTheme('light')"
        aria-label="밝게"
      >
        ☀
      </button>

      <button
        class="settings-button"
        id="darkButton"
        onclick="setTheme('dark')"
        aria-label="어둡게"
      >
        🌙
      </button>

    </div>

  </div>

  <div class="settings-row">

    <div class="settings-buttons">

      <button
        class="settings-button"
        onclick="changeFontSize(-10)"
        aria-label="글자 크기 10% 감소"
      >
        −
      </button>

      <div
        class="settings-button font-size-display"
        id="fontSizeDisplay"
      >
        100%
      </div>

      <button
        class="settings-button"
        onclick="changeFontSize(10)"
        aria-label="글자 크기 10% 증가"
      >
        +
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     본문
======================================================= -->

<main class="main">


  <!-- =====================================================
       1. 봉사신청
  ====================================================== -->

  <section
    id="applyView"
    class="view active"
  >

    <h1 class="page-title">
      봉사자 선택
    </h1>

    <!-- 설명 문구는 삭제 -->

    <div
      class="count-box"
      id="selectedCount"
    >
      현재 선택 0 명
    </div>

    <div
      class="name-grid"
      id="nameGrid"
    >

      <div class="name-loading">
        봉사자 명단을 불러오는 중입니다.
      </div>

    </div>

    <!-- 다음 버튼은 삭제 -->

  </section>


  <!-- =====================================================
       2. 관리자용
  ====================================================== -->

  <section
    id="adminView"
    class="view"
  >

    <h1 class="page-title">
      관리자용
    </h1>

    <div class="admin-section">

      <div
        class="admin-count"
        id="adminCount"
      >
        신청자 0명
      </div>

      <div
        class="admin-names"
        id="adminNames"
      >
        <div class="service-empty">
          신청자를 불러오는 중입니다.
        </div>
      </div>


      <div class="group-controls">

        <button
          class="add-group-button"
          onclick="addGroup()"
        >
          + 봉사 그룹 추가
        </button>

      </div>


      <div
        class="groups"
        id="groups"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       3. 봉사하기
  ====================================================== -->

  <section
    id="serviceView"
    class="view"
  >

    <h1 class="page-title service-title-with-refresh">
      봉사하기
      <button
        type="button"
        class="service-refresh-button"
        onclick="refreshServiceGroups()"
        aria-label="새로고침"
      >↻</button>
    </h1>

    <div class="service-section">

      <div class="service-info">
        <strong id="serviceConductor">인도자 : </strong>
      </div>

      <div
        class="service-list"
        id="serviceList"
      ></div>

    </div>

  </section>

</main>


<!-- =======================================================
     하단 메뉴
======================================================= -->

<nav class="bottom-nav">

  <button
    class="nav-button active"
    id="navApply"
    onclick="showView('apply')"
  >
    신청용
  </button>

  <button
    class="nav-button"
    id="navAdmin"
    onclick="showView('admin')"
  >
    관리용
  </button>

  <button
    class="nav-button"
    id="navService"
    onclick="showView('service')"
  >
    봉사용
  </button>

</nav>




<!-- =======================================================
     관리자 비밀번호
======================================================= -->

<div
  id="adminLoginOverlay"
  class="admin-login-overlay"
>
  <div class="admin-login-box">

    <div class="admin-login-icon">🔒</div>

    <h2 class="admin-login-title">관리자용</h2>

    <input
      type="password"
      id="adminPasswordInput"
      class="admin-login-input"
      inputmode="numeric"
      autocomplete="current-password"
      placeholder="비밀번호 입력"
      onkeydown="if(event.key === 'Enter') checkAdminPassword()"
    >

    <label class="admin-save-password">
      <input
        type="checkbox"
        id="saveAdminPassword"
      >
      이 기기에 비밀번호 저장
    </label>

    <button
      type="button"
      class="admin-login-confirm"
      onclick="checkAdminPassword()"
    >
      확인
    </button>

    <button
      type="button"
      class="admin-login-cancel"
      onclick="cancelAdminLogin()"
    >
      취소
    </button>

  </div>
</div>


<script>

/* =========================================================
   기본 설정
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxfv41gmvsmjV6-xI7OFvZujsvHWOYkfeqALvPIn1AEeW42gtAQ8prog7J6QG2pr2fV/exec";

const MY_SELECTION_KEY =
  "saturdayMySelections";

const GROUP_KEY =
  "saturdayVolunteerGroups";


/* =========================================================
   봉사 구역
========================================================= */

let SERVICE_AREAS = [];
let SERVICE_CONDUCTOR = "";


/* =========================================================
   현재 상태
========================================================= */

let masterNames = [];

let applicants = [];

let groups = [];

let selectedApplicant = null;

let currentView = "apply";

const ADMIN_PASSWORD = "3061";
const ADMIN_PASSWORD_KEY = "saturdayAdminPassword";
let adminAuthenticated = false;


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSettings();

    loadMasterNames();

    loadGroups();

    loadServiceData();

    renderService();

  }
);


/* =========================================================
   화면 전환
========================================================= */

function showView(view) {

  if (view === "admin" && !adminAuthenticated) {

    const savedPassword =
      localStorage.getItem(ADMIN_PASSWORD_KEY);

    if (savedPassword === ADMIN_PASSWORD) {
      adminAuthenticated = true;
    } else {
      showAdminLogin();
      return;
    }

  }

  currentView = view;

  document
    .querySelectorAll(".view")
    .forEach(function(element) {

      element.classList.remove("active");

    });


  if (view === "apply") {

    document
      .getElementById("applyView")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent = "토요일";

    setActiveNav("navApply");

    loadMasterNames();

  }


  if (view === "admin") {

    document
      .getElementById("adminView")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent = "토요일";

    setActiveNav("navAdmin");

    loadApplicants();

  }


  if (view === "service") {

    document
      .getElementById("serviceView")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent = "토요일";

    setActiveNav("navService");

    Promise.all([
      loadGroups(),
      loadServiceData()
    ]).then(function() {
      renderService();
    });

  }

}


function showAdminLogin() {

  const overlay =
    document.getElementById("adminLoginOverlay");

  const input =
    document.getElementById("adminPasswordInput");

  const saveCheckbox =
    document.getElementById("saveAdminPassword");

  const savedPassword =
    localStorage.getItem(ADMIN_PASSWORD_KEY);

  if (saveCheckbox) {
    saveCheckbox.checked =
      savedPassword === ADMIN_PASSWORD;
  }

  if (input) {
    input.value = "";
  }

  if (overlay) {
    overlay.style.display = "flex";
  }

  setTimeout(function() {
    if (input) {
      input.focus();
    }
  }, 50);
}


function cancelAdminLogin() {

  const overlay =
    document.getElementById("adminLoginOverlay");

  const input =
    document.getElementById("adminPasswordInput");

  if (input) {
    input.value = "";
  }

  if (overlay) {
    overlay.style.display = "none";
  }

}


function checkAdminPassword() {

  const input =
    document.getElementById("adminPasswordInput");

  const saveCheckbox =
    document.getElementById("saveAdminPassword");

  const password =
    input ? input.value.trim() : "";

  if (password !== ADMIN_PASSWORD) {
    alert("비밀번호가 올바르지 않습니다.");

    if (input) {
      input.focus();
      input.select();
    }

    return;
  }

  adminAuthenticated = true;

  if (saveCheckbox && saveCheckbox.checked) {
    localStorage.setItem(
      ADMIN_PASSWORD_KEY,
      ADMIN_PASSWORD
    );
  } else {
    localStorage.removeItem(ADMIN_PASSWORD_KEY);
  }

  const overlay =
    document.getElementById("adminLoginOverlay");

  if (overlay) {
    overlay.style.display = "none";
  }

  showView("admin");
}


function setActiveNav(id) {

  document
    .querySelectorAll(".nav-button")
    .forEach(function(button) {

      button.classList.remove("active");

    });

  document
    .getElementById(id)
    .classList.add("active");

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  if (currentView !== "apply") {

    showView("apply");

    return;

  }

  history.back();

}


/* =========================================================
   봉사자 명단
   Google Sheet G열에서 가져옴
========================================================= */

async function loadMasterNames() {

  const grid =
    document.getElementById("nameGrid");

  try {

    const response =
      await fetch(
        SCRIPT_URL + "?action=names&t=" + Date.now()
      );

    const data =
      await response.json();

    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "명단을 불러오지 못했습니다."
      );

    }

    masterNames =
      Array.isArray(data.names)
        ? data.names
        : [];

    renderNames();

  } catch (error) {

    console.error(error);

    grid.innerHTML =
      '<div class="name-loading">' +
      '봉사자 명단을 불러오지 못했습니다.<br>' +
      '잠시 후 다시 시도해 주세요.' +
      '</div>';

  }

}


/* =========================================================
   내 선택 상태
========================================================= */

function getMySelections() {

  try {

    const saved =
      localStorage.getItem(
        MY_SELECTION_KEY
      );

    if (!saved) {
      return [];
    }

    const parsed =
      JSON.parse(saved);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch (error) {

    return [];

  }

}


function saveMySelections(list) {

  localStorage.setItem(
    MY_SELECTION_KEY,
    JSON.stringify(list)
  );

}


/* =========================================================
   봉사자 화면
========================================================= */

function renderNames() {

  const grid =
    document.getElementById("nameGrid");

  let selections =
    getMySelections();

  const validNames =
    new Set(masterNames);

  selections =
    selections.filter(function(name) {

      return validNames.has(name);

    });

  saveMySelections(selections);

  grid.innerHTML = "";

  if (masterNames.length === 0) {

    grid.innerHTML =
      '<div class="name-loading">' +
      '등록된 봉사자가 없습니다.' +
      '</div>';

    updateSelectedCount();

    return;

  }


  masterNames.forEach(function(name) {

    const card =
      document.createElement("button");

    card.type = "button";

    card.className =
      "name-card";

    if (
      selections.includes(name)
    ) {

      card.classList.add("selected");

    }


    const check =
      document.createElement("span");

    check.className =
      "check-mark";

    check.textContent =
      selections.includes(name)
        ? "✓"
        : "";


    const text =
      document.createElement("span");

    text.textContent =
      name;


    card.appendChild(check);

    card.appendChild(text);


    card.addEventListener(
      "click",
      function() {

        toggleMySelection(
          name,
          card,
          check
        );

      }
    );


    grid.appendChild(card);

  });


  updateSelectedCount();

}


async function toggleMySelection(
  name,
  card,
  check
) {

  let selections =
    getMySelections();

  const alreadySelected =
    selections.includes(name);

  const newChecked =
    !alreadySelected;


  if (newChecked) {

    if (
      !selections.includes(name)
    ) {

      selections.push(name);

    }

  } else {

    selections =
      selections.filter(function(item) {

        return item !== name;

      });

  }


  saveMySelections(selections);


  if (newChecked) {

    card.classList.add("selected");

    check.textContent = "✓";

  } else {

    card.classList.remove("selected");

    check.textContent = "";

  }


  updateSelectedCount();


  try {

    const response =
      await fetch(
        SCRIPT_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            name: name,
            checked: newChecked
          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      console.error(
        data.message
      );

    }

  } catch (error) {

    console.error(error);

  }

}


function updateSelectedCount() {

  const count =
    getMySelections().length;

  document
    .getElementById("selectedCount")
    .textContent =
      "현재 선택 " +
      count +
      " 명";

}


/* =========================================================
   관리자 - 신청자 가져오기
========================================================= */

async function loadApplicants() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=applicants&t=" +
        Date.now()
      );

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.message ||
        "신청자를 불러오지 못했습니다."
      );

    }

    applicants =
      Array.isArray(data.applicants)
        ? data.applicants
        : [];


    await loadGroups();
    await cleanGroups();
    renderAdmin();

  } catch (error) {

    console.error(error);

    document
      .getElementById("adminNames")
      .innerHTML =
        '<div class="service-empty">' +
        '신청자를 불러오지 못했습니다.' +
        '</div>';

  }

}


/* =========================================================
   관리자 화면
========================================================= */

function renderAdmin() {

  /*
    신청자 전체에서 이미 그룹에 배정된 사람을 제외합니다.
    따라서 관리자 화면에는 아직 그룹에 넣지 않은 사람만 남습니다.
  */

  const assignedNames = new Set();

  groups.forEach(function(group) {

    group.forEach(function(name) {

      if (name) {
        assignedNames.add(name);
      }

    });

  });


  const unassignedApplicants =
    applicants.filter(function(name) {
      return !assignedNames.has(name);
    });


  document
    .getElementById("adminCount")
    .textContent =
      "미배정 신청자 " +
      unassignedApplicants.length +
      "명";


  const namesBox =
    document.getElementById("adminNames");

  namesBox.innerHTML = "";


  /* 신청하지 않은 사람을 관리자가 직접 추가 */

  const addButton =
    document.createElement("button");

  addButton.type = "button";

  addButton.className =
    "admin-add-button";

  addButton.textContent =
    "+ 추가";

  addButton.onclick =
    addManualApplicant;


  if (unassignedApplicants.length === 0) {

    const empty =
      document.createElement("div");

    empty.className =
      "service-empty";

    empty.style.width = "100%";

    empty.textContent =
      "미배정 신청자가 없습니다.";

    namesBox.appendChild(empty);

  } else {

    unassignedApplicants.forEach(function(name) {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "admin-name";

      if (
        selectedApplicant === name
      ) {

        button.classList.add(
          "selected"
        );

      }

      button.textContent =
        name;


      button.onclick =
        function() {

          if (
            selectedApplicant === name
          ) {

            selectedApplicant = null;

          } else {

            selectedApplicant = name;

          }

          renderAdmin();

        };


      namesBox.appendChild(button);

    });

  }

  /* + 추가는 미배정 신청자 목록의 맨 마지막 */
  namesBox.appendChild(addButton);

  renderGroups();

}


/* =========================================================
   관리자 직접 신청자 추가
========================================================= */

async function addManualApplicant() {

  const name =
    prompt("추가할 봉사자의 이름을 입력해 주세요.");

  if (name === null) {
    return;
  }

  const trimmedName =
    name.trim();

  if (!trimmedName) {

    alert("이름을 입력해 주세요.");

    return;

  }


  if (applicants.includes(trimmedName)) {

    alert("이미 신청자 목록에 있습니다.");

    return;

  }


  try {

    const response =
      await fetch(
        SCRIPT_URL,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            name: trimmedName,
            checked: true
          })
        }
      );

    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "신청자 추가에 실패했습니다."
      );

    }


    applicants.push(trimmedName);

    selectedApplicant = trimmedName;

    renderAdmin();

  } catch (error) {

    console.error(error);

    alert(
      "신청자 추가에 실패했습니다.\n잠시 후 다시 시도해 주세요."
    );

  }

}


/* =========================================================
   그룹 불러오기
========================================================= */

async function loadGroups() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=groups&t=" +
        Date.now()
      );

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(
        data.message ||
        "그룹을 불러오지 못했습니다."
      );
    }

    const loaded =
      Array.isArray(data.groups)
        ? data.groups
        : [];

    groups =
      loaded.map(function(group) {

        const result =
          Array.isArray(group)
            ? group.slice(0, 4)
            : [];

        while (result.length < 4) {
          result.push("");
        }

        return result;

      });

    return true;

  } catch (error) {

    console.error(error);

    return false;

  }

}


async function saveGroups() {

  const response =
    await fetch(
      SCRIPT_URL,
      {
        method: "POST",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "saveGroups",
          groups: groups
        })
      }
    );

  const data =
    await response.json();

  if (!data.success) {
    throw new Error(
      data.message ||
      "그룹 저장에 실패했습니다."
    );
  }

  return true;

}


/* =========================================================
   그룹 정리
========================================================= */

async function cleanGroups() {

  const applicantSet =
    new Set(applicants);

  groups =
    groups.map(function(group) {

      return group.map(function(name) {

        if (
          name &&
          applicantSet.has(name)
        ) {

          return name;

        }

        return "";

      });

    });


  /*
    중복 봉사자가 생기지 않도록
    앞쪽 그룹을 우선 유지
  */

  const used =
    new Set();


  groups =
    groups.map(function(group) {

      return group.map(function(name) {

        if (!name) {
          return "";
        }

        if (used.has(name)) {
          return "";
        }

        used.add(name);

        return name;

      });

    });


  await saveGroups();

}


/* =========================================================
   그룹 추가
========================================================= */

async function addGroup() {

  /* 새 그룹은 항상 맨 위에 추가합니다. */

  groups.unshift([
    "",
    "",
    "",
    ""
  ]);

  await saveGroups();

  renderAdmin();

  renderService();

}


/* =========================================================
   그룹 삭제
========================================================= */

async function deleteGroup(index) {

  if (
    !confirm(
      (index + 1) +
      "번 그룹을 삭제하시겠습니까?"
    )
  ) {

    return;

  }

  groups.splice(
    index,
    1
  );

  await saveGroups();

  selectedApplicant = null;

  renderAdmin();

  renderService();

}


/* =========================================================
   그룹 초기화
========================================================= */

async function resetGroup(index) {

  if (
    !confirm(
      (index + 1) +
      "번 그룹의 봉사자를 초기화하시겠습니까?"
    )
  ) {

    return;

  }

  groups[index] = [
    "",
    "",
    "",
    ""
  ];

  await saveGroups();

  selectedApplicant = null;

  renderAdmin();

  renderService();

}


/* =========================================================
   그룹 렌더링
========================================================= */

function renderGroups() {

  const box =
    document.getElementById("groups");

  box.innerHTML = "";


  if (groups.length === 0) {

    box.innerHTML =
      '<div class="service-empty">' +
      '아직 만든 봉사 그룹이 없습니다.<br>' +
      '「+ 봉사 그룹 추가」를 눌러 그룹을 만들어 주세요.' +
      '</div>';

    return;

  }


  groups.forEach(
    function(group, groupIndex) {

      const card =
        document.createElement("div");

      card.className =
        "group-card";


      const header =
        document.createElement("div");

      header.className =
        "group-header";


      const title =
        document.createElement("div");

      title.className =
        "group-title";

      title.textContent =
        (groupIndex + 1) +
        "번 그룹";


      const resetButton =
        document.createElement("button");

      resetButton.type =
        "button";

      resetButton.className =
        "delete-group";

      resetButton.textContent =
        "초기화";

      resetButton.onclick =
        function() {

          resetGroup(
            groupIndex
          );

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.type =
        "button";

      deleteButton.className =
        "delete-group";

      deleteButton.textContent =
        "삭제";

      deleteButton.onclick =
        function() {

          deleteGroup(
            groupIndex
          );

        };


      const headerButtons =
        document.createElement("div");

      headerButtons.style.display = "flex";
      headerButtons.style.gap = "6px";

      header.appendChild(title);

      headerButtons.appendChild(
        resetButton
      );

      headerButtons.appendChild(
        deleteButton
      );

      header.appendChild(
        headerButtons
      );


      const slots =
        document.createElement("div");

      slots.className =
        "group-slots";


      group.forEach(
        function(name, slotIndex) {

          const slot =
            document.createElement("button");

          slot.type =
            "button";

          slot.className =
            "group-slot";


          if (name) {

            slot.classList.add(
              "filled"
            );

            slot.textContent =
              name;

          } else {

            slot.classList.add(
              "empty"
            );

            slot.textContent =
              "빈 자리";

          }


          slot.onclick =
            function() {

              handleSlotClick(
                groupIndex,
                slotIndex
              );

            };


          slots.appendChild(slot);

        }
      );


      card.appendChild(header);

      card.appendChild(slots);

      box.appendChild(card);

    }
  );

}


/* =========================================================
   슬롯에 봉사자 배치
========================================================= */

async function handleSlotClick(
  groupIndex,
  slotIndex
) {

  const currentName =
    groups[groupIndex][slotIndex];


  /*
    이미 사람이 들어있는 슬롯을 누르면
    그 사람을 비움
  */

  if (currentName) {

    groups[groupIndex][slotIndex] =
      "";

    await saveGroups();

    renderAdmin();

    renderService();

    return;

  }


  /*
    선택된 봉사자가 없으면 안내
  */

  if (!selectedApplicant) {

    alert(
      "먼저 위에서 봉사자 이름을 선택해 주세요."
    );

    return;

  }


  /*
    다른 그룹에 이미 배치되어 있다면
    먼저 기존 위치에서 제거
  */

  groups =
    groups.map(function(group) {

      return group.map(function(name) {

        return name === selectedApplicant
          ? ""
          : name;

      });

    });


  groups[groupIndex][slotIndex] =
    selectedApplicant;


  await saveGroups();


  selectedApplicant = null;


  renderAdmin();

  renderService();

}


/* =========================================================
   봉사 구역 / 인도자 가져오기
   개인봉사 시트 B:F
========================================================= */

async function loadServiceData() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=serviceData&t=" +
        Date.now()
      );

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(
        data.message ||
        "봉사 구역 정보를 불러오지 못했습니다."
      );
    }

    SERVICE_AREAS =
      Array.isArray(data.areas)
        ? data.areas
        : [];

    SERVICE_CONDUCTOR =
      String(data.conductor ?? "").trim();

    return true;

  } catch (error) {

    console.error(error);
    return false;

  }
}


/* =========================================================
   봉사하기 화면
========================================================= */

function renderService() {

  const list =
    document.getElementById("serviceList");

  if (!list) {
    return;
  }

  list.innerHTML = "";

  const conductor =
    document.getElementById("serviceConductor");

  if (conductor) {
    conductor.textContent =
      "인도자 : " +
      (SERVICE_CONDUCTOR || "");
  }


  if (groups.length === 0) {

    list.innerHTML =
      '<div class="service-empty">' +
      '관리자용에서 봉사 그룹을 만들어 주세요.' +
      '</div>';

    return;

  }


  groups.forEach(
    function(group, index) {

      const area =
        SERVICE_AREAS[index];


      const card =
        document.createElement("div");

      card.className =
        "service-card";


      const head =
        document.createElement("div");

      head.className =
        "service-head";


      const number =
        document.createElement("div");

      number.className =
        "service-number";


      if (area) {

        number.textContent =
          area.number;

      } else {

        number.textContent =
          index + 1;

      }


      const name =
        document.createElement("div");

      name.className =
        "service-name";


      if (area) {

        name.textContent =
          area.name;

      } else {

        name.textContent =
          "봉사 구역 " +
          (index + 1);

      }


      head.appendChild(number);

      head.appendChild(name);


      const detail =
        document.createElement("div");

      detail.className =
        "service-detail";


      if (area) {

        detail.textContent =
          "호 " +
          area.ho +
          " · " +
          area.m;

      } else {

        detail.textContent =
          "등록된 봉사 구역 정보가 없습니다.";

      }


      const volunteers =
        document.createElement("div");

      volunteers.className =
        "service-volunteers";


      group.forEach(function(person) {

        const personBox =
          document.createElement("div");

        personBox.className =
          "service-person";

        personBox.textContent =
          person || "빈 자리";

        volunteers.appendChild(
          personBox
        );

      });


      card.appendChild(head);

      card.appendChild(detail);

      card.appendChild(volunteers);

      list.appendChild(card);

    }
  );

}


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

  document
    .getElementById("settingsPanel")
    .classList.toggle("show");

}


function setTheme(theme) {

  if (theme === "light") {

    document.body.classList.add(
      "light"
    );

    localStorage.setItem(
      "saturdayTheme",
      "light"
    );

  } else {

    document.body.classList.remove(
      "light"
    );

    localStorage.setItem(
      "saturdayTheme",
      "dark"
    );

  }

  updateSettingButtons();

}


function setFontSize(size) {

  size = Math.max(80, Math.min(150, size));

  document.documentElement.style.setProperty(
    "--font-scale",
    size / 100
  );

  localStorage.setItem(
    "saturdayFontSize",
    String(size)
  );

  updateSettingButtons();

}


function changeFontSize(amount) {

  const current =
    Number(
      localStorage.getItem(
        "saturdayFontSize"
      ) || "100"
    );

  setFontSize(current + amount);

}


function loadSettings() {

  const theme =
    localStorage.getItem(
      "saturdayTheme"
    ) || "dark";


  const fontSize =
    localStorage.getItem(
      "saturdayFontSize"
    ) || "100";


  setTheme(theme);

  setFontSize(
    Number(fontSize)
  );

}


function updateSettingButtons() {

  const theme =
    document.body.classList.contains(
      "light"
    )
      ? "light"
      : "dark";


  document
    .getElementById("darkButton")
    .classList.toggle(
      "active",
      theme === "dark"
    );


  document
    .getElementById("lightButton")
    .classList.toggle(
      "active",
      theme === "light"
    );

  const fontSizeDisplay =
    document.getElementById(
      "fontSizeDisplay"
    );

  if (fontSizeDisplay) {
    fontSizeDisplay.textContent =
      (
        Number(
          localStorage.getItem(
            "saturdayFontSize"
          ) || "100"
        )
      ) + "%";
  }

}


/* =========================================================
   설정창 바깥 클릭
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const panel =
      document.getElementById(
        "settingsPanel"
      );

    const button =
      document.querySelector(
        ".top-right"
      );


    if (
      panel.classList.contains("show") &&
      !panel.contains(event.target) &&
      !button.contains(event.target)
    ) {

      panel.classList.remove(
        "show"
      );

    }

  }
);


async function refreshServiceGroups() {

  const button =
    document.querySelector(".service-refresh-button");

  if (button) {
    button.disabled = true;
  }

  try {
    const results = await Promise.all([
      loadGroups(),
      loadServiceData()
    ]);

    if (!results[0] || !results[1]) {
      throw new Error("봉사용 정보를 불러오지 못했습니다.");
    }

    renderService();
  } catch (error) {
    console.error(error);
    alert("새로고침에 실패했습니다.");
  } finally {
    if (button) {
      button.disabled = false;
    }
  }

}
