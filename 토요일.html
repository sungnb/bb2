<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>토요일 관리자</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

body {
  background:
    radial-gradient(
      circle at top,
      #303030 0%,
      #1d1d1d 42%,
      #0d0d0d 100%
    );
  color: #f5f5f5;
  padding-top: 62px;
  padding-bottom: 82px;
  transition: background .25s, color .25s;
}

/* =========================================================
   밝은 화면
========================================================= */

body.light {
  background:
    radial-gradient(
      circle at top,
      #ffffff 0%,
      #f1f1f1 55%,
      #e5e5e5 100%
    );
  color: #222;
}

/* =========================================================
   상단
========================================================= */

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 62px;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(20,20,20,.96);
  border-bottom: 1px solid rgba(255,255,255,.12);
}

body.light .top-bar {
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid rgba(0,0,0,.12);
}

.top-title {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1px;
}

.top-button {
  position: absolute;
  top: 5px;

  width: 47px;
  height: 47px;

  border: 0;
  border-radius: 13px;

  background: #292929;
  color: #fff;

  font-size: 28px;
  font-weight: 900;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

body.light .top-button {
  background: #e8e8e8;
  color: #222;
}

.back-button {
  left: 26px;
}

.settings-button {
  right: 26px;
  font-size: 25px;
}

/* =========================================================
   설정
========================================================= */

.settings-panel {
  display: none;

  position: fixed;
  top: 62px;
  right: 15px;

  width: 260px;
  padding: 18px;

  z-index: 1100;

  border-radius: 16px;

  background: rgba(35,35,35,.98);
  border: 1px solid rgba(255,255,255,.12);

  box-shadow: 0 12px 35px rgba(0,0,0,.4);
}

body.light .settings-panel {
  background: #fff;
  border-color: rgba(0,0,0,.12);
  box-shadow: 0 12px 35px rgba(0,0,0,.18);
}

.settings-panel.show {
  display: block;
}

.settings-title {
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 13px;
}

.settings-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.settings-row button {
  flex: 1;
  min-height: 40px;

  border: 0;
  border-radius: 10px;

  background: #444;
  color: #fff;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
}

body.light .settings-row button {
  background: #e5e5e5;
  color: #222;
}

.font-label {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 8px;
}

.font-buttons {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 6px;
}

.font-buttons button {
  min-height: 36px;
  border: 0;
  border-radius: 8px;

  background: #444;
  color: #fff;

  font-size: 13px;
  font-weight: 800;
}

body.light .font-buttons button {
  background: #e5e5e5;
  color: #222;
}

/* =========================================================
   본문
========================================================= */

.main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 52px 15px 30px;
}

.page-title {
  text-align: center;
  font-size: 29px;
  font-weight: 900;
  margin: 0;
}

.page-subtitle {
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  color: #aaa;
  margin-top: 10px;
}

body.light .page-subtitle {
  color: #666;
}

/* =========================================================
   신청자 수
========================================================= */

.applicant-count-box {
  margin-top: 24px;

  min-height: 76px;

  border-radius: 18px;

  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  font-weight: 800;
}

body.light .applicant-count-box {
  background: rgba(0,0,0,.05);
  border-color: rgba(0,0,0,.1);
}

.applicant-count {
  font-size: 29px;
  font-weight: 900;
  margin: 0 5px;
}

/* =========================================================
   섹션 제목
========================================================= */

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-top: 27px;
  margin-bottom: 13px;
}

.section-title {
  font-size: 21px;
  font-weight: 900;
}

.section-count {
  font-size: 14px;
  font-weight: 800;
  color: #aaa;
}

body.light .section-count {
  color: #666;
}

/* =========================================================
   미배정 자매
========================================================= */

.unassigned-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.person {
  min-height: 51px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 7px;

  border-radius: 11px;

  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.13);

  font-size: 15px;
  font-weight: 800;

  cursor: pointer;

  user-select: none;
}

body.light .person {
  background: #fff;
  border-color: #d5d5d5;
  color: #222;
}

.person.selected {
  background: #21384d;
  border-color: #3e80b8;
  color: #fff;
}

body.light .person.selected {
  background: #dceeff;
  border-color: #6ba8d8;
  color: #17456b;
}

.empty-message {
  text-align: center;
  padding: 27px 10px;

  color: #aaa;

  font-size: 17px;
  font-weight: 700;
}

body.light .empty-message {
  color: #777;
}

/* =========================================================
   안내
========================================================= */

.notice {
  margin-top: 18px;
  padding: 14px;

  border-radius: 14px;

  background: rgba(34,54,72,.65);
  border: 1px solid #315875;

  text-align: center;

  font-size: 14px;
  font-weight: 700;
  line-height: 1.7;
}

/* =========================================================
   봉사 그룹
========================================================= */

.groups-header {
  margin-top: 27px;
}

.group-card {
  margin-bottom: 17px;

  padding: 15px;

  border-radius: 18px;

  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
}

body.light .group-card {
  background: rgba(255,255,255,.8);
  border-color: rgba(0,0,0,.1);
}

.group-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 11px;
}

.group-title {
  font-size: 20px;
  font-weight: 900;
}

.delete-group {
  border: 0;
  border-radius: 10px;

  padding: 8px 12px;

  background: #444;
  color: #fff;

  font-size: 13px;
  font-weight: 800;
}

body.light .delete-group {
  background: #ddd;
  color: #222;
}

.slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.slot {
  min-height: 67px;

  border-radius: 13px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 8px;

  background: rgba(0,0,0,.15);
  border: 1px dashed rgba(255,255,255,.18);

  color: #aaa;

  font-size: 15px;
  font-weight: 800;

  text-align: center;

  cursor: pointer;
}

body.light .slot {
  background: #f3f3f3;
  border-color: #bbb;
  color: #888;
}

.slot.filled {
  background: #263c50;
  border: 1px solid #3d6d94;
  color: #fff;
}

body.light .slot.filled {
  background: #e0f0ff;
  border-color: #8ab6d8;
  color: #17456b;
}

/* =========================================================
   그룹 추가
========================================================= */

.add-group {
  width: 100%;
  min-height: 55px;

  border: 1px solid #3471a6;
  border-radius: 14px;

  background: #1e3040;
  color: #fff;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}

body.light .add-group {
  background: #e7f3ff;
  color: #17456b;
}

/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;

  height: 78px;

  z-index: 1000;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;

  align-items: center;

  padding: 8px;

  background: rgba(14,14,14,.97);
  border-top: 1px solid rgba(255,255,255,.12);
}

body.light .bottom-nav {
  background: rgba(255,255,255,.97);
  border-top-color: rgba(0,0,0,.1);
}

.bottom-nav button {
  height: 42px;

  border: 0;
  border-radius: 22px;

  background: #262626;
  color: #fff;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;
}

body.light .bottom-nav button {
  background: #e5e5e5;
  color: #222;
}

.bottom-nav button.active {
  background: #19354d;
  color: #5da8ec;
}

body.light .bottom-nav button.active {
  background: #dceeff;
  color: #1768a5;
}

/* =========================================================
   반응형
========================================================= */

@media (max-width: 520px) {

  .back-button {
    left: 12px;
  }

  .settings-button {
    right: 12px;
  }

  .main {
    padding-left: 15px;
    padding-right: 15px;
  }

  .page-title {
    font-size: 28px;
  }

  .slots {
    gap: 7px;
  }

  .slot {
    font-size: 14px;
  }

  .bottom-nav button {
    font-size: 13px;
  }
}

</style>
</head>


<body>

<!-- =======================================================
     상단
======================================================= -->

<header class="top-bar">

  <button
    class="top-button back-button"
    onclick="history.back()"
    aria-label="뒤로가기">
    ‹
  </button>

  <div class="top-title">토요일</div>

  <button
    class="top-button settings-button"
    onclick="toggleSettings()"
    aria-label="설정">
    ⚙
  </button>

</header>


<!-- =======================================================
     설정
======================================================= -->

<div
  id="settingsPanel"
  class="settings-panel">

  <div class="settings-title">화면 설정</div>

  <div class="settings-row">
    <button onclick="setTheme('dark')">어둡게</button>
    <button onclick="setTheme('light')">밝게</button>
  </div>

  <div class="font-label">
    글자 크기
  </div>

  <div class="font-buttons">
    <button onclick="setFontSize(80)">80%</button>
    <button onclick="setFontSize(100)">100%</button>
    <button onclick="setFontSize(120)">120%</button>
    <button onclick="setFontSize(150)">150%</button>
  </div>

</div>


<!-- =======================================================
     본문
======================================================= -->

<main class="main">

  <h1 class="page-title">
    관리자용
  </h1>

  <div class="page-subtitle">
    신청한 자매를 봉사 그룹에 배정해 주세요
  </div>


  <!-- 신청자 수 -->

  <div class="applicant-count-box">
    현재 신청자
    <span
      id="applicantCount"
      class="applicant-count">0</span>
    명
  </div>


  <!-- =====================================================
       미배정 자매
  ====================================================== -->

  <div class="section-header">
    <div class="section-title">
      미배정 자매
    </div>

    <div
      id="unassignedCount"
      class="section-count">
      0명
    </div>
  </div>


  <div
    id="unassignedGrid"
    class="unassigned-grid">
  </div>


  <div
    id="notice"
    class="notice">

    자매 이름을 먼저 선택한 다음<br>
    원하는 그룹의 빈칸을 눌러 배정하세요.

  </div>


  <!-- =====================================================
       봉사 그룹
  ====================================================== -->

  <div class="section-header groups-header">

    <div class="section-title">
      봉사 그룹
    </div>

    <div
      id="groupCount"
      class="section-count">
      0그룹
    </div>

  </div>


  <div id="groups"></div>


  <button
    class="add-group"
    onclick="addGroup()">

    ＋ 봉사 그룹 추가

  </button>

</main>


<!-- =======================================================
     하단 메뉴
======================================================= -->

<nav class="bottom-nav">

  <button
    onclick="location.href='./토요일.html'">
    봉사신청
  </button>

  <button
    class="active"
    onclick="location.href='./토요일관리자.html'">
    관리자용
  </button>

  <button
    onclick="location.href='./토요일봉사.html'">
    봉사하기
  </button>

</nav>


<script>

/* =========================================================
   기본 설정
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxf41gmvsmjV6-xI7OFvZujsvHWOYkfeqALvPIn1AEeW42gtAQ8prog7J6QG2pr2fV/exec";


const SISTERS = [
  "강효선",
  "계영혜",
  "권영란",
  "권효정",
  "김가희",
  "김남희",
  "김수영",
  "김정순",
  "김현심",
  "맹희주",
  "민순자",
  "박미화",
  "박수은",
  "박정은",
  "박한별",
  "박현주",
  "손예진",
  "송효자",
  "안순옥",
  "오미경",
  "오미나",
  "오승비",
  "오슬원",
  "이영자",
  "이윤부",
  "이혜자",
  "임창숙"
];


const GROUP_KEY =
  "saturdayVolunteerGroups";


let applicants = [];

let groups =
  JSON.parse(
    localStorage.getItem(GROUP_KEY)
    || "[]"
  );

let selectedName = null;


/* =========================================================
   초기화
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSettings();

    if (!groups.length) {
      groups = [[]];
      saveGroups();
    }

    renderAll();

    loadApplicants();

    setInterval(
      loadApplicants,
      10000
    );

  }
);


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

  const panel =
    document.getElementById(
      "settingsPanel"
    );

  panel.classList.toggle("show");

}


function setTheme(theme) {

  if (theme === "light") {
    document.body.classList.add("light");
  } else {
    document.body.classList.remove("light");
  }

  localStorage.setItem(
    "saturdayTheme",
    theme
  );

}


function setFontSize(size) {

  document.documentElement.style.fontSize =
    size + "%";

  localStorage.setItem(
    "saturdayFontSize",
    size
  );

}


function loadSettings() {

  const theme =
    localStorage.getItem(
      "saturdayTheme"
    );

  const fontSize =
    localStorage.getItem(
      "saturdayFontSize"
    );

  if (theme === "light") {
    document.body.classList.add("light");
  }

  if (fontSize) {
    document.documentElement.style.fontSize =
      fontSize + "%";
  }

}


/* =========================================================
   신청자 불러오기
========================================================= */

async function loadApplicants() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=applicants&t=" +
        Date.now()
      );

    const data =
      await response.json();

    if (!data.success) {
      console.error(
        data.message
      );
      return;
    }

    applicants =
      (data.applicants || [])
      .filter(name =>
        SISTERS.includes(name)
      );

    cleanGroups();

    renderAll();

  } catch (error) {

    console.error(
      "신청자 불러오기 오류:",
      error
    );

  }

}


/* =========================================================
   그룹에 없는 신청자만 미배정으로 표시
========================================================= */

function getAssignedNames() {

  const assigned = [];

  groups.forEach(group => {

    group.forEach(name => {

      if (name) {
        assigned.push(name);
      }

    });

  });

  return assigned;

}


function getUnassignedNames() {

  const assigned =
    getAssignedNames();

  return applicants.filter(
    name =>
      !assigned.includes(name)
  );

}


/* =========================================================
   화면 전체
========================================================= */

function renderAll() {

  renderCount();

  renderUnassigned();

  renderGroups();

}


/* =========================================================
   신청자 수
========================================================= */

function renderCount() {

  document.getElementById(
    "applicantCount"
  ).textContent =
    applicants.length;

}


/* =========================================================
   미배정 자매
========================================================= */

function renderUnassigned() {

  const grid =
    document.getElementById(
      "unassignedGrid"
    );

  const count =
    document.getElementById(
      "unassignedCount"
    );

  const names =
    getUnassignedNames();

  count.textContent =
    names.length + "명";

  grid.innerHTML = "";

  if (!names.length) {

    grid.innerHTML =
      '<div class="empty-message" style="grid-column:1/-1;">' +
      (
        applicants.length
          ? "모든 신청자가 배정되었습니다."
          : "아직 신청한 자매가 없습니다."
      ) +
      "</div>";

    return;

  }


  names.forEach(name => {

    const div =
      document.createElement("div");

    div.className =
      "person";

    if (selectedName === name) {
      div.classList.add("selected");
    }

    div.textContent =
      name;

    div.onclick =
      function() {

        if (selectedName === name) {
          selectedName = null;
        } else {
          selectedName = name;
        }

        renderUnassigned();

      };

    grid.appendChild(div);

  });

}


/* =========================================================
   그룹 표시
========================================================= */

function renderGroups() {

  const container =
    document.getElementById(
      "groups"
    );

  const groupCount =
    document.getElementById(
      "groupCount"
    );

  container.innerHTML = "";

  groupCount.textContent =
    groups.length + "그룹";


  groups.forEach(
    (group, groupIndex) => {

      const card =
        document.createElement("div");

      card.className =
        "group-card";


      const titleRow =
        document.createElement("div");

      titleRow.className =
        "group-title-row";


      const title =
        document.createElement("div");

      title.className =
        "group-title";

      title.textContent =
        (groupIndex + 1) +
        "번 그룹";


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-group";

      deleteButton.textContent =
        "삭제";

      deleteButton.onclick =
        function() {

          if (
            !confirm(
              (groupIndex + 1) +
              "번 그룹을 삭제하시겠습니까?"
            )
          ) {
            return;
          }

          groups.splice(
            groupIndex,
            1
          );

          if (!groups.length) {
            groups.push([]);
          }

          saveGroups();

          selectedName = null;

          renderAll();

        };


      titleRow.appendChild(title);
      titleRow.appendChild(
        deleteButton
      );


      const slots =
        document.createElement("div");

      slots.className =
        "slots";


      for (
        let slotIndex = 0;
        slotIndex < 4;
        slotIndex++
      ) {

        const slot =
          document.createElement("div");

        slot.className =
          "slot";


        const name =
          group[slotIndex];


        if (name) {

          slot.classList.add(
            "filled"
          );

          slot.textContent =
            name;

        } else {

          slot.textContent =
            "빈칸";

        }


        slot.onclick =
          function() {

            handleSlotClick(
              groupIndex,
              slotIndex
            );

          };


        slots.appendChild(slot);

      }


      card.appendChild(titleRow);
      card.appendChild(slots);

      container.appendChild(card);

    }
  );

}


/* =========================================================
   빈칸에 자매 배정
========================================================= */

function handleSlotClick(
  groupIndex,
  slotIndex
) {

  const group =
    groups[groupIndex];

  const currentName =
    group[slotIndex];


  /* 이미 들어있는 자매를 누르면 제거 */

  if (currentName) {

    group.splice(
      slotIndex,
      1
    );

    while (group.length < 4) {
      group.push("");
    }

    saveGroups();

    selectedName = null;

    renderAll();

    return;

  }


  /* 선택된 자매가 없으면 안내 */

  if (!selectedName) {

    alert(
      "먼저 미배정 자매의 이름을 선택해 주세요."
    );

    return;

  }


  /* 중복 방지 */

  if (
    getAssignedNames()
      .includes(selectedName)
  ) {

    alert(
      "이미 다른 그룹에 배정된 자매입니다."
    );

    selectedName = null;

    renderAll();

    return;

  }


  group[slotIndex] =
    selectedName;


  while (group.length < 4) {
    group.push("");
  }


  saveGroups();

  selectedName = null;

  renderAll();

}


/* =========================================================
   그룹 추가
========================================================= */

function addGroup() {

  groups.push([]);

  saveGroups();

  selectedName = null;

  renderAll();

}


/* =========================================================
   그룹 저장
========================================================= */

function saveGroups() {

  localStorage.setItem(
    GROUP_KEY,
    JSON.stringify(groups)
  );

}


/* =========================================================
   신청 취소된 사람 등이 그룹에 남아있으면 제거
========================================================= */

function cleanGroups() {

  let changed = false;

  groups.forEach(
    (group, groupIndex) => {

      for (
        let i = 0;
        i < group.length;
        i++
      ) {

        const name =
          group[i];

        if (
          name &&
          !applicants.includes(name)
        ) {

          group[i] = "";

          changed = true;

        }

      }

    }
  );


  if (changed) {

    groups =
      groups.map(
        group => {

          const result =
            group.slice(0, 4);

          while (
            result.length < 4
          ) {
            result.push("");
          }

          return result;

        }
      );

    saveGroups();

  }

}

</script>
