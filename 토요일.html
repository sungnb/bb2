<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>토요일</title>

<style>
/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 100%;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background:
    radial-gradient(circle at top, #252525 0%, #111 55%, #080808 100%);
  color: #f5f5f5;
  min-height: 100vh;
  transition: background .25s, color .25s;
}

body.light {
  background: #f5f5f5;
  color: #222;
}

/* =========================================================
   상단
========================================================= */

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 58px;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(15,15,15,.96);
  border-bottom: 1px solid rgba(255,255,255,.10);
}

body.light .top-bar {
  background: rgba(255,255,255,.97);
  border-bottom: 1px solid #ddd;
}

.top-title {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.top-button {
  position: absolute;
  top: 0;
  width: 58px;
  height: 58px;

  border: 0;
  background: transparent;
  color: inherit;

  font-size: 25px;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.top-left {
  left: 0;
}

.top-right {
  right: 0;
}

/* =========================================================
   본문
========================================================= */

.main {
  padding-top: 58px;
  padding-bottom: 82px;
  min-height: 100vh;
}

.view {
  display: none;
  padding: 22px 14px 30px;
}

.view.active {
  display: block;
}

.page-title {
  margin: 0 0 16px;
  text-align: center;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -1px;
}

/* =========================================================
   선택 인원
========================================================= */

.count-box {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 18px;

  padding: 13px 15px;

  border-radius: 12px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.10);

  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

body.light .count-box {
  background: #fff;
  border-color: #ddd;
}

/* =========================================================
   봉사자 선택 - 4열
========================================================= */

.name-grid {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;

  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.name-card {
  min-height: 58px;

  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07);

  color: inherit;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;

  padding: 7px 4px;

  font-size: 14px;
  font-weight: 600;

  transition:
    background .15s,
    border-color .15s,
    transform .1s;
}

.name-card:active {
  transform: scale(.97);
}

.name-card.selected {
  background: rgba(55,145,255,.28);
  border-color: #4d9cff;
}

body.light .name-card {
  background: #fff;
  border-color: #ddd;
}

body.light .name-card.selected {
  background: #e7f1ff;
  border-color: #4285f4;
}

.check-mark {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;

  border-radius: 50%;
  border: 2px solid #777;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 11px;
  font-weight: 900;
}

.name-card.selected .check-mark {
  border-color: #4d9cff;
  background: #4d9cff;
  color: #fff;
}

body.light .name-card.selected .check-mark {
  border-color: #4285f4;
  background: #4285f4;
}

.name-loading {
  grid-column: 1 / -1;

  padding: 35px 10px;
  text-align: center;

  color: #aaa;
  font-size: 15px;
}

body.light .name-loading {
  color: #777;
}

/* =========================================================
   관리자
========================================================= */

.admin-section {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.admin-count {
  text-align: center;
  margin-bottom: 15px;
  font-size: 16px;
  font-weight: 700;
}

.admin-names {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}

.admin-name {
  padding: 10px 13px;

  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.15);

  background: rgba(255,255,255,.08);
  color: inherit;

  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
}

.admin-name.selected {
  background: #4285f4;
  color: #fff;
  border-color: #4285f4;
}

body.light .admin-name {
  background: #fff;
  border-color: #ddd;
}

body.light .admin-name.selected {
  background: #4285f4;
  color: #fff;
}

.group-controls {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.add-group-button {
  border: 0;
  border-radius: 10px;

  padding: 12px 20px;

  background: #4285f4;
  color: #fff;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

.groups {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.group-card {
  padding: 14px;

  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07);
}

body.light .group-card {
  background: #fff;
  border-color: #ddd;
}

.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 10px;
}

.group-title {
  font-size: 17px;
  font-weight: 800;
}

.delete-group {
  border: 0;
  background: transparent;
  color: #ff7777;

  font-size: 13px;
  cursor: pointer;
}

.group-slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.group-slot {
  min-height: 58px;

  border-radius: 9px;
  border: 1px dashed #777;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  padding: 6px 4px;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;
}

.group-slot.filled {
  border-style: solid;
  border-color: #4285f4;
  background: rgba(66,133,244,.18);
}

.group-slot.empty {
  color: #888;
}

/* =========================================================
   봉사하기
========================================================= */

.service-section {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.service-info {
  margin-bottom: 18px;
  text-align: center;
  font-size: 15px;
  color: #aaa;
}

body.light .service-info {
  color: #777;
}

.service-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.service-card {
  padding: 16px;

  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07);
}

body.light .service-card {
  background: #fff;
  border-color: #ddd;
}

.service-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}

.service-number {
  min-width: 43px;

  padding: 6px 8px;

  border-radius: 8px;
  background: #4285f4;
  color: #fff;

  text-align: center;
  font-size: 14px;
  font-weight: 800;
}

.service-name {
  font-size: 18px;
  font-weight: 800;
}

.service-detail {
  margin-bottom: 12px;

  font-size: 14px;
  color: #aaa;
}

body.light .service-detail {
  color: #777;
}

.service-volunteers {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.service-person {
  min-height: 43px;

  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.06);

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  padding: 5px 3px;

  font-size: 13px;
  font-weight: 600;
}

body.light .service-person {
  background: #f7f7f7;
  border-color: #ddd;
}

.service-empty {
  padding: 30px 10px;

  text-align: center;
  color: #999;

  font-size: 15px;
}

/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;

  height: 70px;
  z-index: 1000;

  display: grid;
  grid-template-columns: repeat(3, 1fr);

  background: rgba(15,15,15,.97);
  border-top: 1px solid rgba(255,255,255,.10);
}

body.light .bottom-nav {
  background: rgba(255,255,255,.98);
  border-top: 1px solid #ddd;
}

.nav-button {
  border: 0;
  background: transparent;
  color: #888;

  font-size: 14px;
  font-weight: 700;

  cursor: pointer;
}

.nav-button.active {
  color: #4d9cff;
}

body.light .nav-button.active {
  color: #4285f4;
}

/* =========================================================
   설정
========================================================= */

.settings-panel {
  position: fixed;
  top: 64px;
  right: 10px;

  width: 230px;
  padding: 15px;

  z-index: 1100;

  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);

  background: rgba(30,30,30,.98);
  box-shadow: 0 10px 30px rgba(0,0,0,.35);

  display: none;
}

.settings-panel.show {
  display: block;
}

body.light .settings-panel {
  background: #fff;
  border-color: #ddd;
}

.settings-title {
  margin-bottom: 12px;
  font-size: 16px;
  font-weight: 800;
}

.settings-row {
  margin-bottom: 14px;
}

.settings-label {
  margin-bottom: 7px;
  font-size: 13px;
  color: #aaa;
}

body.light .settings-label {
  color: #777;
}

.settings-buttons {
  display: flex;
  gap: 6px;
}

.settings-button {
  flex: 1;

  padding: 8px 5px;

  border-radius: 7px;
  border: 1px solid #555;

  background: transparent;
  color: inherit;

  cursor: pointer;
  font-size: 12px;
}

.settings-button.active {
  background: #4285f4;
  border-color: #4285f4;
  color: #fff;
}

/* =========================================================
   반응형
========================================================= */

@media (max-width: 600px) {

  .name-grid {
    gap: 6px;
  }

  .name-card {
    min-height: 54px;
    font-size: 13px;
  }

  .check-mark {
    width: 17px;
    height: 17px;
    flex-basis: 17px;
  }

  .group-slots {
    grid-template-columns: repeat(2, 1fr);
  }

  .service-volunteers {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 360px) {

  .name-card {
    font-size: 12px;
    padding-left: 2px;
    padding-right: 2px;
  }

  .check-mark {
    width: 15px;
    height: 15px;
    flex-basis: 15px;
    font-size: 9px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     상단
======================================================= -->

<header class="top-bar">

  <button
    class="top-button top-left"
    onclick="goBack()"
    aria-label="뒤로가기"
  >
    ‹
  </button>

  <!-- 상단 제목은 반드시 토요일 -->
  <div
    class="top-title"
    id="topTitle"
  >
    토요일
  </div>

  <button
    class="top-button top-right"
    onclick="toggleSettings()"
    aria-label="설정"
  >
    ⚙
  </button>

</header>


<!-- =======================================================
     설정
======================================================= -->

<div
  class="settings-panel"
  id="settingsPanel"
>

  <div class="settings-title">
    설정
  </div>

  <div class="settings-row">

    <div class="settings-label">
      화면
    </div>

    <div class="settings-buttons">

      <button
        class="settings-button"
        id="darkButton"
        onclick="setTheme('dark')"
      >
        어둡게
      </button>

      <button
        class="settings-button"
        id="lightButton"
        onclick="setTheme('light')"
      >
        밝게
      </button>

    </div>

  </div>


  <div class="settings-row">

    <div class="settings-label">
      글자 크기
    </div>

    <div class="settings-buttons">

      <button
        class="settings-button"
        onclick="setFontSize(80)"
      >
        80%
      </button>

      <button
        class="settings-button"
        onclick="setFontSize(100)"
      >
        100%
      </button>

      <button
        class="settings-button"
        onclick="setFontSize(120)"
      >
        120%
      </button>

      <button
        class="settings-button"
        onclick="setFontSize(150)"
      >
        150%
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     본문
======================================================= -->

<main class="main">


  <!-- =====================================================
       1. 봉사신청
  ====================================================== -->

  <section
    id="applyView"
    class="view active"
  >

    <h1 class="page-title">
      봉사자 선택
    </h1>

    <!-- 설명 문구는 삭제 -->

    <div
      class="count-box"
      id="selectedCount"
    >
      현재 선택 0 명
    </div>

    <div
      class="name-grid"
      id="nameGrid"
    >

      <div class="name-loading">
        봉사자 명단을 불러오는 중입니다.
      </div>

    </div>

    <!-- 다음 버튼은 삭제 -->

  </section>


  <!-- =====================================================
       2. 관리자용
  ====================================================== -->

  <section
    id="adminView"
    class="view"
  >

    <h1 class="page-title">
      관리자용
    </h1>

    <div class="admin-section">

      <div
        class="admin-count"
        id="adminCount"
      >
        신청자 0명
      </div>

      <div
        class="admin-names"
        id="adminNames"
      >
        <div class="service-empty">
          신청자를 불러오는 중입니다.
        </div>
      </div>


      <div class="group-controls">

        <button
          class="add-group-button"
          onclick="addGroup()"
        >
          + 봉사 그룹 추가
        </button>

      </div>


      <div
        class="groups"
        id="groups"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       3. 봉사하기
  ====================================================== -->

  <section
    id="serviceView"
    class="view"
  >

    <h1 class="page-title">
      봉사하기
    </h1>

    <div class="service-section">

      <div class="service-info">
        관리자용에서 만든 그룹 순서대로 봉사 구역에 배정됩니다.
      </div>

      <div
        class="service-list"
        id="serviceList"
      ></div>

    </div>

  </section>

</main>


<!-- =======================================================
     하단 메뉴
======================================================= -->

<nav class="bottom-nav">

  <button
    class="nav-button active"
    id="navApply"
    onclick="showView('apply')"
  >
    봉사신청
  </button>

  <button
    class="nav-button"
    id="navAdmin"
    onclick="showView('admin')"
  >
    관리자용
  </button>

  <button
    class="nav-button"
    id="navService"
    onclick="showView('service')"
  >
    봉사하기
  </button>

</nav>


<script>

/* =========================================================
   기본 설정
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxfv41gmvsmjV6-xI7OFvZujsvHWOYkfeqALvPIn1AEeW42gtAQ8prog7J6QG2pr2fV/exec";

const MY_SELECTION_KEY =
  "saturdayMySelections";

const GROUP_KEY =
  "saturdayVolunteerGroups";


/* =========================================================
   봉사 구역
========================================================= */

const SERVICE_AREAS = [

  {
    number: "439",
    name: "그린 빌",
    ho: "138",
    m: "Lw"
  },

  {
    number: "304",
    name: "에코 빌",
    ho: "189",
    m: "Ok"
  },

  {
    number: "306",
    name: "국토정보공사",
    ho: "191",
    m: "Lw"
  },

  {
    number: "308",
    name: "SM 빌",
    ho: "153",
    m: "Lw"
  },

  {
    number: "309",
    name: "신일 빌딩",
    ho: "186",
    m: "Lw"
  },

  {
    number: "440",
    name: "성미료",
    ho: "197",
    m: "Ok"
  },

  {
    number: "302",
    name: "금정 빌딩",
    ho: "155",
    m: "Ok"
  },

  {
    number: "311",
    name: "오목 사우나",
    ho: "161",
    m: "Lw"
  },

  {
    number: "312",
    name: "화이트 빌",
    ho: "128",
    m: "Ca"
  },

  {
    number: "315",
    name: "반석 빌딩",
    ho: "089",
    m: "Ca"
  }

];


/* =========================================================
   현재 상태
========================================================= */

let masterNames = [];

let applicants = [];

let groups = [];

let selectedApplicant = null;

let currentView = "apply";


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSettings();

    loadMasterNames();

    loadGroups();

    renderService();

  }
);


/* =========================================================
   화면 전환
========================================================= */

function showView(view) {

  currentView = view;

  document
    .querySelectorAll(".view")
    .forEach(function(element) {

      element.classList.remove("active");

    });


  if (view === "apply") {

    document
      .getElementById("applyView")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent = "토요일";

    setActiveNav("navApply");

    loadMasterNames();

  }


  if (view === "admin") {

    document
      .getElementById("adminView")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent = "토요일";

    setActiveNav("navAdmin");

    loadApplicants();

  }


  if (view === "service") {

    document
      .getElementById("serviceView")
      .classList.add("active");

    document
      .getElementById("topTitle")
      .textContent = "토요일";

    setActiveNav("navService");

    loadGroups();

    renderService();

  }

}


function setActiveNav(id) {

  document
    .querySelectorAll(".nav-button")
    .forEach(function(button) {

      button.classList.remove("active");

    });

  document
    .getElementById(id)
    .classList.add("active");

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  if (currentView !== "apply") {

    showView("apply");

    return;

  }

  history.back();

}


/* =========================================================
   봉사자 명단
   Google Sheet G열에서 가져옴
========================================================= */

async function loadMasterNames() {

  const grid =
    document.getElementById("nameGrid");

  try {

    const response =
      await fetch(
        SCRIPT_URL + "?action=names&t=" + Date.now()
      );

    const data =
      await response.json();

    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "명단을 불러오지 못했습니다."
      );

    }

    masterNames =
      Array.isArray(data.names)
        ? data.names
        : [];

    renderNames();

  } catch (error) {

    console.error(error);

    grid.innerHTML =
      '<div class="name-loading">' +
      '봉사자 명단을 불러오지 못했습니다.<br>' +
      '잠시 후 다시 시도해 주세요.' +
      '</div>';

  }

}


/* =========================================================
   내 선택 상태
========================================================= */

function getMySelections() {

  try {

    const saved =
      localStorage.getItem(
        MY_SELECTION_KEY
      );

    if (!saved) {
      return [];
    }

    const parsed =
      JSON.parse(saved);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch (error) {

    return [];

  }

}


function saveMySelections(list) {

  localStorage.setItem(
    MY_SELECTION_KEY,
    JSON.stringify(list)
  );

}


/* =========================================================
   봉사자 화면
========================================================= */

function renderNames() {

  const grid =
    document.getElementById("nameGrid");

  let selections =
    getMySelections();

  const validNames =
    new Set(masterNames);

  selections =
    selections.filter(function(name) {

      return validNames.has(name);

    });

  saveMySelections(selections);

  grid.innerHTML = "";

  if (masterNames.length === 0) {

    grid.innerHTML =
      '<div class="name-loading">' +
      '등록된 봉사자가 없습니다.' +
      '</div>';

    updateSelectedCount();

    return;

  }


  masterNames.forEach(function(name) {

    const card =
      document.createElement("button");

    card.type = "button";

    card.className =
      "name-card";

    if (
      selections.includes(name)
    ) {

      card.classList.add("selected");

    }


    const check =
      document.createElement("span");

    check.className =
      "check-mark";

    check.textContent =
      selections.includes(name)
        ? "✓"
        : "";


    const text =
      document.createElement("span");

    text.textContent =
      name;


    card.appendChild(check);

    card.appendChild(text);


    card.addEventListener(
      "click",
      function() {

        toggleMySelection(
          name,
          card,
          check
        );

      }
    );


    grid.appendChild(card);

  });


  updateSelectedCount();

}


async function toggleMySelection(
  name,
  card,
  check
) {

  let selections =
    getMySelections();

  const alreadySelected =
    selections.includes(name);

  const newChecked =
    !alreadySelected;


  if (newChecked) {

    if (
      !selections.includes(name)
    ) {

      selections.push(name);

    }

  } else {

    selections =
      selections.filter(function(item) {

        return item !== name;

      });

  }


  saveMySelections(selections);


  if (newChecked) {

    card.classList.add("selected");

    check.textContent = "✓";

  } else {

    card.classList.remove("selected");

    check.textContent = "";

  }


  updateSelectedCount();


  try {

    const response =
      await fetch(
        SCRIPT_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            name: name,
            checked: newChecked
          })
        }
      );

    const data =
      await response.json();

    if (!data.success) {

      console.error(
        data.message
      );

    }

  } catch (error) {

    console.error(error);

  }

}


function updateSelectedCount() {

  const count =
    getMySelections().length;

  document
    .getElementById("selectedCount")
    .textContent =
      "현재 선택 " +
      count +
      " 명";

}


/* =========================================================
   관리자 - 신청자 가져오기
========================================================= */

async function loadApplicants() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?action=applicants&t=" +
        Date.now()
      );

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.message ||
        "신청자를 불러오지 못했습니다."
      );

    }

    applicants =
      Array.isArray(data.applicants)
        ? data.applicants
        : [];


    cleanGroups();

    renderAdmin();

  } catch (error) {

    console.error(error);

    document
      .getElementById("adminNames")
      .innerHTML =
        '<div class="service-empty">' +
        '신청자를 불러오지 못했습니다.' +
        '</div>';

  }

}


/* =========================================================
   관리자 화면
========================================================= */

function renderAdmin() {

  document
    .getElementById("adminCount")
    .textContent =
      "신청자 " +
      applicants.length +
      "명";


  const namesBox =
    document.getElementById("adminNames");

  namesBox.innerHTML = "";


  if (applicants.length === 0) {

    namesBox.innerHTML =
      '<div class="service-empty">' +
      '현재 신청한 봉사자가 없습니다.' +
      '</div>';

  } else {

    applicants.forEach(function(name) {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "admin-name";

      if (
        selectedApplicant === name
      ) {

        button.classList.add(
          "selected"
        );

      }

      button.textContent =
        name;


      button.onclick =
        function() {

          if (
            selectedApplicant === name
          ) {

            selectedApplicant = null;

          } else {

            selectedApplicant = name;

          }

          renderAdmin();

        };


      namesBox.appendChild(button);

    });

  }


  renderGroups();

}


/* =========================================================
   그룹 불러오기
========================================================= */

function loadGroups() {

  try {

    const saved =
      localStorage.getItem(
        GROUP_KEY
      );

    if (!saved) {

      groups = [];

      return;

    }

    const parsed =
      JSON.parse(saved);

    if (!Array.isArray(parsed)) {

      groups = [];

      return;

    }


    groups =
      parsed.map(function(group) {

        const result =
          Array.isArray(group)
            ? group.slice(0, 4)
            : [];

        while (
          result.length < 4
        ) {

          result.push("");

        }

        return result;

      });

  } catch (error) {

    groups = [];

  }

}


function saveGroups() {

  localStorage.setItem(
    GROUP_KEY,
    JSON.stringify(groups)
  );

}


/* =========================================================
   그룹 정리
========================================================= */

function cleanGroups() {

  const applicantSet =
    new Set(applicants);

  groups =
    groups.map(function(group) {

      return group.map(function(name) {

        if (
          name &&
          applicantSet.has(name)
        ) {

          return name;

        }

        return "";

      });

    });


  /*
    중복 봉사자가 생기지 않도록
    앞쪽 그룹을 우선 유지
  */

  const used =
    new Set();


  groups =
    groups.map(function(group) {

      return group.map(function(name) {

        if (!name) {
          return "";
        }

        if (used.has(name)) {
          return "";
        }

        used.add(name);

        return name;

      });

    });


  saveGroups();

}


/* =========================================================
   그룹 추가
========================================================= */

function addGroup() {

  groups.push([
    "",
    "",
    "",
    ""
  ]);

  saveGroups();

  renderAdmin();

  renderService();

}


/* =========================================================
   그룹 삭제
========================================================= */

function deleteGroup(index) {

  if (
    !confirm(
      (index + 1) +
      "번 그룹을 삭제하시겠습니까?"
    )
  ) {

    return;

  }

  groups.splice(
    index,
    1
  );

  saveGroups();

  selectedApplicant = null;

  renderAdmin();

  renderService();

}


/* =========================================================
   그룹 렌더링
========================================================= */

function renderGroups() {

  const box =
    document.getElementById("groups");

  box.innerHTML = "";


  if (groups.length === 0) {

    box.innerHTML =
      '<div class="service-empty">' +
      '아직 만든 봉사 그룹이 없습니다.<br>' +
      '「+ 봉사 그룹 추가」를 눌러 그룹을 만들어 주세요.' +
      '</div>';

    return;

  }


  groups.forEach(
    function(group, groupIndex) {

      const card =
        document.createElement("div");

      card.className =
        "group-card";


      const header =
        document.createElement("div");

      header.className =
        "group-header";


      const title =
        document.createElement("div");

      title.className =
        "group-title";

      title.textContent =
        (groupIndex + 1) +
        "번 그룹";


      const deleteButton =
        document.createElement("button");

      deleteButton.type =
        "button";

      deleteButton.className =
        "delete-group";

      deleteButton.textContent =
        "삭제";

      deleteButton.onclick =
        function() {

          deleteGroup(
            groupIndex
          );

        };


      header.appendChild(title);

      header.appendChild(
        deleteButton
      );


      const slots =
        document.createElement("div");

      slots.className =
        "group-slots";


      group.forEach(
        function(name, slotIndex) {

          const slot =
            document.createElement("button");

          slot.type =
            "button";

          slot.className =
            "group-slot";


          if (name) {

            slot.classList.add(
              "filled"
            );

            slot.textContent =
              name;

          } else {

            slot.classList.add(
              "empty"
            );

            slot.textContent =
              "빈 자리";

          }


          slot.onclick =
            function() {

              handleSlotClick(
                groupIndex,
                slotIndex
              );

            };


          slots.appendChild(slot);

        }
      );


      card.appendChild(header);

      card.appendChild(slots);

      box.appendChild(card);

    }
  );

}


/* =========================================================
   슬롯에 봉사자 배치
========================================================= */

function handleSlotClick(
  groupIndex,
  slotIndex
) {

  const currentName =
    groups[groupIndex][slotIndex];


  /*
    이미 사람이 들어있는 슬롯을 누르면
    그 사람을 비움
  */

  if (currentName) {

    groups[groupIndex][slotIndex] =
      "";

    saveGroups();

    renderAdmin();

    renderService();

    return;

  }


  /*
    선택된 봉사자가 없으면 안내
  */

  if (!selectedApplicant) {

    alert(
      "먼저 위에서 봉사자 이름을 선택해 주세요."
    );

    return;

  }


  /*
    다른 그룹에 이미 배치되어 있다면
    먼저 기존 위치에서 제거
  */

  groups =
    groups.map(function(group) {

      return group.map(function(name) {

        return name === selectedApplicant
          ? ""
          : name;

      });

    });


  groups[groupIndex][slotIndex] =
    selectedApplicant;


  saveGroups();


  selectedApplicant = null;


  renderAdmin();

  renderService();

}


/* =========================================================
   봉사하기 화면
========================================================= */

function renderService() {

  const list =
    document.getElementById("serviceList");

  if (!list) {
    return;
  }

  list.innerHTML = "";


  if (groups.length === 0) {

    list.innerHTML =
      '<div class="service-empty">' +
      '관리자용에서 봉사 그룹을 만들어 주세요.' +
      '</div>';

    return;

  }


  groups.forEach(
    function(group, index) {

      const area =
        SERVICE_AREAS[index];


      const card =
        document.createElement("div");

      card.className =
        "service-card";


      const head =
        document.createElement("div");

      head.className =
        "service-head";


      const number =
        document.createElement("div");

      number.className =
        "service-number";


      if (area) {

        number.textContent =
          area.number;

      } else {

        number.textContent =
          index + 1;

      }


      const name =
        document.createElement("div");

      name.className =
        "service-name";


      if (area) {

        name.textContent =
          area.name;

      } else {

        name.textContent =
          "봉사 구역 " +
          (index + 1);

      }


      head.appendChild(number);

      head.appendChild(name);


      const detail =
        document.createElement("div");

      detail.className =
        "service-detail";


      if (area) {

        detail.textContent =
          "호 " +
          area.ho +
          " · " +
          area.m;

      } else {

        detail.textContent =
          "등록된 봉사 구역 정보가 없습니다.";

      }


      const volunteers =
        document.createElement("div");

      volunteers.className =
        "service-volunteers";


      group.forEach(function(person) {

        const personBox =
          document.createElement("div");

        personBox.className =
          "service-person";

        personBox.textContent =
          person || "빈 자리";

        volunteers.appendChild(
          personBox
        );

      });


      card.appendChild(head);

      card.appendChild(detail);

      card.appendChild(volunteers);

      list.appendChild(card);

    }
  );

}


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

  document
    .getElementById("settingsPanel")
    .classList.toggle("show");

}


function setTheme(theme) {

  if (theme === "light") {

    document.body.classList.add(
      "light"
    );

    localStorage.setItem(
      "saturdayTheme",
      "light"
    );

  } else {

    document.body.classList.remove(
      "light"
    );

    localStorage.setItem(
      "saturdayTheme",
      "dark"
    );

  }

  updateSettingButtons();

}


function setFontSize(size) {

  document.documentElement.style.fontSize =
    size + "%";

  localStorage.setItem(
    "saturdayFontSize",
    String(size)
  );

  updateSettingButtons();

}


function loadSettings() {

  const theme =
    localStorage.getItem(
      "saturdayTheme"
    ) || "dark";


  const fontSize =
    localStorage.getItem(
      "saturdayFontSize"
    ) || "100";


  setTheme(theme);

  setFontSize(
    Number(fontSize)
  );

}


function updateSettingButtons() {

  const theme =
    document.body.classList.contains(
      "light"
    )
      ? "light"
      : "dark";


  document
    .getElementById("darkButton")
    .classList.toggle(
      "active",
      theme === "dark"
    );


  document
    .getElementById("lightButton")
    .classList.toggle(
      "active",
      theme === "light"
    );

}


/* =========================================================
   설정창 바깥 클릭
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const panel =
      document.getElementById(
        "settingsPanel"
      );

    const button =
      document.querySelector(
        ".top-right"
      );


    if (
      panel.classList.contains("show") &&
      !panel.contains(event.target) &&
      !button.contains(event.target)
    ) {

      panel.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   관리자 신청자 자동 갱신
========================================================= */

setInterval(
  function() {

    if (
      currentView === "admin"
    ) {

      loadApplicants();

    }

  },
  10000
);


/* =========================================================
   봉사하기 화면 자동 갱신
========================================================= */

setInterval(
  function() {

    if (
      currentView === "service"
    ) {

      loadGroups();

      renderService();

    }

  },
  5000
);

</script>
