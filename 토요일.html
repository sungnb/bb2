<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>토요일 관리자</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #303030 0%,
            #171717 45%,
            #0b0b0b 100%
        );

    color: #ffffff;

    padding-top: 70px;
    padding-bottom: 90px;

    transition:
        background 0.25s,
        color 0.25s;
}

/* =========================================================
   밝은 화면
========================================================= */

body.light {
    background:
        radial-gradient(
            circle at top,
            #ffffff 0%,
            #eeeeee 50%,
            #dddddd 100%
        );

    color: #111111;
}

/* =========================================================
   상단
========================================================= */

.top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 60px;

    display: flex;
    align-items: center;

    padding: 0 14px;

    background: rgba(20,20,20,0.92);

    backdrop-filter: blur(12px);

    z-index: 1000;

    border-bottom:
        1px solid rgba(255,255,255,0.08);
}

body.light .top-bar {
    background: rgba(255,255,255,0.94);

    border-bottom:
        1px solid rgba(0,0,0,0.08);
}

/* =========================================================
   뒤로가기
========================================================= */

.back-button {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 12px;

    background: rgba(255,255,255,0.08);

    color: inherit;

    font-size: 24px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

body.light .back-button {
    background: rgba(0,0,0,0.06);
}

/* =========================================================
   제목
========================================================= */

.top-title {
    flex: 1;

    text-align: center;

    font-size: 21px;
    font-weight: 800;

    margin-left: 8px;
}

/* =========================================================
   설정
========================================================= */

.settings-button {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 12px;

    background: rgba(255,255,255,0.08);

    color: inherit;

    font-size: 21px;

    cursor: pointer;
}

body.light .settings-button {
    background: rgba(0,0,0,0.06);
}

/* =========================================================
   설정 패널
========================================================= */

.settings-panel {
    position: fixed;

    top: 66px;
    right: 12px;

    width: 230px;

    padding: 16px;

    border-radius: 16px;

    background: rgba(35,35,35,0.98);

    box-shadow:
        0 12px 30px rgba(0,0,0,0.35);

    display: none;

    z-index: 1100;
}

body.light .settings-panel {
    background: rgba(255,255,255,0.98);

    box-shadow:
        0 12px 30px rgba(0,0,0,0.18);
}

.settings-panel.show {
    display: block;
}

.settings-title {
    font-size: 15px;
    font-weight: 800;

    margin-bottom: 10px;
}

.settings-row {
    display: flex;
    gap: 8px;

    margin-bottom: 14px;
}

.settings-row button {
    flex: 1;

    border: none;
    border-radius: 10px;

    padding: 9px 6px;

    cursor: pointer;

    background: #444;
    color: #fff;
}

body.light .settings-row button {
    background: #eeeeee;
    color: #111;
}

.settings-row button.active {
    outline: 2px solid #4da3ff;
}

/* =========================================================
   본문
========================================================= */

.container {
    width: min(720px, calc(100% - 24px));

    margin: 0 auto;
}

/* =========================================================
   페이지 제목
========================================================= */

.page-title {
    text-align: center;

    font-size: 25px;
    font-weight: 900;

    margin-top: 14px;
    margin-bottom: 6px;
}

.page-subtitle {
    text-align: center;

    font-size: 14px;

    opacity: 0.72;

    margin-bottom: 20px;
}

/* =========================================================
   신청자 현황
========================================================= */

.status-box {
    padding: 15px 16px;

    border-radius: 16px;

    background: rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.08);

    margin-bottom: 18px;

    text-align: center;
}

body.light .status-box {
    background: rgba(255,255,255,0.72);

    border:
        1px solid rgba(0,0,0,0.08);
}

.status-number {
    font-size: 27px;
    font-weight: 900;

    margin-right: 4px;
}

/* =========================================================
   섹션 제목
========================================================= */

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin: 22px 2px 10px;

    font-size: 17px;
    font-weight: 900;
}

.section-count {
    font-size: 13px;

    opacity: 0.65;
}

/* =========================================================
   미배정 목록
========================================================= */

.unassigned-list {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}

.unassigned-person {
    min-height: 48px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,0.10);

    background:
        rgba(255,255,255,0.07);

    color: inherit;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    user-select: none;

    transition:
        transform 0.15s,
        background 0.15s,
        border 0.15s;
}

body.light .unassigned-person {
    background:
        rgba(255,255,255,0.75);

    border:
        1px solid rgba(0,0,0,0.08);
}

.unassigned-person:active {
    transform: scale(0.97);
}

.unassigned-person.selected {
    background: #1769aa;

    border-color: #4da3ff;

    color: #ffffff;

    box-shadow:
        0 0 0 2px rgba(77,163,255,0.20);
}

/* =========================================================
   안내
========================================================= */

.help-box {
    margin-top: 10px;

    padding: 11px 13px;

    border-radius: 12px;

    background:
        rgba(77,163,255,0.10);

    border:
        1px solid rgba(77,163,255,0.20);

    font-size: 13px;

    line-height: 1.5;

    text-align: center;

    opacity: 0.9;
}

/* =========================================================
   그룹
========================================================= */

.groups {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

/* =========================================================
   그룹 카드
========================================================= */

.group-card {
    border-radius: 17px;

    padding: 13px;

    background:
        rgba(255,255,255,0.065);

    border:
        1px solid rgba(255,255,255,0.09);
}

body.light .group-card {
    background:
        rgba(255,255,255,0.78);

    border:
        1px solid rgba(0,0,0,0.08);
}

/* =========================================================
   그룹 상단
========================================================= */

.group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 10px;
}

.group-title {
    font-size: 17px;
    font-weight: 900;
}

.group-actions {
    display: flex;
    gap: 6px;
}

.group-actions button {
    border: none;

    border-radius: 9px;

    padding: 6px 9px;

    font-size: 12px;

    cursor: pointer;

    background:
        rgba(255,255,255,0.10);

    color: inherit;
}

body.light .group-actions button {
    background:
        rgba(0,0,0,0.07);
}

/* =========================================================
   4명 슬롯
========================================================= */

.slots {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;
}

.slot {
    min-height: 60px;

    border-radius: 12px;

    border:
        1px dashed rgba(255,255,255,0.20);

    background:
        rgba(0,0,0,0.13);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 6px;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    user-select: none;

    transition:
        background 0.15s,
        border 0.15s,
        transform 0.15s;
}

body.light .slot {
    background:
        rgba(0,0,0,0.035);

    border:
        1px dashed rgba(0,0,0,0.20);
}

.slot.empty {
    opacity: 0.58;
}

.slot.available {
    border-color: #4da3ff;

    background:
        rgba(77,163,255,0.12);
}

.slot.filled {
    border-style: solid;

    border-color:
        rgba(255,255,255,0.14);

    background:
        rgba(255,255,255,0.09);
}

body.light .slot.filled {
    border-color:
        rgba(0,0,0,0.12);

    background:
        rgba(0,0,0,0.045);
}

.slot:active {
    transform: scale(0.97);
}

/* =========================================================
   그룹 추가
========================================================= */

.add-group-button {
    width: 100%;

    margin-top: 15px;

    min-height: 50px;

    border: none;

    border-radius: 14px;

    background:
        rgba(77,163,255,0.14);

    border:
        1px solid rgba(77,163,255,0.28);

    color: inherit;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;
}

/* =========================================================
   하단 메뉴
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 70px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 6px;

    padding: 8px 10px;

    background:
        rgba(15,15,15,0.94);

    backdrop-filter: blur(12px);

    border-top:
        1px solid rgba(255,255,255,0.08);

    z-index: 1000;
}

body.light .bottom-nav {
    background:
        rgba(255,255,255,0.95);

    border-top:
        1px solid rgba(0,0,0,0.08);
}

.bottom-nav button {
    border: none;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.07);

    color: inherit;

    font-size: 13px;
    font-weight: 800;

    cursor: pointer;
}

body.light .bottom-nav button {
    background:
        rgba(0,0,0,0.055);
}

.bottom-nav button.active {
    background:
        rgba(77,163,255,0.18);

    color: #4da3ff;
}

/* =========================================================
   모바일
========================================================= */

@media (max-width: 420px) {

    .unassigned-list {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .unassigned-person {
        font-size: 13px;
        min-height: 46px;
    }

    .slot {
        min-height: 58px;
        font-size: 12px;
    }

    .group-title {
        font-size: 16px;
    }
}

</style>

</head>

<body>

<!-- =======================================================
     상단
======================================================= -->

<header class="top-bar">

```
<button
    class="back-button"
    onclick="history.back()"
    aria-label="뒤로가기">
    ‹
</button>

<div class="top-title">
    토요일
</div>

<button
    class="settings-button"
    onclick="toggleSettings()"

    ⚙
</button>
```

</header>

<!-- =======================================================
     설정
======================================================= -->

<div
    id="settingsPanel"
    class="settings-panel">

```
<div class="settings-title">

</div>

<div class="settings-row">

    <button
        id="darkButton"

<div class="settings-title">

</div>

<div class="settings-row">

    </button>

    <button id="fontValue">

```

</div>

<!-- =======================================================

<main class="container">

```

<div class="page-subtitle">

<div class="status-box">

    <span
        id="applicantCount"

<!-- ===================================================

<div class="section-title">

    <span

<script>

/* =========================================================
   기본 설정
========================================================= */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxfv41gmvsmjV6-xI7OFvZujsvHWOYkfeqALvPIn1AEeW42gtAQ8prog7J6QG2pr2fV/exec";


const THEME_KEY =
    "saturdayTheme";

const FONT_KEY =
    "saturdayFont";

const GROUP_KEY =
    "saturdayVolunteerGroups";


/* =========================================================
   자매 명단
========================================================= */

const SISTERS = [

    "강효선",
    "계영혜",
    "권영란",
    "권효정",
    "김가희",
    "김남희",
    "김수영",
    "김정순",
    "김현심",
    "맹희주",
    "민순자",
    "박미화",
    "박수은",
    "박정은",
    "박한별",
    "박현주",
    "손예진",
    "송효자",
    "안순옥",
    "오미경",
    "오미나",
    "오승비",
    "오슬원",
    "이영자",
    "이윤부",
    "이혜자",
    "임창숙"

];


/* =========================================================
   상태
========================================================= */

let currentTheme =
    localStorage.getItem(THEME_KEY) || "dark";

let currentFont =
    Number(localStorage.getItem(FONT_KEY)) || 100;


/*
   그룹 구조

   [
       ["강효선","계영혜","권영란","권효정"],
       ["김가희","김남희",...],
       ...
   ]

*/

let groups =
    loadGroups();


let selectedPerson =
    null;


/* =========================================================
   초기 실행
========================================================= */

applyTheme();

applyFont();

renderGroups();

loadApplicants();


/* =========================================================
   설정
========================================================= */

function toggleSettings() {

    const panel =
        document.getElementById(
            "settingsPanel"
        );

    panel.classList.toggle("show");
}


function setTheme(theme) {

    currentTheme =
        theme;

    localStorage.setItem(
        THEME_KEY,
        theme
    );

    applyTheme();
}


function applyTheme() {

    document.body.classList.toggle(
        "light",
        currentTheme === "light"
    );

    document
        .getElementById("darkButton")
        .classList.toggle(
            "active",
            currentTheme === "dark"
        );

    document
        .getElementById("lightButton")
        .classList.toggle(
            "active",
            currentTheme === "light"
        );
}


function changeFont(value) {

    currentFont += value;

    if (currentFont < 80) {
        currentFont = 80;
    }

    if (currentFont > 150) {
        currentFont = 150;
    }

    localStorage.setItem(
        FONT_KEY,
        currentFont
    );

    applyFont();
}


function applyFont() {

    document.documentElement.style.fontSize =
        currentFont + "%";

    document
        .getElementById("fontValue")
        .textContent =
        currentFont + "%";
}


/* =========================================================
   신청자 불러오기
========================================================= */

function loadApplicants() {

    fetch(
        GOOGLE_SCRIPT_URL +
        "?action=applicants"
    )

    .then(response => response.json())

    .then(data => {

        if (
            !data ||
            data.success !== true
        ) {
            throw new Error(
                "신청자 자료를 불러오지 못했습니다."
            );
        }

        const applicants =
            Array.isArray(data.applicants)
                ? data.applicants
                : [];

        /*
           현재 테스트는 자매 27명만 사용
        */

        const sisterApplicants =
            applicants.filter(
                name =>
                    SISTERS.includes(name)
            );

        renderApplicants(
            sisterApplicants
        );

    })

    .catch(error => {

        console.error(error);

        document
            .getElementById(
                "unassignedList"
            )
            .innerHTML =
            `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:20px;
                opacity:.7;
            ">
                신청자 자료를 불러오지 못했습니다.
            </div>
            `;

    });
}


/* =========================================================
   신청자 표시
========================================================= */

function renderApplicants(applicants) {

    document
        .getElementById(
            "applicantCount"
        )
        .textContent =
        applicants.length;


    renderUnassigned(
        applicants
    );

    renderGroups();

}


/* =========================================================
   미배정 목록
========================================================= */

function renderUnassigned(applicants) {

    const list =
        document.getElementById(
            "unassignedList"
        );


    const assigned =
        new Set(
            groups.flat()
        );


    const unassigned =
        applicants.filter(
            name =>
                !assigned.has(name)
        );


    document
        .getElementById(
            "unassignedCount"
        )
        .textContent =
        unassigned.length + "명";


    list.innerHTML = "";


    if (unassigned.length === 0) {

        list.innerHTML =
            `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:20px;
                opacity:.65;
            ">
                모든 신청자가 배정되었습니다.
            </div>
            `;

        return;
    }


    unassigned.forEach(name => {

        const button =
            document.createElement("button");

        button.className =
            "unassigned-person";


        if (
            selectedPerson === name
        ) {
            button.classList.add(
                "selected"
            );
        }


        button.textContent =
            name;


        button.onclick =
            () => selectPerson(name);


        list.appendChild(button);

    });
}


/* =========================================================
   자매 선택
========================================================= */

function selectPerson(name) {

    if (
        selectedPerson === name
    ) {

        selectedPerson =
            null;

    } else {

        selectedPerson =
            name;

    }


    /*
       선택 상태를 다시 그려줌
    */

    refreshCurrentDisplay();
}


/* =========================================================
   그룹 표시
========================================================= */

function renderGroups() {

    const container =
        document.getElementById(
            "groups"
        );


    container.innerHTML = "";


    document
        .getElementById(
            "groupCount"
        )
        .textContent =
        groups.length + "그룹";


    groups.forEach(
        (group, groupIndex) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "group-card";


            /*
               그룹 상단
            */

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "group-header";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "group-title";

            title.textContent =
                (groupIndex + 1) +
                "번 그룹";


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "group-actions";


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.textContent =
                "삭제";


            deleteButton.onclick =
                () =>
                    deleteGroup(
                        groupIndex
                    );


            actions.appendChild(
                deleteButton
            );


            header.appendChild(
                title
            );

            header.appendChild(
                actions
            );


            /*
               4개 슬롯
            */

            const slots =
                document.createElement(
                    "div"
                );

            slots.className =
                "slots";


            for (
                let slotIndex = 0;
                slotIndex < 4;
                slotIndex++
            ) {

                const slot =
                    document.createElement(
                        "div"
                    );

                slot.className =
                    "slot";


                const person =
                    group[slotIndex];


                if (person) {

                    slot.classList.add(
                        "filled"
                    );

                    slot.textContent =
                        person;


                    slot.onclick =
                        () =>
                            removePerson(
                                groupIndex,
                                slotIndex
                            );

                } else {

                    slot.classList.add(
                        "empty"
                    );

                    slot.textContent =
                        "빈칸";


                    if (selectedPerson) {

                        slot.classList.add(
                            "available"
                        );

                    }


                    slot.onclick =
                        () =>
                            assignPerson(
                                groupIndex,
                                slotIndex
                            );
                }


                slots.appendChild(
                    slot
                );
            }


            card.appendChild(
                header
            );

            card.appendChild(
                slots
            );

            container.appendChild(
                card
            );
        }
    );


    renderUnassignedFromGroups();
}


/* =========================================================
   그룹에 자매 배정
========================================================= */

function assignPerson(
    groupIndex,
    slotIndex
) {

    if (!selectedPerson) {

        alert(
            "먼저 자매 이름을 선택해 주세요."
        );

        return;
    }


    if (
        groups[groupIndex][slotIndex]
    ) {

        return;
    }


    /*
       혹시 이미 다른 그룹에 있는지 확인
    */

    const alreadyAssigned =
        groups.some(
            group =>
                group.includes(
                    selectedPerson
                )
        );


    if (alreadyAssigned) {

        selectedPerson =
            null;

        refreshCurrentDisplay();

        return;
    }


    groups[groupIndex][slotIndex] =
        selectedPerson;


    selectedPerson =
        null;


    saveGroups();

    renderGroups();
}


/* =========================================================
   배정 취소
========================================================= */

function removePerson(
    groupIndex,
    slotIndex
) {

    const person =
        groups[groupIndex][slotIndex];


    if (!person) {
        return;
    }


    const ok =
        confirm(
            person +
            " 자매를 미배정 상태로 돌릴까요?"
        );


    if (!ok) {
        return;
    }


    groups[groupIndex][slotIndex] =
        "";


    saveGroups();

    renderGroups();
}


/* =========================================================
   그룹 추가
========================================================= */

function addGroup() {

    groups.push([
        "",
        "",
        "",
        ""
    ]);


    saveGroups();

    renderGroups();


    /*
       새 그룹이 보이도록 이동
    */

    setTimeout(
        () => {

            window.scrollTo({
                top:
                    document.body.scrollHeight,
                behavior:
                    "smooth"
            });

        },
        50
    );
}


/* =========================================================
   그룹 삭제
========================================================= */

function deleteGroup(index) {

    const group =
        groups[index];


    const members =
        group.filter(
            name => name
        );


    if (
        members.length > 0
    ) {

        const ok =
            confirm(
                (index + 1) +
                "번 그룹을 삭제하면\n" +
                "그룹에 들어있는 자매가\n" +
                "모두 미배정 상태로 돌아갑니다.\n\n" +
                "삭제할까요?"
            );


        if (!ok) {
            return;
        }
    }


    groups.splice(
        index,
        1
    );


    saveGroups();

    renderGroups();
}


/* =========================================================
   그룹 저장
========================================================= */

function saveGroups() {

    localStorage.setItem(
        GROUP_KEY,
        JSON.stringify(groups)
    );
}


/* =========================================================
   그룹 불러오기
========================================================= */

function loadGroups() {

    try {

        const saved =
            localStorage.getItem(
                GROUP_KEY
            );


        if (!saved) {

            /*
               처음 시작하면
               1번 그룹부터 시작
            */

            return [
                ["","","",""]
            ];
        }


        const parsed =
            JSON.parse(saved);


        if (
            !Array.isArray(parsed)
        ) {

            return [
                ["","","",""]
            ];
        }


        return parsed.map(
            group => {

                const result =
                    Array.isArray(group)
                        ? group.slice(0,4)
                        : [];


                while (
                    result.length < 4
                ) {
                    result.push("");
                }


                return result;
            }
        );

    } catch (error) {

        console.error(error);

        return [
            ["","","",""]
        ];
    }
}


/* =========================================================
   현재 화면 다시 그리기
========================================================= */

function refreshCurrentDisplay() {

    renderGroups();
}


/* =========================================================
   미배정 목록 다시 표시
========================================================= */

function renderUnassignedFromGroups() {

    /*
       현재 신청자 목록을 다시 가져오는 대신
       화면에 이미 표시된 신청자 정보를
       다시 서버에서 받아옵니다.
    */

    fetch(
        GOOGLE_SCRIPT_URL +
        "?action=applicants"
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        if (
            !data ||
            data.success !== true
        ) {
            return;
        }


        const applicants =
            Array.isArray(data.applicants)
                ? data.applicants
                : [];


        const sisterApplicants =
            applicants.filter(
                name =>
                    SISTERS.includes(name)
            );


        const assigned =
            new Set(
                groups.flat()
            );


        const unassigned =
            sisterApplicants.filter(
                name =>
                    !assigned.has(name)
            );


        const list =
            document.getElementById(
                "unassignedList"
            );


        document
            .getElementById(
                "unassignedCount"
            )
            .textContent =
            unassigned.length + "명";


        list.innerHTML = "";


        if (
            unassigned.length === 0
        ) {

            list.innerHTML =
                `
                <div style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:20px;
                    opacity:.65;
                ">
                    모든 신청자가 배정되었습니다.
                </div>
                `;

            return;
        }


        unassigned.forEach(
            name => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "unassigned-person";


                if (
                    selectedPerson === name
                ) {

                    button.classList.add(
                        "selected"
                    );
                }


                button.textContent =
                    name;


                button.onclick =
                    () =>
                        selectPerson(name);


                list.appendChild(
                    button
                );

            }
        );

    })

    .catch(error => {

        console.error(error);

    });
}


/* =========================================================
   주기적으로 신청자 새로 확인
========================================================= */

/*
   다른 휴대폰에서 새로 신청한 사람이 생겼다면
   관리자 화면에도 자동 반영됩니다.
*/

setInterval(
    () => {

        loadApplicants();

    },
    10000
);


/* =========================================================
   화면 바깥 클릭 시 설정 닫기
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const panel =
            document.getElementById(
                "settingsPanel"
            );

        const button =
            document.querySelector(
                ".settings-button"
            );


        if (
            panel.classList.contains("show") &&
            !panel.contains(event.target) &&
            !button.contains(event.target)
        ) {

            panel.classList.remove(
                "show"
            );
        }

    }
);

</script>
