   기본 설정
============================================================ */

============================================================ */

main{

/* ============================================================
   검색 영역
============================================================ */

/* ============================================================
   회의록 카드
============================================================ */

.card{

  border-radius:16px;

   카드 헤더

   2026년 8월 4일 · 오후 9:20 · 삼양 왕국회관 2층

============================================================ */

.card-head{

  padding:15px 16px;

  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  user-select:none;

}

  min-width:0;

.card-title{

  font-size:16px;

  font-weight:850;

  color:#27312e;

}


.card-meta{

  margin-top:5px;

  font-size:12px;

  color:#71807a;

  font-weight:500;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

/* ============================================================

============================================================ */

.chevron{

  width:24px;

  text-align:center;

  color:#74807b;

  font-size:16px;

  transition:
    transform .2s ease;

}


.card.open .chevron{

  transform:rotate(180deg);

}


/* ============================================================
   펼쳐지는 영역
============================================================ */

.card-content{

  display:none;

  border-top:
    1px solid #e6ece9;

  padding:14px 14px 20px;

}


.card.open .card-content{

  display:block;

}


/* ============================================================
   기본 정보
============================================================ */

.info-box{

  background:#f6f8f7;

  border:
    1px solid #e0e7e3;

  border-radius:13px;

  padding:8px 12px;

  margin-bottom:18px;

}


.info-row{

  display:grid;

  grid-template-columns:76px 1fr;

  gap:10px;

  padding:6px 0;

  font-size:13px;

}

    1px solid #e5ebe8;

}


.info-label{

  font-weight:800;

  color:#51605a;

}


.info-value{

  color:#303a36;

  word-break:break-word;

}


/* ============================================================
   섹션 강조 버튼

   안건 / 회의 내용

   ★ 요청사항 반영 ★

   단순 글자가 아니라
   부드러운 색상의 버튼처럼 보이도록 구성
============================================================ */

.section-label{

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  min-height:43px;

  margin:18px 0 12px;

  padding:9px 14px;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #e2f0eb,
      #d7ebe4
    );

  border:
    1px solid #c8dfd6;

  color:#286b5b;

  font-size:14px;

  font-weight:900;

  letter-spacing:-0.02em;

  box-shadow:
    0 2px 5px rgba(40,107,91,.05);

}


/* ============================================================
   회의 내용 강조 버튼
============================================================ */

.section-label.content-label{

  background:
    linear-gradient(
      135deg,
      #e7edf5,
      #dde7f1
    );

  border-color:#cfdbe7;

  color:#4c607f;

}


/* ============================================================
   안건 목록
============================================================ */

.bullet-list{

  margin:0;

  padding:0;

  list-style:none;

}


.bullet-list li{

  position:relative;

  margin:8px 0;

  padding:
    10px 13px 10px 30px;

  background:#f8faf9;

  border:
    1px solid #e3eae6;

  border-radius:11px;

  font-size:14px;

  font-weight:600;

  color:#36403c;

  white-space:pre-wrap;

  word-break:break-word;

}


.bullet-list li::before{

  content:"";

  position:absolute;

  left:13px;

  top:50%;

  transform:translateY(-50%);

  width:7px;

  height:7px;

  border-radius:50%;

  background:#4f9684;

}


/* ============================================================
   회의 내용
============================================================ */

.content-list{

  margin:0;

  padding:0;

  list-style:none;

}


.content-item{

  position:relative;

  margin-bottom:11px;

  padding:14px;

  background:#fafbfc;

  border:
    1px solid #e2e7eb;

  border-radius:12px;

}


.content-topic{

  position:relative;

  margin-bottom:9px;

  padding-left:14px;

  font-size:14px;

  font-weight:850;

  color:#37414d;

}


.content-topic::before{

  content:"";

  position:absolute;

  left:0;

  top:.72em;

  width:7px;

  height:7px;

  border-radius:50%;

  background:#607795;

}


.content-detail{

  font-size:14px;

  color:#46504c;

  line-height:1.75;

  white-space:pre-wrap;

  word-break:break-word;

/* ============================================================
   맨 위 버튼
============================================================ */

.top-button{

  position:fixed;

  right:16px;

  bottom:18px;

  width:45px;

  height:45px;

  border:0;

  border-radius:50%;

  background:#286b5b;

  color:white;

  font-size:19px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.18);

  display:none;

  cursor:pointer;

============================================================ */

@media(min-width:700px){

  main{

  }

/* ============================================================
   다크 모드
============================================================ */

body.dark{

}


body.dark header{

}


body.dark .section-label.content-label{

}

body.dark .empty,

</style>

<body>


<!-- ============================================================
     상단
============================================================ -->

<header>

  <div class="header-inner">


    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">

      ‹

    </button>


    <div class="title-area">

      <div class="page-title">
        회의록
      </div>

      <div class="page-subtitle">
        서울북부회중 회의 기록
      </div>

    </div>


    <button
      class="refresh"
      onclick="loadMinutes()">

      새로고침

    </button>


  </div>

</header>


<!-- ============================================================
     본문
============================================================ -->

<main>


  <div class="toolbar">


    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">


    <select
      id="year"
      class="select"
      onchange="render()">

      <option value="all">
        전체
      </option>

    </select>


  </div>


  <div
    id="status"
    class="status">

    회의록을 불러오는 중입니다.

  </div>


  <div
    id="list"
    class="loading">

    잠시만 기다려 주세요.

  </div>


</main>


<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>

/* ============================================================
   Google Apps Script 웹앱 주소
============================================================ */

const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxweQpbKaFVLVTIrqbDsrlekMv_2loBJMMQP0wX5UYYo-CewqXNmR2l3iDBidC8wHon/exec";


/* ============================================================
   데이터 저장

   ★ 중요 ★

   API에서 받은 meetings만 저장합니다.
   샘플 데이터 / 임시 데이터 / 자동 생성 데이터 없음.
============================================================ */

let meetings = [];


/* ============================================================
   HTML 문자 보호
============================================================ */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* ============================================================
   날짜 변환

   지원 형식:

   2026-08-04
   2026년 8월 4일
   2026. 8. 4.
============================================================ */

function parseDate(value){

  const text =
    String(value || "")
      .trim();


  /*
    이미 ISO 형식인 경우
  */

  let match =
    text.match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(match){

    return (
      match[1] +
      "-" +
      match[2] +
      "-" +
      match[3]
    );

  }


  /*
    2026년 8월 4일
  */

  match =
    text.match(
      /(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/
    );


  if(!match){

    /*
      2026. 8. 4.
      2026/8/4
    */

    match =
      text.match(
        /(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/
      );

  }


  if(!match){

    return "";

  }


  return (

    match[1]

    + "-"

    + String(match[2]).padStart(2,"0")

    + "-"

    + String(match[3]).padStart(2,"0")

  );

}


/* ============================================================
   회의 날짜 가져오기
============================================================ */

function getMeetingDate(meeting){

  const date =
    parseDate(
      meeting.date
    );


  if(date){

    return date;

  }


  return parseDate(
    meeting.datetime
  );

}


/* ============================================================
   날짜 → 월 제목
============================================================ */

function getMonthTitle(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return "기타";

  }


  return (

    Number(match[1]) +

    "년 " +

    Number(match[2]) +

    "월"

  );

}


/* ============================================================
   날짜 전체 표시
============================================================ */

function formatDate(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return "";

  }


  return (

    Number(match[1])

    + "년 "

    + Number(match[2])

    + "월 "

    + Number(match[3])

    + "일"

  );

}


/* ============================================================
   시간 표시

   21:20 → 오후 9:20
   15:00 → 오후 3:00
============================================================ */

function getTime(datetime){

  const text =
    String(datetime || "")
      .trim();


  const match =
    text.match(
      /(\d{1,2}):(\d{2})/
    );


  if(!match){

    return "";

  }


  let hour =
    Number(match[1]);


  const minute =
    match[2];


  const period =
    hour >= 12
      ? "오후"
      : "오전";


  let displayHour =
    hour % 12;


  if(displayHour === 0){

    displayHour = 12;

  }


  return (

    period

    + " "

    + displayHour

    + ":"

    + minute

  );

}


/* ============================================================
   연도 목록 생성
============================================================ */

function buildYears(){

  const select =
    document.getElementById(
      "year"
    );


  const current =
    select.value;


  const years =
    [

      ...new Set(

        meetings

          .map(

            function(meeting){

              return String(
                meeting._date || ""
              ).slice(0,4);

            }

          )

          .filter(Boolean)

      )

    ]

    .sort(
      function(a,b){

        return Number(b) - Number(a);

      }
    );


  select.innerHTML =
    '<option value="all">전체</option>';


  years.forEach(

    function(year){

      select.innerHTML +=

        '<option value="' +

        esc(year) +

        '">' +

        esc(year) +

        '년</option>';

    }

  );


  if(

    current === "all" ||

    years.includes(current)

  ){

    select.value =
      current;

  }

  else{

    select.value =
      "all";

  }

}


/* ============================================================
   뒤로가기
============================================================ */

function goBack(){

  if(history.length > 1){

    history.back();

  }

  else{

    location.href =
      "index.html";

  }

}


/* ============================================================
   카드 열기 / 닫기
============================================================ */

function toggleCard(card){

  card.classList.toggle(
    "open"
  );

}


/* ============================================================
   정보 행
============================================================ */

function infoRow(label,value){

  if(

    value === undefined ||

    value === null ||

    String(value).trim() === "" ||

    String(value).trim() === "-"

  ){

    return "";

  }


  return `

    <div class="info-row">

      <div class="info-label">

        ${esc(label)}

      </div>

      <div class="info-value">

        ${esc(value)}

      </div>

    </div>

  `;

}


/* ============================================================
   안건 렌더링
============================================================ */

function renderAgenda(agenda){

  if(

    !Array.isArray(agenda) ||

    agenda.length === 0

  ){

    return "";

  }


  const items =
    agenda.filter(

      function(item){

        return String(item || "")
          .trim();

      }

    );


  if(!items.length){

    return "";

  }


  return `

    <div class="section-label">

      안건

    </div>


    <ul class="bullet-list">

      ${

        items

          .map(

            function(item){

              return `

                <li>

                  ${esc(item)}

                </li>

              `;

            }

          )

          .join("")

      }

    </ul>

  `;

}


/* ============================================================
   회의 내용 렌더링
============================================================ */

function renderContent(content){

  if(

    !Array.isArray(content) ||

    content.length === 0

  ){

    return "";

  }


  const validItems =
    content.filter(

      function(item){

        return (

          String(item?.topic || "")
            .trim()

          ||

          String(item?.detail || "")
            .trim()

        );

      }

    );


  if(!validItems.length){

    return "";

  }


  return `

    <div class="section-label content-label">

      회의 내용

    </div>


    <div class="content-list">

      ${

        validItems

          .map(

            function(item){


              const topic =
                String(
                  item.topic || ""
                ).trim();


              const detail =
                String(
                  item.detail || ""
                ).trim();


              return `

                <div class="content-item">


                  ${

                    topic

                      ? `

                        <div class="content-topic">

                          ${esc(topic)}

                        </div>

                      `

                      : ""

                  }


                  ${

                    detail

                      ? `

                        <div class="content-detail">

                          ${esc(detail)}

                        </div>

                      `

                      : ""

                  }


                </div>

              `;

            }

          )

          .join("")

      }

    </div>

  `;

}


/* ============================================================
   화면 렌더링
============================================================ */

function render(){


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const selectedYear =
    document
      .getElementById("year")
      .value;


  let data =
    meetings.filter(

      function(meeting){


        const date =
          meeting._date;


        const searchText =
          JSON.stringify(meeting)
            .toLowerCase();


        const matchSearch =

          !search ||

          searchText.includes(
            search
          );


        const matchYear =

          selectedYear === "all" ||

          date.startsWith(
            selectedYear
          );


        return (

          matchSearch &&

          matchYear

        );

      }

    );


  /*
    최신순 정렬

    데이터 추가 없음
    데이터 중복 생성 없음
  */

  data.sort(

    function(a,b){

      return (
        b._date.localeCompare(
          a._date
        )
      );

    }

  );


  document
    .getElementById("status")
    .textContent =

      `총 ${data.length}건 · 최신 회의록이 먼저 표시됩니다.`;


  const list =
    document.getElementById(
      "list"
    );


  if(!data.length){

    list.innerHTML =

      '<div class="empty">회의록이 없습니다.</div>';


    return;

  }


  let previousMonth =
    "";


  list.innerHTML =
    data

      .map(

        function(meeting,index){


          const date =
            meeting._date;


          const monthTitle =
            getMonthTitle(
              date
            );


          let monthHtml =
            "";


          if(

            previousMonth !==
            monthTitle

          ){

            monthHtml = `

              <div class="month-title">

                ${esc(monthTitle)}

              </div>

            `;


            previousMonth =
              monthTitle;

          }


          /* ==================================================
             기본 정보
          ================================================== */

          const info =

            infoRow(
              "일시",
              meeting.datetime ||
              formatDate(date)
            )

            +

            infoRow(
              "회의 장소",
              meeting.place
            )

            +

            infoRow(
              "참석자",
              meeting.attendees
            )

            +

            infoRow(
              "불참자",
              meeting.absentees
            )

            +

            infoRow(
              "시작 기도",
              meeting.startPrayer
            )

            +

            infoRow(
              "마치는 기도",
              meeting.endPrayer
            );


          /* ==================================================
             안건
          ================================================== */

          const agendaHtml =
            renderAgenda(
              meeting.agenda
            );


          /* ==================================================
             회의 내용
          ================================================== */

          const contentHtml =
            renderContent(
              meeting.content
            );


          /* ==================================================
             카드

             ★ 중요 ★

             첫 줄 = 회의 제목

             날짜가 제목을 대신하지 않음
          ================================================== */

          return `

            ${monthHtml}


            <article
              class="card"
              id="meeting-${index}">


              <div
                class="card-head"
                onclick="toggleCard(this.parentElement)">


                <div class="card-main">


                  <!-- 회의 제목 -->

                  <div class="card-title">

                    ${esc(
                      meeting.title ||
                      "회의록"
                    )}

                  </div>


                  <!-- 날짜 / 시간 / 장소 -->

                  <div class="card-meta">

                    ${esc(
                      formatDate(date)
                    )}

                    ${

                      getTime(
                        meeting.datetime
                      )

                        ? ` · ${esc(
                            getTime(
                              meeting.datetime
                            )
                          )}`

                        : ""

                    }

                    ${

                      meeting.place

                        ? ` · ${esc(
                            meeting.place
                          )}`

                        : ""

                    }

                  </div>


                </div>


                <div class="chevron">

                  ⌄

                </div>


              </div>


              <!-- 펼쳐지는 내용 -->

              <div class="card-content">


                ${

                  info

                    ? `

                      <div class="info-box">

                        ${info}

                      </div>

                    `

                    : ""

                }


                ${agendaHtml}


                ${contentHtml}


              </div>


            </article>

          `;

        }

      )

      .join("");

}


/* ============================================================
   회의록 불러오기

   ★ 매우 중요 ★

   Apps Script에서 받은 json.meetings를
   그대로 사용합니다.

   removeDuplicates 없음
   샘플 데이터 없음
   추가 데이터 없음

   API가 15개 → 화면도 15개
============================================================ */

async function loadMinutes(){


  const list =
    document.getElementById(
      "list"
    );


  list.innerHTML =

    '<div class="loading">회의록을 불러오는 중입니다...</div>';


  document
    .getElementById("status")
    .textContent =
      "최신 데이터를 확인하는 중입니다.";


  try{


    if(!GAS_WEB_APP_URL){

      throw new Error(
        "Google Apps Script 주소가 없습니다."
      );

    }


    /*
      캐시 방지
    */

    const separator =
      GAS_WEB_APP_URL.includes("?")
        ? "&"
        : "?";


    const requestUrl =

      GAS_WEB_APP_URL

      + separator

      + "t="

      + Date.now();


    const response =
      await fetch(
        requestUrl
      );


    if(!response.ok){

      throw new Error(

        "HTTP " +

        response.status

      );

    }


    const json =
      await response.json();


    if(!json.success){

      throw new Error(

        json.error ||

        "회의록 데이터를 가져오지 못했습니다."

      );

    }


    /* ========================================================
       API 원본 데이터

       제공된 meetings 배열 그대로 사용
    ======================================================== */

    const rawMeetings =

      Array.isArray(
        json.meetings
      )

        ? json.meetings

        : [];


    console.log(
      "API 회의록 수:",
      rawMeetings.length
    );


    /* ========================================================
       날짜만 정상화

       ★ 중복 제거하지 않음
       ★ 데이터 생성하지 않음
       ★ 기존 데이터 변경하지 않음
    ======================================================== */

    meetings =
      rawMeetings

        .map(

          function(meeting){


            const date =
              getMeetingDate(
                meeting
              );


            if(!date){

              return null;

            }


            return {

              ...meeting,

              _date:
                date

            };

          }

        )

        .filter(Boolean);


    console.log(
      "화면 표시 대상 회의록 수:",
      meetings.length
    );


    /*
      연도 목록 생성
    */

    buildYears();


    /*
      화면 표시
    */

    render();


  }

  catch(error){


    console.error(
      "회의록 불러오기 오류:",
      error
    );


    list.innerHTML = `

      <div class="error">

        회의록을 불러오지 못했습니다.

        <br><br>

        ${esc(
          error.message
        )}

      </div>

    `;


    document
      .getElementById("status")
      .textContent =
        "불러오기 실패";

  }

}


/* ============================================================
   맨 위 버튼
============================================================ */

window.addEventListener(

  "scroll",

  function(){


    const button =
      document.getElementById(
        "topButton"
      );


    button.style.display =

      window.scrollY > 500

        ? "block"

        : "none";

  }

);


/* ============================================================
   시작
============================================================ */

loadMinutes();


</script>
