<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#286b5b">
<title>회의록 2026</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:#f3f5f4;
  color:#26302d;
  font-size:15px;
  line-height:1.65;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #dce4e0;
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
}

.back,
.settings-button{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#edf3f0;
  color:#286b5b;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
}

.settings-button{font-size:20px}

.title-area{flex:1;min-width:0}
.page-title{font-size:21px;font-weight:800;letter-spacing:-.04em}
.page-subtitle{margin-top:1px;font-size:11px;color:#7a8580}

.settings-panel{
  display:none;
  position:absolute;
  right:14px;
  top:58px;
  width:220px;
  padding:14px;
  border-radius:14px;
  background:#fff;
  border:1px solid #d9e2de;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  z-index:200;
}

.settings-panel.show{display:block}
.settings-title{font-weight:800;margin-bottom:10px}
.settings-row{display:flex;gap:8px;margin-bottom:10px}

.settings-row button,
.font-size-row button{
  border:0;
  border-radius:9px;
  padding:9px;
  background:#edf3f0;
  color:#286b5b;
  cursor:pointer;
}

.settings-row button{flex:1}
.font-size-row{display:flex;align-items:center;gap:8px}
.font-size-row button{width:38px}
.font-size-value{flex:1;text-align:center}

main{
  max-width:900px;
  margin:auto;
  padding:14px 12px 80px;
}

.toolbar{display:flex;gap:8px;margin-bottom:8px}

.search{
  flex:1;
  min-width:0;
  height:42px;
  padding:0 13px;
  border:1px solid #d7e0dc;
  border-radius:11px;
  background:white;
  font-size:14px;
  outline:none;
}

.status{margin:8px 2px 12px;font-size:12px;color:#74807b}

.meeting-group{margin:18px 0 14px}

.card{
  margin-bottom:10px;
  background:white;
  border:1px solid #d9e2de;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.035);
}

.card-head{
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  user-select:none;
}

.number-badge{
  width:52px;
  min-width:52px;
  height:52px;
  border-radius:11px;
  background:#edf5f2;
  color:#286b5b;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.badge-main{font-size:18px;font-weight:850;line-height:1.15}
.card-main{flex:1;min-width:0}
.card-title{font-size:18px;font-weight:900;color:#27312e;line-height:1.45;word-break:keep-all;letter-spacing:-.03em}
.card-preview{
  margin-top:5px;
  font-size:13px;
  color:#68756f;
  font-weight:500;
  white-space:pre-wrap;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.chevron{
  width:20px;
  text-align:center;
  color:#74807b;
  font-size:15px;
  transition:transform .2s;
}

.card.open .chevron{transform:rotate(180deg)}

.card-content{
  display:none;
  border-top:1px solid #e6ece9;
  padding:13px 13px 18px;
}

.card.open .card-content{display:block}
.meeting-item{padding:10px 0;border-bottom:1px solid #edf1ef;white-space:pre-wrap;word-break:break-word;font-size:14px;color:#36403c}
.meeting-item:last-child{border-bottom:0}
.detail{white-space:pre-wrap;word-break:break-word;font-size:14px;color:#36403c}

.empty{
  background:white;
  border:1px solid #dce4e0;
  border-radius:14px;
  padding:22px 16px;
  color:#6d7873;
}

.error{color:#b33a3a}

.top-button{
  position:fixed;
  right:16px;
  bottom:18px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#286b5b;
  color:white;
  font-size:19px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  display:none;
  cursor:pointer;
}

body.dark{background:#121715;color:#edf3f0}
body.dark header{background:rgba(25,31,28,.97);border-color:#303a36}
body.dark .page-title{color:#f0f5f2}
body.dark .page-subtitle{color:#9ba7a1}
body.dark .back,
body.dark .settings-button{background:#26332e;color:#8fd0b9}
body.dark .search{background:#1c2421;color:#edf3f0;border-color:#394640}
body.dark .card{background:#1a211e;border-color:#35403b}
body.dark .card-title{color:#eef3f0}
body.dark .card-preview{color:#a9b4af}
body.dark .number-badge{background:#24352e;color:#91d0bb}
body.dark .card-content{border-color:#303a36}
body.dark .detail{color:#d7e0dc}
body.dark .status{color:#a9b4af}
body.dark .meeting-item{border-color:#303a36;color:#d7e0dc}
body.dark .settings-panel{background:#1a211e;border-color:#35403b;color:#edf3f0}
body.dark .settings-row button,
body.dark .font-size-row button{background:#26332e;color:#91d0bb}

@media(min-width:700px){
  main{padding-left:20px;padding-right:20px}
  .card-head{padding:15px 17px}
  .card-content{padding:16px 18px 22px}
}

@media(max-width:600px){
  .page-title{font-size:19px}
  .toolbar{gap:6px}
  .settings-panel{right:10px}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <!-- 전시대참여자.html을 참조하여 홈 버튼은 넣지 않고 뒤로가기만 둡니다. -->
    <button class="back" onclick="goBack()" aria-label="뒤로가기">‹</button>

    <div class="title-area">
      <div class="page-title">회의록</div>
      <div class="page-subtitle">서울북부회중 회의 기록 · 2026</div>
    </div>

    <button class="settings-button" onclick="toggleSettings()" aria-label="설정">⚙️</button>

    <div id="settingsPanel" class="settings-panel">
      <div class="settings-title">설정</div>

      <div class="settings-row">
        <button id="lightButton" onclick="setTheme('light')">☀️ 밝게</button>
        <button id="darkButton" onclick="setTheme('dark')">🌙 어둡게</button>
      </div>

      <div class="font-size-row">
        <button onclick="changeFontSize(-5)">−</button>
        <div id="fontSizeValue" class="font-size-value">100%</div>
        <button onclick="changeFontSize(5)">＋</button>
      </div>
    </div>

  </div>
</header>

<main>

  <div class="toolbar">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">
  </div>

  <div id="status" class="status">
    회의록을 불러오는 중입니다...
  </div>

  <div id="list"></div>

</main>

<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">
  ↑
</button>

<script>

/* =========================================================
   전시대참여자.html과 동일한 방식의 Apps Script 호출
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxk62F4H4IfNhTT1v9pifW5mzIcSk-mKzgallaA_M7XNLEcgTM5kY3qL6yn0qCKJ9I/exec";

let meetings = [];


/* =========================================================
   시작
========================================================= */

document.addEventListener("DOMContentLoaded", function() {
  applySettings();
  loadData();
});


/* =========================================================
   데이터 불러오기
   전시대참여자.html 방식 그대로:
   fetch → response.ok → response.json()
   → success 확인 → 화면 출력
========================================================= */

async function loadData() {

  const status =
    document.getElementById("status");

  status.textContent =
    "회의록을 불러오는 중입니다...";

  try {

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "서버 응답 오류: " +
        response.status
      );

    }

    const data =
      await response.json();

    console.log(
      "회의록 API:",
      data
    );


    /*
      전시대참여자.html처럼
      Apps Script의 success 값을 먼저 확인합니다.
    */

    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        data?.error ||
        "데이터를 가져오지 못했습니다."
      );

    }


    /*
      회의록 데이터 위치를 확인합니다.
      우선순위:
      rows → meetings → records → data → values
    */

    let rows = [];

    if (Array.isArray(data.rows)) {
      rows = data.rows;
    }
    else if (Array.isArray(data.meetings)) {
      rows = data.meetings;
    }
    else if (Array.isArray(data.records)) {
      rows = data.records;
    }
    else if (Array.isArray(data.data)) {
      rows = data.data;
    }
    else if (Array.isArray(data.values)) {
      rows = data.values;
    }


    /*
      Apps Script가 회의록을 다른 이름으로
      직접 반환하는 경우도 처리합니다.
    */

    if (
      rows.length === 0 &&
      Array.isArray(data)
    ) {
      rows = data;
    }


    meetings =
      normalizeRows(rows);


    if (meetings.length === 0) {

      throw new Error(
        "번호가 있는 회의록 자료를 찾지 못했습니다."
      );

    }


    render();

  }

  catch (error) {

    console.error(
      "회의록 데이터 로드 오류:",
      error
    );

    status.textContent =
      "자료를 가져오지 못했습니다.";

    document.getElementById(
      "list"
    ).innerHTML = `

      <div class="empty error">

        ❌ 자료를 가져오지 못했습니다.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}


/* =========================================================
   행 하나를 회의록 데이터로 변환
========================================================= */

function rowToObject(row) {

  /*
    구글시트 한 행이 배열인 경우

    [번호, 제목, 내용...]

    형식으로 처리
  */

  if (Array.isArray(row)) {

    return {

      number: row[0] ?? "",

      title: row[1] ?? "",

      detail:
        row
          .slice(2)
          .filter(v => clean(v) !== "")
          .join("\n")

    };

  }


  /*
    Apps Script가 객체 배열을 보내는 경우
  */

  if (
    row &&
    typeof row === "object"
  ) {

    const number =
      row.number ??
      row.no ??
      row.번호 ??
      row["번호"] ??
      row.id ??
      "";

    const title =
      row.title ??
      row.name ??
      row.제목 ??
      row["제목"] ??
      "";

    let detail =
      row.detail ??
      row.content ??
      row.text ??
      row.내용 ??
      row["내용"] ??
      "";


    /*
      내용 필드명이 다른 경우
      번호/제목을 제외한 나머지 값을 내용으로 사용
    */

    if (clean(detail) === "") {

      const ignored = [
        "number",
        "no",
        "번호",
        "id",
        "title",
        "name",
        "제목"
      ];

      detail =
        Object.keys(row)
          .filter(key =>
            !ignored.includes(key)
          )
          .map(key => row[key])
          .filter(value =>
            clean(value) !== ""
          )
          .join("\n");

    }


    return {
      number,
      title,
      detail
    };

  }


  return {
    number: "",
    title: "",
    detail: ""
  };

}


/* =========================================================
   번호에서 첫 숫자 추출

   1     → 1
   1.1   → 1
   1.3   → 1
   1.4   → 1

   2     → 2
   2.1   → 2

   10    → 10
   10.1  → 10
========================================================= */

function mainNumber(value) {

  const s =
    clean(value);

  const match =
    s.match(/^(\d+)/);

  return match
    ? match[1]
    : "";

}


/* =========================================================
   회의록 데이터 정리
========================================================= */

function normalizeRows(rows) {
  const result = [];

  rows.forEach(function(row, index) {
    const r = rowToObject(row);
    const number = clean(r.number);

    if (!number) return;

    const group = mainNumber(number);
    if (!group) return;

    result.push({
      number,
      group,
      title: clean(r.title),
      detail: clean(r.detail),
      index
    });
  });

  return result;
}


/* =========================================================
   회의록 1개로 묶기

   예:
   1     → 회의 제목
   1-1   → 일시
   1-2   → 회의장소
   1-3   → 참석자
   1-4   → 불참자
   1-5   → 시작기도
   1-6   → 마치는기도
   1-7   → 안건
   1-8   → 회의 내용

   번호는 내부에서 회의 구분용으로만 사용하고
   화면에는 표시하지 않습니다.
========================================================= */
function isGenericTitle(text) {
  return /^회의록\s*\d+(?:[-.]\d+)?$/i.test(clean(text));
}


/*
  시트의 번호는 화면에 표시하지 않습니다.
  예:
  "1 서울북부회중 정기장로모임" → "서울북부회중 정기장로모임"
  "서울북부회중 임시장로모임11" → "서울북부회중 임시장로모임"
  "1-1 일시" → "일시"
*/
function removeCellNumber(text) {
  let s = clean(text);

  // 앞에 붙은 셀 번호 제거
  s = s.replace(/^\s*\d+(?:[-.]\d+)*\s*/, "");

  // 뒤에 붙은 셀 번호 제거
  s = s.replace(/\s*\d+(?:[-.]\d+)*\s*$/, "");

  return clean(s);
}


function displayTitle(text) {
  return removeCellNumber(text);
}


function displayDetail(text) {
  let s = clean(text);

  // 내용의 실제 숫자(날짜, 시간, 인원수 등)는 보존해야 하므로
  // 앞에 붙은 셀 번호만 제거합니다.
  s = s.replace(/^\s*\d+(?:[-.]\d+)*\s*/, "");

  return clean(s);
}


function rowText(item) {
  const title = displayTitle(item.title);
  const detail = displayDetail(item.detail);

  if (title && !isGenericTitle(title) && detail) {
    return title + " " + detail;
  }

  if (title && !isGenericTitle(title)) {
    return title;
  }

  return detail;
}


function buildMeetings(items) {
  const groups = {};

  items.forEach(function(item) {
    if (!groups[item.group]) {
      groups[item.group] = [];
    }
    groups[item.group].push(item);
  });

  return Object.keys(groups)
    .sort(function(a, b) {
      return Number(a) - Number(b);
    })
    .map(function(groupNumber) {
      const items = groups[groupNumber]
        .slice()
        .sort(function(a, b) {
          return a.index - b.index;
        });

      // 정확히 1번, 2번, 3번...인 행을 회의 제목으로 사용
      const main = items.find(function(item) {
        return item.number === groupNumber;
      }) || items[0];

      const subItems = items.filter(function(item) {
        return item !== main;
      });

      // 1-1 / 2-1 ... 은 날짜이므로 접힌 화면에서도 함께 표시
      const dateItem = subItems.find(function(item) {
        return (
          item.number === groupNumber + "-1" ||
          item.number === groupNumber + ".1"
        );
      });

      const title = displayTitle(main.title) || rowText(main) || ("회의 기록 " + groupNumber);

      // 1-1 / 2-1 행의 "내용" 셀을 실제 일시로 사용합니다.
      // 제목 셀의 "일시" 같은 라벨은 붙이지 않고 날짜/시간 값만 정확히 표시합니다.
      const date = dateItem
        ? displayDetail(dateItem.detail) || displayTitle(dateItem.title)
        : "";

      const details = subItems.filter(function(item) {
        return item !== dateItem;
      });

      return {
        group: groupNumber,
        title,
        date,
        details,
        index: main.index
      };
    });
}


/* =========================================================
   화면 출력
   - 회의 1개 = 카드 1개
   - 번호는 화면에 표시하지 않음
========================================================= */
function render() {
  const query = clean(
    document.getElementById("search").value
  ).toLowerCase();

  const allMeetings = buildMeetings(meetings);

  const filtered = allMeetings.filter(function(meeting) {
    const searchable = [
      meeting.title,
      meeting.date,
      meeting.details.map(rowText).join(" ")
    ].join(" ").toLowerCase();

    return !query || searchable.includes(query);
  });

  document.getElementById("status").textContent =
    "총 " + filtered.length + "개 회의록 · 최신 시트 자료";

  const list = document.getElementById("list");

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        회의록이 없습니다.
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(function(meeting) {
    const detailHtml = meeting.details.length
      ? meeting.details.map(function(item) {
          const text = rowText(item);
          return text
            ? `<div class="meeting-item">${escapeHtml(text)}</div>`
            : "";
        }).join("")
      : `<div class="meeting-item">회의 내용이 없습니다.</div>`;

    return `
      <article class="card">
        <div
          class="card-head"
          onclick="toggleCard(this.parentElement)"
        >
          <div class="card-main">
            <div class="card-title">
              ${escapeHtml(meeting.title)}
            </div>

            ${meeting.date ? `
              <div class="card-preview">
                ${escapeHtml(meeting.date)}
              </div>
            ` : ""}
          </div>

          <div class="chevron">⌄</div>
        </div>

        <div class="card-content">
          ${detailHtml}
        </div>
      </article>
    `;
  }).join("");
}


/* =========================================================
   카드 열기 / 닫기
========================================================= */

function toggleCard(card) {

  card.classList.toggle(
    "open"
  );

}


/* =========================================================
   HTML 문자 처리
========================================================= */

function escapeHtml(text) {

  return String(
    text ?? ""
  )
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#039;");

}


/* =========================================================
   공백 정리
========================================================= */

function clean(value) {

  return String(
    value ?? ""
  )
  .replace(/\u00a0/g, " ")
  .trim();

}


/* =========================================================
   뒤로가기
   전시대참여자.html 방식 참조
========================================================= */

function goBack() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

  }
  else {

    window.location.href =
      "전시대관리자.html";

  }

}


/* =========================================================
   설정
========================================================= */

const SETTINGS_THEME_KEY =
  "회의록2026_theme";

const SETTINGS_FONT_KEY =
  "회의록2026_fontSize";


function applySettings() {

  const theme =
    localStorage.getItem(
      SETTINGS_THEME_KEY
    ) || "dark";


  const fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    ) || 100;


  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );


  document.body.style.zoom =
    String(
      fontSize / 100
    );


  document.getElementById(
    "fontSizeValue"
  ).textContent =
    fontSize + "%";


}


function setTheme(theme) {

  localStorage.setItem(
    SETTINGS_THEME_KEY,
    theme
  );

  applySettings();

}


function changeFontSize(amount) {

  let fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    ) || 100;


  fontSize += amount;


  if (fontSize < 80)
    fontSize = 80;

  if (fontSize > 150)
    fontSize = 150;


  localStorage.setItem(
    SETTINGS_FONT_KEY,
    fontSize
  );


  applySettings();

}


function toggleSettings() {

  document.getElementById(
    "settingsPanel"
  ).classList.toggle(
    "show"
  );

}


document.addEventListener(
  "click",
  function(event) {

    const panel =
      document.getElementById(
        "settingsPanel"
      );

    const button =
      document.querySelector(
        ".settings-button"
      );


    if (
      panel &&
      panel.classList.contains("show") &&
      !panel.contains(event.target) &&
      !button.contains(event.target)
    ) {

      panel.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   위로가기
========================================================= */

window.addEventListener(
  "scroll",
  function() {

    document.getElementById(
      "topButton"
    ).style.display =
      window.scrollY > 500
        ? "block"
        : "none";

  }
);

</script>
