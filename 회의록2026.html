<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#286b5b">

<title>회의록</title>


<style>

/* ============================================================
   기본 설정
============================================================ */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  background:#f3f5f4;

  color:#26302d;

  font-size:15px;

  line-height:1.65;

}


/* ============================================================
   상단 헤더
============================================================ */

header{

  position:sticky;

  top:0;

  z-index:100;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid #dce4e0;

}


.header-inner{

  max-width:900px;

  margin:auto;

  padding:10px 14px;

  display:flex;

  align-items:center;

  gap:10px;

}


.back{

  width:42px;

  height:42px;

  border:0;

  border-radius:12px;

  background:#edf3f0;

  color:#286b5b;

  font-size:25px;

  font-weight:bold;

  cursor:pointer;

}


.title-area{

  flex:1;

  min-width:0;

}


.page-title{

  font-size:21px;

  font-weight:800;

  letter-spacing:-0.04em;

}


.page-subtitle{

  margin-top:1px;

  font-size:11px;

  color:#7a8580;

}


.refresh{

  border:0;

  border-radius:10px;

  padding:9px 12px;

  background:#286b5b;

  color:white;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

}


.refresh:active{

  transform:scale(.97);

}


/* ============================================================
   본문
============================================================ */

main{

  max-width:900px;

  margin:auto;

  padding:14px 12px 80px;

}


/* ============================================================
   검색 영역
============================================================ */

.toolbar{

  display:flex;

  gap:8px;

  margin-bottom:8px;

}


.search{

  flex:1;

  min-width:0;

  height:42px;

  padding:0 13px;

  border:
    1px solid #d7e0dc;

  border-radius:11px;

  background:white;

  font-size:14px;

  outline:none;

}


.search:focus{

  border-color:#5d9889;

}


.select{

  width:76px;

  height:42px;

  padding:0 8px;

  border:
    1px solid #d7e0dc;

  border-radius:11px;

  background:white;

  font-size:13px;

  outline:none;

}


/* ============================================================
   상태
============================================================ */

.status{

  margin:8px 2px 12px;

  font-size:12px;

  color:#74807b;

}


/* ============================================================
   로딩 / 오류
============================================================ */

.loading,
.empty,
.error{

  background:white;

  border:
    1px solid #dce4e0;

  border-radius:14px;

  padding:22px 16px;

  color:#6d7873;

}


.error{

  color:#a14d4d;

}


/* ============================================================
   월 제목
============================================================ */

.month-title{

  margin:
    22px 0 9px;

  padding-left:2px;

  font-size:14px;

  font-weight:800;

  color:#286b5b;

}


/* ============================================================
   회의록 카드
============================================================ */

.card{

  margin-bottom:10px;

  background:white;

  border:
    1px solid #d9e2de;

  border-radius:15px;

  overflow:hidden;

  box-shadow:
    0 2px 7px rgba(0,0,0,.035);

}


/* ============================================================
   카드 헤더
============================================================ */

.card-head{

  padding:11px 12px;

  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  user-select:none;

}


/* ============================================================
   날짜 박스
============================================================ */

.date-badge{

  width:52px;

  min-width:52px;

  height:52px;

  border-radius:11px;

  background:#edf5f2;

  color:#286b5b;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

}


.badge-month{

  font-size:11px;

  font-weight:700;

  line-height:1.2;

}


.badge-day{

  margin-top:1px;

  font-size:19px;

  font-weight:850;

  line-height:1.15;

}


/* ============================================================
   오른쪽 제목
============================================================ */

.card-main{

  flex:1;

  min-width:0;

}


.card-title{

  font-size:15px;

  font-weight:800;

  color:#27312e;

  line-height:1.4;

  letter-spacing:-0.02em;

  word-break:keep-all;

}


.card-time{

  margin-top:3px;

  font-size:13px;

  color:#68756f;

  font-weight:600;

}


/* ============================================================
   화살표
============================================================ */

.chevron{

  width:20px;

  text-align:center;

  color:#74807b;

  font-size:15px;

  transition:transform .2s;

}


.card.open .chevron{

  transform:rotate(180deg);

}


/* ============================================================
   펼쳐지는 영역
============================================================ */

.card-content{

  display:none;

  border-top:
    1px solid #e6ece9;

  padding:13px 13px 18px;

}


.card.open .card-content{

  display:block;

}


/* ============================================================
   기본 정보
============================================================ */

.info-box{

  background:#f6f8f7;

  border-radius:11px;

  padding:8px 11px;

  margin-bottom:16px;

}


.info-row{

  display:grid;

  grid-template-columns:76px 1fr;

  gap:8px;

  padding:5px 0;

  font-size:13px;

}


.info-label{

  font-weight:800;

  color:#51605a;

}


.info-value{

  color:#303a36;

  word-break:break-word;

}


/* ============================================================
   안건 강조 버튼
============================================================ */

.section-label{

  display:flex;

  align-items:center;

  width:100%;

  margin:18px 0 10px;

  padding:10px 13px;

  border-radius:11px;

  background:#e7f2ee;

  border:
    1px solid #d5e8e1;

  color:#286b5b;

  font-size:14px;

  font-weight:900;

  box-shadow:
    0 2px 5px rgba(40,107,91,.05);

}


.section-label::before{

  content:"●";

  margin-right:8px;

  font-size:10px;

}


/* ============================================================
   회의 내용 강조 버튼
============================================================ */

.section-label.content-label{

  background:#edf0f7;

  border-color:#dde3ef;

  color:#4c607f;

}


/* ============================================================
   안건 목록
============================================================ */

.bullet-list{

  margin:0 0 15px;

  padding:0;

  list-style:none;

}


.bullet-list li{

  position:relative;

  padding-left:18px;

  margin:9px 0;

  font-size:14px;

  color:#36403c;

  white-space:pre-wrap;

  word-break:break-word;

}


.bullet-list li::before{

  content:"";

  position:absolute;

  left:3px;

  top:.72em;

  width:7px;

  height:7px;

  border-radius:50%;

  background:#5d9b8b;

}


/* ============================================================
   회의 내용
============================================================ */

.content-list{

  margin:0;

  padding:0;

  list-style:none;

}


.content-item{

  position:relative;

  padding-left:18px;

  margin-bottom:15px;

}


.content-item::before{

  content:"";

  position:absolute;

  left:3px;

  top:8px;

  width:7px;

  height:7px;

  border-radius:50%;

  background:#7084a0;

}


.content-topic{

  margin-bottom:5px;

  font-size:14px;

  font-weight:800;

  color:#37414d;

}


.content-detail{

  font-size:14px;

  color:#46504c;

  white-space:pre-wrap;

  word-break:break-word;

}


/* ============================================================
   맨 위 버튼
============================================================ */

.top-button{

  position:fixed;

  right:16px;

  bottom:18px;

  width:45px;

  height:45px;

  border:0;

  border-radius:50%;

  background:#286b5b;

  color:white;

  font-size:19px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.18);

  display:none;

  cursor:pointer;

}


/* ============================================================
   PC
============================================================ */

@media(min-width:700px){

  main{

    padding-left:20px;
    padding-right:20px;

  }

  .card-head{

    padding:15px 17px;

  }

  .card-content{

    padding:16px 18px 22px;

  }

}


/* ============================================================
   다크 모드
============================================================ */

body.dark{

  background:#121715;

  color:#edf3f0;

}


body.dark header{

  background:
    rgba(25,31,28,.97);

  border-color:#303a36;

}


body.dark .page-title{

  color:#f0f5f2;

}


body.dark .page-subtitle{

  color:#9ba7a1;

}


body.dark .back{

  background:#26332e;

  color:#8fd0b9;

}


body.dark .search,
body.dark .select{

  background:#1c2421;

  color:#edf3f0;

  border-color:#394640;

}


body.dark .card{

  background:#1a211e;

  border-color:#35403b;

}


body.dark .card-title{

  color:#eef3f0;

}


body.dark .card-time{

  color:#a9b4af;

}


body.dark .date-badge{

  background:#24352e;

  color:#91d0bb;

}


body.dark .card-content{

  border-color:#303a36;

}


body.dark .info-box{

  background:#222b27;

}


body.dark .info-label{

  color:#bdcbc5;

}


body.dark .info-value{

  color:#edf3f0;

}


body.dark .bullet-list li{

  color:#d7e0dc;

}


body.dark .content-topic{

  color:#dce5e9;

}


body.dark .content-detail{

  color:#c8d1cd;

}


body.dark .section-label{

  background:#20332c;

  border-color:#365248;

  color:#93d5bf;

}


body.dark .section-label.content-label{

  background:#252c3a;

  border-color:#394458;

  color:#aebddd;

}


body.dark .loading,
body.dark .empty,
body.dark .error{

  background:#1a211e;

  border-color:#35403b;

}


</style>

</head>


<body>


<header>

  <div class="header-inner">


    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">

      ‹

    </button>


    <div class="title-area">

      <div class="page-title">
        회의록
      </div>

      <div class="page-subtitle">
        서울북부회중 회의 기록
      </div>

    </div>


    <button
      class="refresh"
      onclick="loadMinutes()">

      새로고침

    </button>


  </div>

</header>


<main>


  <div class="toolbar">


    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">


    <select
      id="year"
      class="select"
      onchange="render()">

      <option value="all">
        전체
      </option>

    </select>


  </div>


  <div
    id="status"
    class="status">

    회의록을 불러오는 중입니다.

  </div>


  <div
    id="list"
    class="loading">

    잠시만 기다려 주세요.

  </div>


</main>


<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>


/* ============================================================
   Google Apps Script 웹앱 주소
============================================================ */

const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxweQpbKaFVLVTIrqbDsrlekMv_2loBJMMQP0wX5UYYo-CewqXNmR2l3iDBidC8wHon/exec";


/* ============================================================
   회의록 데이터

   중요:
   서버에서 받은 데이터만 저장합니다.
   이전 데이터와 합치지 않습니다.
============================================================ */

let meetings = [];


/* ============================================================
   HTML 문자 보호
============================================================ */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* ============================================================
   날짜 변환
============================================================ */

function parseDate(value){

  const text =
    String(value || "")
      .trim();


  let match =
    text.match(
      /(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/
    );


  if(!match){

    match =
      text.match(
        /(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/
      );

  }


  if(!match){

    return "";

  }


  return (

    match[1] +

    "-" +

    String(match[2]).padStart(2,"0") +

    "-" +

    String(match[3]).padStart(2,"0")

  );

}


/* ============================================================
   회의 날짜
============================================================ */

function getMeetingDate(meeting){

  return (

    parseDate(meeting.date) ||

    parseDate(meeting.datetime)

  );

}


/* ============================================================
   날짜 → 월 / 일
============================================================ */

function getMonthDay(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return {

      month:"",
      day:""

    };

  }


  return {

    month:
      String(Number(match[2])),

    day:
      String(Number(match[3]))

  };

}


/* ============================================================
   월 제목
============================================================ */

function getMonthTitle(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return "기타";

  }


  return (

    Number(match[1]) +

    "년 " +

    Number(match[2]) +

    "월"

  );

}


/* ============================================================
   날짜 전체 표시
============================================================ */

function formatDate(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return "";

  }


  return (

    Number(match[1]) +

    "년 " +

    Number(match[2]) +

    "월 " +

    Number(match[3]) +

    "일"

  );

}


/* ============================================================
   시간 표시
============================================================ */

function getTime(datetime){

  const text =
    String(datetime || "")
      .trim();


  const match =
    text.match(
      /(\d{1,2}):(\d{2})/
    );


  if(!match){

    return "";

  }


  const hour =
    Number(match[1]);


  const minute =
    match[2];


  const period =
    hour >= 12
      ? "오후"
      : "오전";


  let displayHour =
    hour % 12;


  if(displayHour === 0){

    displayHour = 12;

  }


  return (

    period +

    " " +

    displayHour +

    ":" +

    minute

  );

}


/* ============================================================
   연도 목록 생성
============================================================ */

function buildYears(){

  const select =
    document.getElementById("year");


  const current =
    select.value;


  const years =
    [

      ...new Set(

        meetings

          .map(

            function(meeting){

              return String(
                meeting._date || ""
              ).slice(0,4);

            }

          )

          .filter(Boolean)

      )

    ]

    .sort(
      function(a,b){

        return Number(b) - Number(a);

      }
    );


  select.innerHTML =
    '<option value="all">전체</option>';


  years.forEach(

    function(year){

      select.innerHTML +=

        '<option value="' +

        esc(year) +

        '">' +

        esc(year) +

        '년</option>';

    }

  );


  if(

    current === "all" ||

    years.includes(current)

  ){

    select.value =
      current;

  }

  else{

    select.value =
      "all";

  }

}


/* ============================================================
   뒤로가기
============================================================ */

function goBack(){

  if(history.length > 1){

    history.back();

  }

  else{

    location.href =
      "index.html";

  }

}


/* ============================================================
   카드 열기 / 닫기
============================================================ */

function toggleCard(card){

  card.classList.toggle(
    "open"
  );

}


/* ============================================================
   정보 행
============================================================ */

function infoRow(label,value){

  if(

    value === undefined ||

    value === null ||

    String(value).trim() === ""

  ){

    return "";

  }


  return `

    <div class="info-row">

      <div class="info-label">
        ${esc(label)}
      </div>

      <div class="info-value">
        ${esc(value)}
      </div>

    </div>

  `;

}


/* ============================================================
   안건
============================================================ */

function renderAgenda(agenda){

  if(

    !Array.isArray(agenda) ||

    agenda.length === 0

  ){

    return "";

  }


  const items =
    agenda.filter(

      function(item){

        return String(item || "")
          .trim();

      }

    );


  if(!items.length){

    return "";

  }


  return `

    <div class="section-label">
      안건
    </div>

    <ul class="bullet-list">

      ${

        items.map(

          function(item){

            return `

              <li>
                ${esc(item)}
              </li>

            `;

          }

        ).join("")

      }

    </ul>

  `;

}


/* ============================================================
   회의 내용
============================================================ */

function renderContent(content){

  if(

    !Array.isArray(content) ||

    content.length === 0

  ){

    return "";

  }


  const validItems =
    content.filter(

      function(item){

        return (

          String(item?.topic || "").trim() ||

          String(item?.detail || "").trim()

        );

      }

    );


  if(!validItems.length){

    return "";

  }


  return `

    <div class="section-label content-label">
      회의 내용
    </div>

    <div class="content-list">

      ${

        validItems.map(

          function(item){


            const topic =
              String(
                item.topic || ""
              ).trim();


            const detail =
              String(
                item.detail || ""
              ).trim();


            return `

              <div class="content-item">


                ${

                  topic

                    ? `

                      <div class="content-topic">

                        ${esc(topic)}

                      </div>

                    `

                    : ""

                }


                ${

                  detail

                    ? `

                      <div class="content-detail">

                        ${esc(detail)}

                      </div>

                    `

                    : ""

                }


              </div>

            `;

          }

        ).join("")

      }

    </div>

  `;

}


/* ============================================================
   화면 렌더링
============================================================ */

function render(){


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const selectedYear =
    document
      .getElementById("year")
      .value;


  let data =
    meetings.filter(

      function(meeting){


        const date =
          meeting._date || "";


        const searchText =
          JSON.stringify(meeting)
            .toLowerCase();


        const matchSearch =

          !search ||

          searchText.includes(search);


        const matchYear =

          selectedYear === "all" ||

          date.startsWith(selectedYear);


        return (

          matchSearch &&

          matchYear

        );

      }

    );


  /* 최신순 정렬 */

  data.sort(

    function(a,b){

      return b._date.localeCompare(
        a._date
      );

    }

  );


  document
    .getElementById("status")
    .textContent =

      `총 ${data.length}건 · 최신 회의록이 먼저 표시됩니다.`;


  const list =
    document.getElementById("list");


  if(!data.length){

    list.innerHTML =
      '<div class="empty">회의록이 없습니다.</div>';

    return;

  }


  let previousMonth =
    "";


  list.innerHTML =

    data.map(

      function(meeting,index){


        const date =
          meeting._date;


        const monthDay =
          getMonthDay(date);


        const monthTitle =
          getMonthTitle(date);


        let monthHtml =
          "";


        if(

          previousMonth !==
          monthTitle

        ){

          monthHtml = `

            <div class="month-title">

              ${esc(monthTitle)}

            </div>

          `;


          previousMonth =
            monthTitle;

        }


        /* 기본 정보 */

        const info =

          infoRow(
            "일시",
            meeting.datetime ||
            formatDate(date)
          )

          +

          infoRow(
            "회의 장소",
            meeting.place
          )

          +

          infoRow(
            "참석자",
            meeting.attendees
          )

          +

          infoRow(
            "불참자",
            meeting.absentees
          )

          +

          infoRow(
            "시작 기도",
            meeting.startPrayer
          )

          +

          infoRow(
            "마치는 기도",
            meeting.endPrayer
          );


        const agendaHtml =
          renderAgenda(
            meeting.agenda
          );


        const contentHtml =
          renderContent(
            meeting.content
          );


        return `

          ${monthHtml}


          <article
            class="card"
            id="meeting-${index}">


            <div
              class="card-head"
              onclick="toggleCard(this.parentElement)">


              <div class="date-badge">


                <div class="badge-month">

                  ${esc(monthDay.month)}월

                </div>


                <div class="badge-day">

                  ${esc(monthDay.day)}일

                </div>


              </div>


              <div class="card-main">


                <div class="card-title">

                  ${esc(meeting.title)}

                </div>


                <div class="card-time">

                  ${esc(
                    getTime(
                      meeting.datetime
                    )
                  )}

                </div>


              </div>


              <div class="chevron">

                ⌄

              </div>


            </div>


            <div class="card-content">


              ${

                info

                  ? `

                    <div class="info-box">

                      ${info}

                    </div>

                  `

                  : ""

              }


              ${agendaHtml}


              ${contentHtml}


            </div>


          </article>

        `;

      }

    ).join("");

}


/* ============================================================
   회의록 불러오기

   ★ 가장 중요한 부분 ★

   매번 새 데이터를 받기 전에
   기존 meetings 배열을 완전히 비웁니다.

   서버 응답 배열을 그대로 사용합니다.
   데이터를 합치지 않습니다.
============================================================ */

async function loadMinutes(){


  const list =
    document.getElementById("list");


  /* 기존 화면 데이터 완전 초기화 */

  meetings = [];


  list.innerHTML =

    '<div class="loading">회의록을 불러오는 중입니다...</div>';


  document
    .getElementById("status")
    .textContent =
      "최신 데이터를 확인하는 중입니다.";


  try{


    if(!GAS_WEB_APP_URL){

      throw new Error(
        "Google Apps Script 주소가 없습니다."
      );

    }


    /* 캐시 방지 */

    const separator =
      GAS_WEB_APP_URL.includes("?")
        ? "&"
        : "?";


    const requestUrl =

      GAS_WEB_APP_URL +

      separator +

      "t=" +

      Date.now();


    console.log(
      "회의록 API 요청:",
      requestUrl
    );


    const response =
      await fetch(

        requestUrl,

        {
          method:"GET",

          cache:"no-store"

        }

      );


    if(!response.ok){

      throw new Error(

        "HTTP " +

        response.status

      );

    }


    const json =
      await response.json();


    console.log(
      "API 전체 응답:",
      json
    );


    if(!json.success){

      throw new Error(

        json.error ||

        "회의록 데이터를 가져오지 못했습니다."

      );

    }


    /* ========================================================
       서버에서 받은 원본 배열

       예:
       count = 15
       meetings.length = 15

       여기서 다른 데이터와 합치지 않습니다.
    ======================================================== */

    const rawMeetings =

      Array.isArray(
        json.meetings
      )

        ? json.meetings

        : [];


    console.log(
      "서버 count:",
      json.count
    );


    console.log(
      "실제 meetings 배열 길이:",
      rawMeetings.length
    );


    /* ========================================================
       서버 count 검증
    ======================================================== */

    if(

      typeof json.count === "number" &&

      json.count !== rawMeetings.length

    ){

      console.warn(

        "서버 count와 실제 배열 길이가 다릅니다.",

        {

          count:json.count,

          length:rawMeetings.length

        }

      );

    }


    /* ========================================================
       중요

       원본 배열을 새 배열로 완전히 교체

       push()
       concat()
       이전 meetings 유지

       전부 하지 않습니다.
    ======================================================== */

    meetings =

      rawMeetings

        .map(

          function(meeting){

            const date =
              getMeetingDate(
                meeting
              );


            return {

              ...meeting,

              _date:date

            };

          }

        )

        .filter(

          function(meeting){

            return meeting._date;

          }

        );


    console.log(
      "날짜 변환 후 실제 표시 데이터:",
      meetings.length
    );


    console.log(
      "표시되는 날짜 목록:",
      meetings.map(
        function(meeting){
          return meeting._date;
        }
      )
    );


    /* 연도 생성 */

    buildYears();


    /* 화면 출력 */

    render();


  }

  catch(error){


    console.error(
      "회의록 불러오기 오류:",
      error
    );


    meetings = [];


    list.innerHTML = `

      <div class="error">

        회의록을 불러오지 못했습니다.

        <br><br>

        ${esc(error.message)}

      </div>

    `;


    document
      .getElementById("status")
      .textContent =
        "불러오기 실패";

  }

}

   맨 위 버튼
============================================================ */

window.addEventListener(

  "scroll",

  function(){


    const button =

        "topButton"

    button.style.display =

   시작

   한 번만 호출
============================================================ */

document.addEventListener(

  "DOMContentLoaded",

  function(){

    loadMinutes();

  }

);


</script>
