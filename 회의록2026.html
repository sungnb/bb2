<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta
  name="theme-color"
  content="#1f6f5b">

<title>회의록</title>


<style>

/* ============================================================
   기본
   ============================================================ */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  background:#f4f6f5;
  color:#202624;

  line-height:1.7;

  font-size:
    calc(16px * var(--font-scale,1));

  transition:
    background .2s,
    color .2s;

  text-align:left;
}


/* ============================================================
   상단
   ============================================================ */

header{

  position:sticky;
  top:0;
  z-index:20;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(10px);

  border-bottom:
    1px solid #e2e7e4;

}


.header-inner{

  max-width:900px;

  margin:auto;

  padding:
    10px 14px;

  display:flex;

  align-items:center;

  gap:9px;

}


.back{

  width:42px;
  height:42px;

  border:0;

  border-radius:12px;

  background:#eef3f1;

  color:#1f6f5b;

  font-size:24px;

  cursor:pointer;

}


.title-wrap{

  flex:1;

  min-width:0;

}


.title{

  font-size:
    calc(21px * var(--font-scale,1));

  font-weight:800;

  letter-spacing:-.03em;

}


.subtitle{

  font-size:
    calc(12px * var(--font-scale,1));

  color:#75807c;

}


.refresh{

  border:0;

  background:#1f6f5b;

  color:#fff;

  border-radius:11px;

  padding:
    9px 11px;

  font-size:
    calc(13px * var(--font-scale,1));

  font-weight:700;

  cursor:pointer;

}


/* ============================================================
   본문
   ============================================================ */

main{

  max-width:900px;

  margin:auto;

  padding:
    14px 12px 70px;

}


/* ============================================================
   검색
   ============================================================ */

.toolbar{

  display:flex;

  gap:8px;

  margin:
    4px 0 12px;

}


.search{

  flex:1;

  min-width:0;

  border:
    1px solid #dfe5e2;

  border-radius:13px;

  background:#fff;

  color:#202624;

  padding:
    11px 13px;

  font-size:
    calc(15px * var(--font-scale,1));

  outline:none;

}


.select{

  border:
    1px solid #dfe5e2;

  border-radius:13px;

  background:#fff;

  color:#39423f;

  padding:
    0 9px;

  font-size:
    calc(14px * var(--font-scale,1));

  outline:none;

}


.status{

  margin:
    0 2px 12px;

  color:#6f7975;

  font-size:
    calc(13px * var(--font-scale,1));

}


/* ============================================================
   월 제목
   ============================================================ */

.month{

  margin:
    22px 0 9px;

  font-size:
    calc(17px * var(--font-scale,1));

  font-weight:800;

  color:#1f6f5b;

}


/* ============================================================
   회의록 카드
   ============================================================ */

.card{

  background:#fff;

  border:
    1px solid #e3e8e5;

  border-radius:17px;

  margin-bottom:11px;

  overflow:hidden;

  box-shadow:
    0 3px 12px
    rgba(26,45,37,.05);

}


/* ============================================================
   카드 상단
   ============================================================ */

.card-head{

  padding:14px;

  cursor:pointer;

  display:flex;

  align-items:center;

  gap:11px;

}


/* ============================================================
   왼쪽 날짜

   예:

   ┌─────┐
   │ 8월 │
   │ 4일 │
   └─────┘
   ============================================================ */

.date-badge{

  width:56px;

  min-width:56px;

  text-align:center;

  border-radius:12px;

  background:#edf5f1;

  padding:
    6px 3px;

  color:#1f6f5b;

}


.date-badge .mon{

  font-size:
    calc(12px * var(--font-scale,1));

  font-weight:700;

  line-height:1.3;

}


.date-badge .day{

  font-size:
    calc(21px * var(--font-scale,1));

  font-weight:850;

  line-height:1.15;

}


/* ============================================================
   오른쪽 제목과 날짜
   ============================================================ */

.card-main{

  flex:1;

  min-width:0;

}


.card-title{

  font-size:
    calc(17px * var(--font-scale,1));

  font-weight:800;

  letter-spacing:-.02em;

  color:#202624;

  line-height:1.45;

  word-break:keep-all;

}


.card-date{

  font-size:
    calc(13px * var(--font-scale,1));

  color:#68736e;

  font-weight:600;

  margin-top:3px;

}


/* ============================================================
   화살표
   ============================================================ */

.chev{

  flex:none;

  font-size:18px;

  color:#8a9590;

  transition:.2s;

}


.card.open .chev{

  transform:
    rotate(180deg);

}


/* ============================================================
   펼쳐지는 내용
   ============================================================ */

.content{

  display:none;

  border-top:
    1px solid #edf0ef;

  padding:14px;

}


.card.open .content{

  display:block;

}


/* ============================================================
   기본 정보
   ============================================================ */

.info{

  background:#f7f9f8;

  border-radius:12px;

  padding:
    10px 12px;

  margin-bottom:18px;

  font-size:
    calc(14px * var(--font-scale,1));

}


.info-row{

  display:grid;

  grid-template-columns:
    90px 1fr;

  gap:8px;

  padding:
    4px 0;

}


.info-label{

  color:#46514d;

  font-weight:800;

}


.info-value{

  min-width:0;

  word-break:break-word;

}


/* ============================================================
   섹션 제목

   안건
   회의 내용
   ============================================================ */

.section-title{

  font-size:
    calc(15px * var(--font-scale,1));

  font-weight:900;

  color:#1f6f5b;

  margin:
    22px 0 9px;

  padding-left:8px;

  border-left:
    3px solid #1f6f5b;

}


/* ============================================================
   안건
   ============================================================ */

.agenda{

  font-size:
    calc(14px * var(--font-scale,1));

}


.agenda ul{

  margin:
    0;

  padding-left:22px;

}


.agenda li{

  margin:
    5px 0;

}


/* ============================================================
   회의 내용
   ============================================================ */

.body-text{

  font-size:
    calc(14px * var(--font-scale,1));

}


.topic{

  font-weight:800;

  margin:
    15px 0 5px;

  color:#293531;

}


.detail{

  white-space:pre-wrap;

  margin:
    0 0 14px;

  color:#414a46;

}


/* ============================================================
   상태
   ============================================================ */

.empty,
.loading,
.error{

  background:#fff;

  border:
    1px solid #e3e8e5;

  border-radius:16px;

  padding:
    24px 16px;

  color:#727d78;

}


.error{

  color:#a14b4b;

}


/* ============================================================
   맨 위 버튼
   ============================================================ */

.top{

  position:fixed;

  right:16px;
  bottom:18px;

  width:46px;
  height:46px;

  border:0;

  border-radius:50%;

  background:#1f6f5b;

  color:#fff;

  font-size:19px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.15);

  display:none;

  cursor:pointer;

}


/* ============================================================
   PC
   ============================================================ */

@media(min-width:700px){

  main{

    padding-left:18px;
    padding-right:18px;

  }

  .card-head{

    padding:18px;

  }

  .content{

    padding:
      18px 22px;

  }

}


/* ============================================================
   다크 모드
   ============================================================ */

body.dark{

  background:#111615;

  color:#edf3f0;

}


body.dark header{

  background:
    rgba(24,29,27,.96);

  border-color:#303936;

}


body.dark .back{

  background:#26312d;

  color:#8ed0b8;

}


body.dark .search,
body.dark .select{

  background:#1b211f;

  color:#edf3f0;

  border-color:#39433f;

}


body.dark .status{

  color:#a8b3ae;

}


body.dark .month{

  color:#8ed0b8;

}


body.dark .card{

  background:#1a201e;

  border-color:#343d39;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.22);

}


body.dark .date-badge{

  background:#24352e;

  color:#8ed0b8;

}


body.dark .card-title{

  color:#f3f7f5;

}


body.dark .card-date{

  color:#a8b3ae;

}


body.dark .content{

  border-color:#303936;

}


body.dark .info{

  background:#202825;

}


body.dark .info-label{

  color:#dce8e3;

}


body.dark .info-value{

  color:#edf3f0;

}


body.dark .section-title{

  color:#8ed0b8;

  border-color:#8ed0b8;

}


body.dark .topic{

  color:#dce8e3;

}


body.dark .detail{

  color:#c7d0cc;

}


body.dark .empty,
body.dark .loading,
body.dark .error{

  background:#1a201e;

  border-color:#343d39;

  color:#aeb9b4;

}


body.dark .title{

  color:#f3f7f5;

}


body.dark .subtitle{

  color:#a8b3ae;

}

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">

      ‹

    </button>


    <div class="title-wrap">

      <div class="title">
        회의록
      </div>

      <div class="subtitle">
        서울북부회중 회의 기록
      </div>

    </div>


    <button
      class="refresh"
      onclick="loadMinutes()">

      새로고침

    </button>

  </div>

</header>


<main>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">


    <select
      id="year"
      class="select"
      onchange="render()">

      <option value="all">
        전체
      </option>

    </select>

  </div>


  <div
    id="status"
    class="status">

    회의록을 불러오는 중입니다.

  </div>


  <div
    id="list"
    class="loading">

    잠시만 기다려 주세요.

  </div>


</main>


<button
  id="topBtn"
  class="top"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>

/* ============================================================
   Google Apps Script 웹앱 주소
   ============================================================ */

const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxweQpbKaFVLVTIrqbDsrlekMv_2loBJMMQP0wX5UYYo-CewqXNmR2l3iDBidC8wHon/exec";


/* ============================================================
   설정
   ============================================================ */

const THEME_KEY =
  "bukbu_theme";


const FONT_SIZE_KEY =
  "bukbu_font_size";


let meetings = [];


/* ============================================================
   HTML 문자 보호
   ============================================================ */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(s){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        }[s];

      }
    );

}


/* ============================================================
   날짜 정규화

   2026년 8월 4일
   2026-08-04
   2026. 8. 4.

   모두 YYYY-MM-DD로 변환
   ============================================================ */

function parseDate(value){

  const text =
    String(value || "")
      .trim();


  let match =
    text.match(
      /(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/
    );


  if(!match){

    match =
      text.match(
        /(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/
      );

  }


  if(!match){
    return "";
  }


  return (

    match[1] +
    "-" +
    String(match[2]).padStart(2,"0") +
    "-" +
    String(match[3]).padStart(2,"0")

  );

}


/* ============================================================
   날짜 얻기

   m.date가 없거나 형식이 달라도
   datetime에서 날짜를 다시 찾음
   ============================================================ */

function getMeetingDate(m){

  const direct =
    parseDate(
      m.date
    );


  if(direct){
    return direct;
  }


  return parseDate(
    m.datetime
  );

}


/* ============================================================
   월 제목
   ============================================================ */

function monthKey(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){
    return "기타";
  }


  return (
    Number(match[1]) +
    "년 " +
    Number(match[2]) +
    "월"
  );

}


/* ============================================================
   전체 날짜 표시

   2026-08-04
   ↓
   2026년 8월 4일
   ============================================================ */

function fmtDate(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){
    return date || "";
  }


  return (

    Number(match[1]) +
    "년 " +
    Number(match[2]) +
    "월 " +
    Number(match[3]) +
    "일"

  );

}


/* ============================================================
   날짜에서 월 / 일
   ============================================================ */

function getMonthDay(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return {
      month:"",
      day:""
    };

  }


  return {

    month:
      String(
        Number(match[2])
      ),

    day:
      String(
        Number(match[3])
      )

  };

}


/* ============================================================
   설정 적용
   ============================================================ */

function applySettings(){

  let theme =
    "light";

  let size =
    1;


  try{

    theme =
      localStorage.getItem(
        THEME_KEY
      ) || "light";


    size =
      Number(
        localStorage.getItem(
          FONT_SIZE_KEY
        ) || 1
      );

  }

  catch(e){}


  if(

    !Number.isFinite(size) ||

    size < .8 ||

    size > 1.5

  ){

    size = 1;

  }


  document.documentElement
    .style
    .setProperty(
      "--font-scale",
      size
    );


  document.body
    .classList
    .toggle(
      "dark",
      theme === "dark"
    );

}


applySettings();


/* ============================================================
   뒤로가기
   ============================================================ */

function goBack(){

  if(
    history.length > 1
  ){

    history.back();

  }

  else{

    location.href =
      "index.html";

  }

}


/* ============================================================
   연도 목록 생성
   ============================================================ */

function buildYears(){

  const select =
    document.getElementById(
      "year"
    );


  const old =
    select.value;


  const years =
    [

      ...new Set(

        meetings
          .map(

            function(m){

              const date =
                getMeetingDate(m);

              return date
                ? date.slice(0,4)
                : "";

            }

          )

      )

    ]
    .filter(Boolean)
    .sort(
      function(a,b){

        return (
          Number(b) -
          Number(a)
        );

      }
    );


  select.innerHTML =

    '<option value="all">전체</option>' +

    years
      .map(
        function(year){

          return (

            '<option value="' +
            esc(year) +
            '">' +
            esc(year) +
            '년</option>'

          );

        }
      )
      .join("");


  select.value =
    years.includes(old)
      ? old
      : "all";

}


/* ============================================================
   카드 열기 / 닫기
   ============================================================ */

function toggleCard(card){

  card.classList.toggle(
    "open"
  );

}


/* ============================================================
   기본 정보 행 만들기
   ============================================================ */

function infoRow(label,value){

  if(
    !value ||
    !String(value).trim()
  ){

    return "";

  }


  return `

    <div class="info-row">

      <div class="info-label">
        ${esc(label)}
      </div>

      <div class="info-value">
        ${esc(value)}
      </div>

    </div>

  `;

}


/* ============================================================
   회의록 렌더링
   ============================================================ */

function render(){

  const q =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const year =
    document
      .getElementById("year")
      .value;


  let data =
    meetings
      .map(

        function(m){

          return {

            ...m,

            _date:
              getMeetingDate(m)

          };

        }

      )
      .filter(

        function(m){

          const text =
            JSON.stringify(m)
              .toLowerCase();


          const matchSearch =

            !q ||

            text.includes(q);


          const matchYear =

            year === "all" ||

            String(
              m._date || ""
            )
            .startsWith(year);


          return (

            matchSearch &&
            matchYear

          );

        }

      );


  /* 최신 날짜 먼저 */

  data.sort(

    function(a,b){

      return String(
        b._date || ""
      )
      .localeCompare(

        String(
          a._date || ""
        )

      );

    }

  );


  document
    .getElementById("status")
    .textContent =

      `총 ${data.length}건 · 최신 회의록이 먼저 표시됩니다.`;


  const list =
    document.getElementById(
      "list"
    );


  if(!data.length){

    list.innerHTML =
      '<div class="empty">회의록이 없습니다.</div>';

    return;

  }


  let lastMonth =
    "";


  list.innerHTML =

    data
      .map(

        function(m,index){

          const date =
            m._date;


          const month =
            getMonthDay(date)
              .month;


          const day =
            getMonthDay(date)
              .day;


          const currentMonth =
            monthKey(date);


          let monthHtml =
            "";


          if(
            currentMonth !== lastMonth
          ){

            monthHtml =

              `<div class="month">
                ${esc(currentMonth)}
              </div>`;


            lastMonth =
              currentMonth;

          }


          /* ==================================================
             기본 정보

             표시 순서

             1. 일시
             2. 회의 장소
             3. 참석자
             4. 불참자
             5. 시작 기도
             6. 마치는 기도
             ================================================== */

          const info =

            infoRow(
              "일시",
              m.datetime || fmtDate(date)
            ) +

            infoRow(
              "회의 장소",
              m.place
            ) +

            infoRow(
              "참석자",
              m.attendees
            ) +

            infoRow(
              "불참자",
              m.absentees
            ) +

            infoRow(
              "시작 기도",
              m.startPrayer
            ) +

            infoRow(
              "마치는 기도",
              m.endPrayer
            );


          /* ==================================================
             안건
             ================================================== */

          const agenda =

            Array.isArray(
              m.agenda
            ) &&

            m.agenda.length

              ? `

                <div class="section-title">
                  안건
                </div>

                <div class="agenda">

                  <ul>

                    ${m.agenda
                      .filter(
                        function(item){

                          return (
                            String(item || "")
                              .trim()
                          );

                        }
                      )
                      .map(
                        function(item){

                          return `

                            <li>
                              ${esc(item)}
                            </li>

                          `;

                        }
                      )
                      .join("")}

                  </ul>

                </div>

              `

              : "";


          /* ==================================================
             회의 내용
             ================================================== */

          const content =

            Array.isArray(
              m.content
            ) &&

            m.content.length

              ? `

                <div class="section-title">
                  회의 내용
                </div>

                <div class="body-text">

                  ${m.content
                    .map(

                      function(item){

                        const topic =
                          String(
                            item.topic || ""
                          )
                          .trim();


                        const detail =
                          String(
                            item.detail || ""
                          )
                          .trim();


                        if(
                          !topic &&
                          !detail
                        ){

                          return "";

                        }


                        return `

                          ${

                            topic

                              ? `

                                <div class="topic">
                                  ${esc(topic)}
                                </div>

                              `

                              : ""

                          }


                          ${

                            detail

                              ? `

                                <div class="detail">
                                  ${esc(detail)}
                                </div>

                              `

                              : ""

                          }

                        `;

                      }

                    )
                    .join("")}

                </div>

              `

              : "";


          /* ==================================================
             최종 카드

             접힌 상태

             왼쪽
             8월
             4일

             오른쪽
             서울북부회중 임시장로모임

/* ============================================================
   회의록 불러오기
   ============================================================ */

async function loadMinutes(){

  const list =
    document.getElementById(
      "list"
    );


  list.innerHTML =
    '<div class="loading">구글 독스의 전체 회의록을 불러오는 중입니다…</div>';


  if(
    !GAS_WEB_APP_URL
  ){

    list.innerHTML =
      '<div class="error">Google Apps Script 주소가 설정되지 않았습니다.</div>';


    document
      .getElementById("status")
      .textContent =
        "연결 설정 필요";


    return;

  }


  try{

    const separator =
      GAS_WEB_APP_URL.includes("?")
        ? "&"
        : "?";


    const res =
      await fetch(

        GAS_WEB_APP_URL +

        separator +

        "t=" +

        Date.now(),

        {
          cache:"no-store"
        }

      );


    if(!res.ok){

      throw new Error(
        "HTTP " +
        res.status
      );

    }


    const json =
      await res.json();


    if(
      !json.success
    ){

      throw new Error(

        json.error ||

        "데이터를 가져오지 못했습니다."

      );

    }


    meetings =

      Array.isArray(
        json.meetings
      )

        ? json.meetings

        : [];


    buildYears();


    render();


  }

  catch(e){

    console.error(e);


    list.innerHTML = `

      <div class="error">

        회의록을 불러오지 못했습니다.

        <br>

        ${esc(e.message)}

        <br><br>

        Google Apps Script 웹앱 주소와
        배포 상태를 확인해 주세요.

      </div>

    `;


    document
      .getElementById("status")
      .textContent =
        "불러오기 실패";

  }

}
