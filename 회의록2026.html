<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#286b5b">
<title>회의록 2026</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f3f5f4;color:#26302d;font-size:15px;line-height:1.65}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #dce4e0}
.header-inner{max-width:900px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.home-button,.back{width:42px;height:42px;border:0;border-radius:12px;background:#edf3f0;color:#286b5b;font-size:22px;font-weight:bold;cursor:pointer}
.back{font-size:25px}.title-area{flex:1;min-width:0}.page-title{font-size:21px;font-weight:800;letter-spacing:-.04em}.page-subtitle{margin-top:1px;font-size:11px;color:#7a8580}
.settings-button{width:42px;height:42px;border:0;border-radius:12px;background:#edf3f0;color:#286b5b;font-size:20px;cursor:pointer}.settings-panel{display:none;position:absolute;right:14px;top:58px;width:220px;padding:14px;border-radius:14px;background:#fff;border:1px solid #d9e2de;box-shadow:0 8px 25px rgba(0,0,0,.12);z-index:200}.settings-panel.show{display:block}.settings-title{font-weight:800;margin-bottom:10px}.settings-row{display:flex;gap:8px;margin-bottom:10px}.settings-row button,.font-size-row button{border:0;border-radius:9px;padding:9px;background:#edf3f0;color:#286b5b;cursor:pointer}.settings-row button{flex:1}.font-size-row{display:flex;align-items:center;gap:8px}.font-size-row button{width:38px}.font-size-value{flex:1;text-align:center}
main{max-width:900px;margin:auto;padding:14px 12px 80px}.toolbar{display:flex;gap:8px;margin-bottom:8px}.search{flex:1;min-width:0;height:42px;padding:0 13px;border:1px solid #d7e0dc;border-radius:11px;background:white;font-size:14px;outline:none}.status{margin:8px 2px 12px;font-size:12px;color:#74807b}.meeting-group{margin:22px 0 14px}.group-title{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-left:2px;font-size:15px;font-weight:900;color:#286b5b}.group-number{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:#e4f1ec;border:1px solid #d0e5dc}.card{margin-bottom:10px;background:white;border:1px solid #d9e2de;border-radius:15px;overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.035)}.card-head{padding:11px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}.number-badge{width:52px;min-width:52px;height:52px;border-radius:11px;background:#edf5f2;color:#286b5b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.badge-main{font-size:18px;font-weight:850;line-height:1.15}.card-main{flex:1;min-width:0}.card-title{font-size:15px;font-weight:800;color:#27312e;line-height:1.4;word-break:keep-all}.card-preview{margin-top:3px;font-size:13px;color:#68756f;font-weight:500;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.chevron{width:20px;text-align:center;color:#74807b;font-size:15px;transition:transform .2s}.card.open .chevron{transform:rotate(180deg)}.card-content{display:none;border-top:1px solid #e6ece9;padding:13px 13px 18px}.card.open .card-content{display:block}.row-number{font-size:12px;color:#7a8580;margin-bottom:8px}.detail{white-space:pre-wrap;word-break:break-word;font-size:14px;color:#36403c}.empty{background:white;border:1px solid #dce4e0;border-radius:14px;padding:22px 16px;color:#6d7873}.error{color:#b33a3a}.top-button{position:fixed;right:16px;bottom:18px;width:45px;height:45px;border:0;border-radius:50%;background:#286b5b;color:white;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;cursor:pointer}
body.dark{background:#121715;color:#edf3f0}body.dark header{background:rgba(25,31,28,.97);border-color:#303a36}body.dark .page-title{color:#f0f5f2}body.dark .page-subtitle{color:#9ba7a1}body.dark .home-button,body.dark .back,body.dark .settings-button{background:#26332e;color:#8fd0b9}body.dark .search{background:#1c2421;color:#edf3f0;border-color:#394640}body.dark .card{background:#1a211e;border-color:#35403b}body.dark .card-title{color:#eef3f0}body.dark .card-preview{color:#a9b4af}body.dark .number-badge{background:#24352e;color:#91d0bb}body.dark .card-content{border-color:#303a36}body.dark .detail{color:#d7e0dc}body.dark .row-number,body.dark .status{color:#a9b4af}body.dark .group-number{background:#24352e;border-color:#35403b;color:#91d0bb}body.dark .settings-panel{background:#1a211e;border-color:#35403b;color:#edf3f0}body.dark .settings-row button,body.dark .font-size-row button{background:#26332e;color:#91d0bb}
@media(min-width:700px){main{padding-left:20px;padding-right:20px}.card-head{padding:15px 17px}.card-content{padding:16px 18px 22px}}
@media(max-width:600px){.page-title{font-size:19px}.toolbar{gap:6px}.settings-panel{right:10px}}
</style>
</head>
<body>
<header>
<div class="header-inner">
<button class="home-button" onclick="goHome()" aria-label="홈으로">⌂</button>
<button class="back" onclick="goBack()" aria-label="뒤로가기">‹</button>
<div class="title-area"><div class="page-title">회의록</div><div class="page-subtitle">서울북부회중 회의 기록 · 2026</div></div>
<button class="settings-button" onclick="toggleSettings()" aria-label="설정">⚙️</button>
<div id="settingsPanel" class="settings-panel">
<div class="settings-title">설정</div><div class="settings-row"><button onclick="setTheme('light')">☀️ 밝게</button><button onclick="setTheme('dark')">🌙 어둡게</button></div>
<div class="font-size-row"><button onclick="changeFontSize(-5)">−</button><div id="fontSizeValue" class="font-size-value">100%</div><button onclick="changeFontSize(5)">＋</button></div>
</div></div></header>
<main>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="회의록 검색..." oninput="render()"></div>
<div id="status" class="status">회의록을 불러오는 중입니다...</div><div id="list"></div></main>
<button id="topButton" class="top-button" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const API_URL="https://script.google.com/macros/s/AKfycby_-pqtGkhDvYNpQSrGBQKrVLwLKT6fRWBjZIQwpDlXKgM0WZ_9e6Cx_s76hdxAf1Tx/exec";
let sourceRows=[];let meetings=[];

function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function clean(v){return String(v??'').replace(/\u00a0/g,' ').trim()}
function toggleCard(card){card.classList.toggle('open')}
function toggleSettings(){document.getElementById('settingsPanel').classList.toggle('show')}
document.addEventListener('click',e=>{const p=document.getElementById('settingsPanel');const b=document.querySelector('.settings-button');if(p.classList.contains('show')&&!p.contains(e.target)&&!b.contains(e.target))p.classList.remove('show')});
function setTheme(theme){document.body.classList.toggle('dark',theme==='dark');localStorage.setItem('회의록2026_theme',theme)}
function changeFontSize(step){let n=parseInt(localStorage.getItem('회의록2026_fontSize')||'100',10);n=Math.max(80,Math.min(150,n+step));document.documentElement.style.fontSize=n+'%';document.getElementById('fontSizeValue').textContent=n+'%';localStorage.setItem('회의록2026_fontSize',n)}
function applySettings(){const t=localStorage.getItem('회의록2026_theme')||'light';setTheme(t);const n=parseInt(localStorage.getItem('회의록2026_fontSize')||'100',10);document.documentElement.style.fontSize=n+'%';document.getElementById('fontSizeValue').textContent=n+'%'}
function goHome(){location.href='index.html'}
function goBack(){if(history.length>1)history.back();else location.href='index.html'}

function getPayload(json){
  if(Array.isArray(json)) return json;
  if(!json||typeof json!=='object') return [];
  for(const k of ['rows','data','values','records','meetings','result']) if(Array.isArray(json[k])) return json[k];
  return [];
}
function rowToObject(row){
  if(Array.isArray(row)) return {number:row[0],title:row[1],detail:row.slice(2).filter(v=>clean(v)!=='').join('\n')};
  if(row&&typeof row==='object'){
    const number=row.number??row.no??row.번호??row['번호']??row.id??'';
    const title=row.title??row.name??row.제목??row['제목']??'';
    let detail=row.detail??row.content??row.text??row.내용??row['내용']??'';
    if(!clean(detail)){const keys=Object.keys(row).filter(k=>!['number','no','번호','id','title','name','제목'].includes(k));detail=keys.map(k=>row[k]).filter(v=>clean(v)!=='').join('\n')}
    return {number,title,detail};
  }
  return {number:'',title:'',detail:String(row??'')};
}
function mainNumber(value){
  const s=clean(value);const m=s.match(/^(\d+)/);return m?m[1]:'';
}
function normalizeRows(rows){
  const out=[];
  rows.map(rowToObject).forEach((r,i)=>{
    const no=clean(r.number);if(!no)return;
    const main=mainNumber(no);if(!main)return;
    out.push({number:no,group:main,title:clean(r.title),detail:clean(r.detail),index:i});
  });
  return out;
}
function render(){
  const q=clean(document.getElementById('search').value).toLowerCase();
  const data=meetings.filter(m=>!q||[m.number,m.title,m.detail].join(' ').toLowerCase().includes(q));
  const groups={};
  data.forEach(m=>{(groups[m.group]??=[]).push(m)});
  const nums=Object.keys(groups).sort((a,b)=>Number(a)-Number(b));
  const list=document.getElementById('list');
  document.getElementById('status').textContent=`총 ${data.length}건 · 번호 ${nums.length?nums.join(', '):'-'} · 최신 시트 자료`;
  if(!data.length){list.innerHTML='<div class="empty">회의록이 없습니다.</div>';return}
  list.innerHTML=nums.map(g=>`<section class="meeting-group"><div class="group-title"><span class="group-number">${esc(g)}</span><span>회의록 ${esc(g)}</span></div>${groups[g].map(m=>`<article class="card"><div class="card-head" onclick="toggleCard(this.parentElement)"><div class="number-badge"><div class="badge-main">${esc(m.number)}</div></div><div class="card-main"><div class="card-title">${esc(m.title||('회의록 '+m.number))}</div><div class="card-preview">${esc(m.detail)}</div></div><div class="chevron">⌄</div></div><div class="card-content"><div class="row-number">번호 ${esc(m.number)}</div>${m.title?`<div class="detail" style="font-weight:800;margin-bottom:10px">${esc(m.title)}</div>`:''}<div class="detail">${esc(m.detail)}</div></div></article>`).join('')}</section>`).join('');
}
async function loadData(){
  const status=document.getElementById('status');status.textContent='회의록을 불러오는 중입니다...';
  try{
    const response=await fetch(API_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const json=await response.json();
    const rows=getPayload(json);sourceRows=rows;meetings=normalizeRows(rows);
    if(!meetings.length)throw new Error('번호가 있는 회의록 자료를 찾지 못했습니다.');
    render();
  }catch(e){console.error(e);status.textContent='자료를 가져오지 못했습니다.';document.getElementById('list').innerHTML=`<div class="empty error">❌ ${esc(e.message||e)}</div>`}
}
applySettings();loadData();
window.addEventListener('scroll',()=>{document.getElementById('topButton').style.display=window.scrollY>500?'block':'none'});
</script></body></html>
