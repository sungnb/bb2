<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#286b5b">

<title>회의록 2026</title>

<style>

/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  background: #f3f5f4;
  color: #26302d;

  font-size: 15px;
  line-height: 1.7;
}


/* =========================================================
   상단
========================================================= */

header {
  position: sticky;
  top: 0;
  z-index: 100;

  background: rgba(255,255,255,.96);
  backdrop-filter: blur(12px);

  border-bottom: 1px solid #dce4e0;
}

.header-inner {
  max-width: 900px;
  margin: auto;

  padding: 10px 14px;

  display: flex;
  align-items: center;

  gap: 10px;
}

.back,
.settings-button {
  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 12px;

  background: #edf3f0;
  color: #286b5b;

  font-size: 25px;
  font-weight: bold;

  cursor: pointer;
}

.settings-button {
  font-size: 20px;
}

.title-area {
  flex: 1;
  min-width: 0;
}

.page-title {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.04em;
}

.page-subtitle {
  margin-top: 1px;
  font-size: 11px;
  color: #7a8580;
}


/* =========================================================
   설정
========================================================= */

.settings-panel {
  display: none;

  position: absolute;
  right: 14px;
  top: 58px;

  width: 220px;

  padding: 14px;

  border-radius: 14px;

  background: #fff;
  border: 1px solid #d9e2de;

  box-shadow: 0 8px 25px rgba(0,0,0,.12);

  z-index: 200;
}

.settings-panel.show {
  display: block;
}

.settings-title {
  font-weight: 800;
  margin-bottom: 10px;
}

.settings-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.settings-row button,
.font-size-row button {
  border: 0;
  border-radius: 9px;

  padding: 9px;

  background: #edf3f0;
  color: #286b5b;

  cursor: pointer;
}

.settings-row button {
  flex: 1;
}

.font-size-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.font-size-row button {
  width: 38px;
}

.font-size-value {
  flex: 1;
  text-align: center;
}


/* =========================================================
   본문
========================================================= */

main {
  max-width: 900px;
  margin: auto;

  padding: 14px 12px 80px;
}

.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.search {
  flex: 1;
  min-width: 0;

  height: 42px;

  padding: 0 13px;

  border: 1px solid #d7e0dc;
  border-radius: 11px;

  background: white;

  font-size: 14px;

  outline: none;
}

.status {
  margin: 8px 2px 12px;

  font-size: 12px;
  color: #74807b;
}


/* =========================================================
   회의 카드
========================================================= */

.card {
  margin-bottom: 12px;

  background: white;

  border: 1px solid #d9e2de;
  border-radius: 15px;

  overflow: hidden;

  box-shadow: 0 2px 7px rgba(0,0,0,.035);
}


/* =========================================================
   제목 영역
   제목 + 날짜 + 화살표
========================================================= */

.card-head {
  padding: 13px 13px;

  display: flex;
  align-items: center;

  gap: 10px;

  cursor: pointer;
  user-select: none;
}

.card-main {
  flex: 1;
  min-width: 0;
}

.card-title {
  font-size: 18px;
  font-weight: 900;

  color: #27312e;

  line-height: 1.45;

  word-break: keep-all;

  letter-spacing: -.03em;

  text-align: left;
}


/* =========================================================
   제목 오른쪽 날짜
   9월
   3일
========================================================= */

.date-box {
  flex: 0 0 auto;

  min-width: 45px;

  text-align: center;

  padding: 3px 4px 4px;

  line-height: 1.15;

  border-left: 1px solid #e2e9e6;
}

.date-month {
  display: block;

  font-size: 11px;
  font-weight: 700;

  color: #74807b;
}

.date-day {
  display: block;

  margin-top: 2px;

  font-size: 17px;
  font-weight: 900;

  color: #286b5b;
}


/* =========================================================
   화살표
========================================================= */

.chevron {
  width: 20px;

  text-align: center;

  color: #74807b;

  font-size: 16px;

  transition: transform .2s;
}

.card.open .chevron {
  transform: rotate(180deg);
}


/* =========================================================
   펼쳐지는 내용
========================================================= */

.card-content {
  display: none;

  border-top: 1px solid #e6ece9;

  padding: 14px 14px 20px;

  text-align: left;
}

.card.open .card-content {
  display: block;
}


/* =========================================================
   일반 회의 항목
========================================================= */

.meeting-section {
  margin: 0 0 13px;
  padding: 0 0 12px;

  border-bottom: 1px solid #edf1ef;

  text-align: left;
}

.meeting-section:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: 0;
}


/* =========================================================
   항목 제목
========================================================= */

.section-label {
  display: inline-block;

  margin-bottom: 8px;

  padding: 5px 10px;

  border-radius: 8px;

  background: #edf5f2;
  color: #286b5b;

  font-size: 13px;
  font-weight: 800;

  line-height: 1.35;

  text-align: left;
}


/* =========================================================
   항목 내용
========================================================= */

.section-value {
  width: 100%;

  font-size: 15px;

  color: #36403c;

  line-height: 1.85;

  text-align: left;

  white-space: pre-wrap;

  word-break: break-word;
}


/* =========================================================
   참석자 등 일반 정보
========================================================= */

.info-row {
  margin-bottom: 12px;

  text-align: left;
}

.info-label {
  display: inline-block;

  min-width: 58px;

  margin-right: 7px;

  font-size: 13px;
  font-weight: 800;

  color: #286b5b;

  text-align: left;
}

.info-value {
  display: inline;

  font-size: 14px;

  color: #36403c;

  line-height: 1.8;

  white-space: pre-wrap;

  text-align: left;
}


/* =========================================================
   ● / ○ 글머리표
========================================================= */

.bullet-line {
  display: block;

  margin: 0 0 8px;

  padding: 0;

  line-height: 1.8;

  text-align: left;

  white-space: pre-wrap;

  word-break: break-word;
}

.bullet-line:last-child {
  margin-bottom: 0;
}


/* 1단계 ● */
.bullet-main {
  padding-left: 0;
}


/* 2단계 ○ */
.bullet-sub {
  padding-left: 22px;
}


/* 3단계 */
.bullet-third {
  padding-left: 44px;
}


/* =========================================================
   빈 화면 / 오류
========================================================= */

.empty {
  background: white;

  border: 1px solid #dce4e0;
  border-radius: 14px;

  padding: 22px 16px;

  color: #6d7873;
}

.error {
  color: #b33a3a;
}


/* =========================================================
   위로가기
========================================================= */

.top-button {
  position: fixed;

  right: 16px;
  bottom: 18px;

  width: 45px;
  height: 45px;

  border: 0;
  border-radius: 50%;

  background: #286b5b;
  color: white;

  font-size: 19px;

  box-shadow: 0 4px 14px rgba(0,0,0,.18);

  display: none;

  cursor: pointer;
}


/* =========================================================
   어두운 화면
========================================================= */

body.dark {
  background: #121715;
  color: #edf3f0;
}

body.dark header {
  background: rgba(25,31,28,.97);
  border-color: #303a36;
}

body.dark .page-title {
  color: #f0f5f2;
}

body.dark .page-subtitle {
  color: #9ba7a1;
}

body.dark .back,
body.dark .settings-button {
  background: #26332e;
  color: #8fd0b9;
}

body.dark .search {
  background: #1c2421;
  color: #edf3f0;
  border-color: #394640;
}

body.dark .card {
  background: #1a211e;
  border-color: #35403b;
}

body.dark .card-title {
  color: #eef3f0;
}

body.dark .date-box {
  border-color: #303a36;
}

body.dark .date-month {
  color: #a9b4af;
}

body.dark .date-day {
  color: #91d0bb;
}

body.dark .card-content {
  border-color: #303a36;
}

body.dark .section-value,
body.dark .info-value {
  color: #d7e0dc;
}

body.dark .section-label {
  background: #24352e;
  color: #91d0bb;
}

body.dark .meeting-section {
  border-color: #303a36;
}

body.dark .info-label {
  color: #91d0bb;
}

body.dark .status {
  color: #a9b4af;
}

body.dark .settings-panel {
  background: #1a211e;
  border-color: #35403b;
  color: #edf3f0;
}

body.dark .settings-row button,
body.dark .font-size-row button {
  background: #26332e;
  color: #91d0bb;
}


/* =========================================================
   PC
========================================================= */

@media(min-width:700px) {

  main {
    padding-left: 20px;
    padding-right: 20px;
  }

  .card-head {
    padding: 15px 17px;
  }

  .card-content {
    padding: 17px 19px 23px;
  }
}


/* =========================================================
   휴대폰
========================================================= */

@media(max-width:600px) {

  .page-title {
    font-size: 19px;
  }

  .toolbar {
    gap: 6px;
  }

  .settings-panel {
    right: 10px;
  }

  .card-title {
    font-size: 17px;
  }

  .date-box {
    min-width: 42px;
  }

  .date-day {
    font-size: 16px;
  }

  .section-value {
    font-size: 14px;
    line-height: 1.85;
  }
}

</style>
</head>


<body>


<!-- =======================================================
     상단
======================================================= -->

<header>

  <div class="header-inner">

    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">
      ‹
    </button>


    <div class="title-area">

      <div class="page-title">
        회의록
      </div>

      <div class="page-subtitle">
        서울북부회중 회의 기록 · 2026
      </div>

    </div>


    <button
      class="settings-button"
      onclick="toggleSettings()"
      aria-label="설정">
      ⚙️
    </button>


    <div
      id="settingsPanel"
      class="settings-panel">

      <div class="settings-title">
        설정
      </div>


      <div class="settings-row">

        <button
          id="lightButton"
          onclick="setTheme('light')">
          ☀️ 밝게
        </button>

        <button
          id="darkButton"
          onclick="setTheme('dark')">
          🌙 어둡게
        </button>

      </div>


      <div class="font-size-row">

        <button onclick="changeFontSize(-5)">
          −
        </button>

        <div
          id="fontSizeValue"
          class="font-size-value">
          100%
        </div>

        <button onclick="changeFontSize(5)">
          ＋
        </button>

      </div>

    </div>

  </div>

</header>


<!-- =======================================================
     본문
======================================================= -->

<main>

  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">

  </div>


  <div
    id="status"
    class="status">
    회의록을 불러오는 중입니다...
  </div>


  <div id="list"></div>

</main>


<!-- =======================================================
     위로가기
======================================================= -->

<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>


/* =========================================================
   Apps Script 주소
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbysgotaoVEulLRZPFh9BXMKiRvbi9FTUvC4qk3R9P4xbJSyydBf0EaekH3D471kRkkY/exec";


let meetings = [];


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    applySettings();

    loadData();

  }
);


/* =========================================================
   데이터 가져오기
========================================================= */

async function loadData() {

  const status =
    document.getElementById("status");


  status.textContent =
    "회의록을 불러오는 중입니다...";


  try {

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "서버 응답 오류: " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "회의록 API:",
      data
    );


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        data?.error ||
        "데이터를 가져오지 못했습니다."
      );

    }


    let rows = [];


    if (Array.isArray(data.meetings)) {

      rows = data.meetings;

    }

    else if (Array.isArray(data.rows)) {

      rows = data.rows;

    }

    else if (Array.isArray(data.records)) {

      rows = data.records;

    }

    else if (Array.isArray(data.data)) {

      rows = data.data;

    }


    meetings =
      normalizeRows(rows);


    if (meetings.length === 0) {

      throw new Error(
        "회의록 자료를 찾지 못했습니다."
      );

    }


    render();

  }


  catch (error) {

    console.error(
      "회의록 데이터 로드 오류:",
      error
    );


    status.textContent =
      "자료를 가져오지 못했습니다.";


    document.getElementById(
      "list"
    ).innerHTML = `

      <div class="empty error">

        ❌ 자료를 가져오지 못했습니다.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}


/* =========================================================
   Apps Script 데이터 변환

   실제 구조

   number : A열
   b      : B열
   c      : C열
   d      : D열
   e      : E열

   예:

   1
   B = 서울북부회중 정기장로모임

   1-1
   B = 일시
   C = 2026. 9. 3.
   D = 회의 장소
   E = ...

   1-2
   B = 참석자
   C = ...

   1-5
   B = 안건

   1-6
   B = 실제 안건

   1-7
   B = 회의 내용

   1-8
   B = 실제 회의 내용
========================================================= */

function normalizeRows(rows) {

  const result = [];


  rows.forEach(
    function(row, index) {

      if (
        Array.isArray(row)
      ) {

        result.push({

          number:
            clean(row[0]),

          b:
            clean(row[1]),

          c:
            clean(row[2]),

          d:
            clean(row[3]),

          e:
            clean(row[4]),

          index:
            index

        });

        return;

      }


      if (
        row &&
        typeof row === "object"
      ) {

        result.push({

          number:
            clean(
              row.number ??
              row.no ??
              row.번호 ??
              row["번호"]
            ),

          b:
            clean(
              row.b ??
              row.title ??
              row.name ??
              row.제목 ??
              row["제목"]
            ),

          c:
            clean(
              row.c ??
              row.content ??
              row.내용 ??
              row["내용"]
            ),

          d:
            clean(
              row.d
            ),

          e:
            clean(
              row.e
            ),

          index:
            index

        });

      }

    }
  );


  return result;

}


/* =========================================================
   메인 번호
========================================================= */

function mainNumber(value) {

  const s =
    clean(value);


  const match =
    s.match(/^(\d+)/);


  return match
    ? match[1]
    : "";

}


/* =========================================================
   회의별 그룹 만들기
========================================================= */

function buildMeetings(items) {

  const groups = {};


  items.forEach(
    function(item) {

      if (!item.number) {
        return;
      }


      const group =
        mainNumber(item.number);


      if (!group) {
        return;
      }


      if (!groups[group]) {

        groups[group] = [];

      }


      groups[group].push(item);

    }
  );


  return Object.keys(groups)

    .sort(
      function(a,b) {

        return Number(a) - Number(b);

      }
    )

    .map(
      function(groupNumber) {

        const items =
          groups[groupNumber]
          .slice()
          .sort(
            function(a,b) {

              return a.index - b.index;

            }
          );


        const main =
          items.find(
            function(item) {

              return item.number === groupNumber;

            }
          ) || items[0];


        const subItems =
          items.filter(
            function(item) {

              return item !== main;

            }
          );


        const dateItem =
          subItems.find(
            function(item) {

              return (
                item.number ===
                  groupNumber + "-1"

                ||

                item.number ===
                  groupNumber + ".1"

                ||

                item.b === "일시"

              );

            }
          );


        const date =
          dateItem
            ? dateItem.c
            : "";


        return {

          group:
            groupNumber,

          title:
            removeCellNumber(
              main.b
            ),

          date:
            removeCellNumber(
              date
            ),

          items:
            subItems,

          index:
            main.index

        };

      }
    );

}


/* =========================================================
   날짜 월
========================================================= */

function getMonth(dateText) {

  const match =
    String(dateText || "")
      .match(/(?:\d{4}\D+)?(\d{1,2})\D+(\d{1,2})/);


  if (!match) {
    return "";
  }


  return match[1] + "월";

}


/* =========================================================
   날짜 일
========================================================= */

function getDay(dateText) {

  const match =
    String(dateText || "")
      .match(/(?:\d{4}\D+)?(\d{1,2})\D+(\d{1,2})/);


  if (!match) {
    return "";
  }


  return match[2] + "일";

}


/* =========================================================
   화면 출력
========================================================= */

function render() {

  const query =
    clean(
      document.getElementById(
        "search"
      ).value
    ).toLowerCase();


  const allMeetings =
    buildMeetings(meetings);


  const filtered =
    allMeetings.filter(
      function(meeting) {

        const text =
          JSON.stringify(meeting)
            .toLowerCase();


        return (
          !query ||
          text.includes(query)
        );

      }
    );


  document.getElementById(
    "status"
  ).textContent =
    "총 " +
    filtered.length +
    "개 회의록 · 최신 시트 자료";


  const list =
    document.getElementById(
      "list"
    );


  if (
    filtered.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        회의록이 없습니다.

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered.map(
      function(meeting) {

        const contentHtml =
          buildMeetingContent(
            meeting.items
          );


        const month =
          getMonth(
            meeting.date
          );


        const day =
          getDay(
            meeting.date
          );


        return `

          <article class="card">


            <!-- 제목 -->

            <div
              class="card-head"
              onclick="toggleCard(this.parentElement)"
            >


              <div class="card-main">

                <div class="card-title">

                  ${escapeHtml(
                    meeting.title
                  )}

                </div>

              </div>


              <!-- 제목 오른쪽 날짜 -->

              ${
                meeting.date
                ? `

                  <div class="date-box">

                    <span class="date-month">

                      ${escapeHtml(month)}

                    </span>

                    <span class="date-day">

                      ${escapeHtml(day)}

                    </span>

                  </div>

                `
                : ""
              }


              <div class="chevron">

                ⌄

              </div>


            </div>


            <!-- 회의 내용 -->

            <div class="card-content">

              ${contentHtml}

            </div>


          </article>

        `;

      }
    ).join("");

}


/* =========================================================
   회의 내용 만들기
========================================================= */

function buildMeetingContent(items) {

  const result = [];

  let i = 0;


  while (
    i < items.length
  ) {

    const item =
      items[i];


    const label =
      clean(item.b);


    const value =
      clean(item.c);


    const number =
      item.number;


    /*
       1-1 일시는 제목 옆에 이미 표시
    */

    if (
      /-1$/.test(number)
      ||
      /\.1$/.test(number)
    ) {

      i++;

      continue;

    }


    /*
       안건
       다음 행의 실제 내용까지 묶음
    */

    if (
      label === "안건"
    ) {

      const next =
        items[i + 1];


      const agendaText =
        next
          ? next.b
          : "";


      result.push(`

        <section class="meeting-section">

          <div class="section-label">

            안건

          </div>

          <div class="section-value">

            ${formatBullets(
              agendaText
            )}

          </div>

        </section>

      `);


      i += 2;

      continue;

    }


    /*
       회의 내용
       다음 행의 실제 내용까지 묶음
    */

    if (
      label === "회의 내용"
    ) {

      const next =
        items[i + 1];


      const meetingText =
        next
          ? next.b
          : "";


      result.push(`

        <section class="meeting-section">

          <div class="section-label">

            회의 내용

          </div>

          <div class="section-value">

            ${formatBullets(
              meetingText
            )}

          </div>

        </section>

      `);


      i += 2;

      continue;

    }


    /*
       일반 정보

       참석자
       불참자
       시작 기도
       마치는 기도
       회의 장소 등
    */

    if (
      label ||
      value ||
      item.d ||
      item.e
    ) {

      let html = "";


      if (label) {

        html += `

          <div class="info-row">

            <span class="info-label">

              ${escapeHtml(label)}

            </span>

            <span class="info-value">

              ${formatBullets(
                value
              )}

            </span>

          </div>

        `;

      }


      if (
        item.d ||
        item.e
      ) {

        html += `

          <div class="info-row">

            <span class="info-label">

              ${escapeHtml(item.d)}

            </span>

            <span class="info-value">

              ${formatBullets(
                item.e
              )}

            </span>

          </div>

        `;

      }


      result.push(html);

    }


    i++;

  }


  if (
    result.length === 0
  ) {

    return `

      <div class="empty">

        회의 내용이 없습니다.

      </div>

    `;

  }


  return result.join("");

}


/* =========================================================
   ● / ○ 줄 표시

   ● = 왼쪽
   ○ = 한 단계 들여쓰기

   원래 줄바꿈은 그대로 유지
========================================================= */

function formatBullets(text) {

  if (!text) {
    return "";
  }


  const lines =
    String(text)
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n")
      .split("\n");


  return lines
    .map(
      function(line) {

        const original =
          line;


        const trimmed =
          line.trim();


        if (!trimmed) {

          return `<div style="height:7px"></div>`;

        }


        /*
           ●
        */

        if (
          /^●/.test(trimmed)
        ) {

          return `

            <div class="bullet-line bullet-main">

              ${escapeHtml(
                trimmed
              )}

            </div>

          `;

        }


        /*
           ○
        */

        if (
          /^○/.test(trimmed)
        ) {

          return `

            <div class="bullet-line bullet-sub">

              ${escapeHtml(
                trimmed
              )}

            </div>

          `;

        }


        /*
           ■
        */

        if (
          /^■/.test(trimmed)
        ) {

          return `

            <div class="bullet-line bullet-third">

              ${escapeHtml(
                trimmed
              )}

            </div>

          `;

        }


        /*
           일반 문장
        */

        return `

          <div class="bullet-line">

            ${escapeHtml(
              original
            )}

          </div>

        `;

      }
    )
    .join("");

}


/* =========================================================
   번호 제거
========================================================= */

function removeCellNumber(text) {

  let s =
    clean(text);


  /*
     앞에 붙은
     1
     1-1
     1.1
     등의 번호 제거
  */

  s =
    s.replace(
      /^\s*\d+(?:[-.]\d+)*\s*/,
      ""
    );


  /*
     뒤에 붙은 번호 제거
  */

  s =
    s.replace(
      /\s*\d+(?:[-.]\d+)*\s*$/,
      ""
    );


  return clean(s);

}


/* =========================================================
   카드 열기 / 닫기
========================================================= */

function toggleCard(card) {

  card.classList.toggle(
    "open"
  );

}


/* =========================================================
   HTML 문자 처리
========================================================= */

function escapeHtml(text) {

  return String(
    text ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   공백 정리
========================================================= */

function clean(value) {

  return String(
    value ?? ""
  )

    .replace(
      /\u00a0/g,
      " "
    )

    .trim();

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

  }

  else {

    window.location.href =
      "전시대관리자.html";

  }

}


/* =========================================================
   설정
========================================================= */

const SETTINGS_THEME_KEY =
  "회의록2026_theme";

const SETTINGS_FONT_KEY =
  "회의록2026_fontSize";


function applySettings() {

  const theme =
    localStorage.getItem(
      SETTINGS_THEME_KEY
    ) || "dark";


  const fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    ) || 100;


  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );


  document.body.style.zoom =
    String(
      fontSize / 100
    );


  document.getElementById(
    "fontSizeValue"
  ).textContent =
    fontSize + "%";

}


function setTheme(theme) {

  localStorage.setItem(
    SETTINGS_THEME_KEY,
    theme
  );


  applySettings();

}


function changeFontSize(amount) {

  let fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    ) || 100;


  fontSize += amount;


  if (fontSize < 80) {
    fontSize = 80;
  }


  if (fontSize > 150) {
    fontSize = 150;
  }


  localStorage.setItem(
    SETTINGS_FONT_KEY,
    fontSize
  );


  applySettings();

}


function toggleSettings() {

  document.getElementById(
    "settingsPanel"
  ).classList.toggle(
    "show"
  );

}


document.addEventListener(
  "click",
  function(event) {

    const panel =
      document.getElementById(
        "settingsPanel"
      );


    const button =
      document.querySelector(
        ".settings-button"
      );


    if (
      panel &&
      panel.classList.contains("show") &&
      !panel.contains(event.target) &&
      !button.contains(event.target)
    ) {

      panel.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   위로가기
========================================================= */

window.addEventListener(
  "scroll",
  function() {

    document.getElementById(
      "topButton"
    ).style.display =
      window.scrollY > 500
        ? "block"
        : "none";

  }
);

</script>
