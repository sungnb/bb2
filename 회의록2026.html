<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#1f6f5b">

<title>회의록</title>


<style>

/* ============================================================
   기본
   ============================================================ */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  background:#f4f6f5;
  color:#202624;

  line-height:1.65;

  font-size:16px;

  text-align:left;
}


/* ============================================================
   상단
   ============================================================ */

header{

  position:sticky;
  top:0;
  z-index:100;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(10px);

  border-bottom:
    1px solid #e2e7e4;

}


.header-inner{

  max-width:900px;

  margin:auto;

  padding:10px 14px;

  display:flex;

  align-items:center;

  gap:10px;

}


.back{

  width:42px;
  height:42px;

  border:0;

  border-radius:12px;

  background:#eef3f1;

  color:#1f6f5b;

  font-size:25px;

  cursor:pointer;

}


.title-wrap{

  flex:1;

  min-width:0;

}


.title{

  font-size:21px;

  font-weight:800;

  letter-spacing:-.03em;

}


.subtitle{

  font-size:12px;

  color:#75807c;

}


.refresh{

  border:0;

  background:#1f6f5b;

  color:#fff;

  border-radius:11px;

  padding:9px 11px;

  font-size:13px;

  font-weight:700;

  cursor:pointer;

}


/* ============================================================
   본문
   ============================================================ */

main{

  max-width:900px;

  margin:auto;

  padding:14px 12px 80px;

}


/* ============================================================
   검색
   ============================================================ */

.toolbar{

  display:flex;

  gap:8px;

  margin:4px 0 10px;

}


.search{

  flex:1;

  min-width:0;

  border:1px solid #dfe5e2;

  border-radius:13px;

  background:#fff;

  color:#202624;

  padding:11px 13px;

  font-size:15px;

  outline:none;

}


.select{

  border:1px solid #dfe5e2;

  border-radius:13px;

  background:#fff;

  color:#39423f;

  padding:0 10px;

  font-size:14px;

  outline:none;

}


.status{

  margin:0 2px 14px;

  color:#6f7975;

  font-size:13px;

  text-align:left;

}


/* ============================================================
   월 제목
   ============================================================ */

.month{

  margin:22px 0 9px;

  font-size:17px;

  font-weight:800;

  color:#1f6f5b;

  text-align:left;

}


/* ============================================================
   카드
   ============================================================ */

.card{

  background:#fff;

  border:1px solid #e3e8e5;

  border-radius:17px;

  margin-bottom:11px;

  overflow:hidden;

  box-shadow:
    0 3px 12px
    rgba(26,45,37,.05);

}


/* ============================================================
   카드 상단
   ============================================================ */

.card-head{

  padding:14px;

  cursor:pointer;

  display:flex;

  align-items:center;

  gap:12px;

  text-align:left;

}


/* ============================================================
   날짜 박스

   ┌──────┐
   │ 8월  │
   │ 4일  │
   └──────┘
   ============================================================ */

.date-badge{

  width:58px;

  min-width:58px;

  text-align:center;

  border-radius:12px;

  background:#edf5f1;

  padding:7px 3px;

  color:#1f6f5b;

}


.date-badge .mon{

  font-size:12px;

  font-weight:700;

  line-height:1.3;

}


.date-badge .day{

  font-size:21px;

  font-weight:850;

  line-height:1.2;

}


/* ============================================================
   제목 / 시간
   ============================================================ */

.card-main{

  flex:1;

  min-width:0;

  text-align:left;

}


.card-title{

  font-size:17px;

  font-weight:800;

  letter-spacing:-.02em;

  color:#202624;

  line-height:1.4;

  word-break:keep-all;

  text-align:left;

}


.card-time{

  font-size:14px;

  color:#68736e;

  font-weight:600;

  margin-top:3px;

  text-align:left;

}


/* ============================================================
   화살표
   ============================================================ */

.chev{

  flex:none;

  font-size:18px;

  color:#8a9590;

  transition:.2s;

}


.card.open .chev{

  transform:rotate(180deg);

}


/* ============================================================
   펼쳐지는 내용
   ============================================================ */

.content{

  display:none;

  border-top:
    1px solid #edf0ef;

  padding:14px;

  text-align:left;

}


.card.open .content{

  display:block;

}


/* ============================================================
   기본 정보
   ============================================================ */

.info{

  background:#f7f9f8;

  border-radius:12px;

  padding:10px 12px;

  margin-bottom:20px;

  font-size:14px;

  text-align:left;

}


.info-row{

  display:grid;

  grid-template-columns:85px 1fr;

  gap:8px;

  padding:5px 0;

  text-align:left;

}


.info-label{

  color:#46514d;

  font-weight:800;

  text-align:left;

}


.info-value{

  min-width:0;

  word-break:break-word;

  text-align:left;

}


/* ============================================================
   섹션 제목
   ============================================================ */

.section-title{

  font-size:16px;

  font-weight:900;

  color:#1f6f5b;

  margin:24px 0 10px;

  padding-left:9px;

  border-left:
    4px solid #1f6f5b;

  text-align:left;

}


/* ============================================================
   안건 / 회의 내용 목록
   ============================================================ */

.bullet-list{

  margin:0;

  padding:0;

  list-style:none;

  text-align:left;

}


.bullet-item{

  position:relative;

  padding-left:20px;

  margin:9px 0;

  text-align:left;

}


.bullet-item::before{

  content:"●";

  position:absolute;

  left:0;

  top:0;

  color:#1f6f5b;

  font-size:11px;

}


/* ============================================================
   회의 내용
   ============================================================ */

.topic{

  font-weight:800;

  color:#293531;

  text-align:left;

}


.detail{

  white-space:pre-wrap;

  margin-top:4px;

  color:#414a46;

  text-align:left;

  word-break:break-word;

}


/* ============================================================
   상태
   ============================================================ */

.empty,
.loading,
.error{

  background:#fff;

  border:1px solid #e3e8e5;

  border-radius:16px;

  padding:24px 16px;

  color:#727d78;

  text-align:left;

}


.error{

  color:#a14b4b;

}


/* ============================================================
   맨 위 버튼
   ============================================================ */

.top{

  position:fixed;

  right:16px;
  bottom:18px;

  width:46px;
  height:46px;

  border:0;

  border-radius:50%;

  background:#1f6f5b;

  color:#fff;

  font-size:19px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.15);

  display:none;

  cursor:pointer;

}


/* ============================================================
   PC
   ============================================================ */

@media(min-width:700px){

  main{

    padding-left:18px;
    padding-right:18px;

  }

  .card-head{

    padding:18px;

  }

  .content{

    padding:18px 22px;

  }

}


/* ============================================================
   다크 모드
   ============================================================ */

body.dark{

  background:#111615;

  color:#edf3f0;

}


body.dark header{

  background:
    rgba(24,29,27,.96);

  border-color:#303936;

}


body.dark .back{

  background:#26312d;

  color:#8ed0b8;

}


body.dark .search,
body.dark .select{

  background:#1b211f;

  color:#edf3f0;

  border-color:#39433f;

}


body.dark .status{

  color:#a8b3ae;

}


body.dark .month{

  color:#8ed0b8;

}


body.dark .card{

  background:#1a201e;

  border-color:#343d39;

}


body.dark .date-badge{

  background:#24352e;

  color:#8ed0b8;

}


body.dark .card-title{

  color:#f3f7f5;

}


body.dark .card-time{

  color:#a8b3ae;

}


body.dark .content{

  border-color:#303936;

}


body.dark .info{

  background:#202825;

}


body.dark .info-label{

  color:#dce8e3;

}


body.dark .info-value{

  color:#edf3f0;

}


body.dark .section-title{

  color:#8ed0b8;

  border-color:#8ed0b8;

}


body.dark .topic{

  color:#dce8e3;

}


body.dark .detail{

  color:#c7d0cc;

}


body.dark .empty,
body.dark .loading,
body.dark .error{

  background:#1a201e;

  border-color:#343d39;

}


body.dark .title{

  color:#f3f7f5;

}


body.dark .subtitle{

  color:#a8b3ae;

}

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">

      ‹

    </button>


    <div class="title-wrap">

      <div class="title">
        회의록
      </div>

      <div class="subtitle">
        서울북부회중 회의 기록
      </div>

    </div>


    <button
      class="refresh"
      onclick="loadMinutes()">

      새로고침

    </button>

  </div>

</header>


<main>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">


    <select
      id="year"
      class="select"
      onchange="render()">

      <option value="all">
        전체
      </option>

    </select>

  </div>


  <div
    id="status"
    class="status">

    회의록을 불러오는 중입니다.

  </div>


  <div
    id="list"
    class="loading">

    잠시만 기다려 주세요.

  </div>


</main>


<button
  id="topBtn"
  class="top"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>

/* ============================================================
   Google Apps Script 웹앱 주소
   ============================================================ */

const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxweQpbKaFVLVTIrqbDsrlekMv_2loBJMMQP0wX5UYYo-CewqXNmR2l3iDBidC8wHon/exec";


/* ============================================================
   설정
   ============================================================ */

const THEME_KEY = "bukbu_theme";

const FONT_SIZE_KEY = "bukbu_font_size";


/* ============================================================
   회의록 데이터

   중요:
   Apps Script에서 받은 데이터만 저장합니다.
   기존 데이터와 합치지 않습니다.
   중복 제거도 하지 않습니다.

   API가 15개면 정확히 15개만 표시됩니다.
   ============================================================ */

let meetings = [];


/* ============================================================
   HTML 문자 보호
   ============================================================ */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(s){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        }[s];

      }
    );

}


/* ============================================================
   날짜 변환

   YYYY-MM-DD
   ============================================================ */

function parseDate(value){

  const text =
    String(value || "")
      .trim();


  let match =
    text.match(
      /(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/
    );


  if(!match){

    match =
      text.match(
        /(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/
      );

  }


  if(!match){

    return "";

  }


  return (
    match[1] +
    "-" +
    String(match[2]).padStart(2,"0") +
    "-" +
    String(match[3]).padStart(2,"0")
  );

}


/* ============================================================
   회의 날짜
   ============================================================ */

function getMeetingDate(m){

  const direct =
    parseDate(m.date);


  if(direct){

    return direct;

  }


  return parseDate(
    m.datetime
  );

}


/* ============================================================
   날짜에서 시간 추출

   예:
   2026년 8월 4일 21:20
   → 오후 9:20
   ============================================================ */

function getMeetingTime(datetime){

  const text =
    String(datetime || "")
      .trim();


  const match =
    text.match(
      /(\d{1,2}):(\d{2})/
    );


  if(!match){

    return "";

  }


  let hour =
    Number(match[1]);


  const minute =
    match[2];


  if(hour === 0){

    return "오전 12:" + minute;

  }


  if(hour < 12){

    return "오전 " + hour + ":" + minute;

  }


  if(hour === 12){

    return "오후 12:" + minute;

  }


  return (
    "오후 " +
    (hour - 12) +
    ":" +
    minute
  );

}


/* ============================================================
   월 제목
   ============================================================ */

function monthKey(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return "기타";

  }


  return (
    Number(match[1]) +
    "년 " +
    Number(match[2]) +
    "월"
  );

}


/* ============================================================
   월 / 일
   ============================================================ */

function getMonthDay(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return {
      month:"",
      day:""
    };

  }


  return {

    month:
      String(
        Number(match[2])
      ),

    day:
      String(
        Number(match[3])
      )

  };

}


/* ============================================================
   설정 적용
   ============================================================ */

function applySettings(){

  let theme = "light";

  let size = 1;


  try{

    theme =
      localStorage.getItem(
        THEME_KEY
      ) || "light";


    size =
      Number(
        localStorage.getItem(
          FONT_SIZE_KEY
        ) || 1
      );

  }

  catch(e){}


  if(
    !Number.isFinite(size) ||
    size < .8 ||
    size > 1.5
  ){

    size = 1;

  }


  document.documentElement.style.setProperty(
    "--font-scale",
    size
  );


  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );

}


applySettings();


/* ============================================================
   뒤로가기
   ============================================================ */

function goBack(){

  if(history.length > 1){

    history.back();

  }

  else{

    location.href = "index.html";

  }

}


/* ============================================================
   연도 목록 생성
   ============================================================ */

function buildYears(){

  const select =
    document.getElementById("year");


  const currentValue =
    select.value;


  const years =
    [...new Set(

      meetings
        .map(
          function(m){

            const date =
              getMeetingDate(m);

            return date
              ? date.slice(0,4)
              : "";

          }
        )
        .filter(Boolean)

    )]
    .sort(
      function(a,b){

        return Number(b) - Number(a);

      }
    );


  select.innerHTML =
    '<option value="all">전체</option>' +
    years
      .map(
        function(year){

          return (
            '<option value="' +
            esc(year) +
            '">' +
            esc(year) +
            '년</option>'
          );

        }
      )
      .join("");


  if(
    years.includes(currentValue)
  ){

    select.value =
      currentValue;

  }

  else{

    select.value = "all";

  }

}


/* ============================================================
   카드 열기 / 닫기
   ============================================================ */

function toggleCard(card){

  card.classList.toggle("open");

}


/* ============================================================
   기본 정보
   ============================================================ */

function infoRow(label,value){

  if(
    !value ||
    !String(value).trim()
  ){

    return "";

  }


  return `

    <div class="info-row">

      <div class="info-label">
        ${esc(label)}
      </div>

      <div class="info-value">
        ${esc(value)}
      </div>

    </div>

  `;

}


/* ============================================================
   회의록 화면 표시
   ============================================================ */

function render(){

  const q =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const year =
    document
      .getElementById("year")
      .value;


  /* ==========================================================
     중요

     meetings 배열을 새로 만들지 않고
     현재 Apps Script에서 받은 데이터만 필터링합니다.
     ========================================================== */

  const data =
    meetings
      .map(
        function(m){

          return {
            ...m,
            _date:getMeetingDate(m)
          };

        }
      )
      .filter(
        function(m){

          const text =
            JSON.stringify(m)
              .toLowerCase();


          const matchSearch =
            !q ||
            text.includes(q);


          const matchYear =
            year === "all" ||
            String(m._date)
              .startsWith(year);


          return (
            matchSearch &&
            matchYear
          );

        }
      )
      .sort(
        function(a,b){

          return String(b._date)
            .localeCompare(
              String(a._date)
            );

        }
      );


  document
    .getElementById("status")
    .textContent =
      `총 ${data.length}건 · 최신 회의록이 먼저 표시됩니다.`;


  const list =
    document.getElementById("list");


  if(!data.length){

    list.innerHTML =
      '<div class="empty">회의록이 없습니다.</div>';

    return;

  }


  let lastMonth = "";


  list.innerHTML =
    data
      .map(
        function(m,index){

          const date =
            m._date;


          const md =
            getMonthDay(date);


          const currentMonth =
            monthKey(date);


          let monthHtml = "";


          if(
            currentMonth !== lastMonth
          ){

            monthHtml = `

              <div class="month">
                ${esc(currentMonth)}
              </div>

            `;


            lastMonth =
              currentMonth;

          }


          /* ==================================================
             카드 오른쪽 시간
             ================================================== */

          const time =
            getMeetingTime(
              m.datetime
            );


          /* ==================================================
             기본 정보

             일시는 날짜와 시간을 중복하지 않고
             카드 내부 상세 정보에만 표시
             ================================================== */

          const info =

            infoRow(
              "일시",
              m.datetime
            ) +

            infoRow(
              "회의 장소",
              m.place
            ) +

            infoRow(
              "참석자",
              m.attendees
            ) +

            infoRow(
              "불참자",
              m.absentees
            ) +

            infoRow(
              "시작 기도",
              m.startPrayer
            ) +

            infoRow(
              "마치는 기도",
              m.endPrayer
            );


          /* ==================================================
             안건
             ================================================== */

          let agendaHtml = "";


          if(
            Array.isArray(m.agenda) &&
            m.agenda.length
          ){

            const items =
              m.agenda
                .filter(
                  function(item){

                    return String(item || "")
                      .trim();

                  }
                )
                .map(
                  function(item){

                    return `

                      <li class="bullet-item">
                        ${esc(item)}
                      </li>

                    `;

                  }
                )
                .join("");


            if(items){

              agendaHtml = `

                <div class="section-title">
                  안건
                </div>

                <ul class="bullet-list">

                  ${items}

                </ul>

              `;

            }

          }


          /* ==================================================
             회의 내용

             각 topic을 ● 항목으로 표시
             ================================================== */

          let contentHtml = "";


          if(
            Array.isArray(m.content) &&
            m.content.length
          ){

            const items =
              m.content
                .map(
                  function(item){

                    const topic =
                      String(
                        item.topic || ""
                      )
                      .trim();


                    const detail =
                      String(
                        item.detail || ""
                      )
                      .trim();


                    if(
                      !topic &&
                      !detail
                    ){

                      return "";

                    }


                    return `

                      <li class="bullet-item">

                        ${
                          topic
                            ? `
                              <div class="topic">
                                ${esc(topic)}
                              </div>
                            `
                            : ""
                        }

                        ${
                          detail
                            ? `
                              <div class="detail">
                                ${esc(detail)}
                              </div>
                            `
                            : ""
                        }

                      </li>

                    `;

                  }
                )
                .join("");


            if(items){

              contentHtml = `

                <div class="section-title">
                  회의 내용
                </div>

                <ul class="bullet-list">

                  ${items}

                </ul>

              `;

            }

          }


          /* ==================================================
             최종 카드

             ┌──────┐
             │ 8월  │   서울북부회중 임시장로모임
             │ 4일  │   오후 9:20
             └──────┘
             ================================================== */

          return `

            ${monthHtml}


            <article
              class="card"
              id="meeting-${index}">


              <div
                class="card-head"
                onclick="toggleCard(this.parentElement)">


                <div class="date-badge">

                  <div class="mon">
                    ${esc(md.month)}월
                  </div>

                  <div class="day">
                    ${esc(md.day)}일
                  </div>

                </div>


                <div class="card-main">

                  <div class="card-title">
                    ${esc(m.title || "회의록")}
                  </div>

                  ${
                    time
                      ? `
                        <div class="card-time">
                          ${esc(time)}
                        </div>
                      `
                      : ""
                  }

                </div>


                <div class="chev">
                  ⌄
                </div>


              </div>


              <div class="content">


                ${
                  info
                    ? `
                      <div class="info">
                        ${info}
                      </div>
                    `
                    : ""
                }


                ${agendaHtml}


                ${contentHtml}


              </div>


            </article>

          `;

        }
      )
      .join("");

}


/* ============================================================
   회의록 불러오기

   가장 중요:
   Apps Script 응답값을 그대로 meetings에 대입합니다.

   절대 기존 meetings와 합치지 않습니다.
   ============================================================ */

async function loadMinutes(){

  const list =
    document.getElementById("list");


  const status =
    document.getElementById("status");


  list.innerHTML =
    '<div class="loading">구글 독스의 최신 회의록을 불러오는 중입니다…</div>';


  status.textContent =
    "최신 데이터를 확인하는 중입니다…";


  if(!GAS_WEB_APP_URL){

    list.innerHTML =
      '<div class="error">Google Apps Script 주소가 설정되지 않았습니다.</div>';


    status.textContent =
      "연결 설정 필요";


    return;

  }


  try{

    /* 캐시 방지 */

    const separator =
      GAS_WEB_APP_URL.includes("?")
        ? "&"
        : "?";


    const requestUrl =
      GAS_WEB_APP_URL +
      separator +
      "t=" +
      Date.now();


    console.log(
      "회의록 API 요청:",
      requestUrl
    );


    const res =
      await fetch(
        requestUrl,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!res.ok){

      throw new Error(
        "HTTP " + res.status
      );

    }


    const json =
      await res.json();


    console.log(
      "Apps Script 응답:",
      json
    );


    if(!json.success){

      throw new Error(
        json.error ||
        "데이터를 가져오지 못했습니다."
      );

    }


    /* ========================================================
       핵심

       기존 배열에 추가하지 않음

       meetings.push(...)
       meetings = meetings.concat(...)

       같은 코드를 사용하지 않음

       Apps Script 데이터로 완전히 교체
       ======================================================== */

    meetings =
      Array.isArray(json.meetings)
        ? json.meetings
        : [];


    console.log(
      "Apps Script 실제 회의록 수:",
      meetings.length
    );


    /* 연도 목록 생성 */

    buildYears();


    /* 화면 표시 */

    render();


  }

  catch(e){

    console.error(
      "회의록 로딩 오류:",
      e
    );


    list.innerHTML = `

      <div class="error">

        회의록을 불러오지 못했습니다.

        <br><br>

        ${esc(e.message)}

        <br><br>

        Google Apps Script 웹앱 주소와
        배포 상태를 확인해 주세요.

      </div>

    `;


    status.textContent =
      "불러오기 실패";

  }

}

/* ============================================================

loadMinutes();

</script>
