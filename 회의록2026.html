<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#286b5b">

<title>회의록 2026</title>


<style>

/* =========================================================
   기본
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  background: #f3f5f4;
  color: #26302d;

  font-size: 15px;
  line-height: 1.35;

  text-align: left !important;
}


/* =========================================================
   상단
========================================================= */

header {
  position: sticky;
  top: 0;
  z-index: 100;

  background: rgba(255,255,255,.96);

  backdrop-filter: blur(12px);

  border-bottom: 1px solid #dce4e0;

  text-align: left !important;
}


.header-inner {
  max-width: 900px;

  margin: auto;

  padding: 10px 14px;

  display: flex;

  align-items: center;

  gap: 10px;

  text-align: left !important;
}


.back,
.settings-button {

  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 12px;

  background: #edf3f0;

  color: #286b5b;

  font-size: 25px;

  font-weight: bold;

  cursor: pointer;
}

.settings-button {
  font-size: 20px;
}


.title-area {
  flex: 1;

  min-width: 0;

  text-align: left !important;
}


.page-title {

  font-size: 21px;

  font-weight: 800;

  letter-spacing: -.04em;

  text-align: left !important;
}


.page-subtitle {

  margin-top: 1px;

  font-size: 11px;

  color: #7a8580;

  text-align: left !important;
}


/* =========================================================
   설정
========================================================= */

.settings-panel {

  display: none;

  position: absolute;

  right: 14px;

  top: 58px;

  width: 220px;

  padding: 14px;

  border-radius: 14px;

  background: #fff;

  border: 1px solid #d9e2de;

  box-shadow: 0 8px 25px rgba(0,0,0,.12);

  z-index: 200;

  text-align: left !important;
}


.settings-panel.show {
  display: block;
}


.settings-title {

  font-weight: 800;

  margin-bottom: 10px;

  text-align: left !important;
}


.settings-row {

  display: flex;

  gap: 8px;

  margin-bottom: 10px;

  text-align: left !important;
}


.settings-row button,
.font-size-row button {

  border: 0;

  border-radius: 9px;

  padding: 9px;

  background: #edf3f0;

  color: #286b5b;

  cursor: pointer;
}


.settings-row button {
  flex: 1;
}


.font-size-row {

  display: flex;

  align-items: center;

  gap: 8px;

  text-align: left !important;
}


.font-size-row button {
  width: 38px;
}


.font-size-value {

  flex: 1;

  text-align: left !important;
}


/* =========================================================
   본문
========================================================= */

main {

  max-width: 900px;

  margin: auto;

  padding: 14px 12px 80px;

  text-align: left !important;
}


/* =========================================================
   검색
========================================================= */

.toolbar {

  display: flex;

  gap: 8px;

  margin-bottom: 8px;

  text-align: left !important;
}


.search {

  flex: 1;

  min-width: 0;

  height: 42px;

  padding: 0 13px;

  border: 1px solid #d7e0dc;

  border-radius: 11px;

  background: white;

  font-size: 14px;

  outline: none;

  text-align: left !important;
}


.status {

  margin: 8px 2px 12px;

  font-size: 12px;

  color: #74807b;

  text-align: left !important;
}


/* =========================================================
   회의 카드
========================================================= */

.meeting-group {

  margin: 18px 0 14px;

  text-align: left !important;
}


.card {

  margin-bottom: 10px;

  background: white;

  border: 1px solid #d9e2de;

  border-radius: 15px;

  overflow: hidden;

  box-shadow: 0 2px 7px rgba(0,0,0,.035);

  text-align: left !important;
}


/* =========================================================
   카드 제목 부분
========================================================= */

.card-head {

  padding: 11px 12px;

  display: flex;

  align-items: center;

  gap: 10px;

  cursor: pointer;

  user-select: none;

  text-align: left !important;
}


/* 날짜 */

.date-box {

  flex: 0 0 64px;

  width: 64px;

  min-width: 64px;

  padding: 5px 4px;

  color: #286b5b;

  background: #edf5f2;

  border-radius: 10px;

  line-height: 1.15;

  text-align: left !important;

  overflow: hidden;
}


.date-month {

  font-size: 12px;

  font-weight: 700;

  white-space: nowrap;

  text-align: left !important;
}


.date-day {

  margin-top: 3px;

  font-size: 18px;

  font-weight: 900;

  white-space: nowrap;

  text-align: left !important;
}


/* 제목 */

.card-main {

  flex: 1;

  min-width: 0;

  text-align: left !important;
}


.card-title {

  font-size: 18px;

  font-weight: 900;

  color: #27312e;

  line-height: 1.35;

  word-break: keep-all;

  letter-spacing: -.03em;

  text-align: left !important;
}


.card-preview {

  margin-top: 4px;

  font-size: 13px;

  color: #68756f;

  font-weight: 500;

  white-space: pre-wrap;

  overflow: hidden;

  text-align: left !important;
}


.chevron {

  width: 20px;

  min-width: 20px;

  color: #74807b;

  font-size: 15px;

  transition: transform .2s;

  text-align: left !important;
}


.card.open .chevron {
  transform: rotate(180deg);
}


/* =========================================================
   회의 내용
========================================================= */

.card-content {

  display: none;

  border-top: 1px solid #e6ece9;

  padding: 12px 13px 16px;

  text-align: left !important;
}


.card.open .card-content {
  display: block;
}


/*
   항목 간격을 최대한 붙입니다.
*/

.meeting-item {

  margin: 0 !important;

  padding: 0 !important;

  border: 0 !important;

  white-space: pre-wrap;

  word-break: break-word;

  font-size: 14px;

  color: #36403c;

  line-height: 1.35;

  text-align: left !important;
}


/* 마지막 줄도 동일 */

.meeting-item:last-child {

  margin: 0 !important;

  padding: 0 !important;

}


/* 안건 / 회의 내용 */

.section-title {

  display: block;

  margin: 8px 0 0 0 !important;

  padding: 0 !important;

  font-size: 15px;

  font-weight: 900;

  color: #286b5b;

  line-height: 1.35;

  text-align: left !important;
}


/*
   안건/회의내용 바로 다음 내용
*/

.section-content {

  display: block;

  margin: 0 !important;

  padding: 0 !important;

  white-space: pre-wrap;

  word-break: break-word;

  text-align: left !important;
}


/* =========================================================
   빈 화면 / 오류
========================================================= */

.empty {

  background: white;

  border: 1px solid #dce4e0;

  border-radius: 14px;

  padding: 22px 16px;

  color: #6d7873;

  text-align: left !important;
}


.error {

  color: #b33a3a;

  text-align: left !important;
}


/* =========================================================
   위로가기
========================================================= */

.top-button {

  position: fixed;

  right: 16px;

  bottom: 18px;

  width: 45px;

  height: 45px;

  border: 0;

  border-radius: 50%;

  background: #286b5b;

  color: white;

  font-size: 19px;

  box-shadow: 0 4px 14px rgba(0,0,0,.18);

  display: none;

  cursor: pointer;
}


/* =========================================================
   어두운 화면
========================================================= */

body.dark {

  background: #121715;

  color: #edf3f0;
}


body.dark header {

  background: rgba(25,31,28,.97);

  border-color: #303a36;
}


body.dark .page-title {
  color: #f0f5f2;
}


body.dark .page-subtitle {
  color: #9ba7a1;
}


body.dark .back,
body.dark .settings-button {

  background: #26332e;

  color: #8fd0b9;
}


body.dark .search {

  background: #1c2421;

  color: #edf3f0;

  border-color: #394640;
}


body.dark .card {

  background: #1a211e;

  border-color: #35403b;
}


body.dark .card-title {
  color: #eef3f0;
}


body.dark .card-preview {
  color: #a9b4af;
}


body.dark .date-box {

  background: #24352e;

  color: #91d0bb;
}


body.dark .card-content {

  border-color: #303a36;
}


body.dark .meeting-item {

  color: #d7e0dc;
}


body.dark .section-title {

  color: #91d0bb;
}


body.dark .section-content {

  color: #d7e0dc;
}


body.dark .status {
  color: #a9b4af;
}


body.dark .settings-panel {

  background: #1a211e;

  border-color: #35403b;

  color: #edf3f0;
}


body.dark .settings-row button,
body.dark .font-size-row button {

  background: #26332e;

  color: #91d0bb;
}


/* =========================================================
   PC
========================================================= */

@media (min-width:700px) {

  main {

    padding-left: 20px;

    padding-right: 20px;
  }

  .card-head {

    padding: 15px 17px;
  }

  .card-content {

    padding: 14px 18px 18px;
  }

}


/* =========================================================
   휴대폰
========================================================= */

@media (max-width:600px) {

  .page-title {
    font-size: 19px;
  }

  .toolbar {
    gap: 6px;
  }

  .settings-panel {
    right: 10px;
  }

}


</style>

</head>


<body>


<!-- =======================================================
     상단
======================================================= -->

<header>

  <div class="header-inner">


    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">
      ‹
    </button>


    <div class="title-area">

      <div class="page-title">
        회의록
      </div>

      <div class="page-subtitle">
        서울북부회중 회의 기록 · 2026
      </div>

    </div>


    <button
      class="settings-button"
      onclick="toggleSettings()"
      aria-label="설정">
      ⚙️
    </button>


    <!-- 설정 -->

    <div
      id="settingsPanel"
      class="settings-panel">


      <div class="settings-title">
        설정
      </div>


      <div class="settings-row">

        <button
          id="lightButton"
          onclick="setTheme('light')">
          ☀️ 밝게
        </button>


        <button
          id="darkButton"
          onclick="setTheme('dark')">
          🌙 어둡게
        </button>

      </div>


      <div class="font-size-row">

        <button
          onclick="changeFontSize(-5)">
          −
        </button>


        <div
          id="fontSizeValue"
          class="font-size-value">
          100%
        </div>


        <button
          onclick="changeFontSize(5)">
          ＋
        </button>

      </div>


    </div>


  </div>

</header>


<!-- =======================================================
     본문
======================================================= -->

<main>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">

  </div>


  <div
    id="status"
    class="status">
    회의록을 불러오는 중입니다...
  </div>


  <div id="list"></div>


</main>


<!-- =======================================================
     위로가기
======================================================= -->

<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({
    top:0,
    behavior:'smooth'
  })">

  ↑

</button>


<script>


/* =========================================================
   Apps Script 주소
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbysgotaoVEulLRZPFh9BXMKiRvbi9FTUvC4qk3R9P4xbJSyydBf0EaekH3D471kRkkY/exec";


let meetings = [];


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    applySettings();

    loadData();

  }
);


/* =========================================================
   데이터 불러오기
========================================================= */

async function loadData() {

  const status =
    document.getElementById("status");


  status.textContent =
    "회의록을 불러오는 중입니다...";


  try {


    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "서버 응답 오류: " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "회의록 API:",
      data
    );


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        data?.error ||
        "데이터를 가져오지 못했습니다."
      );

    }


    let rows = [];


    if (Array.isArray(data.rows)) {

      rows = data.rows;

    }

    else if (Array.isArray(data.meetings)) {

      rows = data.meetings;

    }

    else if (Array.isArray(data.records)) {

      rows = data.records;

    }

    else if (Array.isArray(data.data)) {

      rows = data.data;

    }

    else if (Array.isArray(data.values)) {

      rows = data.values;

    }


    if (
      rows.length === 0 &&
      Array.isArray(data)
    ) {

      rows = data;

    }


    meetings =
      normalizeRows(rows);


    if (meetings.length === 0) {

      throw new Error(
        "번호가 있는 회의록 자료를 찾지 못했습니다."
      );

    }


    render();


  }

  catch (error) {


    console.error(
      "회의록 데이터 로드 오류:",
      error
    );


    status.textContent =
      "자료를 가져오지 못했습니다.";


    document.getElementById(
      "list"
    ).innerHTML = `

      <div class="empty error">

        ❌ 자료를 가져오지 못했습니다.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}


/* =========================================================
   행 하나를 데이터로 변환
========================================================= */

function rowToObject(row) {


  /* 배열 */

  if (Array.isArray(row)) {

    return {

      number:
        row[0] ?? "",

      title:
        row[1] ?? "",

      detail:
        row
          .slice(2)
          .filter(
            v => clean(v) !== ""
          )
          .join("\n")

    };

  }


  /* 객체 */

  if (
    row &&
    typeof row === "object"
  ) {


    const number =
      row.number ??
      row.no ??
      row.번호 ??
      row["번호"] ??
      row.id ??
      "";


    const title =
      row.title ??
      row.name ??
      row.제목 ??
      row["제목"] ??
      "";


    let detail =
      row.detail ??
      row.content ??
      row.text ??
      row.내용 ??
      row["내용"] ??
      "";


    /*
       내용 필드가 없을 경우
       나머지 값을 내용으로 사용
    */

    if (
      clean(detail) === ""
    ) {


      const ignored = [

        "number",
        "no",
        "번호",
        "id",
        "title",
        "name",
        "제목"

      ];


      detail =
        Object.keys(row)

          .filter(
            key =>
              !ignored.includes(key)
          )

          .map(
            key => row[key]
          )

          .filter(
            value =>
              clean(value) !== ""
          )

          .join("\n");

    }


    return {

      number,
      title,
      detail

    };

  }


  return {

    number: "",
    title: "",
    detail: ""

  };

}


/* =========================================================
   메인 번호
========================================================= */

function mainNumber(value) {

  const s =
    clean(value);


  const match =
    s.match(/^(\d+)/);


  return match
    ? match[1]
    : "";

}


/* =========================================================
   데이터 정리
========================================================= */

function normalizeRows(rows) {

  const result = [];


  rows.forEach(
    function(row, index) {


      const r =
        rowToObject(row);


      const number =
        clean(r.number);


      if (!number) {
        return;
      }


      const group =
        mainNumber(number);


      if (!group) {
        return;
      }


      result.push({

        number,

        group,

        title:
          clean(r.title),

        detail:
          clean(r.detail),

        index

      });

    }
  );


  return result;

}


/* =========================================================
   일반적인 회의록 제목인지 확인
========================================================= */

function isGenericTitle(text) {

  return /^회의록\s*\d+(?:[-.]\d+)?$/i
    .test(
      clean(text)
    );

}


/* =========================================================
   셀 번호 제거
========================================================= */

function removeCellNumber(text) {

  let s =
    clean(text);


  /*
     앞쪽 셀 번호 제거

     예:
     1 제목
     1-1 일시
     1.1 일시
  */

  s =
    s.replace(
      /^\s*\d+(?:[-.]\d+)*\s*/,
      ""
    );


  /*
     뒤쪽 셀 번호 제거

     예:
     제목 1
     제목 1-1
  */

  s =
    s.replace(
      /\s*\d+(?:[-.]\d+)*\s*$/,
      ""
    );


  return clean(s);

}


/* =========================================================
   화면용 제목
========================================================= */

function displayTitle(text) {

  return removeCellNumber(text);

}


/* =========================================================
   화면용 내용

   중요:
   날짜의 숫자는 삭제하지 않습니다.

   대신 해당 행의 실제 셀 번호가
   내용 앞에 붙은 경우만 삭제합니다.
========================================================= */

function displayDetail(
  text,
  number
) {


  let s =
    clean(text);


  const n =
    clean(number);


  if (!s) {
    return "";
  }


  if (n) {


    const escaped =
      n.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


    /*
       1-6
       1.6
       같은 실제 행 번호만
       내용 앞에서 제거
    */

    s =
      s.replace(
        new RegExp(
          "^\\s*" +
          escaped +
          "\\s*"
        ),
        ""
      );


    /*
       16처럼 붙어 오는 경우도 처리
    */

    const compact =
      n.replace(
        /[.-]/g,
        ""
      );


    if (
      compact &&
      compact !== n
    ) {


      const escapedCompact =
        compact.replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        );


      s =
        s.replace(
          new RegExp(
            "^\\s*" +
            escapedCompact +
            "\\s*"
          ),
          ""
        );

    }

  }


  /*
     불필요하게 여러 개 들어간
     빈 줄은 하나로 정리
  */

  s =
    s.replace(
      /\r\n/g,
      "\n"
    );


  s =
    s.replace(
      /\n[ \t]*\n+/g,
      "\n"
    );


  return clean(s);

}


/* =========================================================
   한 행의 일반적인 표시 내용
========================================================= */

function rowText(item) {


  const title =
    displayTitle(
      item.title
    );


  const detail =
    displayDetail(
      item.detail,
      item.number
    );


  if (
    title &&
    !isGenericTitle(title) &&
    detail
  ) {

    return (
      title +
      " " +
      detail
    );

  }


  if (
    title &&
    !isGenericTitle(title)
  ) {

    return title;

  }


  return detail;

}


/* =========================================================
   날짜
========================================================= */

function displayDate(
  text,
  number
) {


  let s =
    clean(text);


  const n =
    clean(number);


  if (!s) {
    return "";
  }


  /*
     날짜는 2026. 9. 3.
     처럼 숫자로 시작할 수 있으므로
     일반 숫자 제거를 하지 않습니다.
  */


  if (n) {


    const escaped =
      n.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


    s =
      s.replace(
        new RegExp(
          "^\\s*" +
          escaped +
          "\\s*"
        ),
        ""
      );

  }


  return clean(s);

}


/* =========================================================
   회의 여러 개로 묶기
========================================================= */

function buildMeetings(items) {

  const groups = {};


  items.forEach(
    function(item) {


      if (!groups[item.group]) {

        groups[item.group] = [];

      }


      groups[item.group].push(
        item
      );

    }
  );


  return Object.keys(groups)

    .sort(
      function(a,b) {

        return (
          Number(a) -
          Number(b)
        );

      }
    )


    .map(
      function(groupNumber) {


        const items =
          groups[groupNumber]
            .slice()
            .sort(
              function(a,b) {

                return (
                  a.index -
                  b.index
                );

              }
            );


        /*
           정확히 1번, 2번, 3번...
           행을 회의 제목으로 사용
        */

        const main =
          items.find(
            function(item) {

              return (
                item.number ===
                groupNumber
              );

            }
          )
          ||
          items[0];


        const subItems =
          items.filter(
            function(item) {

              return item !== main;

            }
          );


        /*
           일시 행 찾기
        */

        const dateItem =
          subItems.find(
            function(item) {


              const itemTitle =
                displayTitle(
                  item.title
                );


              return (

                item.number ===
                groupNumber + "-1"

                ||

                item.number ===
                groupNumber + ".1"

                ||

                itemTitle === "일시"

                ||

                itemTitle.includes("일시")

              );

            }
          );


        /*
           회의 제목
        */

        const title =
          displayTitle(
            main.title
          )
          ||
          rowText(main)
          ||
          (
            "회의 기록 " +
            groupNumber
          );


        /*
           날짜
        */

        const date =
          dateItem

          ?

          (
            displayDate(
              dateItem.detail,
              dateItem.number
            )
            ||

            displayDate(
              dateItem.title,
              dateItem.number
            )
          )

          :

          "";


        /*
           날짜 행은
           본문에서 제외
        */

        const details =
          subItems.filter(
            function(item) {

              return item !== dateItem;

            }
          );


        return {

          group:
            groupNumber,

          title,

          date,

          details,

          index:
            main.index

        };

      }
    );

}


/* =========================================================
   날짜 표시 HTML
========================================================= */

function makeDateHtml(date) {


  if (!date) {
    return "";
  }


  let text =
    clean(date);


  /*
     2026. 2. 21.
     2026-02-21
     2월 21일
     등을 최대한 간단하게 표시
  */


  let match =
    text.match(
      /(?:^|\s)(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/
    );


  if (match) {


    const month =
      Number(match[2]);


    const day =
      Number(match[3]);


    return `

      <div class="date-box">

        <div class="date-month">
          ${month}월
        </div>

        <div class="date-day">
          ${day}일
        </div>

      </div>

    `;

  }


  /*
     2월 21일 형태
  */

  match =
    text.match(
      /(\d{1,2})월\s*(\d{1,2})일/
    );


  if (match) {


    const month =
      Number(match[1]);


    const day =
      Number(match[2]);


    return `

      <div class="date-box">

        <div class="date-month">
          ${month}월
        </div>

        <div class="date-day">
          ${day}일
        </div>

      </div>

    `;

  }


  /*
     날짜 형식을 찾지 못하면
     원래 날짜를 그대로 표시
  */

  return `

    <div class="date-box">

      <div class="date-month">
        ${escapeHtml(text)}
      </div>

    </div>

  `;

}


/* =========================================================
   화면 출력
========================================================= */

function render() {


  const search =
    document.getElementById(
      "search"
    );


  const query =
    clean(
      search.value
    ).toLowerCase();


  const allMeetings =
    buildMeetings(
      meetings
    );


  /*
     검색
  */

  const filtered =
    allMeetings.filter(
      function(meeting) {


        const searchable = [

          meeting.title,

          meeting.date,

          meeting.details
            .map(rowText)
            .join(" ")

        ]

          .join(" ")

          .toLowerCase();


        return (
          !query ||
          searchable.includes(query)
        );

      }
    );


  /*
     상태 표시
  */

  document.getElementById(
    "status"
  ).textContent =

    "총 " +
    filtered.length +
    "개 회의록 · 최신 시트 자료";


  const list =
    document.getElementById(
      "list"
    );


  /*
     자료 없음
  */

  if (
    filtered.length === 0
  ) {


    list.innerHTML = `

      <div class="empty">

        회의록이 없습니다.

      </div>

    `;


    return;

  }


  /*
     카드 생성
  */

  list.innerHTML =

    filtered

      .map(
        function(meeting) {


          /*
             회의 내용 만들기
          */

          const detailHtml =

            meeting.details.length

            ?

            meeting.details

              .map(
                function(item) {


                  const title =
                    displayTitle(
                      item.title
                    );


                  const detail =
                    displayDetail(
                      item.detail,
                      item.number
                    );


                  /*
                     빈 행
                  */

                  if (
                    !title &&
                    !detail
                  ) {

                    return "";

                  }


                  /*
                     안건
                  */

                  if (
                    title === "안건"
                  ) {


                    return `

                      <div class="meeting-item">

                        <span class="section-title">
                          안건
                        </span>

                        ${
                          detail
                            ? `
                              <div class="section-content">
                                ${escapeHtml(detail)}
                              </div>
                            `
                            : ""
                        }

                      </div>

                    `;

                  }


                  /*
                     회의 내용
                  */

                  if (
                    title === "회의 내용"
                  ) {


                    return `

                      <div class="meeting-item">

                        <span class="section-title">
                          회의 내용
                        </span>

                        ${
                          detail
                            ? `
                              <div class="section-content">
                                ${escapeHtml(detail)}
                              </div>
                            `
                            : ""
                        }

                      </div>

                    `;

                  }


                  /*
                     일반 항목
                  */

                  let text = "";


                  if (
                    title &&
                    detail
                  ) {

                    text =
                      title +
                      " " +
                      detail;

                  }

                  else {

                    text =
                      title ||
                      detail;

                  }


                  return `

                    <div class="meeting-item">

                      ${escapeHtml(text)}

                    </div>

                  `;

                }
              )

              .join("")


            :

            `

              <div class="meeting-item">

                회의 내용이 없습니다.

              </div>

            `;


          /*
             카드
          */

          return `

            <article class="card">


              <!-- 제목 -->

              <div
                class="card-head"
                onclick="toggleCard(this.parentElement)"
              >


                ${makeDateHtml(
                  meeting.date
                )}


                <div class="card-main">


                  <div class="card-title">

                    ${escapeHtml(
                      meeting.title
                    )}

                  </div>


                </div>


                <div class="chevron">

                  ⌄

                </div>


              </div>


              <!-- 상세 내용 -->

              <div class="card-content">

                ${detailHtml}

              </div>


            </article>

          `;

        }
      )

      .join("");

}


/* =========================================================
   카드 열기 / 닫기
========================================================= */

function toggleCard(card) {

  card.classList.toggle(
    "open"
  );

}


/* =========================================================
   HTML 문자 처리
========================================================= */

function escapeHtml(text) {

  return String(
    text ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   공백 정리
========================================================= */

function clean(value) {

  return String(
    value ?? ""
  )

    .replace(
      /\u00a0/g,
      " "
    )

    .trim();

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack() {


  if (
    window.history.length > 1
  ) {


    window.history.back();


  }

  else {


    window.location.href =
      "전시대관리자.html";

  }

}


/* =========================================================
   설정
========================================================= */

const SETTINGS_THEME_KEY =
  "회의록2026_theme";


const SETTINGS_FONT_KEY =
  "회의록2026_fontSize";


/* =========================================================
   설정 적용
========================================================= */

function applySettings() {


  const theme =
    localStorage.getItem(
      SETTINGS_THEME_KEY
    )
    ||
    "dark";


  const fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    )
    ||
    100;


  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );


  document.body.style.zoom =
    String(
      fontSize / 100
    );


  const fontValue =
    document.getElementById(
      "fontSizeValue"
    );


  if (fontValue) {

    fontValue.textContent =
      fontSize + "%";

  }

}


/* =========================================================
   밝게 / 어둡게
========================================================= */

function setTheme(theme) {


  localStorage.setItem(
    SETTINGS_THEME_KEY,
    theme
  );


  applySettings();

}


/* =========================================================
   글자 크기
========================================================= */

function changeFontSize(amount) {


  let fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    )
    ||
    100;


  fontSize += amount;


  if (
    fontSize < 80
  ) {

    fontSize = 80;

  }


  if (
    fontSize > 150
  ) {

    fontSize = 150;

  }


  localStorage.setItem(
    SETTINGS_FONT_KEY,
    fontSize
  );


  applySettings();

}


/* =========================================================
   설정 열기 / 닫기
========================================================= */

function toggleSettings() {


  document.getElementById(
    "settingsPanel"
  ).classList.toggle(
    "show"
  );

}


/* =========================================================
   설정 외부 클릭
========================================================= */

document.addEventListener(
  "click",
  function(event) {


    const panel =
      document.getElementById(
        "settingsPanel"
      );


    const button =
      document.querySelector(
        ".settings-button"
      );


    if (

      panel &&

      panel.classList.contains(
        "show"
      ) &&

      !panel.contains(
        event.target
      ) &&

      !button.contains(
        event.target
      )

    ) {


      panel.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   위로가기 버튼
========================================================= */

window.addEventListener(
  "scroll",
  function() {


    const button =
      document.getElementById(
        "topButton"
      );


    if (!button) {
      return;
    }


    button.style.display =

      window.scrollY > 500

        ? "block"

        : "none";

  }
);


</script>
