<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#286b5b">

<title>회의록 2026</title>

<style>

/* ============================================================
   기본
============================================================ */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  background:#f3f5f4;
  color:#26302d;

  font-size:15px;
  line-height:1.65;
}


/* ============================================================
   헤더
============================================================ */

header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,255,255,.96);

  backdrop-filter:blur(12px);

  border-bottom:1px solid #dce4e0;
}

.header-inner{
  max-width:900px;
  margin:auto;

  padding:10px 14px;

  display:flex;
  align-items:center;
  gap:10px;
}

.back{
  width:42px;
  height:42px;

  border:0;
  border-radius:12px;

  background:#edf3f0;
  color:#286b5b;

  font-size:25px;
  font-weight:bold;

  cursor:pointer;
}

.title-area{
  flex:1;
  min-width:0;
}

.page-title{
  font-size:21px;
  font-weight:800;
  letter-spacing:-0.04em;
}

.page-subtitle{
  margin-top:1px;
  font-size:11px;
  color:#7a8580;
}

.refresh{
  border:0;
  border-radius:10px;

  padding:9px 12px;

  background:#286b5b;
  color:white;

  font-size:12px;
  font-weight:700;

  cursor:pointer;
}


/* ============================================================
   본문
============================================================ */

main{
  max-width:900px;
  margin:auto;

  padding:14px 12px 80px;
}


/* ============================================================
   검색
============================================================ */

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.search{
  flex:1;
  min-width:0;

  height:42px;

  padding:0 13px;

  border:1px solid #d7e0dc;
  border-radius:11px;

  background:white;

  font-size:14px;
  outline:none;
}

.search:focus{
  border-color:#5d9889;
}

.select{
  width:85px;
  height:42px;

  padding:0 8px;

  border:1px solid #d7e0dc;
  border-radius:11px;

  background:white;

  font-size:13px;
}


/* ============================================================
   상태
============================================================ */

.status{
  margin:8px 2px 12px;

  font-size:12px;
  color:#74807b;
}


/* ============================================================
   로딩 / 오류
============================================================ */

.loading,
.empty,
.error{
  background:white;

  border:1px solid #dce4e0;
  border-radius:14px;

  padding:22px 16px;

  color:#6d7873;
}

.error{
  color:#a14d4d;
}


/* ============================================================
   월 제목
============================================================ */

.month-title{
  margin:22px 0 9px;
  padding-left:2px;

  font-size:14px;
  font-weight:800;

  color:#286b5b;
}


/* ============================================================
   카드
============================================================ */

.card{
  margin-bottom:10px;

  background:white;

  border:1px solid #d9e2de;
  border-radius:15px;

  overflow:hidden;

  box-shadow:
    0 2px 7px rgba(0,0,0,.035);
}


/* ============================================================
   카드 상단
============================================================ */

.card-head{
  padding:12px;

  display:flex;
  align-items:center;

  gap:12px;

  cursor:pointer;
  user-select:none;
}


/* ============================================================
   날짜
============================================================ */

.date-badge{
  width:52px;
  min-width:52px;
  height:52px;

  border-radius:11px;

  background:#edf5f2;
  color:#286b5b;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;
}

.badge-month{
  font-size:11px;
  font-weight:700;
  line-height:1.2;
}

.badge-day{
  margin-top:1px;

  font-size:19px;
  font-weight:850;

  line-height:1.15;
}


/* ============================================================
   제목
============================================================ */

.card-main{
  flex:1;
  min-width:0;
}

.card-title{
  font-size:15px;
  font-weight:800;

  color:#27312e;

  line-height:1.4;
  letter-spacing:-0.02em;

  word-break:keep-all;
}

.card-time{
  margin-top:3px;

  font-size:13px;
  color:#68756f;

  font-weight:600;
}


/* ============================================================
   화살표
============================================================ */

.chevron{
  width:20px;

  text-align:center;

  color:#74807b;
  font-size:15px;

  transition:transform .2s;
}

.card.open .chevron{
  transform:rotate(180deg);
}


/* ============================================================
   펼쳐지는 내용
============================================================ */

.card-content{
  display:none;

  border-top:1px solid #e6ece9;

  padding:13px 13px 20px;
}

.card.open .card-content{
  display:block;
}


/* ============================================================
   기본 정보
============================================================ */

.info-box{
  background:#f6f8f7;

  border-radius:11px;

  padding:8px 11px;

  margin-bottom:16px;
}

.info-row{
  display:grid;

  grid-template-columns:76px 1fr;

  gap:8px;

  padding:5px 0;

  font-size:13px;
}

.info-label{
  font-weight:800;
  color:#51605a;
}

.info-value{
  color:#303a36;
  word-break:break-word;
}


/* ============================================================
   강조 섹션 버튼
============================================================ */

.section-label{
  display:flex;
  align-items:center;

  width:100%;

  margin:18px 0 10px;

  padding:9px 13px;

  border-radius:10px;

  background:#e7f2ee;

  color:#286b5b;

  font-size:14px;
  font-weight:900;

  box-shadow:
    inset 0 0 0 1px rgba(40,107,91,.08);
}


/* 회의 내용 */

.section-label.content-label{
  background:#edf0f7;

  color:#4c607f;

  box-shadow:
    inset 0 0 0 1px rgba(76,96,127,.08);
}


/* ============================================================
   안건
============================================================ */

.bullet-list{
  margin:0 0 15px;
  padding:0;

  list-style:none;
}

.bullet-list li{
  position:relative;

  padding-left:18px;

  margin:9px 0;

  font-size:14px;

  color:#36403c;

  white-space:pre-wrap;
  word-break:break-word;
}

.bullet-list li::before{
  content:"";

  position:absolute;

  left:3px;
  top:.72em;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#3b8472;
}


/* ============================================================
   회의 내용
============================================================ */

.content-list{
  margin:0;
  padding:0;

  list-style:none;
}

.content-item{
  position:relative;

  padding-left:18px;

  margin-bottom:16px;
}

.content-item::before{
  content:"";

  position:absolute;

  left:3px;
  top:8px;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#607795;
}

.content-topic{
  margin-bottom:6px;

  font-size:14px;
  font-weight:800;

  color:#37414d;
}

.content-detail{
  font-size:14px;

  color:#46504c;

  white-space:pre-wrap;
  word-break:break-word;
}


/* ============================================================
   맨 위
============================================================ */

.top-button{
  position:fixed;

  right:16px;
  bottom:18px;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#286b5b;
  color:white;

  font-size:19px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.18);

  display:none;

  cursor:pointer;
}


/* ============================================================
   PC
============================================================ */

@media(min-width:700px){

  main{
    padding-left:20px;
    padding-right:20px;
  }

  .card-head{
    padding:15px 17px;
  }

  .card-content{
    padding:16px 18px 24px;
  }

}


/* ============================================================
   다크 모드
============================================================ */

body.dark{
  background:#121715;
  color:#edf3f0;
}

body.dark header{
  background:rgba(25,31,28,.97);
  border-color:#303a36;
}

body.dark .page-title{
  color:#f0f5f2;
}

body.dark .page-subtitle{
  color:#9ba7a1;
}

body.dark .back{
  background:#26332e;
  color:#8fd0b9;
}

body.dark .search,
body.dark .select{
  background:#1c2421;
  color:#edf3f0;
  border-color:#394640;
}

body.dark .card{
  background:#1a211e;
  border-color:#35403b;
}

body.dark .card-title{
  color:#eef3f0;
}

body.dark .card-time{
  color:#a9b4af;
}

body.dark .date-badge{
  background:#24352e;
  color:#91d0bb;
}

body.dark .card-content{
  border-color:#303a36;
}

body.dark .info-box{
  background:#222b27;
}

body.dark .info-label{
  color:#bdcbc5;
}

body.dark .info-value{
  color:#edf3f0;
}

body.dark .bullet-list li{
  color:#d7e0dc;
}

body.dark .content-topic{
  color:#dce5e9;
}

body.dark .content-detail{
  color:#c8d1cd;
}

body.dark .loading,
body.dark .empty,
body.dark .error{
  background:#1a211e;
  border-color:#35403b;
}

</style>
</head>


<body>


<header>

  <div class="header-inner">

    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">

      ‹

    </button>


    <div class="title-area">

      <div class="page-title">
        회의록
      </div>

      <div class="page-subtitle">
        서울북부회중 회의 기록
      </div>

    </div>


    <button
      class="refresh"
      onclick="loadMinutes()">

      새로고침

    </button>

  </div>

</header>


<main>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">


    <select
      id="year"
      class="select"
      onchange="render()">

      <option value="all">
        전체
      </option>

    </select>

  </div>


  <div
    id="status"
    class="status">

    회의록을 불러오는 중입니다.

  </div>


  <div
    id="list"
    class="loading">

    잠시만 기다려 주세요.

  </div>


</main>


<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>

/* ============================================================
   Google Apps Script 웹앱 주소
============================================================ */

const GAS_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxweQpbKaFVLVTIrqbDsrlekMv_2loBJMMQP0wX5UYYo-CewqXNmR2l3iDBidC8wHon/exec";


/* ============================================================
   Apps Script에서 받은 원본 데이터

   중요:
   변환하지 않음
   중복 제거하지 않음
   추가하지 않음

   json.meetings 그대로 저장
============================================================ */

let meetings = [];


/* ============================================================
   HTML 문자 보호
============================================================ */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* ============================================================
   날짜 배지

   Apps Script의 date:
   2026-08-04

   그대로 읽어서
   8월 / 4일 표시
============================================================ */

function getMonthDay(date){

  const match =
    String(date || "")
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);


  if(!match){

    return {
      month:"",
      day:""
    };

  }


  return {

    month:String(Number(match[2])),

    day:String(Number(match[3]))

  };

}


/* ============================================================
   월 제목
============================================================ */

function getMonthTitle(date){

  const match =
    String(date || "")
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);


  if(!match){

    return "기타";

  }


  return (

    Number(match[1]) +

    "년 " +

    Number(match[2]) +

    "월"

  );

}


/* ============================================================
   시간

   Apps Script datetime에서 시간만 표시
============================================================ */

function getTime(datetime){

  const match =
    String(datetime || "")
      .match(/(\d{1,2}):(\d{2})/);


  if(!match){

    return "";

  }


  let hour =
    Number(match[1]);


  const minute =
    match[2];


  const period =
    hour >= 12
      ? "오후"
      : "오전";


  hour =
    hour % 12;


  if(hour === 0){

    hour = 12;

  }


  return (

    period +

    " " +

    hour +

    ":" +

    minute

  );

}


/* ============================================================
   뒤로가기
============================================================ */

function goBack(){

  if(history.length > 1){

    history.back();

  }

  else{

    location.href = "index.html";

  }

}


/* ============================================================
   카드 열기
============================================================ */

function toggleCard(card){

  card.classList.toggle("open");

}


/* ============================================================
   정보 행
============================================================ */

function infoRow(label,value){

  if(

    value === undefined ||

    value === null ||

    String(value).trim() === "" ||

    String(value).trim() === "-"

  ){

    return "";

  }


  return `

    <div class="info-row">

      <div class="info-label">
        ${esc(label)}
      </div>

      <div class="info-value">
        ${esc(value)}
      </div>

    </div>

  `;

}


/* ============================================================
   안건

   Apps Script agenda 그대로 표시
============================================================ */

function renderAgenda(agenda){

  if(!Array.isArray(agenda)){

    return "";

  }


  const items =
    agenda.filter(
      item => String(item || "").trim()
    );


  if(items.length === 0){

    return "";

  }


  return `

    <div class="section-label">
      안건
    </div>

    <ul class="bullet-list">

      ${

        items.map(

          item => `

            <li>${esc(item)}</li>

          `

        ).join("")

      }

    </ul>

  `;

}


/* ============================================================
   회의 내용

   Apps Script content 그대로 표시
============================================================ */

function renderContent(content){

  if(!Array.isArray(content)){

    return "";

  }


  const items =
    content.filter(

      item =>

        String(item?.topic || "").trim() ||

        String(item?.detail || "").trim()

    );


  if(items.length === 0){

    return "";

  }


  return `

    <div class="section-label content-label">
      회의 내용
    </div>

    <div class="content-list">

      ${

        items.map(

          item => {

            const topic =
              String(item.topic || "").trim();


            const detail =
              String(item.detail || "").trim();


            /*
             Apps Script가
             topic = "회의 내용"
             으로 보내는 경우

             중복 제목처럼 보이지 않도록
             화면에서는 표시하지 않음
            */

            const showTopic =
              topic &&
              topic !== "회의 내용";


            return `

              <div class="content-item">

                ${

                  showTopic

                    ? `

                      <div class="content-topic">
                        ${esc(topic)}
                      </div>

                    `

                    : ""

                }


                ${

                  detail

                    ? `

                      <div class="content-detail">
                        ${esc(detail)}
                      </div>

                    `

                    : ""

                }

              </div>

            `;

          }

        ).join("")

      }

    </div>

  `;

}


/* ============================================================
   연도 선택
============================================================ */

function buildYears(){

  const select =
    document.getElementById("year");


  const current =
    select.value;


  const years =
    [

      ...new Set(

        meetings

          .map(

            meeting =>

              String(meeting.date || "")
                .slice(0,4)

          )

          .filter(Boolean)

      )

    ]

    .sort(
      (a,b) => Number(b) - Number(a)
    );


  select.innerHTML =
    '<option value="all">전체</option>';


  years.forEach(

    year => {

      select.innerHTML += `

        <option value="${esc(year)}">

          ${esc(year)}년

        </option>

      `;

    }

  );


  if(

    current === "all" ||

    years.includes(current)

  ){

    select.value = current;

  }

}


/* ============================================================
   화면 표시

   중요:
   meetings 배열을 새로 만들지 않음
   Apps Script의 json.meetings 그대로 사용
============================================================ */

function render(){


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const selectedYear =
    document
      .getElementById("year")
      .value;


  let data =
    meetings.filter(

      meeting => {


        const searchText =
          JSON.stringify(meeting)
            .toLowerCase();


        const matchSearch =

          !search ||

          searchText.includes(search);


        const matchYear =

          selectedYear === "all" ||

          String(meeting.date || "")
            .startsWith(selectedYear);


        return (

          matchSearch &&

          matchYear

        );

      }

    );


  /*
   화면 표시만 최신순 정렬

   데이터 개수는 변경하지 않음
  */

  data =
    [...data].sort(

      (a,b) =>

        String(b.date || "")
          .localeCompare(

            String(a.date || "")

          )

    );


  document
    .getElementById("status")
    .textContent =

      `총 ${data.length}건 · 최신 회의록이 먼저 표시됩니다.`;


  const list =
    document.getElementById("list");


  if(data.length === 0){

    list.innerHTML =
      '<div class="empty">회의록이 없습니다.</div>';

    return;

  }


  let previousMonth =
    "";


  list.innerHTML =

    data.map(

      function(meeting,index){


        const date =
          String(meeting.date || "");


        const monthDay =
          getMonthDay(date);


        const monthTitle =
          getMonthTitle(date);


        let monthHtml =
          "";


        if(previousMonth !== monthTitle){

          monthHtml = `

            <div class="month-title">

              ${esc(monthTitle)}

            </div>

          `;


          previousMonth =
            monthTitle;

        }


        const info =

          infoRow(
            "일시",
            meeting.datetime
          )

          +

          infoRow(
            "회의 장소",
            meeting.place
          )

          +

          infoRow(
            "참석자",
            meeting.attendees
          )

          +

          infoRow(
            "불참자",
            meeting.absentees
          )

          +

          infoRow(
            "시작 기도",
            meeting.startPrayer
          )

          +

          infoRow(
            "마치는 기도",
            meeting.endPrayer
          );


        const agendaHtml =
          renderAgenda(
            meeting.agenda
          );


        const contentHtml =
          renderContent(
            meeting.content
          );


        return `

          ${monthHtml}


          <article
            class="card"
            id="meeting-${index}">


            <div
              class="card-head"
              onclick="toggleCard(this.parentElement)">


              <div class="date-badge">

                <div class="badge-month">

                  ${esc(monthDay.month)}월

                </div>


                <div class="badge-day">

                  ${esc(monthDay.day)}일

                </div>

              </div>


              <div class="card-main">


                <div class="card-title">

                  ${esc(meeting.title)}

                </div>


                <div class="card-time">

                  ${esc(
                    getTime(
                      meeting.datetime
                    )
                  )}

                </div>


              </div>


              <div class="chevron">

                ⌄

              </div>


            </div>


            <div class="card-content">


              ${

                info

                  ? `

                    <div class="info-box">

                      ${info}

                    </div>

                  `

                  : ""

              }


              ${agendaHtml}


              ${contentHtml}


            </div>


          </article>

        `;

      }

    ).join("");

}


/* ============================================================
   Apps Script 데이터 불러오기

   중요:

   1. 단순 GET
   2. json.meetings 그대로 사용
   3. 중복 제거 없음
   4. normalize 없음
   5. 기존 데이터와 합치지 않음
============================================================ */

async function loadMinutes(){


  const list =
    document.getElementById("list");


  list.innerHTML =
    '<div class="loading">회의록을 불러오는 중입니다...</div>';


  document
    .getElementById("status")
    .textContent =
      "최신 데이터를 확인하는 중입니다.";


  try{


    const requestUrl =
      GAS_WEB_APP_URL +
      "?t=" +
      Date.now();


    const response =
      await fetch(requestUrl);


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const json =
      await response.json();


    if(json.success !== true){

      throw new Error(

        json.error ||

        "Apps Script 응답 오류"

      );

    }


    if(!Array.isArray(json.meetings)){

      throw new Error(
        "meetings 데이터가 배열이 아닙니다."
      );

    }


    /*
     ★ 핵심 ★

     Apps Script가 준 배열을
     그대로 대입

     예:
     count = 15
     meetings.length = 15

     → 화면도 15개
    */

    meetings =
      json.meetings;


    console.log(
      "Apps Script version:",
      json.version
    );


    console.log(
      "Apps Script count:",
      json.count
    );


    console.log(
      "실제 meetings.length:",
      meetings.length
    );


    /*
     count와 실제 배열 길이 확인
    */

    if(

      Number(json.count) !==
      meetings.length

    ){

      console.warn(
        "count와 배열 길이가 다릅니다.",
        json.count,
        meetings.length
      );

    }


    buildYears();


    render();


  }

  catch(error){


    console.error(
      "회의록 불러오기 오류:",
      error
    );


    meetings = [];


    list.innerHTML = `

      <div class="error">

        회의록을 불러오지 못했습니다.

        <br><br>

        ${esc(error.message)}

      </div>

    `;


    document
      .getElementById("status")
      .textContent =
        "불러오기 실패";

  }

}

   맨 위 버튼
============================================================ */

  "scroll",

    const button =
      document.getElementById("topButton");


    button.style.display =

      window.scrollY > 500

        ? "block"

        : "none";

  }

);

============================================================ */

loadMinutes();

</script>
