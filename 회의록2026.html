<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  http-equiv="Cache-Control"

<title>회의록</title>


<style>

/* ============================================================
   기본
   ============================================================ */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html{
  scroll-behavior:smooth;
}


body{

  margin:0;

  background:#f4f6f5;

  color:#202624;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  font-size:15px;

  line-height:1.6;

  text-align:left;

}


/* ============================================================
   상단
   ============================================================ */

header{

  position:sticky;

  top:0;

  z-index:100;

  background:
    rgba(255,255,255,.97);

  border-bottom:
    1px solid #dfe5e2;

}


.header-inner{

  max-width:900px;

  margin:auto;

  padding:10px 14px;

  display:flex;

  align-items:center;

  gap:10px;

}


.back{

  width:40px;

  height:40px;

  border:0;

  border-radius:10px;

  background:#edf3f0;

  color:#1f6f5b;

  font-size:25px;

  cursor:pointer;

}


.title-area{

  flex:1;

  min-width:0;

}


.title{

  font-size:20px;

  letter-spacing:-.04em;

}


.subtitle{

  margin-top:1px;

  color:#7a8580;

  border:0;

  border-radius:9px;

  background:#1f6f5b;

  color:white;

  padding:9px 12px;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

}


/* ============================================================
   본문
   ============================================================ */

main{

  max-width:900px;

  margin:auto;

  padding:14px 12px 80px;

}


/* ============================================================
   검색 영역
   ============================================================ */

.toolbar{

  display:flex;

  gap:8px;

  margin-bottom:10px;

}


.search{

  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid #dce4e0;

  border-radius:10px;

  padding:0 12px;

  background:white;

  color:#202624;

  font-size:14px;

  outline:none;

}


.select{

  width:82px;

  height:42px;

  border:
    1px solid #dce4e0;

  border-radius:10px;

  padding:0 8px;

  background:white;

  color:#202624;

  font-size:13px;

  outline:none;

}


/* ============================================================
   상태
   ============================================================ */

.status{

  margin:
    4px 2px 14px;

  color:#74807a;

  font-size:12px;

}


/* ============================================================
   월 제목
   ============================================================ */

.month-title{

  margin:
    22px 0 9px;

  padding-left:3px;

  color:#1f6f5b;

  font-size:15px;

  font-weight:800;

}


/* ============================================================
   카드
   ============================================================ */

.card{

  background:white;

  border:
    1px solid #dfe6e2;

  border-radius:14px;

  margin-bottom:10px;

  overflow:hidden;

  box-shadow:
    0 2px 8px rgba(0,0,0,.04);

}


/* ============================================================
   카드 상단
   ============================================================ */

.card-head{

  width:100%;

  border:0;

  background:white;

  padding:13px;

  display:flex;

  align-items:center;

  gap:12px;

  text-align:left;

  cursor:pointer;

}


/* ============================================================
   날짜 박스

   ┌──────┐
   │ 8월  │
   │ 4일  │
   └──────┘
   ============================================================ */

.date-box{

  width:54px;

  min-width:54px;

  height:58px;

  border-radius:10px;

  background:#edf5f1;

  color:#1f6f5b;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

}


.date-month{

  font-size:12px;

  font-weight:700;

  line-height:1.2;

}


.date-day{

  margin-top:2px;

  font-size:20px;

  font-weight:850;

  line-height:1.1;

}


/* ============================================================
   제목 영역
   ============================================================ */

.card-title-area{

  flex:1;

  min-width:0;

}


.meeting-title{

  font-size:15px;

  font-weight:800;

  color:#202624;

  line-height:1.45;

  word-break:keep-all;

}


.meeting-time{

  margin-top:3px;

  color:#718078;

  font-size:13px;

  font-weight:600;

}


/* ============================================================
   화살표
   ============================================================ */

.arrow{

  flex:none;

  color:#88938e;

  font-size:17px;

  transition:.2s;

}


.card.open .arrow{

  transform:rotate(180deg);

}


/* ============================================================
   펼쳐지는 내용
   ============================================================ */

.card-body{

  display:none;

  padding:0 14px 18px;

  border-top:
    1px solid #edf0ee;

}


.card.open .card-body{

  display:block;

}


/* ============================================================
   기본 정보
   ============================================================ */

.info-box{

  margin-top:14px;

  background:#f7f9f8;

  border-radius:10px;

  padding:8px 11px;

}


.info-row{

  display:grid;

  grid-template-columns:80px 1fr;

  gap:8px;

  padding:5px 0;

  font-size:13px;

}


.info-label{

  font-weight:800;

  color:#4d5a55;

}


.info-value{

  color:#27302c;

  word-break:break-word;

}


/* ============================================================
   섹션 제목
   ============================================================ */

.section-title{

  margin:
    20px 0 9px;

  padding-left:8px;

  border-left:
    4px solid #1f6f5b;

  color:#1f6f5b;

  font-size:15px;

  font-weight:900;

}


/* ============================================================
   원형 목록
   ============================================================ */

.bullet-list{

  margin:0;

  padding:0;

  list-style:none;

}


.bullet-item{

  position:relative;

  padding-left:16px;

  margin:8px 0;

  color:#333d38;

  font-size:14px;

  white-space:pre-wrap;

  word-break:break-word;

}


.bullet-item::before{

  content:"●";

  position:absolute;

  left:0;

  top:0;

  color:#1f6f5b;

  font-size:10px;

}


/* ============================================================
   내용 제목
   ============================================================ */

.content-topic{

  margin:
    13px 0 4px;

  font-size:14px;

  font-weight:800;

  color:#29342f;

}


.content-detail{

  white-space:pre-wrap;

  word-break:break-word;

  color:#424c47;

  font-size:14px;

}


/* ============================================================
   로딩 / 오류
   ============================================================ */

.message{

  background:white;

  border:
    1px solid #dfe6e2;

  border-radius:14px;

  padding:24px 16px;

  color:#707b75;

  text-align:left;

}


.error{

  color:#a24b4b;

}


/* ============================================================
   맨 위
   ============================================================ */

.top-button{

  position:fixed;

  right:16px;

  bottom:18px;

  width:44px;

  height:44px;

  border:0;

  border-radius:50%;

  background:#1f6f5b;

  color:white;

  font-size:18px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.18);

  display:none;

  cursor:pointer;

}


/* ============================================================
   모바일
   ============================================================ */

@media(max-width:500px){

  .meeting-title{

/* ============================================================
   다크 모드
   ============================================================ */

body.dark{

  background:#111615;

  color:#edf3f0;

}


body.dark header{

  background:
    rgba(24,29,27,.97);

  border-color:#303936;

}


body.dark .back{

  background:#26312d;

  color:#8ed0b8;

}


body.dark .search,
body.dark .select{

  background:#1b211f;

  border-color:#39433f;

}


body.dark .card{

  border-color:#343d39;

}


body.dark .card-head{

  background:#1a201e;

}


body.dark .meeting-title{

  color:#f0f5f2;

}


body.dark .date-box{

  background:#24352e;

  color:#8ed0b8;

}


body.dark .card-body{

  border-color:#303936;

}


body.dark .info-box{

  background:#202825;

}


body.dark .info-label{

  color:#d8e3de;

}


body.dark .info-value{

  color:#edf3f0;

}


body.dark .content-topic{

  color:#e1ebe6;

}


body.dark .content-detail{

  color:#c4cec9;

}

  color:#d0dad5;

}

  background:#1a201e;

  border-color:#343d39;

</style>

<body>


<header>

  <div class="header-inner">

    <button
      class="back"
      onclick="goBack()">

      ‹

    </button>


    <div class="title-area">

      <div class="title">
        회의록
      </div>

      <div class="subtitle">
        서울북부회중 회의 기록
      </div>

    </div>


    <button
      class="refresh"
      onclick="loadMinutes()">

      새로고침

    </button>

  </div>

</header>


<main>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="renderMeetings()">


    <select
      id="year"
      class="select"
      onchange="renderMeetings()">

      <option value="all">
        전체
      </option>

    </select>

  </div>


  <div
    id="status"
    class="status">

    회의록을 불러오는 중입니다.

  </div>


  <div
    id="list"
    class="message">

    잠시만 기다려 주세요.

  </div>


</main>


<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>


/* ============================================================
   Google Apps Script 주소
   ============================================================ */

const GAS_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxweQpbKaFVLVTIrqbDsrlekMv_2loBJMMQP0wX5UYYo-CewqXNmR2l3iDBidC8wHon/exec";


/* ============================================================
   회의록 데이터

   중요:
   다른 곳에서 데이터를 가져오지 않습니다.

   Apps Script의
   json.meetings만 사용합니다.
   ============================================================ */

let meetings = [];


/* ============================================================
   HTML 문자 보호
   ============================================================ */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   날짜 변환

   2026-08-04
   2026년 8월 4일

   모두 YYYY-MM-DD 형태로 사용
   ============================================================ */

function getDate(value){

  const text =
    String(value || "").trim();


  let match =
    text.match(
      /(\d{4})-(\d{1,2})-(\d{1,2})/
    );


  if(match){

    return (
      match[1] +
      "-" +
      String(match[2]).padStart(2,"0") +
      "-" +
      String(match[3]).padStart(2,"0")
    );

  }


  match =
    text.match(
      /(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/
    );


  if(match){

    return (
      match[1] +
      "-" +
      String(match[2]).padStart(2,"0") +
      "-" +
      String(match[3]).padStart(2,"0")
    );

  }


  return "";

}


/* ============================================================
   회의 날짜
   ============================================================ */

function meetingDate(meeting){

  return (
    getDate(meeting.date) ||
    getDate(meeting.datetime)
  );

}


/* ============================================================
   시간 표시

   2026년 8월 4일 21:20
   ↓
   오후 9:20
   ============================================================ */

function formatTime(datetime){

  const text =
    String(datetime || "").trim();


  let match =
    text.match(
      /(\d{1,2}):(\d{2})/
    );


  if(!match){

    return "";

  }


  let hour =
    Number(match[1]);


  const minute =
    match[2];


  if(hour === 0){

    return "오전 12:" + minute;

  }


  if(hour < 12){

    return "오전 " +
      hour +
      ":" +
      minute;

  }


  if(hour === 12){

    return "오후 12:" +
      minute;

  }


  return (
    "오후 " +
    (hour - 12) +
    ":" +
    minute
  );

}


/* ============================================================
   날짜에서 월 / 일
   ============================================================ */

function getMonthDay(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


  if(!match){

    return {
      month:"",
      day:""
    };

  }


  return {

    month:
      Number(match[2]),

    day:
      Number(match[3])

  };

}


/* ============================================================
   월 제목
   ============================================================ */

function getMonthTitle(date){

  const match =
    String(date || "")
      .match(
        /^(\d{4})-(\d{2})/
      );


  if(!match){

    return "기타";

  }


  return (
    match[1] +
    "년 " +
    Number(match[2]) +
    "월"
  );

}


/* ============================================================
   줄 배열
   ============================================================ */

function getLines(text){

  return String(text || "")
    .split(/\r?\n/)
    .map(function(line){

      return line.trim();

    })
    .filter(function(line){

      return line !== "";

    });

}


/* ============================================================
   중복 제거
   ============================================================ */

function uniqueLines(lines){

  const result = [];

  const seen = new Set();


  lines.forEach(function(line){

    const key =
      line.replace(/\s+/g," ").trim();


    if(!key){

      return;

    }


    if(!seen.has(key)){

      seen.add(key);

      result.push(line);

    }

  });


  return result;

}


/* ============================================================
   API의 빈 agenda를 보완

   현재 Google Docs 파싱 결과는 많은 경우:

   메타정보
   안건1
   안건2
   안건3
   안건1
   상세내용
   안건2
   상세내용

   구조입니다.

   처음 다시 반복되는 항목 전까지를 안건으로 판단합니다.
   ============================================================ */

function extractAgenda(lines){

  const result = [];


  for(let i=0; i<lines.length; i++){

    const current =
      lines[i]
        .replace(/\s+/g," ")
        .trim();


    const alreadyExists =
      result.some(function(item){

        return (
          item
            .replace(/\s+/g," ")
            .trim() === current
        );

      });


    if(alreadyExists){

      break;

    }


    result.push(lines[i]);

  }


  return result;

}


/* ============================================================
   회의 데이터 정리

   Apps Script 데이터를 수정하지 않고
   화면 표시용으로만 정리합니다.
   ============================================================ */

function normalizeMeeting(m){

  const date =
    meetingDate(m);


  let place =
    String(m.place || "").trim();


  let attendees =
    String(m.attendees || "").trim();


  let absentees =
    String(m.absentees || "").trim();


  let startPrayer =
    String(m.startPrayer || "").trim();


  let endPrayer =
    String(m.endPrayer || "").trim();


  const originalContent =
    Array.isArray(m.content)
      ? m.content
      : [];


  const agendaFromApi =
    Array.isArray(m.agenda)
      ? m.agenda
          .map(function(x){
            return String(x || "").trim();
          })
          .filter(Boolean)
      : [];


  /* ----------------------------------------------------------
     첫 번째 "회의 내용"에서
     기본 정보 추출
     ---------------------------------------------------------- */

  let mainDetail = "";


  if(originalContent.length){

    const first =
      originalContent[0] || {};


    mainDetail =
      String(first.detail || "");

  }


  let lines =
    getLines(mainDetail);


  /* 장소 */

  if(
    !place ||
    place === "회의 장소"
  ){

    if(
      lines[0] &&
      (
        lines[0].includes("회관") ||
        lines[0].includes("장소")
      )
    ){

      place = lines.shift();

    }

  }


  /* 참석자 */

  if(!attendees && lines[0]){

    if(
      lines[0].includes(",") ||
      lines[0].includes("형제") ||
      lines[0].includes("자매")
    ){

      attendees = lines.shift();

    }

  }


  /* 불참자 */

  if(lines[0]){

    if(
      lines[0].includes("위임") ||
      lines[0].includes("병가") ||
      lines[0].includes("지방") ||
      lines[0].includes("강연")
    ){

      if(!absentees){

        absentees = lines.shift();

      }

    }

  }


  /* 시작 기도 */

  if(
    !startPrayer &&
    lines[0]
  ){

    if(
      lines[0] !== "-" &&
      lines[0].includes("형제") &&
      !lines[0].includes("마치는 기도")
    ){

      startPrayer = lines.shift();

    }

  }


  /* "-" 제거 */

  while(
    lines.length &&
    lines[0] === "-"
  ){

    lines.shift();

  }


  /* 마치는 기도 */

  const endIndex =
    lines.findIndex(function(line){

      return (
        line === "마치는 기도" ||
        line.includes("마치는 기도")
      );

    });


  if(endIndex >= 0){

    lines.splice(endIndex,1);


    if(lines[endIndex]){

      if(
        !endPrayer &&
        lines[endIndex] !== "-"
      ){

        endPrayer =
          lines[endIndex];

      }


      lines.splice(endIndex,1);

    }

  }


  /* 다시 "-" 제거 */

  while(
    lines.length &&
    lines[0] === "-"
  ){

    lines.shift();

  }


  /* ----------------------------------------------------------
     안건
     ---------------------------------------------------------- */

  let agenda =
    agendaFromApi;


  let bodyLines =
    [...lines];


  if(
    agenda.length === 0 &&
    lines.length
  ){

    agenda =
      extractAgenda(lines);


    if(agenda.length){

      bodyLines =
        lines.slice(
          agenda.length
        );

    }

  }


  agenda =
    uniqueLines(
      agenda
    );


  /* ----------------------------------------------------------
     회의 내용

     원본 content의 여러 topic도 유지
     ---------------------------------------------------------- */

  const bodyItems = [];


  if(bodyLines.length){

    bodyItems.push({

      topic:"",
      detail:
        bodyLines.join("\n")

    });

  }


  originalContent
    .slice(1)
    .forEach(function(item){

      const topic =
        String(
          item.topic || ""
        ).trim();


      const detail =
        String(
          item.detail || ""
        ).trim();


      if(topic || detail){

        bodyItems.push({
          topic:topic,
          detail:detail
        });

      }

    });


  /* 첫 번째 content가 일반 제목인 경우 */

  if(
    originalContent.length === 1 &&
    !bodyItems.length
  ){

    const item =
      originalContent[0];


    if(item){

      bodyItems.push({

        topic:
          String(item.topic || "").trim(),

        detail:
          String(item.detail || "").trim()

      });

    }

  }


  return {

    ...m,

    _date:date,

    _place:place,

    _attendees:attendees,

    _absentees:absentees,

    _startPrayer:startPrayer,

    _endPrayer:endPrayer,

    _agenda:agenda,

    _bodyItems:bodyItems

  };

}


/* ============================================================
   연도 선택 생성
   ============================================================ */

function buildYears(){

  const select =
    document.getElementById("year");


  const oldValue =
    select.value;


  const years =
    [...new Set(

      meetings
        .map(function(m){

          return (
            m._date
              ? m._date.slice(0,4)
              : ""
          );

        })

    )]
    .filter(Boolean)
    .sort(function(a,b){

      return Number(b) - Number(a);

    });


  select.innerHTML =
    '<option value="all">전체</option>';


  years.forEach(function(year){

    const option =
      document.createElement("option");


    option.value =
      year;


    option.textContent =
      year + "년";


    select.appendChild(option);

  });


  if(years.includes(oldValue)){

    select.value =
      oldValue;

  }

}


/* ============================================================
   정보 행
   ============================================================ */

function infoRow(label,value){

  const text =
    String(value || "").trim();


  if(!text){

    return "";

  }


  return `

    <div class="info-row">

      <div class="info-label">
        ${esc(label)}
      </div>

      <div class="info-value">
        ${esc(text)}
      </div>

    </div>

  `;

}


/* ============================================================
   카드 열기
   ============================================================ */

function toggleCard(card){

  card.classList.toggle("open");

}


/* ============================================================
   화면 렌더링

   중요:
   meetings 배열에 있는 것만 표시합니다.
   다른 데이터는 절대로 추가하지 않습니다.
   ============================================================ */

function renderMeetings(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const selectedYear =
    document
      .getElementById("year")
      .value;


  let data =
    meetings.filter(function(m){

      const text =
        JSON.stringify(m)
          .toLowerCase();


      const searchMatch =
        !search ||
        text.includes(search);


      const yearMatch =
        selectedYear === "all" ||
        String(m._date || "")
          .startsWith(selectedYear);


      return (
        searchMatch &&
        yearMatch
      );

    });


  /* 최신 날짜 순 */

  data.sort(function(a,b){

    return (
      String(b._date || "")
        .localeCompare(
          String(a._date || "")
        )
    );

  });


  document
    .getElementById("status")
    .textContent =
      `총 ${data.length}건 · 최신 회의록이 먼저 표시됩니다.`;


  const list =
    document.getElementById("list");


  if(!data.length){

    list.innerHTML = `

      <div class="message">
        표시할 회의록이 없습니다.
      </div>

    `;

    return;

  }


  let previousMonth =
    "";


  list.innerHTML =
    data.map(function(m,index){

      const md =
        getMonthDay(m._date);


      const currentMonth =
        getMonthTitle(m._date);


      let monthHtml =
        "";


      if(
        currentMonth !== previousMonth
      ){

        monthHtml = `

          <div class="month-title">
            ${esc(currentMonth)}
          </div>

        `;


        previousMonth =
          currentMonth;

      }


      /* ------------------------------------------------------
         기본 정보
         ------------------------------------------------------ */

      const info =

        infoRow(
          "일시",
          m.datetime
        ) +

        infoRow(
          "회의 장소",
          m._place
        ) +

        infoRow(
          "참석자",
          m._attendees
        ) +

        infoRow(
          "불참자",
          m._absentees
        ) +

        infoRow(
          "시작 기도",
          m._startPrayer
        ) +

        infoRow(
          "마치는 기도",
          m._endPrayer
        );


      /* ------------------------------------------------------
         안건
         ------------------------------------------------------ */

      const agendaHtml =
        m._agenda.length

          ? `

            <div class="section-title">
              안건
            </div>

            <ul class="bullet-list">

              ${m._agenda.map(function(item){

                return `

                  <li class="bullet-item">
                    ${esc(item)}
                  </li>

                `;

              }).join("")}

            </ul>

          `

          : "";


      /* ------------------------------------------------------
         회의 내용
         ------------------------------------------------------ */

      const contentHtml =
        m._bodyItems.length

          ? `

            <div class="section-title">
              회의 내용
            </div>

            <ul class="bullet-list">

              ${m._bodyItems.map(function(item){

                const topic =
                  String(item.topic || "").trim();


                const detail =
                  String(item.detail || "").trim();


                let text =
                  "";


                if(topic){

                  text +=
                    `<div class="content-topic">
                      ${esc(topic)}
                    </div>`;

                }


                if(detail){

                  text +=
                    `<div class="content-detail">
                      ${esc(detail)}
                    </div>`;

                }


                return `

                  <li class="bullet-item">
                    ${text}
                  </li>

                `;

              }).join("")}

            </ul>

          `

          : "";


      return `

        ${monthHtml}


        <article
          class="card"
          id="meeting-${index}">


          <!-- ================================================
               카드 상단

               ┌──────┐   서울북부회중 임시장로모임
               │ 8월  │   오후 9:20
               │ 4일  │
               └──────┘
               ================================================ -->

          <button
            class="card-head"
            onclick="toggleCard(this.parentElement)">


            <div class="date-box">

              <div class="date-month">
                ${esc(md.month)}월
              </div>

              <div class="date-day">
                ${esc(md.day)}일
              </div>

            </div>


            <div class="card-title-area">

              <div class="meeting-title">
                ${esc(m.title)}
              </div>

              <div class="meeting-time">
                ${esc(formatTime(m.datetime))}
              </div>

            </div>


            <div class="arrow">
              ⌄
            </div>


          </button>


          <!-- ================================================
               상세 내용
               ================================================ -->

          <div class="card-body">


            ${

              info

                ? `

                  <div class="info-box">
                    ${info}
                  </div>

                `

                : ""

            }


            ${agendaHtml}


            ${contentHtml}


          </div>


        </article>

      `;

    }).join("");

}


/* ============================================================
   회의록 불러오기
   ============================================================ */

async function loadMinutes(){


  const list =
    document.getElementById("list");


  list.innerHTML = `

    <div class="message">
      구글 독스의 최신 회의록을 불러오는 중입니다…
    </div>

  `;


  document
    .getElementById("status")
    .textContent =
      "최신 데이터를 확인하는 중입니다…";


  try{


    /* --------------------------------------------------------
       캐시 방지
       -------------------------------------------------------- */

    const separator =
      GAS_WEB_APP_URL.includes("?")
        ? "&"
        : "?";


    const requestUrl =
      GAS_WEB_APP_URL +
      separator +
      "t=" +
      Date.now();


    /* --------------------------------------------------------
       API 요청
       -------------------------------------------------------- */

    const response =
      await fetch(
        requestUrl,
        {
          method:"GET"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const json =
      await response.json();


    if(!json.success){

      throw new Error(
        json.error ||
        "회의록 데이터를 가져오지 못했습니다."
      );

    }


    /* --------------------------------------------------------
       가장 중요

       기존 데이터와 합치지 않습니다.
       append 하지 않습니다.
       localStorage 사용하지 않습니다.

       Apps Script가 준 데이터로
       meetings 전체를 완전히 교체합니다.
       -------------------------------------------------------- */

    const rawMeetings =
      Array.isArray(json.meetings)
        ? json.meetings
        : [];


    meetings =
      rawMeetings.map(function(m){

        return normalizeMeeting(m);

      });


    /* --------------------------------------------------------
       콘솔 확인용

       현재 Apps Script가 15개라면
       반드시 여기에도 15가 표시됩니다.
       -------------------------------------------------------- */

    console.log(
      "Apps Script 원본:",
      rawMeetings.length
    );


    console.log(
      "화면 표시 데이터:",
      meetings.length
    );


    buildYears();


    renderMeetings();


  }

  catch(error){


    console.error(
      "회의록 로딩 오류:",
      error
    );


    list.innerHTML = `

      <div class="message error">

        회의록을 불러오지 못했습니다.

        <br><br>

        ${esc(error.message)}

      </div>

    `;


    document
      .getElementById("status")
      .textContent =
        "불러오기 실패";

  }

}
