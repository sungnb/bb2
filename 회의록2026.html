<!DOCTYPE html>

<head>

  name="viewport"

<meta name="theme-color" content="#286b5b">

<title>회의록 2026</title>


<style>

/* ============================================================
   기본 설정
============================================================ */

:root{
  --font-scale:1;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
  font-size:calc(16px * var(--font-scale));
}

body{

  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  color:#26302d;

  font-size:15px;

  line-height:1.65;

}


/* ============================================================
   상단 헤더
============================================================ */

header{

  position:sticky;

  top:0;

  z-index:100;

  background:
    rgba(255,255,255,.96);

    blur(12px);

  border-bottom:

}


.header-inner{

  max-width:900px;

  margin:auto;

  padding:10px 14px;

  display:flex;

  align-items:center;

  gap:10px;

}


.back{

  width:42px;

  border:0;

  border-radius:12px;

  background:#edf3f0;

  color:#286b5b;

  font-size:25px;

  font-weight:bold;

}


.title-area{

  flex:1;

  min-width:0;

}


.page-title{

  font-size:21px;

  font-weight:800;

  letter-spacing:-0.04em;

}


.page-subtitle{

}


.refresh{

  border:0;

  border-radius:10px;

  padding:9px 12px;

  background:#286b5b;

  color:white;

  font-size:12px;

}

   본문
============================================================ */

main{

  max-width:900px;

  margin:auto;

  padding:14px 12px 80px;

}


/* ============================================================
   검색 영역
============================================================ */

.toolbar{

  display:flex;

  gap:8px;

  margin-bottom:8px;

}


.search{

  flex:1;

  min-width:0;

  height:42px;

  padding:0 13px;

  border:
    1px solid #d7e0dc;

  border-radius:11px;

  background:white;

  font-size:14px;

  outline:none;

}


.search:focus{

  border-color:#5d9889;

}


.select{

  width:82px;

  height:42px;

  padding:0 8px;

  border:

  background:white;

}


/* ============================================================
   상태
============================================================ */

.status{

/* ============================================================
   로딩 / 오류
============================================================ */

/* ============================================================
   월 제목
============================================================ */

.month-title{

  margin:

  font-size:14px;

/* ============================================================
   회의록 카드
============================================================ */

.card{

  margin-bottom:10px;

    0 2px 7px rgba(0,0,0,.035);

/* ============================================================
   카드 헤더
============================================================ */

.card-head{

  padding:11px 12px;

  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  user-select:none;

}


/* ============================================================
   날짜 박스
============================================================ */

.date-badge{

  width:52px;

  min-width:52px;

  height:52px;

  border-radius:11px;

  background:#edf5f2;

  color:#286b5b;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

}


.badge-month{

  font-size:11px;

  font-weight:700;

  line-height:1.2;

}


.badge-day{

  margin-top:1px;

  font-size:19px;

  font-weight:850;

  line-height:1.15;

}


/* ============================================================
   오른쪽 제목
============================================================ */

.card-main{

  flex:1;

  min-width:0;

}


.card-title{

  font-size:15px;

  font-weight:800;

  color:#27312e;

  line-height:1.4;

  letter-spacing:-0.02em;

  word-break:keep-all;

}


.card-time{

  margin-top:3px;

  font-size:13px;

  color:#68756f;

  font-weight:600;

}


/* ============================================================
   화살표
============================================================ */

.chevron{

  width:20px;

  text-align:center;

  color:#74807b;

  font-size:15px;

  transition:transform .2s;

}


.card.open .chevron{

  transform:rotate(180deg);

}


/* ============================================================
   펼쳐지는 영역
============================================================ */

.card-content{

  display:none;

  border-top:
    1px solid #e6ece9;

  padding:13px 13px 18px;

}


.card.open .card-content{

  display:block;

}


/* ============================================================
   기본 정보
============================================================ */

.info-box{

  background:#f6f8f7;

  border-radius:11px;

  padding:8px 11px;

  margin-bottom:16px;

}


.info-row{

  display:grid;

  grid-template-columns:76px 1fr;

  gap:8px;

  padding:5px 0;

  font-size:13px;

}


.info-label{

  font-weight:800;

  color:#51605a;

}


.info-value{

  color:#303a36;

  word-break:break-word;

}


/* ============================================================
   섹션 제목 버튼 스타일
============================================================ */

.section-label{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  margin:18px 0 10px;

  padding:9px 14px;

  border-radius:10px;

  background:#e4f2ed;

  border:1px solid #d0e6de;

  color:#286b5b;

  font-size:14px;

  font-weight:900;

  letter-spacing:-0.02em;

  box-shadow:
    0 2px 5px rgba(40,107,91,.06);

}


/* 회의 내용 */

.section-label.content-label{

  background:#edf1f8;

  border-color:#dce4f0;

  color:#526782;

}


/* ============================================================
   안건 목록
============================================================ */

.bullet-list{

  margin:0 0 8px;

  padding:0;

  list-style:none;

}


.bullet-list li{

  position:relative;

  padding-left:22px;

  margin:11px 0;

  font-size:14px;

  color:#36403c;

  white-space:pre-wrap;

  word-break:break-word;

}


.bullet-list li::before{

  content:"";

  position:absolute;

  left:4px;

  top:.72em;

  width:8px;

  height:8px;

  border-radius:50%;

  background:#3b8472;

}


/* ============================================================
   회의 내용
============================================================ */

.content-list{

  margin:0;

  padding:0;

  list-style:none;

}


.content-item{

  position:relative;

  padding-left:22px;

  margin-bottom:13px;

}


.content-item::before{

  content:"";

  position:absolute;

  left:4px;

  top:9px;

  width:8px;

  height:8px;

  border-radius:50%;

  background:#607795;

}


.content-topic{

  margin-bottom:4px;

  font-size:14px;

  font-weight:850;

  color:#37414d;

  white-space:pre-wrap;

  word-break:break-word;

}


.content-detail{

  font-size:14px;

  color:#46504c;

  white-space:pre-wrap;

  word-break:break-word;

}


/* ============================================================
   맨 위 버튼
============================================================ */

.top-button{

  position:fixed;

  right:16px;

  bottom:18px;

  width:45px;

  height:45px;

  border:0;

  border-radius:50%;

  background:#286b5b;

  color:white;

  font-size:19px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.18);

/* ============================================================
   PC
============================================================ */

@media(min-width:700px){

  main{

  }

/* ============================================================
   다크 모드
============================================================ */

body.dark{

  background:#121715;

  color:#edf3f0;

}


body.dark header{

  background:
    rgba(25,31,28,.97);

}

body.dark .page-subtitle{

}

}

}

}

body.dark .empty,
body.dark .error{

  background:#1a211e;

  border-color:#35403b;

</style>

</head>


<body>


<header>

  <div class="header-inner">

    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">

      ‹

    </button>


    <div class="title-area">

      <div class="page-title">
        회의록
      </div>

      <div class="page-subtitle">
        서울북부회중 회의 기록
      </div>

    </div>


    <button
      class="refresh"
      onclick="loadMinutes()">

      새로고침

    </button>

  </div>

</header>


<main>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">


    <select
      id="year"
      class="select"
      onchange="render()">

      <option value="all">
        전체
      </option>

    </select>

  </div>


  <div
    id="status"
    class="status">

    회의록을 불러오는 중입니다.

  </div>


  <div
    id="list"
    class="loading">

    잠시만 기다려 주세요.

  </div>


</main>


<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">

  ↑

</button>


<script>

/* ============================================================
   Google Apps Script
============================================================ */

const GAS_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxweQpbKaFVLVTIrqbDsrlekMv_2loBJMMQP0wX5UYYo-CewqXNmR2l3iDBidC8wHon/exec";


/* ============================================================
   데이터
============================================================ */

let meetings = [];


/* ============================================================
   메인 화면 설정 적용

   밝게 / 어둡게
   글자 크기
============================================================ */

function applySettings(){

  const theme =

    localStorage.getItem("theme") ||
    localStorage.getItem("darkMode") ||
    localStorage.getItem("appearance");


  if(

    theme === "dark" ||
    theme === "true" ||
    theme === "1"

  ){

    document.body.classList.add("dark");

  }

  else{

    document.body.classList.remove("dark");

  }


  const savedScale =

    localStorage.getItem("fontScale") ||
    localStorage.getItem("fontSizeScale") ||
    localStorage.getItem("textScale");


  if(savedScale){

    let scale = Number(savedScale);


    if(scale > 2){

      scale = scale / 100;

    }


    if(

      !isNaN(scale) &&
      scale >= 0.8 &&
      scale <= 1.5

    ){

      document.documentElement.style.setProperty(

        "--font-scale",

        scale

      );

    }

  }

}


applySettings();


window.addEventListener(

  "storage",

  function(){

    applySettings();

  }

);


/* ============================================================
   HTML 보호
============================================================ */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* ============================================================
   날짜
============================================================ */

function parseDate(value){

  const text =
    String(value || "").trim();


  let match =
    text.match(
      /(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/
    );


  if(!match){

    match =
      text.match(
        /(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/
      );

  }


  if(!match){

    return "";

  }


  return (

    match[1] +

    "-" +

    String(match[2]).padStart(2,"0") +

    "-" +

    String(match[3]).padStart(2,"0")

  );

}


function getMeetingDate(meeting){

  return (

    parseDate(meeting.date) ||

    parseDate(meeting.datetime)

  );

}


function getMonthDay(date){

  const match =
    String(date || "")
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);


  if(!match){

    return {
      month:"",
      day:""
    };

  }


  return {

    month:String(Number(match[2])),

    day:String(Number(match[3]))

  };

}


function getMonthTitle(date){

  const match =
    String(date || "")
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);


  if(!match){

    return "기타";

  }


  return (

    Number(match[1]) +

    "년 " +

    Number(match[2]) +

    "월"

  );

}


function formatDate(date){

  const match =
    String(date || "")
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);


  if(!match){

    return "";

  }


  return (

    Number(match[1]) +

    "년 " +

    Number(match[2]) +

    "월 " +

    Number(match[3]) +

    "일"

  );

}


/* ============================================================
   시간
============================================================ */

function getTime(datetime){

  const text =
    String(datetime || "").trim();


  const match =
    text.match(/(\d{1,2}):(\d{2})/);


  if(!match){

    return "";

  }


  let hour =
    Number(match[1]);


  const minute =
    match[2];


  const period =
    hour >= 12
      ? "오후"
      : "오전";


  let displayHour =
    hour % 12;


  if(displayHour === 0){

    displayHour = 12;

  }


  return (

    period +

    " " +

    displayHour +

    ":" +

    minute

  );

}


/* ============================================================
   연도
============================================================ */

function buildYears(){

  const select =
    document.getElementById("year");


  const current =
    select.value;


  const years =

    [

      ...new Set(

        meetings

          .map(
            meeting =>
              String(meeting._date || "").slice(0,4)
          )

          .filter(Boolean)

      )

    ]

    .sort(
      (a,b) => Number(b) - Number(a)
    );


  select.innerHTML =
    '<option value="all">전체</option>';


  years.forEach(

    year => {

      select.innerHTML +=

        '<option value="' +

        esc(year) +

        '">' +

        esc(year) +

        '년</option>';

    }

  );


  select.value =

    years.includes(current) ||
    current === "all"

      ? current

      : "all";

}


/* ============================================================
   뒤로가기
============================================================ */

function goBack(){

  if(history.length > 1){

    history.back();

  }

  else{

    location.href =
      "index.html";

  }

}


/* ============================================================
   카드
============================================================ */

function toggleCard(card){

  card.classList.toggle("open");

}


/* ============================================================
   기본 정보
============================================================ */

function infoRow(label,value){

  if(

    value === undefined ||
    value === null ||
    String(value).trim() === ""

  ){

    return "";

  }


  return `

    <div class="info-row">

      <div class="info-label">
        ${esc(label)}
      </div>

      <div class="info-value">
        ${esc(value)}
      </div>

    </div>

  `;

}


/* ============================================================
   안건 분리

   Apps Script에서 배열 하나에
   여러 줄이 들어와도 각각의 줄을
   ● 하나씩 표시
============================================================ */

function splitAgendaItems(agenda){

  if(!Array.isArray(agenda)){

    return [];

  }


  const result = [];


  agenda.forEach(

    item => {

      String(item || "")

        .replace(/\r/g,"")

        .split("\n")

        .forEach(

          line => {

            const text =
              line
                .trim()
                .replace(/^[●•ㆍ\-]\s*/,"");


            if(text){

              result.push(text);

            }

          }

        );

    }

  );


  return result;

}


/* ============================================================
   안건 표시
============================================================ */

function renderAgenda(agenda){

  const items =
    splitAgendaItems(agenda);


  if(!items.length){

    return "";

  }


  return `

    <div class="section-label">
      안건
    </div>

    <ul class="bullet-list">

      ${

        items

          .map(

            item => `

              <li>
                ${esc(item)}
              </li>

            `

          )

          .join("")

      }

    </ul>

  `;

}


/* ============================================================
   회의 내용 분리

   원본 Google Docs의
   각 항목을 개별 ● 항목으로 표시

   줄바꿈 전체를 하나의 덩어리로
   표시하지 않음
============================================================ */

function splitContentItems(content){

  if(!Array.isArray(content)){

    return [];

  }


  const result = [];


  content.forEach(

    item => {


      const topic =
        String(item?.topic || "")
          .trim();


      const detail =
        String(item?.detail || "")
          .replace(/\r/g,"")
          .trim();


      /*
       topic이 실제 제목이고
       detail이 여러 줄이면
       각 줄을 하나의 회의 내용 항목으로 표시
      */

      if(detail){

        const lines =
          detail
            .split("\n")
            .map(line => line.trim())
            .filter(Boolean);


        lines.forEach(

          (line,index) => {


            const clean =
              line.replace(/^[●•ㆍ]\s*/,"");


            /*
             첫 번째 "회의 내용"이라는
             불필요한 제목은 제외
            */

            if(

              clean === "회의 내용"

            ){

              return;

            }


            result.push({

              topic:

                index === 0 &&

                topic &&
                topic !== "회의 내용"

                  ? topic

                  : "",

              detail:clean

            });

          }

        );

      }

      else if(

        topic &&
        topic !== "회의 내용"

      ){

        result.push({

          topic:"",
          detail:topic

        });

      }

    }

  );


  return result;

}


/* ============================================================
   회의 내용 표시
============================================================ */

function renderContent(content){

  const items =
    splitContentItems(content);


  if(!items.length){

    return "";

  }


  return `

    <div class="section-label content-label">
      회의 내용
    </div>

    <div class="content-list">

      ${

        items

          .map(

            item => `

              <div class="content-item">

                ${

                  item.topic

                    ? `

                      <div class="content-topic">
                        ${esc(item.topic)}
                      </div>

                    `

                    : ""

                }

                <div class="content-detail">
                  ${esc(item.detail)}
                </div>

              </div>

            `

          )

          .join("")

      }

    </div>

  `;

}


/* ============================================================
   화면 표시
============================================================ */

function render(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const selectedYear =
    document
      .getElementById("year")
      .value;


  let data =

    meetings.filter(

      meeting => {


        const searchText =
          JSON.stringify(meeting)
            .toLowerCase();


        const matchSearch =

          !search ||

          searchText.includes(search);


        const matchYear =

          selectedYear === "all" ||

          meeting._date.startsWith(selectedYear);


        return (

          matchSearch &&
          matchYear

        );

      }

    );


  data.sort(

    (a,b) =>
      b._date.localeCompare(a._date)

  );


  document
    .getElementById("status")
    .textContent =

      `총 ${data.length}건 · 최신 회의록이 먼저 표시됩니다.`;


  const list =
    document.getElementById("list");


  if(!data.length){

    list.innerHTML =
      '<div class="empty">회의록이 없습니다.</div>';

    return;

  }


  let previousMonth = "";


  list.innerHTML =

    data

      .map(

        (meeting,index) => {


          const date =
            meeting._date;


          const monthDay =
            getMonthDay(date);


          const monthTitle =
            getMonthTitle(date);


          let monthHtml = "";


          if(previousMonth !== monthTitle){

            monthHtml = `

              <div class="month-title">
                ${esc(monthTitle)}
              </div>

            `;


            previousMonth =
              monthTitle;

          }


          const info =

            infoRow(
              "일시",
              meeting.datetime ||
              formatDate(date)
            )

            +

            infoRow(
              "회의 장소",
              meeting.place
            )

            +

            infoRow(
              "참석자",
              meeting.attendees
            )

            +

            infoRow(
              "불참자",
              meeting.absentees
            )

            +

            infoRow(
              "시작 기도",
              meeting.startPrayer
            )

            +

            infoRow(
              "마치는 기도",
              meeting.endPrayer
            );


          const agendaHtml =
            renderAgenda(
              meeting.agenda
            );


          const contentHtml =
            renderContent(
              meeting.content
            );


          return `

            ${monthHtml}


            <article
              class="card"
              id="meeting-${index}">


              <div
                class="card-head"
                onclick="toggleCard(this.parentElement)">


                <div class="date-badge">

                  <div class="badge-month">
                    ${esc(monthDay.month)}월
                  </div>

                  <div class="badge-day">
                    ${esc(monthDay.day)}일
                  </div>

                </div>


                <div class="card-main">

                  <div class="card-title">
                    ${esc(meeting.title)}
                  </div>

                  <div class="card-time">
                    ${esc(getTime(meeting.datetime))}
                  </div>

                </div>


                <div class="chevron">
                  ⌄
                </div>


              </div>


              <div class="card-content">


                ${

                  info

                    ? `

                      <div class="info-box">
                        ${info}
                      </div>

                    `

                    : ""

                }


                ${agendaHtml}


                ${contentHtml}


              </div>


            </article>

          `;

        }

      )

      .join("");

}


/* ============================================================
   회의록 불러오기
============================================================ */

async function loadMinutes(){


  const list =
    document.getElementById("list");


  list.innerHTML =
    '<div class="loading">회의록을 불러오는 중입니다...</div>';


  document
    .getElementById("status")
    .textContent =
      "최신 데이터를 확인하는 중입니다.";


  try{


    const separator =

      GAS_WEB_APP_URL.includes("?")

        ? "&"

        : "?";


    const requestUrl =

      GAS_WEB_APP_URL +

      separator +

      "t=" +

      Date.now();


    const response =
      await fetch(

        requestUrl,

        {
          method:"GET",
          redirect:"follow",
          cache:"no-store"
        }

      );


    if(!response.ok){

      throw new Error(

        "HTTP " +
        response.status

      );

    }


    const json =
      await response.json();


    if(!json.success){

      throw new Error(

        json.error ||
        "회의록 데이터를 가져오지 못했습니다."

      );

    }


    const rawMeetings =

      Array.isArray(json.meetings)

        ? json.meetings

        : [];


    /*
      Apps Script의 데이터를 그대로 사용

      날짜별 중복 제거 없음

      API count와 화면 수가 동일하도록 처리
    */

    meetings =

      rawMeetings

        .map(

          meeting => ({

            ...meeting,

            _date:
              getMeetingDate(meeting)

          })

        )

        .filter(

          meeting =>
            meeting._date

        );


    buildYears();


    render();


  }

  catch(error){


    console.error(
      "회의록 불러오기 오류:",
      error
    );


    list.innerHTML = `

      <div class="error">

        회의록을 불러오지 못했습니다.

        <br><br>

        ${esc(error.message)}

      </div>

    `;


    document
      .getElementById("status")
      .textContent =
        "불러오기 실패";

  }

}
