<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#286b5b">

<title>회의록 2026</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:#f3f5f4;
  color:#26302d;
  font-size:15px;
  line-height:1.65;
}


/* =========================================================
   상단
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #dce4e0;
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
}

.back,
.settings-button{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#edf3f0;
  color:#286b5b;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
}

.settings-button{
  font-size:20px;
}

.title-area{
  flex:1;
  min-width:0;
}

.page-title{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.04em;
}

.page-subtitle{
  margin-top:1px;
  font-size:11px;
  color:#7a8580;
}


/* =========================================================
   설정
========================================================= */

.settings-panel{
  display:none;
  position:absolute;
  right:14px;
  top:58px;
  width:220px;
  padding:14px;
  border-radius:14px;
  background:#fff;
  border:1px solid #d9e2de;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  z-index:200;
}

.settings-panel.show{
  display:block;
}

.settings-title{
  font-weight:800;
  margin-bottom:10px;
}

.settings-row{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.settings-row button,
.font-size-row button{
  border:0;
  border-radius:9px;
  padding:9px;
  background:#edf3f0;
  color:#286b5b;
  cursor:pointer;
}

.settings-row button{
  flex:1;
}

.font-size-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.font-size-row button{
  width:38px;
}

.font-size-value{
  flex:1;
  text-align:center;
}


/* =========================================================
   본문
========================================================= */

main{
  max-width:900px;
  margin:auto;
  padding:14px 12px 80px;
}

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.search{
  flex:1;
  min-width:0;
  height:42px;
  padding:0 13px;
  border:1px solid #d7e0dc;
  border-radius:11px;
  background:white;
  font-size:14px;
  outline:none;
}

.status{
  margin:8px 2px 12px;
  font-size:12px;
  color:#74807b;
}


/* =========================================================
   카드
========================================================= */

.meeting-group{
  margin:18px 0 14px;
}

.card{
  margin-bottom:10px;
  background:white;
  border:1px solid #d9e2de;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.035);
}

.card-head{
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  user-select:none;
}

.card-main{
  flex:1;
  min-width:0;
}

.card-title{
  font-size:18px;
  font-weight:900;
  color:#27312e;
  line-height:1.45;
  word-break:keep-all;
  letter-spacing:-.03em;
}


/*
   접힌 상태에서는 날짜와 일시를 표시하지 않습니다.
   제목만 표시합니다.
*/

.card-preview{
  display:none;
}

.chevron{
  width:20px;
  text-align:center;
  color:#74807b;
  font-size:15px;
  transition:transform .2s;
}

.card.open .chevron{
  transform:rotate(180deg);
}


/* =========================================================
   펼쳐진 내용
========================================================= */

.card-content{
  display:none;
  border-top:1px solid #e6ece9;
  padding:13px 13px 18px;
}

.card.open .card-content{
  display:block;
}


/* =========================================================
   펼쳤을 때 날짜
========================================================= */

.meeting-date{
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid #edf1ef;
}

.meeting-month{
  font-size:22px;
  font-weight:900;
  line-height:1.2;
  color:#286b5b;
}

.meeting-day{
  margin-top:1px;
  font-size:15px;
  font-weight:700;
  color:#68756f;
}


/* =========================================================
   회의 내용
========================================================= */

.meeting-item{
  padding:10px 0;
  border-bottom:1px solid #edf1ef;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
  color:#36403c;
}

.meeting-item:last-child{
  border-bottom:0;
}

.detail{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
  color:#36403c;
}


/* =========================================================
   빈 내용 / 오류
========================================================= */

.empty{
  background:white;
  border:1px solid #dce4e0;
  border-radius:14px;
  padding:22px 16px;
  color:#6d7873;
}

.error{
  color:#b33a3a;
}


/* =========================================================
   위로가기
========================================================= */

.top-button{
  position:fixed;
  right:16px;
  bottom:18px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#286b5b;
  color:white;
  font-size:19px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  display:none;
  cursor:pointer;
}


/* =========================================================
   어두운 화면
========================================================= */

body.dark{
  background:#121715;
  color:#edf3f0;
}

body.dark header{
  background:rgba(25,31,28,.97);
  border-color:#303a36;
}

body.dark .page-title{
  color:#f0f5f2;
}

body.dark .page-subtitle{
  color:#9ba7a1;
}

body.dark .back,
body.dark .settings-button{
  background:#26332e;
  color:#8fd0b9;
}

body.dark .search{
  background:#1c2421;
  color:#edf3f0;
  border-color:#394640;
}

body.dark .card{
  background:#1a211e;
  border-color:#35403b;
}

body.dark .card-title{
  color:#eef3f0;
}

body.dark .card-content{
  border-color:#303a36;
}

body.dark .meeting-date{
  border-color:#303a36;
}

body.dark .meeting-month{
  color:#91d0bb;
}

body.dark .meeting-day{
  color:#a9b4af;
}

body.dark .detail{
  color:#d7e0dc;
}

body.dark .status{
  color:#a9b4af;
}

body.dark .meeting-item{
  border-color:#303a36;
  color:#d7e0dc;
}

body.dark .settings-panel{
  background:#1a211e;
  border-color:#35403b;
  color:#edf3f0;
}

body.dark .settings-row button,
body.dark .font-size-row button{
  background:#26332e;
  color:#91d0bb;
}


/* =========================================================
   반응형
========================================================= */

@media(min-width:700px){

  main{
    padding-left:20px;
    padding-right:20px;
  }

  .card-head{
    padding:15px 17px;
  }

  .card-content{
    padding:16px 18px 22px;
  }

}

@media(max-width:600px){

  .page-title{
    font-size:19px;
  }

  .toolbar{
    gap:6px;
  }

  .settings-panel{
    right:10px;
  }

}

</style>
</head>


<body>


<header>

  <div class="header-inner">

    <button
      class="back"
      onclick="goBack()"
      aria-label="뒤로가기">
      ‹
    </button>


    <div class="title-area">

      <div class="page-title">
        회의록
      </div>

      <div class="page-subtitle">
        서울북부회중 회의 기록 · 2026
      </div>

    </div>


    <button
      class="settings-button"
      onclick="toggleSettings()"
      aria-label="설정">
      ⚙️
    </button>


    <div
      id="settingsPanel"
      class="settings-panel">

      <div class="settings-title">
        설정
      </div>


      <div class="settings-row">

        <button
          id="lightButton"
          onclick="setTheme('light')">
          ☀️ 밝게
        </button>

        <button
          id="darkButton"
          onclick="setTheme('dark')">
          🌙 어둡게
        </button>

      </div>


      <div class="font-size-row">

        <button
          onclick="changeFontSize(-5)">
          −
        </button>

        <div
          id="fontSizeValue"
          class="font-size-value">
          100%
        </div>

        <button
          onclick="changeFontSize(5)">
          ＋
        </button>

      </div>

    </div>

  </div>

</header>


<main>


  <div class="toolbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="회의록 검색..."
      oninput="render()">

  </div>


  <div
    id="status"
    class="status">
    회의록을 불러오는 중입니다...
  </div>


  <div id="list"></div>


</main>


<button
  id="topButton"
  class="top-button"
  onclick="window.scrollTo({top:0,behavior:'smooth'})">
  ↑
</button>


<script>


/* =========================================================
   Apps Script 주소
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbysgotaoVEulLRZPFh9BXMKiRvbi9FTUvC4qk3R9P4xbJSyydBf0EaekH3D471kRkkY/exec";


let meetings = [];


/* =========================================================
   시작
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    applySettings();

    loadData();

  }
);


/* =========================================================
   데이터 불러오기
========================================================= */

async function loadData(){

  const status =
    document.getElementById("status");


  status.textContent =
    "회의록을 불러오는 중입니다...";


  try{

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now()
      );


    if(!response.ok){

      throw new Error(
        "서버 응답 오류: " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "회의록 API:",
      data
    );


    if(
      !data ||
      data.success !== true
    ){

      throw new Error(
        data?.message ||
        data?.error ||
        "데이터를 가져오지 못했습니다."
      );

    }


    let rows = [];


    if(Array.isArray(data.meetings)){

      rows =
        data.meetings;

    }
    else if(Array.isArray(data.rows)){

      rows =
        data.rows;

    }
    else if(Array.isArray(data.records)){

      rows =
        data.records;

    }
    else if(Array.isArray(data.data)){

      rows =
        data.data;

    }
    else if(Array.isArray(data.values)){

      rows =
        data.values;

    }


    if(
      rows.length === 0 &&
      Array.isArray(data)
    ){

      rows = data;

    }


    meetings =
      normalizeRows(rows);


    if(meetings.length === 0){

      throw new Error(
        "번호가 있는 회의록 자료를 찾지 못했습니다."
      );

    }


    render();

  }


  catch(error){

    console.error(
      "회의록 데이터 로드 오류:",
      error
    );


    status.textContent =
      "자료를 가져오지 못했습니다.";


    document.getElementById(
      "list"
    ).innerHTML = `

      <div class="empty error">

        ❌ 자료를 가져오지 못했습니다.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}


/* =========================================================
   Apps Script 한 행을 정확히 읽기

   number = A열
   b      = B열
   c      = C열
   d      = D열
   e      = E열
   row    = 실제 행
========================================================= */

function rowToObject(row){

  if(Array.isArray(row)){

    return{

      number:
        row[0] ?? "",

      b:
        row[1] ?? "",

      c:
        row[2] ?? "",

      d:
        row[3] ?? "",

      e:
        row[4] ?? "",

      row:
        row[5] ?? ""

    };

  }


  if(
    row &&
    typeof row === "object"
  ){

    return{

      number:
        row.number ??
        row.no ??
        row.번호 ??
        row["번호"] ??
        "",

      b:
        row.b ??
        "",

      c:
        row.c ??
        "",

      d:
        row.d ??
        "",

      e:
        row.e ??
        "",

      row:
        row.row ??
        ""

    };

  }


  return{

    number:"",
    b:"",
    c:"",
    d:"",
    e:"",
    row:""

  };

}


/* =========================================================
   번호에서 회의 번호 추출

   1   → 1
   1-1 → 1
   1-8 → 1

   17  → 17
   17-8 → 17
========================================================= */

function mainNumber(value){

  const s =
    clean(value);


  const match =
    s.match(/^(\d+)/);


  return match
    ? match[1]
    : "";

}


/* =========================================================
   데이터 정리
========================================================= */

function normalizeRows(rows){

  const result = [];


  rows.forEach(
    function(row,index){

      const r =
        rowToObject(row);


      const number =
        clean(r.number);


      if(!number)
        return;


      const group =
        mainNumber(number);


      if(!group)
        return;


      result.push({

        number:
          number,

        group:
          group,

        b:
          clean(r.b),

        c:
          clean(r.c),

        d:
          clean(r.d),

        e:
          clean(r.e),

        row:
          r.row || "",

        index:
          index

      });

    }
  );


  return result;

}


/* =========================================================
   셀 번호 제거
========================================================= */

function removeCellNumber(text){

  let s =
    clean(text);


  s =
    s.replace(
      /^\s*\d+(?:[-.]\d+)*\s*/,
      ""
    );


  return clean(s);

}


/* =========================================================
   제목
========================================================= */

function displayTitle(text){

  return removeCellNumber(text);

}


/* =========================================================
   일반 내용
========================================================= */

function displayDetail(text){

  return clean(text);

}


/* =========================================================
   날짜 표시용

   2026. 9. 3.
   2026-9-3
   2026/9/3

   → 9월
   → 3일
========================================================= */

function getMonth(dateText){

  const text =
    String(dateText || "");


  const match =
    text.match(
      /(?:20\d{2})\s*[.\-/]\s*(\d{1,2})/
    );


  return match
    ? match[1] + "월"
    : "";

}


function getDay(dateText){

  const text =
    String(dateText || "");


  const match =
    text.match(
      /(?:20\d{2})\s*[.\-/]\s*\d{1,2}\s*[.\-/]\s*(\d{1,2})/
    );


  return match
    ? match[1] + "일"
    : "";

}


/* =========================================================
   날짜 전체 정리

   셀 번호가 날짜 앞에 붙어 있는 경우 제거
========================================================= */

function displayDate(text,number){

  let s =
    clean(text);


  const n =
    clean(number);


  if(!s)
    return "";


  if(n){

    const compact =
      n.replace(/[.-]/g,"");


    const escaped =
      n.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


    const escapedCompact =
      compact.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


    s =
      s.replace(
        new RegExp(
          "^\\s*" +
          escaped +
          "\\s*"
        ),
        ""
      );


    if(
      compact &&
      compact !== n
    ){

      s =
        s.replace(
          new RegExp(
            "^\\s*" +
            escapedCompact +
            "\\s*"
          ),
          ""
        );

    }

  }


  return clean(s);

}


/* =========================================================
   검색용 텍스트
========================================================= */

function rowText(item){

  return [

    item.b,
    item.c,
    item.d,
    item.e

  ]
    .filter(
      function(value){

        return clean(value) !== "";

      }
    )
    .join(" ");

}


/* =========================================================
   회의 1개로 묶기

   1
   1-1
   1-2
   ...
   1-8

   접힘:
   제목만

   펼침:
   날짜
   1-2 ~ 1-8
========================================================= */

function buildMeetings(items){

  const groups = {};


  items.forEach(
    function(item){

      if(!groups[item.group]){

        groups[item.group] = [];

      }


      groups[item.group].push(item);

    }
  );


  return Object.keys(groups)

    .sort(
      function(a,b){

        return Number(a) -
               Number(b);

      }
    )

    .map(
      function(groupNumber){

        const groupItems =
          groups[groupNumber]
            .slice()
            .sort(
              function(a,b){

                return a.index -
                       b.index;

              }
            );


        /* =================================================
           정확히 1번, 2번, 3번... 행
           → 회의 제목
        ================================================= */

        const main =
          groupItems.find(
            function(item){

              return (
                item.number ===
                groupNumber
              );

            }
          ) ||
          groupItems[0];


        /* =================================================
           정확히 1-1, 2-1... 행
           → 날짜
        ================================================= */

        const first =
          groupItems.find(
            function(item){

              return (
                item.number ===
                groupNumber + "-1"
              );

            }
          );


        const title =
          displayTitle(main.b) ||
          "회의 기록 " +
          groupNumber;


        /*
           1-1의 C열이 날짜입니다.
        */

        const date =
          first
            ? displayDate(
                first.c,
                first.number
              )
            : "";


        /*
           1-1은 펼친 내용에서도 제외합니다.

           따라서 펼치면
           1-2 ~ 1-8만 나옵니다.
        */

        const details =
          groupItems
            .filter(
              function(item){

                if(item === main)
                  return false;


                if(first && item === first)
                  return false;


                return true;

              }
            )
            .sort(
              function(a,b){

                return (
                  getSubNumber(a.number) -
                  getSubNumber(b.number)
                );

              }
            );


        return{

          group:
            groupNumber,

          title:
            title,

          date:
            date,

          details:
            details,

          index:
            main.index

        };

      }
    );

}


/* =========================================================
   하위 번호

   1-2 → 2
   1-8 → 8
========================================================= */

function getSubNumber(number){

  const s =
    clean(number);


  const match =
    s.match(
      /^\d+-(\d+)$/
    );


  if(match){

    return Number(
      match[1]
    );

  }


  return 999;

}


/* =========================================================
   화면 출력
========================================================= */

function render(){

  const query =
    clean(
      document.getElementById(
        "search"
      ).value
    ).toLowerCase();


  const allMeetings =
    buildMeetings(
      meetings
    );


  const filtered =
    allMeetings.filter(
      function(meeting){

        const detailText =
          meeting.details
            .map(
              function(item){

                return rowText(item);

              }
            )
            .join(" ");


        const searchable = [

          meeting.title,

          meeting.date,

          detailText

        ]
          .join(" ")
          .toLowerCase();


        return (
          !query ||
          searchable.includes(query)
        );

      }
    );


  document.getElementById(
    "status"
  ).textContent =
    "총 " +
    filtered.length +
    "개 회의록 · 최신 시트 자료";


  const list =
    document.getElementById(
      "list"
    );


  if(filtered.length === 0){

    list.innerHTML = `

      <div class="empty">

        회의록이 없습니다.

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(
        function(meeting){

          const detailHtml =
            meeting.details.length

              ? meeting.details

                  .map(
                    function(item){

                      const text =
                        rowText(item);


                      if(!text)
                        return "";


                      return `

                        <div class="meeting-item">

                          ${escapeHtml(text)}

                        </div>

                      `;

                    }
                  )
                  .join("")

              : `

                  <div class="meeting-item">

                    회의 내용이 없습니다.

                  </div>

                `;


          return `

            <article class="card">


              <!-- =======================================
                   접힌 상태
                   제목만 표시
              ======================================== -->

              <div
                class="card-head"
                onclick="toggleCard(this.parentElement)"
              >

                <div class="card-main">

                  <div class="card-title">

                    ${escapeHtml(
                      meeting.title
                    )}

                  </div>

                </div>


                <div class="chevron">
                  ⌄
                </div>

              </div>


              <!-- =======================================
                   펼친 상태
                   날짜 + 1-2 ~ 1-8
              ======================================== -->

              <div class="card-content">


                ${
                  meeting.date
                    ? `

                      <div class="meeting-date">

                        <div class="meeting-month">

                          ${escapeHtml(
                            getMonth(
                              meeting.date
                            )
                          )}

                        </div>


                        <div class="meeting-day">

                          ${escapeHtml(
                            getDay(
                              meeting.date
                            )
                          )}

                        </div>

                      </div>

                    `
                    : ""
                }


                ${detailHtml}


              </div>


            </article>

          `;

        }
      )
      .join("");

}


/* =========================================================
   카드 열기 / 닫기
========================================================= */

function toggleCard(card){

  card.classList.toggle(
    "open"
  );

}


/* =========================================================
   HTML 문자 처리
========================================================= */

function escapeHtml(text){

  return String(
    text ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   공백 정리
========================================================= */

function clean(value){

  return String(
    value ?? ""
  )

    .replace(
      /\u00a0/g,
      " "
    )

    .trim();

}


/* =========================================================
   뒤로가기
========================================================= */

function goBack(){

  if(
    window.history.length > 1
  ){

    window.history.back();

  }
  else{

    window.location.href =
      "전시대관리자.html";

  }

}


/* =========================================================
   설정
========================================================= */

const SETTINGS_THEME_KEY =
  "회의록2026_theme";


const SETTINGS_FONT_KEY =
  "회의록2026_fontSize";


function applySettings(){

  const theme =
    localStorage.getItem(
      SETTINGS_THEME_KEY
    ) || "dark";


  const fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    ) || 100;


  document.body.classList.toggle(
    "dark",
    theme === "dark"
  );


  document.body.style.zoom =
    String(
      fontSize / 100
    );


  document.getElementById(
    "fontSizeValue"
  ).textContent =
    fontSize + "%";

}


function setTheme(theme){

  localStorage.setItem(
    SETTINGS_THEME_KEY,
    theme
  );


  applySettings();

}


function changeFontSize(amount){

  let fontSize =
    Number(
      localStorage.getItem(
        SETTINGS_FONT_KEY
      )
    ) || 100;


  fontSize += amount;


  if(fontSize < 80){

    fontSize = 80;

  }


  if(fontSize > 150){

    fontSize = 150;

  }


  localStorage.setItem(
    SETTINGS_FONT_KEY,
    fontSize
  );


  applySettings();

}


function toggleSettings(){

  document.getElementById(
    "settingsPanel"
  ).classList.toggle(
    "show"
  );

}


/* =========================================================
   설정 바깥을 누르면 닫기
========================================================= */

document.addEventListener(
  "click",
  function(event){

    const panel =
      document.getElementById(
        "settingsPanel"
      );


    const button =
      document.querySelector(
        ".settings-button"
      );


    if(
      panel &&
      panel.classList.contains("show") &&
      !panel.contains(event.target) &&
      !button.contains(event.target)
    ){

      panel.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   위로가기
========================================================= */

window.addEventListener(
  "scroll",
  function(){

    document.getElementById(
      "topButton"
    ).style.display =

      window.scrollY > 500
        ? "block"
        : "none";

  }
);

</script>
